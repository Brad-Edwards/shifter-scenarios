    # Where the next renewal proposals stand / draft P1

    Mira Delmont, working draft for factual review. Not approved for publication.

    Twelve renewal options remain at the preparation stage.

    Twelve small renewal screens have reached management review. Their combined upfront replacement and access allowances are USD 15,660.00. These are screening estimates, not supplier quotations or approved capital spending. The programme has USD 0.00 released against these proposals and USD 0.00 of new spending recorded against them.

    For example, the Pine sample-bench comparison is USD 1,400.00 to retain over five years and USD 2,500.00 to replace and maintain. The Pine East notice-board comparison is USD 700.00 to retain and USD 605.00 to replace. A lower estimate does not remove the need to measure the mounting or confirm the scope. Other proposals retain the existing item while the relevant check is made.

    The board carried the conditional programme forward on September 15 by five votes to one. The September 30 follow-ups remain open. Long-life work needs separately approved funding; none of these papers changes a tariff, reserves additional water or authorizes a new operating setting. District allocation for any shared capital item will need a beneficiary assessment, not an automatic split.

    The opening sentence is a proposed headline and needs checking against the body. Retain this version with the review comments; corrections will be made in R1.
