  text: |
    # Learning time and the people who make it possible / draft P1

    Mira Delmont, working draft for factual review. Not approved for publication.

    Four completed sessions helped colleagues check ordinary work.

    Four small internal sessions completed between June 18 and September 8 covered receipt allocation, board-record handover, explaining bills and comparing renewal scopes. The attendance and preparation records total 1005 person-minutes, or 16.75 person-hours. This is a bounded learning record, not every training activity across ARWC.

    Participants worked through an example and checked a finished result. Attendance does not confer a new professional qualification or unrestricted authority to work alone. The sessions used ordinary working time; the records do not create extra supplier invoices or employee reimbursements. Individual task notes are kept privately.

    We thank those who taught, attended and covered ordinary work. Recognition does not require a speech or photograph. Future orientation proposals will include preparation time and continuing development, not assume that long-serving staff have chosen retirement dates. Those proposals are still to come; completing these four sessions does not settle the next group's arrangements.

    The opening sentence is a proposed headline and needs checking against the body. Retain this version with the review comments; corrections will be made in R1.
