    Reconcile the invoice-match ledger's credit to Accounts payable and its settlement debits by posted date. Supplier invoice PDFs and purchase orders identify the same obligations; do not sum them again. The purchasing register includes contractor visits already accepted by Engineering. Those are one visit and one invoice, not two acquisitions.

