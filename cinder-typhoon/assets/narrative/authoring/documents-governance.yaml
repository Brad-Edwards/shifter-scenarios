    # Pine depot instrument storage management paper

    Luc Venn-Morel for the general manager; source ARWC-PLN-26-19, issued September 8. District: PINE. An unallocated site requires a beneficiary assessment before funding allocation.

    Five-year retain allowance USD 800.00; replace allowance USD 865.00; replacement premium USD 65.00. Upfront replacement and access allowance USD 690.00; the rest is future upkeep, not a capital invoice. The instrument dimensions decide the useful storage space. An allowance without them is only a placeholder.

    Planning recommendation: Develop a storage specification and retain the existing service interval.

    Condition: Confirm the instrument dimensions and handling method. The September 30 source follow-up remains open. Finance proposes carrying this option in the screening programme with USD 0.00 released and USD 0.00 spent against this proposal. Prior maintenance orders retain their own status and cost; this option does not replace them.
