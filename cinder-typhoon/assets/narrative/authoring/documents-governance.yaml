  text: |
    # What the water-account figures cover / draft P1

    Mira Delmont, working draft for factual review. Not approved for publication.

    The book serves 50,100 households.

    ARWC's selected water-account book contains 50,100 payer accounts and 50,102 issued invoices. An account is not a person or a dwelling: some buildings share a master-metered account, and some premises have more than one supply meter. These figures must not be read as the population of Pine and River.

    The main household and master-metered bills cover April through June. The business and municipal comparison covers June; seasonal deliveries have their own dates. Adding the amounts does not create a measure of one month's water use. ARWC provides water service here; wastewater billing is separate.

    The statement shows the bill, credits and payments applied to the account. A payment allocation is the record of where a receipt went, not a second payment. An agreed future payment is not cash already received. Customers can use their normal contact route for an explanation or ask for a paper copy of this account of the figures. No customer-level ledger is published with this report. Existing tariffs and due dates are unchanged.

    The opening sentence is a proposed headline and needs checking against the body. Retain this version with the review comments; corrections will be made in R1.
