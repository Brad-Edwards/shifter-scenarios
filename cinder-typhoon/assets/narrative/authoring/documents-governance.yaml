    # August selected-books financial account / draft P1

    Mira Delmont, working draft for factual review. Not approved for publication.

    August selected-books cash and obligation controls are ready for reporting.

    At August 31, 2026, the selected purchasing and customer-account controls show collection-account cash USD 5,193,302.42, customer receivables USD 973,631.05, and supplier payables USD 28,460.84. Receipts awaiting invoices total USD 20,260.35; unreceived orders total USD 12,120.05. The last two figures are separate obligations under review, not additional cash spent.

    These are limited management accounts, not the company's complete balance sheet, profit or an audited bank statement. The cash bridge begins with a designated May 31 opening balance of USD 500,000.00 and follows dated customer receipts and supplier settlements. Payroll, other banking, depreciation and final inventory/expense classification are outside this selected close. Receipts are not described as current-month revenue.

    Pine and River local charges stay with the receiving district. Accepted regional shared-support purchases use 55% Pine and 45% River; equal ownership does not imply equal costs. Finance has asked for the remaining classification and external-bank comparisons. The board received the August controls on September 15 without representing those tasks as complete.

    The opening sentence is a proposed headline and needs checking against the body. Retain this version with the review comments; corrections will be made in R1.
