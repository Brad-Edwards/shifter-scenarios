  media_type: text/markdown
  text: |
    # How the September board decisions will be followed up / draft P1

    Mira Delmont, working draft for factual review. Not approved for publication.

    The board unanimously agreed the programme.

    The jointly appointed ARWC board met on September 15. Pine and River each have two appointed representatives, alongside two independent members. All six attended. Management presented the August selected-book controls and the conditional renewal programme. The board carried the renewal-and-reporting resolution by five votes to one; the dissent favoured moving the small notice-board quotation exercise forward sooner.

    Eight preliminary 2027 purchasing envelopes total USD 199,771.95, including a chosen 10% contingency on selected historical comparators. These are discussion proposals, not a complete annual operating budget, approved funding or a forecast of prices. Quantities and service consequences are still required. The board has not changed rates or authorized capital purchases through these papers.

    Elin Verrin, general manager, coordinates the next response. Luc Venn-Morel supplies operating recommendations; Finance checks the cost basis. Reporting staff issue the approved public account. September 30 follow-ups remain open. Rate proposals, if brought forward later, go through the district owners' public consideration process. The board is governing its company, not claiming provincial regulatory powers.

    The opening sentence is a proposed headline and needs checking against the body. Retain this version with the review comments; corrections will be made in R1.
  reader_keys:
  - awm164
  - rosa
  - awm216
  - awm217
  - luc
