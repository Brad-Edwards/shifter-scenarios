  story: finance
  text: |
    KeplerOps Software / Alterra Regional Water Company
    Enterprise licence schedule K-C-001-LIC-2026
    Accepted 2025-12-18; effective 2026-01-01 through 2026-12-31.
    Agreement reference: K-C-001-AGR-01. Account: K-C-001.
    Annual enterprise licence consideration: USD 360,000.00.
    Twelve monthly instalments: USD 30,000.00, issued on the first day of each month, due 30
    calendar days later. Currency USD. Indirect tax USD 0.00.
    FieldKest enterprise use for the customer's existing departments and sites, including ordinary
    product updates. Supported interfaces and service work remain governed by the separate service
    schedule. No plant-control functions or bespoke project capacity are granted.
    This schedule adds the separately agreed enterprise licence consideration; it does not replace
    or increase the annual service fee of the standing service schedule. Optional projects require
    their own accepted order. No automatic extension beyond 2026-12-31.
    Accepted for Alterra Regional Water Company: /s/ Priya Naravel, authorized account
    representative.
    Accepted for KeplerOps: /s/ Leah Calder-Voss, managing director.
    Both acceptances recorded 2025-12-18. Each party retains a copy.
