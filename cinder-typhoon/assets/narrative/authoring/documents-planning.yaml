    # Pine customer demand periods

    Discussion: 14 September, 09:00, Regional office planning room. Chair: Hana Radvell.

    **ARWC-PLN-26-01 — Pine: Single-account household demand**
    Does the line count mean the same thing as a household count?
    Paper: pl-arwc-pln-26-01-recommendation-r1.
    Outstanding check: A second quarter and an independently measured distribution input are needed before discussing seasonal growth or losses.

    **ARWC-PLN-26-02 — Pine: Master-metered dwelling demand**
    Could the building check meters have been counted a second time?
    Paper: pl-arwc-pln-26-02-recommendation-r1.
    Outstanding check: No per-household rate is issued until the dwelling denominator is reviewed.

    **ARWC-PLN-26-03 — Pine: Commercial demand reference**
    Can June be used to set a five-year growth percentage?
    Paper: pl-arwc-pln-26-03-recommendation-r1.
    Outstanding check: Do not annualize one production month into a promised volume.

    **ARWC-PLN-26-04 — Pine: Municipal service demand**
    Should the two districts receive equal quantities because they jointly own ARWC?
    Paper: pl-arwc-pln-26-04-recommendation-r1.
    Outstanding check: A budget allocation percentage must not replace measured district consumption.
