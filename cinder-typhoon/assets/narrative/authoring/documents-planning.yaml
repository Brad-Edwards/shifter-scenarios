    # Pine: Single-account household demand

    Reference: ARWC-PLN-26-01

    Peer review R1 — Hana Radvell, 7 September 2026. Source check: Amara Kelswick.

    **Question raised:** Does the line count mean the same thing as a household count?

    **Response:** No. Some premises have parallel supplies. Use billed volume for the daily comparator and keep the line count only as a reconciliation aid.

    **Calculation check:** The input return and units were compared with ARWC-PLN-26-01-v2.xlsx. Each displayed result below was recalculated.

    | Calculation cell | Measure | Result | Unit |
    | --- | --- | ---: | --- |
    | Calculation!B2 | Daily billed reference | 12458.75 | m³/day |
    | Calculation!B3 | Lower comparison | 11835.81 | m³/day |
    | Calculation!B4 | Upper comparison | 13704.63 | m³/day |

    **Revision disposition:** Hana requested the same 10% upper comparison across all eight customer-class returns; the 8% draft remains available.

    **Recommendation after review:** Use the daily billed comparator for neighbourhood information work. Request another complete quarter before estimating a trend.

    **Unresolved condition:** A second quarter and an independently measured distribution input are needed before discussing seasonal growth or losses.

    Owner of next check: Nadia Corvane. Review the condition by 30 September 2026. No completion is claimed for that future check.
