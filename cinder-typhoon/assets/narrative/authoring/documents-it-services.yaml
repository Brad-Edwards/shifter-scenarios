  employer: arwc
  title: Board and public copies
  published_at: '2026-06-05T12:00:00-04:00'
  audience: staff
  path: Information technology/knowledge/finance-20.md
  media_type: text/markdown
  text: '# Board and public copies


    Owner: Emre Edran. Reviewed 5 June 2026.


    An appointed-board annex has named readers. A public PDF needs a separate approved publication. Search previews
    and downloads obey the same audience.


    If the record itself is wrong, ask its business owner for a dated correction. Service desk can repair links,
    view settings and delivery faults; it cannot approve business facts or grant adjacent authority.

    '
