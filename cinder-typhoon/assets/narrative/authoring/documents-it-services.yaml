- id: it-knowledge-01
  story: arwc-it-services
  employer: arwc
  title: Find the current invitation
  published_at: '2026-06-05T12:00:00-04:00'
  audience: staff
  path: Information technology/knowledge/mail-01.md
  media_type: text/markdown
  text: '# Find the current invitation


    Owner: Omar Edran. Reviewed 5 June 2026.


    Open the full invitation and compare its UID and sequence. A revised mail does not make a second meeting. If
    the organiser cancelled it, use the cancellation rather than a cached preview.


    If the record itself is wrong, ask its business owner for a dated correction. Service desk can repair links,
    view settings and delivery faults; it cannot approve business facts or grant adjacent authority.

    '
- id: it-knowledge-02
  story: arwc-it-services
  employer: arwc
  title: Folder and calendar are different views
  published_at: '2026-06-05T12:00:00-04:00'
  audience: staff
  path: Information technology/knowledge/mail-02.md
  media_type: text/markdown
  text: '# Folder and calendar are different views


    Owner: Omar Edran. Reviewed 5 June 2026.


    Moving a message does not move the calendar occurrence. Search by organiser and date in Calendar; do not resend
    an invitation merely because its mail was filed.


    If the record itself is wrong, ask its business owner for a dated correction. Service desk can repair links,
    view settings and delivery faults; it cannot approve business facts or grant adjacent authority.

    '
- id: it-knowledge-03
  story: arwc-it-services
  employer: arwc
  title: Choose the approved record
  published_at: '2026-06-05T12:00:00-04:00'
  audience: staff
  path: Information technology/knowledge/library-03.md
  media_type: text/markdown
  text: '# Choose the approved record


    Owner: Rafael Wellard. Reviewed 5 June 2026.


    The accepted item has an approval date and state. A newer draft is not automatically effective. Keep earlier
    versions readable as history; request an owner decision before replacing a master.


    If the record itself is wrong, ask its business owner for a dated correction. Service desk can repair links,
    view settings and delivery faults; it cannot approve business facts or grant adjacent authority.

    '
- id: it-knowledge-04
  story: arwc-it-services
  employer: arwc
  title: Preview and exact document
  published_at: '2026-06-05T12:00:00-04:00'
  audience: staff
  path: Information technology/knowledge/library-04.md
  media_type: text/markdown
  text: '# Preview and exact document


    Owner: Rafael Wellard. Reviewed 5 June 2026.


    Search text and previews help locate an item. The downloaded file is the retained version. A failed preview
    does not authorize forwarding a restricted attachment to another mailbox.


    If the record itself is wrong, ask its business owner for a dated correction. Service desk can repair links,
    view settings and delivery faults; it cannot approve business facts or grant adjacent authority.

    '
- id: it-knowledge-05
  story: arwc-it-services
  employer: arwc
  title: Correct a work contact
