  audience: staff
  path: Information technology/knowledge/fieldkest-21.md
  media_type: text/markdown
  text: '# ARWC integration reference


    Owner: Theo Marrivel. Reviewed 5 June 2026.


    Use the accepted ARWC revision FLK-7.4.2 for current service questions. FLK-6.9.8 is historical. A reference
    page cannot accept a package delivery or grant an integration role.


    If the record itself is wrong, ask its business owner for a dated correction. Service desk can repair links,
    view settings and delivery faults; it cannot approve business facts or grant adjacent authority.

    '
- id: it-knowledge-22
  story: arwc-it-services
  employer: arwc
  title: Supplier case attachment
  published_at: '2026-06-05T12:00:00-04:00'
  audience: staff
  path: Information technology/knowledge/fieldkest-22.md
  media_type: text/markdown
  text: '# Supplier case attachment


    Owner: Theo Marrivel. Reviewed 5 June 2026.


    KeplerOps and ARWC keep their own case records. Share a selected approved delivery reference through the existing
    owner route, not a whole private case archive.


    If the record itself is wrong, ask its business owner for a dated correction. Service desk can repair links,
    view settings and delivery faults; it cannot approve business facts or grant adjacent authority.

    '
