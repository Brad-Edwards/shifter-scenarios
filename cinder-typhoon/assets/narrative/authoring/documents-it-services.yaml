  audience: staff
  path: Information technology/knowledge/directory-05.md
  media_type: text/markdown
  text: '# Correct a work contact


    Owner: Samira Ferrell. Reviewed 5 June 2026.


    Send the current work extension and team to the page owner. The staff directory reflects the present roster;
    old mail and dated handovers remain historical.


    If the record itself is wrong, ask its business owner for a dated correction. Service desk can repair links,
    view settings and delivery faults; it cannot approve business facts or grant adjacent authority.

    '
- id: it-knowledge-06
  story: arwc-it-services
  employer: arwc
  title: Temporary cover
  published_at: '2026-06-05T12:00:00-04:00'
  audience: staff
  path: Information technology/knowledge/directory-06.md
  media_type: text/markdown
  text: '# Temporary cover


    Owner: Samira Ferrell. Reviewed 5 June 2026.


    A cover note names a person and dates. It does not change the substantive reporting line or create new access-group
    membership.


    If the record itself is wrong, ask its business owner for a dated correction. Service desk can repair links,
    view settings and delivery faults; it cannot approve business facts or grant adjacent authority.

    '
- id: it-knowledge-07
  story: arwc-it-services
  employer: arwc
  title: Receipt versus allocation
  published_at: '2026-06-05T12:00:00-04:00'
  audience: staff
  path: Information technology/knowledge/customer-07.md
  media_type: text/markdown
  text: '# Receipt versus allocation


    Owner: Soren Garsen. Reviewed 5 June 2026.


    One receipt may have one or more allocation rows. Check the payment reference and date once; Accounts owns balances
    and corrections. Do not enter an extra receipt to make a screen look even.


    If the record itself is wrong, ask its business owner for a dated correction. Service desk can repair links,
    view settings and delivery faults; it cannot approve business facts or grant adjacent authority.

    '
- id: it-knowledge-08
  story: arwc-it-services
  employer: arwc
  title: Find an issued bill
  published_at: '2026-06-05T12:00:00-04:00'
  audience: staff
  path: Information technology/knowledge/customer-08.md
  media_type: text/markdown
  text: '# Find an issued bill


    Owner: Soren Garsen. Reviewed 5 June 2026.


    Search by account and issue period. The bill copy is a display of the accepted invoice, not a second charge.
    A later delivery preference does not rewrite an earlier issue.


    If the record itself is wrong, ask its business owner for a dated correction. Service desk can repair links,
    view settings and delivery faults; it cannot approve business facts or grant adjacent authority.

    '
- id: it-knowledge-09
  story: arwc-it-services
  employer: arwc
  title: Find a field return
  published_at: '2026-06-05T12:00:00-04:00'
  audience: staff
  path: Information technology/knowledge/field-09.md
  media_type: text/markdown
  text: '# Find a field return


    Owner: Nina Garsen. Reviewed 5 June 2026.


    Filter by actual visit date and assigned crew. Appointment, return, stock movement and maintenance request are
    separate records, and each has its own owner.


    If the record itself is wrong, ask its business owner for a dated correction. Service desk can repair links,
    view settings and delivery faults; it cannot approve business facts or grant adjacent authority.

    '
- id: it-knowledge-10
  story: arwc-it-services
  employer: arwc
  title: Keep a shift handover intact
  published_at: '2026-06-05T12:00:00-04:00'
  audience: staff
  path: Information technology/knowledge/field-10.md
  media_type: text/markdown
  text: '# Keep a shift handover intact


    Owner: Nina Garsen. Reviewed 5 June 2026.


    Use the latest signed update for the next shift. Earlier entries explain the handover and should not be silently
    replaced. Ask the shift lead for factual corrections.


    If the record itself is wrong, ask its business owner for a dated correction. Service desk can repair links,
    view settings and delivery faults; it cannot approve business facts or grant adjacent authority.

    '
- id: it-knowledge-11
  story: arwc-it-services
  employer: arwc
  title: Approved drawings
  published_at: '2026-06-05T12:00:00-04:00'
  audience: staff
  path: Information technology/knowledge/maintenance-11.md
  media_type: text/markdown
  text: '# Approved drawings


    Owner: Theo Marrivel. Reviewed 5 June 2026.


    The A1 approved revision is effective when its engineering approval is recorded. P1 and P2 are working copies;
    a convenient preview cannot approve them.


    If the record itself is wrong, ask its business owner for a dated correction. Service desk can repair links,
    view settings and delivery faults; it cannot approve business facts or grant adjacent authority.

    '
- id: it-knowledge-12
  story: arwc-it-services
  employer: arwc
  title: Parts and work orders
  published_at: '2026-06-05T12:00:00-04:00'
  audience: staff
  path: Information technology/knowledge/maintenance-12.md
  media_type: text/markdown
  text: '# Parts and work orders


    Owner: Theo Marrivel. Reviewed 5 June 2026.


    A Stores receipt confirms delivery, not consumption on a work order. Keep the material request open until the
    planner records use or return.


    If the record itself is wrong, ask its business owner for a dated correction. Service desk can repair links,
    view settings and delivery faults; it cannot approve business facts or grant adjacent authority.

    '
- id: it-knowledge-13
  story: arwc-it-services
  employer: arwc
  title: A result is not a receipt
  published_at: '2026-06-05T12:00:00-04:00'
  audience: staff
  path: Information technology/knowledge/laboratory-13.md
  media_type: text/markdown
  text: '# A result is not a receipt


    Owner: Jalen Carsten. Reviewed 5 June 2026.


    Collection, receipt, analysis, reviewer disposition and issued report are different steps. Only the reviewed
    result belongs in an issued summary.


    If the record itself is wrong, ask its business owner for a dated correction. Service desk can repair links,
    view settings and delivery faults; it cannot approve business facts or grant adjacent authority.

    '
- id: it-knowledge-14
  story: arwc-it-services
  employer: arwc
  title: Read a repeated analysis
  published_at: '2026-06-05T12:00:00-04:00'
  audience: staff
  path: Information technology/knowledge/laboratory-14.md
  media_type: text/markdown
  text: '# Read a repeated analysis


    Owner: Jalen Carsten. Reviewed 5 June 2026.


    Retain both runs. The laboratory reviewer marks the accepted result or opens recollection; IT does not select
    a result by changing a sort order.


    If the record itself is wrong, ask its business owner for a dated correction. Service desk can repair links,
    view settings and delivery faults; it cannot approve business facts or grant adjacent authority.

    '
- id: it-knowledge-15
  story: arwc-it-services
  employer: arwc
  title: Source return and assumption
  published_at: '2026-06-05T12:00:00-04:00'
  audience: staff
  path: Information technology/knowledge/planning-15.md
  media_type: text/markdown
  text: '# Source return and assumption


    Owner: Nadia Corvane. Reviewed 5 June 2026.


    A source return is dated input. A planning assumption is a separate judgement with version and owner. Show both
    when numbers differ; do not backdate the return to make a summary match.


    If the record itself is wrong, ask its business owner for a dated correction. Service desk can repair links,
    view settings and delivery faults; it cannot approve business facts or grant adjacent authority.

    '
- id: it-knowledge-16
  story: arwc-it-services
  employer: arwc
  title: Recommendation status
  published_at: '2026-06-05T12:00:00-04:00'
  audience: staff
  path: Information technology/knowledge/planning-16.md
  media_type: text/markdown
  text: '# Recommendation status


    Owner: Nadia Corvane. Reviewed 5 June 2026.


    A planning recommendation is not approval to operate, reserve capacity, buy or publish. Follow the separate
    decision and version history.


    If the record itself is wrong, ask its business owner for a dated correction. Service desk can repair links,
    view settings and delivery faults; it cannot approve business facts or grant adjacent authority.

    '
- id: it-knowledge-17
  story: arwc-it-services
  employer: arwc
  title: Three-way match
  published_at: '2026-06-05T12:00:00-04:00'
  audience: staff
  path: Information technology/knowledge/purchasing-17.md
  media_type: text/markdown
  text: '# Three-way match


    Owner: Priya Naravel. Reviewed 5 June 2026.


    The order, accepted receipt and supplier invoice must agree before a payment request. A PDF issue date differs
    naturally from the match date. IT cannot waive the match.


    If the record itself is wrong, ask its business owner for a dated correction. Service desk can repair links,
    view settings and delivery faults; it cannot approve business facts or grant adjacent authority.

    '
- id: it-knowledge-18
  story: arwc-it-services
  employer: arwc
  title: Quote and accepted order
  published_at: '2026-06-05T12:00:00-04:00'
  audience: staff
  path: Information technology/knowledge/purchasing-18.md
  media_type: text/markdown
  text: '# Quote and accepted order


    Owner: Priya Naravel. Reviewed 5 June 2026.


    A supplier quotation is an offer. The accepted purchase order is the authority for the stated scope. Keep both
    with their dates and never relabel the quotation as an order.


    If the record itself is wrong, ask its business owner for a dated correction. Service desk can repair links,
    view settings and delivery faults; it cannot approve business facts or grant adjacent authority.

    '
- id: it-knowledge-19
  story: arwc-it-services
  employer: arwc
  title: Selected-books close
  published_at: '2026-06-05T12:00:00-04:00'
  audience: staff
  path: Information technology/knowledge/finance-19.md
  media_type: text/markdown
  text: '# Selected-books close


    Owner: Emre Edran. Reviewed 5 June 2026.


    The management close covers selected purchasing and customer books. Use its printed cutoff and caveats; it is
    not a bank reconciliation or audited balance sheet.


    If the record itself is wrong, ask its business owner for a dated correction. Service desk can repair links,
    view settings and delivery faults; it cannot approve business facts or grant adjacent authority.

    '
