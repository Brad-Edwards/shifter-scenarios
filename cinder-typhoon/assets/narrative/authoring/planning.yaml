  context: The available commercial book covers June. It describes billed use, with no evidence that production
    or future demand will follow the same pattern.
  question: Can June be used to set a five-year growth percentage?
  answer: A single month cannot establish growth. The upper factor is a chosen sensitivity for discussion; it is
    not fitted to production data.
  recommendation: Carry June as a dated commercial comparator and ask for a second seasonal period before preparing
    growth assumptions.
  condition: Do not annualize one production month into a promised volume.
  state: accepted planning basis
  change:
    key: high
    old: 1.08
    reason: Hana requested the same 10% upper comparison across all eight customer-class returns; the 8% draft remains
      available.
