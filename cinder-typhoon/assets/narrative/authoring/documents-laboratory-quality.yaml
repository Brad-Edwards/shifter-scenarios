  text: '# ARWC Laboratory Operating Specification ARWC-LOS-26-01


    Effective 5 January 2026. This fictional internal specification supports routine trend review at ARWC. Its response
    bands are not statutory, regulatory, health, or legal limits and must not be described as such.


    | Code | Working measure | Internal working band |

    | --- | --- | --- |

    | CRU | Clarity response, ARWC response units | 0.0 to 4.0 |

    | MBU | Mineral balance, ARWC balance units | 40.0 to 75.0 |

    | RSI | Reference stability, percent of laboratory reference | 92.0 to 108.0 |


    Every history retains schedule, collection, receipt, analytical run, review and reporting references. A result
    outside an internal band is repeated or sent for recollection. It is not, by itself, a public-safety or legal
    conclusion.

    '
