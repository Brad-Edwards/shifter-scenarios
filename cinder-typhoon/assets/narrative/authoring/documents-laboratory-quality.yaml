  media_type: text/markdown
  text: '# Routine sample and report guide


    Use the scheduled sample identity at collection. Record the seal and receipt time before analysis. Retain preliminary
    and repeat runs together. A reviewer may accept a repeat, request recollection, or leave the item open. Weekly
    summaries state the actual disposition and never turn an open recollection into an accepted result.


    The monthly workbook is a working aid. The signed review row and issued weekly report remain the authoritative
    history.

    '
