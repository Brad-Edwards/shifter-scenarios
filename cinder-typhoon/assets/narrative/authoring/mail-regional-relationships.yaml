messages:
- id: rr-arwc-01-m1
  story: regional-relationships
  from: theo
  to:
  - maya
  date: '2026-06-23T09:05:00-04:00'
  subject: When the familiar contact is away
  body: |
    Maya, can we keep the last answer with the question when someone else picks it up? I spent more time finding my sent mail than explaining the field this morning.
- id: rr-arwc-01-m2
  story: regional-relationships
  from: maya
  to:
  - theo
  date: '2026-06-23T09:42:00-04:00'
  subject: 'Re: When the familiar contact is away'
  body: |
    Yes. I've written down the handover we actually need. Keep replying on the customer conversation; I'll make sure the next person can see the last answer.
  reply_to: rr-arwc-01-m1
  attachments:
  - rr-arwc-01
- id: rr-arwc-01-m3
  story: regional-relationships
  from: theo
  to:
  - maya
  date: '2026-06-23T10:28:00-04:00'
  subject: 'Re: When the familiar contact is away'
  body: |
    The record reference and disputed field are enough. Please don't ask the next shift for the whole work sheet again.
  reply_to: rr-arwc-01-m2
- id: rr-arwc-01-m4
  story: regional-relationships
  from: maya
  to:
  - theo
  date: '2026-06-23T11:56:00-04:00'
  subject: 'Re: When the familiar contact is away'
  body: |
    Agreed. If we do need something from it, we'll ask for that part and say why.
  reply_to: rr-arwc-01-m3
- id: rr-arwc-02-m1
  story: regional-relationships
  from: rowan
  to:
  - clara
  date: '2026-07-08T09:05:00-04:00'
  subject: A useful handover question
  body: |
    Would a pair of descriptions help? One for the replacement arriving, one for the reviewer accepting it. I started putting them in the same sentence and it got muddy.
- id: rr-arwc-02-m2
  story: regional-relationships
  from: clara
  to:
  - rowan
  date: '2026-07-08T09:42:00-04:00'
  subject: 'Re: A useful handover question'
  body: |
    Keep them separate. I've attached the wording question. Arrival isn't approval.
  reply_to: rr-arwc-02-m1
  attachments:
  - rr-arwc-02
- id: rr-arwc-02-m3
  story: regional-relationships
  from: rowan
  to:
  - clara
  date: '2026-07-08T10:28:00-04:00'
  subject: 'Re: A useful handover question'
  body: |
    Right. I'll drop 'latest accepted copy' from the first sentence. It was doing two jobs.
  reply_to: rr-arwc-02-m2
- id: rr-arwc-02-m4
  story: regional-relationships
  from: clara
  to:
  - rowan
  date: '2026-07-08T11:56:00-04:00'
  subject: 'Re: A useful handover question'
  body: |
    That reads properly now. We can discuss the display without making it the approval record.
  reply_to: rr-arwc-02-m3
- id: rr-arwc-03-m1
  story: regional-relationships
  from: maya
  to:
  - theo
  date: '2026-08-20T09:05:00-04:00'
  subject: 'Reference conversation: questions worth asking'
  body: |
    If we ask about a reference conversation later, what would you actually want someone to ask? I can send a list of product questions, but they may be the wrong ones.
- id: rr-arwc-03-m2
  story: regional-relationships
  from: theo
  to:
  - maya
  date: '2026-08-20T09:42:00-04:00'
  subject: 'Re: Reference conversation: questions worth asking'
  body: |
    The questions in the note would be more use. Ask what we had to sort out ourselves. It's a less shiny conversation, admittedly.
  reply_to: rr-arwc-03-m1
  attachments:
  - rr-arwc-03
- id: rr-arwc-03-m3
  story: regional-relationships
  from: maya
  to:
  - theo
  date: '2026-08-20T10:28:00-04:00'
  subject: 'Re: Reference conversation: questions worth asking'
  body: |
    I would rather they hear that before buying. I'll bring you an audience and a time request when there is one.
  reply_to: rr-arwc-03-m2
- id: rr-arwc-04-m1
  story: regional-relationships
  from: maya
  to:
  - kwm048
  date: '2026-09-03T09:05:00-04:00'
  subject: 'Account review: term and responsibilities'
  body: |
    Louis, before the account review: are you expecting a renewal discussion or a budget question? Theo is asking about support continuity.
- id: rr-arwc-04-m2
  story: regional-relationships
  from: kwm048
  to:
  - maya
  date: '2026-09-03T09:42:00-04:00'
  subject: 'Re: Account review: term and responsibilities'
  body: |
    Budget and continuity. I've put the term and instalment figures in the attached note so I don't use the wrong heading again.
  reply_to: rr-arwc-04-m1
  attachments:
  - rr-arwc-04
- id: rr-arwc-04-m3
  story: regional-relationships
  from: maya
  to:
  - kwm048
  date: '2026-09-03T10:28:00-04:00'
  subject: 'Re: Account review: term and responsibilities'
  body: |
    I'll bring the continuity question. Leave the cost discussion with Priya; Clara doesn't need it to answer a record question.
  reply_to: rr-arwc-04-m2
- id: rr-arwc-04-m4
  story: regional-relationships
  from: kwm048
  to:
  - maya
  date: '2026-09-03T11:56:00-04:00'
  subject: 'Re: Account review: term and responsibilities'
  body: |
    Yes. Separate conversations. I only need to know if the working preference changes the agreed service.
  reply_to: rr-arwc-04-m3
- id: rr-arwc-05-m1
  story: regional-relationships
  from: rowan
  to:
  - maya
  date: '2026-09-07T09:05:00-04:00'
  subject: Customer questions without customer records
  body: |
    I have a screen that shows the distinction neatly. It's from an ARWC question, so we would need to ask them first.
- id: rr-arwc-05-m2
  story: regional-relationships
  from: maya
  to:
  - rowan
  date: '2026-09-07T09:42:00-04:00'
  subject: 'Re: Customer questions without customer records'
  body: |
    Let's use invented labels. The attached note gives us enough to explain the question without circulating somebody's record.
  reply_to: rr-arwc-05-m1
  attachments:
  - rr-arwc-05
- id: rr-arwc-05-m3
  story: regional-relationships
  from: rowan
  to:
  - maya
  date: '2026-09-07T10:28:00-04:00'
  subject: 'Re: Customer questions without customer records'
  body: |
    Fair. A and B it is. I'll resist giving them an elaborate backstory.
  reply_to: rr-arwc-05-m2
- id: rr-arwc-05-m4
  story: regional-relationships
  from: maya
  to:
  - rowan
  date: '2026-09-07T11:56:00-04:00'
  subject: 'Re: Customer questions without customer records'
  body: |
    Two sentences will do. Keep the reviewer decision in the second one.
  reply_to: rr-arwc-05-m3
- id: rr-arwc-06-m1
  story: regional-relationships
  from: kwm052
  to:
  - maya
  - kwm048
  date: '2026-09-10T09:05:00-04:00'
  subject: 'Reference preparation: what stays in the room'
  body: |
    Do I need a deck for the reference hold, or just the agenda? I am keeping the invitation tentative.
- id: rr-arwc-06-m2
  story: regional-relationships
  from: maya
  to:
  - kwm052
  - kwm048
  date: '2026-09-10T09:42:00-04:00'
  subject: 'Re: Reference preparation: what stays in the room'
  body: |
    Just the agenda. Attached my preparation note for us. Theo specifically doesn't want a presentation written for him.
  reply_to: rr-arwc-06-m1
  attachments:
  - rr-arwc-06
- id: rr-arwc-06-m3
  story: regional-relationships
  from: kwm048
  to:
  - maya
  - kwm052
  date: '2026-09-10T10:28:00-04:00'
  subject: 'Re: Reference preparation: what stays in the room'
  body: |
    Please don't turn a good comment into proposed website copy either. That's a separate request.
  reply_to: rr-arwc-06-m2
- id: rr-arwc-06-m4
  story: regional-relationships
  from: kwm052
  to:
  - maya
  - kwm048
  date: '2026-09-10T11:56:00-04:00'
  subject: 'Re: Reference preparation: what stays in the room'
  body: |
    Understood. I still need the other participants before I can confirm the call.
  reply_to: rr-arwc-06-m3
- id: rr-arwc-07-m1
  story: regional-relationships
  from: theo
  to:
  - maya
  date: '2026-09-11T09:05:00-04:00'
  subject: 'Re: Continuity preference: a shorter question'
  body: |
    Coming back to our June note: can 'passed on' include who it went to? I don't need a weekly update, just to know whether someone is waiting for me.
  reply_to: rr-arwc-01-m4
- id: rr-arwc-07-m2
  story: regional-relationships
  from: maya
  to:
  - theo
  date: '2026-09-11T09:42:00-04:00'
  subject: 'Re: Continuity preference: a shorter question'
  body: |
    Yes. I've added that distinction to the follow-up note. No weekly mail for a quiet account.
  reply_to: rr-arwc-07-m1
  attachments:
  - rr-arwc-07
- id: rr-arwc-07-m3
  story: regional-relationships
  from: theo
  to:
  - maya
  date: '2026-09-11T10:28:00-04:00'
  subject: 'Re: Continuity preference: a shorter question'
  body: |
    Good. Quiet can stay quiet. I will put the changed bit at the top when I do reply.
  reply_to: rr-arwc-07-m2
- id: rr-arwc-08-m1
  story: regional-relationships
  from: theo
  to:
  - clara
  date: '2026-09-14T09:05:00-04:00'
  subject: 'ARWC reference: private preparation reminder'
  body: |
    Clara, I can cover the planning side. Are you happy to take receipt versus acceptance, if they ask?
- id: rr-arwc-08-m2
  story: regional-relationships
  from: clara
  to:
  - theo
  date: '2026-09-14T09:42:00-04:00'
  subject: 'Re: ARWC reference: private preparation reminder'
  body: |
    Yes. My reminder is attached. We don't need plant names to explain it.
  reply_to: rr-arwc-08-m1
  attachments:
  - rr-arwc-08
- id: rr-arwc-08-m3
  story: regional-relationships
  from: theo
  to:
  - clara
  date: '2026-09-14T10:28:00-04:00'
  subject: 'Re: ARWC reference: private preparation reminder'
  body: |
    Agreed. I would like to say what still takes work here. Otherwise it sounds as though the software does the planning.
  reply_to: rr-arwc-08-m2
- id: rr-arwc-08-m4
  story: regional-relationships
  from: clara
  to:
  - theo
  date: '2026-09-14T11:56:00-04:00'
  subject: 'Re: ARWC reference: private preparation reminder'
  body: |
    It doesn't. Say that plainly.
  reply_to: rr-arwc-08-m3
- id: rr-arwc-09-m1
  story: regional-relationships
  from: kwm048
  to:
  - rowan
  - maya
  date: '2026-09-15T09:05:00-04:00'
  subject: A technical answer is not a delivery promise
  body: |
    If someone asks whether we can put the two descriptions together, what can I safely say? I'm not asking for a roadmap item.
- id: rr-arwc-09-m2
  story: regional-relationships
  from: rowan
  to:
  - maya
  - kwm048
  date: '2026-09-15T09:42:00-04:00'
  subject: 'Re: A technical answer is not a delivery promise'
  body: |
    I've attached the wording I'd use. Explain the current view first. 'We can do that' is too easy to hear as a promise.
  reply_to: rr-arwc-09-m1
  attachments:
  - rr-arwc-09
- id: rr-arwc-09-m3
  story: regional-relationships
  from: maya
  to:
  - rowan
  - kwm048
  date: '2026-09-15T10:28:00-04:00'
  subject: 'Re: A technical answer is not a delivery promise'
  body: |
    And I can ask whether they mean an explanation or a change. We need their question, not a commitment we guessed at.
  reply_to: rr-arwc-09-m2
- id: rr-arwc-10-m1
  story: regional-relationships
  from: kwm052
  to:
  - maya
  - theo
  - clara
  - kwm048
  date: '2026-09-16T07:20:00-04:00'
  subject: 'Re: Reference hold: morning status'
  body: |
    Morning. Still no prospective participant confirmation. Shall I leave the 29th exactly as it is?
  reply_to: cm-1376
- id: rr-arwc-10-m2
  story: regional-relationships
  from: maya
  to:
  - theo
  - clara
  - kwm052
  - kwm048
  date: '2026-09-16T07:49:00-04:00'
  subject: 'Re: Reference hold: morning status'
  body: |
    Yes, tentative. The status note is attached for everyone on this conversation. Theo's last reply hasn't changed that.
  reply_to: rr-arwc-10-m1
  attachments:
  - rr-arwc-10
- id: rr-arwc-10-m3
  story: regional-relationships
  from: theo
  to:
  - maya
  - clara
  - kwm052
  - kwm048
  date: '2026-09-16T07:58:00-04:00'
  subject: 'Re: Reference hold: morning status'
  body: |
    Fine with me. No slides is still the most useful part of the arrangement.
  reply_to: rr-arwc-10-m2
- id: rr-arwc-10-m4
  story: regional-relationships
  from: clara
  to:
  - maya
  - theo
  - kwm052
  - kwm048
  date: '2026-09-16T08:09:00-04:00'
  subject: 'Re: Reference hold: morning status'
  body: |
    And the same thirty minutes. If that changes, please ask before moving it.
  reply_to: rr-arwc-10-m3
- id: rr-veybridge-01-m1
  story: regional-relationships
  from: jules
  to:
  - theo
  date: '2026-06-18T09:05:00-04:00'
  subject: Visit feedback / ARWC-PO-26-201
  body: |
    Theo, anything you wanted presented differently in the report from the 12th? I mean the report, not another visit.
- id: rr-veybridge-01-m2
  story: regional-relationships
  from: theo
  to:
  - jules
  date: '2026-06-18T09:42:00-04:00'
  subject: 'Re: Visit feedback / ARWC-PO-26-201'
  body: |
    The report is useful. My note is attached. I'll quote both the order and report when I ask about an observation.
  reply_to: rr-veybridge-01-m1
  attachments:
  - rr-veybridge-01
- id: rr-veybridge-01-m3
  story: regional-relationships
  from: jules
  to:
  - theo
  date: '2026-06-18T10:28:00-04:00'
  subject: 'Re: Visit feedback / ARWC-PO-26-201'
  body: |
    That helps. Dates blur when you've been three places in a week.
  reply_to: rr-veybridge-01-m2
- id: rr-veybridge-01-m4
  story: regional-relationships
  from: theo
  to:
  - jules
  date: '2026-06-18T11:56:00-04:00'
  subject: 'Re: Visit feedback / ARWC-PO-26-201'
  body: |
    Scheduling goes to dispatch; questions about what you saw can stay with you. I'll keep those apart.
  reply_to: rr-veybridge-01-m3
- id: rr-veybridge-02-m1
  story: regional-relationships
  from: theo
  to:
  - bc_veybridge_2
  date: '2026-06-30T09:05:00-04:00'
  subject: Dispatch desk / a booking request that can be used
  body: |
    Dana, what should I put first in a booking request so it reaches the right person? People still send it to Jules because they know him.
- id: rr-veybridge-02-m2
  story: regional-relationships
  from: bc_veybridge_2
  to:
  - theo
  date: '2026-06-30T09:42:00-04:00'
  subject: 'Re: Dispatch desk / a booking request that can be used'
  body: |
    Order, window, access contact. Attached the desk note. I can arrange a diary without making Jules the postbox.
  reply_to: rr-veybridge-02-m1
  attachments:
  - rr-veybridge-02
- id: rr-veybridge-02-m3
  story: regional-relationships
  from: theo
  to:
  - bc_veybridge_2
  date: '2026-06-30T10:28:00-04:00'
  subject: 'Re: Dispatch desk / a booking request that can be used'
  body: |
    I'll use that. Does an uncertain date need a separate email?
  reply_to: rr-veybridge-02-m2
- id: rr-veybridge-02-m4
  story: regional-relationships
  from: bc_veybridge_2
  to:
  - theo
  date: '2026-06-30T11:56:00-04:00'
  subject: 'Re: Dispatch desk / a booking request that can be used'
  body: |
    No, just say what makes it uncertain. 'Planner available' and 'site ready' aren't the same thing.
  reply_to: rr-veybridge-02-m3
- id: rr-veybridge-02-m5
  story: regional-relationships
  from: theo
  to:
  - bc_veybridge_2
  date: '2026-06-30T13:20:00-04:00'
  subject: 'Re: Dispatch desk / a booking request that can be used'
  body: |
    Useful distinction. I had only written the first one.
  reply_to: rr-veybridge-02-m4
- id: rr-veybridge-03-m1
  story: regional-relationships
  from: theo
  to:
  - jules
  date: '2026-07-02T09:05:00-04:00'
  subject: 'Re: Report question / the last line'
  body: |
    On the last line of the 26 June report: people keep asking for a general sign-off. Can you give me a sentence to stop that getting muddled?
  reply_to: rr-veybridge-01-m4
- id: rr-veybridge-03-m2
  story: regional-relationships
  from: jules
  to:
  - theo
  date: '2026-07-02T09:42:00-04:00'
  subject: 'Re: Report question / the last line'
  body: |
    My note is attached. I can answer for what I saw on that order. Your reviewer still makes your acceptance decision.
  reply_to: rr-veybridge-03-m1
  attachments:
  - rr-veybridge-03
- id: rr-veybridge-03-m3
  story: regional-relationships
  from: theo
  to:
  - jules
  date: '2026-07-02T10:28:00-04:00'
  subject: 'Re: Report question / the last line'
  body: |
    That is the sentence. I will stop calling both things a sign-off.
  reply_to: rr-veybridge-03-m2
- id: rr-veybridge-04-m1
  story: regional-relationships
  from: priya
  to:
  - bc_veybridge_3
  date: '2026-07-22T09:05:00-04:00'
  subject: Account desk / summer service review
  body: |
    Aiden, can additional attendance sit on its own line next time? It is easier to approve the service we actually need.
- id: rr-veybridge-04-m2
  story: regional-relationships
  from: bc_veybridge_3
  to:
  - priya
  date: '2026-07-22T09:42:00-04:00'
  subject: 'Re: Account desk / summer service review'
  body: |
    Yes. I've recorded that preference. The standard visit stays USD 1,240; any extra request needs its own written order.
  reply_to: rr-veybridge-04-m1
  attachments:
  - rr-veybridge-04
- id: rr-veybridge-04-m3
  story: regional-relationships
  from: priya
  to:
  - bc_veybridge_3
  date: '2026-07-22T10:28:00-04:00'
  subject: 'Re: Account desk / summer service review'
  body: |
    Please make it an option until accepted. I do not want the summary to look like a total already approved.
  reply_to: rr-veybridge-04-m2
- id: rr-veybridge-04-m4
  story: regional-relationships
  from: bc_veybridge_3
  to:
  - priya
  date: '2026-07-22T11:56:00-04:00'
  subject: 'Re: Account desk / summer service review'
  body: |
    An option, clearly marked. No change to the accepted summer jobs.
  reply_to: rr-veybridge-04-m3
- id: rr-veybridge-05-m1
  story: regional-relationships
  from: bc_veybridge_2
  to:
  - theo
  date: '2026-07-28T09:05:00-04:00'
  subject: 'Re: Visit feedback / a different familiar face'
  body: |
    Was having the confirmation from me workable for the 14 July job? Trying to stop every diary question ending up on one phone.
  reply_to: rr-veybridge-02-m5
- id: rr-veybridge-05-m2
  story: regional-relationships
  from: theo
  to:
  - bc_veybridge_2
  date: '2026-07-28T09:42:00-04:00'
  subject: 'Re: Visit feedback / a different familiar face'
  body: |
    It worked. Attached the feedback against the report. I need someone who can settle the booking, not necessarily the person I've known longest.
  reply_to: rr-veybridge-05-m1
  attachments:
  - rr-veybridge-05
- id: rr-veybridge-05-m3
  story: regional-relationships
  from: bc_veybridge_2
  to:
  - theo
  date: '2026-07-28T10:28:00-04:00'
  subject: 'Re: Visit feedback / a different familiar face'
  body: |
    Good. Keep sending the order number. That is how the next person at the desk can help too.
  reply_to: rr-veybridge-05-m2
- id: rr-veybridge-06-m1
  story: regional-relationships
  from: theo
  to:
  - jules
  date: '2026-08-06T09:05:00-04:00'
  subject: Teaching notes / describing an observation
  body: |
    You mentioned teaching some of the newer colleagues. Is there a report example you'd like a planner's view on?
- id: rr-veybridge-06-m2
  story: regional-relationships
  from: jules
  to:
  - theo
  date: '2026-08-06T09:42:00-04:00'
  subject: 'Re: Teaching notes / describing an observation'
  body: |
    This one. It's made up; 'checked, all fine' is the whole starting note. What would you have to ring back and ask?
  reply_to: rr-veybridge-06-m1
  attachments:
  - rr-veybridge-06
- id: rr-veybridge-06-m3
  story: regional-relationships
  from: theo
  to:
  - jules
  date: '2026-08-06T10:28:00-04:00'
  subject: 'Re: Teaching notes / describing an observation'
  body: |
    What, which order, and did you see it yourself? Probably in that order.
  reply_to: rr-veybridge-06-m2
- id: rr-veybridge-06-m4
  story: regional-relationships
  from: jules
  to:
  - theo
  date: '2026-08-06T11:56:00-04:00'
  subject: 'Re: Teaching notes / describing an observation'
  body: |
    Same questions as mine, less tidily written on my pad. I'll keep the example short.
  reply_to: rr-veybridge-06-m3
- id: rr-veybridge-07-m1
  story: regional-relationships
  from: theo
  to:
  - bc_veybridge_2
  date: '2026-08-18T09:05:00-04:00'
  subject: 'Re: Dispatch feedback / one changed detail'
  body: |
    One addition to the booking note: if only the planner's time changes, should I start a fresh request?
  reply_to: rr-veybridge-05-m3
- id: rr-veybridge-07-m2
  story: regional-relationships
