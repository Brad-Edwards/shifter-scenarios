    <header>Service notebook</header>
    <h1>Service feedback: the reference on the sheet</h1>
    <p>Clara Morivelle · 24 July 2026</p>
    <p>Clara reviewed the presentation of AV-SR-26-013 after ARWC receipt ARWC-GR-26-013. The service took place on 20 July under ARWC-PO-26-213 for ARWC-WO-26-0397. Its result is serviceable for the stated instrument condition and calibration scope; no parts or extra work were undertaken.</p>
    <p>The useful feature is the order reference beside the observed result. A service desk colleague can answer a question about the sheet without first asking which visit the customer means. Clara would keep that layout even if a later report becomes longer.</p>
    <p>This is feedback on a completed report, not a request to issue another calibration record. The accepted report and receipt retain their original dates and authority. Any later instrument question needs to identify the item and the question rather than reuse this result by association.</p>
