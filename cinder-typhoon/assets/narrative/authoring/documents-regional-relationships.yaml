    <p>Arel&#x27;s account note separates the budget view from the seasonal maintenance handover. The current FieldKest agreement K-C-002-AGR-01 runs through 31 October 2027. Its annual service fee is USD 89,000, in four instalments of USD 22,250. Those are existing terms, not a new proposal.</p>
    <p>The account conversation can help Arel explain the current commitment internally. Greer&#x27;s maintenance questions should remain with the service conversation, where the relevant reviewer can answer them. A budget summary should not claim that every suggestion made by the maintenance desk has become included future work.</p>
    <p>Arel will bring a concrete scope question if the business wants a further proposal. Luca will distinguish that proposal from the current service. No additional price, accepted order or invoice is created by this note.</p>
