  - theo
  path: Relationships/K-C-001/rr-arwc-08.md
  media_type: text/markdown
  text: |
    # ARWC reference: private preparation reminder

    Clara Morivelle | 14 September 2026

    Clara's preparation reminder for Theo: talk about the review process we use, including the parts we still perform ourselves. Keep local plant and staff detail out of the example. A prospective customer needs to hear what a reviewer does, not learn our asset naming scheme.

    Theo can describe planning and handover habits. Clara can explain why receipt and acceptance are separate. Neither needs to represent every department or describe a colleague's support question. If a question falls outside their experience, they can leave it for the appropriate owner.

    The September 29 hold is still a hold. This is a private reminder for the two invited ARWC colleagues, not approved minutes, a statement on behalf of management or permission to publish their comments. No further staff time has been agreed here.
- id: rr-arwc-09
  story: regional-relationships
  employer: keplerops
  title: A technical answer is not a delivery promise
  published_at: '2026-09-15T09:30:00-04:00'
  audience: restricted
  reader_keys:
  - rowan
  - maya
  - kwm048
  path: Relationships/K-C-001/rr-arwc-09.md
  media_type: text/markdown
  text: |
    # A technical answer is not a delivery promise

    Rowan Ito | 15 September 2026

    When Rowan answers a question about comparing submissions, the answer can explain current behavior and the customer's review responsibility. It must not imply that a suggested layout change has been scheduled. Louis needs the distinction before he describes the account conversation elsewhere.

    The internal wording is: “We can discuss how the current review is presented; a requested change needs its own assessment.” Avoid “we can do that” when the subject of “that” has shifted from an explanation to development work. Maya will ask which question the customer means if the thread becomes ambiguous.

    No new feature, interface, project effort or delivery date is committed by this note. The next reference conversation is an opportunity to describe experience, not a route around the existing scope and acceptance process.
