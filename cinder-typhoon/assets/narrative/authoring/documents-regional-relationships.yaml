    # Desk card / keep the decision beside the question

    Isaac Devren | 07 September 2026

    Desk handover card, following the September account review.

    Question: what is the customer asking now? Reference: where is the last answer or decision? Owner: who can answer the remaining point? State: is the item complete, waiting for information or only proposed? These four entries are enough for a compact ordinary handover when the source record is retained.

    Do not replace the last answer with “see previous mail”. That instruction is only useful if the next colleague knows which previous mail. Use the exact subject or record reference. Do not paste private service material into the card merely to make it self-contained.

    Isaac will use the card for account continuity. Noor prefers one actionable question to a polished recap that leaves the recipient uncertain what to do next.
