    <p>Working exercise, using invented item EXAMPLE-17. The note reads: “The display changed during use. We stopped and kept the item aside. The time is on the local sheet; I do not have that sheet with me.” There is no diagnosis and no real calibration result.</p>
    <p>The desk response should ask for the observation time and the person who has the sheet, then check the relevant service route. It should not turn “display changed” into an assumed failure mode. The useful lesson is that a limited observation can still be passed on honestly.</p>
