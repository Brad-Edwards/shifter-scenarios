publication_consents:
- publication: community-post-107
  people:
  - mina
  approvals:
  - cl-2243
  approved_text: I remember the refurbishment as a lot of people making each stage fit around work that was
    already happening. I would rather answer questions in a small group than give a speech about it. Someone
    who joined later will notice things I now take for granted.
- publication: community-post-108
  people:
  - clara
  approvals:
  - cl-2245
  approved_text: I joined in 2014, after the services had come together. The places were new to me even when
    a colleague called them the old place. Asking which entrance they meant was often more useful than pretending
    I knew the nickname.
- publication: community-post-109
  people:
  - awm221
  approvals:
  - cl-2247
  approved_text: When I joined in 2012, the regional organization was already there. I learned the earlier
    story from colleagues. What I remember for myself is finding the right person to ask, and slowly becoming
    one of those people for somebody else.
- publication: community-post-110
  people:
  - awm150
  approvals:
  - cl-2249
  approved_text: Kaisa Kelswick's kitchen-window photograph took first place in Ordinary light. Theo Marrivel's
    early-morning footpath was second. Mina Selverin and Owen Vardell are among the contributors whose accepted
    entries will be included in the staff display.
