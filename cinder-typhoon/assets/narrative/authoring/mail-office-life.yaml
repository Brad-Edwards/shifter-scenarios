  date: '2026-09-08T12:00:00-04:00'
  subject: 'Workshop rehearsal: opening and discussion'
  body: |
    Wednesday, September 09, 11:15-12:00. Small room / remote option.

    I will run my own opening, then the discussion transition. Please watch where I lose the question and where I need to pause; those are the two feedback points I want.

    Emre Maraven will cover routine support intake from 11:15 to 12:00; send the hand-back to the usual case owner.

    Please tell me if the time does not work. The attached invitation has the booking.
  attachments:
  - office-2026-001-request
- id: ol-0002
  story: office-life
  from: maya
  to:
  - talia
  date: '2026-09-08T14:00:00-04:00'
  subject: 'Re: Workshop rehearsal: opening and discussion'
  body: |
    I can watch those two parts. I will bring the older outline as a reference if you want it, rather than replacing your opening.
  reply_to: ol-0001
  attachments:
  - office-2026-001-reply-maya
- id: ol-0003
  story: office-life
  from: talia
  to:
  - kwm023
  date: '2026-09-08T16:00:00-04:00'
  subject: 'Cover for Workshop rehearsal: opening and discussion'
  body: |
    Can you take routine support intake on September 09 from 11:15 to 12:00? The invited colleagues have this slot away from the queue. Please route decisions outside routine intake to the established owner; this does not change case ownership.
