  path: cap-2026-011-decision.md
  media_type: text/markdown
  text: '# CAP-2026-011: weekly operating capacity


    60 operator hours available; 34 booked for qualification; 9 reserved for recovery checks; 17 unallocated.
    These are staff hours, not host or cloud sizing.


    Decision: recorded.


    Use only the available hours for new qualification; preserve the recovery reservation.


    Evan needs a dependable release finish. Noor needs recoverability work to retain its booked time.
    Unallocated hours do not imply independent observer availability. Jalen owns the next rota check.

    '
