        cross_tenant: Never resolve, join, mutate, or disclose another tenant instance's state.
      transition_contract: Demonstrate a control client with the intended live authority. This supplies the declared prior
        result and CONTROL, equivalent in scope to the declared prior result's route. Process knowledge remains required.
      evidence_contract:
        producer: a-control-broker/control-broker writes the primary immutable audit; caller output alone is insufficient.
        required_bindings:
        - tenant instance
        - accepted caller or service identity
        - request correlation
        - exact object and revision
        - result identifier and digest
        - destination observation when declared
        downstream_join: Supplies the declared prior result and CONTROL.
        freshness: A mutable result and its audit are created only by an accepted request and are absent from initial
