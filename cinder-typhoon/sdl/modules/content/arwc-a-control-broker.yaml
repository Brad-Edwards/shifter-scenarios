        entry: Use only the declared native route or inventoried local artifact; no undeclared interaction exists.
        identity: ARWC issuer evidence or scoped control client
        input: Successful chain calls built-in issue_client for issuer record ISSUER-UTIL-OG2-R4 after setresuid(0,0,0);
          seccomp permits only the fixed issuer socket and the resulting client matches the declared prior result scope.
        success: Demonstrate a control client with the intended live authority. This supplies the declared prior result
