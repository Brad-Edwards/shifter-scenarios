        stale_or_replayed: Reject stale, expired, consumed, or cross-checkpoint material unless the exact record is an
          immutable historical read.
        cross_tenant: Never resolve, join, mutate, or disclose another tenant instance's state.
      transition_contract: Recover the actual last-inspection entry, including its asset, inspection date, and completion
        state, with a valid interpretation of its record integrity. Finding isolated readable strings is insufficient.
      evidence_contract:
        producer: a-instruments/independent-instruments writes the primary immutable audit; caller output alone is insufficient.
