    text: |
      schema: arwc.service-contract/v1
      record_key: a-valid-maintenance-record
      owner:
        node: a-instruments
        application: independent-instruments
      surface_bindings:
      - a-control.a-instruments/independent-instruments/a-valid-maintenance-record
      - a-control.a-instruments/filesystem:/var/lib/arwc-instruments/artifacts/a-valid-maintenance-record
      starting_state: Parser accepts the highest committed valid sequence; edit must respect NOR 1-to-0 programming, erase-page
        collateral records, and wear map WEAR-FIT-204-R6.
      narrative_reuse: []
      process_contract_refs: []
      mechanic_profile:
        kind: NOR flash append and erase semantics
        behavior_contract: Each 64-byte little-endian record is magic F204 at 0x00, sequence u32 at 0x04, payload length
          u16 at 0x08, status at 0x0a, status markers at 0x0b, up to 44 payload bytes at 0x0c, CRC32C over bytes 0x00..0x37
          at 0x38, three erased reserved bytes at 0x3c, and commit byte at 0x3f. A committed record has commit=0x00; 0xff
          is incomplete. Pages are 4096 bytes, programming only changes 1 to 0, and an erase resets a whole page to 0xff
          while incrementing that page's declared wear count.
        normal_behavior: The declared route returns or changes only the ordinary caller-scoped object when all current
          identity, tenant, revision, and process bindings are valid.
        accepted_effect: Recover the actual last-inspection entry, including its asset, inspection date, and completion
          state, with a valid interpretation of its record integrity. Finding isolated readable strings is insufficient.
