  k11-2-learn-its-instructions:
    type: file
    target: k-delivery.k-source
    path: /var/lib/gitea/exercise-artifacts/contracts/learn-its-instructions.yaml
    description: Service configuration contract. Only starting_state is seeded; transition_contract defines normal
