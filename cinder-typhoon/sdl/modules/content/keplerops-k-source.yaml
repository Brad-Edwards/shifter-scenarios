        node: k-source
        authority: Gitea release history on k-source
      surface_bindings:
      - k-delivery.k-source/gitea/repository-content
      starting_state: Accepted lineage fieldkest-release-2026; deleted encrypted Ed25519
        signing seed in reachable commit; encryption passphrase split between release rollover
        record and signer history.
      mechanic_profile:
        algorithm: Ed25519
        lineage: fieldkest-release-2026
        key_id: fk-release-2026-old
        seed: 32 deterministic bytes from HKDF-SHA256(ikm=UTF-8 CinderTyphoon-K29.2, salt=UTF-8
