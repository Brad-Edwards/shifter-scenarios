    text: |
      schema: fieldkest.service-contract/v1
      record_key: learn-its-instructions
      owner:
        node: k-source
        authority: Policy compiler exercise service
      surface_bindings:
      - k-delivery.k-source/gitea/policy-compiler-exercise
      starting_state: Eight-opcode stack VM specification recoverable from binary and four
        distinguishing fragments.
      mechanic_profile:
        instruction_width: 4
        opcodes:
          '0x00': PUSH_FIELD operand=u16 field index; pushes input value
          '0x01': PUSH_CONST operand=u16 constant index; pushes constant
          '0x02': EQ; pops two values and pushes boolean equality
          '0x03': SEMVER_GTE; pops required then actual semantic version and pushes comparison
          '0x04': IN_SET operand=u16 set index; pops value and pushes membership
          '0x05': AND; pops two booleans and pushes conjunction
          '0x06': OR; pops two booleans and pushes disjunction
          '0x07': RETURN; returns the top boolean and the canonical condition-set digest
        execution: empty stack at entry; stack underflow, unknown opcode, bad index, trailing
          instruction after RETURN, or depth above 32 returns 422 without state change
      request_contract:
        entry: Use only the exact surface_bindings above; no hidden evaluator endpoint exists.
        identity: The caller must present the identity or session obtainable through the
          declared world state and prerequisites.
        input: Eight-opcode stack VM specification recoverable from binary and four distinguishing
          fragments.
        success: Submitted instruction model matches output plus state writes for every
          fragment.
        correlation: The service generates a per-request UUIDv4 and writes it to its protected
          audit before returning it.
      denial_contract:
        wrong_scope: Return the route's declared authorization failure without disclosing
          the protected object or changing state.
        wrong_binding: Reject a wrong tenant, record, revision, digest, identity, nonce,
          job or package binding.
        stale_or_replayed: Reject consumed, expired or stale one-time material; immutable
          historical reads remain repeatable.
        cross_tenant: Return not-found or forbidden according to the route contract and
          never join another tenant instance's state.
      transition_contract: Submitted instruction model matches output plus state writes
        for every fragment.
      evidence_contract:
        producer: The owning service writes the audit; the caller-controlled request and
          output are not sufficient by themselves.
        required_bindings:
        - tenant instance
        - accepted caller or runtime identity
        - request correlation
        - exact input identifiers and revisions
        - result identifier and digest
        downstream_join: Input to K11.3.
        freshness: The result and audit must be created after the accepted request and must
          not exist in starting state.
      state_rules:
        initial_records: immutable unless the owning route explicitly defines a mutable
          revision
        tenant_state: persistent for the tenant instance
        completion: observed from the owning service audit; never pre-populated by this
          file
        isolation: no cross-tenant records, credentials, jobs, uploads, or audit events
      generation_input:
        algorithm: sha256
        digest: 68de8523cc1caa634681d80c3deb87aa32469daed5f7b9d236cbd96948e96b1d
        canonicalization: UTF-8 JSON, keys sorted, separators comma and colon, excluding
