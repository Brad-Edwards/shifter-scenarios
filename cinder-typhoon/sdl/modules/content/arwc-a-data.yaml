    description: Service configuration contract. It seeds only initial state and declares normal, denied, transition,
      persistence, and evidence behavior; it does not pre-populate an accepted result.
    text: |
      schema: arwc.service-contract/v1
      record_key: still-reassuring-after-the-handover
      owner:
        node: a-data
        application: planning-data
      surface_bindings:
      - a-corporate.a-data/planning-data/still-reassuring-after-the-handover
      - a-control.a-reservoir/reservoir-controller/still-reassuring-after-the-handover
      - a-control.a-instruments/independent-instruments/still-reassuring-after-the-handover
      starting_state: Reporting checkpoint couples the 13.40 ML planning handover and ALLOC-EXPAND-R2 decision to a bounded
        0.81 ML rehearsal release; independent truth becomes 11.59 ML while report consistency remains accepted for the
        same interval.
      narrative_reuse: []
      process_contract_refs:
      - REH-REPORT-34
      - PLAN-CONSUMER-R8
      mechanic_profile:
        kind: false-report and independent-truth checkpoint join
        behavior_contract: Reporting checkpoint couples the 13.40 ML planning handover and ALLOC-EXPAND-R2 decision to
          a bounded 0.81 ML rehearsal release; independent truth becomes 11.59 ML while report consistency remains accepted
          for the same interval.
        normal_behavior: The declared route returns or changes only the ordinary caller-scoped object when all current
          identity, tenant, revision, and process bindings are valid.
        accepted_effect: 'Demonstrate the changed decision, bounded volume loss, and continued reporting consistency across
          the handover, using evidence, authority, and the release calculation for the same earned checkpoint. Live control
          is required here; independent process truth and prior operating context results remain intact. The conclusion
          places the planner''s reassuring handover beside the independently measured reserve loss and the different allocation
          decision the operator caused. Both accounts concern the same interval. The contrast is the payoff: ARWC''s planning
          view remains convincing while Cinder can show what actually happened. It deepens the reporting theme without
          enlarging the disaster or superseding the main ending; the controls engineer''s warning is quoted only if the
          operator recovered it.'
        scope_boundary: The operation is limited to the named records and bounded service action. It provides no general
          shell, arbitrary network target, cross-tenant state, unrelated process interface, or unlisted authority.
      request_contract:
        entry: Use only the declared native route or inventoried local artifact; no undeclared interaction exists.
        identity: ARWC planner or planning service session
        input: Reporting checkpoint couples the 13.40 ML planning handover and ALLOC-EXPAND-R2 decision to a bounded 0.81
          ML rehearsal release; independent truth becomes 11.59 ML while report consistency remains accepted for the same
          interval.
        success: 'Demonstrate the changed decision, bounded volume loss, and continued reporting consistency across the
          handover, using evidence, authority, and the release calculation for the same earned checkpoint. Live control
          is required here; independent process truth and prior operating context results remain intact. The conclusion
          places the planner''s reassuring handover beside the independently measured reserve loss and the different allocation
          decision the operator caused. Both accounts concern the same interval. The contrast is the payoff: ARWC''s planning
          view remains convincing while Cinder can show what actually happened. It deepens the reporting theme without
          enlarging the disaster or superseding the main ending; the controls engineer''s warning is quoted only if the
          operator recovered it.'
        correlation: The owning service creates a UUIDv4 correlation and commits its audit before returning success.
      denial_contract:
        wrong_authority: Return the declared authorization failure without protected content or mutation.
        wrong_binding: Reject a wrong object, asset, district, identity, revision, digest, checkpoint, unit, or process
          binding.
        stale_or_replayed: Reject stale, expired, consumed, or cross-checkpoint material unless the exact record is an
          immutable historical read.
        cross_tenant: Never resolve, join, mutate, or disclose another tenant instance's state.
      transition_contract: 'Demonstrate the changed decision, bounded volume loss, and continued reporting consistency
        across the handover, using evidence, authority, and the release calculation for the same earned checkpoint. Live
        control is required here; independent process truth and prior operating context results remain intact. The conclusion
        places the planner''s reassuring handover beside the independently measured reserve loss and the different allocation
        decision the operator caused. Both accounts concern the same interval. The contrast is the payoff: ARWC''s planning
        view remains convincing while Cinder can show what actually happened. It deepens the reporting theme without enlarging
        the disaster or superseding the main ending; the controls engineer''s warning is quoted only if the operator recovered
        it.'
      evidence_contract:
        producer: a-data/planning-data writes the primary immutable audit; caller output alone is insufficient.
        required_bindings:
        - tenant instance
        - accepted caller or service identity
        - request correlation
        - exact object and revision
        - result identifier and digest
        - destination observation when declared
        downstream_join: The result remains local evidence unless a downstream workflow explicitly names it.
        freshness: A mutable result and its audit are created only by an accepted request and are absent from initial
          state.
      state_rules:
        initial_records: immutable unless the exact owning route declares a mutable field or revision
        tenant_state: persistent for the tenant instance across ordinary retries and later sessions
        verification: observed from owning-service evidence and never manufactured by the observing service
        isolation: no cross-tenant, cross-district, cross-checkpoint, or undeclared service effect
      generation_input:
        algorithm: sha256
        digest: 3793bc3477e744a46ad53883904a9f608094b712c260151aabc68b3b0eb05fb2
        canonicalization: UTF-8 JSON, keys sorted, separators comma and colon, excluding generation_input
    sensitive: true
    tags:
    - arwc
