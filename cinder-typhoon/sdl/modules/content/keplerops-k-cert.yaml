name: cinder-keplerops-k-cert
version: 0.1.0
semantic_revision: raes-progressive-semantics/v1
module:
  id: cinder-typhoon/keplerops-k-cert
  version: 0.1.0
  exports:
    content:
    - k19-1-who-vouches-for-whom
    - k19-2-borrowed-colleague
realization:
  default: open
content:
  k19-1-who-vouches-for-whom:
    type: file
    target: k-corporate.k-cert
    path: /var/lib/keplerops-cert/contracts/who-vouches-for-whom.yaml
    description: Service configuration contract. Only starting_state is seeded; transition_contract defines normal
      service behavior and independently owned audit, and does not pre-populate an accepted result.
    text: |
      schema: fieldkest.service-contract/v1
      record_key: who-vouches-for-whom
      owner:
        node: k-cert
        authority: Staff directory + certificate authority on k-cert
      surface_bindings:
      - k-corporate.k-cert/staff-enrollment/enrollment-record
      - k-corporate.k-staff/staff-workplace/service-directory
      starting_state: Directory supplies the enrollment record URI and archive subject;
        StaffArchiveUser supplies client-auth EKU, enrollee-supplied UPN format and suffix,
        and support/runner enrollment grant.
      mechanic_profile:
        template: StaffArchiveUser
        eku:
        - 1.3.6.1.5.5.7.3.2 clientAuth
        subject_rule: enrollee supplies UPN SAN; requester must have support or runner enrollment
          role
        discovery: the staff directory returns the enrollment record URI and archive subject;
          the template returns the UPN suffix
      request_contract:
        entry: Use only the exact surface_bindings above; no hidden evaluator endpoint exists.
        identity: The caller must present the identity or session obtainable through the
          declared world state and prerequisites.
        input: Directory supplies the enrollment record URI and archive subject; StaffArchiveUser
          supplies client-auth EKU, enrollee-supplied UPN format and suffix, and support/runner
          enrollment grant.
        success: Protected template/trust read.
        correlation: The service generates a per-request UUIDv4 and writes it to its protected
          audit before returning it.
      denial_contract:
        wrong_scope: Return the route's declared authorization failure without disclosing
          the protected object or changing state.
        wrong_binding: Reject a wrong tenant, record, revision, digest, identity, nonce,
          job or package binding.
        stale_or_replayed: Reject consumed, expired or stale one-time material; immutable
          historical reads remain repeatable.
        cross_tenant: Return not-found or forbidden according to the route contract and
          never join another tenant instance's state.
      transition_contract: Protected template/trust read.
      evidence_contract:
        producer: The owning service writes the audit; the caller-controlled request and
          output are not sufficient by themselves.
        required_bindings:
        - tenant instance
        - accepted caller or runtime identity
        - request correlation
        - exact input identifiers and revisions
        - result identifier and digest
        downstream_join: Input to K19.2.
        freshness: The result and audit must be created after the accepted request and must
          not exist in starting state.
      state_rules:
        initial_records: immutable unless the owning route explicitly defines a mutable
          revision
        tenant_state: persistent for the tenant instance
        completion: observed from the owning service audit; never pre-populated by this
          file
        isolation: no cross-tenant records, credentials, jobs, uploads, or audit events
      generation_input:
        algorithm: sha256
        digest: 3d0d7ec656858a28fbe21645e860417cf1128bc32f894de5bf8cdb8d47559954
        canonicalization: UTF-8 JSON, keys sorted, separators comma and colon, excluding
          generation_input
    sensitive: true
    tags:
    - keplerops
    - service-contract
    - k-cert
    - persistent-tenant-state
  k19-2-borrowed-colleague:
    type: file
    target: k-corporate.k-cert
    path: /var/lib/keplerops-cert/contracts/borrowed-colleague.yaml
    description: Service configuration contract. Only starting_state is seeded; transition_contract defines normal
      service behavior and independently owned audit, and does not pre-populate an accepted result.
    text: |
      schema: fieldkest.service-contract/v1
      record_key: borrowed-colleague
      owner:
        node: k-cert
        authority: Certificate service + staff archive
      surface_bindings:
      - k-corporate.k-cert/staff-enrollment/enroll-staff-archive
      - k-corporate.k-staff/staff-workplace/archive-handover
      starting_state: Enrollment permits requested UPN for active staff without comparing
        it to requester; target evan.calderoux has protected archive handover.
      mechanic_profile:
        requested_upn: evan.calderoux@KEPLEROPS.TEST
        defect: the CA checks that requested UPN is active staff but does not compare it
          with the authenticated requester
        mapping: the staff archive maps the UPN SAN to evan.calderoux and requires the clientAuth
          EKU
      request_contract:
        entry: Use only the exact surface_bindings above; no hidden evaluator endpoint exists.
        identity: The caller must present the identity or session obtainable through the
          declared world state and prerequisites.
        input: Enrollment permits requested UPN for active staff without comparing it to
          requester; target evan.calderoux has protected archive handover.
        success: Issued client certificate/private key and successful mTLS handover read
          as Evan.
        correlation: The service generates a per-request UUIDv4 and writes it to its protected
          audit before returning it.
      denial_contract:
        wrong_scope: Return the route's declared authorization failure without disclosing
          the protected object or changing state.
        wrong_binding: Reject a wrong tenant, record, revision, digest, identity, nonce,
          job or package binding.
        stale_or_replayed: Reject consumed, expired or stale one-time material; immutable
          historical reads remain repeatable.
        cross_tenant: Return not-found or forbidden according to the route contract and
          never join another tenant instance's state.
      transition_contract: Issued client certificate/private key and successful mTLS handover
        read as Evan.
      evidence_contract:
        producer: The owning service writes the audit; the caller-controlled request and
          output are not sufficient by themselves.
        required_bindings:
        - tenant instance
        - accepted caller or runtime identity
        - request correlation
        - exact input identifiers and revisions
        - result identifier and digest
        downstream_join: Usable colleague identity.
        freshness: The result and audit must be created after the accepted request and must
          not exist in starting state.
      state_rules:
        initial_records: immutable unless the owning route explicitly defines a mutable
          revision
        tenant_state: persistent for the tenant instance
        completion: observed from the owning service audit; never pre-populated by this
          file
        isolation: no cross-tenant records, credentials, jobs, uploads, or audit events
      generation_input:
        algorithm: sha256
        digest: 82ae6575abd39d961d77101e588a7e3bc1402ea3281a0d3d615dcedca14bd326
        canonicalization: UTF-8 JSON, keys sorted, separators comma and colon, excluding
          generation_input
    sensitive: true
    tags:
    - keplerops
    - service-contract
    - k-cert
    - persistent-tenant-state
