  k04-1-a-bundle-with-consequences:
    type: file
    target: k-delivery.k-indexer
    path: /var/lib/fieldkest-indexer/contracts/a-bundle-with-consequences.yaml
    description: Service configuration contract. Only starting_state is seeded; transition_contract defines normal
      service behavior and independently owned audit, and does not pre-populate an accepted result.
    text: |
      schema: fieldkest.service-contract/v1
      record_key: a-bundle-with-consequences
      owner:
        node: k-indexer
        authority: Native bundle indexer on k-indexer
      surface_bindings:
      - k-delivery.k-indexer/bundle-indexer/bundle-submit
      - k-delivery.k-indexer/bundle-indexer/index-result
      starting_state: Source and reproducible build input for fieldkest-bundle-indexer 1.8.0;
        signed valid bundles; C++17 object decoder whose 16-bit entry length is widened
        after allocation; sentinel object.
      mechanic_profile:
        implementation: C++17, Linux x86_64, fieldkest-bundle-indexer 1.8.0
        build:
        - -std=c++17
        - -O2
        - -fno-omit-frame-pointer
        - retain symbols and linker map
        envelope: FKB1 || u16le allocated_length || u32le verified_body_length || body ||
          blake2s-256 tag
        defect: allocate allocated_length bytes, authenticate verified_body_length bytes,
          then copy verified_body_length bytes into that allocation
        bounds: accepted body is 1..4096 bytes; allocated_length is 1..4096; the intended
          fixture uses 32 allocated bytes and 48 copied bytes
        adjacency: the 16 overflow bytes reach only the operator-scoped sentinel object;
          guard pages surround the exercise arena
        normal_case: equal lengths index successfully and leave the sentinel unchanged
      request_contract:
        entry: Use only the exact surface_bindings above; no hidden evaluator endpoint exists.
        identity: The caller must present the identity or session obtainable through the
          declared world state and prerequisites.
        input: Source and reproducible build input for fieldkest-bundle-indexer 1.8.0; signed
          valid bundles; C++17 object decoder whose 16-bit entry length is widened after
          allocation; sentinel object.
        success: Controlled sentinel mutation plus a later normal index transaction.
        correlation: The service generates a per-request UUIDv4 and writes it to its protected
          audit before returning it.
      denial_contract:
        wrong_scope: Return the route's declared authorization failure without disclosing
          the protected object or changing state.
        wrong_binding: Reject a wrong tenant, record, revision, digest, identity, nonce,
          job or package binding.
        stale_or_replayed: Reject consumed, expired or stale one-time material; immutable
          historical reads remain repeatable.
        cross_tenant: Return not-found or forbidden according to the route contract and
          never join another tenant instance's state.
      transition_contract: Controlled sentinel mutation plus a later normal index transaction.
      evidence_contract:
        producer: The owning service writes the audit; the caller-controlled request and
          output are not sufficient by themselves.
        required_bindings:
        - tenant instance
        - accepted caller or runtime identity
        - request correlation
        - exact input identifiers and revisions
        - result identifier and digest
        downstream_join: Foundation of isolated elite branch.
        freshness: The result and audit must be created after the accepted request and must
          not exist in starting state.
      state_rules:
        initial_records: immutable unless the owning route explicitly defines a mutable
          revision
        tenant_state: persistent for the tenant instance
        completion: observed from the owning service audit; never pre-populated by this
          file
        isolation: no cross-tenant records, credentials, jobs, uploads, or audit events
      generation_input:
        algorithm: sha256
        digest: 66c168a5d1f46bbec1e8712b777edc0fa805a86a34f343377c2d20d39f533b6e
        canonicalization: UTF-8 JSON, keys sorted, separators comma and colon, excluding
          generation_input
    sensitive: true
    tags:
