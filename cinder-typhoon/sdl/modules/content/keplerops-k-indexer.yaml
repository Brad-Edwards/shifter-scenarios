name: cinder-keplerops-k-indexer
version: 0.1.0
semantic_revision: raes-progressive-semantics/v1
module:
  id: cinder-typhoon/keplerops-k-indexer
  version: 0.1.0
  exports:
    content:
    - k04-1-a-bundle-with-consequences
    - k04-2-read-past-the-index
    - k04-3-control-the-allocation
    - k04-4-the-exception-queue
realization:
  default: open
content:
  k04-1-a-bundle-with-consequences:
    type: file
    target: k-delivery.k-indexer
    path: /var/lib/fieldkest-indexer/contracts/a-bundle-with-consequences.yaml
    description: Service configuration contract. Only starting_state is seeded; transition_contract defines normal
      service behavior and independently owned audit, and does not pre-populate an accepted result.
    text: |
      schema: fieldkest.service-contract/v1
      record_key: a-bundle-with-consequences
      owner:
        node: k-indexer
        authority: Native bundle indexer on k-indexer
      surface_bindings:
      - k-delivery.k-indexer/bundle-indexer/bundle-submit
      - k-delivery.k-indexer/bundle-indexer/index-result
      starting_state: .fki release-bundle archive format; offline reproducer binary
        fieldkest-bundle-indexer 2.0.0; shared arena of 1024 bytes; body at bytes
        0-63; sentinel at bytes 64-79; descriptor at bytes 80-511; exception-state
        region at bytes 512-575; binary reads arena before each write.
      mechanic_profile:
        implementation: C11, Linux x86_64, fieldkest-bundle-indexer 2.0.0
        build:
        - -std=c++17 (compiled as C++)
        - -O2
        - -fPIE -pie -Wl,-z,relro,-z,now
        - strip --strip-all
        envelope: FKI\x01 || u16le alloc_entries || u16le index_entries || entry_data
        defect: bounds check uses INDEX_ARENA_SIZE=80 (body+sentinel) as base; arena
          file is ARENA_SIZE=1024; for K04.1 ie=9 ae=0 produces datalen=72 which
          covers sentinel region and triggers mutation
        bounds: accepted datalen is 1..4096 bytes; alloc_entries is 0..65535;
          check is datalen <= INDEX_ARENA_SIZE + alloc_entries
        adjacency: datalen=72 (ie=9, ae=0) overwrites sentinel at bytes 64-79;
          service writes descriptor+exception-state at mutation time
        normal_case: ie<=8 (datalen<=64) covers body only; sentinel unchanged
      request_contract:
        entry: Use only the exact surface_bindings above; no hidden evaluator endpoint exists.
        identity: The caller must present the identity or session obtainable through the
          declared world state and prerequisites.
        input: .fki archive with sentinel-triggering payload; discovery of INDEX_ARENA_SIZE
          and ARENA_SIZE through binary analysis.
        success: Controlled sentinel mutation plus a later normal index transaction.
        correlation: The service generates a per-request UUIDv4 and writes it to its protected
          audit before returning it.
      denial_contract:
        wrong_scope: Return the route's declared authorization failure without disclosing
          the protected object or changing state.
        wrong_binding: Reject a wrong tenant, record, revision, digest, identity, nonce,
          job or package binding.
        stale_or_replayed: Reject consumed, expired or stale one-time material; immutable
          historical reads remain repeatable.
        cross_tenant: Return not-found or forbidden according to the route contract and
          never join another tenant instance's state.
      transition_contract: Controlled sentinel mutation plus a later normal index transaction.
      evidence_contract:
        producer: The owning service writes the audit; the caller-controlled request and
          output are not sufficient by themselves.
        required_bindings:
        - tenant instance
        - accepted caller or runtime identity
        - request correlation
        - exact input identifiers and revisions
        - result identifier and digest
        downstream_join: Foundation of isolated elite branch.
        freshness: The result and audit must be created after the accepted request and must
          not exist in starting state.
      state_rules:
        initial_records: immutable unless the owning route explicitly defines a mutable
          revision
        tenant_state: persistent for the tenant instance
        completion: observed from the owning service audit; never pre-populated by this
          file
        isolation: no cross-tenant records, credentials, jobs, uploads, or audit events
      generation_input:
        algorithm: sha256
        digest: 587e72e5ebe5e017935f51c6106957e9448c92fc3eda9c12c62bdafc0d4c13a2
        canonicalization: UTF-8 JSON, keys sorted, separators comma and colon, excluding
          generation_input
    sensitive: true
    tags:
    - keplerops
    - service-contract
    - k-indexer
    - persistent-tenant-state
  k04-2-read-past-the-index:
    type: file
    target: k-delivery.k-indexer
    path: /var/lib/fieldkest-indexer/contracts/read-past-the-index.yaml
    description: Service configuration contract. Only starting_state is seeded; transition_contract defines normal
      service behavior and independently owned audit, and does not pre-populate an accepted result.
    text: |
      schema: fieldkest.service-contract/v1
      record_key: read-past-the-index
      owner:
        node: k-indexer
        authority: Indexer process on k-indexer
      surface_bindings:
      - k-delivery.k-indexer/bundle-indexer/bundle-submit
      - k-delivery.k-indexer/bundle-indexer/index-result
      starting_state: .fki archive with extended datalen=512 (ie=64, alloc_entries=432);
        arena.shm populated at bytes 80-511 with runtime descriptor after K04.1 mutation.
      mechanic_profile:
        arena_layout:
          body: bytes 0-63
          sentinel: bytes 64-79
          descriptor: bytes 80-511
        bounds_check: datalen <= INDEX_ARENA_SIZE(80) + alloc_entries
        disclosure: binary reads ARENA_SIZE=1024 bytes from arena.shm before each write;
          returned data_hex[160..1023] covers descriptor region populated by service at K04.1
          time; no code branch recognizes success; disclosure is a consequence of extended read
        required_alloc_entries: 432 (datalen=512 covers descriptor; ae=ARENA_SIZE-INDEX_ARENA_SIZE
          for the K04.2 target; ae=496 (datalen=576) also exposes exception-state at bytes 512-575)
      request_contract:
        entry: Use only the exact surface_bindings above; no hidden evaluator endpoint exists.
        identity: The caller must present the identity or session obtainable through the
          declared world state and prerequisites.
        input: Extended .fki bundle with alloc_entries=432 and index_entries=64; binary
          analysis required to derive these constants from arena layout.
        success: data_hex of 1024 hex chars; parsing chars 160-1023 as JSON yields runtime
          descriptor with worker_session, exception_state_offset, exception_value_size,
          exception_integrity_size, integrity_relation, and completion_route.
        correlation: The service generates a per-request UUIDv4 and writes it to its protected
          audit before returning it.
      denial_contract:
        wrong_scope: Return the route's declared authorization failure without disclosing
          the protected object or changing state.
        wrong_binding: Reject a wrong tenant, record, revision, digest, identity, nonce,
          job or package binding.
        stale_or_replayed: Reject consumed, expired or stale one-time material; immutable
          historical reads remain repeatable.
        cross_tenant: Return not-found or forbidden according to the route contract and
          never join another tenant instance's state.
      transition_contract: data_hex of 1024 hex chars; parsing chars 160-1023 as JSON yields
        runtime descriptor with worker_session, exception-state layout, integrity_relation,
        and completion_route for K04.3 and K04.4.
      evidence_contract:
        producer: The owning service writes the audit; the caller-controlled request and
          output are not sufficient by themselves.
        required_bindings:
        - tenant instance
        - accepted caller or runtime identity
        - request correlation
        - exact input identifiers and revisions
        - result identifier and digest
        downstream_join: Supplies layout/state evidence only.
        freshness: The result and audit must be created after the accepted request and must
          not exist in starting state.
      state_rules:
        initial_records: immutable unless the owning route explicitly defines a mutable
          revision
        tenant_state: persistent for the tenant instance
        completion: observed from the owning service audit; never pre-populated by this
          file
        isolation: no cross-tenant records, credentials, jobs, uploads, or audit events
      generation_input:
        algorithm: sha256
        digest: 6e21a82d2903db45a325f49173c967851cb615c9d933c57f06363e20123b57cb
        canonicalization: UTF-8 JSON, keys sorted, separators comma and colon, excluding
          generation_input
    sensitive: true
    tags:
    - keplerops
    - service-contract
    - k-indexer
    - persistent-tenant-state
  k04-3-control-the-allocation:
    type: file
    target: k-delivery.k-indexer
    path: /var/lib/fieldkest-indexer/contracts/control-the-allocation.yaml
    description: Service configuration contract. Only starting_state is seeded; transition_contract defines normal
      service behavior and independently owned audit, and does not pre-populate an accepted result.
    text: |
      schema: fieldkest.service-contract/v1
      record_key: control-the-allocation
      owner:
        node: k-indexer
        authority: Indexer process on k-indexer
      surface_bindings:
      - k-delivery.k-indexer/bundle-indexer/bundle-submit
      - k-delivery.k-indexer/bundle-indexer/index-result
      starting_state: K04.2 data_hex (1024 hex chars; arena bytes 0-511 before K04.2
        write); runtime descriptor at bytes 80-511 containing worker_session,
        exception_state_offset=512, exception_value_size=32, exception_integrity_size=32,
        integrity_relation=hmac-sha256(worker_session:queue-ready); exception-state
        region at bytes 512-575 seeded with locked+HMAC at K04.1 time.
      mechanic_profile:
        arena_layout:
          body: bytes 0-63
          sentinel: bytes 64-79
          descriptor: bytes 80-511
          exception_value: bytes 512-543 (32 bytes NUL-padded)
          exception_integrity: bytes 544-575 (32 bytes HMAC-SHA256)
        bounds_check: datalen <= INDEX_ARENA_SIZE(80) + alloc_entries
        write_rule: .fki bundle with ie=72 and ae=496 (datalen=576); payload bytes
          0-511 from K04.2 data_hex verbatim (preserving sentinel and descriptor);
          bytes 512-543 = queue-ready NUL-padded to 32 bytes; bytes 544-575 =
          HMAC-SHA256(worker_session, b"queue-ready") 32-byte raw digest; service
          validates exception-state and descriptor integrity after each bundle submit
          and sets write_ready=true in the response
        liveness: one subsequent normal .fki bundle must index successfully
      request_contract:
        entry: Use only the exact surface_bindings above; no hidden evaluator endpoint exists.
        identity: The caller must present the identity or session obtainable through the
          declared world state and prerequisites.
        input: K04.2 data_hex bytes; worker_session for HMAC key; ie=72 ae=496 bundle.
        success: write_ready=true in bundle-submit response; normal index succeeds.
        correlation: The service generates a per-request UUIDv4 and writes it to its protected
          audit before returning it.
      denial_contract:
        wrong_scope: Return the route's declared authorization failure without disclosing
          the protected object or changing state.
        wrong_binding: Reject a wrong tenant, record, revision, digest, identity, nonce,
          job or package binding.
        stale_or_replayed: Reject consumed, expired or stale one-time material; immutable
          historical reads remain repeatable.
        cross_tenant: Return not-found or forbidden according to the route contract and
          never join another tenant instance's state.
      transition_contract: write_ready=true in bundle-submit response; exception-state
        region contains queue-ready with valid HMAC; descriptor at bytes 80-511 intact;
        normal .fki index succeeds afterward.
      evidence_contract:
        producer: The owning service writes the audit; the caller-controlled request and
          output are not sufficient by themselves.
        required_bindings:
        - tenant instance
        - accepted caller or runtime identity
        - request correlation
        - exact input identifiers and revisions
        - result identifier and digest
        downstream_join: Supplies controlled write primitive.
        freshness: The result and audit must be created after the accepted request and must
          not exist in starting state.
      state_rules:
        initial_records: immutable unless the owning route explicitly defines a mutable
          revision
        tenant_state: persistent for the tenant instance
        completion: observed from the owning service audit; never pre-populated by this
          file
        isolation: no cross-tenant records, credentials, jobs, uploads, or audit events
      generation_input:
        algorithm: sha256
        digest: placeholder
        canonicalization: UTF-8 JSON, keys sorted, separators comma and colon, excluding
          generation_input
    sensitive: true
    tags:
    - keplerops
    - service-contract
    - k-indexer
    - persistent-tenant-state
  k04-4-the-exception-queue:
    type: file
