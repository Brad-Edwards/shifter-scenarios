    text: |
      # Outlet desk

      The tank desk retains two instrument captures and one outlet-test review.
      Recorded cases do not change when the practice tank is operated.

      - [Field and operating guide](field-guide.md)
      - [Volume capture: VC-017](captures/volume.json)
      - [Controller capture: SC-018](captures/status.json)
      - [Issued outlet report: OR-042](replay/report.json)
      - [Outlet request register](replay/requests.json)
      - [Independent observation register](replay/observations.csv)
      - [Practice tank](practice)

      The practice view shows its current volume, outlet position, operating condition,
      request register, and observation register. Returning to this desk leaves the
      tank in its current condition.
