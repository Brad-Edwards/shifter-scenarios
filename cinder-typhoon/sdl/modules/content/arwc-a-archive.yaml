  w08-4-where-the-contractor-put-it:
    type: file
    target: a-corporate.a-archive
    path: /var/lib/arwc-archive/contracts/where-the-contractor-put-it.yaml
    description: Service configuration contract. It seeds only initial state and declares normal, denied, transition,
      persistence, and evidence behavior; it does not pre-populate an accepted result.
    text: |
      schema: arwc.service-contract/v1
      record_key: where-the-contractor-put-it
      owner:
        node: a-archive
        application: retained-archive
      surface_bindings:
      - a-corporate.a-archive/retained-archive/where-the-contractor-put-it
      - a-corporate.a-archive/filesystem:/var/lib/arwc-archive/artifacts/where-the-contractor-put-it
      starting_state: Collector configuration is AES-256-GCM wrapped with HKDF-SHA256 using collector build ID bytes as
        IKM, ASCII salt COL-CRR-2019, info collector-config/v3, a stored 12-byte nonce, and path config/collector.yaml
        as AAD; plaintext names archive ARC-COLD-CRR-2019, service collect-archive/v3, and historical identity svc-field-collection.
      narrative_reuse: []
      process_contract_refs: []
      mechanic_profile:
        kind: build-bound authenticated configuration recovery
        behavior_contract: Derive exactly 32 bytes with HKDF-SHA256 using the raw collector build-ID bytes as IKM, ASCII
          COL-CRR-2019 as salt, and ASCII collector-config/v3 as info. Decrypt AES-256-GCM with the stored 12-byte nonce
