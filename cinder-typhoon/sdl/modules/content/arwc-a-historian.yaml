content:
  w18-1-the-tag-export:
    type: file
    target: a-engineering.a-historian
    path: /var/lib/arwc-historian/contracts/the-tag-export.yaml
    description: Service configuration contract. It seeds only initial state and declares normal, denied, transition,
      persistence, and evidence behavior; it does not pre-populate an accepted result.
    text: |
      schema: arwc.service-contract/v1
      record_key: the-tag-export
      owner:
        node: a-historian
        application: process-historian
      surface_bindings:
      - a-engineering.a-historian/process-historian/the-tag-export
      starting_state: Engineering export TAGS-CRR-R21 lists outlet command, position, and flow tags with project revision
        CRR-CTRL-R21 and ambiguous legacy group labels.
      narrative_reuse: []
      process_contract_refs:
      - MAP-OG2-R8
      - CRR-CTRL-R21
      mechanic_profile:
        kind: exact record, protocol, authorization, or process interpretation
        behavior_contract: Engineering export TAGS-CRR-R21 lists outlet command, position, and flow tags with project
          revision CRR-CTRL-R21 and ambiguous legacy group labels.
        normal_behavior: The declared route returns or changes only the ordinary caller-scoped object when all current
          identity, tenant, revision, and process bindings are valid.
        accepted_effect: Recover the actual export and its revision binding. Its names alone do not prove which outlet
          moves.
        scope_boundary: The operation is limited to the named records and bounded service action. It provides no general
          shell, arbitrary network target, cross-tenant state, unrelated process interface, or unlisted authority.
      request_contract:
        entry: Use only the declared native route or inventoried local artifact; no undeclared interaction exists.
        identity: ARWC scoped OT read session
        input: Engineering export TAGS-CRR-R21 lists outlet command, position, and flow tags with project revision CRR-CTRL-R21
          and ambiguous legacy group labels.
        success: Recover the actual export and its revision binding. Its names alone do not prove which outlet moves.
        correlation: The owning service creates a UUIDv4 correlation and commits its audit before returning success.
      denial_contract:
        wrong_authority: Return the declared authorization failure without protected content or mutation.
        wrong_binding: Reject a wrong object, asset, district, identity, revision, digest, checkpoint, unit, or process
          binding.
        stale_or_replayed: Reject stale, expired, consumed, or cross-checkpoint material unless the exact record is an
          immutable historical read.
        cross_tenant: Never resolve, join, mutate, or disclose another tenant instance's state.
      transition_contract: Recover the actual export and its revision binding. Its names alone do not prove which outlet
        moves.
      evidence_contract:
        producer: a-historian/process-historian writes the primary immutable audit; caller output alone is insufficient.
        required_bindings:
        - tenant instance
        - accepted caller or service identity
        - request correlation
        - exact object and revision
        - result identifier and digest
        - destination observation when declared
        downstream_join: The result remains local evidence unless a downstream workflow explicitly names it.
        freshness: A mutable result and its audit are created only by an accepted request and are absent from initial
          state.
      state_rules:
        initial_records: immutable unless the exact owning route declares a mutable field or revision
        tenant_state: persistent for the tenant instance across ordinary retries and later sessions
        verification: observed from owning-service evidence and never manufactured by the observing service
        isolation: no cross-tenant, cross-district, cross-checkpoint, or undeclared service effect
      generation_input:
        algorithm: sha256
        digest: 46fcb4d067cb0391b2c56ff410810ba8f21fe0a626da99675afa0e62572ce685
        canonicalization: UTF-8 JSON, keys sorted, separators comma and colon, excluding generation_input
    sensitive: true
    tags:
    - arwc
    - service-contract
    - a-historian
    - persistent-tenant-state
