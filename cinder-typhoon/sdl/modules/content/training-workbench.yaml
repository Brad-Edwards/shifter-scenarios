name: cinder-training-workbench-content
version: 0.1.0
semantic_revision: raes-progressive-semantics/v1
module:
  id: cinder-typhoon/training-workbench-content
  version: 0.1.0
  exports:
    content:
    - workbench-index-md
    - workbench-workspace-handover-current-md
    - workbench-workspace-delivery-tracker-csv
    - workbench-workspace-repository-seed-json
    - workbench-dispatch-index-md
