content:
  k01-1-the-developer-left-a-way-back:
    type: file
    target: k-corporate.k-dev
    path: /opt/fieldkest-workbench/fixtures/the-developer-left-a-way-back.yaml
    description: Service configuration contract. Only starting_state is seeded; transition_contract defines normal
      service behavior and independently owned audit, and does not pre-populate an accepted result.
    text: |
      schema: fieldkest.service-contract/v1
      record_key: the-developer-left-a-way-back
      owner:
        node: k-dev
        authority: k-dev + native Gitea on k-source
      surface_bindings:
      - k-corporate.k-dev/filesystem:/home/rowan
      - k-delivery.k-source/gitea/protected-handover
      starting_state: Rowan's checkout at /home/rowan/work/fieldlink-connector, credential-helper
        file /home/rowan/.config/git/credentials, principal rowan.ito, read-only project
        fieldkest/fieldlink-connector, and native handover issue HND-FLK-2026-09 revision
        12.
      mechanic_profile:
        classification: service-native
        surface: saved native Git client identity and protected Gitea repository handover
          issue
        normal_case: developer authenticates through native Gitea and reads the current
          repository handover issue
        defect: retained Git client credentials still authorize the limited native repository
          identity
        bounds: the recovered identity has no push access to the connector repository and
          no operator authority
      request_contract:
        entry: Use only the exact surface_bindings above; no hidden evaluator endpoint exists.
        identity: The caller must present the identity or session obtainable through the
          declared world state and prerequisites.
        input: Rowan's checkout at /home/rowan/work/fieldlink-connector, credential-helper
          file /home/rowan/.config/git/credentials, principal rowan.ito, read-only project
          fieldkest/fieldlink-connector, and native handover issue HND-FLK-2026-09 revision
          12.
        success: Authenticated native issue response by the recovered developer identity,
          with repository writes denied.
        correlation: Bind the recovered Git identity to the protected native repository
          issue, handover identifier and revision.
      denial_contract:
        wrong_scope: Return the route's declared authorization failure without disclosing
          the protected object or changing state.
        wrong_binding: Reject a wrong tenant, record, revision, digest, identity, nonce,
          job or package binding.
        stale_or_replayed: Reject consumed, expired or stale one-time material; immutable
          historical reads remain repeatable.
        cross_tenant: Return not-found or forbidden according to the route contract and
          never join another tenant instance's state.
      transition_contract: Authenticated native issue response by the recovered developer
        identity, with repository writes denied.
      evidence_contract:
        producer: Actual authenticated Gitea repository/issue responses and their native
          object identity; no custom handover API or synthetic product audit.
        required_bindings:
        - tenant instance
        - accepted caller or runtime identity
        - request correlation
        - exact input identifiers and revisions
        - result identifier and digest
        downstream_join: Workforce identity reused; supplies G01.
        freshness: Native handover reads remain repeatable; demonstrate actual use of the
          recovered limited identity.
      state_rules:
        initial_records: immutable unless the owning route explicitly defines a mutable
          revision
        tenant_state: persistent for the tenant instance
        completion: observed from the owning service audit; never pre-populated by this
          file
        isolation: no cross-tenant records, credentials, jobs, uploads, or audit events
      generation_input:
        algorithm: sha256
        digest: bf922d938e63e3dd774336b1fdfe35150913960379f0beba0866404e3ef92363
        canonicalization: UTF-8 JSON, keys sorted, separators comma and colon, excluding
          generation_input
    sensitive: true
    tags:
    - keplerops
    - service-contract
    - k-dev
    - persistent-tenant-state
  k01-4-put-it-on-the-workbench:
    type: file
    target: k-corporate.k-dev
    path: /opt/fieldkest-workbench/fixtures/put-it-on-the-workbench.yaml
    description: Service configuration contract. Only starting_state is seeded; transition_contract defines normal
      service behavior and independently owned audit, and does not pre-populate an accepted result.
    text: |
      schema: fieldkest.service-contract/v1
      record_key: put-it-on-the-workbench
      owner:
        node: k-dev
        authority: Local FieldKest helper on k-dev
      surface_bindings:
      - k-corporate.k-dev/local-workbench/inspection-summary
      starting_state: Route /api/inspection-summary; sample /home/rowan/work/samples/FK-SAMPLE-017.json
        using fieldkest.sample/v1, asset CRR-OG2, revision FLK-7.4.2, and SHA-256 b3cbf260a332f5a8d9b0cdde64e4d22d698a5ae28c11384149126ba694edd1e6.
      mechanic_profile:
        classification: service-native
        surface: local-helper.md workbench report route; source.keplerops.test report-jobs
          API
        normal_case: developer submits the staged collection report to the workbench helper
        defect: the helper accepts any form upload; a review export submitted instead of
          the collection report is forwarded to the CI report queue
        bounds: only the report-consumer workflow is reachable; no audit or platform authority
          is granted
      request_contract:
        entry: Use only the exact surface_bindings above; no hidden evaluator endpoint exists.
        identity: The caller must present the identity or session obtainable through the
          declared world state and prerequisites.
        input: Route /api/inspection-summary; sample /home/rowan/work/samples/FK-SAMPLE-017.json
          using fieldkest.sample/v1, asset CRR-OG2, revision FLK-7.4.2, and SHA-256 b3cbf260a332f5a8d9b0cdde64e4d22d698a5ae28c11384149126ba694edd1e6.
        success: Fresh inspection receipt with input/output digests and preserved bindings.
        correlation: The service generates a per-request UUIDv4 and writes it to its protected
          audit before returning it.
      denial_contract:
        wrong_scope: Return the route's declared authorization failure without disclosing
          the protected object or changing state.
        wrong_binding: Reject a wrong tenant, record, revision, digest, identity, nonce,
          job or package binding.
        stale_or_replayed: Reject consumed, expired or stale one-time material; immutable
          historical reads remain repeatable.
        cross_tenant: Return not-found or forbidden according to the route contract and
          never join another tenant instance's state.
      transition_contract: Fresh inspection receipt with input/output digests and preserved
        bindings.
      evidence_contract:
        producer: The owning service writes the audit; the caller-controlled request and
          output are not sufficient by themselves.
        required_bindings:
        - tenant instance
        - accepted caller or runtime identity
        - request correlation
        - exact input identifiers and revisions
        - result identifier and digest
        downstream_join: Introduces stable current IDs used later.
        freshness: The result and audit must be created after the accepted request and must
          not exist in starting state.
      state_rules:
        initial_records: immutable unless the owning route explicitly defines a mutable
          revision
        tenant_state: persistent for the tenant instance
        completion: observed from the owning service audit; never pre-populated by this
          file
        isolation: no cross-tenant records, credentials, jobs, uploads, or audit events
      generation_input:
        algorithm: sha256
        digest: 61dd176fb4f0efe65a67785650ccdee564719ce113408ee3bed20282e7c7a9a5
        canonicalization: UTF-8 JSON, keys sorted, separators comma and colon, excluding
          generation_input
    sensitive: true
    tags:
    - keplerops
    - service-contract
    - k-dev
    - persistent-tenant-state
