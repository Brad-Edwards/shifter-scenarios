    text: |
      schema: fieldkest.service-contract/v1
      record_key: speak-the-package-s-language
      owner:
        node: k-registry
        authority: Native Verdaccio and FieldLink consumer check
      surface_bindings:
      - k-delivery.k-registry/verdaccio/connector-metadata
      - k-delivery.k-registry/package-registry/consumer-check
      starting_state: Actual npm connector 7.4.2; fieldkest.connector/v3; supplied consumer
        request; arwc-connector-consumer@19f43d2.
      mechanic_profile:
        classification: product-native
        package: '@keplerops/fieldlink-connector'
        version: 7.4.2
        interface: fieldkest.connector/v3
        consumer_revision: arwc-connector-consumer@19f43d2
        execution: Actual npm pack and offline module/local-file execution in the existing
          worker
      request_contract:
        entry: Use only the exact surface_bindings above; no hidden evaluator endpoint exists.
        identity: The caller must present the identity or session obtainable through the
          declared world state and prerequisites.
        input: Actual npm connector 7.4.2; fieldkest.connector/v3; supplied consumer request;
          arwc-connector-consumer@19f43d2.
        success: Fresh actual module result, selected version and archive digest.
        correlation: Use native repository commit IDs, registry versions, Jenkins build
          URLs and exact artifact digests. The report consumer also supplies its actual
          job ID and input/output digests.
      denial_contract:
        wrong_scope: Return the route's declared authorization failure without disclosing
          the protected object or changing state.
        wrong_binding: Reject a wrong tenant, record, revision, digest, identity, nonce,
          job or package binding.
        stale_or_replayed: Reject consumed, expired or stale one-time material; immutable
          historical reads remain repeatable.
        cross_tenant: Return not-found or forbidden according to the route contract and
          never join another tenant instance's state.
      transition_contract: Fresh actual module result, selected version and archive digest.
      evidence_contract:
        producer: Native Git objects, registry package state, Jenkins build records and
          actual execution artifacts; for a submitted report, the independently persisted
          support handover.
        required_bindings:
        - tenant instance
        - accepted caller or runtime identity
        - request correlation
        - exact input identifiers and revisions
        - result identifier and digest
        downstream_join: Supplies G03.
        freshness: Historical source, metadata and build reads remain repeatable. Submitted
          work requires a new native build or actual worker result, with matching input/output
          digests and downstream evidence.
      state_rules:
        initial_records: immutable unless the owning route explicitly defines a mutable
          revision
        tenant_state: persistent for the tenant instance
        completion: Correlate native build records, exact source/artifact bytes and, where
          applicable, the separately persisted support report; no synthetic product audit
          is required.
        isolation: no cross-tenant records, credentials, jobs, uploads, or audit events
      generation_input:
        algorithm: sha256
        digest: 2be68f2863497f90abf573542700173a0aedd8f4b3275b991de0c71e96df3702
        canonicalization: UTF-8 JSON, keys sorted, separators comma and colon, excluding
          generation_input
