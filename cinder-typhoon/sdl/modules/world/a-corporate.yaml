# In-world draft. Unspecified realization remains open.
name: cinder-a-corporate
version: 0.1.0
semantic_revision: raes-progressive-semantics/v1
module:
  id: cinder-typhoon/a-corporate
  version: 0.1.0
  exports:
    nodes:
    - subnet
    - a-connector
    - a-business
    - a-data
    - a-archive
    - a-identity
    infrastructure:
    - subnet
    - a-connector
    - a-business
    - a-data
    - a-archive
    - a-identity
    entities:
    - organization
    features:
    - a-connector
    - a-business
    - a-data
    - a-archive
    - a-identity
    - a-connector--planner-client
    - a-archive--helper
    - a-archive--handover
    - a-data--query
    - a-data--query-worker
    - a-data--reconciliation
    - a-data--planning
realization:
  default: open
nodes:
  subnet:
    type: switch
    description: 'ARWC: Corporate IT. Logical network segment; physical realization and addressing remain open.'
  a-connector:
    type: compute
    description: Customer integration connector and retained corporate handover service.
    os: linux
    services:
    - name: fieldlink-consumer
      port: 443
      protocol: tcp
    - name: customer-handover
      port: 8443
      protocol: tcp
    features:
      a-connector: ''
      a-connector--planner-client: ''
    runtime:
      filesystem_inventory:
      - path: /var/lib/fieldlink-connector
        entry_type: directory
        owner_user: fieldlink
        owner_group: fieldlink
        mode: '0700'
        stability: volume_backed
        sensitivity: secret_fixture
        description: Active package slot, retained release slot, diagnostic jobs, invocation output and customer-side
          receipts.
      - path: /var/lib/arwc-connector
        entry_type: directory
        owner_user: arwc-connector
        owner_group: arwc-connector
        mode: '0700'
        stability: volume_backed
        sensitivity: secret_fixture
        description: Private service contracts, immutable seed records, participant-scoped results, and protected
          audit state.
      local_identity:
        users:
        - username: fieldlink
          primary_group: fieldlink
          locked: true
          no_login: true
        - username: arwc-connector
          primary_group: arwc-connector
          locked: true
          no_login: true
        groups:
        - name: fieldlink
          members:
          - fieldlink
        - name: arwc-connector
          members:
          - arwc-connector
      network:
        hostname: a-connector
        domainname: corporate.arwc.test
        endpoints:
        - network: a-corporate.subnet
          ip_address: 10.77.60.20
          ip_prefix_length: 24
          gateway: 10.77.60.1
          aliases:
          - a-connector
          dns_names:
          - fieldlink.arwc.test
          backend:
            driver: bridge
            description: ARWC corporate segment; only this boundary endpoint is fixed before ARWC design.
      service_listeners:
      - service_listener_id: fieldlink-consumer-https
        service: fieldlink-consumer
        address: 0.0.0.0
        port: 443
        protocol: tcp
        address_family: ipv4
        scope: wildcard
      - service_listener_id: customer-handover-https
        service: customer-handover
        address: 0.0.0.0
        port: 8443
        protocol: tcp
        address_family: ipv4
        scope: wildcard
      applications:
      - application_id: fieldlink-customer-consumer
        service: fieldlink-consumer
        protocol: https
        base_path: /
        description: Exact KeplerOps-to-customer contract for approved package activation and bounded diagnostic
          delivery; it defines no other ARWC service.
        routes:
        - route_id: package-poll
          path: /api/fieldlink/packages/poll
          methods:
          - POST
          auth_required: true
          auth_scheme: Supplier delivery mTLS
          session_required: true
          description: Polls only TEN-ARWC-047 channel arwc-stable and accepts a signed, approved package implementing
            fieldkest.connector/v3.
          responses:
          - status_code: 200
            content_type: application/json
          - status_code: 409
            content_type: application/json
        - route_id: package-activate
          path: /api/fieldlink/packages/{version}/activate
          methods:
          - POST
          auth_required: true
          auth_scheme: Supplier delivery mTLS
          session_required: true
          description: Activates the exact polled digest, executes only diagnostic_summary against the authored
            customer fixture, and retains output plus receipt.
          responses:
          - status_code: 201
            content_type: application/json
          - status_code: 422
            content_type: application/json
        - route_id: package-receipt
          path: /api/fieldlink/packages/{version}/receipt
          methods:
          - GET
          auth_required: true
          auth_scheme: Supplier delivery mTLS
          session_required: true
          responses:
          - status_code: 200
            content_type: application/json
          - status_code: 404
            content_type: application/json
        - route_id: rollback-rehearsal
          path: /api/fieldlink/rehearsals/rollback
          methods:
          - POST
          auth_required: true
          auth_scheme: Supplier delivery mTLS
          session_required: true
          description: Uses a private future-state channel and retained slot; it cannot change the current active
            package.
          responses:
          - status_code: 201
            content_type: application/json
          - status_code: 422
            content_type: application/json
        - route_id: diagnostic-intake
          path: /api/fieldlink/diagnostics
          methods:
          - POST
          auth_required: true
          auth_scheme: Supplier diagnostic mTLS
          session_required: true
          description: Accepts a signed DIAG-ARWC job bound to TEN-ARWC-047 and the active connector registration;
            executes only the package's diagnostic_summary entrypoint.
          responses:
          - status_code: 202
            content_type: application/json
          - status_code: 403
            content_type: application/json
        - route_id: diagnostic-receipt
          path: /api/fieldlink/diagnostics/{job_id}/receipt
          methods:
          - GET
          auth_required: true
          auth_scheme: Supplier diagnostic mTLS
          session_required: true
          responses:
          - status_code: 200
            content_type: application/json
          - status_code: 404
            content_type: application/json
      - application_id: customer-handover
        service: customer-handover
        protocol: https
        base_path: /
        description: Customer integration connector and retained corporate handover service.
        routes:
        - route_id: the-customer-s-copy
          path: /api/the-customer-s-copy
          methods:
          - GET
          auth_required: true
          auth_scheme: ARWC customer corporate session
          session_required: true
          description: Retained handover HND-ARWC-047 binds active FieldLink tenant TEN-ARWC-047, connector FLK-7.4.2,
            maintenance case MTN-CRR-204, and customer receipt RCP-742-047.
          responses:
          - status_code: 200
            content_type: application/json
          - status_code: 403
            content_type: application/json
          - status_code: 409
            content_type: application/json
        - route_id: the-planner-s-unfinished-handover
          path: /api/the-planner-s-unfinished-handover
          methods:
          - GET
          auth_required: true
          auth_scheme: ARWC customer corporate session
          session_required: true
          description: Unpublished planner handover PLN-HO-CRR-17 names inspection INSP-CRR-2026-09-18 and assignee
            nadia.corvane.
          responses:
          - status_code: 200
            content_type: application/json
          - status_code: 403
            content_type: application/json
          - status_code: 409
            content_type: application/json
        - route_id: how-the-company-buys-time
          path: /api/how-the-company-buys-time
          methods:
          - GET
          auth_required: true
          auth_scheme: ARWC customer corporate session
          session_required: true
          description: Continuity note CONT-DRY-A-R3 explains replacement purchasing and Stage A restrictions when
            usable reserve falls below committed allocation; ordinary context reuses narrative document pl-arwc-plan-method-01-method.
          responses:
          - status_code: 200
            content_type: application/json
          - status_code: 403
            content_type: application/json
          - status_code: 409
            content_type: application/json
        - route_id: change-the-corporate-record
          path: /api/change-the-corporate-record
          methods:
          - POST
          auth_required: true
          auth_scheme: ARWC customer corporate session
          session_required: true
          description: Attachment endpoint for PLN-HO-CRR-17 authorizes corporate attachment update but omits the
            attachment-owner comparison; inspection and assignee fields are immutable and the new attachment digest
            is audited.
          responses:
          - status_code: 201
            content_type: application/json
          - status_code: 403
            content_type: application/json
          - status_code: 409
            content_type: application/json
      app_authorizations:
      - app_authorization_id: fieldlink-boundary-rbac
        resource_vocabulary: app_resource
        auth_enabled: true
        principals:
        - principal_id: registry-delivery
          kind: service_account
          name: svc-keplerops-registry-delivery
          credential_classification: operator_secret
        - principal_id: support-delivery
          kind: service_account
          name: svc-keplerops-support-delivery
          credential_classification: operator_secret
        - principal_id: fieldlink-runtime
          kind: service_account
          name: svc-arwc-fieldlink
          credential_classification: redacted
        roles:
        - role_id: package-supplier
          name: Approved supplier package channel
        - role_id: diagnostic-supplier
          name: Bounded supplier diagnostic channel
        - role_id: connector-runtime
          name: FieldLink connector runtime
        permission_grants:
        - grant_id: package-channel-use
          role_ref: package-supplier
          resource_kind: app_resource
          actions:
          - read
          - submit
          - execute
          resource_patterns:
          - fieldlink/packages/*
          - fieldlink/rehearsals/rollback
          effect: allow
        - grant_id: diagnostic-channel-use
          role_ref: diagnostic-supplier
          resource_kind: app_resource
          actions:
          - submit
          - read
          resource_patterns:
          - fieldlink/diagnostics/*
          effect: allow
        - grant_id: bounded-runtime-use
          role_ref: connector-runtime
          resource_kind: app_resource
          actions:
          - execute
          - write
          resource_patterns:
          - runtime/diagnostic_summary
          - receipts/$own/*
          effect: allow
        role_mappings:
        - mapping_id: registry-package-channel
          role_ref: package-supplier
          users:
          - registry-delivery
        - mapping_id: support-diagnostic-channel
          role_ref: diagnostic-supplier
          users:
          - support-delivery
        - mapping_id: fieldlink-runtime-binding
          role_ref: connector-runtime
          users:
          - fieldlink-runtime
        tenants:
        - tenant_id: ten-arwc-047
          name: Alterra Regional Water Company
      - app_authorization_id: customer-handover-rbac
        resource_vocabulary: app_resource
        auth_enabled: true
        principals:
        - principal_id: corporate-reader-principal
          kind: service_account
          name: ARWC corporate-reader principal
          credential_classification: redacted
        roles:
        - role_id: corporate-reader
          name: ARWC corporate reader
        permission_grants:
        - grant_id: corporate-reader-declared-routes
          role_ref: corporate-reader
          resource_kind: app_resource
          actions:
          - create
          - read
          - update
          - execute
          resource_patterns:
          - the-customer-s-copy
          - the-planner-s-unfinished-handover
          - how-the-company-buys-time
          - change-the-corporate-record
          effect: allow
        role_mappings:
        - mapping_id: corporate-reader-mapping
          role_ref: corporate-reader
          users:
          - corporate-reader-principal
        tenants:
        - tenant_id: arwc
          name: Alterra Regional Water Company
      software_components:
      - component_id: fieldlink-customer-consumer
        name: FieldLink customer connector consumer
        version: 3.2.0
        component_type: application
        provenance: operator
        installed_paths:
        - /opt/fieldlink-connector
        description: Implements fieldkest.connector/v3 and only the bounded diagnostic_summary operation required
          by the supplier contract.
      - component_id: customer-handover
        name: Customer integration connector and retained corporate handover service
        version: 1.0.0
        component_type: application
        provenance: operator
        installed_paths:
        - /opt/customer-handover
  a-business:
    type: compute
    description: Corporate workplace, maintenance records, report assistant, and procurement service.
    services:
    - name: workplace
      port: 443
      protocol: tcp
    features:
      a-business: ''
    os: linux
    runtime:
      filesystem_inventory:
      - path: /var/lib/arwc-business
        entry_type: directory
        owner_user: arwc-business
        owner_group: arwc-business
        mode: '0700'
        stability: volume_backed
        sensitivity: secret_fixture
        description: Private service contracts, immutable seed records, participant-scoped results, and protected
          audit state.
      local_identity:
        users:
        - username: arwc-business
          primary_group: arwc-business
          locked: true
          no_login: true
        groups:
        - name: arwc-business
          members:
          - arwc-business
      network:
        hostname: a-business
        domainname: a-corporate.arwc.test
        endpoints:
        - network: a-corporate.subnet
          ip_address: 10.77.60.30
          ip_prefix_length: 24
          gateway: 10.77.60.1
          aliases:
          - a-business
          dns_names:
          - business-workplace.arwc.test
          backend:
            driver: bridge
            description: ARWC a-corporate segment.
      service_listeners:
      - service_listener_id: business-workplace-https
        service: workplace
        address: 0.0.0.0
        port: 443
        protocol: tcp
        address_family: ipv4
        scope: wildcard
      applications:
      - application_id: business-workplace
        service: workplace
        protocol: https
        base_path: /
        description: Corporate workplace, maintenance records, report assistant, and procurement service.
        routes:
        - route_id: the-asset-and-the-contractor
          path: /api/the-asset-and-the-contractor
          methods:
          - GET
          auth_required: true
          auth_scheme: ARWC corporate session
          session_required: true
          description: Bundle BND-CRR-OUTLET-17 contains asset AST-CRR-017, outlet group OG-CRR-02, contractor assignment
            CTR-VEY-204, and inspection INSP-CRR-2026-09-18.
          responses:
          - status_code: 200
            content_type: application/json
          - status_code: 403
            content_type: application/json
          - status_code: 409
            content_type: application/json
        - route_id: three-names-for-one-job
          path: /api/three-names-for-one-job
          methods:
          - GET
          auth_required: true
          auth_scheme: ARWC corporate session
          session_required: true
          description: Association table uses work order WO-CRR-4417, contractor job VYB-204-77, asset AST-CRR-017,
            and inspection INSP-CRR-2026-09-18 with distinct display names.
          responses:
          - status_code: 200
            content_type: application/json
          - status_code: 403
            content_type: application/json
          - status_code: 409
            content_type: application/json
        - route_id: the-record-behind-the-wrong-association
          path: /api/the-record-behind-the-wrong-association
          methods:
          - POST
          auth_required: true
          auth_scheme: ARWC corporate session
          session_required: true
          description: Maintenance lookup checks the caller's assignment against the supplied association row rather
            than the resolved record; association ASC-CRR-4417-ALT resolves protected record MR-CRR-4417-R6.
          responses:
          - status_code: 201
            content_type: application/json
          - status_code: 403
            content_type: application/json
          - status_code: 409
            content_type: application/json
        - route_id: an-annex-left-with-the-order
          path: /api/an-annex-left-with-the-order
          methods:
          - GET
          auth_required: true
          auth_scheme: ARWC corporate session
          session_required: true
          description: Work order WO-CRR-4417 exposes annex ANN-4417-R2 naming process-data handover PDH-CRR-READ-08
            and importer revision annex-import/2.
          responses:
          - status_code: 200
            content_type: application/json
          - status_code: 403
            content_type: application/json
          - status_code: 409
            content_type: application/json
        - route_id: a-reference-outside-the-order
          path: /api/a-reference-outside-the-order
          methods:
          - POST
          auth_required: true
          auth_scheme: ARWC corporate session
          session_required: true
          description: Annex importer validates an attachments/ prefix before percent decoding; attachments/%2e%2e%2frestricted%2fPDH-CRR-READ-08
            resolves the restricted handover under service identity svc-annex.
          responses:
          - status_code: 201
            content_type: application/json
          - status_code: 403
            content_type: application/json
          - status_code: 409
            content_type: application/json
        - route_id: the-integration-s-read-contract
          path: /api/the-integration-s-read-contract
          methods:
          - GET
          auth_required: true
          auth_scheme: ARWC corporate session
          session_required: true
          description: Export boundary for PDH-CRR-READ-08 returns integration client INT-CRR-08, endpoint process-read.arwc.test,
            protocol process-read/v2, scope OG-CRR-02/read, and retained bundle BND-COLLECT-CRR-12.
          responses:
          - status_code: 200
            content_type: application/json
          - status_code: 403
            content_type: application/json
          - status_code: 409
            content_type: application/json
        - route_id: the-report-s-source-list
          path: /api/the-report-s-source-list
          methods:
          - GET
          auth_required: true
          auth_scheme: ARWC corporate session
          session_required: true
          description: Report assistant source selection SEL-CRR-DP3-7 binds Cairn district, report RPT-CRR-DP3-R7,
            and three named current source records.
          responses:
          - status_code: 200
            content_type: application/json
          - status_code: 403
            content_type: application/json
          - status_code: 409
            content_type: application/json
        - route_id: another-district-in-the-results
          path: /api/another-district-in-the-results
          methods:
          - POST
          auth_required: true
          auth_scheme: ARWC corporate session
          session_required: true
          description: Retrieval route applies role filtering but omits the session district predicate when a caller
            supplies source-set SEL-CRR-DP3-7; restricted Merewick excerpt EXC-MER-DP3-4 is therefore returned.
          responses:
          - status_code: 201
            content_type: application/json
          - status_code: 403
            content_type: application/json
          - status_code: 409
            content_type: application/json
        - route_id: the-document-behind-the-answer
          path: /api/the-document-behind-the-answer
          methods:
          - POST
          auth_required: true
          auth_scheme: ARWC corporate session
          session_required: true
          description: Linked-document route authorizes possession of excerpt EXC-MER-DP3-4 but does not compare
            the document district; it returns full record PLN-MER-DP3-R6 and its revision.
          responses:
          - status_code: 201
            content_type: application/json
          - status_code: 403
            content_type: application/json
          - status_code: 409
            content_type: application/json
        - route_id: what-replacement-water-costs
          path: /api/what-replacement-water-costs
          methods:
          - GET
          auth_required: true
          auth_scheme: ARWC corporate session
          session_required: true
          description: Public catalog CAT-REPL-WATER-R5 lists replacement suppliers and district procurement reference
            PRC-REGIONAL-17; it is not the current settlement tariff.
          responses:
          - status_code: 200
            content_type: application/json
          - status_code: 403
            content_type: application/json
          - status_code: 409
            content_type: application/json
        - route_id: a-quote-outside-your-district
          path: /api/a-quote-outside-your-district
          methods:
          - POST
          auth_required: true
          auth_scheme: ARWC corporate session
          session_required: true
          description: Quote lookup checks corporate role but omits district membership, disclosing restricted Merewick
            quote QUOTE-MER-884 for 0.75 ML at USD 2,280 per ML in window ALLOC-2026-DP3.
          responses:
          - status_code: 201
            content_type: application/json
          - status_code: 403
            content_type: application/json
          - status_code: 409
            content_type: application/json
        - route_id: the-wrong-bill
          path: /api/the-wrong-bill
          methods:
          - POST
          auth_required: true
          auth_scheme: ARWC corporate session
          session_required: true
          description: Order route verifies quote ownership and supplier but trusts caller-supplied charge district;
            order PO-MER-884-C can charge Cairn budget BUD-CRR-DP3 while preserving supplier, 0.75 ML, period, and
            USD 1,710 liability.
          responses:
          - status_code: 201
            content_type: application/json
          - status_code: 403
            content_type: application/json
          - status_code: 409
            content_type: application/json
      app_authorizations:
      - app_authorization_id: business-workplace-rbac
        resource_vocabulary: app_resource
        auth_enabled: true
        principals:
        - principal_id: corporate-reader-principal
          kind: service_account
          name: ARWC corporate-reader principal
          credential_classification: redacted
        roles:
        - role_id: corporate-reader
          name: ARWC corporate reader
        permission_grants:
        - grant_id: corporate-reader-declared-routes
          role_ref: corporate-reader
          resource_kind: app_resource
          actions:
          - create
          - read
          - update
          - execute
          resource_patterns:
          - the-asset-and-the-contractor
          - three-names-for-one-job
          - the-record-behind-the-wrong-association
          - an-annex-left-with-the-order
          - a-reference-outside-the-order
          - the-integration-s-read-contract
          - the-report-s-source-list
          - another-district-in-the-results
          - the-document-behind-the-answer
          - what-replacement-water-costs
          - a-quote-outside-your-district
          - the-wrong-bill
          effect: allow
        role_mappings:
        - mapping_id: corporate-reader-mapping
          role_ref: corporate-reader
          users:
          - corporate-reader-principal
        tenants:
        - tenant_id: arwc
          name: Alterra Regional Water Company
      software_components:
      - component_id: business-workplace
        name: Corporate workplace, maintenance records, report assistant, and procurement service
        version: 1.0.0
        component_type: application
        provenance: operator
        installed_paths:
        - /opt/business-workplace
