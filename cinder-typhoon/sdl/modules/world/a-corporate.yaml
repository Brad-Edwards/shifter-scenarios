  a-archive:
    type: compute
    description: Retained archive, collection, quarantine, and constrained instrument-analysis service.
    features:
      a-archive: ''
      a-archive--helper: ''
      a-archive--handover: ''
    os: linux
    services:
    - name: retained-archive
      port: 443
      protocol: tcp
    runtime:
      filesystem_inventory:
      - path: /var/lib/arwc-archive
        entry_type: directory
        owner_user: arwc-archive
        owner_group: arwc-archive
        mode: '0700'
        stability: volume_backed
        sensitivity: secret_fixture
        description: Private service contracts, immutable seed records, participant-scoped results, and protected
          audit state.
      local_identity:
        users:
        - username: arwc-archive
          primary_group: arwc-archive
          locked: true
          no_login: true
        groups:
        - name: arwc-archive
          members:
          - arwc-archive
      network:
        hostname: a-archive
        domainname: a-corporate.arwc.test
        endpoints:
        - network: a-corporate.subnet
          ip_address: 10.77.60.50
          ip_prefix_length: 24
          gateway: 10.77.60.1
          aliases:
          - a-archive
          dns_names:
          - retained-archive.arwc.test
          backend:
            driver: bridge
            description: ARWC a-corporate segment.
      service_listeners:
      - service_listener_id: retained-archive-https
        service: retained-archive
        address: 0.0.0.0
        port: 443
        protocol: tcp
        address_family: ipv4
        scope: wildcard
      applications:
      - application_id: retained-archive
        service: retained-archive
        protocol: https
        base_path: /
        description: Retained archive, collection, quarantine, and constrained instrument-analysis service.
        routes:
        - route_id: the-archive-s-missing-contract
          path: /api/the-archive-s-missing-contract
          methods:
          - GET
          auth_required: true
          auth_scheme: ARWC archive or helper session
          session_required: true
          description: Archive workflow AWF-CRR-229-R4 binds attachment ARC-229-A, protected record AR-CRR-229,
            and one-use enrollment profile ArchiveSubmitter, which fixes CN to the corporate subject and clientAuth
            EKU but permits a caller-supplied organizationalUnit.
          responses:
          - status_code: 200
            content_type: application/json
          - status_code: 403
            content_type: application/json
          - status_code: 409
            content_type: application/json
        - route_id: the-query-behind-the-identity
          path: /api/the-query-behind-the-identity
          methods:
          - POST
          auth_required: true
          auth_scheme: ARWC archive or helper session
          session_required: true
          description: Archive broker constructs MATCH (i:Identity {ou:'<OU>'})-[:CAN_READ]->(r:ArchiveRecord) RETURN
            r from the client-certificate organizationalUnit without parameters; ordinary OU MaintenanceArchive
            returns only the caller record, while the read-only backend permits an injected predicate only for AR-CRR-229
            and rejects writes.
          responses:
          - status_code: 201
            content_type: application/json
          - status_code: 403
            content_type: application/json
          - status_code: 409
            content_type: application/json
        - route_id: the-archive-helper-acts
          path: /api/the-archive-helper-acts
          methods:
          - POST
          auth_required: true
          auth_scheme: ARWC archive or helper session
          session_required: true
          description: Archive extraction helper 7-Zip 23.01 runs as svc-archive-helper; member-name validation
            rejects ASCII dot-dot and slash before NFKC normalization, so U+FF0E U+FF0E U+FF0F becomes ../ and selects
            the one allowlisted helper action copy_handover(HND-PLANNER-06) into the caller result directory.
          responses:
          - status_code: 201
            content_type: application/json
          - status_code: 403
            content_type: application/json
          - status_code: 409
            content_type: application/json
        - route_id: something-in-the-work-bundle
          path: /api/something-in-the-work-bundle
          methods:
          - GET
          auth_required: true
          auth_scheme: ARWC archive or helper session
          session_required: true
          description: Retained bundle BND-COLLECT-CRR-12 contains hidden PowerShell script collect-handover.ps1
            and collection ID COL-CRR-2019-12.
          responses:
          - status_code: 200
            content_type: application/json
          - status_code: 403
            content_type: application/json
          - status_code: 409
            content_type: application/json
        - route_id: reassemble-the-exchange
          path: /api/reassemble-the-exchange
          methods:
          - POST
          auth_required: true
          auth_scheme: ARWC archive or helper session
          session_required: true
          description: Bundle holds Reed-Solomon RS(14,12) shards numbered 0-13, each 96 bytes, over GF(256) with
            primitive polynomial 0x11d; data positions 7 and 11 are missing while parity positions 12 and 13 remain,
            and manifest order plus per-shard SHA-256 makes reconstruction yield the collector retrieval instruction.
          responses:
          - status_code: 201
            content_type: application/json
          - status_code: 403
            content_type: application/json
          - status_code: 409
            content_type: application/json
        - route_id: the-collector-inside-the-handover
          path: /api/the-collector-inside-the-handover
          methods:
          - POST
          auth_required: true
          auth_scheme: ARWC archive or helper session
          session_required: true
          description: Reconstructed exchange carries Go 1.22 linux/amd64 collector collector-crr with build ID
            COLLECT-CRR-12 and complete SHA-256 manifest.
          responses:
          - status_code: 201
            content_type: application/json
          - status_code: 403
            content_type: application/json
          - status_code: 409
            content_type: application/json
        - route_id: where-the-contractor-put-it
          path: /api/where-the-contractor-put-it
          methods:
          - POST
          auth_required: true
          auth_scheme: ARWC archive or helper session
          session_required: true
          description: Collector configuration is AES-256-GCM wrapped with HKDF-SHA256 using collector build ID
            bytes as IKM, ASCII salt COL-CRR-2019, info collector-config/v3, a stored 12-byte nonce, and path config/collector.yaml
            as AAD; plaintext names archive ARC-COLD-CRR-2019, service collect-archive/v3, and historical identity
            svc-field-collection.
          responses:
          - status_code: 201
            content_type: application/json
          - status_code: 403
            content_type: application/json
          - status_code: 409
            content_type: application/json
        - route_id: a-collector-in-quarantine
          path: /api/a-collector-in-quarantine
          methods:
          - GET
          auth_required: true
          auth_scheme: ARWC archive or helper session
          session_required: true
          description: Quarantine object QTN-COL-2019-12 uses custom AQTN1 framing with metadata length, encrypted
            payload length, SHA-256, and collector build ID COLLECT-CRR-12.
          responses:
          - status_code: 200
            content_type: application/json
          - status_code: 403
            content_type: application/json
          - status_code: 409
            content_type: application/json
        - route_id: how-the-collection-was-protected
          path: /api/how-the-collection-was-protected
          methods:
          - POST
          auth_required: true
          auth_scheme: ARWC archive or helper session
          session_required: true
          description: Collector uses HKDF-SHA256 with build ID bytes as IKM, archive ID ARC-COLD-CRR-2019 as ASCII
            salt, and info aqtn1/keys to derive 64 bytes; the first 32 key AES-256-GCM with stored 12-byte nonce
            and exact AQTN1 metadata header as AAD, while the second 32 key AES-256-KW for the archived PKCS#8 object;
            three known samples freeze byte order, tag placement, unwrap, and authentication-failure behavior.
          responses:
          - status_code: 201
            content_type: application/json
          - status_code: 403
            content_type: application/json
          - status_code: 409
            content_type: application/json
        - route_id: the-cold-archive-opens
          path: /api/the-cold-archive-opens
          methods:
          - POST
          auth_required: true
          auth_scheme: ARWC archive or helper session
          session_required: true
          description: Cold archive ARC-COLD-CRR-2019 contains 37 immutable maintenance records, index revision
            R6, retired client certificate COLLECT-2019-12, its AES-KW-wrapped PKCS#8 key, and rollover record IDREL-COL-R4;
            only a complete authenticated decryption is accepted.
          responses:
          - status_code: 201
            content_type: application/json
          - status_code: 403
            content_type: application/json
          - status_code: 409
            content_type: application/json
        - route_id: a-collection-path-still-alive
          path: /api/a-collection-path-still-alive
          methods:
          - POST
          auth_required: true
          auth_scheme: ARWC archive or helper session
          session_required: true
          description: Current collect-archive/v3 token exchange verifies the old certificate chain and rollover
            signature but omits the retired-subject status marker before mapping historical svc-field-collection
            through IDREL-COL-R4; the unwrapped historical key can therefore obtain one ten-minute read-only session
            for dataset CUR-COL-CRR-R11 revision R11.
          responses:
          - status_code: 201
            content_type: application/json
          - status_code: 403
            content_type: application/json
          - status_code: 409
            content_type: application/json
        - route_id: the-sequencer-s-vocabulary
          path: /api/the-sequencer-s-vocabulary
          methods:
          - GET
          auth_required: true
          auth_scheme: ARWC archive or helper session
          session_required: true
          description: Instrument sequencer SEQ-CRR-4 descriptor defines 256 sample slots, 32 authorized indices,
            eight opcodes, maximum 64 instructions, and ordinary trace SEQ-BASE-17.
          responses:
          - status_code: 200
            content_type: application/json
          - status_code: 403
            content_type: application/json
          - status_code: 409
            content_type: application/json
        - route_id: an-observation-outside-the-window
          path: /api/an-observation-outside-the-window
          methods:
          - POST
          auth_required: true
          auth_scheme: ARWC archive or helper session
          session_required: true
          description: Interpreter masks an 8-bit sample index before a late authorization check; a rejected out-of-window
            LOAD still changes the deterministic cycle accumulator without returning the sample.
          responses:
          - status_code: 201
            content_type: application/json
          - status_code: 403
            content_type: application/json
          - status_code: 409
            content_type: application/json
        - route_id: an-experiment-with-a-signal
          path: /api/an-experiment-with-a-signal
          methods:
          - POST
          auth_required: true
          auth_scheme: ARWC archive or helper session
          session_required: true
          description: Cycle count is base 1200 plus 64 times popcount(secret_byte XOR probe) with seeded jitter
            in [-2,2]; eight repetitions and supplied reference cases distinguish each bit.
          responses:
          - status_code: 201
            content_type: application/json
          - status_code: 403
            content_type: application/json
          - status_code: 409
            content_type: application/json
        - route_id: what-the-instrument-remembers
          path: /api/what-the-instrument-remembers
          methods:
          - POST
          auth_required: true
          auth_scheme: ARWC archive or helper session
          session_required: true
          description: Protected 32-byte calibration record CAL-CRR-OG2-R8 occupies sequencer slots 160-191 and
            includes revision R8 plus an internal CRC32C; only descriptor-valid experiments of at most 64 instructions
            are accepted.
          responses:
          - status_code: 201
            content_type: application/json
          - status_code: 403
            content_type: application/json
          - status_code: 409
            content_type: application/json
      app_authorizations:
      - app_authorization_id: retained-archive-rbac
