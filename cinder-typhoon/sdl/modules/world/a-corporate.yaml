          kind: user
          name: Mira Vale
          principal_name: mira.vale@alterrawaterco.com
          enabled: true
          origin: provisioned
        - subject_id: planner-nadia-corvane
          kind: user
          name: Nadia Corvane
          principal_name: nadia.corvane@alterrawaterco.com
          enabled: true
          origin: provisioned
        policies:
