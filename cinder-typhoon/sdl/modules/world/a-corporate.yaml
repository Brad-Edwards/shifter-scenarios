          - update
          - execute
          resource_patterns:
          - a-starter-pack-left-open
          - the-activation-roster
          - temporary-with-the-wrong-rights
          - the-planner-s-login-trail
          - a-drawing-in-the-wrong-context
          - a-planner-session-that-works
          effect: allow
        role_mappings:
        - mapping_id: identity-user-mapping
          role_ref: identity-user
          users:
          - identity-user-principal
        tenants:
        - tenant_id: arwc
          name: Alterra Regional Water Company
      software_components:
      - component_id: corporate-identity
