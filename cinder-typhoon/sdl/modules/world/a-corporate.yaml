        routes:
        - route_id: a-starter-pack-left-open
          path: /api/a-starter-pack-left-open
          methods:
          - GET
          auth_required: true
          auth_scheme: ARWC onboarding or planner session
          session_required: true
          description: Starter pack START-MIRA-2026 names temporary employee Mira Vale, employee TMP-4821, assignment
            PLAN-RELIEF-7, and onboarding portal identity without an activation secret.
          responses:
          - status_code: 200
            content_type: application/json
          - status_code: 403
            content_type: application/json
          - status_code: 409
            content_type: application/json
        - route_id: the-activation-roster
          path: /api/the-activation-roster
          methods:
          - GET
          auth_required: true
          auth_scheme: ARWC onboarding or planner session
          session_required: true
          description: Internal roster ACT-SEP26-R3 separately maps employee TMP-4821 to activation code 731944
            and approved assignment PLAN-RELIEF-3.
          responses:
          - status_code: 200
            content_type: application/json
          - status_code: 403
            content_type: application/json
          - status_code: 409
            content_type: application/json
        - route_id: temporary-with-the-wrong-rights
          path: /api/temporary-with-the-wrong-rights
          methods:
          - POST
          auth_required: true
          auth_scheme: ARWC onboarding or planner session
          session_required: true
          description: Activation checks employee number and code independently but fails to compare the requested
            assignment with the roster assignment, issuing a limited session for PLAN-RELIEF-7 with no administrative
            role.
          responses:
          - status_code: 201
            content_type: application/json
          - status_code: 403
            content_type: application/json
          - status_code: 409
            content_type: application/json
        - route_id: the-planner-s-login-trail
          path: /api/the-planner-s-login-trail
          methods:
          - GET
          auth_required: true
          auth_scheme: ARWC onboarding or planner session
          session_required: true
          description: Protected rendering record RENDER-CRR-882 binds planner nadia.corvane, drawing DRW-OG2-R8,
            review REV-CRR-4417, OAuth transaction OAUTH-PLN-882, and browser profile planner-review-3.
          responses:
          - status_code: 200
            content_type: application/json
          - status_code: 403
            content_type: application/json
          - status_code: 409
            content_type: application/json
        - route_id: a-drawing-in-the-wrong-context
          path: /api/a-drawing-in-the-wrong-context
          methods:
          - POST
          auth_required: true
          auth_scheme: ARWC onboarding or planner session
          session_required: true
          description: Preview callback validates OAuth state before replacing the pending preview origin; a controlled
            preview at preview-cinder.arwc.test can be attached to DRW-OG2-R8 in the isolated planner browser.
          responses:
          - status_code: 201
            content_type: application/json
          - status_code: 403
            content_type: application/json
          - status_code: 409
            content_type: application/json
        - route_id: a-planner-session-that-works
          path: /api/a-planner-session-that-works
          methods:
          - POST
          auth_required: true
          auth_scheme: ARWC onboarding or planner session
          session_required: true
          description: The review browser posts its planner session bootstrap to the attached preview for compatibility;
            origin is checked against mutable pending-preview state and yields a five-minute planner session limited
            to planning records.
          responses:
          - status_code: 201
            content_type: application/json
          - status_code: 403
            content_type: application/json
          - status_code: 409
            content_type: application/json
      app_authorizations:
      - app_authorization_id: corporate-identity-rbac
        resource_vocabulary: app_resource
        auth_enabled: true
        principals:
        - principal_id: identity-user-principal
