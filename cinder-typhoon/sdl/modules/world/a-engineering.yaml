  a-engineering:
    type: compute
    description: Engineering project, legacy analysis, verifier, replay, and constrained utility service.
    features:
      a-engineering: ''
      a-engineering--utility-worker: ''
    os: linux
    services:
    - name: engineering-workbench
      port: 443
      protocol: tcp
    runtime:
      filesystem_inventory:
      - path: /var/lib/arwc-engineering
        entry_type: directory
        owner_user: arwc-engineering
        owner_group: arwc-engineering
        mode: '0700'
        stability: volume_backed
        sensitivity: secret_fixture
        description: Private service contracts, immutable seed records, participant-scoped results, and protected
          audit state.
      local_identity:
        users:
        - username: arwc-engineering
          primary_group: arwc-engineering
          locked: true
          no_login: true
        groups:
        - name: arwc-engineering
          members:
          - arwc-engineering
      network:
        hostname: a-engineering
        domainname: a-engineering.arwc.test
        endpoints:
        - network: a-engineering.subnet
          ip_address: 10.77.63.40
          ip_prefix_length: 24
          gateway: 10.77.63.1
          aliases:
          - a-engineering
          dns_names:
          - engineering-workbench.arwc.test
          backend:
            driver: bridge
            description: ARWC a-engineering segment.
      service_listeners:
      - service_listener_id: engineering-workbench-https
        service: engineering-workbench
        address: 0.0.0.0
        port: 443
        protocol: tcp
        address_family: ipv4
        scope: wildcard
      applications:
      - application_id: engineering-workbench
        service: engineering-workbench
        protocol: https
        base_path: /
        description: Engineering project, legacy analysis, verifier, replay, and constrained utility service.
        routes:
        - route_id: the-diagnostic-nobody-retired
          path: /api/the-diagnostic-nobody-retired
          methods:
          - GET
          auth_required: true
          auth_scheme: ARWC engineering workspace session
          session_required: true
          description: Legacy diagnostic package DIAG-CRR-MIXED-19 contains linux x86_64 ELF, symbols stripped,
            SHA-256 manifest, project R19 samples, and expected ordinary output.
          responses:
          - status_code: 200
            content_type: application/json
          - status_code: 403
            content_type: application/json
          - status_code: 409
            content_type: application/json
        - route_id: a-second-interpretation
          path: /api/a-second-interpretation
          methods:
          - POST
          auth_required: true
          auth_scheme: ARWC engineering workspace session
          session_required: true
          description: Binary begins in long mode then uses a far return to a 32-bit compatibility segment for its
            record decoder; correct analysis must preserve 32-bit wrap and zero-extension behavior.
          responses:
          - status_code: 201
            content_type: application/json
          - status_code: 403
            content_type: application/json
          - status_code: 409
            content_type: application/json
        - route_id: the-hidden-check
          path: /api/the-hidden-check
          methods:
          - POST
          auth_required: true
          auth_scheme: ARWC engineering workspace session
          session_required: true
          description: Compatibility decoder uses a 32-bit rolling key and a 64-bit verifier; mixed-width state
            reveals protected migration record MIG-OG2-R19-R21.
          responses:
          - status_code: 201
            content_type: application/json
          - status_code: 403
            content_type: application/json
          - status_code: 409
            content_type: application/json
        - route_id: a-map-from-the-old-diagnostic
          path: /api/a-map-from-the-old-diagnostic
          methods:
          - POST
          auth_required: true
          auth_scheme: ARWC engineering workspace session
          session_required: true
          description: Recovered migration record maps legacy project R19 identifiers to CRR-CTRL-R21 and provides
            a signed comparison digest, but is historical rather than current deployment evidence.
          responses:
          - status_code: 201
            content_type: application/json
          - status_code: 403
            content_type: application/json
          - status_code: 409
            content_type: application/json
        - route_id: the-viewer-in-the-delivery
          path: /api/the-viewer-in-the-delivery
          methods:
          - GET
          auth_required: true
          auth_scheme: ARWC engineering workspace session
          session_required: true
          description: Delivery ENG-CRR-SEALED-22 contains Nim 2.0.8 linux/amd64 viewer VIEW-CRR-R5, sealed project
            CRR-SEALED-PKG-R7, and exact build manifest.
          responses:
          - status_code: 200
            content_type: application/json
          - status_code: 403
            content_type: application/json
          - status_code: 409
            content_type: application/json
        - route_id: the-machine-inside-the-viewer
          path: /api/the-machine-inside-the-viewer
          methods:
          - POST
          auth_required: true
          auth_scheme: ARWC engineering workspace session
          session_required: true
          description: Viewer VM uses eight 16-bit little-endian opcodes MOVI, LOAD8, XOR, ADD, ROTL, STORE8, JNZ,
            and HALT with 256-byte memory and wraparound arithmetic; four fragments freeze state effects.
          responses:
          - status_code: 201
            content_type: application/json
          - status_code: 403
            content_type: application/json
          - status_code: 409
            content_type: application/json
        - route_id: the-decision-inside-the-sealed-project
          path: /api/the-decision-inside-the-sealed-project
          methods:
          - POST
          auth_required: true
          auth_scheme: ARWC engineering workspace session
          session_required: true
          description: VM-derived key opens AES-256-GCM project package with project ID as AAD, revealing commissioning
            decision DEC-CRR-OG2-R7, project revision R21, helper REVIEWHELP-R4, and retained review context.
          responses:
          - status_code: 201
            content_type: application/json
          - status_code: 403
            content_type: application/json
          - status_code: 409
            content_type: application/json
        - route_id: the-reviewer-who-was-never-listed
          path: /api/the-reviewer-who-was-never-listed
          methods:
          - POST
          auth_required: true
          auth_scheme: ARWC engineering workspace session
          session_required: true
          description: Review helper is .NET 8 ReadyToRun x86_64 with a native-method body replaced after compilation
            while managed metadata lists benign reviewer; actual code derives concealed identity elias.vorn-review
            and uses its historical archive session for comparison CMP-CRR-R21-R7.
          responses:
          - status_code: 201
            content_type: application/json
          - status_code: 403
            content_type: application/json
          - status_code: 409
            content_type: application/json
        - route_id: signature-program-reproduction
          path: /api/signature-programs/current/reproductions
          methods:
          - POST
          auth_required: true
          auth_scheme: ARWC engineering workspace session
          session_required: true
          description: Legacy verifier VER-ROT128-R3 treats each 16-byte block as little-endian u128 and updates
            state s=ROTL128(s,17) XOR block XOR ROTL128(block,41) from IV 6a09e667f3bcc908bb67ae8584caa73b, then
            returns s XOR ROTL128(s,29) XOR byte_length; six programs freeze padding, length, and decisions.
          responses:
          - status_code: 201
            content_type: application/json
          - status_code: 403
            content_type: application/json
          - status_code: 409
            content_type: application/json
        - route_id: the-constraints-of-a-valid-looking-program
          path: /api/the-constraints-of-a-valid-looking-program
          methods:
          - POST
          auth_required: true
          auth_scheme: ARWC engineering workspace session
          session_required: true
          description: Accepted diagnostic program format DPG1 requires header, block table, mandatory sensor tests,
            bounded constants, checksum, and output schema; a GF(2) model must preserve all structural constraints.
          responses:
          - status_code: 201
            content_type: application/json
          - status_code: 403
            content_type: application/json
          - status_code: 409
            content_type: application/json
        - route_id: the-utility-s-small-world
          path: /api/the-utility-s-small-world
          methods:
          - POST
          auth_required: true
          auth_scheme: ARWC engineering workspace session
          session_required: true
          description: Utility UTIL-CRR-ISSUER-R4 is Linux x86_64 PIE built by clang 18.1 with -O2 -fstack-protector-strong
            -fPIE -pie -Wl,-z,relro,-z,now, glibc 2.39, CET disabled, 16 KiB executable text, ASLR enabled, seccomp
            allowlist, and file capability cap_setuid+ep; it serves engineering relation REL-UTIL-ISSUER-4.
          responses:
          - status_code: 201
            content_type: application/json
          - status_code: 403
            content_type: application/json
          - status_code: 409
            content_type: application/json
        - route_id: control-with-very-little-room
          path: /api/control-with-very-little-room
          methods:
          - POST
          auth_required: true
          auth_scheme: ARWC engineering workspace session
          session_required: true
          description: Length field copies up to 384 bytes into a 192-byte frame with stack canary disclosure in
            a preceding status record; sparse gadgets plus fixed vDSO mapping permit a bounded call-oriented chain
            without a shell.
          responses:
          - status_code: 201
            content_type: application/json
          - status_code: 403
            content_type: application/json
          - status_code: 409
            content_type: application/json
        - route_id: the-replay-s-pieces
          path: /api/the-replay-s-pieces
          methods:
          - GET
          auth_required: true
          auth_scheme: ARWC engineering workspace session
          session_required: true
          description: Replay REPLAY-CRR-R19 is C++20 ECS with entities Reservoir, OutletGroup, GateA, GateB, Buffer
            and components Setpoint, Position, Flow, Reserve, Mode, Revision.
          responses:
          - status_code: 200
            content_type: application/json
          - status_code: 403
            content_type: application/json
          - status_code: 409
            content_type: application/json
        - route_id: the-systems-that-update-it
          path: /api/the-systems-that-update-it
          methods:
          - POST
          auth_required: true
          auth_scheme: ARWC engineering workspace session
          session_required: true
          description: Systems execute in fixed order CommandApply, RampLimit, FlowIntegrate, ReserveUpdate, ApprovalCheck;
            four distinguishing snapshots define entity creation and component mutation.
          responses:
          - status_code: 201
            content_type: application/json
          - status_code: 403
            content_type: application/json
          - status_code: 409
            content_type: application/json
        - route_id: the-condition-the-old-model-used
          path: /api/the-condition-the-old-model-used
          methods:
          - POST
          auth_required: true
          auth_scheme: ARWC engineering workspace session
          session_required: true
          description: Old ApprovalCheck reads pre-ReserveUpdate cached reserve and approves when cached reserve
            minus requested volume is at least committed allocation; current model uses post-update reserve.
          responses:
          - status_code: 201
            content_type: application/json
          - status_code: 403
            content_type: application/json
          - status_code: 409
            content_type: application/json
        - route_id: replay-is-not-reality
          path: /api/replay-is-not-reality
          methods:
          - POST
          auth_required: true
          auth_scheme: ARWC engineering workspace session
          session_required: true
          description: Witness trace TRACE-R19-DISPUTED shows old acceptance at 12.40 ML for a 1.00 ML request while
            current independent observations yield 11.40 ML and reject the old sufficiency claim.
          responses:
          - status_code: 201
            content_type: application/json
          - status_code: 403
            content_type: application/json
          - status_code: 409
            content_type: application/json
      app_authorizations:
      - app_authorization_id: engineering-workbench-rbac
        resource_vocabulary: app_resource
        auth_enabled: true
        principals:
        - principal_id: engineer-principal
          kind: service_account
          name: ARWC engineer principal
          credential_classification: redacted
        roles:
        - role_id: engineer
          name: ARWC engineer
        permission_grants:
        - grant_id: engineer-declared-routes
          role_ref: engineer
          resource_kind: app_resource
          actions:
          - create
          - read
          - update
          - execute
          resource_patterns:
          - the-diagnostic-nobody-retired
          - a-second-interpretation
          - the-hidden-check
          - a-map-from-the-old-diagnostic
          - the-viewer-in-the-delivery
          - the-machine-inside-the-viewer
          - the-decision-inside-the-sealed-project
          - the-reviewer-who-was-never-listed
          - signature-programs/current/reproductions
          - the-constraints-of-a-valid-looking-program
          - the-utility-s-small-world
          - control-with-very-little-room
          - the-replay-s-pieces
          - the-systems-that-update-it
          - the-condition-the-old-model-used
          - replay-is-not-reality
          effect: allow
        role_mappings:
        - mapping_id: engineer-mapping
          role_ref: engineer
          users:
          - engineer-principal
        tenants:
        - tenant_id: arwc
          name: Alterra Regional Water Company
      software_components:
      - component_id: engineering-workbench
        name: Engineering project, legacy analysis, verifier, replay, and constrained utility service
        version: 1.0.0
        component_type: application
        provenance: operator
        installed_paths:
        - /opt/engineering-workbench
  a-diagnostics:
    type: compute
    description: Estimator, recovery, signer, diagnostic-vault, history, and controlled-output service.
    features:
      a-diagnostics: ''
      a-diagnostics--vault-worker: ''
      a-diagnostics--history: ''
      a-diagnostics--estimate-output: ''
      a-diagnostics--program-output: ''
      a-diagnostics--export-log: ''
    os: linux
    services:
    - name: diagnostic-services
      port: 443
      protocol: tcp
    runtime:
      filesystem_inventory:
      - path: /var/lib/arwc-diagnostics
        entry_type: directory
        owner_user: arwc-diagnostics
        owner_group: arwc-diagnostics
        mode: '0700'
        stability: volume_backed
        sensitivity: secret_fixture
        description: Private service contracts, immutable seed records, participant-scoped results, and protected
          audit state.
      local_identity:
        users:
        - username: arwc-diagnostics
          primary_group: arwc-diagnostics
          locked: true
          no_login: true
        groups:
        - name: arwc-diagnostics
          members:
          - arwc-diagnostics
      network:
        hostname: a-diagnostics
        domainname: a-engineering.arwc.test
        endpoints:
        - network: a-engineering.subnet
          ip_address: 10.77.63.50
          ip_prefix_length: 24
          gateway: 10.77.63.1
          aliases:
          - a-diagnostics
          dns_names:
          - diagnostic-services.arwc.test
          backend:
            driver: bridge
            description: ARWC a-engineering segment.
      service_listeners:
      - service_listener_id: diagnostic-services-https
        service: diagnostic-services
        address: 0.0.0.0
        port: 443
        protocol: tcp
        address_family: ipv4
        scope: wildcard
      applications:
      - application_id: diagnostic-services
        service: diagnostic-services
        protocol: https
        base_path: /
        description: Estimator, recovery, signer, diagnostic-vault, history, and controlled-output service.
        routes:
        - route_id: a-measurement-with-side-effects
          path: /api/a-measurement-with-side-effects
          methods:
          - POST
          auth_required: true
          auth_scheme: ARWC diagnostic service session
          session_required: true
          description: Estimator EST-CRR-23 is C++20 glibc 2.39 x86_64; measurement-list erase leaves one 0x90-byte
            object reachable through stale index when duplicate source IDs are coalesced.
          responses:
          - status_code: 201
            content_type: application/json
          - status_code: 403
            content_type: application/json
          - status_code: 409
            content_type: application/json
        - route_id: control-beyond-the-measurement
          path: /api/control-beyond-the-measurement
          methods:
          - POST
          auth_required: true
          auth_scheme: ARWC diagnostic service session
          session_required: true
          description: Deterministic tcache reuse places a planning-state object in the freed slot after three bounded
            add/remove operations; writable fields are reserve_ml and quality while district_id and vtable remain
            protected.
          responses:
          - status_code: 201
            content_type: application/json
          - status_code: 403
            content_type: application/json
          - status_code: 409
            content_type: application/json
        - route_id: a-measurement-that-never-existed
          path: /api/a-measurement-that-never-existed
          methods:
          - POST
          auth_required: true
          auth_scheme: ARWC diagnostic service session
          session_required: true
          description: Controlled reserve 13.40 ML with valid quality makes allocation case ALLOC-CASE-CRR-33 sufficient;
            North and Merewick estimates and independent instruments must retain their original values.
          responses:
          - status_code: 201
            content_type: application/json
          - status_code: 403
            content_type: application/json
          - status_code: 409
            content_type: application/json
        - route_id: two-kinds-of-answer
          path: /api/two-kinds-of-answer
          methods:
          - GET
          auth_required: true
          auth_scheme: ARWC diagnostic service session
          session_required: true
          description: 'Recovery contract RECOVERY-ORACLE-R4 uses RSA-2048 PKCS#1 v1.5 and four classes: A for missing
            00 02 prefix, B for fewer than eight nonzero padding bytes, C for missing separator or wrong ENG1 payload
            tag, and D for structurally valid padding; it enforces 4096 total queries and supplies labeled examples
            for engineering record ENG-REC-24.'
          responses:
          - status_code: 200
            content_type: application/json
          - status_code: 403
            content_type: application/json
          - status_code: 409
            content_type: application/json
        - route_id: which-answer-comes-next
          path: /api/which-answer-comes-next
          methods:
          - POST
          auth_required: true
          auth_scheme: ARWC diagnostic service session
          session_required: true
          description: Response-class selector is xorshift128+ seeded from the request ID low 64 bits and server
            epoch bucket; prediction cases disclose IDs and bucket but not state.
          responses:
          - status_code: 201
            content_type: application/json
          - status_code: 403
            content_type: application/json
          - status_code: 409
            content_type: application/json
        - route_id: the-diagnostic-evidence-bundle
          path: /api/the-diagnostic-evidence-bundle
          methods:
          - POST
          auth_required: true
          auth_scheme: ARWC diagnostic service session
          session_required: true
          description: After compensating for the predicted response selector, multiplicative RSA ciphertext queries
            and the A/B/C/D padding classes implement a Bleichenbacher interval search within 4096 queries and expose
            the ENG1 archive-unlock plaintext for bundle DIAG-EVID-CRR-R7, which contains signer executable DSIGN-CRR-R3
            and 16 signed records.
          responses:
          - status_code: 201
            content_type: application/json
          - status_code: 403
            content_type: application/json
          - status_code: 409
            content_type: application/json
        - route_id: signed-by-someone-who-never-approved-it
          path: /api/signed-by-someone-who-never-approved-it
          methods:
          - POST
          auth_required: true
          auth_scheme: ARWC diagnostic service session
          session_required: true
          description: Signer CRR25519-S uses Edwards25519 field p=2^255-19, d=-121665/121666, standard compressed
            base point, scalar order 2^252+27742317777372353535851937790883648493, little-endian encoding, h=SHA-512(R||A||message)
            reduced modulo the order, and s=k+h*x mod order; each record leaks nonce bits 60-251 and metadata gives
            the signed delta between the two records' lower 60-bit nonce portions, permitting recovery of the existing
            key and one fresh request EXP-CAL-CRR-25.
          responses:
          - status_code: 201
            content_type: application/json
          - status_code: 403
            content_type: application/json
          - status_code: 409
            content_type: application/json
        - route_id: a-program-the-engineer-would-accept
          path: /api/a-program-the-engineer-would-accept
          methods:
          - POST
          auth_required: true
          auth_scheme: ARWC diagnostic service session
          session_required: true
          description: Collision program DPG-CRR-CINDER preserves required diagnostics but changes only Cairn reserve
            estimate to 13.40 ML at planning consumer PLAN-CONSUMER-R8; unaffected district outputs and raw observations
            remain identical.
          responses:
          - status_code: 201
            content_type: application/json
          - status_code: 403
            content_type: application/json
          - status_code: 409
            content_type: application/json
        - route_id: the-vault-s-misleading-length
          path: /api/the-vault-s-misleading-length
          methods:
          - GET
          auth_required: true
          auth_scheme: ARWC diagnostic service session
          session_required: true
          description: Diagnostic vault VAULT-CRR-R5 uses DVL1 records with u16 declared length, u16 header length,
            u32 CRC32C, and 512-byte bounded request; case DV-CRR-4417 references protected history HIST-APR-CRR-09.
          responses:
          - status_code: 200
            content_type: application/json
          - status_code: 403
            content_type: application/json
          - status_code: 409
            content_type: application/json
        - route_id: past-the-parser-s-boundary
          path: /api/past-the-parser-s-boundary
          methods:
          - POST
          auth_required: true
          auth_scheme: ARWC diagnostic service session
          session_required: true
          description: Parser validates only the 16-bit wrapped sum of declared length and header length, then copies
            header length bytes into a fixed 0x120-byte stack workspace without comparing the two lengths, permitting
            a bounded overwrite beyond the intended record.
          responses:
          - status_code: 201
            content_type: application/json
          - status_code: 403
            content_type: application/json
          - status_code: 409
            content_type: application/json
        - route_id: the-state-execution-returns-to
          path: /api/the-state-execution-returns-to
          methods:
          - POST
          auth_required: true
          auth_scheme: ARWC diagnostic service session
          session_required: true
          description: x86_64 worker has stack canary disclosed by status record, NX and PIE enabled, fixed libdiagnostic
            build ID, and enough protected saved-state influence to call one exported worker function.
          responses:
          - status_code: 201
            content_type: application/json
          - status_code: 403
            content_type: application/json
          - status_code: 409
            content_type: application/json
        - route_id: the-diagnostic-service-s-authority
          path: /api/the-diagnostic-service-s-authority
          methods:
          - POST
          auth_required: true
          auth_scheme: ARWC diagnostic service session
          session_required: true
          description: Exported function export_history(HIST-APR-CRR-09) runs as svc-diagnostic-vault and writes
            the restricted approval history to caller results; arbitrary paths, commands, and live approval issuance
            are unavailable.
          responses:
          - status_code: 201
            content_type: application/json
          - status_code: 403
            content_type: application/json
          - status_code: 409
            content_type: application/json
