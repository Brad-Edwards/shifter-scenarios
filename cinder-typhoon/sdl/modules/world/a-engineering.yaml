# In-world draft. Unspecified realization remains open.
name: cinder-a-engineering
version: 0.1.0
semantic_revision: raes-progressive-semantics/v1
module:
  id: cinder-typhoon/a-engineering
  version: 0.1.0
  exports:
    nodes:
    - subnet
    - a-hmi
    - a-historian
    - a-engineering
    - a-diagnostics
    infrastructure:
    - subnet
    - a-hmi
    - a-historian
    - a-engineering
    - a-diagnostics
    entities:
    - organization
    features:
    - a-hmi
    - a-historian
    - a-engineering
    - a-diagnostics
    - a-hmi--dispatch
    - a-engineering--utility-worker
    - a-diagnostics--vault-worker
    - a-diagnostics--history
    - a-diagnostics--estimate-output
    - a-diagnostics--program-output
    - a-diagnostics--export-log
realization:
  default: open
nodes:
  subnet:
    type: switch
    description: 'ARWC: OT engineering / supervision. Logical network segment; physical realization and addressing
      remain open.'
  a-hmi:
    type: compute
    description: Supervisory process view, practice model, command-plan binder, and private scheduler.
    features:
      a-hmi: ''
      a-hmi--dispatch: ''
    os: linux
    services:
    - name: supervisory-operations
      port: 443
      protocol: tcp
    runtime:
      filesystem_inventory:
      - path: /var/lib/arwc-hmi
        entry_type: directory
        owner_user: arwc-hmi
        owner_group: arwc-hmi
        mode: '0700'
        stability: volume_backed
        sensitivity: secret_fixture
        description: Private service contracts, immutable seed records, participant-scoped results, and protected
          audit state.
      local_identity:
        users:
        - username: arwc-hmi
          primary_group: arwc-hmi
          locked: true
          no_login: true
        groups:
        - name: arwc-hmi
          members:
          - arwc-hmi
      network:
        hostname: a-hmi
        domainname: a-engineering.arwc.test
        endpoints:
        - network: a-engineering.subnet
          ip_address: 10.77.63.20
          ip_prefix_length: 24
          gateway: 10.77.63.1
          aliases:
          - a-hmi
          dns_names:
          - supervisory-operations.arwc.test
          backend:
            driver: bridge
            description: ARWC a-engineering segment.
      service_listeners:
      - service_listener_id: supervisory-operations-https
        service: supervisory-operations
        address: 0.0.0.0
        port: 443
        protocol: tcp
        address_family: ipv4
        scope: wildcard
      applications:
      - application_id: supervisory-operations
        service: supervisory-operations
        protocol: https
        base_path: /
        description: Supervisory process view, practice model, command-plan binder, and private scheduler.
        routes:
        - route_id: the-reservoir-s-present-tense
          path: /api/the-reservoir-s-present-tense
          methods:
          - GET
          auth_required: true
          auth_scheme: ARWC scoped OT read or control session
          session_required: true
          description: Current process view PV-CRR-2026-09-25T1400Z reports measured gate positions, actual flows,
            integrated volume, and usable reserve for interval 14:00:00-14:05:00Z separately from requested setpoints.
          responses:
          - status_code: 200
            content_type: application/json
          - status_code: 403
            content_type: application/json
          - status_code: 409
            content_type: application/json
        - route_id: the-mode-the-plant-is-in
          path: /api/the-mode-the-plant-is-in
          methods:
          - GET
          auth_required: true
          auth_scheme: ARWC scoped OT read or control session
          session_required: true
          description: Mode record MODE-CRR-17 is DRY_PERIOD_MANAGED, effective for project CRR-CTRL-R21 and outlet
            group OG-CRR-02.
          responses:
          - status_code: 200
            content_type: application/json
          - status_code: 403
            content_type: application/json
          - status_code: 409
            content_type: application/json
        - route_id: the-instrument-in-the-note
          path: /api/the-instrument-in-the-note
          methods:
          - GET
          auth_required: true
          auth_scheme: ARWC scoped OT read or control session
          session_required: true
          description: Controls note ENG-CRR-OG2-17 names instrument FIT-CRR-204B and historian tag CRR.OUTLET.02B.FLOW_ACTUAL;
            ordinary context reuses narrative document me-engineering-note-01-1.
          responses:
          - status_code: 200
            content_type: application/json
          - status_code: 403
            content_type: application/json
          - status_code: 409
            content_type: application/json
        - route_id: the-first-live-trace
          path: /api/the-first-live-trace
          methods:
          - POST
          auth_required: true
          auth_scheme: ARWC scoped OT read or control session
          session_required: true
          description: Commissioning event EVT-COMM-OG2-114 ramped each gate linearly for 20 seconds, held 40 seconds,
            and ramped closed for 20 seconds; the 60 full-flow-equivalent seconds integrate to 0.012 ML, and HMI
            plus independent instrument series must correlate to that trace while reusing ordinary narrative document
            me-commissioning-01.
          responses:
          - status_code: 201
            content_type: application/json
          - status_code: 403
            content_type: application/json
          - status_code: 409
            content_type: application/json
        - route_id: the-operating-envelope
          path: /api/the-operating-envelope
          methods:
          - GET
          auth_required: true
          auth_scheme: ARWC scoped OT read or control session
          session_required: true
          description: Envelope ENV-OG2-R6 limits each gate to 0.50 m3/s, aggregate to 1.00 m3/s, ramp to 0.10 m3/s
            per 20 seconds, hold to 1200 seconds, and volume to 1.20 ML.
          responses:
          - status_code: 200
            content_type: application/json
          - status_code: 403
            content_type: application/json
          - status_code: 409
            content_type: application/json
        - route_id: conditions-before-movement
          path: /api/conditions-before-movement
          methods:
          - GET
          auth_required: true
          auth_scheme: ARWC scoped OT read or control session
          session_required: true
          description: Practice permissive PRACTICE-PERM-02 is false in supplied state because simulation reset_complete
            is not asserted; live permissive PERM-OG2-LIVE-R4 is separate.
          responses:
          - status_code: 200
            content_type: application/json
          - status_code: 403
            content_type: application/json
          - status_code: 409
            content_type: application/json
        - route_id: accepted-is-not-actuated
          path: /api/accepted-is-not-actuated
          methods:
          - POST
          auth_required: true
          auth_scheme: ARWC scoped OT read or control session
          session_required: true
          description: Practice requests PRACTICE-REQ-11 and PRACTICE-REQ-12 are acknowledged but not actuated while
            PRACTICE-PERM-02 is false; simulator measurements remain at zero.
          responses:
          - status_code: 201
            content_type: application/json
          - status_code: 403
            content_type: application/json
          - status_code: 409
            content_type: application/json
        - route_id: a-sequence-the-process-can-follow
          path: /api/a-sequence-the-process-can-follow
          methods:
          - POST
          auth_required: true
          auth_scheme: ARWC scoped OT read or control session
          session_required: true
          description: Practice checkpoint PRACTICE-OG2-07 accepts a permissive transition then ramps each simulated
            gate linearly to 0.15 m3/s for 30 seconds, holds 70 seconds, and ramps closed for 30 seconds; 100 full-flow-equivalent
            seconds independently report 0.03 ML without changing live reserve.
          responses:
          - status_code: 201
            content_type: application/json
          - status_code: 403
            content_type: application/json
          - status_code: 409
            content_type: application/json
        - route_id: paper-truth
          path: /api/paper-truth
          methods:
          - POST
          auth_required: true
          auth_scheme: ARWC scoped OT read or control session
          session_required: true
          description: Plan PLAN-CRR-LOSS-1000 ramps balanced gates linearly for 100 seconds, holds each at 0.50
            m3/s for 900 seconds, and ramps closed for 100 seconds; 1000 full-flow-equivalent seconds release 1.00
            ML, leaving 11.40 ML, a 0.60 ML shortfall, USD 1,440 liability, and Stage A restrictions under CONT-DRY-A-R3.
          responses:
          - status_code: 201
            content_type: application/json
          - status_code: 403
            content_type: application/json
          - status_code: 409
            content_type: application/json
        - route_id: bind-the-plan-to-the-plant
          path: /api/bind-the-plan-to-the-plant
          methods:
          - POST
          auth_required: true
          auth_scheme: ARWC scoped OT read or control session
          session_required: true
          description: Command-plan binder requires scoped client, asset AST-CRR-017, outlet OG-CRR-02, project
            CRR-CTRL-R21, map MAP-OG2-R8, mode MODE-CRR-17, envelope ENV-OG2-R6, and plan PLAN-CRR-LOSS-1000.
          responses:
          - status_code: 201
            content_type: application/json
          - status_code: 403
            content_type: application/json
          - status_code: 409
            content_type: application/json
        - route_id: a-forecast-that-matches-the-instrument
          path: /api/a-forecast-that-matches-the-instrument
          methods:
          - POST
          auth_required: true
          auth_scheme: ARWC scoped OT read or control session
          session_required: true
          description: Forecast case FCST-CRR-33 joins 20-second instrument samples, fixed 40-second publication
            delay, scale gain 1.00, and current map MAP-OG2-R8; tolerance is 0.01 ML.
          responses:
          - status_code: 201
            content_type: application/json
          - status_code: 403
            content_type: application/json
          - status_code: 409
            content_type: application/json
        - route_id: the-expensive-hour
          path: /api/the-expensive-hour
          methods:
          - POST
          auth_required: true
          auth_scheme: ARWC scoped OT read or control session
          session_required: true
          description: Checkpoint REH-SCHED-33 has twelve 300-second intervals, disclosed demand vector, 180 m3
            initial buffer, 120-240 m3 bounds, 160-200 m3 final bound, 0.10 m3/s ramps, and 0.78-0.84 ML reservoir-volume
            objective.
          responses:
          - status_code: 201
            content_type: application/json
          - status_code: 403
            content_type: application/json
          - status_code: 409
            content_type: application/json
      app_authorizations:
      - app_authorization_id: supervisory-operations-rbac
        resource_vocabulary: app_resource
        auth_enabled: true
        principals:
        - principal_id: supervisory-operator-principal
          kind: service_account
          name: ARWC supervisory-operator principal
          credential_classification: redacted
        roles:
        - role_id: supervisory-operator
          name: ARWC supervisory operator
        permission_grants:
        - grant_id: supervisory-operator-declared-routes
          role_ref: supervisory-operator
          resource_kind: app_resource
          actions:
          - create
          - read
          - update
          - execute
          resource_patterns:
          - the-reservoir-s-present-tense
          - the-mode-the-plant-is-in
          - the-instrument-in-the-note
          - the-first-live-trace
          - the-operating-envelope
          - conditions-before-movement
          - accepted-is-not-actuated
          - a-sequence-the-process-can-follow
          - paper-truth
          - bind-the-plan-to-the-plant
          - a-forecast-that-matches-the-instrument
          - the-expensive-hour
          effect: allow
        role_mappings:
        - mapping_id: supervisory-operator-mapping
          role_ref: supervisory-operator
          users:
          - supervisory-operator-principal
        tenants:
        - tenant_id: arwc
          name: Alterra Regional Water Company
      software_components:
      - component_id: supervisory-operations
        name: Supervisory process view, practice model, command-plan binder, and private scheduler
        version: 1.0.0
        component_type: application
        provenance: operator
        installed_paths:
        - /opt/supervisory-operations
