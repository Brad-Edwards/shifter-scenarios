          gateway: 10.77.63.1
          aliases:
          - a-historian
          dns_names:
          - process-historian.arwc.test
          backend:
            driver: bridge
            description: ARWC a-engineering segment.
      service_listeners:
      - service_listener_id: process-historian-https
        service: process-historian
        address: 0.0.0.0
        port: 443
        protocol: tcp
        address_family: ipv4
        scope: wildcard
      applications:
      - application_id: process-historian
        service: process-historian
        protocol: https
        base_path: /
        description: Versioned process historian, tag, scale, and trace service.
        routes: []
      app_authorizations:
      - app_authorization_id: process-historian-rbac
        resource_vocabulary: app_resource
        auth_enabled: true
        principals:
