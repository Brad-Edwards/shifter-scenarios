  a-engineering:
    type: compute
    description: Engineering project, legacy analysis, verifier, replay, and constrained utility service.
    features:
      a-engineering: ''
      a-engineering--utility-worker: ''
    os: linux
    services:
    - name: engineering-workbench
      port: 443
      protocol: tcp
    runtime:
      filesystem_inventory:
      - path: /var/lib/arwc-engineering
        entry_type: directory
        owner_user: arwc-engineering
        owner_group: arwc-engineering
        mode: '0700'
        stability: volume_backed
        sensitivity: secret_fixture
        description: Private service contracts, immutable seed records, participant-scoped results, and protected
          audit state.
      local_identity:
        users:
        - username: arwc-engineering
          primary_group: arwc-engineering
          locked: true
          no_login: true
        groups:
        - name: arwc-engineering
          members:
          - arwc-engineering
      network:
        hostname: a-engineering
        domainname: a-engineering.arwc.test
        endpoints:
        - network: a-engineering.subnet
          ip_address: 10.77.63.40
          ip_prefix_length: 24
          gateway: 10.77.63.1
          aliases:
          - a-engineering
          dns_names:
          - engineering-workbench.arwc.test
          backend:
            driver: bridge
            description: ARWC a-engineering segment.
      service_listeners:
      - service_listener_id: engineering-workbench-https
        service: engineering-workbench
        address: 0.0.0.0
        port: 443
        protocol: tcp
        address_family: ipv4
        scope: wildcard
      applications:
      - application_id: engineering-workbench
        service: engineering-workbench
        protocol: https
        base_path: /
        description: Engineering project, legacy analysis, verifier, replay, and constrained utility service.
        routes:
        - route_id: the-diagnostic-nobody-retired
          path: /api/the-diagnostic-nobody-retired
          methods:
          - GET
          auth_required: true
          auth_scheme: ARWC engineering workspace session
          session_required: true
          description: Legacy diagnostic package DIAG-CRR-MIXED-19 contains linux x86_64 ELF, symbols stripped,
            SHA-256 manifest, project R19 samples, and expected ordinary output.
          responses:
          - status_code: 200
            content_type: application/json
          - status_code: 403
            content_type: application/json
          - status_code: 409
            content_type: application/json
        - route_id: a-second-interpretation
          path: /api/a-second-interpretation
          methods:
          - POST
          auth_required: true
          auth_scheme: ARWC engineering workspace session
          session_required: true
          description: Binary begins in long mode then uses a far return to a 32-bit compatibility segment for its
            record decoder; correct analysis must preserve 32-bit wrap and zero-extension behavior.
          responses:
          - status_code: 201
            content_type: application/json
          - status_code: 403
            content_type: application/json
          - status_code: 409
            content_type: application/json
        - route_id: the-hidden-check
          path: /api/the-hidden-check
          methods:
          - POST
          auth_required: true
          auth_scheme: ARWC engineering workspace session
          session_required: true
          description: Compatibility decoder uses a 32-bit rolling key and a 64-bit verifier; mixed-width state
            reveals protected migration record MIG-OG2-R19-R21.
          responses:
          - status_code: 201
            content_type: application/json
          - status_code: 403
            content_type: application/json
          - status_code: 409
            content_type: application/json
        - route_id: a-map-from-the-old-diagnostic
          path: /api/a-map-from-the-old-diagnostic
          methods:
          - POST
          auth_required: true
          auth_scheme: ARWC engineering workspace session
          session_required: true
          description: Recovered migration record maps legacy project R19 identifiers to CRR-CTRL-R21 and provides
            a signed comparison digest, but is historical rather than current deployment evidence.
          responses:
          - status_code: 201
            content_type: application/json
          - status_code: 403
            content_type: application/json
          - status_code: 409
            content_type: application/json
        - route_id: the-project-and-the-note
          path: /api/the-project-and-the-note
          methods:
          - GET
          auth_required: true
          auth_scheme: ARWC engineering workspace session
          session_required: true
          description: 'Engineering project index PROJ-CRR-INDEX-R9 and note ENG-DEPLOY-CRR-21 disagree: workspace
            claims R19 while signed deployment manifest claims CRR-CTRL-R21; ordinary background reuses me-project-handover-01.'
          responses:
          - status_code: 200
            content_type: application/json
          - status_code: 403
            content_type: application/json
          - status_code: 409
            content_type: application/json
        - route_id: which-project-is-running
          path: /api/which-project-is-running
          methods:
          - POST
          auth_required: true
          auth_scheme: ARWC engineering workspace session
          session_required: true
          description: Independent instrument handshake DEPLOY-OBS-CRR-21 reports project digest for CRR-CTRL-R21;
            comparison must reject the stale workspace claim and bind the observed revision.
          responses:
          - status_code: 201
            content_type: application/json
          - status_code: 403
            content_type: application/json
          - status_code: 409
            content_type: application/json
        - route_id: the-viewer-in-the-delivery
          path: /api/the-viewer-in-the-delivery
          methods:
          - GET
          auth_required: true
          auth_scheme: ARWC engineering workspace session
          session_required: true
          description: Delivery ENG-CRR-SEALED-22 contains Nim 2.0.8 linux/amd64 viewer VIEW-CRR-R5, sealed project
            CRR-SEALED-PKG-R7, and exact build manifest.
          responses:
          - status_code: 200
            content_type: application/json
          - status_code: 403
            content_type: application/json
          - status_code: 409
            content_type: application/json
        - route_id: the-machine-inside-the-viewer
          path: /api/the-machine-inside-the-viewer
          methods:
          - POST
          auth_required: true
          auth_scheme: ARWC engineering workspace session
          session_required: true
          description: Viewer VM uses eight 16-bit little-endian opcodes MOVI, LOAD8, XOR, ADD, ROTL, STORE8, JNZ,
            and HALT with 256-byte memory and wraparound arithmetic; four fragments freeze state effects.
          responses:
          - status_code: 201
            content_type: application/json
          - status_code: 403
            content_type: application/json
          - status_code: 409
            content_type: application/json
        - route_id: the-decision-inside-the-sealed-project
          path: /api/the-decision-inside-the-sealed-project
          methods:
          - POST
          auth_required: true
          auth_scheme: ARWC engineering workspace session
          session_required: true
          description: VM-derived key opens AES-256-GCM project package with project ID as AAD, revealing commissioning
            decision DEC-CRR-OG2-R7, project revision R21, helper REVIEWHELP-R4, and retained review context.
          responses:
          - status_code: 201
            content_type: application/json
          - status_code: 403
            content_type: application/json
          - status_code: 409
            content_type: application/json
        - route_id: the-reviewer-who-was-never-listed
          path: /api/the-reviewer-who-was-never-listed
          methods:
          - POST
          auth_required: true
          auth_scheme: ARWC engineering workspace session
          session_required: true
          description: Review helper is .NET 8 ReadyToRun x86_64 with a native-method body replaced after compilation
            while managed metadata lists benign reviewer; actual code derives concealed identity elias.vorn-review
            and uses its historical archive session for comparison CMP-CRR-R21-R7.
          responses:
          - status_code: 201
            content_type: application/json
          - status_code: 403
            content_type: application/json
          - status_code: 409
            content_type: application/json
        - route_id: what-counts-as-intact
          path: /api/what-counts-as-intact
          methods:
          - POST
          auth_required: true
          auth_scheme: ARWC engineering workspace session
          session_required: true
          description: Legacy verifier VER-ROT128-R3 treats each 16-byte block as little-endian u128 and updates
            state s=ROTL128(s,17) XOR block XOR ROTL128(block,41) from IV 6a09e667f3bcc908bb67ae8584caa73b, then
            returns s XOR ROTL128(s,29) XOR byte_length; six programs freeze padding, length, and decisions.
          responses:
          - status_code: 201
            content_type: application/json
          - status_code: 403
            content_type: application/json
          - status_code: 409
            content_type: application/json
        - route_id: the-constraints-of-a-valid-looking-program
          path: /api/the-constraints-of-a-valid-looking-program
          methods:
          - POST
          auth_required: true
          auth_scheme: ARWC engineering workspace session
          session_required: true
          description: Accepted diagnostic program format DPG1 requires header, block table, mandatory sensor tests,
            bounded constants, checksum, and output schema; a GF(2) model must preserve all structural constraints.
          responses:
          - status_code: 201
            content_type: application/json
          - status_code: 403
            content_type: application/json
          - status_code: 409
            content_type: application/json
        - route_id: the-utility-s-small-world
          path: /api/the-utility-s-small-world
          methods:
          - POST
          auth_required: true
          auth_scheme: ARWC engineering workspace session
          session_required: true
          description: Utility UTIL-CRR-ISSUER-R4 is Linux x86_64 PIE built by clang 18.1 with -O2 -fstack-protector-strong
            -fPIE -pie -Wl,-z,relro,-z,now, glibc 2.39, CET disabled, 16 KiB executable text, ASLR enabled, seccomp
            allowlist, and file capability cap_setuid+ep; it serves engineering relation REL-UTIL-ISSUER-4.
          responses:
          - status_code: 201
            content_type: application/json
          - status_code: 403
            content_type: application/json
          - status_code: 409
            content_type: application/json
        - route_id: control-with-very-little-room
          path: /api/control-with-very-little-room
          methods:
          - POST
          auth_required: true
          auth_scheme: ARWC engineering workspace session
          session_required: true
          description: Length field copies up to 384 bytes into a 192-byte frame with stack canary disclosure in
            a preceding status record; sparse gadgets plus fixed vDSO mapping permit a bounded call-oriented chain
            without a shell.
          responses:
          - status_code: 201
            content_type: application/json
          - status_code: 403
            content_type: application/json
          - status_code: 409
            content_type: application/json
        - route_id: the-replay-s-pieces
          path: /api/the-replay-s-pieces
          methods:
          - GET
          auth_required: true
          auth_scheme: ARWC engineering workspace session
          session_required: true
          description: Replay REPLAY-CRR-R19 is C++20 ECS with entities Reservoir, OutletGroup, GateA, GateB, Buffer
            and components Setpoint, Position, Flow, Reserve, Mode, Revision.
          responses:
          - status_code: 200
            content_type: application/json
          - status_code: 403
            content_type: application/json
          - status_code: 409
            content_type: application/json
        - route_id: the-systems-that-update-it
          path: /api/the-systems-that-update-it
          methods:
          - POST
          auth_required: true
          auth_scheme: ARWC engineering workspace session
          session_required: true
          description: Systems execute in fixed order CommandApply, RampLimit, FlowIntegrate, ReserveUpdate, ApprovalCheck;
            four distinguishing snapshots define entity creation and component mutation.
          responses:
          - status_code: 201
            content_type: application/json
          - status_code: 403
            content_type: application/json
          - status_code: 409
            content_type: application/json
        - route_id: the-condition-the-old-model-used
          path: /api/the-condition-the-old-model-used
          methods:
          - POST
          auth_required: true
          auth_scheme: ARWC engineering workspace session
          session_required: true
          description: Old ApprovalCheck reads pre-ReserveUpdate cached reserve and approves when cached reserve
            minus requested volume is at least committed allocation; current model uses post-update reserve.
          responses:
          - status_code: 201
            content_type: application/json
          - status_code: 403
            content_type: application/json
          - status_code: 409
            content_type: application/json
        - route_id: replay-is-not-reality
          path: /api/replay-is-not-reality
          methods:
          - POST
          auth_required: true
          auth_scheme: ARWC engineering workspace session
          session_required: true
          description: Witness trace TRACE-R19-DISPUTED shows old acceptance at 12.40 ML for a 1.00 ML request while
            current independent observations yield 11.40 ML and reject the old sufficiency claim.
          responses:
          - status_code: 201
            content_type: application/json
          - status_code: 403
            content_type: application/json
          - status_code: 409
            content_type: application/json
