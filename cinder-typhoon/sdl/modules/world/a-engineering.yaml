  a-diagnostics:
    type: compute
    description: Estimator, recovery, signer, diagnostic-vault, history, and controlled-output service.
    features:
      a-diagnostics: ''
      a-diagnostics--vault-worker: ''
      a-diagnostics--history: ''
      a-diagnostics--estimate-output: ''
      a-diagnostics--program-output: ''
      a-diagnostics--export-log: ''
    os: linux
    services:
    - name: diagnostic-services
      port: 443
      protocol: tcp
    runtime:
      filesystem_inventory:
      - path: /var/lib/arwc-diagnostics
        entry_type: directory
        owner_user: arwc-diagnostics
        owner_group: arwc-diagnostics
        mode: '0700'
        stability: volume_backed
        sensitivity: secret_fixture
        description: Private service contracts, immutable seed records, participant-scoped results, and protected
          audit state.
      local_identity:
        users:
        - username: arwc-diagnostics
          primary_group: arwc-diagnostics
          locked: true
          no_login: true
        groups:
        - name: arwc-diagnostics
          members:
          - arwc-diagnostics
      network:
        hostname: a-diagnostics
        domainname: a-engineering.arwc.test
        endpoints:
        - network: a-engineering.subnet
          ip_address: 10.77.63.50
          ip_prefix_length: 24
          gateway: 10.77.63.1
          aliases:
          - a-diagnostics
          dns_names:
          - diagnostic-services.arwc.test
          backend:
            driver: bridge
            description: ARWC a-engineering segment.
      service_listeners:
      - service_listener_id: diagnostic-services-https
        service: diagnostic-services
        address: 0.0.0.0
        port: 443
        protocol: tcp
        address_family: ipv4
        scope: wildcard
      applications:
      - application_id: diagnostic-services
        service: diagnostic-services
        protocol: https
        base_path: /
        description: Estimator, recovery, signer, diagnostic-vault, history, and controlled-output service.
        routes:
        - route_id: a-measurement-with-side-effects
          path: /api/a-measurement-with-side-effects
          methods:
          - POST
          auth_required: true
          auth_scheme: ARWC diagnostic service session
          session_required: true
          description: Estimator EST-CRR-23 is C++20 glibc 2.39 x86_64; measurement-list erase leaves one 0x90-byte
            object reachable through stale index when duplicate source IDs are coalesced.
          responses:
          - status_code: 201
            content_type: application/json
          - status_code: 403
            content_type: application/json
          - status_code: 409
            content_type: application/json
        - route_id: control-beyond-the-measurement
          path: /api/control-beyond-the-measurement
          methods:
          - POST
          auth_required: true
          auth_scheme: ARWC diagnostic service session
          session_required: true
          description: Deterministic tcache reuse places a planning-state object in the freed slot after three bounded
            add/remove operations; writable fields are reserve_ml and quality while district_id and vtable remain
            protected.
          responses:
          - status_code: 201
            content_type: application/json
          - status_code: 403
            content_type: application/json
          - status_code: 409
            content_type: application/json
        - route_id: a-measurement-that-never-existed
          path: /api/a-measurement-that-never-existed
          methods:
          - POST
          auth_required: true
          auth_scheme: ARWC diagnostic service session
          session_required: true
          description: Controlled reserve 13.40 ML with valid quality makes allocation case ALLOC-CASE-CRR-33 sufficient;
            North and Merewick estimates and independent instruments must retain their original values.
          responses:
          - status_code: 201
            content_type: application/json
          - status_code: 403
            content_type: application/json
          - status_code: 409
            content_type: application/json
        - route_id: two-kinds-of-answer
          path: /api/two-kinds-of-answer
          methods:
          - GET
          auth_required: true
          auth_scheme: ARWC diagnostic service session
          session_required: true
          description: 'Recovery contract RECOVERY-ORACLE-R4 uses RSA-2048 PKCS#1 v1.5 and four classes: A for missing
            00 02 prefix, B for fewer than eight nonzero padding bytes, C for missing separator or wrong ENG1 payload
            tag, and D for structurally valid padding; it enforces 4096 total queries and supplies labeled examples
            for engineering record ENG-REC-24.'
          responses:
          - status_code: 200
            content_type: application/json
          - status_code: 403
            content_type: application/json
          - status_code: 409
            content_type: application/json
        - route_id: which-answer-comes-next
          path: /api/which-answer-comes-next
          methods:
          - POST
          auth_required: true
          auth_scheme: ARWC diagnostic service session
          session_required: true
          description: Response-class selector is xorshift128+ seeded from the request ID low 64 bits and server
            epoch bucket; prediction cases disclose IDs and bucket but not state.
          responses:
          - status_code: 201
            content_type: application/json
          - status_code: 403
            content_type: application/json
          - status_code: 409
            content_type: application/json
        - route_id: the-diagnostic-evidence-bundle
          path: /api/the-diagnostic-evidence-bundle
          methods:
          - POST
          auth_required: true
          auth_scheme: ARWC diagnostic service session
          session_required: true
          description: After compensating for the predicted response selector, multiplicative RSA ciphertext queries
            and the A/B/C/D padding classes implement a Bleichenbacher interval search within 4096 queries and expose
            the ENG1 archive-unlock plaintext for bundle DIAG-EVID-CRR-R7, which contains signer executable DSIGN-CRR-R3
            and 16 signed records.
          responses:
          - status_code: 201
            content_type: application/json
          - status_code: 403
            content_type: application/json
          - status_code: 409
            content_type: application/json
        - route_id: signed-by-someone-who-never-approved-it
          path: /api/signed-by-someone-who-never-approved-it
          methods:
          - POST
          auth_required: true
          auth_scheme: ARWC diagnostic service session
          session_required: true
          description: Signer CRR25519-S uses Edwards25519 field p=2^255-19, d=-121665/121666, standard compressed
            base point, scalar order 2^252+27742317777372353535851937790883648493, little-endian encoding, h=SHA-512(R||A||message)
            reduced modulo the order, and s=k+h*x mod order; each record leaks nonce bits 60-251 and metadata gives
            the signed delta between the two records' lower 60-bit nonce portions, permitting recovery of the existing
            key and one fresh request EXP-CAL-CRR-25.
          responses:
          - status_code: 201
            content_type: application/json
          - status_code: 403
            content_type: application/json
          - status_code: 409
            content_type: application/json
        - route_id: a-program-the-engineer-would-accept
          path: /api/a-program-the-engineer-would-accept
          methods:
          - POST
          auth_required: true
          auth_scheme: ARWC diagnostic service session
          session_required: true
          description: Collision program DPG-CRR-CINDER preserves required diagnostics but changes only Cairn reserve
            estimate to 13.40 ML at planning consumer PLAN-CONSUMER-R8; unaffected district outputs and raw observations
            remain identical.
          responses:
          - status_code: 201
            content_type: application/json
          - status_code: 403
            content_type: application/json
          - status_code: 409
            content_type: application/json
        - route_id: the-vault-s-misleading-length
          path: /api/the-vault-s-misleading-length
          methods:
          - GET
          auth_required: true
          auth_scheme: ARWC diagnostic service session
          session_required: true
          description: Diagnostic vault VAULT-CRR-R5 uses DVL1 records with u16 declared length, u16 header length,
            u32 CRC32C, and 512-byte bounded request; case DV-CRR-4417 references protected history HIST-APR-CRR-09.
          responses:
          - status_code: 200
            content_type: application/json
          - status_code: 403
            content_type: application/json
          - status_code: 409
            content_type: application/json
        - route_id: past-the-parser-s-boundary
          path: /api/past-the-parser-s-boundary
          methods:
          - POST
          auth_required: true
          auth_scheme: ARWC diagnostic service session
          session_required: true
          description: Parser validates only the 16-bit wrapped sum of declared length and header length, then copies
            header length bytes into a fixed 0x120-byte stack workspace without comparing the two lengths, permitting
            a bounded overwrite beyond the intended record.
          responses:
          - status_code: 201
            content_type: application/json
          - status_code: 403
            content_type: application/json
          - status_code: 409
            content_type: application/json
        - route_id: the-state-execution-returns-to
          path: /api/the-state-execution-returns-to
          methods:
          - POST
          auth_required: true
          auth_scheme: ARWC diagnostic service session
          session_required: true
          description: x86_64 worker has stack canary disclosed by status record, NX and PIE enabled, fixed libdiagnostic
            build ID, and enough protected saved-state influence to call one exported worker function.
          responses:
          - status_code: 201
            content_type: application/json
          - status_code: 403
            content_type: application/json
          - status_code: 409
            content_type: application/json
        - route_id: the-diagnostic-service-s-authority
          path: /api/the-diagnostic-service-s-authority
          methods:
          - POST
          auth_required: true
          auth_scheme: ARWC diagnostic service session
          session_required: true
          description: Exported function export_history(HIST-APR-CRR-09) runs as svc-diagnostic-vault and writes
            the restricted approval history to caller results; arbitrary paths, commands, and live approval issuance
            are unavailable.
          responses:
          - status_code: 201
            content_type: application/json
          - status_code: 403
            content_type: application/json
          - status_code: 409
            content_type: application/json
      app_authorizations:
      - app_authorization_id: diagnostic-services-rbac
        resource_vocabulary: app_resource
        auth_enabled: true
        principals:
        - principal_id: diagnostic-user-principal
          kind: service_account
          name: ARWC diagnostic-user principal
          credential_classification: redacted
        roles:
        - role_id: diagnostic-user
          name: ARWC diagnostic user
        permission_grants:
        - grant_id: diagnostic-user-declared-routes
          role_ref: diagnostic-user
          resource_kind: app_resource
          actions:
          - create
          - read
          - update
          - execute
          resource_patterns:
          - a-measurement-with-side-effects
          - control-beyond-the-measurement
          - a-measurement-that-never-existed
          - two-kinds-of-answer
          - which-answer-comes-next
          - the-diagnostic-evidence-bundle
          - signed-by-someone-who-never-approved-it
          - a-program-the-engineer-would-accept
          - the-vault-s-misleading-length
          - past-the-parser-s-boundary
          - the-state-execution-returns-to
          - the-diagnostic-service-s-authority
          effect: allow
        role_mappings:
        - mapping_id: diagnostic-user-mapping
          role_ref: diagnostic-user
          users:
          - diagnostic-user-principal
        tenants:
        - tenant_id: arwc
          name: Alterra Regional Water Company
      software_components:
      - component_id: diagnostic-services
        name: Estimator, recovery, signer, diagnostic-vault, history, and controlled-output service
        version: 1.0.0
        component_type: application
        provenance: operator
        installed_paths:
        - /opt/diagnostic-services
