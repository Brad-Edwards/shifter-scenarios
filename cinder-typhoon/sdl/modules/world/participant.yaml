# In-world draft. Unspecified realization remains open.
name: cinder-participant
version: 0.1.0
semantic_revision: raes-progressive-semantics/v1
module:
  id: cinder-typhoon/participant
  version: 0.1.0
  exports:
    entities:
    - cinder
    nodes:
    - kali
    infrastructure:
    - kali
    propositions:
    - training
    - foothold
    assertions:
    - training-ready
    - training-done
    - foothold-ready
    - foothold-done
    agents:
    - operator
realization:
  default: open
entities:
  cinder:
    name: Cinder Typhoon
    role: red
    mission: Use the supplied developer foothold to compromise FieldKest customer delivery, enter ARWC,
      and cause a bounded Cairn Reach outlet release with financial loss and water restrictions.
nodes:
  kali:
    type: compute
    os: linux
    os_distribution: x-kali:kali
    description: One individual operator’s Kali attacker workstation. The provided co-hacking agent and
      optional personal tools act through this workspace and the same earned authorities. Target systems
      are separate; no automatic access to all subnets.
    runtime:
      filesystem_inventory:
      - path: /home/cinder/TRAINING.md
        entry_type: file
        owner_user: cinder
        owner_group: cinder
        mode: '0444'
        content_digest: 72e66a8561e4579801a66b1730c6bcd393799c5b1360465c0fb1cdbe86948da6
        digest_algorithm: sha256
        stability: stable
        sensitivity: plain
      local_identity:
        users:
        - username: cinder
          primary_group: cinder
          locked: false
          no_login: false
        groups:
        - name: cinder
          members:
          - cinder
      network:
        hostname: kali
        domainname: training
        endpoints:
        - network: training.subnet
          ip_address: 10.77.40.10
          ip_prefix_length: 24
          gateway: 10.77.40.1
          aliases:
          - kali
          dns_names:
          - kali.training
          backend:
            driver: bridge
            description: Isolated Training bridge.
          description: Static participant endpoint on the Training segment.
infrastructure:
  kali:
    links:
    - training.subnet
    description: Attached to the isolated Training segment for the optional rehearsal systems.
propositions:
  training:
    description: The operator has the supplied Cinder training workspace.
    subjects:
    - nodes.participant.kali
    - nodes.training.t-workbench
    basis: declared_state
    predicate:
      kind: boolean
      property: cinder.training.satisfied
      semantic_ref: urn:cinder-typhoon:fact:TRAINING
      operator: equals
      expected: true
  foothold:
    description: The operator has the supplied Rowan Ito developer session at KeplerOps; this is separate
      from the Kali attacker workstation.
    subjects:
    - nodes.k-corporate.k-dev
    basis: declared_state
    predicate:
      kind: boolean
      property: cinder.foothold.satisfied
      semantic_ref: urn:cinder-typhoon:fact:FOOTHOLD
      operator: equals
      expected: true
assertions:
  training-ready:
    proposition: training
    role: precondition
    polarity: positive
  training-done:
    proposition: training
    role: postcondition
    polarity: positive
  foothold-ready:
    proposition: foothold
    role: precondition
    polarity: positive
  foothold-done:
    proposition: foothold
    role: postcondition
    polarity: positive
