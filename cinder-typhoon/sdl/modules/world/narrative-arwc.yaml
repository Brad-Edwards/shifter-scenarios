    sensitivity: plain
    redaction: redact_secrets
    integrity: checksum
    retention: run_lifetime
    loss_disclosure: required
    observation_demand:
      rule_id: cinder.world.arwc.mail.visible
      scope: /content
      mode: selected
      purpose: experimental
      collection: require
      retention: require
      basis: observed
      required: true
      integrity: checksum
      redaction: redact-secrets
      selector:
