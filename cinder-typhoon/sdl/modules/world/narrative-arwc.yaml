observation_boundaries:
  mail-visible:
    projection_basis: Ordinary authenticated reader access; each mailbox owner or listed document reader sees
      their own authorized collection.
    observable_refs:
    - content.mail
    redaction_policy: Preserve authored content only for its listed audience; no collection-wide bypass.
    latency_profile: Initial content available before participant admission.
  documents-visible:
    projection_basis: Ordinary authenticated reader access; each mailbox owner or listed document reader sees
      their own authorized collection.
    observable_refs:
    - content.documents
    redaction_policy: Preserve authored content only for its listed audience; no collection-wide bypass.
