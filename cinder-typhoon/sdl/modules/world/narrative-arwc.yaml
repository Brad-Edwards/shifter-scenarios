propositions:
  mail-visible:
    description: The declared mail can be read through the workplace service with the authored audience boundaries.
    subjects:
    - content.mail
    basis: observed_state
    predicate:
      kind: boolean
      property: cinder.world.arwc.mail.visible
      semantic_ref: urn:cinder-typhoon:world:arwc:mail:visible
      expected: true
    evidence_requirements:
    - mail-visible
  documents-visible:
    description: The declared documents can be read through the workplace service with the authored audience
      boundaries.
    subjects:
    - content.documents
    basis: observed_state
    predicate:
      kind: boolean
      property: cinder.world.arwc.documents.visible
      semantic_ref: urn:cinder-typhoon:world:arwc:documents:visible
      expected: true
    evidence_requirements:
    - documents-visible
assertions:
  mail-visible:
    proposition: mail-visible
    role: postcondition
  documents-visible:
    proposition: documents-visible
    role: postcondition
evidence_requirements:
