          effect: allow
        - grant_id: alternate-review-use
          role_ref: alternate-reviewer
          resource_kind: app_resource
          actions: [read]
          resource_patterns: [handovers/$own/*, reviews/$own/*]
          effect: allow
        - grant_id: assistant-review-update
          role_ref: assistant-review-updater
          resource_kind: app_resource
          actions: [update]
          resource_patterns: [reviews/ASST-DUP-018/duplicate-disposition]
          effect: allow
        role_mappings:
        - mapping_id: rowan-support
          role_ref: developer-support
          users: [rowan-ito]
        - mapping_id: maya-support
          role_ref: support-agent
          users: [maya-ranscombe]
        - mapping_id: talia-review
          role_ref: alternate-reviewer
          users: [talia-mornac-review]
        - mapping_id: assistant-review-binding
          role_ref: assistant-review-updater
          users: [assistant-review-tool]
        tenants:
        - tenant_id: keplerops
          name: KeplerOps
        - tenant_id: ten-arwc-047
          name: Alterra Regional Water Company
        - tenant_id: ten-rill-022
          name: Rillhaven District Heating
      software_components:
      - component_id: fieldkest-support
        name: FieldKest support service
        version: 1.0.0
        component_type: application
        provenance: operator
        installed_paths: [/opt/fieldkest-support]
  k-indexer:
    type: compute
    description: Reproducible native support-bundle indexer and release-exception worker queue.
    os: linux
    architecture: x86_64
    services:
    - name: indexer
      port: 443
      protocol: tcp
    features:
      k-indexer: ''
      k-indexer--worker: ''
      k-indexer--queue: ''
    runtime:
      filesystem_inventory:
      - path: /opt/fieldkest-indexer
        entry_type: directory
        owner_user: root
        owner_group: root
        mode: '0755'
        stability: stable
        sensitivity: plain
        description: Version 1.8.0 source, C++17 build recipe, binary and valid signed bundle corpus.
      - path: /var/lib/fieldkest-indexer
        entry_type: directory
        owner_user: fieldkest-indexer
        owner_group: fieldkest-indexer
        mode: '0700'
        stability: runtime_created
        sensitivity: secret_fixture
        description: Participant-scoped process state, runtime descriptors and immutable transaction audit.
      - path: /var/lib/fieldkest-indexer/queue
        entry_type: directory
        owner_user: fieldkest-worker
        owner_group: fieldkest-worker
        mode: '0700'
        stability: runtime_created
        sensitivity: secret_fixture
        description: Encrypted release-exception queue including REX-2026-091.
      local_identity:
        users:
        - username: fieldkest-indexer
          primary_group: fieldkest-indexer
          locked: true
          no_login: true
        - username: fieldkest-worker
          primary_group: fieldkest-worker
          locked: true
          no_login: true
        groups:
        - name: fieldkest-indexer
          members: [fieldkest-indexer]
        - name: fieldkest-worker
          members: [fieldkest-worker]
      network:
        hostname: k-indexer
        domainname: delivery.keplerops.test
        endpoints:
        - network: k-delivery.subnet
          ip_address: 10.77.51.70
          ip_prefix_length: 24
          gateway: 10.77.51.1
          aliases: [k-indexer]
          dns_names: [indexer.keplerops.test]
          backend:
            driver: bridge
            description: KeplerOps delivery segment.
      service_listeners:
      - service_listener_id: indexer-https
        service: indexer
        address: 0.0.0.0
        port: 443
        protocol: tcp
        address_family: ipv4
        scope: wildcard
      applications:
      - application_id: bundle-indexer
        service: indexer
        protocol: https
        base_path: /
        description: Version 1.8.0 support-bundle indexer. The object decoder widens a 16-bit entry length only after allocating the destination object.
        routes:
        - route_id: bundle-submit
          path: /api/indexes
          methods: [POST]
          auth_required: true
          auth_scheme: Gitea developer session
          session_required: true
          parameters:
          - name: bundle
            location: uploaded_file
            required: true
            data_type: application/vnd.fieldkest.bundle
          responses:
          - status_code: 202
            content_type: application/json
          - status_code: 422
            content_type: application/json
        - route_id: index-result
          path: /api/indexes/{index_id}
          methods: [GET]
          auth_required: true
          auth_scheme: Gitea developer session
          session_required: true
          disclosures:
          - trigger: A valid signed bundle mutates the designated sentinel object through the 16-bit allocation/32-bit copy disagreement.
            status_code: 200
            disclosure: Process generation, arena marker, object marker and keyed integrity relation for the designated runtime descriptor.
            sensitivity: secret_fixture
          responses:
          - status_code: 200
            content_type: application/json
          - status_code: 404
            content_type: application/json
        - route_id: exception-state
          path: /api/internal/release-exceptions/state
          methods: [PATCH]
          auth_required: true
          auth_scheme: Indexer worker lease
          session_required: true
          description: Accepts one value and matching integrity field at the designated state-object offset; all other writes are rejected.
          responses:
          - status_code: 200
            content_type: application/json
          - status_code: 403
            content_type: application/json
        - route_id: complete-exception
          path: /api/internal/release-exceptions/{record_id}/complete
          methods: [POST]
          auth_required: true
          auth_scheme: Indexer worker lease
          session_required: true
          description: Invokes only complete_exception(record_id) and returns the one decrypted queue dossier; it is not a command or expression interface.
          responses:
          - status_code: 200
            content_type: application/json
          - status_code: 403
            content_type: application/json
      app_authorizations:
      - app_authorization_id: indexer-rbac
        resource_vocabulary: app_resource
        auth_enabled: true
        principals:
        - principal_id: rowan-ito
          kind: user
          name: rowan.ito
          credential_classification: none
        - principal_id: indexer-worker
          kind: service_account
          name: svc-indexer-worker
          credential_classification: redacted
        roles:
        - role_id: indexer-submit
          name: Bundle index submitter
        - role_id: exception-worker
          name: Release exception worker
        permission_grants:
        - grant_id: developer-indexer-use
          role_ref: indexer-submit
          resource_kind: app_resource
          actions: [submit, read]
          resource_patterns: [indexes/*]
          effect: allow
        - grant_id: worker-exception-use
          role_ref: exception-worker
          resource_kind: app_resource
          actions: [read, update, execute]
          resource_patterns: [internal/release-exceptions/state, internal/release-exceptions/REX-2026-091/complete]
          effect: allow
        role_mappings:
        - mapping_id: rowan-indexer
          role_ref: indexer-submit
          users: [rowan-ito]
        - mapping_id: indexer-worker-binding
          role_ref: exception-worker
          users: [indexer-worker]
        tenants:
        - tenant_id: keplerops
          name: KeplerOps
      software_components:
      - component_id: fieldkest-bundle-indexer
        name: FieldKest bundle indexer
        version: 1.8.0
        component_type: application
        provenance: operator
        installed_paths: [/opt/fieldkest-indexer/bin/fieldkest-bundle-indexer]
        description: Linux x86-64, C++17, with build inputs and compiler/linker options fixed by the indexer contract.
