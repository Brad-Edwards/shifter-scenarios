        description: FieldKest support and customer delivery service with server-owned sessions and tenant-scoped records.
        routes:
        - route_id: conversation
          path: /api/conversations/{conversation_id}
          methods: [GET]
          auth_required: true
          auth_scheme: Support session cookie
          session_required: true
          responses:
          - status_code: 200
            content_type: application/json
          - status_code: 403
            content_type: application/json
        - route_id: private-handover
          path: /api/handovers/current
          methods: [GET]
          auth_required: true
          auth_scheme: Support session cookie
          session_required: true
          responses:
          - status_code: 200
            content_type: application/json
          - status_code: 403
            content_type: application/json
        - route_id: recovery-lookup
          path: /api/recovery/lookup
          methods: [POST]
          auth_required: false
          session_required: false
          description: Returns only the authored case fragment for talia.mornac-review; redemption also requires the retained browser second factor.
          responses:
          - status_code: 200
            content_type: application/json
          - status_code: 404
            content_type: application/json
        - route_id: recovery-redeem
          path: /api/recovery/redeem
          methods: [POST]
          auth_required: false
          session_required: false
          responses:
          - status_code: 201
            content_type: application/json
          - status_code: 403
            content_type: application/json
        - route_id: assignment
          path: /api/assignments/{assignment_id}
          methods: [GET]
          auth_required: true
          auth_scheme: Support session cookie
          session_required: true
          responses:
          - status_code: 200
            content_type: application/json
          - status_code: 403
            content_type: application/json
        - route_id: copied-handover
          path: /api/cases/{case_id}/copy-handover
          methods: [POST]
          auth_required: true
          auth_scheme: Support session cookie
          session_required: true
          description: Confirms source-case read but omits target-reviewer assignment permission; the created handover remains owned by the target reviewer.
          responses:
          - status_code: 201
            content_type: application/json
          - status_code: 403
            content_type: application/json
        - route_id: customer-dossier
          path: /api/customers/{tenant_id}/dossiers/{dossier_id}
          methods: [GET]
          auth_required: true
          auth_scheme: Support session cookie
          session_required: true
          responses:
          - status_code: 200
            content_type: application/json
          - status_code: 403
            content_type: application/json
        - route_id: tenant-integration
          path: /api/customers/{tenant_id}/integrations/fieldlink
          methods: [GET]
          auth_required: true
          auth_scheme: Support session cookie
          session_required: true
          responses:
          - status_code: 200
            content_type: application/json
        - route_id: tenant-reconcile
          path: /api/customers/{tenant_id}/integrations/fieldlink/reconcile
          methods: [POST]
          auth_required: true
          auth_scheme: Support session cookie
          session_required: true
          responses:
          - status_code: 201
            content_type: application/json
        - route_id: diagnostic-job
          path: /api/customers/{tenant_id}/diagnostics
          methods: [POST]
          auth_required: true
          auth_scheme: Support session cookie
          session_required: true
          description: Requires support role and active connector binding but omits assigned-customer membership for this route.
          responses:
          - status_code: 201
            content_type: application/json
          - status_code: 403
            content_type: application/json
        - route_id: diagnostic-package
          path: /api/diagnostics/{job_id}/package
          methods: [PUT]
          auth_required: true
          auth_scheme: Support session cookie
          session_required: true
          description: Validates schema and digest but does not enforce immutable_source on the authored package template.
          responses:
          - status_code: 200
            content_type: application/json
          - status_code: 422
            content_type: application/json
        - route_id: diagnostic-delivery
