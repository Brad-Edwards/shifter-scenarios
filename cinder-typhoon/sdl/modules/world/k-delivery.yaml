        - role_id: support-agent
          name: Support agent
        - role_id: alternate-reviewer
          name: Restricted alternate reviewer
        - role_id: assistant-review-updater
          name: Bounded duplicate-review updater
        permission_grants:
        - grant_id: developer-conversation-read
