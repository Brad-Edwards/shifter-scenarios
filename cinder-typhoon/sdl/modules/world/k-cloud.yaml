          name: Anonymous workspace object reader
        - role_id: workload-data-reader
          name: Limited workload data reader
        - role_id: export-editor
          name: Support export editor
        - role_id: support-export-writer
          name: Scheduled support export writer
        - role_id: backup-recovery
          name: Backup recovery caller
        - role_id: field-archive-reader
          name: Attested maintenance runtime reader
        permission_grants:
