        - principal_id: support-export-task
          kind: service_account
          name: svc-support-export
          credential_classification: redacted
        - principal_id: history-recovery
          kind: service_account
          name: svc-history-recovery
          credential_classification: redacted
        - principal_id: maintenance-runtime
