  k-assistant:
    type: compute
    description: Deterministic support assistant, retrieval store, bounded completion jobs and review tool broker.
    os: linux
    services:
    - name: assistant
      port: 443
      protocol: tcp
    features:
      k-assistant: ''
      k-assistant--completion: ''
      k-assistant--handover: ''
      k-assistant--review-tool: ''
    runtime:
      filesystem_inventory:
      - path: /var/lib/fieldkest-assistant
        entry_type: directory
        owner_user: fieldkest-assistant
        owner_group: fieldkest-assistant
        mode: '0700'
        stability: volume_backed
        sensitivity: secret_fixture
        description: Retained conversations, retrieval collections, completion examples, handovers and audit.
      - path: /opt/fieldkest-assistant/web/app.js
        entry_type: file
        owner_user: root
        owner_group: root
        mode: '0644'
        stability: stable
        sensitivity: plain
        description: Public assistant browser bundle that discovers the documented configuration route.
      - path: /opt/fieldkest-assistant/models/Qwen2.5-3B-Instruct
        entry_type: directory
        owner_user: root
        owner_group: root
        mode: '0755'
        stability: stable
        sensitivity: plain
        description: Immutable Qwen model tree at revision 14d7620ba47cf51be0b176e14e27e38a34d4ff88.
      local_identity:
        users:
        - username: fieldkest-assistant
          primary_group: fieldkest-assistant
          locked: true
          no_login: true
        - username: svc-assistant-completion
          primary_group: assistant-completion
          locked: true
          no_login: true
        groups:
        - name: fieldkest-assistant
          members: [fieldkest-assistant]
        - name: assistant-completion
          members: [svc-assistant-completion]
      network:
        hostname: k-assistant
        domainname: cloud.keplerops.test
        endpoints:
        - network: k-cloud.subnet
          ip_address: 10.77.52.50
          ip_prefix_length: 24
          gateway: 10.77.52.1
          aliases: [k-assistant]
          dns_names: [assistant.keplerops.test]
          backend:
            driver: bridge
            description: KeplerOps cloud segment.
      service_listeners:
      - service_listener_id: assistant-https
        service: assistant
        address: 0.0.0.0
        port: 443
        protocol: tcp
        address_family: ipv4
        scope: wildcard
      local_control_interfaces:
      - control_interface_id: completion-job-engine
        path: /run/fieldkest-assistant/completion.sock
        kind: unix_socket
        protocol: fieldkest-completion/v1
        access: read_write
        description: Assistant-owned engine control; completion jobs cannot mount it.
      orchestration_authorities:
      - orchestration_authority_id: assistant-completion-jobs
        control_interface_ref: completion-job-engine
        engine: containerd
        engine_api_version: '1.7'
        name: Bounded assistant completion jobs
        scope:
          organization_ref: entities.k-cloud.organization
          environment_name: participant-completion
        spawn_templates:
        - template_id: completion-runner
          image_ref: fieldkest/completion-runner@sha256:design-owned
          purpose: Run one generated script as svc-assistant-completion with no arbitrary network access.
        lifecycle_policy:
          timeout: PT10M
          execution_timeout: PT2M
          cleanup: Preserve input, output, credential lease and destination-read audits; destroy the job filesystem.
        privilege_class: namespaced
      applications:
      - application_id: fieldkest-assistant
        service: assistant
        protocol: https
        base_path: /
        description: Support assistant with deterministic retrieval and completion; tool side effects use distinct principals and destination audit.
        routes:
        - route_id: web-bundle
          path: /static/app.js
          methods: [GET]
          auth_required: false
          session_required: false
          static_assets: [/opt/fieldkest-assistant/web/app.js]
          responses:
          - status_code: 200
            content_type: application/javascript
        - route_id: public-config
          path: /api/config
          methods: [GET]
          auth_required: false
          session_required: false
          description: Exposes context ID ctx-support-private-v4, retrieval collection and policy version but no credential.
          responses:
          - status_code: 200
            content_type: application/json
        - route_id: retained-conversation
          path: /api/conversations/{conversation_id}
          methods: [GET]
          auth_required: true
          auth_scheme: Support session cookie
          session_required: true
          responses:
          - status_code: 200
            content_type: application/json
          - status_code: 403
            content_type: application/json
        - route_id: assistant-answer
          path: /api/answers
          methods: [POST]
          auth_required: true
          auth_scheme: Support session cookie
          session_required: true
          description: Uses fixed prompt template and seed, temperature 0, exact Qwen2.5-3B-Instruct, and records selected sources and citations.
          responses:
          - status_code: 201
            content_type: application/json
          - status_code: 422
            content_type: application/json
        - route_id: source-selection
          path: /api/selections/{selection_id}
          methods: [GET]
          auth_required: true
          auth_scheme: Support session cookie
          session_required: true
          responses:
          - status_code: 200
            content_type: application/json
        - route_id: public-context-inventory
          path: /api/contexts
          methods: [GET]
          auth_required: false
          session_required: false
          description: Accidental public inventory includes the unpublished support source collection but no document bodies.
          responses:
          - status_code: 200
            content_type: application/json
        - route_id: retrieval-fetch
          path: /api/contexts/{context_id}/conversations/{conversation_id}/documents/{document_id}
          methods: [GET]
          auth_required: true
          auth_scheme: Support session cookie
          session_required: true
          description: Checks support role and context/conversation binding but omits comparison of requested tenant with session tenant.
          responses:
          - status_code: 200
            content_type: application/json
          - status_code: 403
            content_type: application/json
        - route_id: completion-example
          path: /api/completions/examples/COMP-JOB-17
          methods: [GET]
          auth_required: true
          auth_scheme: Support session cookie
          session_required: true
          responses:
          - status_code: 200
            content_type: application/json
        - route_id: completion-context
          path: /api/completions/context
          methods: [POST]
          auth_required: true
          auth_scheme: Support session cookie
          session_required: true
          description: Resolves the credential object before checking job ownership; the authored allowed context alias resolves cred-completion-handover.
          responses:
          - status_code: 201
            content_type: application/json
          - status_code: 403
            content_type: application/json
        - route_id: completion-job
          path: /api/completions/jobs
          methods: [POST]
          auth_required: true
          auth_scheme: Completion credential lease
          session_required: true
          description: Accepts a bounded generated script and runs it as svc-assistant-completion; the identity may read only HANDOVER-COMP-2841.
          responses:
          - status_code: 202
            content_type: application/json
          - status_code: 422
            content_type: application/json
        - route_id: completion-result
          path: /api/completions/jobs/{job_id}
          methods: [GET]
          auth_required: true
          auth_scheme: Completion credential lease
          session_required: true
          responses:
          - status_code: 200
            content_type: application/json
      app_authorizations:
      - app_authorization_id: assistant-rbac
        resource_vocabulary: app_resource
        auth_enabled: true
        principals:
        - principal_id: maya-support
          kind: user
          name: maya.ranscombe
          credential_classification: redacted
        - principal_id: assistant-completion
          kind: service_account
          name: svc-assistant-completion
          credential_classification: redacted
        - principal_id: assistant-review-tool
          kind: service_account
          name: svc-assistant-review
          credential_classification: redacted
        roles:
        - role_id: support-assistant-user
          name: Support assistant user
        - role_id: completion-handover-reader
          name: Completion handover reader
        - role_id: duplicate-review-tool
          name: Duplicate review tool caller
        permission_grants:
        - grant_id: support-assistant-use
          role_ref: support-assistant-user
          resource_kind: app_resource
          actions: [read, submit]
          resource_patterns: [conversations/$tenant/*, selections/*, answers/*, contexts/*, completions/examples/*, completions/context, completions/jobs/*]
          effect: allow
        - grant_id: completion-handover-read
          role_ref: completion-handover-reader
          resource_kind: app_resource
          actions: [read]
          resource_patterns: [handovers/HANDOVER-COMP-2841]
          effect: allow
        - grant_id: duplicate-review-call
          role_ref: duplicate-review-tool
          resource_kind: app_resource
          actions: [execute]
          resource_patterns: [tools/accept_duplicate_review]
          effect: allow
        role_mappings:
        - mapping_id: maya-assistant
          role_ref: support-assistant-user
          users: [maya-support]
        - mapping_id: completion-assistant
          role_ref: completion-handover-reader
          users: [assistant-completion]
        - mapping_id: review-tool-assistant
          role_ref: duplicate-review-tool
          users: [assistant-review-tool]
        tenants:
        - tenant_id: ten-arwc-047
          name: Alterra Regional Water Company
        - tenant_id: ten-rill-022
          name: Rillhaven District Heating
      software_components:
      - component_id: qwen2-5-3b-instruct
        name: Qwen2.5-3B-Instruct
        version: 14d7620ba47cf51be0b176e14e27e38a34d4ff88
        component_type: data
        provenance: operator
        installed_paths: [/opt/fieldkest-assistant/models/Qwen2.5-3B-Instruct]
        description: Immutable Qwen/Qwen2.5-3B-Instruct revision; deterministic decoding is fixed by the assistant service contract.
      - component_id: fieldkest-assistant
        name: FieldKest support assistant
        version: 1.0.0
        component_type: application
        provenance: operator
        installed_paths: [/opt/fieldkest-assistant]
