            the published field guide.
          parameters:
          - name: request_id
            location: json_body
            required: true
            data_type: string
            description: 1–64 ASCII letters, digits, underscores or hyphens; unique across all practice requests.
          - name: active
            location: json_body
            required: true
            data_type: boolean
          responses:
          - status_code: 200
            content_type: application/json
            description: Retained receipt; identical retry returns the original receipt and status without a second
              action.
