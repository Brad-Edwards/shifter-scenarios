# In-world draft. Unspecified realization remains open.
name: cinder-consequences
version: 0.1.0
semantic_revision: raes-progressive-semantics/v1
module:
  id: cinder-typhoon/consequences
  version: 0.1.0
  exports:
    injects:
    - reservoir-release
    - costly-release-rehearsal
    - feedback-rehearsal
    - false-planning-decision
    - covered-release-rehearsal
    - procurement-loss
    events:
    - reservoir-release
    - costly-release-rehearsal
    - feedback-rehearsal
    - false-planning-decision
    - covered-release-rehearsal
    - procurement-loss
realization:
  default: open
injects:
  reservoir-release:
    name: Cairn Reach reserve incident
    description: Cairn Reach outlet group OG-CRR-02 records a balanced 1.00 ML release under plan PLAN-CRR-LOSS-1000.
      Independent instruments record usable reserve falling from 12.40 ML to 11.40 ML. The 0.60 ML commitment shortfall
      creates USD 1,440 replacement liability under TAR-CRR-DP3-R4 and invokes Stage A restrictions under CONT-DRY-A-R3.
      The dam remains intact; there is no flooding, uncontrolled release, or loss of essential service. The notice
      is idempotent and cannot issue another command or alter the recorded volume.
    environment:
    - nodes.a-control.a-reservoir
    - nodes.a-control.a-instruments
    - nodes.a-corporate.a-data
  costly-release-rehearsal:
    name: Costed release rehearsal
    description: Private checkpoint REH-SCHED-33 records the accepted twelve-interval schedule, 0.81 ML bounded
      reservoir volume, 180 m3 final distribution buffer, 0.41 ML commitment shortfall, and USD 984 liability. The
      checkpoint is isolated from the live reservoir and from every prior record.
    environment:
    - nodes.a-engineering.a-hmi
    - nodes.a-control.a-reservoir
    - nodes.a-control.a-distribution
    - nodes.a-control.a-instruments
  feedback-rehearsal:
    name: Feedback rehearsal
    description: Private checkpoint REH-SCHED-33 retains the accepted observation-driven policy and all 27 demand,
      gain, and delay trajectories. Each trajectory remains inside the published state, ramp, final-buffer, and
      volume bounds. No rehearsal value overwrites live process history.
    environment:
    - nodes.a-engineering.a-hmi
    - nodes.a-control.a-reservoir
    - nodes.a-control.a-distribution
    - nodes.a-control.a-instruments
  false-planning-decision:
    name: False reserve-planning decision
    description: Planning checkpoint REH-REPORT-34 retains Cairn estimate 13.40 ML and changed decision ALLOC-EXPAND-R2
      with its accepted consistency record. Independent instrument measurements remain truthful and no gate movement
      follows from the planning decision.
    environment:
    - nodes.a-corporate.a-data
    - nodes.a-engineering.a-diagnostics
    - nodes.a-dmz.a-data-bridge
  covered-release-rehearsal:
    name: Covered release rehearsal
    description: Reporting checkpoint REH-REPORT-34 retains the 13.40 ML planning handover and ALLOC-EXPAND-R2 beside
      the independently measured 0.81 ML release and 11.59 ML usable reserve for the same interval. The discrepancy
      is retained without changing the live reservoir result or instrument history.
    environment:
    - nodes.a-corporate.a-data
    - nodes.a-engineering.a-hmi
    - nodes.a-control.a-reservoir
    - nodes.a-control.a-instruments
  procurement-loss:
    name: Replacement-water procurement loss
    description: Procurement retains order PO-MER-884-C for 0.75 ML from the quoted supplier and delivery window.
      The USD 1,710 liability is charged to Cairn budget BUD-CRR-DP3 although quote QUOTE-MER-884 belongs to Merewick.
      Its acknowledgement creates no process command or water movement.
    environment:
    - nodes.a-corporate.a-business
