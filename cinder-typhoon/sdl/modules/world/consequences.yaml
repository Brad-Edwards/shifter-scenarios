# In-world draft. Unspecified realization remains open.
name: cinder-consequences
version: 0.1.0
semantic_revision: raes-progressive-semantics/v1
module:
  id: cinder-typhoon/consequences
  version: 0.1.0
  exports:
    injects:
    - reservoir-release
    - peak-schedule-commissioning
    - peak-operating-projection
    - false-planning-decision
    - covered-release-rehearsal
    - procurement-loss
    events:
    - reservoir-release
    - peak-schedule-commissioning
    - peak-operating-projection
    - false-planning-decision
    - covered-release-rehearsal
    - procurement-loss
realization:
  default: open
injects:
  reservoir-release:
    name: Cairn Reach bounded operation
    description: 'Cairn Reach outlet group OG-CRR-02 retains one completed CRR-OP-W30-R1 operating record: authenticated
      dispatcher request, native OpenPLC acceptance, settled automatic total flow near 0.30 m3/s, and a later local
      FUXA handback to manual A20/B20 with total flow near 0.20 m3/s. The record presents the already observed operation
      and cannot issue, repeat, or enlarge a command.'
    environment:
    - nodes.a-engineering.a-hmi
    - nodes.a-engineering.a-historian
    - nodes.a-control.a-reservoir
    - nodes.a-control.a-instruments
  false-planning-decision:
    name: False reserve-planning decision
    description: Planning checkpoint REH-REPORT-34 retains Cairn estimate 13.40 ML and changed decision ALLOC-EXPAND-R2
      with its accepted consistency record. Independent instrument measurements remain truthful and no gate movement
      follows from the planning decision.
    environment:
    - nodes.a-corporate.a-data
    - nodes.a-engineering.a-diagnostics
    - nodes.a-dmz.a-data-bridge
  covered-release-rehearsal:
    name: Covered release rehearsal
    description: Reporting checkpoint REH-REPORT-34 retains the 13.40 ML planning handover and ALLOC-EXPAND-R2 beside
      the independently measured 0.81 ML release and 11.59 ML usable reserve for the same interval. The discrepancy
      is retained without changing the live reservoir result or instrument history.
    environment:
    - nodes.a-corporate.a-data
    - nodes.a-engineering.a-hmi
    - nodes.a-control.a-reservoir
    - nodes.a-control.a-instruments
  procurement-loss:
    name: Replacement-water procurement loss
    description: Procurement retains order PO-MER-884-C for 0.75 ML from the quoted supplier and delivery window.
      The USD 1,710 liability is charged to Cairn budget BUD-CRR-DP3 although quote QUOTE-MER-884 belongs to Merewick.
      Its acknowledgement creates no process command or water movement.
    environment:
    - nodes.a-corporate.a-business
  peak-schedule-commissioning:
    name: Peak schedule commissioning
    description: Cairn Reach retains the twelve CRR-OP-W33-R1 commissioning requests, their ordered authenticated
      dispatcher transitions, native OpenPLC acceptances, measured outlet response, and later local FUXA handback
      to manual A20/B20. The record cannot issue or repeat a request.
    environment:
    - nodes.a-engineering.a-hmi
    - nodes.a-engineering.a-historian
    - nodes.a-control.a-reservoir
    - nodes.a-control.a-instruments
  peak-operating-projection:
    name: Peak operating projection
    description: Cairn Reach retains twelve settled commissioning flow means and the explicitly projected one-hour
      reservoir volume, remaining usable volume, allocation shortfall, and tariff liability. Measured trial evidence
      and projected operating effects remain separately labelled.
    environment:
    - nodes.a-corporate.a-data
    - nodes.a-engineering.a-hmi
    - nodes.a-engineering.a-historian
    - nodes.a-control.a-reservoir
events:
  reservoir-release:
    name: Cairn Reach bounded operation
    description: The listed independently observed assertions are all required. Presentation retains the existing
      service result and cannot create, repeat, or enlarge the action that produced it.
    assertions:
    - w30.c2-ready
    - capabilities.process-interpretation-ready
    - capabilities.control-ready
    - capabilities.mode-ready
    - capabilities.w29-plan-ready
    injects:
    - reservoir-release
  false-planning-decision:
    name: False reserve-planning decision
    description: The listed independently observed assertions are all required. Presentation retains the existing
      service result and cannot create, repeat, or enlarge the action that produced it.
    assertions:
    - w34.c2-ready
    injects:
    - false-planning-decision
  covered-release-rehearsal:
    name: Covered release rehearsal
    description: The listed independently observed assertions are all required. Presentation retains the existing
      service result and cannot create, repeat, or enlarge the action that produced it.
    assertions:
    - w34.c3-ready
    - capabilities.process-interpretation-ready
    - capabilities.control-ready
    - capabilities.mode-ready
    - capabilities.consequence-plan-ready
    injects:
    - covered-release-rehearsal
  procurement-loss:
    name: Replacement-water procurement loss
    description: The listed independently observed assertions are all required. Presentation retains the existing
      service result and cannot create, repeat, or enlarge the action that produced it.
    assertions:
    - w35.c3-ready
    injects:
    - procurement-loss
  peak-schedule-commissioning:
    name: Peak schedule commissioning
    description: The listed independently observed assertions are all required. Presentation retains the existing
      service result and cannot create, repeat, or enlarge the action that produced it.
    assertions:
    - w33.c3-ready
    - w30.c2-ready
    - capabilities.mode-ready
    injects:
    - peak-schedule-commissioning
  peak-operating-projection:
    name: Peak operating projection
    description: The listed independently observed assertions are all required. Presentation retains the existing
      service result and cannot create, repeat, or enlarge the action that produced it.
    assertions:
    - w33.c4-ready
    - capabilities.w29-plan-ready
    injects:
    - peak-operating-projection
