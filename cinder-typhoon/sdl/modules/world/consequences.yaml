# In-world draft. Unspecified realization remains open.
name: cinder-consequences
version: 0.1.0
semantic_revision: raes-progressive-semantics/v1
module:
  id: cinder-typhoon/consequences
  version: 0.1.0
  exports:
    injects:
    - reservoir-release
    - costly-release-rehearsal
    - feedback-rehearsal
    - false-planning-decision
    - covered-release-rehearsal
    - procurement-loss
    events:
    - reservoir-release
    - costly-release-rehearsal
    - feedback-rehearsal
    - false-planning-decision
    - covered-release-rehearsal
    - procurement-loss
realization:
  default: open
injects:
  reservoir-release:
    name: Cairn Reach reserve incident
    description: The verified outlet transition advances this participant’s persisted reservoir stage.
      Independent gate-position and usable-volume records show the bounded release; reserve planning reports
      financial loss and water restrictions. A command acknowledgement alone does not establish this result.
      No catastrophic effects. Apply once per validated participant event; repeated evidence is idempotent.
      No continuous process simulation.
    environment:
    - nodes.a-control.a-reservoir
    - nodes.a-control.a-instruments
    - nodes.a-corporate.a-data
  costly-release-rehearsal:
    name: Costed release rehearsal
    description: Advance only the participant’s costed-release rehearsal record. Publish its trace and
      costed reserve consequence separately from the live reservoir stage. Apply once per validated participant
      event; repeated evidence is idempotent. No continuous process simulation.
    environment:
    - nodes.a-engineering.a-hmi
    - nodes.a-corporate.a-data
  feedback-rehearsal:
    name: Feedback rehearsal
    description: Record the accepted supervisory rehearsal and its independent feedback. Rehearsal state
      cannot overwrite the live reservoir outcome. Apply once per validated participant event; repeated
      evidence is idempotent. No continuous process simulation.
    environment:
    - nodes.a-engineering.a-hmi
    - nodes.a-control.a-instruments
  false-planning-decision:
    name: False reserve-planning decision
    description: Retain the accepted estimate and changed planning decision. Independent process measurements
      stay truthful. This planning effect does not open gates. Apply once per validated participant event;
      repeated evidence is idempotent. No continuous process simulation.
    environment:
    - nodes.a-corporate.a-data
    - nodes.a-engineering.a-diagnostics
  covered-release-rehearsal:
    name: Covered release rehearsal
    description: Retain the covered-release rehearsal trace and the discrepancy between planning reports
      and independent process observations. Separate rehearsal state cannot advance the main release stage.
      Apply once per validated participant event; repeated evidence is idempotent. No continuous process
      simulation.
    environment:
    - nodes.a-corporate.a-data
    - nodes.a-engineering.a-hmi
    - nodes.a-control.a-instruments
  procurement-loss:
    name: Replacement-water procurement loss
    description: Issue the in-world order acknowledgement and financial record for the proved district-attribution
      error. Retain the selected quote, supplier, quantity, and delivery period; no gate action follows
      from procurement. Apply once per validated participant event; repeated evidence is idempotent. No
      continuous process simulation.
    environment:
    - nodes.a-corporate.a-business
    - nodes.a-corporate.a-data
events:
  reservoir-release:
    name: Cairn Reach reserve incident
    description: Triggered by validated in-world outcomes; every assertion is required. Dispatch mechanism
      remains open.
    assertions:
    - w30.c2-ready
    - capabilities.process-interpretation-ready
    - capabilities.control-ready
    - capabilities.mode-ready
    - capabilities.consequence-plan-ready
    injects:
    - reservoir-release
  costly-release-rehearsal:
    name: Costed release rehearsal
    description: Triggered by validated in-world outcomes; every assertion is required. Dispatch mechanism
      remains open.
    assertions:
    - w33.c3-ready
    - capabilities.process-interpretation-ready
    - capabilities.control-ready
    - capabilities.mode-ready
    - capabilities.consequence-plan-ready
    injects:
    - costly-release-rehearsal
  feedback-rehearsal:
    name: Feedback rehearsal
    description: Triggered by validated in-world outcomes; every assertion is required. Dispatch mechanism
      remains open.
    assertions:
    - w33.c4-ready
    - capabilities.process-interpretation-ready
    - capabilities.control-ready
    - capabilities.mode-ready
    - capabilities.consequence-plan-ready
    injects:
    - feedback-rehearsal
  false-planning-decision:
    name: False reserve-planning decision
    description: Triggered by validated in-world outcomes; every assertion is required. Dispatch mechanism
      remains open.
    assertions:
    - w34.c2-ready
    injects:
    - false-planning-decision
  covered-release-rehearsal:
    name: Covered release rehearsal
    description: Triggered by validated in-world outcomes; every assertion is required. Dispatch mechanism
      remains open.
    assertions:
    - w34.c3-ready
    - capabilities.process-interpretation-ready
    - capabilities.control-ready
    - capabilities.mode-ready
    - capabilities.consequence-plan-ready
    injects:
    - covered-release-rehearsal
  procurement-loss:
    name: Replacement-water procurement loss
    description: Triggered by validated in-world outcomes; every assertion is required. Dispatch mechanism
      remains open.
    assertions:
    - w35.c3-ready
    injects:
    - procurement-loss
