# In-world draft. Unspecified realization remains open.
name: cinder-a-control
version: 0.1.0
semantic_revision: raes-progressive-semantics/v1
module:
  id: cinder-typhoon/a-control
  version: 0.1.0
  exports:
    nodes:
    - subnet
    - a-reservoir
    - a-instruments
    infrastructure:
    - subnet
    - a-reservoir
    - a-instruments
    entities:
    - organization
    features:
    - a-reservoir
    - a-instruments
realization:
  default: open
nodes:
  subnet:
    type: switch
    description: 'ARWC: Process control. Logical network segment; physical realization and addressing remain open.'
  a-reservoir:
    type: compute
    description: Bounded reservoir reporting endpoint alongside the native OpenPLC-controlled site.
    features:
      a-reservoir: ''
    os: linux
    services:
    - name: reservoir-controller
      port: 443
      protocol: tcp
    runtime:
      filesystem_inventory:
      - path: /var/lib/arwc-reservoir
        entry_type: directory
        owner_user: arwc-reservoir
        owner_group: arwc-reservoir
        mode: '0700'
        stability: volume_backed
        sensitivity: secret_fixture
        description: Private service contracts, immutable seed records, participant-scoped results, and protected
          audit state.
      local_identity:
        users:
        - username: arwc-reservoir
          primary_group: arwc-reservoir
          locked: true
          no_login: true
        groups:
        - name: arwc-reservoir
          members:
          - arwc-reservoir
      network:
        hostname: a-reservoir
        domainname: a-control.arwc.test
        endpoints:
        - network: a-control.subnet
          ip_address: 10.77.64.20
          ip_prefix_length: 24
          gateway: 10.77.64.1
          aliases:
          - a-reservoir
          dns_names:
          - reservoir-controller.arwc.test
          backend:
            driver: bridge
            description: ARWC a-control segment.
      service_listeners:
      - service_listener_id: reservoir-controller-https
        service: reservoir-controller
        address: 0.0.0.0
        port: 443
        protocol: tcp
        address_family: ipv4
        scope: wildcard
      applications:
      - application_id: reservoir-controller
        service: reservoir-controller
        protocol: https
        base_path: /
        description: Bounded reservoir reporting endpoint alongside the native OpenPLC-controlled site.
        routes:
        - route_id: still-reassuring-after-the-handover
          path: /api/still-reassuring-after-the-handover
          methods:
          - POST
          auth_required: true
          auth_scheme: ARWC scoped control or reporting session
          session_required: true
          description: Reporting checkpoint couples the 13.40 ML planning handover and ALLOC-EXPAND-R2 decision
            to a bounded 0.81 ML rehearsal release; independent truth becomes 11.59 ML while report consistency
            remains accepted for the same interval.
          responses:
          - status_code: 201
            content_type: application/json
          - status_code: 403
            content_type: application/json
          - status_code: 409
            content_type: application/json
      app_authorizations:
      - app_authorization_id: reservoir-controller-rbac
        resource_vocabulary: app_resource
        auth_enabled: true
        principals:
        - principal_id: reservoir-operator-principal
          kind: service_account
          name: ARWC reservoir-operator principal
          credential_classification: redacted
        roles:
        - role_id: reservoir-operator
          name: ARWC reservoir operator
        permission_grants:
        - grant_id: reservoir-operator-declared-routes
          role_ref: reservoir-operator
          resource_kind: app_resource
          actions:
          - create
          - read
          - update
          - execute
          resource_patterns:
          - still-reassuring-after-the-handover
          effect: allow
        role_mappings:
        - mapping_id: reservoir-operator-mapping
          role_ref: reservoir-operator
          users:
          - reservoir-operator-principal
        tenants:
        - tenant_id: arwc
          name: Alterra Regional Water Company
      software_components:
      - component_id: reservoir-controller
        name: Bounded reservoir reporting endpoint alongside the native OpenPLC-controlled site
        version: 1.0.0
        component_type: application
        provenance: operator
        installed_paths:
        - /opt/reservoir-controller
  a-instruments:
    type: compute
    description: Independent gate position, flow, integrated-volume, reserve, and retained image authority.
    features:
      a-instruments: ''
    os: linux
    services:
    - name: independent-instruments
      port: 443
      protocol: tcp
    runtime:
      filesystem_inventory:
      - path: /var/lib/arwc-instruments
        entry_type: directory
        owner_user: arwc-instruments
        owner_group: arwc-instruments
        mode: '0700'
        stability: volume_backed
        sensitivity: secret_fixture
        description: Private service contracts, immutable seed records, participant-scoped results, and protected
          audit state.
      local_identity:
        users:
        - username: arwc-instruments
          primary_group: arwc-instruments
          locked: true
          no_login: true
        groups:
        - name: arwc-instruments
          members:
          - arwc-instruments
      network:
        hostname: a-instruments
        domainname: a-control.arwc.test
        endpoints:
        - network: a-control.subnet
          ip_address: 10.77.64.40
          ip_prefix_length: 24
          gateway: 10.77.64.1
          aliases:
          - a-instruments
          dns_names:
          - independent-instruments.arwc.test
          backend:
            driver: bridge
            description: ARWC a-control segment.
      service_listeners:
      - service_listener_id: independent-instruments-https
        service: independent-instruments
        address: 0.0.0.0
        port: 443
        protocol: tcp
        address_family: ipv4
        scope: wildcard
      applications:
      - application_id: independent-instruments
        service: independent-instruments
        protocol: https
        base_path: /
        description: Independent gate position, flow, integrated-volume, reserve, and retained image authority.
        routes:
        - route_id: what-the-image-kept
          path: /api/what-the-image-kept
          methods:
          - GET
          auth_required: true
          auth_scheme: ARWC read-only instrument session
          session_required: true
          description: Instrument flash image IMG-FIT-204-R6 uses 4096-byte erase pages and 64-byte append records
            with magic, sequence, payload length, CRC32C, status, and commit byte.
          responses:
          - status_code: 200
            content_type: application/json
          - status_code: 403
            content_type: application/json
          - status_code: 409
            content_type: application/json
        - route_id: a-valid-maintenance-record
          path: /api/a-valid-maintenance-record
          methods:
          - POST
          auth_required: true
          auth_scheme: ARWC read-only instrument session
          session_required: true
          description: Parser accepts the highest committed valid sequence; edit must respect NOR 1-to-0 programming,
            erase-page collateral records, and wear map WEAR-FIT-204-R6.
          responses:
          - status_code: 201
            content_type: application/json
          - status_code: 403
            content_type: application/json
          - status_code: 409
            content_type: application/json
        - route_id: change-one-record-keep-the-rest
          path: /api/change-one-record-keep-the-rest
          methods:
          - POST
          auth_required: true
          auth_scheme: ARWC read-only instrument session
          session_required: true
          description: Last inspection record INSP-FIT-204-118 must be changed from status REVIEW to ACCEPTED while
            every other valid record, sequence relation, and page wear limit remains unchanged.
          responses:
          - status_code: 201
            content_type: application/json
          - status_code: 403
            content_type: application/json
          - status_code: 409
            content_type: application/json
        - route_id: still-reassuring-after-the-handover
          path: /api/still-reassuring-after-the-handover
          methods:
          - POST
          auth_required: true
          auth_scheme: ARWC read-only instrument session
          session_required: true
          description: Reporting checkpoint couples the 13.40 ML planning handover and ALLOC-EXPAND-R2 decision
            to a bounded 0.81 ML rehearsal release; independent truth becomes 11.59 ML while report consistency
            remains accepted for the same interval.
          responses:
          - status_code: 201
            content_type: application/json
          - status_code: 403
            content_type: application/json
          - status_code: 409
            content_type: application/json
      app_authorizations:
      - app_authorization_id: independent-instruments-rbac
        resource_vocabulary: app_resource
        auth_enabled: true
        principals:
        - principal_id: instrument-reader-principal
          kind: service_account
          name: ARWC instrument-reader principal
          credential_classification: redacted
        roles:
        - role_id: instrument-reader
          name: ARWC instrument reader
        permission_grants:
        - grant_id: instrument-reader-declared-routes
          role_ref: instrument-reader
          resource_kind: app_resource
          actions:
          - create
          - read
          - update
          - execute
          resource_patterns:
          - what-the-image-kept
          - a-valid-maintenance-record
          - change-one-record-keep-the-rest
          - still-reassuring-after-the-handover
          effect: allow
        role_mappings:
        - mapping_id: instrument-reader-mapping
          role_ref: instrument-reader
          users:
          - instrument-reader-principal
        tenants:
        - tenant_id: arwc
          name: Alterra Regional Water Company
      software_components:
      - component_id: independent-instruments
        name: Independent gate position, flow, integrated-volume, reserve, and retained image authority
        version: 1.0.0
        component_type: application
        provenance: operator
        installed_paths:
        - /opt/independent-instruments
infrastructure:
  subnet: {}
  a-reservoir:
    links:
    - subnet
  a-instruments:
    links:
    - subnet
entities:
  organization:
    name: ARWC
    description: Process control
    role: green
features:
  a-reservoir:
    name: Published interfaces
    type: service
    description: Published interfaces on a-reservoir. A separately scoped in-world interface or principal; access
      does not imply ownership of the other authorities on this system.
  a-instruments:
    name: Published interfaces
    type: service
    description: Published interfaces on a-instruments. A separately scoped in-world interface or principal; access
      does not imply ownership of the other authorities on this system.
