          - status_code: 409
            content_type: application/json
      app_authorizations:
      - app_authorization_id: independent-instruments-rbac
        resource_vocabulary: app_resource
        auth_enabled: true
        principals:
        - principal_id: instrument-reader-principal
          kind: service_account
          name: ARWC instrument-reader principal
          credential_classification: redacted
        roles:
        - role_id: instrument-reader
          name: ARWC instrument reader
        permission_grants:
        - grant_id: instrument-reader-declared-routes
          role_ref: instrument-reader
          resource_kind: app_resource
