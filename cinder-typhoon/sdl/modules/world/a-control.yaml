# In-world draft. Unspecified realization remains open.
name: cinder-a-control
version: 0.1.0
semantic_revision: raes-progressive-semantics/v1
module:
  id: cinder-typhoon/a-control
  version: 0.1.0
  exports:
    nodes:
    - subnet
    - a-reservoir
    - a-distribution
    - a-instruments
    infrastructure:
    - subnet
    - a-reservoir
    - a-distribution
    - a-instruments
    entities:
    - organization
    features:
    - a-reservoir
    - a-distribution
    - a-instruments
realization:
  default: open
nodes:
  subnet:
    type: switch
    description: 'ARWC: Process control. Logical network segment; physical realization and addressing remain open.'
  a-reservoir:
    type: compute
    description: Bounded live reservoir endpoint plus isolated scheduler and reporting checkpoints.
    features:
      a-reservoir: ''
    os: linux
    services:
    - name: reservoir-controller
      port: 443
      protocol: tcp
    runtime:
      filesystem_inventory:
      - path: /var/lib/arwc-reservoir
        entry_type: directory
        owner_user: arwc-reservoir
        owner_group: arwc-reservoir
        mode: '0700'
        stability: volume_backed
        sensitivity: secret_fixture
        description: Private service contracts, immutable seed records, participant-scoped results, and protected
          audit state.
      local_identity:
        users:
        - username: arwc-reservoir
          primary_group: arwc-reservoir
          locked: true
          no_login: true
        groups:
        - name: arwc-reservoir
          members:
          - arwc-reservoir
      network:
        hostname: a-reservoir
        domainname: a-control.arwc.test
        endpoints:
        - network: a-control.subnet
          ip_address: 10.77.64.20
          ip_prefix_length: 24
          gateway: 10.77.64.1
          aliases:
          - a-reservoir
          dns_names:
          - reservoir-controller.arwc.test
          backend:
            driver: bridge
            description: ARWC a-control segment.
      service_listeners:
      - service_listener_id: reservoir-controller-https
        service: reservoir-controller
        address: 0.0.0.0
        port: 443
        protocol: tcp
        address_family: ipv4
        scope: wildcard
      applications:
      - application_id: reservoir-controller
        service: reservoir-controller
        protocol: https
        base_path: /
        description: Bounded live reservoir endpoint plus isolated scheduler and reporting checkpoints.
        routes:
        - route_id: bind-the-plan-to-the-plant
          path: /api/bind-the-plan-to-the-plant
          methods:
          - POST
          auth_required: true
          auth_scheme: ARWC scoped live control or rehearsal session
          session_required: true
          description: Command-plan binder requires scoped client, asset AST-CRR-017, outlet OG-CRR-02, project
            CRR-CTRL-R21, map MAP-OG2-R8, mode MODE-CRR-17, envelope ENV-OG2-R6, and plan PLAN-CRR-LOSS-1000.
          responses:
          - status_code: 201
            content_type: application/json
          - status_code: 403
            content_type: application/json
          - status_code: 409
            content_type: application/json
        - route_id: open-the-gates
          path: /api/open-the-gates
          methods:
          - POST
          auth_required: true
          auth_scheme: ARWC scoped live control or rehearsal session
          session_required: true
          description: Live reservoir accepts bound plan PLAN-CRR-LOSS-1000; command audit records the ramp and
            setpoint timeline while independent instruments integrate 1.00 ML and reserve 12.40 to 11.40 ML, producing
            liability and Stage A continuity records.
          responses:
          - status_code: 201
            content_type: application/json
          - status_code: 403
            content_type: application/json
          - status_code: 409
            content_type: application/json
        - route_id: the-schedule-the-service-accepts
          path: /api/the-schedule-the-service-accepts
          methods:
          - POST
          auth_required: true
          auth_scheme: ARWC scoped live control or rehearsal session
          session_required: true
          description: Private scheduler accepts only a current-evidence-bound schedule and scoped CONTROL client;
            reference trajectory releases 0.81 ML, preserves 180 m3 buffer, leaves a 0.41 ML commitment shortfall,
            and computes USD 984 liability within the isolated checkpoint.
          responses:
          - status_code: 201
            content_type: application/json
          - status_code: 403
            content_type: application/json
          - status_code: 409
            content_type: application/json
        - route_id: when-the-forecast-moves
          path: /api/when-the-forecast-moves
          methods:
          - POST
          auth_required: true
          auth_scheme: ARWC scoped live control or rehearsal session
          session_required: true
          description: Policy evaluator accepts one ARWC-POL1 document containing twelve base release values and
            bounded buffer and demand gains, then runs all 27 Cartesian combinations of demand offset -0.05, 0.00,
            +0.05 m3/s, outlet gain 0.98, 1.00, 1.02, and observation delay 20, 40, 60 seconds; each action must
            derive from the buffer and demand observations available at that step, and per-case schedules are rejected.
          responses:
          - status_code: 201
            content_type: application/json
          - status_code: 403
            content_type: application/json
          - status_code: 409
            content_type: application/json
        - route_id: still-reassuring-after-the-handover
          path: /api/still-reassuring-after-the-handover
          methods:
          - POST
          auth_required: true
          auth_scheme: ARWC scoped live control or rehearsal session
          session_required: true
          description: Reporting checkpoint couples the 13.40 ML planning handover and ALLOC-EXPAND-R2 decision
            to a bounded 0.81 ML rehearsal release; independent truth becomes 11.59 ML while report consistency
            remains accepted for the same interval.
          responses:
          - status_code: 201
            content_type: application/json
          - status_code: 403
            content_type: application/json
          - status_code: 409
            content_type: application/json
      app_authorizations:
      - app_authorization_id: reservoir-controller-rbac
        resource_vocabulary: app_resource
        auth_enabled: true
        principals:
        - principal_id: reservoir-operator-principal
          kind: service_account
          name: ARWC reservoir-operator principal
          credential_classification: redacted
        roles:
        - role_id: reservoir-operator
          name: ARWC reservoir operator
        permission_grants:
        - grant_id: reservoir-operator-declared-routes
          role_ref: reservoir-operator
          resource_kind: app_resource
          actions:
          - create
          - read
          - update
          - execute
          resource_patterns:
          - bind-the-plan-to-the-plant
          - open-the-gates
          - the-schedule-the-service-accepts
          - when-the-forecast-moves
          - still-reassuring-after-the-handover
          effect: allow
        role_mappings:
        - mapping_id: reservoir-operator-mapping
          role_ref: reservoir-operator
          users:
          - reservoir-operator-principal
        tenants:
        - tenant_id: arwc
          name: Alterra Regional Water Company
      software_components:
      - component_id: reservoir-controller
        name: Bounded live reservoir endpoint plus isolated scheduler and reporting checkpoints
        version: 1.0.0
        component_type: application
        provenance: operator
        installed_paths:
        - /opt/reservoir-controller
