propositions:
  mail-visible:
    description: The declared mail can be read through the workplace service with the authored audience boundaries.
    subjects:
    - content.mail
    basis: observed_state
    predicate:
      kind: boolean
      property: cinder.world.keplerops.mail.visible
      semantic_ref: urn:cinder-typhoon:world:keplerops:mail:visible
      expected: true
    evidence_requirements:
    - mail-visible
  documents-visible:
    description: The declared documents can be read through the workplace service with the authored audience
      boundaries.
    subjects:
