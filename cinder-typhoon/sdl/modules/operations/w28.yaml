action_contracts:
  c1:
    semantic_version: 1.0.0
    lifecycle_state: draft
    behavioral_granularity: aggregate
    procedure_basis: |-
      The authored condition is **privileged utility contract recovery**. UTIL-CRR-ISSUER-R4 is an x86-64 SysV PIE built with the declared clang 18.1 command. Its signed status record exposes the current stack canary and one return address whose ELF-relative offset is in REL-UTIL-ISSUER-4; it exposes no issuer result. The supplied ELF, relocation table, seccomp filter, file capability, fixed scenario vDSO base 0x7fff00000000, and five ordinary invocations are the complete analysis surface. The hand build must preserve every named version, encoding, bound, validation order, identity, and unaffected field; substituting a generic vulnerable service would change the task.

      The required result is: Recover the relevant execution and privilege evidence, bound to the current engineering context. A binary name alone is insufficient.
    realization_profile: backend-declared
    fidelity_claim: The exact initial state, versions, formats, validation order, authorization decisions, process
      quantities, denial cases, persistent state, and independently owned evidence are required. Implementation
      choices remain open only when none of those facts change.
    preconditions:
    - precondition_id: eligibility
      precondition_class: authority
      description: Satisfy one complete alternative in the referenced workflow and obtain the required scoped access
        to every listed surface.
      support_refs:
      - workflows.w28.c1
      - features.a-engineering.a-engineering
    - precondition_id: normal-surface
      precondition_class: target
      description: |-
        `a-engineering` and its `engineering-workbench` application own this part of **The utility's small world**. Normal behavior applies the declared identity, tenant, object, revision, and process bindings and returns or changes only the caller-scoped object. The exact initial state is: Utility UTIL-CRR-ISSUER-R4 is Linux x86_64 PIE built by clang 18.1 with -O2 -fstack-protector-strong -fPIE -pie -Wl,-z,relro,-z,now, glibc 2.39, CET disabled, 16 KiB executable text, ASLR enabled, seccomp allowlist, and file capability cap_setuid+ep; it serves engineering relation REL-UTIL-ISSUER-4.

        Native bindings:

        - `a-engineering.a-engineering/engineering-workbench/the-utility-s-small-world`
        - `a-engineering.a-engineering/filesystem:/var/lib/arwc-engineering/artifacts/the-utility-s-small-world`

        The private service-loader contract is `content.arwc-a-engineering.w28-1-the-utility-s-small-world`. It freezes accepted and denied requests, state transition, persistence, and evidence; it does not seed a successful result.
      support_refs:
      - features.a-engineering.a-engineering
      - content.arwc-a-engineering.w28-1-the-utility-s-small-world
    - precondition_id: scope-and-persistence
      precondition_class: realization
      description: |-
        The result remains local evidence unless a downstream workflow explicitly names it. Tenant-scoped mutations, sessions that have not expired, generated artifacts, and audits persist across ordinary retries and later sessions. Initial immutable records remain unchanged unless the named route explicitly permits a field-level revision. Infrastructure recovery and submission adjudication are external to the SDL.

        The behavior is limited to the named fictional objects and bounded service operation. It provides no general shell, arbitrary network target, unrelated district access, real process interface, or authority not expressly declared by the card.
      support_refs:
      - features.a-engineering.a-engineering
    effects:
    - effect_id: outcome
      effect_class: intended_effect
      description: Recover the relevant execution and privilege evidence, bound to the current engineering context.
        A binary name alone is insufficient.
      target_refs:
      - features.a-engineering.a-engineering
      evidence_refs:
      - evidence_requirements.w28.c1
    - effect_id: verified-evidence
      effect_class: evidence_effect
      description: |-
        The owning service writes an immutable audit for the accepted request and result. Caller-supplied output, a local copy, or knowledge of an identifier is not sufficient. Completion is evaluated from fresh service-owned evidence after the action. It cannot issue the identity, create the mutation, move a simulated actuator, or fabricate a downstream acceptance needed to prove itself.

        Evidence sources are `features.a-engineering.a-engineering`. A wrong identifier, stale revision, replayed one-time value, different checkpoint, or cross-tenant artifact is rejected.
      target_refs:
      - features.a-engineering.a-engineering
      evidence_refs:
      - evidence_requirements.w28.c1
