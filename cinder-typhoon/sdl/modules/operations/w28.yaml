    lifecycle_state: draft
    behavioral_granularity: aggregate
    procedure_basis: |-
      The authored condition is **stack control under sparse executable surface**. The vulnerable frame contains a 192-byte payload at rbp-0xd0, eight bytes of alignment, the disclosed canary at rbp-0x08, saved rbp, and saved return address. An unsigned length up to 384 is copied into the payload. Preserve the canary and use the status return address to recover the PIE base; only the supplied pop-rdi, pop-rsi, pop-rdx, stack-pivot, and fixed-vDSO syscall gadgets are usable. CET is disabled and NX, full RELRO, PIE, and ASLR remain enabled. The hand build must preserve every named version, encoding, bound, validation order, identity, and unaffected field; substituting a generic vulnerable service would change the task.

