        identity, authorization, storage, and audit contract declared in the corresponding world module. Records
        that are not explicitly mutable remain immutable. The private service-loader contract `content.keplerops-k-assistant.k22-1-what-the-assistant-reads`
        freezes the request, denial, state-transition, evidence, and any exploit-critical implementation details.'
      support_refs:
      - features.k-cloud.k-assistant
