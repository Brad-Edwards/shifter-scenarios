objectives:
  c1:
    name: 'K13.1: The listing nobody closed'
    description: |-
      Recover the exposed cloud-object listing and the deployment notebook it points to.

      Opens cloud exploration with a useful release and workload lead.
    agent: participant.operator
    actions:
    - k13.c1
    targets:
    - features.k-cloud.k-data
    success:
      mode: all_of
      assertions:
      - c1-done
    window:
      workflows:
      - k13.c1
  c2:
    name: 'K13.2: Before the correction'
    description: |-
      The current cloud notebook has had its useful customer note removed. Recover the previous object version that still contains it.

      Shows that changing the current object does not remove its history.
    agent: participant.operator
    actions:
    - k13.c2
    targets:
    - features.k-cloud.k-data
    success:
      mode: all_of
      assertions:
      - c2-done
    window:
      workflows:
      - k13.c2
  c3:
    name: 'K13.3: The export next door'
    description: |-
      Find the separate support export mentioned in the workspace notes and recover its retained handover.

      Provides a second cloud data surface with a support-workflow purpose.
    agent: participant.operator
    actions:
    - k13.c3
    targets:
    - features.k-cloud.k-data
    success:
      mode: all_of
      assertions:
      - c3-done
    window:
      workflows:
      - k13.c3
  c4:
    name: 'K13.4: What the workload can do'
    description: |-
      Establish the limited workload identity available from this workspace and recover the protected record within its actual scope.

      Makes cloud identity a demonstrated capability rather than a found label.
    agent: participant.operator
    actions:
    - k13.c4
    targets:
    - features.k-cloud.k-cloud-api
    success:
      mode: all_of
      assertions:
      - c4-done
    window:
      workflows:
      - k13.c4
