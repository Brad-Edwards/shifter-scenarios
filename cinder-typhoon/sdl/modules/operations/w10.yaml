evidence_requirements:
  c1:
    description: Recover the source-selection record and district binding. A plausible assistant explanation
      is not a substitute for the record.
    source_refs: &id001
    - features.a-corporate.a-business
    scope: Per-participant in-world evidence; no other participant state.
    boundary_kind: assertion_evaluation
    channel: other
    artifact_role: proposition_truth_evidence
    sensitivity: plain
    redaction: redact_secrets
    integrity: checksum
    retention: run_lifetime
    loss_disclosure: required
    observation_demand:
      rule_id: fact-w10-1
      scope: /features
      purpose: experimental
      mode: selected
      selector:
        semantic_scope: /features
        data_kind: artifact
        names:
        - cinder.w10-1.satisfied
        component_refs:
        - features.a-corporate.a-business
      collection: require
      retention: require
      redaction: redact-secrets
      integrity: checksum
      required: true
      basis: observed
  c2:
    description: Recover the actual foreign-district excerpt under the original corporate context. It
      provides a document lead, not the full protected planning attachment.
    source_refs: &id002
    - features.a-corporate.a-business
    scope: Per-participant in-world evidence; no other participant state.
    boundary_kind: assertion_evaluation
    channel: other
    artifact_role: proposition_truth_evidence
    sensitivity: plain
    redaction: redact_secrets
    integrity: checksum
    retention: run_lifetime
    loss_disclosure: required
    observation_demand:
