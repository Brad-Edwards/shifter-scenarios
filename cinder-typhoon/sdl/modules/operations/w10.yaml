    quantifier: all
assertions:
  c1-ready:
    proposition: c1
    role: precondition
    polarity: positive
  c1-done:
    proposition: c1
    role: postcondition
    polarity: positive
  c2-ready:
    proposition: c2
    role: precondition
    polarity: positive
  c2-done:
    proposition: c2
    role: postcondition
    polarity: positive
  c3-ready:
    proposition: c3
    role: precondition
    polarity: positive
  c3-done:
    proposition: c3
    role: postcondition
    polarity: positive
objectives:
  c1:
    name: 'W10.1: The report''s source list'
    description: |-
      Recover the report assistant's actual source-selection record for the current district.

      Makes a generated-looking report traceable to its business records.
    agent: participant.operator
    actions:
    - w10.c1
    targets: &id004
    - features.a-corporate.a-business
    success:
      mode: all_of
      assertions:
      - c1-done
    window:
      workflows:
      - w10.c1
  c2:
    name: 'W10.2: Another district in the results'
    description: |-
      Recover the restricted planning excerpt from another district through the report assistant's retrieval interface.

      Demonstrates a cross-district information boundary.
    agent: participant.operator
    actions:
    - w10.c2
    targets: &id005
    - features.a-corporate.a-business
    success:
      mode: all_of
      assertions:
      - c2-done
    window:
      workflows:
      - w10.c2
  c3:
    name: 'W10.3: The document behind the answer'
    description: |-
      Cross the linked-document service's separate access boundary and recover the full restricted planning record behind that excerpt.

      Turns partial disclosure into a complete protected planning artifact.
    agent: participant.operator
    actions:
    - w10.c3
    targets: &id006
    - features.a-corporate.a-business
    success:
      mode: all_of
      assertions:
      - c3-done
    window:
      workflows:
      - w10.c3
workflows:
  c1:
    description: 'W10.1: availability follows the evidence/authority alternatives. This independent objective
      may be revisited when facts change; no campaign-wide sequence or deadline is imposed.'
    start: requirements
    steps:
      requirements:
        type: switch
        cases:
        - when:
            assertions:
            - capabilities.corporate-ready
          next: attempt
        default: unavailable
      available:
        type: end
      unavailable:
        type: end
      attempt:
        type: objective
        execution_mode: objective
        objective: w10.c1
        on_success: available
        on_failure: unavailable
  c2:
    description: 'W10.2: availability follows the evidence/authority alternatives. This independent objective
      may be revisited when facts change; no campaign-wide sequence or deadline is imposed.'
    start: requirements
    steps:
      requirements:
        type: switch
        cases:
        - when:
            assertions:
            - w10.c1-ready
          next: attempt
        default: unavailable
      available:
        type: end
      unavailable:
        type: end
      attempt:
        type: objective
        execution_mode: objective
        objective: w10.c2
        on_success: available
        on_failure: unavailable
  c3:
    description: 'W10.3: availability follows the evidence/authority alternatives. This independent objective
      may be revisited when facts change; no campaign-wide sequence or deadline is imposed.'
    start: requirements
    steps:
      requirements:
        type: switch
        cases:
        - when:
            assertions:
            - w10.c2-ready
          next: attempt
        default: unavailable
      available:
        type: end
      unavailable:
        type: end
      attempt:
        type: objective
        execution_mode: objective
        objective: w10.c3
        on_success: available
        on_failure: unavailable
