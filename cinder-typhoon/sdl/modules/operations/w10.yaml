objectives:
  c1:
    name: 'This action: The report''s source list'
    description: |-
      Recover the report assistant's actual source-selection record for the current district.

      Makes a generated-looking report traceable to its business records.
    agent: participant.operator
    actions:
    - w10.c1
    targets:
    - features.a-corporate.a-business
    success:
      mode: all_of
      assertions:
      - c1-done
    window:
      workflows:
      - w10.c1
  c2:
    name: 'This action: Another district in the results'
    description: |-
      Recover the restricted planning excerpt from another district through the report assistant's retrieval interface.

      Demonstrates a cross-district information boundary.
    agent: participant.operator
    actions:
    - w10.c2
    targets:
    - features.a-corporate.a-business
    success:
      mode: all_of
      assertions:
      - c2-done
    window:
      workflows:
      - w10.c2
  c3:
    name: 'This action: The document behind the answer'
    description: |-
      Cross the linked-document service's separate access boundary and recover the full restricted planning record behind that excerpt.

      Turns partial disclosure into a complete protected planning artifact.
    agent: participant.operator
    actions:
    - w10.c3
    targets:
    - features.a-corporate.a-business
    success:
      mode: all_of
      assertions:
      - c3-done
    window:
      workflows:
      - w10.c3
workflows:
  c1:
    description: 'This action: availability follows the evidence/authority alternatives. This independent objective
      may be revisited when facts change; no global sequence or deadline is imposed.'
    start: requirements
    steps:
      requirements:
        type: switch
        cases:
        - when:
            assertions:
            - capabilities.corporate-ready
          next: attempt
        default: unavailable
      available:
        type: end
      unavailable:
        type: end
      attempt:
        type: objective
        execution_mode: objective
        objective: w10.c1
        on_success: available
        on_failure: unavailable
  c2:
