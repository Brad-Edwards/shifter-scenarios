      This card is an exact discovery, interpretation, or reconciliation task rather than an additional privilege flaw. Report assistant source selection SEL-CRR-DP3-7 binds Cairn district, report RPT-CRR-DP3-R7, and three named current source records. The result must come from the declared source and bindings, not from a duplicate clue or pre-completed record.

      The required result is: Recover the source-selection record and district binding. A plausible assistant explanation is not a substitute for the record.
    realization_profile: backend-declared
    fidelity_claim: The exact initial state, versions, formats, validation order, authorization decisions, process
      quantities, denial cases, persistent state, and independently owned evidence are required. Implementation
      choices remain open only when none of those facts change.
    preconditions:
    - precondition_id: eligibility
      precondition_class: authority
      description: Satisfy one complete alternative in the referenced workflow and obtain the required scoped access
        to every listed surface.
      support_refs:
      - workflows.w10.c1
      - features.a-corporate.a-business
    - precondition_id: normal-surface
      precondition_class: target
      description: |-
        `a-business` and its `business-workplace` application own this part of **The report's source list**. Normal behavior applies the declared identity, tenant, object, revision, and process bindings and returns or changes only the caller-scoped object. The exact initial state is: Report assistant source selection SEL-CRR-DP3-7 binds Cairn district, report RPT-CRR-DP3-R7, and three named current source records.

        Native bindings:

        - `a-corporate.a-business/business-workplace/the-report-s-source-list`

        The private service-loader contract is `content.arwc-a-business.w10-1-the-report-s-source-list`. It freezes accepted and denied requests, state transition, persistence, and evidence; it does not seed a successful result.
      support_refs:
      - features.a-corporate.a-business
      - content.arwc-a-business.w10-1-the-report-s-source-list
    - precondition_id: scope-and-persistence
      precondition_class: realization
      description: |-
        The result remains local evidence unless a downstream workflow explicitly names it. Tenant-scoped mutations, sessions that have not expired, generated artifacts, and audits persist across ordinary retries and later sessions. Initial immutable records remain unchanged unless the named route explicitly permits a field-level revision. Infrastructure recovery and submission adjudication are external to the SDL.

