objectives:
  c1:
    name: 'K09.1: A runner tells on itself'
    description: |-
      The failed build's public summary omits its useful details. Recover the retained runner log and the release-dossier reference it exposes.

      Makes routine build output a useful cloud and release lead.
    agent: participant.operator
    actions:
    - k09.c1
    targets: &id005
    - features.k-delivery.k-ci
    success:
      mode: all_of
      assertions:
      - c1-done
    window:
      workflows:
      - k09.c1
  c2:
    name: 'K09.2: The artifact without a link'
    description: |-
      A completed job recorded an artifact that the current results page does not list. Recover that omitted artifact and its build revision.

      Provides a distinct build artifact rather than another string from the log.
    agent: participant.operator
    actions:
    - k09.c2
    targets: &id006
    - features.k-delivery.k-ci
    success:
      mode: all_of
      assertions:
      - c2-done
    window:
      workflows:
      - k09.c2
  c3:
    name: 'K09.3: A job input with reach'
    description: |-
      Make the test job consume a support input outside the collection its ordinary form allows. Recover the restricted review output it produces.

      Crosses a build-input boundary before attempting execution.
    agent: participant.operator
    actions:
    - k09.c3
    targets: &id007
    - features.k-delivery.k-ci
    success:
      mode: all_of
      assertions:
      - c3-done
    window:
      workflows:
      - k09.c3
  c4:
    name: 'K09.4: Run in the runner'
    description: |-
      Use the compromised job workflow to execute a limited action in its runner context and recover the protected job note.

      Turns build access into a useful scoped execution foothold.
    agent: participant.operator
    actions:
    - k09.c4
    targets: &id008
    - features.k-delivery.k-ci
    success:
      mode: all_of
      assertions:
      - c4-done
    window:
      workflows:
      - k09.c4
