      no job execution.'
  c2:
    description: |-
      Recover the missing artifact from its separate publication surface. It contains the test-job evidence used later in this operation.

      Required technical proof: Artifact retrieval records the run, object version, and build revision, enabling K09.3's input path.
    source_refs:
    - features.k-delivery.k-ci
    scope: Per-participant in-world evidence; no other participant state.
    boundary_kind: assertion_evaluation
    channel: other
    artifact_role: proposition_truth_evidence
    sensitivity: plain
    redaction: redact_secrets
    integrity: checksum
    retention: run_lifetime
    loss_disclosure: required
    observation_demand:
      rule_id: fact-k09-2
      scope: /features
      purpose: experimental
      mode: selected
      selector:
        semantic_scope: /features
        data_kind: artifact
        names:
        - cinder.k09-2.satisfied
        component_refs:
        - features.k-delivery.k-ci
      collection: require
      retention: require
      redaction: redact-secrets
      integrity: checksum
      required: true
      basis: observed
    notes:
