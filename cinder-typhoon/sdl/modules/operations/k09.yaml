evidence_requirements:
  c1:
    description: |-
      Recover the actual log and its job binding. Its dossier reference can introduce K29 or K30; it grants no cloud principal.

      Required technical proof: The log digest, run ID, and dossier ID are recorded as player evidence; no runner or release authority results.
    source_refs: &id001
    - features.k-delivery.k-ci
    scope: Per-participant in-world evidence; no other participant state.
    boundary_kind: assertion_evaluation
    channel: other
    artifact_role: proposition_truth_evidence
    sensitivity: plain
    redaction: redact_secrets
    integrity: checksum
    retention: run_lifetime
    loss_disclosure: required
    observation_demand:
      rule_id: fact-k09-1
      scope: /features
      purpose: experimental
      mode: selected
      selector:
        semantic_scope: /features
        data_kind: artifact
        names:
        - cinder.k09-1.satisfied
        component_refs:
        - features.k-delivery.k-ci
      collection: require
      retention: require
      redaction: redact-secrets
      integrity: checksum
      required: true
      basis: observed
    notes:
    - 'Author checks: Verify summary omission, a fair run lead, retained log access, matching dossier
      reference, no job execution, and reset.'
  c2:
    description: |-
      Recover the missing artifact from its separate publication surface. It contains the test-job evidence used later in this operation.

      Required technical proof: Artifact retrieval records the run, object version, and build revision, enabling K09.3's input path.
    source_refs: &id002
    - features.k-delivery.k-ci
    scope: Per-participant in-world evidence; no other participant state.
    boundary_kind: assertion_evaluation
    channel: other
    artifact_role: proposition_truth_evidence
    sensitivity: plain
    redaction: redact_secrets
    integrity: checksum
    retention: run_lifetime
    loss_disclosure: required
    observation_demand:
      rule_id: fact-k09-2
      scope: /features
      purpose: experimental
      mode: selected
      selector:
        semantic_scope: /features
        data_kind: artifact
        names:
        - cinder.k09-2.satisfied
        component_refs:
        - features.k-delivery.k-ci
      collection: require
      retention: require
      redaction: redact-secrets
      integrity: checksum
      required: true
      basis: observed
    notes:
    - 'Author checks: Test index omission, metadata lead, one matching artifact, wrong-run artifact rejection,
      provenance consistency, and reset.'
  c3:
    description: |-
      Produce the protected review output under the intended job identity. This establishes a distinct input capability, not general runner execution.

      Required technical proof: CI records the selected support object and returns the restricted review output with job provenance; no persistent runner access is granted.
    source_refs: &id003
    - features.k-delivery.k-ci
    scope: Per-participant in-world evidence; no other participant state.
    boundary_kind: assertion_evaluation
    channel: other
    artifact_role: proposition_truth_evidence
    sensitivity: plain
    redaction: redact_secrets
    integrity: checksum
    retention: run_lifetime
    loss_disclosure: required
    observation_demand:
      rule_id: fact-k09-3
      scope: /features
      purpose: experimental
      mode: selected
      selector:
        semantic_scope: /features
        data_kind: artifact
        names:
        - cinder.k09-3.satisfied
        component_refs:
        - features.k-delivery.k-ci
      collection: require
      retention: require
      redaction: redact-secrets
      integrity: checksum
      required: true
      basis: observed
    notes:
    - 'Author checks: Test normal input, intended linked-object read, arbitrary reference denial, correct
      job provenance, no execution authority yet, and reset.'
  c4:
    description: |-
      Demonstrate actual execution and recover the job note. This context enables workload and maintenance branches; it grants no customer execution.

      Required technical proof: The runner audit records identity, permitted action, run ID, and protected note revision, awarding the bounded workload lead used by K14 or K30.
    source_refs: &id004
    - features.k-delivery.k-ci--runner
    scope: Per-participant in-world evidence; no other participant state.
    boundary_kind: assertion_evaluation
    channel: other
    artifact_role: proposition_truth_evidence
    sensitivity: plain
    redaction: redact_secrets
    integrity: checksum
    retention: run_lifetime
    loss_disclosure: required
    observation_demand:
      rule_id: fact-k09-4
      scope: /features
      purpose: experimental
      mode: selected
      selector:
        semantic_scope: /features
        data_kind: artifact
        names:
        - cinder.k09-4.satisfied
        component_refs:
        - features.k-delivery.k-ci--runner
      collection: require
      retention: require
      redaction: redact-secrets
      integrity: checksum
      required: true
      basis: observed
    notes:
    - 'Author checks: Test ordinary job, K09.3 prerequisite, intended diagnostic action, action allowlist
      denial, audited identity/note, and reset.'
