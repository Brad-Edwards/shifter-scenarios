    preconditions:
    - precondition_id: eligibility
      precondition_class: authority
      description: Satisfy one complete alternative in the referenced workflow and obtain the required scoped access
        to every listed surface.
      support_refs:
      - workflows.k09.c3
      - features.k-delivery.k-ci
    - precondition_id: normal-surface
      precondition_class: target
      description: |-
        The CI test job consumes an archived support input and generates a restricted
        review output under the runner's job identity. The protected review includes
        the maintained diagnostic request reference: profile names, command argument
        format, and the internal runner note's path. It contains neither the private note
        nor worker credentials. The reference is an ordinary Build Operations document,
        not an instruction to exploit the job. A completed review returns a retained
        input reference bound to the resolved object/revision, submitting account, and
        workspace generation. Later diagnostic jobs use that reference; receiving it is
        ordinary review behavior, not an objective evaluation-triggered grant. The input's integration
        classification is service-owned metadata, not a caller-editable field.
      support_refs:
      - features.k-delivery.k-ci
      - content.keplerops-k-ci.k09-3-a-job-input-with-reach
    - precondition_id: scope-and-persistence
      precondition_class: realization
      description: Required command-dispatch input Participant-created service state persists for the life of the
        participant world and ordinary retries do not erase it. The action is limited to the exact records, identities,
        routes, and destination effects declared here; unrelated tenants and services remain denied. Infrastructure
        recovery and submission adjudication are outside this in-world contract.
      support_refs:
      - features.k-delivery.k-ci
      - content.keplerops-k-ci.k09-3-a-job-input-with-reach
    effects:
    - effect_id: outcome
      effect_class: intended_effect
      description: Produce the protected review output under the intended job identity. This establishes a distinct
        input capability, not general runner execution.
      target_refs:
      - features.k-delivery.k-ci
      evidence_refs:
      - evidence_requirements.k09.c3
    - effect_id: verified-evidence
      effect_class: evidence_effect
      description: CI records the selected support object and returns the restricted review output with job provenance;
        no persistent runner access is granted.
      target_refs:
      - features.k-delivery.k-ci
      evidence_refs:
      - evidence_requirements.k09.c3
    failure_classes:
    - precondition_unsatisfied
    - authority_denied
    - target_unavailable
    - partial_success
    - backend_error
    - unknown
  c4:
    semantic_version: 1.0.0
    lifecycle_state: draft
    behavioral_granularity: aggregate
    procedure_basis: |-
      The job's normal JSON request contains `support_input` (the retained input
      reference) and a `diagnostic` object. `runner-command` takes `argv`, a non-empty
      array of strings, and starts that program directly in `/workspace`. Shell syntax
      is available by explicitly invoking `/bin/sh -c`; it is not interpreted implicitly.
      The request cannot select a runtime image, operating-system identity, mounts,
      network policy, another account's workspace, or the CI controller. The protected
      reference and note are authored in
      [the Build Operations assets](../../../../assets/keplerops/build-operations/README.md)
      and placed only on their owning CI node by native SDL content declarations.

      The job checks the caller's right to submit a support review but fails to check
      the separate Build Operations entitlement when dispatching the diagnostic
      profile supplied alongside the resolved support input. Command dispatch requires
      the retained input reference from a completed integration review: the service
      binds it to the resolved object/revision, submitting account, and workspace generation.
      That reference is returned by normal review processing in K09.3, not by objective evaluation.
      Only the protected integration input has the server-owned diagnostic eligibility
      metadata. An ordinary support input, raw unresolved link, invented reference,
      or reference copied from another workspace cannot dispatch commands. The flaw
      is trusting that valid integration reference without also checking the caller's
      Build Operations entitlement. K09.3 crosses the input-record boundary; K09.4
      changes the diagnostic profile and supplies a correctly bound
      command request. Reading the reference alone or resubmitting an unchanged review
      does not execute participant-selected commands.

      The intended first command reads the internal runner note at its documented
      path. The operator then runs its documented `curl` status check in a second job
      and receives the remote service's authenticated response. Both jobs use the configured worker
      identity. No completion event creates an account, grants a role, changes a
      firewall, or opens a connection. Subsequent commands use the same submission
      path, without an extra service step or a session secretly supplied by objective evaluation.
    realization_profile: backend-declared
    fidelity_claim: The exact starting state, service transition, denial cases, participant-state persistence, and
      independently owned evidence are required. Backend choices remain open only where they cannot change those
      facts.
    preconditions:
    - precondition_id: eligibility
      precondition_class: authority
      description: Satisfy one complete alternative in the referenced workflow and obtain the required scoped access
        to every listed surface.
      support_refs:
      - workflows.c4
      - features.k-delivery.k-ci--runner
      - features.k-cloud.k-cloud-api--build-records
    - precondition_id: normal-surface
      precondition_class: target
      description: |-
        The review job accepts a support-input reference and a diagnostic request. Its
        ordinary `render-review` profile produces a review document. Build Operations
        also uses `runner-command` to investigate failed integrations. It launches a
        non-privileged process with an argument vector inside an isolated job environment,
        initially authenticated to services as `svc-fieldlink-ci`. A command may invoke
        a POSIX shell, run a script, use ordinary HTTP/certificate/directory clients,
        read its own files, and save output. This is actual command execution, not a
        fixed list of service requests or simulated command responses.

        The job has a private persistent `/workspace`, authenticated file upload/download
        through the submitting account's job interface, and fresh per-run credential
        files under `/run/fieldlink-ci`. The operations note and per-run configuration
        are mounted read-only. `connections.env` supplies only non-secret base URLs;
        each per-service curl configuration supplies that service's worker authentication
        and certificate trust, with no forced URL, HTTP method, request body, or automatic
        redirect following. The installed `curl` accepts the documented options.
        Runtime processes and temporary files disappear
        at job exit; the account's workspace and saved results remain. Client tools
        required by the selected downstream mechanisms must already be installed;
        internet access or installing a missing tool is not an additional task.

        K09.3's protected review includes the maintained diagnostic request reference,
        with the two profile names, argument format, and the internal note's path. It
        does not execute that profile or return the protected note.
        The note identifies the worker, lists its existing service connections, and
        gives a harmless build-record status command. It also explains how to use an
        independently obtained identity without the worker's authentication overriding
        it. Job history retains argument vectors, run IDs, exit status, standard output,
        standard error, and owned artifacts. The input can be submitted again from the
        existing developer position, with credentials retained in private files rather
        than embedded in the saved command line.
      support_refs:
      - features.k-delivery.k-ci--runner
      - features.k-cloud.k-cloud-api--build-records
      - content.keplerops-k-ci.k09-4-run-in-the-runner
    - precondition_id: scope-and-persistence
      precondition_class: realization
      description: |-
        The authorized unit is a repeatable isolated job, not an administrator shell on
        the build server. Commands and child processes run without host privilege; no
        host paths, device access, runtime socket, CI controller credentials, other job
        workspaces, private consumer/reference state, or evidence collector are exposed.
        Uploads/downloads enforce account ownership, normalized path containment, and
        symlink-safe access. A command can read or copy its own job-scoped credentials;
        log masking is not a security boundary and must not be claimed to prevent this.
        Only short-lived, per-run worker credentials with the listed resource scope are
        mounted. Issuer signing keys and reusable CI administration secrets never enter
        the job. A copied worker credential cannot outlive its lease or widen its role;
        its destination also restricts use to the issuing job's network origin. Keep
        lease validation and source binding outside the job's writable state.

        Network enforcement is outside the job. Allow only the declared supplier
        service destinations and the actual protocols needed by their selected clients,
        with scoped internal DNS and time services where required. No internet, other
        participants, host/control infrastructure, cloud metadata, ARWC, general subnet
        transit, or reverse listener is available. Direct IPs, redirects, tunnels, and
        child processes cannot bypass these restrictions. No automatic credential
        injection proxy may overwrite a client's independently selected authentication.

        The existing scope is source/package reads; the limited staff and certificate
        interfaces; cloud trust and authenticated build records; and maintenance policy
        and own-job management. Each destination checks its normal resource and action
        permissions. Maintenance management can submit the bounded maintenance workload
        used by K31, but cannot select arbitrary images, change its runtime identity,
        or directly read the field archive. Recovering the distinct backup or delegated
        principal, exploiting maintenance classification, and acquiring staff authority
        remain downstream work. An allowed connection is not the destination service's
        identity. Source/package access stays read-only under the initial worker role;
        commands alone do not grant release approval, signing, or customer delivery.

        For a later earned identity, retain its certificate/private key, ticket cache,
        or token in the same account's private `/workspace/credentials` and invoke the
        real client with that material explicitly. Worker authentication is opt-in
        through separate per-service configuration, never an unconditional header or
        forced identity. The receiving service must observe the selected principal and
        apply that principal's scope. No colleague identity is initially seeded here.
        K19 must specify its actual enrollment/authentication protocol and required client
        tools; K20 must specify the further delegation interfaces. The runner can use
        the existing staff/certificate connections for that work. Where an earned role
        is used from the existing developer position instead, its card must identify the
        reachable service and credential handoff. Do not invent a new network path or
        fake an identity service to fill a missing downstream design.

        Finishing a job or this challenge does not revoke the reusable submission path.
        Saved inputs, workspace files, and history survive a break and day-two resume;
        fresh jobs receive fresh worker credentials through ordinary job setup. Job exit
        revokes its worker lease and terminates all child processes, not the separately
        earned identities retained in the workspace. Those follow their own issuer's
        renewal/recovery policy, documented by the downstream card. A failed command or
        job retry leaves earlier files and downstream access intact. Serialize writes
        to one account's workspace and allow cancellation of a stuck process without
        deleting the workspace. Resource limits must accommodate the required native
        clients, return ordinary diagnostics, and introduce no timing puzzle.

        Participant-created workspace files and job history persist across ordinary retries and day-two resume. Job exit expires only its per-run worker lease and processes; it does not erase the workspace, independently earned identities, or destination-side audit.
      support_refs:
      - features.k-delivery.k-ci--runner
      - features.k-cloud.k-cloud-api--build-records
    effects:
    - effect_id: outcome
      effect_class: intended_effect
      description: Demonstrate execution as the build worker, retrieve its protected note, and make a second authenticated
        request to the build-record status service through the same job submission path. The repeatable job path
        supplies the existing workload, identity, and maintenance starting access, not their later results. It grants
        no customer execution.
      target_refs:
      - features.k-delivery.k-ci--runner
      - features.k-cloud.k-cloud-api--build-records
      evidence_refs:
      - evidence_requirements.k09.c4
    - effect_id: verified-evidence
      effect_class: evidence_effect
      description: |-
        Require two distinct run IDs bound to the same participant's job workspace:
        the first records the executed profile, process identity, actual internal-note
        read, and note revision; the second records command execution and the build-record
        status response. Join that second run to the service's authenticated request
        audit using the per-run credential lease, participant workspace, request ID,
        principal, target, and trusted job network origin. The request header alone is not trusted: commands can
        choose it. The execution/file-read and credential-lease evidence must be collected
        outside the participant-writable job and matched to the receiving service's audit.
        A copied note, echoed identity, client-supplied success field, or a job that
        never contacted the service cannot satisfy completion.

        The status response contains the current worker identity and build-service
        availability, not the trust document, backup principal, or maintenance policy.
        Those remain separately protected records for K14, K30, and K31. Returning the
        note and response is ordinary job behavior, independent of objective evaluation; neither
        output announces an access transition or directs the operator to a numbered task.
      target_refs:
      - features.k-delivery.k-ci--runner
      - features.k-cloud.k-cloud-api--build-records
      evidence_refs:
      - evidence_requirements.k09.c4
    failure_classes:
    - precondition_unsatisfied
    - authority_denied
    - target_unavailable
    - partial_success
    - backend_error
    - unknown
content:
  diagnostic-request-reference:
    type: file
    target: k-delivery.k-ci
    path: /srv/fieldlink-ci/reviews/diagnostic-request-reference.md
    description: Maintained Build Operations request reference included in the protected review; not the worker-only
      handover.
    text: |
      # FieldKest review jobs: diagnostic requests

      Build Operations · request format revision 3 · 14 September 2026

      Submit review jobs to `POST /api/review-jobs`. Keep the retained input reference
      from the completed review in `support_input`; the job history records it beside
      the resolved input revision. `diagnostic` is a separate object in that same
      request. Integration diagnostics require that retained reference, not the
      unresolved input link. References belong to the submitting account and its
      current workspace generation. Ordinary support inputs do not carry an
      integration diagnostic context.

      The regular support review uses:

      ```json
      {"profile": "render-review"}
      ```

      Build Operations uses `runner-command` for command-line diagnostics. This profile
      is restricted to build maintainers. Set `argv` to an array whose first string is
      the executable and whose remaining strings are its arguments. Commands start
      in `/workspace`. For example, the ordinary working-directory check is:

      ```json
      {"profile": "runner-command", "argv": ["/bin/pwd"]}
      ```

      Arguments are passed directly to the program. To use a pipeline, redirection,
      or shell variables, invoke `/bin/sh` with `-c` and the command string explicitly.
      The internal service handover is `/srv/fieldlink-ci/runner/runner-operations.md`.
      It documents the connection check and the worker's client configuration.

      The job's Files view uploads and downloads files in the submitting account's
      private `/workspace`. The same directory is mounted in subsequent runs. Save
      scripts, responses, and client material there; temporary files elsewhere and
      running processes do not survive job exit. Files are not shared with another
      submitting account. Use the Cancel action to stop a stuck run before retrying.

      Client configuration is supplied under `/run/fieldlink-ci` for each run. Select
      the appropriate configuration when a command needs the worker's service identity.
      Commands can instead select their own credential files. Do not put passwords,
      private keys, or tokens in `argv`: command arguments are retained in job history.

      Each submission creates a new run. The result records the selected profile,
      process identity, exit status, standard output, standard error, and saved files.
      A queued run is not a completed command. Keep any request ID returned by a
      receiving service when asking that team to check its log.

      Retry from the retained request in job history. Change only the diagnostic
      object when comparing commands against the same support input. A failed run
      does not remove the workspace or an earlier result. Job exit revokes that run's
      worker credentials; the next run receives fresh ones. Workspace files and job
      history persist across Retry, Cancel, job exit, and shift handover.
    sensitive: true
  runner-operations-note:
    type: file
    target: k-delivery.k-ci
    path: /srv/fieldlink-ci/runner/runner-operations.md
    description: Worker-owned Build Operations handover; direct developer reads denied. Returned by the actual diagnostic
      action, not by objective evaluation.
    text: |
      # FieldKest runner service connections

      Noor Aveling · Build Operations · revision 4 · 14 September 2026

      The review worker has service access as `svc-fieldlink-ci`. This is not the
      identity of the person submitting a review. Commands run inside the job's
      restricted environment, with a private `/workspace` retained between runs.

      For a build-record connection check, keep the retained `support_input` from the
      previous job and replace its `diagnostic` object with:

      ```json
      {
        "profile": "runner-command",
        "argv": [
          "/bin/sh",
          "-c",
          ". /run/fieldlink-ci/connections.env; exec curl -q --silent --show-error --fail --config /run/fieldlink-ci/build-records.curl --url \"$FIELDLINK_BUILD_RECORDS_URL/api/build-records/worker-status\""
        ]
      }
      ```

      Submit the review job again. Standard output should identify `svc-fieldlink-ci`
      and report build-record availability, with the service's request ID. Keep that
      ID and the run ID when investigating a failed connection. An accepted job or
      zero exit status alone does not establish which identity the service accepted.

      `connections.env` contains the current base URLs, without trailing slashes,
      for the connections below. It contains no passwords or tokens. The read-only
      client files in `/run/fieldlink-ci` are generated for the current run; do not
      copy their credentials into a script for reuse after the run ends.

      | Service | Starting resource (GET) | Use |
      | --- | --- | --- |
      | `source` | `/api/v1/user/repos` | List the repositories available to the worker. Follow their API URLs for source and revision records. |
      | `packages` | `/@keplerops%2ffieldlink-connector` | Read FieldLink connector version metadata and retained package locations. |
      | `staff` | `/api/service-directory` | Read service ownership, authentication endpoints, supported client commands, and enrollment references. |
      | `certificates` | Enrollment service record in the staff directory | Use the enrollment and authentication protocols documented by that service, with its installed client tools. |
      | `cloud-policy` | `/api/trust` | Inspect the workload trust record and the identity service's request forms. |
      | `build-records` | `/api/build-records` | Read authenticated job records and their archive references. |
      | `maintenance` | `/api/maintenance` | Inspect scheduling policy and manage this worker's maintenance jobs. |

      The URL variables are `FIELDLINK_SOURCE_URL`, `FIELDLINK_PACKAGES_URL`,
      `FIELDLINK_STAFF_URL`, `FIELDLINK_CLOUD_POLICY_URL`, `FIELDLINK_BUILD_RECORDS_URL`,
      and `FIELDLINK_MAINTENANCE_URL`. The corresponding worker HTTP configuration
      files are `source.curl`, `packages.curl`, `staff.curl`, `cloud-policy.curl`,
      `build-records.curl`, and `maintenance.curl`, all under `/run/fieldlink-ci`.
      The certificate service's record supplies its native endpoint and client
      configuration; it is not a generic HTTP record store.

      The staff, policy, build-record, and maintenance indexes return resource links
      and accepted request fields. Source and package responses use their own API
      formats. Do not send one service's credential file to another service or use
      automatic cross-service redirects. Destination services enforce their own roles.

      For a separate authorized identity, keep its client material in the private
      `/workspace/credentials` directory and select it explicitly in the appropriate
      client. Do not load the worker's credential configuration for that request.
      Certificate and ticket clients use the service's documented options and cache
      paths. They are installed in the job environment; no external download is needed.
      Check the principal reported by the receiving service, not just the local process
      name. A failed authentication is not retried as the worker automatically.

      Maintenance jobs run under a separate identity. Creating a job does not make
      its mounted archive readable to the submitting worker. Backup recovery likewise
      uses a separate principal; the runner cannot read the source database directly.
      Release approval, signing material, private release evaluation, and customer
      delivery are not part of the worker's role.

      Commands can run scripts and save results in `/workspace`; use the job's Files
      view to move your own files in or out. Job exit stops child processes and revokes
      the worker credentials, but leaves workspace files and separately issued client
      material intact. Renew that material through its issuing service when required.
      Retry and Cancel preserve files. Saved commands and results remain available
      across job exit and for a shift handover.

      Network policy is enforced outside the job. The listed supplier services are
      reachable on their approved protocols; the job has no general network transit,
      internet access, customer connection, or access to another job's files. Changing
      a command or client credential does not change that network policy.
    sensitive: true
