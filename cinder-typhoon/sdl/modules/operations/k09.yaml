action_contracts:
  c1:
    semantic_version: 1.0.0
    lifecycle_state: draft
    behavioral_granularity: aggregate
    procedure_basis: Summary redaction does not extend to the run's normally archived log. The intended
      solution recovers that log through its run provenance and validates the dossier reference.
    realization_profile: backend-declared
    fidelity_claim: The authored mechanism, normal behavior, proof, authority limits, and reset requirements
      are required. Hosting and their implementation remain backend-declared.
    preconditions:
    - precondition_id: eligibility
      precondition_class: authority
      description: Satisfy one complete alternative in the referenced workflow and obtain the required
        scoped access to every listed surface.
      support_refs:
      - workflows.k09.c1
      - features.k-delivery.k-ci
    - precondition_id: normal-surface
      precondition_class: target
      description: The CI public summary links a failed run while a retained runner log contains ordinary
        execution details and a release-dossier reference.
      support_refs: *id005
    - precondition_id: boundaries-and-reset
      precondition_class: realization
      description: |-
        These are requirements on the realized environment. Apply reset behavior only when a participant reset is requested, not on challenge completion.

        Run history is read-only synthetic data; reset removes player reads without changing CI records.
      support_refs:
      - features.k-delivery.k-ci
    effects:
    - effect_id: outcome
      effect_class: intended_effect
      description: Recover the actual log and its job binding. Its dossier reference can introduce K29
        or K30; it grants no cloud principal.
      target_refs: *id005
      evidence_refs:
      - evidence_requirements.k09.c1
    - effect_id: verified-evidence
      effect_class: evidence_effect
      description: The log digest, run ID, and dossier ID are recorded as player evidence; no runner or
        release authority results.
      target_refs: *id001
      evidence_refs:
      - evidence_requirements.k09.c1
    failure_classes:
    - precondition_unsatisfied
    - authority_denied
    - target_unavailable
    - partial_success
    - backend_error
    - unknown
  c2:
    semantic_version: 1.0.0
    lifecycle_state: draft
    behavioral_granularity: aggregate
    procedure_basis: The artifact index filters one completed output incorrectly. The intended solution
      follows normal build metadata to recover the omitted artifact and confirm its exact revision.
    realization_profile: backend-declared
    fidelity_claim: The authored mechanism, normal behavior, proof, authority limits, and reset requirements
      are required. Hosting and their implementation remain backend-declared.
    preconditions:
    - precondition_id: eligibility
      precondition_class: authority
      description: Satisfy one complete alternative in the referenced workflow and obtain the required
        scoped access to every listed surface.
      support_refs:
      - workflows.k09.c2
      - features.k-delivery.k-ci
    - precondition_id: normal-surface
      precondition_class: target
      description: The CI run's immutable metadata names an artifact whose current results-page index
        is incomplete; the artifact archive retains build revision and provenance.
      support_refs: *id006
    - precondition_id: boundaries-and-reset
      precondition_class: realization
      description: |-
        These are requirements on the realized environment. Apply reset behavior only when a participant reset is requested, not on challenge completion.

        The artifact is read-only, player evidence only, and does not expose runner credentials or job modification; reset clears its event.
      support_refs:
      - features.k-delivery.k-ci
    effects:
    - effect_id: outcome
      effect_class: intended_effect
      description: Recover the missing artifact from its separate publication surface. It contains the
        test-job evidence used later in this operation.
      target_refs: *id006
      evidence_refs:
      - evidence_requirements.k09.c2
    - effect_id: verified-evidence
      effect_class: evidence_effect
      description: Artifact retrieval records the run, object version, and build revision, enabling K09.3's
        input path.
      target_refs: *id002
      evidence_refs:
      - evidence_requirements.k09.c2
    failure_classes:
    - precondition_unsatisfied
    - authority_denied
    - target_unavailable
    - partial_success
    - backend_error
    - unknown
  c3:
    semantic_version: 1.0.0
    lifecycle_state: draft
    behavioral_granularity: aggregate
    procedure_basis: The job input resolver validates the submitted collection but follows a linked support
      reference outside it. The intended solution creates a bounded valid input using K09.2's artifact
      and observes the review result.
    realization_profile: backend-declared
    fidelity_claim: The authored mechanism, normal behavior, proof, authority limits, and reset requirements
      are required. Hosting and their implementation remain backend-declared.
    preconditions:
    - precondition_id: eligibility
      precondition_class: authority
      description: Satisfy one complete alternative in the referenced workflow and obtain the required
        scoped access to every listed surface.
      support_refs:
      - workflows.k09.c3
      - features.k-delivery.k-ci
    - precondition_id: normal-surface
      precondition_class: target
      description: The CI test job consumes an archived support input and generates a restricted review
        output under the runner's job identity.
      support_refs: *id007
    - precondition_id: boundaries-and-reset
      precondition_class: realization
      description: |-
        These are requirements on the realized environment. Apply reset behavior only when a participant reset is requested, not on challenge completion.

        Resolution is restricted to two fixtures and a player-local job; no arbitrary archive path or workflow edit is available. Reset clears queued/job data.
      support_refs:
      - features.k-delivery.k-ci
    effects:
    - effect_id: outcome
      effect_class: intended_effect
      description: Produce the protected review output under the intended job identity. This establishes
        a distinct input capability, not general runner execution.
      target_refs: *id007
      evidence_refs:
      - evidence_requirements.k09.c3
    - effect_id: verified-evidence
      effect_class: evidence_effect
      description: CI records the selected support object and returns the restricted review output with
        job provenance; no persistent runner access is granted.
      target_refs: *id003
      evidence_refs:
      - evidence_requirements.k09.c3
    failure_classes:
    - precondition_unsatisfied
    - authority_denied
    - target_unavailable
    - partial_success
    - backend_error
    - unknown
  c4:
    semantic_version: 1.0.0
    lifecycle_state: draft
    behavioral_granularity: aggregate
    procedure_basis: The resolved support input can alter one declared diagnostic action after K09.3.
      The intended solution demonstrates that action in the runner context and retrieves the protected
      job note.
    realization_profile: backend-declared
    fidelity_claim: The authored mechanism, normal behavior, proof, authority limits, and reset requirements
      are required. Hosting and their implementation remain backend-declared.
    preconditions:
    - precondition_id: eligibility
      precondition_class: authority
      description: Satisfy one complete alternative in the referenced workflow and obtain the required
        scoped access to every listed surface.
      support_refs:
      - workflows.k09.c4
      - features.k-delivery.k-ci
    - precondition_id: normal-surface
      precondition_class: target
      description: The test-job workflow renders the selected review output with a constrained diagnostic
        action executed by the `svc-fieldlink-ci` runner identity.
      support_refs: *id008
    - precondition_id: boundaries-and-reset
      precondition_class: realization
      description: |-
        These are requirements on the realized environment. Apply reset behavior only when a participant reset is requested, not on challenge completion.

        Execution is an authored one-action sandbox with no shell, persistence, workload deployment, or broad CI control. Reset destroys job state and its scoped token.
      support_refs:
      - features.k-delivery.k-ci
      - features.k-delivery.k-ci--runner
    effects:
    - effect_id: outcome
      effect_class: intended_effect
      description: Demonstrate actual execution and recover the job note. This context enables workload
        and maintenance branches; it grants no customer execution.
      target_refs: *id008
      evidence_refs:
      - evidence_requirements.k09.c4
    - effect_id: verified-evidence
      effect_class: evidence_effect
      description: The runner audit records identity, permitted action, run ID, and protected note revision,
        awarding the bounded workload lead used by K14 or K30.
      target_refs: *id004
      evidence_refs:
      - evidence_requirements.k09.c4
    failure_classes:
    - precondition_unsatisfied
    - authority_denied
    - target_unavailable
    - partial_success
    - backend_error
    - unknown
