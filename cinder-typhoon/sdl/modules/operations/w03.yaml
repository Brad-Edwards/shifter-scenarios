      retention: require
      redaction: redact-secrets
      integrity: checksum
      required: true
      basis: observed
    notes:
    - 'Author checks: Complete the documented participant path through the named native products. Verify the product-owned
      record or mutation, the declared denied neighbor or write boundary, unchanged unrelated records, fresh evidence,
      and retained-volume persistence after an ordinary restart.'
