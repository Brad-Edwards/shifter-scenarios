      Retrieve the actual order attachment and bind its content hash, annex revision, supplier job and drawing reference to the native order. Another supplier's attachments remain denied.

      Required technical proof: Retrieve the actual order attachment and bind its content hash, annex revision, supplier job and drawing reference to the native order. Another supplier's attachments remain denied.

      Evidence collection is read-only. It cannot create a share, change a document,
      issue a product session, or fabricate a product history entry. Native product
      state and submitted observations must refer to the same range instance.
    source_refs:
    - features.a-corporate.a-business
    scope: Per-participant in-world evidence; no other participant state.
    boundary_kind: assertion_evaluation
    channel: other
    artifact_role: proposition_truth_evidence
    sensitivity: plain
    redaction: redact_secrets
    integrity: checksum
    retention: run_lifetime
    loss_disclosure: required
    observation_demand:
      rule_id: fact-w03-1
      scope: /features
      purpose: experimental
      mode: selected
      selector:
        semantic_scope: /features
        data_kind: artifact
        names:
        - cinder.w03-1.satisfied
        component_refs:
        - features.a-corporate.a-business
