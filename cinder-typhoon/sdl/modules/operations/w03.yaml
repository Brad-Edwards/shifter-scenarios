      retention: require
      redaction: redact-secrets
      integrity: checksum
      required: true
      basis: observed
propositions:
  c1:
    description: Recover the actual annex and handover reference. The importer address alone does not
      earn the score.
    subjects: *id001
    basis: observed_state
    predicate:
      kind: boolean
      property: cinder.w03-1.satisfied
      semantic_ref: urn:cinder-typhoon:fact:W03.1
      operator: equals
      expected: true
    evidence_requirements:
    - c1
    quantifier: all
  c2:
    description: Recover the restricted handover content with its correct work-order binding. This is
      evidence for the read integration, not live process access.
    subjects: *id002
