      collection: require
      retention: require
      redaction: redact-secrets
      integrity: checksum
      required: true
      basis: observed
  c3:
    description: Recover the current read configuration and its scope. This supplies W03.READ; W09's data
      binding is still needed for OT visibility. The associated handover also identifies the retained
      contractor bundle used in W08, without granting access to unrelated corporate records.
    source_refs: &id003
    - features.a-corporate.a-business
    scope: Per-participant in-world evidence; no other participant state.
    boundary_kind: assertion_evaluation
    channel: other
    artifact_role: proposition_truth_evidence
    sensitivity: plain
    redaction: redact_secrets
    integrity: checksum
    retention: run_lifetime
    loss_disclosure: required
