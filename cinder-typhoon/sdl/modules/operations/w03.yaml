propositions:
  c1:
    description: Recover the actual annex and handover reference. The importer address alone does not satisfy the
      result.
    subjects:
    - features.a-corporate.a-business
    basis: observed_state
    predicate:
      kind: boolean
      property: cinder.w03-1.satisfied
      semantic_ref: urn:cinder-typhoon:fact:W03.1
      operator: equals
      expected: true
    evidence_requirements:
    - c1
    quantifier: all
  c2:
    description: Recover the restricted handover content with its correct work-order binding. This is evidence for
      the read integration, not live process access.
    subjects:
    - features.a-corporate.a-business
    basis: observed_state
    predicate:
      kind: boolean
      property: cinder.w03-2.satisfied
      semantic_ref: urn:cinder-typhoon:fact:W03.2
      operator: equals
      expected: true
    evidence_requirements:
    - c2
    quantifier: all
  c3:
    description: Recover the current read configuration and its scope. This supplies W03.READ; W09's data binding
      is still needed for OT visibility. The associated handover also identifies the retained contractor bundle
      used in W08, without granting access to unrelated corporate records.
    subjects:
    - features.a-dmz.a-data-bridge
    - features.a-corporate.a-data
    basis: observed_state
    predicate:
      kind: boolean
      property: cinder.w03-3.satisfied
      semantic_ref: urn:cinder-typhoon:fact:W03.3
      operator: equals
      expected: true
    evidence_requirements:
    - c3
    quantifier: all
