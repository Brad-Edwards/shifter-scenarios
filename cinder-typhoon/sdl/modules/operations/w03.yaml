objectives:
  c1:
    name: 'This action: An annex left with the order'
    description: |-
      Recover the unpublished work-order annex and identify the process-data handover mentioned in it.

      Offers an approachable lead toward OT visibility.
    assigned_participant: participant.operator
    actions:
    - w03.c1
    targets:
    - features.a-corporate.a-business
    success:
      mode: all_of
      assertions:
      - c1-done
    window:
      workflows:
      - w03.c1
  c2:
    name: 'This action: A reference outside the order'
    description: |-
      Make the annex workflow recover the restricted handover file that the ordinary work-order view cannot read.

      Crosses a separate file-reference boundary.
    assigned_participant: participant.operator
    actions:
    - w03.c2
    targets:
    - features.a-corporate.a-business
    success:
      mode: all_of
      assertions:
      - c2-done
    window:
      workflows:
      - w03.c2
  c3:
    name: 'This action: The integration''s read contract'
    description: |-
      Recover the protected read-integration configuration behind the annex service's separate export boundary.

      Establishes the administrative half of the ordinary integration route.
    assigned_participant: participant.operator
    actions:
    - w03.c3
    targets:
    - features.a-dmz.a-data-bridge
    - features.a-corporate.a-data
    success:
      mode: all_of
      assertions:
      - c3-done
    window:
      workflows:
      - w03.c3
workflows:
  c1:
    description: 'This action: availability follows the evidence/authority alternatives. This independent objective
      may be revisited when facts change; no global sequence or deadline is imposed.'
    start: requirements
    steps:
      requirements:
        type: switch
        cases:
        - when:
            assertions:
            - capabilities.corporate-ready
          next: attempt
        default: unavailable
      available:
        type: end
      unavailable:
        type: end
      attempt:
        type: objective
        execution_mode: objective
        objective: w03.c1
        on_success: available
        on_failure: unavailable
  c2:
    description: 'This action: availability follows the evidence/authority alternatives. This independent objective
      may be revisited when facts change; no global sequence or deadline is imposed.'
    start: requirements
    steps:
      requirements:
        type: switch
        cases:
        - when:
            assertions:
            - w03.c1-ready
          next: attempt
        default: unavailable
      available:
        type: end
      unavailable:
        type: end
      attempt:
        type: objective
        execution_mode: objective
        objective: w03.c2
        on_success: available
        on_failure: unavailable
  c3:
    description: 'This action: availability follows the evidence/authority alternatives. This independent objective
      may be revisited when facts change; no global sequence or deadline is imposed.'
    start: requirements
    steps:
      requirements:
        type: switch
        cases:
        - when:
            assertions:
            - w03.c2-ready
          next: attempt
        default: unavailable
      available:
        type: end
      unavailable:
        type: end
      attempt:
        type: objective
        execution_mode: objective
        objective: w03.c3
        on_success: available
        on_failure: unavailable
