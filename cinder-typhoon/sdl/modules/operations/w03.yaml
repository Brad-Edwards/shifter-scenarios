assertions:
  c1-ready:
    proposition: c1
    role: precondition
    polarity: positive
  c1-done:
    proposition: c1
    role: postcondition
    polarity: positive
  c2-ready:
    proposition: c2
    role: precondition
    polarity: positive
  c2-done:
    proposition: c2
    role: postcondition
    polarity: positive
  c3-ready:
    proposition: c3
    role: precondition
    polarity: positive
  c3-done:
    proposition: c3
    role: postcondition
    polarity: positive
objectives:
  c1:
    name: 'W03.1: An annex left with the order'
    description: |-
      Recover the unpublished work-order annex and identify the process-data handover mentioned in it.

      Offers an approachable lead toward OT visibility.
    agent: participant.operator
    actions:
    - w03.c1
    targets: &id004
    - features.a-corporate.a-business
    success:
      mode: all_of
      assertions:
      - c1-done
    window:
      workflows:
      - w03.c1
  c2:
    name: 'W03.2: A reference outside the order'
    description: |-
      Make the annex workflow recover the restricted handover file that the ordinary work-order view cannot read.

      Crosses a separate file-reference boundary.
    agent: participant.operator
    actions:
    - w03.c2
    targets: &id005
    - features.a-corporate.a-business
    success:
      mode: all_of
      assertions:
      - c2-done
    window:
      workflows:
      - w03.c2
  c3:
    name: 'W03.3: The integration''s read contract'
    description: |-
      Recover the protected read-integration configuration behind the annex service's separate export boundary.

      Establishes the administrative half of the ordinary integration route.
    agent: participant.operator
    actions:
    - w03.c3
    targets: &id006
    - features.a-corporate.a-business
    success:
      mode: all_of
      assertions:
      - c3-done
    window:
      workflows:
      - w03.c3
workflows:
  c1:
    description: 'W03.1: availability follows the evidence/authority alternatives. This independent objective
      may be revisited when facts change; no campaign-wide sequence or deadline is imposed.'
    start: requirements
    steps:
      requirements:
        type: switch
        cases:
        - when:
            assertions:
            - capabilities.corporate-ready
          next: attempt
        default: unavailable
      available:
        type: end
      unavailable:
        type: end
      attempt:
        type: objective
        execution_mode: objective
        objective: w03.c1
        on_success: available
        on_failure: unavailable
  c2:
    description: 'W03.2: availability follows the evidence/authority alternatives. This independent objective
      may be revisited when facts change; no campaign-wide sequence or deadline is imposed.'
    start: requirements
    steps:
      requirements:
        type: switch
        cases:
        - when:
            assertions:
            - w03.c1-ready
          next: attempt
        default: unavailable
      available:
        type: end
      unavailable:
        type: end
      attempt:
        type: objective
        execution_mode: objective
        objective: w03.c2
        on_success: available
        on_failure: unavailable
  c3:
    description: 'W03.3: availability follows the evidence/authority alternatives. This independent objective
      may be revisited when facts change; no campaign-wide sequence or deadline is imposed.'
    start: requirements
    steps:
      requirements:
        type: switch
        cases:
        - when:
            assertions:
            - w03.c2-ready
          next: attempt
        default: unavailable
      available:
        type: end
      unavailable:
        type: end
      attempt:
        type: objective
        execution_mode: objective
        objective: w03.c3
        on_success: available
        on_failure: unavailable
