objectives:
  c1:
    name: 'K18.1: The note behind the preview'
    description: |-
      Recover the restricted support-note draft and establish which identity workflow consumes its preview.

      Introduces a note with an operationally useful consumer.
    agent: participant.operator
    actions:
    - k18.c1
    targets: &id005
    - features.k-corporate.k-staff
    success:
      mode: all_of
      assertions:
      - c1-done
    window:
      workflows:
      - k18.c1
  c2:
    name: 'K18.2: A note with someone else''s authority'
    description: |-
      Make the privileged note reviewer open the identity-provider administration view and recover its restricted support-application registration record.

      Turns a support-content foothold into a different application's authority.
    agent: participant.operator
    actions:
    - k18.c2
    targets: &id006
    - features.k-corporate.k-staff
    success:
      mode: all_of
      assertions:
      - c2-done
    window:
      workflows:
      - k18.c2
  c3:
    name: 'K18.3: The provider trusts our change'
    description: |-
      Change the federation policy for the support application's identity-provider registration so your controlled provider is accepted, while preserving the existing staff login relationship.

      Makes an identity trust relationship an attacker-controlled input.
    agent: participant.operator
    actions:
    - k18.c3
    targets: &id007
    - features.k-corporate.k-identity
    success:
      mode: all_of
      assertions:
      - c3-done
    window:
      workflows:
      - k18.c3
  c4:
    name: 'K18.4: The query behind the identity'
    description: |-
      Use the changed trust relationship to recover the backend customer record withheld from ordinary support identities.

      Ends the chain with protected supplier data.
    agent: participant.operator
    actions:
    - k18.c4
    targets: &id008
    - features.k-delivery.k-support--customer-records
    success:
      mode: all_of
      assertions:
      - c4-done
    window:
      workflows:
      - k18.c4
workflows:
  c1:
    description: 'K18.1: availability follows the evidence/authority alternatives. This independent objective
      may be revisited when facts change; no campaign-wide sequence or deadline is imposed.'
    start: requirements
    steps:
      requirements:
        type: switch
        cases:
        - when:
            assertions:
            - capabilities.b01-ready
          next: attempt
        default: unavailable
      available:
        type: end
      unavailable:
        type: end
      attempt:
