action_contracts:
  c1:
    semantic_version: 1.0.0
    lifecycle_state: draft
    behavioral_granularity: aggregate
    procedure_basis: 'This is a measurement-literacy task. The intended solution is to distinguish a

      setpoint from the independent observation and bind the reported volume to its

      sample and units, using the supplied HMI and tag legend.'
    realization_profile: backend-declared
    fidelity_claim: The authored mechanism, normal behavior, observable outcome, and authority boundaries constrain
      realization. Validation is not evidence that the application has been built or that the mechanism works.
    preconditions:
    - precondition_id: eligibility
      precondition_class: authority
      description: Satisfy one complete alternative in the referenced workflow and obtain the required scoped access
        to every listed surface.
      support_refs:
      - workflows.t04.c1
      - features.training.t-state
    - precondition_id: normal-surface
      precondition_class: target
      description: 'The training HMI displays a requested level alongside a timestamped tank

        observation from a deterministic practice model. The observation includes tag,

        sample ID, engineering units, value, and quality. The immutable VC-017 record is

        served at `/captures/volume.json`: sample VS-017 measures 1,200 L with good

        quality while its requested volume is 1,000 L. `/field-guide.md` defines the

        fields. This capture is not the live tank.'
      support_refs:
      - features.training.t-state
      - content.training-state-content.index
      - content.training-state-content.field-guide
      - content.training-state-content.captures-volume
    - precondition_id: boundaries
      precondition_class: realization
      description: 'The capture is immutable and separate from the writable practice tank.

        Practice requests cannot alter this recorded sample.'
      support_refs:
      - features.training.t-state
    effects:
    - effect_id: outcome
      effect_class: intended_effect
      description: Recover the measured volume bound to its sample and units. A target setting or unitless guess
        is insufficient.
      target_refs:
      - features.training.t-state
      evidence_refs:
      - evidence_requirements.t04.c1
    - effect_id: verified-evidence
      effect_class: evidence_effect
      description: 'The capture binds its measured volume to sample ID, engineering units,

        quality, and timestamp. The requested level is a separate field and is not

        substituted for the measurement.'
      target_refs:
      - features.training.t-state
      evidence_refs:
      - evidence_requirements.t04.c1
    failure_classes:
    - precondition_unsatisfied
    - authority_denied
    - target_unavailable
    - partial_success
    - backend_error
    - unknown
  c2:
    semantic_version: 1.0.0
    lifecycle_state: draft
    behavioral_granularity: aggregate
    procedure_basis: 'This is a bounded protocol-and-documentation interpretation exercise. The

      intended solution decodes the captured status with the matching controller

      revision and correlates the asserted bit with the outlet state, rather than

      selecting an alarm label by guesswork.'
    realization_profile: backend-declared
    fidelity_claim: The authored mechanism, normal behavior, observable outcome, and authority boundaries constrain
      realization. Validation is not evidence that the application has been built or that the mechanism works.
    preconditions:
    - precondition_id: eligibility
      precondition_class: authority
      description: Satisfy one complete alternative in the referenced workflow and obtain the required scoped access
        to every listed surface.
      support_refs:
      - workflows.t04.c2
      - features.training.t-state
    - precondition_id: normal-surface
      precondition_class: target
      description: 'The practice controller publishes a compact status word and a versioned legend

        alongside its HMI diagram. The captured record represents one outlet, one

        sample time, and the condition that blocks a requested practice transition.

        The immutable SC-018 record is served at `/captures/status.json`; its TR-1

        status word is 5, meaning ready and service hold, with the outlet closed.

        The matching bit legend is published at `/field-guide.md`. No other controller

        revision is needed to interpret this small recorded case.'
      support_refs:
      - features.training.t-state
      - content.training-state-content.index
      - content.training-state-content.field-guide
      - content.training-state-content.captures-status
    - precondition_id: boundaries
      precondition_class: realization
      description: 'The capture and its legend are immutable records, separate from the live

        practice view. Reading this capture cannot alter the controller or issue a

        command. The live view supplies its own current status and matching legend.'
      support_refs:
      - features.training.t-state
    effects:
    - effect_id: outcome
      effect_class: intended_effect
      description: Identify the actual blocking condition and its state in the capture. Selecting an arbitrary alarm
        from the legend does not count.
      target_refs:
      - features.training.t-state
      evidence_refs:
      - evidence_requirements.t04.c2
    - effect_id: verified-evidence
      effect_class: evidence_effect
      description: 'The capture binds one status word to its sample ID and controller revision.

        The matching legend identifies the asserted blocking condition. Reading this

        record does not reveal, change, or authorize anything in the live practice

        application; that application already exposes its own status and legend.'
      target_refs:
      - features.training.t-state
      evidence_refs:
      - evidence_requirements.t04.c2
    failure_classes:
    - precondition_unsatisfied
    - authority_denied
    - target_unavailable
    - partial_success
    - backend_error
    - unknown
  c3:
    semantic_version: 1.0.0
    lifecycle_state: draft
    behavioral_granularity: aggregate
    procedure_basis: 'This is a safe control-verification task, not an authorization bypass. The

      intended solution is to inspect the live status and its available legend,

      clear the condition through the normal practice workflow, request the specified bounded transfer, and validate
      the

      result against observations.'
    realization_profile: backend-declared
    fidelity_claim: The authored mechanism, normal behavior, observable outcome, and authority boundaries constrain
      realization. Validation is not evidence that the application has been built or that the mechanism works.
    preconditions:
    - precondition_id: eligibility
      precondition_class: authority
      description: Satisfy one complete alternative in the referenced workflow and obtain the required scoped access
        to every listed surface.
      support_refs:
      - workflows.t04.c3
      - features.training.t-state
    - precondition_id: normal-surface
      precondition_class: target
      description: 'The training HMI drives a deterministic isolated tank-and-outlet practice model.

        It exposes a documented request interface, operating bounds, accepted/rejected

        command record, and independently published tank observations. The interface

        and numerical contract are published at `/field-guide.md`; the live view is

        `/practice` and its current state is `/api/practice/state`. Initial tank PT-01

        contains 1,200 L, is ready, has a service hold, and has its outlet closed.

        The requested 200 L transfer leaves 1,000 L and a closed outlet after 10 seconds

        at 20 L/s. The server retains its request register and independent observation

        register. Read-only captures and the report replay belong to other tank IDs.'
      support_refs:
      - features.training.t-state
      - content.training-state-content.index
      - content.training-state-content.field-guide
      - content.training-state-content.practice-initial
      - content.training-state-config-content.state-service-contract-json
    - precondition_id: boundaries
      precondition_class: realization
      description: 'The practice model belongs to the individual workspace and cannot reach any

        campaign control state. No automatic rewind or refilling follows a transfer.

        Initial state is established once when the environment is prepared; subsequent

        state changes occur only through the documented operating controls.'
      support_refs:
      - features.training.t-state
    effects:
    - effect_id: outcome
      effect_class: intended_effect
      description: Demonstrate the requested transfer and final outlet state within the published bounds. An accepted
        request alone is insufficient; no campaign authority is granted.
      target_refs:
      - features.training.t-state
      evidence_refs:
      - evidence_requirements.t04.c3
    - effect_id: verified-evidence
      effect_class: evidence_effect
      description: 'The request record, final outlet state, and independent before/after

        measurements identify the same transfer. The observed volume difference must

        match the requested amount within the documented tolerance. Request acceptance

        alone does not establish physical movement in the practice model.'
      target_refs:
      - features.training.t-state
      evidence_refs:
      - evidence_requirements.t04.c3
    failure_classes:
    - precondition_unsatisfied
    - authority_denied
    - target_unavailable
    - partial_success
    - backend_error
    - unknown
  c4:
    semantic_version: 1.0.0
    lifecycle_state: draft
    behavioral_granularity: aggregate
    procedure_basis: 'The reporting job correlates a stale accepted request with the latest test

      record, ignoring the later blocked transition. The intended solution is a

      timeline reconstruction from the supplied records; T04.3 is neither required

      nor sufficient because this card uses a separate attempt.'
    realization_profile: backend-declared
    fidelity_claim: The authored mechanism, normal behavior, observable outcome, and authority boundaries constrain
      realization. Validation is not evidence that the application has been built or that the mechanism works.
    preconditions:
    - precondition_id: eligibility
      precondition_class: authority
      description: Satisfy one complete alternative in the referenced workflow and obtain the required scoped access
        to every listed surface.
      support_refs:
      - workflows.t04.c4
      - features.training.t-state
    - precondition_id: normal-surface
      precondition_class: target
      description: 'A training report records a green test outcome while the same attempt has an

        immutable controller request, HMI status capture, and independent observation

        trace. The report''s author and generation timestamp are ordinary seeded data.

        The desk publishes `/replay/report.json`, `/replay/requests.json`, and

        `/replay/observations.csv`. OR-042 concerns AT-042/RQ-042 on tank RT-02 but uses

        the accepted RQ-041 record from the preceding hour. AT-042 was rejected with a

        service hold; its independent samples retain 1,000 L and a closed outlet.

        The earlier accepted attempt really moved 200 L, so the source record is stale

        rather than fabricated. No report generator needs to run to establish this

        authored historical discrepancy.'
      support_refs:
      - features.training.t-state
      - content.training-state-content.index
      - content.training-state-content.field-guide
      - content.training-state-content.replay-report
      - content.training-state-content.replay-requests
      - content.training-state-content.replay-observations
    - precondition_id: boundaries
      precondition_class: realization
      description: 'The report, request records, status, and observation trace are immutable.

        They belong to a separate recorded attempt, not the current practice tank.

        Live commands cannot rewrite this discrepancy.'
      support_refs:
      - features.training.t-state
    effects:
    - effect_id: outcome
      effect_class: intended_effect
      description: Recover the recorded attempt's result and the evidence establishing the report's error. This
        replay is independent of the live practice tank.
      target_refs:
      - features.training.t-state
      evidence_refs:
      - evidence_requirements.t04.c4
    - effect_id: verified-evidence
      effect_class: evidence_effect
      description: 'The retained records identify the current attempt, its actual outcome, the

        stale source used in the report, and contradictory measurements. Their

        correlation IDs and timestamps explain the discrepancy without depending on

        the current practice tank or any external grading state.'
      target_refs:
      - features.training.t-state
      evidence_refs:
      - evidence_requirements.t04.c4
    failure_classes:
    - precondition_unsatisfied
    - authority_denied
    - target_unavailable
    - partial_success
    - backend_error
    - unknown
