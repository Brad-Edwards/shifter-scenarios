action_contracts:
  c1:
    semantic_version: 1.0.0
    lifecycle_state: draft
    behavioral_granularity: aggregate
    procedure_basis: |-
      This is a measurement-literacy task. The intended solution is to distinguish a
      setpoint from the independent observation and bind the reported volume to its
      sample and units, using the supplied HMI and tag legend.
    realization_profile: backend-declared
    fidelity_claim: The authored mechanism, normal behavior, proof, authority limits, and reset requirements
      are required. Hosting and their implementation remain backend-declared.
    preconditions:
    - precondition_id: eligibility
      precondition_class: authority
      description: Satisfy one complete alternative in the referenced workflow and obtain the required
        scoped access to every listed surface.
      support_refs:
      - workflows.t04.c1
      - features.training.t-state
    - precondition_id: normal-surface
      precondition_class: target
      description: |-
        The training HMI displays a requested level alongside a timestamped tank
        observation from a deterministic practice model. The observation includes tag,
        sample ID, engineering units, value, and quality.
      support_refs: *id005
    - precondition_id: boundaries-and-reset
      precondition_class: realization
      description: |-
        These are requirements on the realized environment. Apply reset behavior only when a participant reset is requested, not on challenge completion.

        The display is read-only and contains a small synthetic trace. Reset restores
        the same deterministic sample sequence and clears evidence events.
      support_refs:
      - features.training.t-state
    effects:
    - effect_id: outcome
      effect_class: intended_effect
      description: Recover the measured volume bound to its sample and units. A target setting or unitless
        guess is insufficient.
      target_refs: *id005
      evidence_refs:
      - evidence_requirements.t04.c1
    - effect_id: verified-evidence
      effect_class: evidence_effect
      description: |-
        Scoring accepts the observation's sample ID, measured value, and unit only when
        they match the current practice trace. It adds no control authority or mutable
        state.
      target_refs: *id001
      evidence_refs:
      - evidence_requirements.t04.c1
    failure_classes:
    - precondition_unsatisfied
    - authority_denied
    - target_unavailable
    - partial_success
    - backend_error
    - unknown
  c2:
    semantic_version: 1.0.0
    lifecycle_state: draft
    behavioral_granularity: aggregate
    procedure_basis: |-
      This is a bounded protocol-and-documentation interpretation exercise. The
      intended solution decodes the captured status with the matching controller
      revision and correlates the asserted bit with the outlet state, rather than
      selecting an alarm label by guesswork.
    realization_profile: backend-declared
    fidelity_claim: The authored mechanism, normal behavior, proof, authority limits, and reset requirements
      are required. Hosting and their implementation remain backend-declared.
    preconditions:
    - precondition_id: eligibility
      precondition_class: authority
      description: Satisfy one complete alternative in the referenced workflow and obtain the required
        scoped access to every listed surface.
      support_refs:
      - workflows.t04.c2
      - features.training.t-state
    - precondition_id: normal-surface
      precondition_class: target
      description: |-
        The practice controller publishes a compact status word and a versioned legend
        alongside its HMI diagram. The captured record represents one outlet, one
        sample time, and the condition that blocks a requested practice transition.
      support_refs: *id006
    - precondition_id: boundaries-and-reset
      precondition_class: realization
      description: |-
        These are requirements on the realized environment. Apply reset behavior only when a participant reset is requested, not on challenge completion.

        Only a recorded status capture is exposed. It cannot alter the controller or
        issue a command, and reset restores the exact trace and legend.
      support_refs:
      - features.training.t-state
    effects:
    - effect_id: outcome
      effect_class: intended_effect
      description: Identify the actual blocking condition and its state in the capture. Selecting an arbitrary
        alarm from the legend does not count.
      target_refs: *id006
      evidence_refs:
      - evidence_requirements.t04.c2
    - effect_id: verified-evidence
      effect_class: evidence_effect
      description: |-
        The player submits the sample ID, controller revision, blocking condition, and
        its state. The score verifies that tuple against the practice trace and makes
        the condition visible for T04.3.
      target_refs: *id002
      evidence_refs:
      - evidence_requirements.t04.c2
    failure_classes:
    - precondition_unsatisfied
    - authority_denied
    - target_unavailable
    - partial_success
    - backend_error
    - unknown
  c3:
    semantic_version: 1.0.0
    lifecycle_state: draft
    behavioral_granularity: aggregate
    procedure_basis: |-
      This is a safe control-verification task, not an authorization bypass. The
      intended solution is to clear the condition learned in T04.2 through the normal
      practice workflow, request the specified bounded transfer, and validate the
      result against observations.
    realization_profile: backend-declared
    fidelity_claim: The authored mechanism, normal behavior, proof, authority limits, and reset requirements
      are required. Hosting and their implementation remain backend-declared.
    preconditions:
    - precondition_id: eligibility
      precondition_class: authority
      description: Satisfy one complete alternative in the referenced workflow and obtain the required
        scoped access to every listed surface.
      support_refs:
      - workflows.t04.c3
      - features.training.t-state
    - precondition_id: normal-surface
      precondition_class: target
      description: |-
        The training HMI drives a deterministic isolated tank-and-outlet practice model.
        It exposes a documented request interface, operating bounds, accepted/rejected
        command record, and independently published tank observations.
      support_refs: *id007
    - precondition_id: boundaries-and-reset
      precondition_class: realization
      description: |-
        These are requirements on the realized environment. Apply reset behavior only when a participant reset is requested, not on challenge completion.

        The practice model is per-player, has fixed water and movement bounds, and
        cannot reach any campaign control state. Reset restores the initial tank volume,
        mode, and trace history.
      support_refs:
      - features.training.t-state
    effects:
    - effect_id: outcome
      effect_class: intended_effect
      description: Demonstrate the requested transfer and final outlet state within the published bounds.
        An accepted request alone is insufficient; no campaign authority is granted.
      target_refs: *id007
      evidence_refs:
      - evidence_requirements.t04.c3
    - effect_id: verified-evidence
      effect_class: evidence_effect
      description: |-
        Completion requires an accepted request, final outlet state, and matching
        before/after measurements showing the requested transfer within tolerance.
        Scoring consumes the independent practice transition rather than the request
        receipt alone.
      target_refs: *id003
      evidence_refs:
      - evidence_requirements.t04.c3
    failure_classes:
    - precondition_unsatisfied
    - authority_denied
    - target_unavailable
    - partial_success
    - backend_error
    - unknown
  c4:
    semantic_version: 1.0.0
    lifecycle_state: draft
    behavioral_granularity: aggregate
    procedure_basis: |-
      The reporting job correlates a stale accepted request with the latest test
      record, ignoring the later blocked transition. The intended solution is a
      timeline reconstruction from the supplied records; T04.3 is neither required
      nor sufficient because this card uses a separate attempt.
    realization_profile: backend-declared
    fidelity_claim: The authored mechanism, normal behavior, proof, authority limits, and reset requirements
      are required. Hosting and their implementation remain backend-declared.
    preconditions:
    - precondition_id: eligibility
      precondition_class: authority
      description: Satisfy one complete alternative in the referenced workflow and obtain the required
        scoped access to every listed surface.
      support_refs:
      - workflows.t04.c4
      - features.training.t-state
    - precondition_id: normal-surface
      precondition_class: target
      description: |-
        A training report records a green test outcome while the same attempt has an
        immutable controller request, HMI status capture, and independent observation
        trace. The report's author and generation timestamp are ordinary seeded data.
      support_refs: *id008
    - precondition_id: boundaries-and-reset
      precondition_class: realization
      description: |-
        These are requirements on the realized environment. Apply reset behavior only when a participant reset is requested, not on challenge completion.

        All records are read-only training evidence and the report cannot be edited.
        Reset removes player conclusions only; it does not rewrite the discrepancy.
      support_refs:
      - features.training.t-state
    effects:
    - effect_id: outcome
      effect_class: intended_effect
      description: Recover the current attempt's result and the evidence establishing the report's error.
        This separate replay does not reuse T04.3's result for another score.
      target_refs: *id008
      evidence_refs:
      - evidence_requirements.t04.c4
    - effect_id: verified-evidence
      effect_class: evidence_effect
      description: |-
        The completion record names the attempt, actual result, stale source record,
        and contradictory observation. The scorer validates their correlation IDs and
        timestamps, not a generic claim that the report is wrong.
      target_refs: *id004
      evidence_refs:
      - evidence_requirements.t04.c4
    failure_classes:
    - precondition_unsatisfied
    - authority_denied
    - target_unavailable
    - partial_success
    - backend_error
    - unknown
