realization:
  default: open
evidence_requirements:
  c1:
    description: |-
      Recover the measured volume bound to its sample and units. A target setting or unitless guess is insufficient.

      Required technical proof: Scoring accepts the observation's sample ID, measured value, and unit only when
      they match the current practice trace. It adds no control authority or mutable
      state.
    source_refs: &id001
    - features.training.t-state
    scope: Per-participant in-world evidence; no other participant state.
    boundary_kind: assertion_evaluation
    channel: other
    artifact_role: proposition_truth_evidence
    sensitivity: plain
    redaction: redact_secrets
    integrity: checksum
    retention: run_lifetime
    loss_disclosure: required
    observation_demand:
      rule_id: fact-t04-1
      scope: /features
      purpose: experimental
      mode: selected
      selector:
        semantic_scope: /features
        data_kind: artifact
        names:
        - cinder.t04-1.satisfied
        component_refs:
        - features.training.t-state
      collection: require
      retention: require
      redaction: redact-secrets
      integrity: checksum
      required: true
      basis: observed
    notes:
    - |-
      Author checks: Confirm requested and measured values visibly differ, the legend identifies
      units, a setpoint answer fails, the target observation resolves once, and a
      reset reproduces the trace.
  c2:
    description: |-
      Identify the actual blocking condition and its state in the capture. Selecting an arbitrary alarm from the legend does not count.

      Required technical proof: The player submits the sample ID, controller revision, blocking condition, and
      its state. The score verifies that tuple against the practice trace and makes
      the condition visible for T04.3.
    source_refs: &id002
    - features.training.t-state
    scope: Per-participant in-world evidence; no other participant state.
    boundary_kind: assertion_evaluation
    channel: other
    artifact_role: proposition_truth_evidence
    sensitivity: plain
    redaction: redact_secrets
    integrity: checksum
    retention: run_lifetime
    loss_disclosure: required
    observation_demand:
      rule_id: fact-t04-2
      scope: /features
      purpose: experimental
      mode: selected
      selector:
        semantic_scope: /features
        data_kind: artifact
        names:
        - cinder.t04-2.satisfied
        component_refs:
        - features.training.t-state
      collection: require
      retention: require
      redaction: redact-secrets
      integrity: checksum
      required: true
      basis: observed
    notes:
    - |-
      Author checks: Verify the correct legend is reachable, version mismatch leads to a distinct
      wrong interpretation, only one bit explains the observed block, arbitrary
      alarm selection fails, and the evidence tuple is retained.
  c3:
    description: |-
      Demonstrate the requested transfer and final outlet state within the published bounds. An accepted request alone is insufficient; no campaign authority is granted.

      Required technical proof: Completion requires an accepted request, final outlet state, and matching
      before/after measurements showing the requested transfer within tolerance.
      Scoring consumes the independent practice transition rather than the request
      receipt alone.
    source_refs: &id003
    - features.training.t-state
    scope: Per-participant in-world evidence; no other participant state.
    boundary_kind: assertion_evaluation
    channel: other
    artifact_role: proposition_truth_evidence
    sensitivity: plain
    redaction: redact_secrets
    integrity: checksum
    retention: run_lifetime
    loss_disclosure: required
    observation_demand:
      rule_id: fact-t04-3
      scope: /features
      purpose: experimental
      mode: selected
      selector:
        semantic_scope: /features
        data_kind: artifact
        names:
        - cinder.t04-3.satisfied
        component_refs:
        - features.training.t-state
      collection: require
      retention: require
      redaction: redact-secrets
      integrity: checksum
      required: true
      basis: observed
    notes:
    - |-
      Author checks: Test the block prevents movement, an in-range normal request succeeds, an
      out-of-range request is rejected, request-only evidence fails, the observation
      delta is correct, and reset returns the initial state.
  c4:
    description: |-
      Recover the current attempt's result and the evidence establishing the report's error. This separate replay does not reuse T04.3's result for another score.

      Required technical proof: The completion record names the attempt, actual result, stale source record,
      and contradictory observation. The scorer validates their correlation IDs and
      timestamps, not a generic claim that the report is wrong.
    source_refs: &id004
    - features.training.t-state
    scope: Per-participant in-world evidence; no other participant state.
    boundary_kind: assertion_evaluation
    channel: other
    artifact_role: proposition_truth_evidence
    sensitivity: plain
    redaction: redact_secrets
    integrity: checksum
    retention: run_lifetime
    loss_disclosure: required
    observation_demand:
      rule_id: fact-t04-4
      scope: /features
      purpose: experimental
      mode: selected
      selector:
        semantic_scope: /features
        data_kind: artifact
        names:
        - cinder.t04-4.satisfied
        component_refs:
        - features.training.t-state
      collection: require
      retention: require
      redaction: redact-secrets
      integrity: checksum
      required: true
      basis: observed
    notes:
    - |-
      Author checks: Verify report and trace initially disagree, identifiers make the stale join
      discoverable, the current attempt has a unique result, an unrelated trace fails,
      T04.3's event cannot score this card, and reset is deterministic.
propositions:
  c1:
    description: Recover the measured volume bound to its sample and units. A target setting or unitless
      guess is insufficient.
    subjects: *id001
    basis: observed_state
    predicate:
      kind: boolean
      property: cinder.t04-1.satisfied
      semantic_ref: urn:cinder-typhoon:fact:T04.1
      operator: equals
      expected: true
    evidence_requirements:
    - c1
    quantifier: all
  c2:
    description: Identify the actual blocking condition and its state in the capture. Selecting an arbitrary
      alarm from the legend does not count.
    subjects: *id002
    basis: observed_state
    predicate:
      kind: boolean
      property: cinder.t04-2.satisfied
      semantic_ref: urn:cinder-typhoon:fact:T04.2
      operator: equals
      expected: true
    evidence_requirements:
    - c2
    quantifier: all
  c3:
    description: Demonstrate the requested transfer and final outlet state within the published bounds.
      An accepted request alone is insufficient; no campaign authority is granted.
    subjects: *id003
    basis: observed_state
    predicate:
      kind: boolean
      property: cinder.t04-3.satisfied
      semantic_ref: urn:cinder-typhoon:fact:T04.3
      operator: equals
      expected: true
    evidence_requirements:
    - c3
    quantifier: all
  c4:
    description: Recover the current attempt's result and the evidence establishing the report's error.
      This separate replay does not reuse T04.3's result for another score.
    subjects: *id004
    basis: observed_state
    predicate:
      kind: boolean
      property: cinder.t04-4.satisfied
      semantic_ref: urn:cinder-typhoon:fact:T04.4
      operator: equals
      expected: true
    evidence_requirements:
    - c4
    quantifier: all
assertions:
  c1-ready:
    proposition: c1
    role: precondition
    polarity: positive
  c1-done:
    proposition: c1
    role: postcondition
    polarity: positive
  c2-ready:
    proposition: c2
    role: precondition
    polarity: positive
  c2-done:
    proposition: c2
    role: postcondition
    polarity: positive
  c3-ready:
    proposition: c3
    role: precondition
    polarity: positive
  c3-done:
    proposition: c3
    role: postcondition
    polarity: positive
  c4-ready:
    proposition: c4
    role: precondition
    polarity: positive
  c4-done:
    proposition: c4
    role: postcondition
    polarity: positive
objectives:
  c1:
    name: 'T04.1: Which value is real'
    description: |-
      Read the supplied training-tank observation and recover how much water it actually contains, distinguishing the measurement from the requested level.

      Establishes the difference between intention and observation.
    agent: participant.operator
    actions:
    - t04.c1
    targets: &id005
    - features.training.t-state
    success:
      mode: all_of
      assertions:
      - c1-done
    window:
      workflows:
      - t04.c1
  c2:
    name: 'T04.2: The light behind the number'
    description: |-
      Decode the supplied controller status capture and identify the condition preventing the practice outlet from moving.

      Connects a compact representation to a meaningful operating condition.
    agent: participant.operator
    actions:
    - t04.c2
    targets: &id006
    - features.training.t-state
    success:
      mode: all_of
      assertions:
      - c2-done
    window:
      workflows:
      - t04.c2
  c3:
    name: 'T04.3: A request is not a movement'
    description: |-
      Move the specified bounded amount of water through the training outlet and verify the transfer from the tank's observations.

      Connects commands and operating conditions to actual effect.
    agent: participant.operator
    actions:
    - t04.c3
    targets: &id007
    - features.training.t-state
    success:
      mode: all_of
      assertions:
      - c3-done
    window:
      workflows:
      - t04.c3
  c4:
    name: 'T04.4: Yesterday''s green light'
    description: |-
      The training report says the latest outlet test succeeded, but the observations disagree. Determine what actually happened during this attempt and explain the discrepancy through the supplied evidence.

      Ends training with a compact investigation into conflicting process claims.
    agent: participant.operator
    actions:
    - t04.c4
    targets: &id008
    - features.training.t-state
    success:
      mode: all_of
      assertions:
      - c4-done
    window:
      workflows:
      - t04.c4
workflows:
  c1:
    description: 'T04.1: availability follows the evidence/authority alternatives. This independent objective
      may be revisited when facts change; no campaign-wide sequence or deadline is imposed.'
    start: requirements
    steps:
      requirements:
        type: switch
        cases:
        - when:
            assertions:
            - participant.training-ready
          next: attempt
        default: unavailable
      available:
        type: end
      unavailable:
        type: end
      attempt:
        type: objective
        execution_mode: objective
        objective: t04.c1
        on_success: available
        on_failure: unavailable
