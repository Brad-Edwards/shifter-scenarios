realization:
  default: open
evidence_requirements:
  c1:
    description: 'Recover the measured volume bound to its sample and units. A target setting or unitless guess
      is insufficient.


      Required technical proof: The capture binds its measured volume to sample ID, engineering units,

      quality, and timestamp. The requested level is a separate field and is not

      substituted for the measurement.'
    source_refs:
    - features.training.t-state
    scope: Per-participant in-world evidence; no other participant state.
    boundary_kind: assertion_evaluation
    channel: other
    artifact_role: proposition_truth_evidence
    sensitivity: plain
    redaction: redact_secrets
    integrity: checksum
    retention: run_lifetime
    loss_disclosure: required
    observation_demand:
      rule_id: fact-t04-1
      scope: /features
      purpose: experimental
      mode: selected
      selector:
        semantic_scope: /features
        data_kind: artifact
        names:
        - cinder.t04-1.satisfied
        component_refs:
        - features.training.t-state
      collection: require
      retention: require
      redaction: redact-secrets
      integrity: checksum
      required: true
      basis: observed
    notes:
    - 'Author checks: Check that requested and measured quantities differ, units and quality are

      visible, the recorded sample is unique, and live practice cannot alter it.'
  c2:
    description: 'Identify the actual blocking condition and its state in the capture. Selecting an arbitrary alarm
      from the legend does not count.


      Required technical proof: The capture binds one status word to its sample ID and controller revision.

      The matching legend identifies the asserted blocking condition. Reading this

      record does not reveal, change, or authorize anything in the live practice

      application; that application already exposes its own status and legend.'
    source_refs:
    - features.training.t-state
    scope: Per-participant in-world evidence; no other participant state.
    boundary_kind: assertion_evaluation
    channel: other
    artifact_role: proposition_truth_evidence
    sensitivity: plain
    redaction: redact_secrets
    integrity: checksum
    retention: run_lifetime
    loss_disclosure: required
    observation_demand:
      rule_id: fact-t04-2
      scope: /features
      purpose: experimental
      mode: selected
      selector:
        semantic_scope: /features
        data_kind: artifact
        names:
        - cinder.t04-2.satisfied
        component_refs:
        - features.training.t-state
      collection: require
      retention: require
      redaction: redact-secrets
      integrity: checksum
      required: true
      basis: observed
    notes:
    - 'Author checks: Check that the revision-matched legend is present, exactly one asserted

      condition explains the recorded block, and the live application can be used

      independently without reading or submitting this task.'
  c3:
    description: 'Demonstrate the requested transfer and final outlet state within the published bounds. An accepted
      request alone is insufficient; no campaign authority is granted.


      Required technical proof: The request record, final outlet state, and independent before/after

      measurements identify the same transfer. The observed volume difference must

      match the requested amount within the documented tolerance. Request acceptance

      alone does not establish physical movement in the practice model.'
    source_refs:
    - features.training.t-state
    scope: Per-participant in-world evidence; no other participant state.
    boundary_kind: assertion_evaluation
    channel: other
    artifact_role: proposition_truth_evidence
    sensitivity: plain
    redaction: redact_secrets
    integrity: checksum
    retention: run_lifetime
    loss_disclosure: required
    observation_demand:
      rule_id: fact-t04-3
      scope: /features
      purpose: experimental
      mode: selected
      selector:
        semantic_scope: /features
        data_kind: artifact
        names:
        - cinder.t04-3.satisfied
        component_refs:
        - features.training.t-state
      collection: require
      retention: require
      redaction: redact-secrets
      integrity: checksum
      required: true
      basis: observed
    notes:
    - 'Author checks: Check blocked requests cause no movement, bounded transfers finish with the

      outlet closed, invalid requests cannot change volume, independent measurements

      show the exact delta, and a reconnect preserves the live tank and history.'
  c4:
    description: 'Recover the recorded attempt''s result and the evidence establishing the report''s error. This
      replay is independent of the live practice tank.


      Required technical proof: The retained records identify the current attempt, its actual outcome, the

      stale source used in the report, and contradictory measurements. Their

      correlation IDs and timestamps explain the discrepancy without depending on

      the current practice tank or any external grading state.'
    source_refs:
    - features.training.t-state
    scope: Per-participant in-world evidence; no other participant state.
    boundary_kind: assertion_evaluation
    channel: other
    artifact_role: proposition_truth_evidence
    sensitivity: plain
    redaction: redact_secrets
    integrity: checksum
    retention: run_lifetime
    loss_disclosure: required
    observation_demand:
      rule_id: fact-t04-4
      scope: /features
      purpose: experimental
      mode: selected
      selector:
        semantic_scope: /features
        data_kind: artifact
        names:
        - cinder.t04-4.satisfied
        component_refs:
        - features.training.t-state
      collection: require
      retention: require
      redaction: redact-secrets
      integrity: checksum
      required: true
      basis: observed
    notes:
    - 'Author checks: Check that the report and independent trace disagree, the stale join is

      unambiguous, the current attempt has a unique result, and practice requests

      cannot alter any replay record.'
propositions:
  c1:
    description: Recover the measured volume bound to its sample and units. A target setting or unitless guess is
      insufficient.
    subjects:
    - features.training.t-state
    basis: observed_state
    predicate:
      kind: boolean
      property: cinder.t04-1.satisfied
      semantic_ref: urn:cinder-typhoon:fact:T04.1
      operator: equals
      expected: true
    evidence_requirements:
    - c1
    quantifier: all
  c2:
    description: Identify the actual blocking condition and its state in the capture. Selecting an arbitrary alarm
      from the legend does not count.
    subjects:
    - features.training.t-state
    basis: observed_state
    predicate:
      kind: boolean
      property: cinder.t04-2.satisfied
      semantic_ref: urn:cinder-typhoon:fact:T04.2
      operator: equals
      expected: true
    evidence_requirements:
    - c2
    quantifier: all
  c3:
    description: Demonstrate the requested transfer and final outlet state within the published bounds. An accepted
      request alone is insufficient; no campaign authority is granted.
    subjects:
    - features.training.t-state
    basis: observed_state
    predicate:
      kind: boolean
      property: cinder.t04-3.satisfied
      semantic_ref: urn:cinder-typhoon:fact:T04.3
      operator: equals
      expected: true
    evidence_requirements:
    - c3
    quantifier: all
  c4:
    description: Recover the recorded attempt's result and the evidence establishing the report's error. This replay
      is independent of the live practice tank.
    subjects:
    - features.training.t-state
    basis: observed_state
    predicate:
      kind: boolean
      property: cinder.t04-4.satisfied
      semantic_ref: urn:cinder-typhoon:fact:T04.4
      operator: equals
      expected: true
    evidence_requirements:
    - c4
    quantifier: all
assertions:
  c1-ready:
    proposition: c1
    role: precondition
    polarity: positive
  c1-done:
    proposition: c1
    role: postcondition
    polarity: positive
  c2-ready:
    proposition: c2
    role: precondition
    polarity: positive
  c2-done:
    proposition: c2
    role: postcondition
    polarity: positive
  c3-ready:
    proposition: c3
    role: precondition
    polarity: positive
  c3-done:
    proposition: c3
    role: postcondition
    polarity: positive
  c4-ready:
    proposition: c4
    role: precondition
    polarity: positive
  c4-done:
    proposition: c4
    role: postcondition
    polarity: positive
objectives:
  c1:
    name: 'T04.1: Which value is real'
    description: 'Read the supplied training-tank observation and recover how much water it actually contains, distinguishing
      the measurement from the requested level.


      Establishes the difference between intention and observation.'
    agent: participant.operator
    actions:
    - t04.c1
    targets:
    - features.training.t-state
    success:
      mode: all_of
      assertions:
      - c1-done
    window:
      workflows:
      - t04.c1
  c2:
    name: 'T04.2: The light behind the number'
    description: 'Decode the supplied controller status capture and identify the condition preventing the practice
      outlet from moving.


      Connects a compact representation to a meaningful operating condition.'
    agent: participant.operator
    actions:
    - t04.c2
    targets:
    - features.training.t-state
    success:
      mode: all_of
      assertions:
      - c2-done
    window:
      workflows:
      - t04.c2
  c3:
    name: 'T04.3: A request is not a movement'
    description: 'Move the specified bounded amount of water through the training outlet and verify the transfer
      from the tank''s observations.


      Connects commands and operating conditions to actual effect.'
    agent: participant.operator
    actions:
    - t04.c3
    targets:
    - features.training.t-state
    success:
      mode: all_of
      assertions:
      - c3-done
    window:
      workflows:
      - t04.c3
  c4:
    name: 'T04.4: Yesterday''s green light'
    description: 'The training report says the latest outlet test succeeded, but the observations disagree. Determine
      what actually happened during this attempt and explain the discrepancy through the supplied evidence.


      Ends training with a compact investigation into conflicting process claims.'
    agent: participant.operator
    actions:
    - t04.c4
    targets:
    - features.training.t-state
    success:
      mode: all_of
      assertions:
      - c4-done
    window:
      workflows:
      - t04.c4
