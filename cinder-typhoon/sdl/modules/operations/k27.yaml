    quantifier: all
assertions:
  c1-ready:
    proposition: c1
    role: precondition
    polarity: positive
  c1-done:
    proposition: c1
    role: postcondition
    polarity: positive
  c2-ready:
    proposition: c2
    role: precondition
    polarity: positive
  c2-done:
    proposition: c2
    role: postcondition
    polarity: positive
  c3-ready:
    proposition: c3
    role: precondition
    polarity: positive
  c3-done:
    proposition: c3
    role: postcondition
    polarity: positive
objectives:
  c1:
    name: 'K27.1: A job for that customer'
    description: |-
      Bind a support diagnostic job to the active ARWC connector despite the support account's ordinary customer restrictions.

      Establishes the diagnostic route's customer-specific action.
    agent: participant.operator
    actions:
    - k27.c1
    targets: &id004
    - features.k-delivery.k-support
    success:
      mode: all_of
      assertions:
      - c1-done
    window:
      workflows:
      - k27.c1
  c2:
    name: 'K27.2: Our diagnostic, their interface'
    description: |-
      Alter the diagnostic package while preserving the interface the ARWC connector expects. Make the job accept the changed package for this customer.

      Produces a compatible payload for the support delivery route.
    agent: participant.operator
    actions:
    - k27.c2
    targets: &id005
    - features.k-delivery.k-support
    - features.k-delivery.k-registry
    success:
      mode: all_of
      assertions:
      - c2-done
    window:
      workflows:
      - k27.c2
  c3:
    name: 'K27.3: The other side of support'
    description: |-
      Deliver the changed diagnostic through the support workflow and demonstrate its execution inside ARWC's corporate connector.

      Provides the same earned customer transition as the package route.
    agent: participant.operator
    actions:
    - k27.c3
    targets: &id006
    - features.a-corporate.a-connector
    success:
      mode: all_of
      assertions:
      - c3-done
    window:
      workflows:
      - k27.c3
workflows:
  c1:
    description: 'K27.1: availability follows the evidence/authority alternatives. This independent objective
      may be revisited when facts change; no campaign-wide sequence or deadline is imposed.'
    start: requirements
    steps:
      requirements:
        type: switch
        cases:
        - when:
            assertions:
            - capabilities.b01-ready
            - capabilities.g02-ready
          next: attempt
        default: unavailable
      available:
        type: end
      unavailable:
        type: end
      attempt:
        type: objective
        execution_mode: objective
        objective: k27.c1
        on_success: available
        on_failure: unavailable
  c2:
    description: 'K27.2: availability follows the evidence/authority alternatives. This independent objective
      may be revisited when facts change; no campaign-wide sequence or deadline is imposed.'
    start: requirements
    steps:
      requirements:
        type: switch
        cases:
        - when:
            assertions:
            - capabilities.b02-ready
            - capabilities.g03-ready
          next: attempt
        default: unavailable
      available:
        type: end
      unavailable:
        type: end
      attempt:
        type: objective
        execution_mode: objective
        objective: k27.c2
        on_success: available
        on_failure: unavailable
  c3:
    description: 'K27.3: availability follows the evidence/authority alternatives. This independent objective
      may be revisited when facts change; no campaign-wide sequence or deadline is imposed.'
    start: requirements
    steps:
      requirements:
        type: switch
        cases:
        - when:
            assertions:
            - k27.c2-ready
          next: attempt
        default: unavailable
      available:
        type: end
      unavailable:
        type: end
      attempt:
        type: objective
        execution_mode: objective
        objective: k27.c3
        on_success: available
        on_failure: unavailable
