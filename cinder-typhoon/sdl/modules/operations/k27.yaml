assertions:
  c1-ready:
    proposition: c1
    role: precondition
    polarity: positive
  c1-done:
    proposition: c1
    role: postcondition
    polarity: positive
  c2-ready:
    proposition: c2
    role: precondition
    polarity: positive
  c2-done:
    proposition: c2
    role: postcondition
    polarity: positive
  c3-ready:
    proposition: c3
    role: precondition
    polarity: positive
  c3-done:
    proposition: c3
    role: postcondition
    polarity: positive
objectives:
  c1:
    name: 'K27.1: A job for that customer'
    description: |-
      Bind a support diagnostic job to the active ARWC connector despite the support account's ordinary customer restrictions.

      Establishes the diagnostic route's customer-specific action.
    agent: participant.operator
    actions:
    - k27.c1
    targets:
    - features.k-delivery.k-support
    success:
      mode: all_of
      assertions:
      - c1-done
    window:
      workflows:
      - k27.c1
  c2:
    name: 'K27.2: Our diagnostic, their interface'
    description: |-
      Alter the diagnostic package while preserving the interface the ARWC connector expects. Make the job accept the changed package for this customer.

      Produces a compatible payload for the support delivery route.
    agent: participant.operator
    actions:
    - k27.c2
    targets:
    - features.k-delivery.k-support
    - features.k-delivery.k-registry
    success:
      mode: all_of
      assertions:
      - c2-done
    window:
      workflows:
      - k27.c2
  c3:
    name: 'K27.3: The other side of support'
    description: |-
      Deliver the changed diagnostic through the support workflow and demonstrate its execution inside ARWC's corporate connector.

      Provides the same earned customer transition as the package route.
    agent: participant.operator
    actions:
    - k27.c3
    targets:
    - features.k-delivery.k-support
    - features.a-corporate.a-connector
    success:
      mode: all_of
      assertions:
      - c3-done
    window:
      workflows:
      - k27.c3
workflows:
  c1:
    description: 'K27.1: availability follows the evidence/authority alternatives. This independent objective may
      be revisited when facts change; no campaign-wide sequence or deadline is imposed.'
    start: requirements
    steps:
      requirements:
        type: switch
        cases:
        - when:
            assertions:
            - capabilities.b01-ready
            - capabilities.g02-ready
          next: attempt
        default: unavailable
      available:
        type: end
      unavailable:
        type: end
      attempt:
        type: objective
        execution_mode: objective
        objective: k27.c1
        on_success: available
        on_failure: unavailable
  c2:
    description: 'K27.2: availability follows the evidence/authority alternatives. This independent objective may
      be revisited when facts change; no campaign-wide sequence or deadline is imposed.'
    start: requirements
    steps:
      requirements:
        type: switch
        cases:
        - when:
            assertions:
            - capabilities.b02-ready
            - capabilities.g03-ready
          next: attempt
        default: unavailable
      available:
        type: end
      unavailable:
        type: end
      attempt:
        type: objective
        execution_mode: objective
        objective: k27.c2
        on_success: available
        on_failure: unavailable
  c3:
    description: 'K27.3: availability follows the evidence/authority alternatives. This independent objective may
      be revisited when facts change; no campaign-wide sequence or deadline is imposed.'
    start: requirements
    steps:
      requirements:
        type: switch
        cases:
        - when:
            assertions:
            - k27.c2-ready
          next: attempt
        default: unavailable
      available:
        type: end
      unavailable:
        type: end
      attempt:
        type: objective
        execution_mode: objective
        objective: k27.c3
        on_success: available
        on_failure: unavailable
action_contracts:
  c1:
    semantic_version: 1.0.0
    lifecycle_state: draft
    behavioral_granularity: aggregate
    procedure_basis: 'The intended path is limited to the authored software, data, configuration, identity, permission,
      or state described above. The participant must exercise that real condition through the declared service interface
      and produce this result: Unauthorized but correctly bound DIAG-ARWC-<participant> job; route checks support
      role but omits assigned-customer membership. Merely describing the condition, editing a local copy, or presenting
      a value obtained from another surface does not satisfy the contract.'
    realization_profile: backend-declared
    fidelity_claim: The exact starting state, service transition, denial cases, participant-state persistence, and
      independently owned evidence are required. Backend choices remain open only where they cannot change those
      facts.
    preconditions:
    - precondition_id: eligibility
      precondition_class: authority
      description: Satisfy one complete alternative in the referenced workflow and obtain the required scoped access
        to every listed surface.
      support_refs:
      - workflows.k27.c1
      - features.k-delivery.k-support
    - precondition_id: normal-surface
      precondition_class: target
      description: '`k-support` owns this part of the operation. Its starting state is exact: B01 session, G02 binding,
        job schema and active connector registration. The owning service uses the listener, route, identity, authorization,
        storage, and audit contract declared in the corresponding world module. Records that are not explicitly
        mutable remain immutable. The private service-loader contract `content.keplerops-k-support.k27-1-a-job-for-that-customer`
        freezes the request, denial, state-transition, evidence, and any exploit-critical implementation details.'
      support_refs:
      - features.k-delivery.k-support
      - content.keplerops-k-support.k27-1-a-job-for-that-customer
    - precondition_id: scope-and-persistence
      precondition_class: realization
      description: Supplies B02. Participant-created service state persists for the life of the participant world
        and ordinary retries do not erase it. The selected route cannot act on unrelated tenants, records, packages,
        identities, jobs, or services. Infrastructure recovery and submission adjudication are outside this in-world
        contract.
      support_refs:
      - features.k-delivery.k-support
    effects:
    - effect_id: outcome
      effect_class: intended_effect
      description: Create the correctly bound unauthorized diagnostic job. This supplies B02; changing a display
        name or choosing another tenant does not count.
      target_refs:
      - features.k-delivery.k-support
      evidence_refs:
      - evidence_requirements.k27.c1
    failure_classes:
    - precondition_unsatisfied
    - authority_denied
    - target_unavailable
    - partial_success
    - backend_error
    - unknown
  c2:
    semantic_version: 1.0.0
    lifecycle_state: draft
    behavioral_granularity: aggregate
    procedure_basis: 'The intended path is limited to the authored software, data, configuration, identity, permission,
      or state described above. The participant must exercise that real condition through the declared service interface
      and produce this result: Changed package accepted and bound to job/customer. Merely describing the condition,
