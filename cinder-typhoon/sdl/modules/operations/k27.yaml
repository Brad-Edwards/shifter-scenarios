realization:
  default: open
evidence_requirements:
  c1:
    description: Create the correctly bound unauthorized diagnostic job. This supplies B02; changing a
      display name or choosing another tenant does not count.
    source_refs: &id001
    - features.k-delivery.k-support
    scope: Per-participant in-world evidence; no other participant state.
    boundary_kind: assertion_evaluation
    channel: other
    artifact_role: proposition_truth_evidence
    sensitivity: plain
    redaction: redact_secrets
    integrity: checksum
    retention: run_lifetime
    loss_disclosure: required
    observation_demand:
      rule_id: fact-k27-1
      scope: /features
      purpose: experimental
      mode: selected
      selector:
        semantic_scope: /features
        data_kind: artifact
        names:
        - cinder.k27-1.satisfied
        component_refs:
        - features.k-delivery.k-support
      collection: require
      retention: require
      redaction: redact-secrets
      integrity: checksum
      required: true
      basis: observed
  c2:
    description: Demonstrate acceptance of the changed diagnostic package through the package-editing
      boundary. This supplies B03, not customer execution.
    source_refs: &id002
    - features.k-delivery.k-support
    - features.k-delivery.k-registry
    scope: Per-participant in-world evidence; no other participant state.
    boundary_kind: assertion_evaluation
    channel: other
    artifact_role: proposition_truth_evidence
    sensitivity: plain
    redaction: redact_secrets
    integrity: checksum
    retention: run_lifetime
    loss_disclosure: required
    observation_demand:
      rule_id: fact-k27-2
      scope: /features
      purpose: experimental
      mode: selected
      selector:
        semantic_scope: /features
        data_kind: artifact
        names:
        - cinder.k27-2.satisfied
        component_refs:
        - features.k-delivery.k-support
        - features.k-delivery.k-registry
      collection: require
      retention: require
      redaction: redact-secrets
      integrity: checksum
      required: true
      basis: observed
  c3:
    description: |-
      Demonstrate actual customer-side execution with the intended tenant and job binding. This supplies B04 and CORPORATE, equivalent in scope to A04.

      The conclusion pairs the submitted diagnostic job with the ARWC connector's actual changed output and customer identity. The familiar maintenance ticket appears in its customer context under ARWC's name. This route earns the same visible arrival as K26.2 through its own execution evidence; it does not require completing the package route.
    source_refs: &id003
    - features.a-corporate.a-connector
    scope: Per-participant in-world evidence; no other participant state.
    boundary_kind: assertion_evaluation
    channel: other
    artifact_role: proposition_truth_evidence
    sensitivity: plain
    redaction: redact_secrets
    integrity: checksum
    retention: run_lifetime
    loss_disclosure: required
    observation_demand:
      rule_id: fact-k27-3
      scope: /features
      purpose: experimental
      mode: selected
      selector:
        semantic_scope: /features
        data_kind: artifact
        names:
        - cinder.k27-3.satisfied
        component_refs:
        - features.a-corporate.a-connector
      collection: require
      retention: require
      redaction: redact-secrets
      integrity: checksum
      required: true
      basis: observed
