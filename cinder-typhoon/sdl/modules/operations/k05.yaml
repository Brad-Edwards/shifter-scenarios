action_contracts:
  c1:
    semantic_version: 1.0.0
    lifecycle_state: draft
    behavioral_granularity: aggregate
    procedure_basis: 'This is an orientation task: inspect the earned source and run the documented interface against
      the fixture consumer to identify the consumed package.'
    realization_profile: backend-declared
    fidelity_claim: The exact starting state, service transition, denial cases, participant-state persistence, and
      independently owned evidence are required. Backend choices remain open only where they cannot change those
      facts.
    preconditions:
    - precondition_id: eligibility
      precondition_class: authority
      description: Satisfy one complete alternative in the referenced workflow and obtain the required scoped access
        to every listed surface.
      support_refs:
      - workflows.k05.c1
      - features.k-delivery.k-registry
    - precondition_id: normal-surface
      precondition_class: target
      description: The FieldKest Gitea project documents the connector's package interface and supplies a fixture
        consumer with a valid example request.
      support_refs:
      - features.k-delivery.k-registry
      - content.keplerops-k-registry.k05-1-speak-the-package-s-language
    - precondition_id: scope-and-persistence
      precondition_class: realization
      description: Supplies G03 Participant-created service state persists for the life of the participant world
        and ordinary retries do not erase it. The action is limited to the exact records, identities, routes, and
        destination effects declared here; unrelated tenants and services remain denied. Infrastructure recovery
        and submission adjudication are outside this in-world contract.
      support_refs:
      - features.k-delivery.k-registry
      - content.keplerops-k-registry.k05-1-speak-the-package-s-language
    effects:
    - effect_id: outcome
      effect_class: intended_effect
      description: Identify the consumed package and exercise its expected interface. This supplies G03 without
        requiring the other K05 tasks.
      target_refs:
      - features.k-delivery.k-registry
      evidence_refs:
      - evidence_requirements.k05.c1
    - effect_id: verified-evidence
      effect_class: evidence_effect
      description: The consumer records a valid request, package name, resolved version range, and expected baseline
        result, awarding `G03`.
      target_refs:
      - features.k-delivery.k-registry
      evidence_refs:
      - evidence_requirements.k05.c1
    failure_classes:
    - precondition_unsatisfied
    - authority_denied
    - target_unavailable
    - partial_success
    - backend_error
    - unknown
  c2:
    semantic_version: 1.0.0
    lifecycle_state: draft
    behavioral_granularity: aggregate
    procedure_basis: Registry search suppresses yanked maintenance versions while its versioned release manifest
      remains normally recoverable through the named historical reference. The intended solution is revision-led
      recovery.
    realization_profile: backend-declared
    fidelity_claim: The exact starting state, service transition, denial cases, participant-state persistence, and
      independently owned evidence are required. Backend choices remain open only where they cannot change those
      facts.
    preconditions:
    - precondition_id: eligibility
      precondition_class: authority
      description: Satisfy one complete alternative in the referenced workflow and obtain the required scoped access
        to every listed surface.
      support_refs:
      - workflows.k05.c2
      - features.k-delivery.k-registry
    - precondition_id: normal-surface
      precondition_class: target
      description: The Forge release history and support case expose a visible gap in the current registry listing
        for an older FieldKest release.
      support_refs:
      - features.k-delivery.k-registry
      - content.keplerops-k-registry.k05-2-the-version-they-kept
    - precondition_id: scope-and-persistence
      precondition_class: realization
      description: Optional history; active 7.4.2 stays visibly distinct Participant-created service state persists
        for the life of the participant world and ordinary retries do not erase it. The action is limited to the
        exact records, identities, routes, and destination effects declared here; unrelated tenants and services
        remain denied. Infrastructure recovery and submission adjudication are outside this in-world contract.
      support_refs:
      - features.k-delivery.k-registry
      - content.keplerops-k-registry.k05-2-the-version-they-kept
    effects:
    - effect_id: outcome
      effect_class: intended_effect
      description: Recover the missing version record and note. It informs the package dispute but is not a hidden
        prerequisite for ordinary entry.
      target_refs:
      - features.k-delivery.k-registry
      evidence_refs:
      - evidence_requirements.k05.c2
    - effect_id: verified-evidence
      effect_class: evidence_effect
      description: Completion binds the retained version metadata and maintenance note to `FLK-6.9.8`; it grants
