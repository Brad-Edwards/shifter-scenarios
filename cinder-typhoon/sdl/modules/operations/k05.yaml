action_contracts:
  c1:
    semantic_version: 1.0.0
    lifecycle_state: draft
    behavioral_granularity: aggregate
    procedure_basis: 'This is an orientation task: inspect the earned source and run the documented interface
      against the fixture consumer to identify the consumed package.'
    realization_profile: backend-declared
    fidelity_claim: The authored mechanism, normal behavior, proof, authority limits, and reset requirements
      are required. Hosting and their implementation remain backend-declared.
    preconditions:
    - precondition_id: eligibility
      precondition_class: authority
      description: Satisfy one complete alternative in the referenced workflow and obtain the required
        scoped access to every listed surface.
      support_refs:
      - workflows.k05.c1
      - features.k-delivery.k-registry
    - precondition_id: normal-surface
      precondition_class: target
      description: The FieldKest Gitea project documents the connector's package interface and supplies
        a fixture consumer with a valid example request.
      support_refs: *id005
    - precondition_id: boundaries-and-reset
      precondition_class: realization
      description: |-
        These are requirements on the realized environment. Apply reset behavior only when a participant reset is requested, not on challenge completion.

        The fixture consumer is player-local, read-only outside its request log, and cannot publish or contact ARWC; reset clears requests.
      support_refs:
      - features.k-delivery.k-registry
    effects:
    - effect_id: outcome
      effect_class: intended_effect
      description: Identify the consumed package and exercise its expected interface. This supplies G03
        without requiring the other K05 challenges.
      target_refs: *id005
      evidence_refs:
      - evidence_requirements.k05.c1
    - effect_id: verified-evidence
      effect_class: evidence_effect
      description: The consumer records a valid request, package name, resolved version range, and expected
        baseline result, awarding `G03`.
      target_refs: *id001
      evidence_refs:
      - evidence_requirements.k05.c1
    failure_classes:
    - precondition_unsatisfied
    - authority_denied
    - target_unavailable
    - partial_success
    - backend_error
    - unknown
  c2:
    semantic_version: 1.0.0
    lifecycle_state: draft
    behavioral_granularity: aggregate
    procedure_basis: Registry search suppresses yanked maintenance versions while its versioned release
      manifest remains normally recoverable through the named historical reference. The intended solution
      is revision-led recovery.
    realization_profile: backend-declared
    fidelity_claim: The authored mechanism, normal behavior, proof, authority limits, and reset requirements
      are required. Hosting and their implementation remain backend-declared.
    preconditions:
    - precondition_id: eligibility
      precondition_class: authority
      description: Satisfy one complete alternative in the referenced workflow and obtain the required
        scoped access to every listed surface.
      support_refs:
      - workflows.k05.c2
      - features.k-delivery.k-registry
    - precondition_id: normal-surface
      precondition_class: target
      description: The Forge release history and support case expose a visible gap in the current registry
        listing for an older FieldKest release.
      support_refs: *id006
    - precondition_id: boundaries-and-reset
      precondition_class: realization
      description: |-
        These are requirements on the realized environment. Apply reset behavior only when a participant reset is requested, not on challenge completion.

        Historical records are read-only and distinguishable from `FLK-7.4.2`; reset clears player evidence.
      support_refs:
      - features.k-delivery.k-registry
    effects:
    - effect_id: outcome
      effect_class: intended_effect
      description: Recover the missing version record and note. It informs the package dispute but is
        not a hidden prerequisite for ordinary entry.
      target_refs: *id006
      evidence_refs:
      - evidence_requirements.k05.c2
    - effect_id: verified-evidence
      effect_class: evidence_effect
      description: Completion binds the retained version metadata and maintenance note to `FLK-6.9.8`;
        it grants context only.
      target_refs: *id002
      evidence_refs:
      - evidence_requirements.k05.c2
    failure_classes:
    - precondition_unsatisfied
    - authority_denied
    - target_unavailable
    - partial_success
    - backend_error
    - unknown
  c3:
    semantic_version: 1.0.0
    lifecycle_state: draft
    behavioral_granularity: aggregate
    procedure_basis: This is a structured reconciliation task. The intended solution joins the two authoritative
      records and identifies the exact dependency discrepancy, excluding stale tenant and package values.
    realization_profile: backend-declared
    fidelity_claim: The authored mechanism, normal behavior, proof, authority limits, and reset requirements
      are required. Hosting and their implementation remain backend-declared.
    preconditions:
    - precondition_id: eligibility
      precondition_class: authority
      description: Satisfy one complete alternative in the referenced workflow and obtain the required
        scoped access to every listed surface.
      support_refs:
      - workflows.k05.c3
      - features.k-delivery.k-registry
    - precondition_id: normal-surface
      precondition_class: target
      description: The release manifest and active tenant record each declare package, version, consumer
        revision, timestamp, and provenance for `TEN-ARWC-047`.
      support_refs: *id007
    - precondition_id: boundaries-and-reset
      precondition_class: realization
      description: |-
        These are requirements on the realized environment. Apply reset behavior only when a participant reset is requested, not on challenge completion.

        Records cannot be edited and the comparison runs against a fixed synthetic dataset; reset removes only player evidence.
      support_refs:
      - features.k-delivery.k-registry
    effects:
    - effect_id: outcome
      effect_class: intended_effect
      description: Produce a correctly bound comparison of package, version, and consumer revision. It
        must identify the actual disagreement, not just differing text.
      target_refs: *id007
      evidence_refs:
      - evidence_requirements.k05.c3
    - effect_id: verified-evidence
      effect_class: evidence_effect
      description: The scorer verifies a four-field comparison with both record IDs and makes the discrepancy
        available to K05.4.
      target_refs: *id003
      evidence_refs:
      - evidence_requirements.k05.c3
    failure_classes:
    - precondition_unsatisfied
    - authority_denied
    - target_unavailable
    - partial_success
    - backend_error
    - unknown
  c4:
    semantic_version: 1.0.0
    lifecycle_state: draft
    behavioral_granularity: aggregate
    procedure_basis: The release label is deliberately not authoritative. The intended solution is controlled
      behavioral validation of the reconciliation result through the consumer, not a guess from package
      names.
    realization_profile: backend-declared
    fidelity_claim: The authored mechanism, normal behavior, proof, authority limits, and reset requirements
      are required. Hosting and their implementation remain backend-declared.
    preconditions:
    - precondition_id: eligibility
      precondition_class: authority
      description: Satisfy one complete alternative in the referenced workflow and obtain the required
        scoped access to every listed surface.
      support_refs:
      - workflows.k05.c4
      - features.k-delivery.k-registry
    - precondition_id: normal-surface
      precondition_class: target
      description: The isolated check consumer resolves the candidate dependencies using its real lock
        and range policy and emits a fresh resolution report.
      support_refs: *id008
    - precondition_id: boundaries-and-reset
      precondition_class: realization
      description: |-
        These are requirements on the realized environment. Apply reset behavior only when a participant reset is requested, not on challenge completion.

        The consumer is player-scoped and has no customer delivery identity; reset restores its lock and report history.
      support_refs:
      - features.k-delivery.k-registry
    effects:
    - effect_id: outcome
      effect_class: intended_effect
      description: Make the intended check consumer identify its selected dependency through a fresh result.
        This is optional selection intelligence; K26 retains its own production delivery problem.
      target_refs: *id008
      evidence_refs:
      - evidence_requirements.k05.c4
    - effect_id: verified-evidence
      effect_class: evidence_effect
      description: The report binds resolved dependency, candidate set, consumer revision, and result
        digest; it is optional intelligence only.
      target_refs: *id004
      evidence_refs:
      - evidence_requirements.k05.c4
    failure_classes:
    - precondition_unsatisfied
    - authority_denied
    - target_unavailable
    - partial_success
    - backend_error
    - unknown
