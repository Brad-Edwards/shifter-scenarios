# In-world draft. Unspecified realization remains open.
name: cinder-k05
version: 0.1.0
semantic_revision: raes-progressive-semantics/v1
module:
  id: cinder-typhoon/k05
  version: 0.1.0
  exports:
    evidence_requirements:
    - c1
    - c2
    - c3
    - c4
    propositions:
    - c1
    - c2
    - c3
    - c4
    assertions:
    - c1-ready
    - c1-done
    - c2-ready
    - c2-done
    - c3-ready
    - c3-done
    - c4-ready
    - c4-done
    objectives:
    - c1
    - c2
    - c3
    - c4
    workflows:
    - c1
    - c2
    - c3
    - c4
    action_contracts:
    - c1
    - c2
    - c3
    - c4
realization:
  default: open
evidence_requirements:
  c1:
    description: |-
      Identify the consumed package and exercise its expected interface. This supplies G03 without requiring the other K05 tasks.

      Required technical proof: The consumer records a valid request, package name, resolved version range, and expected baseline result, awarding `G03`.
    source_refs:
    - features.k-delivery.k-registry
    scope: Per-participant in-world evidence; no other participant state.
    boundary_kind: assertion_evaluation
    channel: other
    artifact_role: proposition_truth_evidence
    sensitivity: plain
    redaction: redact_secrets
    integrity: checksum
    retention: run_lifetime
    loss_disclosure: required
    observation_demand:
      rule_id: fact-k05-1
      scope: /features
      purpose: experimental
      mode: selected
      selector:
        semantic_scope: /features
        data_kind: artifact
        names:
        - cinder.k05-1.satisfied
        component_refs:
        - features.k-delivery.k-registry
      collection: require
      retention: require
      redaction: redact-secrets
      integrity: checksum
      required: true
      basis: observed
    notes:
    - 'Author checks: Test documented example success, malformed interface failure, correct package/version recording,
      no registry authority.'
  c2:
    description: |-
      Recover the missing version record and note. It informs the package dispute but is not a hidden prerequisite for ordinary entry.

      Required technical proof: Completion binds the retained version metadata and maintenance note to `FLK-6.9.8`; it grants context only.
    source_refs:
    - features.k-delivery.k-registry
    scope: Per-participant in-world evidence; no other participant state.
    boundary_kind: assertion_evaluation
    channel: other
    artifact_role: proposition_truth_evidence
    sensitivity: plain
    redaction: redact_secrets
    integrity: checksum
    retention: run_lifetime
    loss_disclosure: required
    observation_demand:
      rule_id: fact-k05-2
      scope: /features
      purpose: experimental
      mode: selected
      selector:
        semantic_scope: /features
        data_kind: artifact
        names:
        - cinder.k05-2.satisfied
        component_refs:
        - features.k-delivery.k-registry
      collection: require
      retention: require
      redaction: redact-secrets
      integrity: checksum
      required: true
      basis: observed
    notes:
    - 'Author checks: Verify current listing omits the version, ticket/release history gives a lead, one record
      resolves, active and obsolete revisions differ visibly, and no authority results.'
  c3:
    description: |-
      Produce a correctly bound comparison of package, version, and consumer revision. It must identify the actual disagreement, not just differing text.

      Required technical proof: The scorer verifies a four-field comparison with both record IDs and makes the discrepancy available to K05.4.
    source_refs:
    - features.k-delivery.k-registry
    scope: Per-participant in-world evidence; no other participant state.
    boundary_kind: assertion_evaluation
    channel: other
    artifact_role: proposition_truth_evidence
    sensitivity: plain
    redaction: redact_secrets
    integrity: checksum
    retention: run_lifetime
    loss_disclosure: required
    observation_demand:
      rule_id: fact-k05-3
      scope: /features
      purpose: experimental
      mode: selected
      selector:
        semantic_scope: /features
        data_kind: artifact
        names:
        - cinder.k05-3.satisfied
        component_refs:
        - features.k-delivery.k-registry
      collection: require
      retention: require
      redaction: redact-secrets
      integrity: checksum
      required: true
      basis: observed
    notes:
    - 'Author checks: Test clear active/obsolete labeling, a unique discrepancy, rejection of text-only comparison,
      correct provenance references.'
  c4:
    description: |-
      Make the intended check consumer identify its selected dependency through a fresh result. This is optional selection intelligence; K26 retains its own production delivery problem.

      Required technical proof: The report binds resolved dependency, candidate set, consumer revision, and result digest; it is optional intelligence only.
    source_refs:
    - features.k-delivery.k-registry
    scope: Per-participant in-world evidence; no other participant state.
    boundary_kind: assertion_evaluation
    channel: other
    artifact_role: proposition_truth_evidence
    sensitivity: plain
    redaction: redact_secrets
    integrity: checksum
    retention: run_lifetime
    loss_disclosure: required
    observation_demand:
      rule_id: fact-k05-4
      scope: /features
      purpose: experimental
      mode: selected
      selector:
        semantic_scope: /features
        data_kind: artifact
        names:
        - cinder.k05-4.satisfied
        component_refs:
        - features.k-delivery.k-registry
      collection: require
      retention: require
      redaction: redact-secrets
      integrity: checksum
      required: true
      basis: observed
    notes:
    - 'Author checks: Verify labels can disagree with resolution, intended candidate is selected, incompatible candidates
      fail, a fresh receipt is required.'
propositions:
  c1:
    description: Identify the consumed package and exercise its expected interface. This supplies G03 without requiring
      the other K05 tasks.
    subjects:
    - features.k-delivery.k-registry
    basis: observed_state
    predicate:
      kind: boolean
      property: cinder.k05-1.satisfied
      semantic_ref: urn:cinder-typhoon:fact:K05.1
      operator: equals
      expected: true
    evidence_requirements:
    - c1
    quantifier: all
  c2:
    description: Recover the missing version record and note. It informs the package dispute but is not a hidden
      prerequisite for ordinary entry.
    subjects:
    - features.k-delivery.k-registry
    basis: observed_state
    predicate:
      kind: boolean
      property: cinder.k05-2.satisfied
      semantic_ref: urn:cinder-typhoon:fact:K05.2
      operator: equals
      expected: true
    evidence_requirements:
    - c2
    quantifier: all
  c3:
    description: Produce a correctly bound comparison of package, version, and consumer revision. It must identify
      the actual disagreement, not just differing text.
    subjects:
    - features.k-delivery.k-registry
    basis: observed_state
    predicate:
      kind: boolean
      property: cinder.k05-3.satisfied
      semantic_ref: urn:cinder-typhoon:fact:K05.3
      operator: equals
      expected: true
    evidence_requirements:
    - c3
    quantifier: all
  c4:
    description: Make the intended check consumer identify its selected dependency through a fresh result. This
      is optional selection intelligence; K26 retains its own production delivery problem.
    subjects:
    - features.k-delivery.k-registry
    basis: observed_state
    predicate:
      kind: boolean
      property: cinder.k05-4.satisfied
      semantic_ref: urn:cinder-typhoon:fact:K05.4
      operator: equals
      expected: true
    evidence_requirements:
    - c4
    quantifier: all
assertions:
  c1-ready:
    proposition: c1
    role: precondition
    polarity: positive
  c1-done:
    proposition: c1
    role: postcondition
    polarity: positive
  c2-ready:
    proposition: c2
    role: precondition
    polarity: positive
  c2-done:
    proposition: c2
    role: postcondition
    polarity: positive
  c3-ready:
    proposition: c3
    role: precondition
    polarity: positive
  c3-done:
    proposition: c3
    role: postcondition
    polarity: positive
  c4-ready:
    proposition: c4
    role: precondition
    polarity: positive
  c4-done:
    proposition: c4
    role: postcondition
    polarity: positive
objectives:
  c1:
    name: 'K05.1: Speak the package''s language'
    description: |-
      Find the package interface used by the ARWC connector and make its documented example produce a valid result.

      Establishes the package contract needed by either ordinary delivery route.
    agent: participant.operator
    actions:
    - k05.c1
    targets:
    - features.k-delivery.k-registry
    success:
      mode: all_of
      assertions:
      - c1-done
    window:
      workflows:
      - k05.c1
  c2:
    name: 'K05.2: The version they kept'
    description: |-
      The visible package listing skips an older release mentioned in the support ticket. Recover the retained version record and its maintenance note.

      Adds product history with its own information payoff.
    agent: participant.operator
    actions:
    - k05.c2
    targets:
    - features.k-delivery.k-registry
    success:
      mode: all_of
      assertions:
      - c2-done
    window:
      workflows:
      - k05.c2
  c3:
    name: 'K05.3: Two manifests disagree'
    description: |-
      The release manifest and the customer's recorded selection do not describe the same dependency. Reconcile the two and recover the exact discrepancy.

      Turns release metadata into an operationally useful finding.
    agent: participant.operator
    actions:
    - k05.c3
    targets:
    - features.k-delivery.k-registry
    success:
      mode: all_of
      assertions:
      - c3-done
    window:
      workflows:
      - k05.c3
  c4:
    name: 'K05.4: Selection has consequences'
    description: |-
      Demonstrate which dependency the check consumer really chooses from the available candidates. The answer must come from consumed behavior, not the release label.

      Distinguishes publisher intention from consumer behavior.
    agent: participant.operator
    actions:
    - k05.c4
    targets:
    - features.k-delivery.k-registry
    success:
      mode: all_of
      assertions:
      - c4-done
    window:
      workflows:
      - k05.c4
workflows:
  c1:
    description: 'K05.1: availability follows the evidence/authority alternatives. This independent objective may
      be revisited when facts change; no campaign-wide sequence or deadline is imposed.'
    start: requirements
    steps:
      requirements:
        type: switch
        cases:
        - when:
            assertions:
            - capabilities.g01-ready
          next: attempt
        default: unavailable
      available:
        type: end
      unavailable:
        type: end
      attempt:
        type: objective
        execution_mode: objective
        objective: k05.c1
        on_success: available
        on_failure: unavailable
  c2:
    description: 'K05.2: availability follows the evidence/authority alternatives. This independent objective may
