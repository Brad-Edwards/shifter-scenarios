action_contracts:
  c1:
    semantic_version: 1.0.0
    lifecycle_state: draft
    behavioral_granularity: aggregate
    procedure_basis: Read the native package interface and supply the ordinary input schema through the documented
      consumer operation. The result must come from the real installed module rather than a release label or an
      edited local output.
    realization_profile: backend-declared
    fidelity_claim: The exact starting state, service transition, denial cases, participant-state persistence, and
      independently owned evidence are required. Backend choices remain open only where they cannot change those
      facts.
    preconditions:
    - precondition_id: eligibility
      precondition_class: authority
      description: Satisfy one complete alternative in the referenced workflow and obtain the required scoped access
        to every listed surface.
      support_refs:
      - workflows.k05.c1
      - features.k-delivery.k-registry
    - precondition_id: normal-surface
      precondition_class: target
      description: Verdaccio exposes the actual npm manifest and package tarball. The installed Node module exports
        consume(request), reads its package metadata and local limits file, and the separate FieldLink delivery
        application invokes it in the existing isolated worker.
      support_refs:
      - features.k-delivery.k-registry
      - content.keplerops-k-registry.k05-1-speak-the-package-s-language
    - precondition_id: scope-and-persistence
      precondition_class: realization
      description: Supplies G03 Participant-created service state persists for the life of the participant world
        and ordinary retries do not erase it. The action is limited to the exact records, identities, routes, and
        destination effects declared here; unrelated tenants and services remain denied. Infrastructure recovery
        and submission adjudication are outside this in-world contract.
      support_refs:
      - features.k-delivery.k-registry
      - content.keplerops-k-registry.k05-1-speak-the-package-s-language
    effects:
    - effect_id: outcome
      effect_class: intended_effect
      description: Identify the consumed package and exercise its expected interface. This supplies G03 without
        requiring the other K05 tasks.
      target_refs:
      - features.k-delivery.k-registry
      evidence_refs:
      - evidence_requirements.k05.c1
    - effect_id: verified-evidence
      effect_class: evidence_effect
      description: The fresh check result binds the actual package version and archive digest to the input tenant,
        asset, consumer revision and executed module output.
      target_refs:
      - features.k-delivery.k-registry
      evidence_refs:
      - evidence_requirements.k05.c1
    failure_classes:
    - precondition_unsatisfied
    - authority_denied
    - target_unavailable
    - partial_success
    - backend_error
    - unknown
  c2:
    semantic_version: 1.0.0
    lifecycle_state: draft
    behavioral_granularity: aggregate
    procedure_basis: Follow the ticket release identity, inspect the native historical package and correlate its
      deprecation notice with the customer maintenance record. A withdrawn customer rollout does not mean the package
      was removed from the native registry.
    realization_profile: backend-declared
    fidelity_claim: The exact starting state, service transition, denial cases, participant-state persistence, and
      independently owned evidence are required. Backend choices remain open only where they cannot change those
      facts.
    preconditions:
    - precondition_id: eligibility
      precondition_class: authority
      description: Satisfy one complete alternative in the referenced workflow and obtain the required scoped access
        to every listed surface.
      support_refs:
      - workflows.k05.c2
      - features.k-delivery.k-registry
    - precondition_id: normal-surface
      precondition_class: target
      description: The support conversation refers to the retained 6.9.8 customer release. Verdaccio still stores
        its actual native npm version with a genuine deprecation notice; the separate customer rollout record carries
        its retained maintenance and entitlement context.
      support_refs:
      - features.k-delivery.k-registry
      - content.keplerops-k-registry.k05-2-the-version-they-kept
    - precondition_id: scope-and-persistence
      precondition_class: realization
      description: Optional history; active 7.4.2 stays visibly distinct Participant-created service state persists
        for the life of the participant world and ordinary retries do not erase it. The action is limited to the
        exact records, identities, routes, and destination effects declared here; unrelated tenants and services
        remain denied. Infrastructure recovery and submission adjudication are outside this in-world contract.
      support_refs:
      - features.k-delivery.k-registry
      - content.keplerops-k-registry.k05-2-the-version-they-kept
    effects:
    - effect_id: outcome
      effect_class: intended_effect
      description: Recover the actual retained package version, native deprecation notice and matching customer
        maintenance record. Carry its entitlement context into the existing compatibility investigation.
      target_refs:
      - features.k-delivery.k-registry
      evidence_refs:
      - evidence_requirements.k05.c2
    - effect_id: verified-evidence
      effect_class: evidence_effect
      description: The native version/deprecation metadata, exact downloaded package and customer release record
        agree on package identity and version, and recover the maintenance context needed by the retained entitlement
        investigation.
      target_refs:
      - features.k-delivery.k-registry
      evidence_refs:
      - evidence_requirements.k05.c2
    failure_classes:
    - precondition_unsatisfied
    - authority_denied
    - target_unavailable
    - partial_success
    - backend_error
    - unknown
  c3:
    semantic_version: 1.0.0
    lifecycle_state: draft
    behavioral_granularity: aggregate
    procedure_basis: Join the independent records by customer, release and package identity, compare their declared
      ranges, selected versions and consumer revisions, then verify the actual package bytes. A label alone cannot
      establish what the customer record selected.
    realization_profile: backend-declared
    fidelity_claim: The exact starting state, service transition, denial cases, participant-state persistence, and
      independently owned evidence are required. Backend choices remain open only where they cannot change those
      facts.
    preconditions:
    - precondition_id: eligibility
      precondition_class: authority
      description: Satisfy one complete alternative in the referenced workflow and obtain the required scoped access
        to every listed surface.
      support_refs:
      - workflows.k05.c3
      - features.k-delivery.k-registry
    - precondition_id: normal-surface
      precondition_class: target
      description: The FieldLink delivery application retains independent release and tenant package records. Verdaccio
        supplies the real package manifest and tarball; the normal reconciliation operation compares the business
        records without impersonating registry storage.
      support_refs:
      - features.k-delivery.k-registry
      - content.keplerops-k-registry.k05-3-two-manifests-disagree
    - precondition_id: scope-and-persistence
      precondition_class: realization
      description: Input to K05.4 Participant-created service state persists for the life of the participant world
        and ordinary retries do not erase it. The action is limited to the exact records, identities, routes, and
        destination effects declared here; unrelated tenants and services remain denied. Infrastructure recovery
        and submission adjudication are outside this in-world contract.
      support_refs:
      - features.k-delivery.k-registry
      - content.keplerops-k-registry.k05-3-two-manifests-disagree
    effects:
    - effect_id: outcome
      effect_class: intended_effect
      description: Produce a correctly bound comparison of package, version, and consumer revision. It must identify
        the actual disagreement, not just differing text.
      target_refs:
      - features.k-delivery.k-registry
      evidence_refs:
      - evidence_requirements.k05.c3
    - effect_id: verified-evidence
      effect_class: evidence_effect
      description: The comparison identifies the selected-version disagreement and matching consumer revision, bound
        to both business record IDs and the native package archive digest.
      target_refs:
      - features.k-delivery.k-registry
      evidence_refs:
      - evidence_requirements.k05.c3
    failure_classes:
    - precondition_unsatisfied
    - authority_denied
    - target_unavailable
    - partial_success
    - backend_error
    - unknown
  c4:
    semantic_version: 1.0.0
    lifecycle_state: draft
    behavioral_granularity: aggregate
    procedure_basis: Relate standard npm version-selection rules to the available native versions, then confirm
      the selected archive and module behavior with the normal consumer. Compare the module output and archive integrity
      with the reconciliation evidence.
    realization_profile: backend-declared
    fidelity_claim: The exact starting state, service transition, denial cases, participant-state persistence, and
      independently owned evidence are required. Backend choices remain open only where they cannot change those
      facts.
    preconditions:
    - precondition_id: eligibility
      precondition_class: authority
      description: Satisfy one complete alternative in the referenced workflow and obtain the required scoped access
        to every listed surface.
      support_refs:
      - workflows.k05.c4
      - features.k-delivery.k-registry
    - precondition_id: normal-surface
      precondition_class: target
      description: Native npm selects a real published package for the declared range. The isolated FieldLink check
        installs its actual tarball offline, loads the module and ordinary local files, and returns the resulting
        package version and behavior.
      support_refs:
      - features.k-delivery.k-registry
      - content.keplerops-k-registry.k05-4-selection-has-consequences
    - precondition_id: scope-and-persistence
      precondition_class: realization
      description: Optional selection intelligence Participant-created service state persists for the life of the
        participant world and ordinary retries do not erase it. The action is limited to the exact records, identities,
        routes, and destination effects declared here; unrelated tenants and services remain denied. Infrastructure
        recovery and submission adjudication are outside this in-world contract.
      support_refs:
      - features.k-delivery.k-registry
      - content.keplerops-k-registry.k05-4-selection-has-consequences
    effects:
    - effect_id: outcome
      effect_class: intended_effect
      description: Make the intended check consumer identify its selected dependency through a fresh result. This
        is optional selection intelligence; K26 retains its own production delivery problem.
      target_refs:
      - features.k-delivery.k-registry
      evidence_refs:
      - evidence_requirements.k05.c4
    - effect_id: verified-evidence
      effect_class: evidence_effect
      description: The native npm selection, exact archive digest, installed module version, preserved request bindings
        and actual consumer output identify the dependency that ran.
      target_refs:
      - features.k-delivery.k-registry
      evidence_refs:
      - evidence_requirements.k05.c4
    failure_classes:
    - precondition_unsatisfied
    - authority_denied
    - target_unavailable
    - partial_success
    - backend_error
    - unknown
