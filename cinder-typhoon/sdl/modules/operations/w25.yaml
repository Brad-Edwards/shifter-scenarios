      Required technical proof: Completion compares the participant's observation with fresh product records captured by OpenPLC and the native historian. Product evidence is supplied by the range, never by the participant. W25.1 and W25.2 are read-only. W25.3 and W25.4 may use only the two authorized FUXA requests in CRR-OP-W25-R1, and completion cannot write a tag, issue a command, retry a rejection, or create product evidence.

      Evidence sources are `features.a-engineering.a-hmi`, `features.a-engineering.a-engineering`. A wrong asset, operating limit, command sequence, ownership, permissive, product time, process quality, measured response, or restored baseline is rejected.
    source_refs:
    - features.a-engineering.a-hmi
    - features.a-engineering.a-engineering
    scope: Per-participant in-world evidence; no other participant state.
    boundary_kind: assertion_evaluation
    channel: other
    artifact_role: proposition_truth_evidence
    sensitivity: plain
    redaction: redact_secrets
    integrity: checksum
    retention: run_lifetime
    loss_disclosure: required
    observation_demand:
      rule_id: fact-w25-1
      scope: /features
      purpose: experimental
      mode: selected
      selector:
        semantic_scope: /features
        data_kind: artifact
        names:
        - cinder.w25-1.satisfied
        component_refs:
        - features.a-engineering.a-hmi
        - features.a-engineering.a-engineering
      collection: require
      retention: require
      redaction: redact-secrets
      integrity: checksum
      required: true
      basis: observed
    notes:
    - 'Author checks: Verify the healthy baseline through the participant workstation. Confirm the two read-only
      cards against the installed project and live HMI, then execute the exact bounded movement through FUXA. Require
      product-owned accepted-sequence, ownership, permissive, position, flow, quality, and restored-baseline evidence.
      Reject wrong or stale intervals, missing sources, participant-supplied product evidence, rejected requests,
      unsettled feedback, active faults, or failure to restore baseline. Reset must return the same qualified baseline
      without changing product identities or trust material.'
  c2:
    description: |-
      Identify the field-freshness, availability/selector, low-level, stop, fault, authorization, and per-outlet permissive conditions, then report their current live results and whether the authorized movement may proceed.

