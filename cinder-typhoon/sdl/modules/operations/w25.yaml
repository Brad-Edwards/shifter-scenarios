assertions:
  c1-ready:
    proposition: c1
    role: precondition
    polarity: positive
  c1-done:
    proposition: c1
    role: postcondition
    polarity: positive
  c2-ready:
    proposition: c2
    role: precondition
    polarity: positive
  c2-done:
    proposition: c2
    role: postcondition
    polarity: positive
  c3-ready:
    proposition: c3
    role: precondition
    polarity: positive
  c3-done:
    proposition: c3
    role: postcondition
    polarity: positive
  c4-ready:
    proposition: c4
    role: precondition
    polarity: positive
  c4-done:
    proposition: c4
    role: postcondition
    polarity: positive
objectives:
  c1:
    name: 'W25.1: The operating envelope'
    description: |-
      Recover the outlet's current operating envelope: the limits within which a release can occur.

      Establishes the bounded physical conditions for the water story.
    agent: participant.operator
    actions:
    - w25.c1
    targets: &id005
    - features.a-engineering.a-hmi
    success:
      mode: all_of
      assertions:
      - c1-done
    window:
      workflows:
      - w25.c1
  c2:
    name: 'W25.2: Conditions before movement'
    description: |-
      Recover the control-permissive record and identify the condition withholding movement in the supplied practice state.

      Adds control-condition evidence beyond W17's general mode record.
    agent: participant.operator
    actions:
    - w25.c2
    targets: &id006
    - features.a-engineering.a-hmi
    success:
      mode: all_of
      assertions:
      - c2-done
    window:
      workflows:
      - w25.c2
  c3:
    name: 'W25.3: Accepted is not actuated'
    description: |-
      Resolve why the supplied practice requests receive acknowledgements without producing the expected outlet movement.

      Makes command feedback accountable to process observations.
    agent: participant.operator
    actions:
    - w25.c3
    targets: &id007
    - features.a-engineering.a-hmi
    success:
      mode: all_of
      assertions:
      - c3-done
    window:
      workflows:
      - w25.c3
  c4:
    name: 'W25.4: A sequence the process can follow'
    description: |-
      Construct a valid practice sequence that respects the operating envelope and produces the specified bounded movement.

      Completes the knowledge needed to distinguish a valid command plan from an unsafe guess.
    agent: participant.operator
    actions:
    - w25.c4
    targets: &id008
    - features.a-engineering.a-hmi
    - features.a-control.a-instruments
    success:
      mode: all_of
      assertions:
      - c4-done
    window:
      workflows:
      - w25.c4
workflows:
  c1:
    description: 'W25.1: availability follows the evidence/authority alternatives. This independent objective
      may be revisited when facts change; no campaign-wide sequence or deadline is imposed.'
    start: requirements
    steps:
      requirements:
        type: switch
        cases:
        - when:
            assertions:
            - capabilities.ot-read-ready
          next: attempt
        default: unavailable
      available:
        type: end
      unavailable:
        type: end
      attempt:
        type: objective
        execution_mode: objective
        objective: w25.c1
        on_success: available
        on_failure: unavailable
  c2:
    description: 'W25.2: availability follows the evidence/authority alternatives. This independent objective
      may be revisited when facts change; no campaign-wide sequence or deadline is imposed.'
    start: requirements
