    lifecycle_state: draft
    behavioral_granularity: aggregate
    procedure_basis: |-
      This card is an exact discovery, interpretation, or reconciliation task rather than an additional privilege flaw. Envelope ENV-OG2-R6 limits each gate to 0.50 m3/s, aggregate to 1.00 m3/s, ramp to 0.10 m3/s per 20 seconds, hold to 1200 seconds, and volume to 1.20 ML. The result must come from the declared source and bindings, not from a duplicate clue or pre-completed record.

      The required result is: Recover the actual channel, rate, and volume constraints with their applicable context. This supplies W25.ENVELOPE and ENVELOPE, not a release plan. Process quantities and state separation are governed by `arwc-process-model.md`, specifically `ENV-OG2-R6`, `PRACTICE-OG2-07`.
    realization_profile: backend-declared
    fidelity_claim: The exact initial state, versions, formats, validation order, authorization decisions, process
      quantities, denial cases, persistent state, and independently owned evidence are required. Implementation
      choices remain open only when none of those facts change.
