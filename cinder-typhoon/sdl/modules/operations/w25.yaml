      assertions:
      - c3-done
    window:
      workflows:
      - w25.c3
  c4:
    name: 'This action: A sequence the process can follow'
    description: Prove the bounded movement in native process history, then apply the authorized A20/B20 restoration
      and verify the live site has returned to baseline.
    assigned_participant: participant.operator
    actions:
    - w25.c4
    targets:
