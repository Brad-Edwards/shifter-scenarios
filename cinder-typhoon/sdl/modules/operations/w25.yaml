    description: Recover the actual channel, rate, and volume constraints with their applicable context.
      This supplies W25.ENVELOPE and ENVELOPE, not a release plan.
    subjects: *id001
    basis: observed_state
    predicate:
      kind: boolean
      property: cinder.w25-1.satisfied
      semantic_ref: urn:cinder-typhoon:fact:W25.1
      operator: equals
      expected: true
    evidence_requirements:
    - c1
    quantifier: all
  c2:
    description: Recover the separate permissive/interlock evidence and its practice-state binding. Repeating
