objectives:
  c1:
    name: 'This action: The operating envelope'
    description: Read the Cairn Reach operating instruction and reconcile its bounded movement with the limits shown
      by the installed HMI and controller project.
    assigned_participant: participant.operator
    actions:
    - w25.c1
    targets:
    - features.a-engineering.a-hmi
    - features.a-engineering.a-engineering
    success:
      mode: all_of
      assertions:
      - c1-done
    window:
      workflows:
      - w25.c1
  c2:
    name: 'This action: Conditions before movement'
    description: Use FUXA and the live OpenPLC project to explain whether the Cairn Reach outlets can move now and
      which conditions establish that result.
    assigned_participant: participant.operator
    actions:
    - w25.c2
    targets:
    - features.a-engineering.a-hmi
    - features.a-engineering.a-engineering
    success:
      mode: all_of
      assertions:
      - c2-done
    window:
      workflows:
      - w25.c2
  c3:
    name: 'This action: Accepted is not actuated'
    description: Apply the authorized A30/B10 manual request and distinguish the staged request, PLC decision, command
      owner, permissives, and measured outlet response.
    assigned_participant: participant.operator
    actions:
    - w25.c3
    targets:
    - features.a-engineering.a-hmi
    - features.a-engineering.a-historian
    - features.a-control.a-instruments
    success:
