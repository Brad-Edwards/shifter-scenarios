realization:
  default: open
evidence_requirements:
  c1:
    description: Recover the actual channel, rate, and volume constraints with their applicable context.
      This supplies W25.ENVELOPE and ENVELOPE, not a release plan.
    source_refs: &id001
    - features.a-engineering.a-hmi
    scope: Per-participant in-world evidence; no other participant state.
    boundary_kind: assertion_evaluation
    channel: other
    artifact_role: proposition_truth_evidence
    sensitivity: plain
    redaction: redact_secrets
    integrity: checksum
    retention: run_lifetime
    loss_disclosure: required
    observation_demand:
      rule_id: fact-w25-1
      scope: /features
      purpose: experimental
      mode: selected
      selector:
        semantic_scope: /features
        data_kind: artifact
        names:
        - cinder.w25-1.satisfied
        component_refs:
        - features.a-engineering.a-hmi
      collection: require
      retention: require
      redaction: redact-secrets
      integrity: checksum
      required: true
      basis: observed
  c2:
    description: Recover the separate permissive/interlock evidence and its practice-state binding. Repeating
      the current-mode label from W17 does not count.
    source_refs: &id002
    - features.a-engineering.a-hmi
    scope: Per-participant in-world evidence; no other participant state.
    boundary_kind: assertion_evaluation
    channel: other
    artifact_role: proposition_truth_evidence
    sensitivity: plain
    redaction: redact_secrets
    integrity: checksum
    retention: run_lifetime
    loss_disclosure: required
    observation_demand:
      rule_id: fact-w25-2
      scope: /features
      purpose: experimental
      mode: selected
      selector:
        semantic_scope: /features
        data_kind: artifact
        names:
        - cinder.w25-2.satisfied
        component_refs:
        - features.a-engineering.a-hmi
      collection: require
      retention: require
      redaction: redact-secrets
      integrity: checksum
      required: true
      basis: observed
  c3:
    description: Correctly relate the practice requests, permissives, and observed outcomes. An acknowledgement
      alone does not establish an actuation.
    source_refs: &id003
    - features.a-engineering.a-hmi
    scope: Per-participant in-world evidence; no other participant state.
    boundary_kind: assertion_evaluation
    channel: other
    artifact_role: proposition_truth_evidence
    sensitivity: plain
    redaction: redact_secrets
    integrity: checksum
    retention: run_lifetime
    loss_disclosure: required
    observation_demand:
      rule_id: fact-w25-3
      scope: /features
      purpose: experimental
      mode: selected
      selector:
        semantic_scope: /features
        data_kind: artifact
        names:
        - cinder.w25-3.satisfied
        component_refs:
        - features.a-engineering.a-hmi
      collection: require
      retention: require
      redaction: redact-secrets
      integrity: checksum
      required: true
      basis: observed
  c4:
    description: |-
      Demonstrate the intended practice effect under the correct conditions. This supplies W25.MODE and MODE; it does not grant live write authority.

      In the clearly identified practice model, the valid sequence produces visible outlet movement and a matching measured response, contrasting with the acknowledged but ineffective requests investigated earlier. The player has turned process understanding into controlled movement in rehearsal. The conclusion uses the existing bounded practice result; it requires no current outlet mapping or live client and does not change the real campaign's reserve.
    source_refs: &id004
    - features.a-engineering.a-hmi
    - features.a-control.a-instruments
    scope: Per-participant in-world evidence; no other participant state.
    boundary_kind: assertion_evaluation
    channel: other
    artifact_role: proposition_truth_evidence
    sensitivity: plain
    redaction: redact_secrets
    integrity: checksum
    retention: run_lifetime
    loss_disclosure: required
    observation_demand:
      rule_id: fact-w25-4
      scope: /features
      purpose: experimental
      mode: selected
      selector:
        semantic_scope: /features
        data_kind: artifact
        names:
        - cinder.w25-4.satisfied
        component_refs:
        - features.a-engineering.a-hmi
        - features.a-control.a-instruments
      collection: require
      retention: require
      redaction: redact-secrets
      integrity: checksum
      required: true
      basis: observed
propositions:
