realization:
  default: open
evidence_requirements:
  c1:
    description: Produce correct verifier results for the designated programs. Naming a general hash family
      or copying one checksum is insufficient.
    source_refs: &id001
    - features.a-engineering.a-engineering
    scope: Per-participant in-world evidence; no other participant state.
    boundary_kind: assertion_evaluation
    channel: other
    artifact_role: proposition_truth_evidence
    sensitivity: plain
    redaction: redact_secrets
    integrity: checksum
    retention: run_lifetime
    loss_disclosure: required
    observation_demand:
      rule_id: fact-w27-1
      scope: /features
      purpose: experimental
      mode: selected
      selector:
        semantic_scope: /features
        data_kind: artifact
        names:
        - cinder.w27-1.satisfied
        component_refs:
        - features.a-engineering.a-engineering
      collection: require
      retention: require
      redaction: redact-secrets
      integrity: checksum
      required: true
      basis: observed
  c2:
    description: Demonstrate the model on the specified distinguishing program cases. An unconstrained
      collision claim or checksum implementation alone does not count.
    source_refs: &id002
    - features.a-engineering.a-engineering
    scope: Per-participant in-world evidence; no other participant state.
    boundary_kind: assertion_evaluation
    channel: other
    artifact_role: proposition_truth_evidence
    sensitivity: plain
    redaction: redact_secrets
    integrity: checksum
    retention: run_lifetime
    loss_disclosure: required
    observation_demand:
      rule_id: fact-w27-2
      scope: /features
      purpose: experimental
      mode: selected
      selector:
        semantic_scope: /features
        data_kind: artifact
        names:
        - cinder.w27-2.satisfied
        component_refs:
        - features.a-engineering.a-engineering
      collection: require
      retention: require
      redaction: redact-secrets
      integrity: checksum
      required: true
      basis: observed
  c3:
    description: Demonstrate acceptance of the altered program and its false reserve result at the genuine
      planning consumer. The useful collision and accepted program earn one score. This supplies the same
      scoped W34 planning-view capability as W23.3, without altering raw process observations.
    source_refs: &id003
    - features.a-engineering.a-diagnostics
    scope: Per-participant in-world evidence; no other participant state.
    boundary_kind: assertion_evaluation
    channel: other
    artifact_role: proposition_truth_evidence
    sensitivity: plain
    redaction: redact_secrets
    integrity: checksum
    retention: run_lifetime
    loss_disclosure: required
    observation_demand:
      rule_id: fact-w27-3
      scope: /features
      purpose: experimental
      mode: selected
      selector:
        semantic_scope: /features
        data_kind: artifact
        names:
        - cinder.w27-3.satisfied
        component_refs:
        - features.a-engineering.a-diagnostics
      collection: require
      retention: require
      redaction: redact-secrets
      integrity: checksum
      required: true
      basis: observed
propositions:
  c1:
    description: Produce correct verifier results for the designated programs. Naming a general hash family
      or copying one checksum is insufficient.
    subjects: *id001
    basis: observed_state
    predicate:
      kind: boolean
      property: cinder.w27-1.satisfied
      semantic_ref: urn:cinder-typhoon:fact:W27.1
      operator: equals
      expected: true
    evidence_requirements:
    - c1
    quantifier: all
  c2:
    description: Demonstrate the model on the specified distinguishing program cases. An unconstrained
      collision claim or checksum implementation alone does not count.
    subjects: *id002
    basis: observed_state
    predicate:
      kind: boolean
      property: cinder.w27-2.satisfied
      semantic_ref: urn:cinder-typhoon:fact:W27.2
      operator: equals
      expected: true
    evidence_requirements:
    - c2
    quantifier: all
  c3:
    description: Demonstrate acceptance of the altered program and its false reserve result at the genuine
      planning consumer. The useful collision and accepted program earn one score. This supplies the same
      scoped W34 planning-view capability as W23.3, without altering raw process observations.
    subjects: *id003
    basis: observed_state
    predicate:
      kind: boolean
      property: cinder.w27-3.satisfied
      semantic_ref: urn:cinder-typhoon:fact:W27.3
      operator: equals
      expected: true
    evidence_requirements:
    - c3
    quantifier: all
assertions:
  c1-ready:
    proposition: c1
    role: precondition
    polarity: positive
  c1-done:
    proposition: c1
    role: postcondition
    polarity: positive
  c2-ready:
    proposition: c2
    role: precondition
    polarity: positive
  c2-done:
    proposition: c2
    role: postcondition
    polarity: positive
  c3-ready:
    proposition: c3
    role: precondition
    polarity: positive
  c3-done:
    proposition: c3
    role: postcondition
    polarity: positive
objectives:
  c1:
    name: 'W27.1: What counts as intact'
    description: |-
      Recover the integrity behavior used by the legacy engineering verifier and reproduce its decisions on the supplied programs.

      Establishes the actual acceptance mechanism protecting diagnostic code.
    agent: participant.operator
    actions:
    - w27.c1
    targets: &id004
    - features.a-engineering.a-engineering
    success:
      mode: all_of
      assertions:
      - c1-done
    window:
      workflows:
      - w27.c1
  c2:
    name: 'W27.2: The constraints of a valid-looking program'
    description: |-
      Construct a model of the verifier's collision constraints that also accounts for the engineering program's required form.

      Connects integrity analysis to the semantics a usable program must preserve.
    agent: participant.operator
    actions:
    - w27.c2
    targets: &id005
    - features.a-engineering.a-engineering
    success:
      mode: all_of
      assertions:
      - c2-done
    window:
      workflows:
      - w27.c2
  c3:
    name: 'W27.3: A program the engineer would accept'
    description: |-
      Create a valid-looking diagnostic program that makes the planning consumer report sufficient reserve for Cinder's allocation case while preserving its required diagnostics and unaffected district outputs.

      Completes the elite integrity branch with a useful planning-view capability.
    agent: participant.operator
    actions:
    - w27.c3
    targets: &id006
    - features.a-engineering.a-diagnostics
    success:
      mode: all_of
      assertions:
      - c3-done
    window:
      workflows:
      - w27.c3
workflows:
  c1:
    description: 'W27.1: availability follows the evidence/authority alternatives. This independent objective
      may be revisited when facts change; no campaign-wide sequence or deadline is imposed.'
    start: requirements
    steps:
      requirements:
        type: switch
        cases:
        - when:
            assertions:
            - capabilities.w21-revision-ready
          next: attempt
        default: unavailable
      available:
        type: end
      unavailable:
        type: end
      attempt:
        type: objective
        execution_mode: objective
        objective: w27.c1
        on_success: available
        on_failure: unavailable
  c2:
    description: 'W27.2: availability follows the evidence/authority alternatives. This independent objective
      may be revisited when facts change; no campaign-wide sequence or deadline is imposed.'
    start: requirements
    steps:
      requirements:
        type: switch
        cases:
        - when:
            assertions:
            - w27.c1-ready
          next: attempt
        default: unavailable
      available:
        type: end
      unavailable:
        type: end
      attempt:
        type: objective
        execution_mode: objective
        objective: w27.c2
        on_success: available
        on_failure: unavailable
  c3:
    description: 'W27.3: availability follows the evidence/authority alternatives. This independent objective
      may be revisited when facts change; no campaign-wide sequence or deadline is imposed.'
    start: requirements
    steps:
      requirements:
        type: switch
        cases:
        - when:
            assertions:
            - w27.c2-ready
          next: attempt
        default: unavailable
      available:
        type: end
      unavailable:
        type: end
      attempt:
        type: objective
        execution_mode: objective
        objective: w27.c3
        on_success: available
        on_failure: unavailable
