action_contracts:
  c1:
    semantic_version: 1.0.0
    lifecycle_state: draft
    behavioral_granularity: aggregate
    procedure_basis: |-
      The authored condition is **linear ROT128 integrity reconstruction**. Serialize the complete DPG1 candidate, append byte 0x80, then zero bytes to a 16-byte boundary. Treat each block as little-endian u128 and update s=ROTL128(s,17) XOR block XOR ROTL128(block,41) from IV 0x6a09e667f3bcc908bb67ae8584caa73b. Return s XOR ROTL128(s,29) XOR the unpadded byte length. Six supplied programs freeze header inclusion, padding, rotation direction, endian order, and length handling. The hand build must preserve every named version, encoding, bound, validation order, identity, and unaffected field; substituting a generic vulnerable service would change the task.

      The required result is: Produce correct verifier results for the designated programs. Naming a general hash family or copying one checksum is insufficient. Process quantities and state separation are governed by `arwc-process-model.md`, specifically `PLAN-CONSUMER-R8`.
    realization_profile: backend-declared
    fidelity_claim: The exact initial state, versions, formats, validation order, authorization decisions, process
      quantities, denial cases, persistent state, and independently owned evidence are required. Implementation
      choices remain open only when none of those facts change.
    preconditions:
    - precondition_id: eligibility
      precondition_class: authority
      description: Satisfy one complete alternative in the referenced workflow and obtain the required scoped access
        to every listed surface.
      support_refs:
      - workflows.w27.c1
      - features.a-engineering.a-engineering
    - precondition_id: normal-surface
      precondition_class: target
      description: |-
        `a-engineering` and its `engineering-workbench` application own this part of **What counts as intact**. Normal behavior applies the declared identity, tenant, object, revision, and process bindings and returns or changes only the caller-scoped object. The exact initial state is: Legacy verifier VER-ROT128-R3 treats each 16-byte block as little-endian u128 and updates state s=ROTL128(s,17) XOR block XOR ROTL128(block,41) from IV 6a09e667f3bcc908bb67ae8584caa73b, then returns s XOR ROTL128(s,29) XOR byte_length; six programs freeze padding, length, and decisions.

        Native bindings:

        - `a-engineering.a-engineering/engineering-workbench/what-counts-as-intact`
        - `a-engineering.a-engineering/filesystem:/var/lib/arwc-engineering/artifacts/what-counts-as-intact`

        The private service-loader contract is `content.arwc-a-engineering.w27-1-what-counts-as-intact`. It freezes accepted and denied requests, state transition, persistence, and evidence; it does not seed a successful result.
      support_refs:
      - features.a-engineering.a-engineering
      - content.arwc-a-engineering.w27-1-what-counts-as-intact
