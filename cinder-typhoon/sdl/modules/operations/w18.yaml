realization:
  default: open
evidence_requirements:
  c1:
    description: Recover the actual export and its revision binding. Its names alone do not prove which
      outlet moves.
    source_refs: &id001
    - features.a-engineering.a-historian
    scope: Per-participant in-world evidence; no other participant state.
    boundary_kind: assertion_evaluation
    channel: other
    artifact_role: proposition_truth_evidence
    sensitivity: plain
    redaction: redact_secrets
    integrity: checksum
    retention: run_lifetime
    loss_disclosure: required
    observation_demand:
      rule_id: fact-w18-1
      scope: /features
      purpose: experimental
      mode: selected
      selector:
        semantic_scope: /features
        data_kind: artifact
        names:
        - cinder.w18-1.satisfied
        component_refs:
        - features.a-engineering.a-historian
      collection: require
      retention: require
      redaction: redact-secrets
      integrity: checksum
      required: true
      basis: observed
  c2:
    description: Recover the scale table and its applicable revision. Individual entries in the table
      are one artifact result.
    source_refs: &id002
    - features.a-engineering.a-historian
    scope: Per-participant in-world evidence; no other participant state.
    boundary_kind: assertion_evaluation
    channel: other
    artifact_role: proposition_truth_evidence
    sensitivity: plain
    redaction: redact_secrets
    integrity: checksum
    retention: run_lifetime
    loss_disclosure: required
    observation_demand:
      rule_id: fact-w18-2
      scope: /features
      purpose: experimental
      mode: selected
      selector:
        semantic_scope: /features
        data_kind: artifact
        names:
        - cinder.w18-2.satisfied
        component_refs:
        - features.a-engineering.a-historian
      collection: require
      retention: require
      redaction: redact-secrets
      integrity: checksum
      required: true
      basis: observed
  c3:
    description: Produce the correct interpretation of the supplied readings with their relevant scale
      revision. Matching a tag name alone does not count.
    source_refs: &id003
    - features.a-engineering.a-historian
    scope: Per-participant in-world evidence; no other participant state.
    boundary_kind: assertion_evaluation
    channel: other
    artifact_role: proposition_truth_evidence
    sensitivity: plain
    redaction: redact_secrets
    integrity: checksum
    retention: run_lifetime
    loss_disclosure: required
    observation_demand:
      rule_id: fact-w18-3
      scope: /features
      purpose: experimental
      mode: selected
      selector:
        semantic_scope: /features
        data_kind: artifact
        names:
        - cinder.w18-3.satisfied
        component_refs:
        - features.a-engineering.a-historian
      collection: require
      retention: require
      redaction: redact-secrets
      integrity: checksum
      required: true
      basis: observed
  c4:
    description: |-
      Establish the tag/scale-to-outlet mapping supported by observed behavior. This supplies W18.MAP and MAPPING, not allocation or current project-revision evidence.

      The conclusion associates the previously ambiguous identifiers with the physical outlet group and its recorded reference-event trace. The player can now point to the part of the reservoir those values describe. It presents the mapping they established, not a new live command or a rehearsal that secretly moves the plant. W19.4 earns the same recognition through its alternative investigation.
    source_refs: &id004
    - features.a-engineering.a-historian
    - features.a-control.a-instruments
    scope: Per-participant in-world evidence; no other participant state.
    boundary_kind: assertion_evaluation
    channel: other
    artifact_role: proposition_truth_evidence
    sensitivity: plain
    redaction: redact_secrets
    integrity: checksum
    retention: run_lifetime
    loss_disclosure: required
    observation_demand:
