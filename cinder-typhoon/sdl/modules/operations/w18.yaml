    description: Recover the actual export and its revision binding. Its names alone do not prove which
      outlet moves.
    subjects: *id001
    basis: observed_state
    predicate:
      kind: boolean
      property: cinder.w18-1.satisfied
      semantic_ref: urn:cinder-typhoon:fact:W18.1
      operator: equals
      expected: true
    evidence_requirements:
    - c1
    quantifier: all
  c2:
    description: Recover the scale table and its applicable revision. Individual entries in the table
      are one artifact result.
    subjects: *id002
    basis: observed_state
