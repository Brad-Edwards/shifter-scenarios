    role: precondition
    polarity: positive
  c4-done:
    proposition: c4
    role: postcondition
    polarity: positive
objectives:
  c1:
    name: 'W18.1: The tag export'
    description: |-
      Recover the engineering tag export used for the reservoir outlet group.

      Supplies one half of the mapping evidence.
    agent: participant.operator
    actions:
    - w18.c1
    targets: &id005
    - features.a-engineering.a-historian
    success:
      mode: all_of
      assertions:
      - c1-done
    window:
      workflows:
      - w18.c1
  c2:
    name: 'W18.2: The scale kept elsewhere'
    description: |-
      Recover the separate scale table referenced by the outlet instrumentation records.

      Adds independent interpretation evidence.
    agent: participant.operator
    actions:
    - w18.c2
    targets: &id006
    - features.a-engineering.a-historian
    success:
      mode: all_of
      assertions:
      - c2-done
    window:
      workflows:
      - w18.c2
  c3:
    name: 'W18.3: When the units changed'
    description: |-
      Reconcile the tag export and scale table so the outlet readings have the correct units and revision context.

      Resolves a discoverable engineering-data mismatch.
    agent: participant.operator
    actions:
    - w18.c3
    targets: &id007
    - features.a-engineering.a-historian
    success:
      mode: all_of
      assertions:
      - c3-done
    window:
      workflows:
      - w18.c3
  c4:
    name: 'W18.4: Which outlet answers'
    description: |-
      Use the interpreted engineering evidence and reference trace to identify the actual reservoir outlet group.

      Completes the ordinary process-mapping route.
    agent: participant.operator
    actions:
    - w18.c4
    targets: &id008
    - features.a-engineering.a-historian
    - features.a-control.a-instruments
    success:
      mode: all_of
      assertions:
      - c4-done
    window:
      workflows:
      - w18.c4
workflows:
  c1:
    description: 'W18.1: availability follows the evidence/authority alternatives. This independent objective
      may be revisited when facts change; no campaign-wide sequence or deadline is imposed.'
    start: requirements
    steps:
      requirements:
        type: switch
        cases:
        - when:
            assertions:
            - capabilities.ot-read-ready
          next: attempt
        default: unavailable
      available:
        type: end
      unavailable:
        type: end
      attempt:
        type: objective
        execution_mode: objective
        objective: w18.c1
        on_success: available
        on_failure: unavailable
  c2:
    description: 'W18.2: availability follows the evidence/authority alternatives. This independent objective
