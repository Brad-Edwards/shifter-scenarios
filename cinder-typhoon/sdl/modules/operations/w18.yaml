action_contracts:
  c1:
    semantic_version: 1.0.0
    lifecycle_state: draft
    behavioral_granularity: aggregate
    procedure_basis: |-
      This is a bounded operating observation and interpretation task, not a privilege flaw. The participant must use the installed products to reconcile the installed register with the running project and native catalog, distinguish Modbus PDU offsets from IEC addresses, interpret source, collection, and ingestion time with quality, and map both outlet channels from time-aligned native observations. A copied value, inferred default, or synthetic API response does not establish the result.

      The required result is: Record the register ID, project revision, native register digest, and required process variables, and confirm that the installed register, running revision, and native catalog agree. A copied filename or unverified table is insufficient.
    realization_profile: backend-declared
    fidelity_claim: The exact initial state, versions, formats, validation order, authorization decisions, process
      quantities, denial cases, persistent state, and independently owned evidence are required. Implementation
      choices remain open only when none of those facts change.
    preconditions:
    - precondition_id: eligibility
      precondition_class: authority
      description: Satisfy one complete alternative in the referenced workflow and obtain the required scoped access
        to every listed surface.
      support_refs:
      - workflows.w18.c1
      - features.a-engineering.a-engineering
      - features.a-engineering.a-historian
    - precondition_id: normal-surface
      precondition_class: target
      description: |-
        The installed Cairn Reach OT products own this part of **The tag export**. The exact initial state is: Image-owned native I/O register CRR-IO-R364 identifies six Modbus input registers for the Cairn Reach controller; its revision and digest must agree with the live ProjectRevision point and historian catalog.

        Native bindings:

        - `a-engineering.a-engineering/filesystem:/home/fieldlink/CairnReach/Briefs/W18/tag-register.csv`
        - `a-engineering.a-hmi/OPC-UA:nsu=urn:arwc:crr:tags;s=CRR.ProjectRevision`
        - `a-engineering.a-historian/PostgreSQL:public.historian_tag_catalog`

        The image-owned W18 native I/O register and history-provenance note are starting material only. OpenPLC, OPC UA, Modbus TCP, the historian catalog, and retained process history remain the authoritative sources; no private service-loader route duplicates them.
      support_refs:
      - features.a-engineering.a-engineering
      - features.a-engineering.a-historian
    - precondition_id: scope-and-persistence
      precondition_class: realization
      description: |-
        The result remains local evidence unless a downstream workflow explicitly names it. The task is read-only and creates no process mutation to retain or reset. Ordinary historian retention continues independently. Infrastructure recovery and submission adjudication are external to the SDL.

        The behavior is limited to the installed Cairn Reach products, the named asset, and the supplied participant material. It provides no alternate work item service, simulated completion endpoint, or authority not already present in the OT environment.
      support_refs:
      - features.a-engineering.a-engineering
      - features.a-engineering.a-historian
    effects:
    - effect_id: outcome
      effect_class: intended_effect
      description: Record the register ID, project revision, native register digest, and required process variables,
        and confirm that the installed register, running revision, and native catalog agree. A copied filename or
