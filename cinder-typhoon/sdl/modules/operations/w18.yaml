objectives:
  c1:
    name: 'This action: The tag export'
    description: Identify the installed Cairn Reach native I/O register and prove that its revision and digest agree
      with the running controller and historian catalog.
    assigned_participant: participant.operator
    actions:
    - w18.c1
    targets:
    - features.a-engineering.a-engineering
    - features.a-engineering.a-historian
    success:
      mode: all_of
      assertions:
      - c1-done
    window:
      workflows:
      - w18.c1
  c2:
    name: 'This action: The scale kept elsewhere'
    description: Reconcile one outlet flow point across its Modbus register, OpenPLC address, raw type and scale,
      PLC value, OPC UA identity, and historian series.
    assigned_participant: participant.operator
    actions:
    - w18.c2
    targets:
    - features.a-engineering.a-engineering
    - features.a-engineering.a-historian
    success:
      mode: all_of
      assertions:
      - c2-done
    window:
      workflows:
      - w18.c2
  c3:
    name: 'This action: Three clocks and a gap'
    description: Use retained native history to identify a genuine collection gap and explain it using source time,
      collection time, ingestion time, transport quality, process quality, and engineering unit.
    assigned_participant: participant.operator
    actions:
    - w18.c3
    targets:
    - features.a-engineering.a-engineering
    - features.a-engineering.a-historian
    success:
      mode: all_of
      assertions:
      - c3-done
    window:
      workflows:
      - w18.c3
  c4:
    name: 'This action: Which outlet answers'
    description: Map both Cairn Reach outlet gates from native register channels to PLC values, OPC UA identities,
      historian series, and a time-aligned physical observation.
    assigned_participant: participant.operator
    actions:
    - w18.c4
    targets:
    - features.a-engineering.a-engineering
    - features.a-engineering.a-historian
    - features.a-control.a-instruments
    success:
      mode: all_of
      assertions:
      - c4-done
    window:
      workflows:
      - w18.c4
