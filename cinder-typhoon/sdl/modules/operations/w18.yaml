        execution_mode: objective
        objective: w18.c3
        on_success: available
        on_failure: unavailable
  c4:
    description: 'W18.4: availability follows the evidence/authority alternatives. This independent objective
      may be revisited when facts change; no campaign-wide sequence or deadline is imposed.'
    start: requirements
    steps:
      requirements:
        type: switch
        cases:
        - when:
            assertions:
            - w18.c3-ready
            - capabilities.w17-obs-ready
          next: attempt
        default: unavailable
      available:
        type: end
      unavailable:
        type: end
      attempt:
