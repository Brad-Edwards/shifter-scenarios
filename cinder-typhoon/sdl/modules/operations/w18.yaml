      may be revisited when facts change; no campaign-wide sequence or deadline is imposed.'
    start: requirements
    steps:
      requirements:
        type: switch
        cases:
        - when:
            assertions:
            - w18.c1-ready
            - w18.c2-ready
          next: attempt
        default: unavailable
      available:
        type: end
      unavailable:
