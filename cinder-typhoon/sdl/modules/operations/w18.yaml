    procedure_basis: |-
      This card is an exact discovery, interpretation, or reconciliation task rather than an additional privilege flaw. Engineering export TAGS-CRR-R21 lists outlet command, position, and flow tags with project revision CRR-CTRL-R21 and ambiguous legacy group labels. The result must come from the declared source and bindings, not from a duplicate clue or pre-completed record.

      The required result is: Recover the actual export and its revision binding. Its names alone do not prove which outlet moves. Process quantities and state separation are governed by `arwc-process-model.md`, specifically `MAP-OG2-R8`, `CRR-CTRL-R21`.
    realization_profile: backend-declared
    fidelity_claim: The exact initial state, versions, formats, validation order, authorization decisions, process
      quantities, denial cases, persistent state, and independently owned evidence are required. Implementation
      choices remain open only when none of those facts change.
    preconditions:
    - precondition_id: eligibility
      precondition_class: authority
      description: Satisfy one complete alternative in the referenced workflow and obtain the required scoped access
