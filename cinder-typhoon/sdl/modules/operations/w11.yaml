realization:
  default: open
evidence_requirements:
  c1:
    description: Recover the actual contract and relation binding. Public protocol documentation alone
      does not complete the task.
    source_refs: &id001
    - features.a-corporate.a-data
    scope: Per-participant in-world evidence; no other participant state.
    boundary_kind: assertion_evaluation
    channel: other
    artifact_role: proposition_truth_evidence
    sensitivity: plain
    redaction: redact_secrets
    integrity: checksum
    retention: run_lifetime
    loss_disclosure: required
    observation_demand:
      rule_id: fact-w11-1
      scope: /features
      purpose: experimental
      mode: selected
      selector:
        semantic_scope: /features
        data_kind: artifact
        names:
        - cinder.w11-1.satisfied
        component_refs:
        - features.a-corporate.a-data
      collection: require
      retention: require
      redaction: redact-secrets
      integrity: checksum
      required: true
      basis: observed
  c2:
    description: Obtain the actual restricted backend response for the supplied relation. A connection
      or syntactically plausible message is insufficient.
    source_refs: &id002
    - features.a-corporate.a-data
    scope: Per-participant in-world evidence; no other participant state.
    boundary_kind: assertion_evaluation
    channel: other
    artifact_role: proposition_truth_evidence
    sensitivity: plain
    redaction: redact_secrets
    integrity: checksum
    retention: run_lifetime
    loss_disclosure: required
    observation_demand:
      rule_id: fact-w11-2
      scope: /features
      purpose: experimental
      mode: selected
      selector:
        semantic_scope: /features
        data_kind: artifact
        names:
        - cinder.w11-2.satisfied
        component_refs:
        - features.a-corporate.a-data
      collection: require
      retention: require
      redaction: redact-secrets
      integrity: checksum
      required: true
      basis: observed
  c3:
    description: Recover the protected lineage and its current asset binding. It can introduce W12's archive
      trail; the initial protocol response does not contain this result.
    source_refs: &id003
    - features.a-corporate.a-data
    scope: Per-participant in-world evidence; no other participant state.
    boundary_kind: assertion_evaluation
    channel: other
    artifact_role: proposition_truth_evidence
    sensitivity: plain
    redaction: redact_secrets
    integrity: checksum
    retention: run_lifetime
    loss_disclosure: required
    observation_demand:
      rule_id: fact-w11-3
      scope: /features
      purpose: experimental
      mode: selected
      selector:
        semantic_scope: /features
        data_kind: artifact
        names:
        - cinder.w11-3.satisfied
        component_refs:
        - features.a-corporate.a-data
      collection: require
      retention: require
      redaction: redact-secrets
      integrity: checksum
      required: true
      basis: observed
propositions:
  c1:
    description: Recover the actual contract and relation binding. Public protocol documentation alone
      does not complete the task.
    subjects: *id001
    basis: observed_state
    predicate:
      kind: boolean
      property: cinder.w11-1.satisfied
      semantic_ref: urn:cinder-typhoon:fact:W11.1
      operator: equals
      expected: true
    evidence_requirements:
    - c1
    quantifier: all
  c2:
    description: Obtain the actual restricted backend response for the supplied relation. A connection
      or syntactically plausible message is insufficient.
    subjects: *id002
    basis: observed_state
    predicate:
      kind: boolean
      property: cinder.w11-2.satisfied
      semantic_ref: urn:cinder-typhoon:fact:W11.2
      operator: equals
      expected: true
    evidence_requirements:
    - c2
    quantifier: all
  c3:
    description: Recover the protected lineage and its current asset binding. It can introduce W12's archive
      trail; the initial protocol response does not contain this result.
    subjects: *id003
    basis: observed_state
    predicate:
      kind: boolean
      property: cinder.w11-3.satisfied
      semantic_ref: urn:cinder-typhoon:fact:W11.3
      operator: equals
      expected: true
    evidence_requirements:
    - c3
    quantifier: all
assertions:
  c1-ready:
    proposition: c1
    role: precondition
    polarity: positive
  c1-done:
    proposition: c1
    role: postcondition
    polarity: positive
  c2-ready:
    proposition: c2
    role: precondition
    polarity: positive
  c2-done:
    proposition: c2
    role: postcondition
    polarity: positive
  c3-ready:
    proposition: c3
    role: precondition
    polarity: positive
  c3-done:
    proposition: c3
    role: postcondition
    polarity: positive
objectives:
  c1:
    name: 'W11.1: The relation service''s language'
    description: |-
      Recover the protected relation-service contract and identify how the supplied maintenance association is represented.

      Introduces the backend as the keeper of useful asset relationships.
    agent: participant.operator
    actions:
    - w11.c1
    targets: &id004
    - features.a-corporate.a-data
    success:
      mode: all_of
      assertions:
      - c1-done
    window:
      workflows:
      - w11.c1
  c2:
    name: 'W11.2: An exchange the backend accepts'
    description: |-
      Construct an accepted exchange with the protected backend and recover the designated restricted response through the relation service.

      Develops a substantive protocol capability.
    agent: participant.operator
    actions:
    - w11.c2
    targets: &id005
    - features.a-corporate.a-data
    success:
      mode: all_of
      assertions:
      - c2-done
    window:
      workflows:
      - w11.c2
  c3:
    name: 'W11.3: The asset''s true lineage'
    description: |-
      Use the earned exchange capability to recover the current asset lineage behind the backend's separate relation boundary.

      Provides authoritative history useful to the maintenance investigation.
    agent: participant.operator
    actions:
    - w11.c3
    targets: &id006
    - features.a-corporate.a-data
    success:
      mode: all_of
      assertions:
      - c3-done
    window:
      workflows:
      - w11.c3
workflows:
  c1:
    description: 'W11.1: availability follows the evidence/authority alternatives. This independent objective
      may be revisited when facts change; no campaign-wide sequence or deadline is imposed.'
    start: requirements
    steps:
      requirements:
        type: switch
        cases:
        - when:
            assertions:
            - w02.c2-ready
          next: attempt
        - when:
            assertions:
            - capabilities.w09-data-ready
          next: attempt
        default: unavailable
      available:
        type: end
      unavailable:
        type: end
      attempt:
        type: objective
        execution_mode: objective
        objective: w11.c1
        on_success: available
        on_failure: unavailable
  c2:
    description: 'W11.2: availability follows the evidence/authority alternatives. This independent objective
      may be revisited when facts change; no campaign-wide sequence or deadline is imposed.'
    start: requirements
    steps:
      requirements:
        type: switch
        cases:
        - when:
            assertions:
            - w11.c1-ready
          next: attempt
        default: unavailable
      available:
        type: end
      unavailable:
        type: end
      attempt:
        type: objective
        execution_mode: objective
        objective: w11.c2
        on_success: available
        on_failure: unavailable
  c3:
    description: 'W11.3: availability follows the evidence/authority alternatives. This independent objective
      may be revisited when facts change; no campaign-wide sequence or deadline is imposed.'
    start: requirements
    steps:
      requirements:
        type: switch
        cases:
        - when:
            assertions:
            - w11.c2-ready
          next: attempt
        default: unavailable
      available:
        type: end
      unavailable:
        type: end
      attempt:
        type: objective
        execution_mode: objective
        objective: w11.c3
        on_success: available
        on_failure: unavailable
