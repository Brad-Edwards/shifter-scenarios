    procedure_basis: |-
      This card is an exact discovery, interpretation, or reconciliation task rather than an additional privilege flaw. Relation contract RELPROTO-CRR-R3 specifies Neo4j Bolt 5.4 handshake, PackStream struct fields, relation ASSET_WORK, and supplied association ASC-CRR-4417. The result must come from the declared source and bindings, not from a duplicate clue or pre-completed record.

      The required result is: Recover the actual contract and relation binding. Public protocol documentation alone does not complete the task.
    realization_profile: backend-declared
    fidelity_claim: The exact initial state, versions, formats, validation order, authorization decisions, process
      quantities, denial cases, persistent state, and independently owned evidence are required. Implementation
      choices remain open only when none of those facts change.
    preconditions:
    - precondition_id: eligibility
      precondition_class: authority
      description: Satisfy one complete alternative in the referenced workflow and obtain the required scoped access
        to every listed surface.
      support_refs:
      - workflows.w11.c1
      - features.a-corporate.a-data
    - precondition_id: normal-surface
      precondition_class: target
      description: |-
        `a-data` and its `planning-data` application own this part of **The relation service's language**. Normal behavior applies the declared identity, tenant, object, revision, and process bindings and returns or changes only the caller-scoped object. The exact initial state is: Relation contract RELPROTO-CRR-R3 specifies Neo4j Bolt 5.4 handshake, PackStream struct fields, relation ASSET_WORK, and supplied association ASC-CRR-4417.

        Native bindings:

        - `a-corporate.a-data/planning-data/the-relation-service-s-language`

        The private service-loader contract is `content.arwc-a-data.w11-1-the-relation-service-s-language`. It freezes accepted and denied requests, state transition, persistence, and evidence; it does not seed a successful result.
      support_refs:
      - features.a-corporate.a-data
      - content.arwc-a-data.w11-1-the-relation-service-s-language
    - precondition_id: scope-and-persistence
      precondition_class: realization
      description: |-
        The result remains local evidence unless a downstream workflow explicitly names it. Tenant-scoped mutations, sessions that have not expired, generated artifacts, and audits persist across ordinary retries and later sessions. Initial immutable records remain unchanged unless the named route explicitly permits a field-level revision. Infrastructure recovery and submission adjudication are external to the SDL.

        The behavior is limited to the named fictional objects and bounded service operation. It provides no general shell, arbitrary network target, unrelated district access, real process interface, or authority not expressly declared by the card.
      support_refs:
      - features.a-corporate.a-data
    effects:
