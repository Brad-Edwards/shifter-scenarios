evidence_requirements:
  c1:
    description: |-
      Recover the protected policy and demonstrate the relevant identity distinction through a scoped operation. A policy read alone is insufficient.

      Required technical proof: Completion is observed by the owning service from the fresh result and its immutable audit correlation. The evidence binds the participant, accepted identity or job, exact input and output identifiers, relevant revision or digest, and destination-side observation where a second service consumes the result. Objective evaluation does not create the result or grant authority.
    source_refs:
    - features.k-cloud.k-cloud-api--authority
    scope: Per-participant in-world evidence; no other participant state.
    boundary_kind: assertion_evaluation
    channel: other
    artifact_role: proposition_truth_evidence
    sensitivity: plain
    redaction: redact_secrets
    integrity: checksum
    retention: run_lifetime
    loss_disclosure: required
    observation_demand:
      rule_id: fact-k31-1
      scope: /features
      purpose: experimental
      mode: selected
      selector:
        semantic_scope: /features
        data_kind: artifact
        names:
        - cinder.k31-1.satisfied
        component_refs:
        - features.k-cloud.k-cloud-api--authority
      collection: require
      retention: require
      redaction: redact-secrets
      integrity: checksum
      required: true
      basis: observed
    notes:
    - 'Author checks: Verify the normal baseline, the exact intended path, and the fresh evidence described above.
      Reject a wrong identifier, revision, digest, tenant, identity, stale result, or cross-participant reference.
      Verify unrelated records and permissions remain unchanged and that the result remains recognizable and usable
      by every declared downstream consumer.'
  c2:
    description: |-
      Demonstrate access to a protected resource unavailable to the starting identity, with the original job interface still functioning.

      Required technical proof: Completion is observed by the owning service from the fresh result and its immutable audit correlation. The evidence binds the participant, accepted identity or job, exact input and output identifiers, relevant revision or digest, and destination-side observation where a second service consumes the result. Objective evaluation does not create the result or grant authority.
    source_refs:
    - features.k-cloud.k-workload--manage
    scope: Per-participant in-world evidence; no other participant state.
    boundary_kind: assertion_evaluation
    channel: other
    artifact_role: proposition_truth_evidence
    sensitivity: plain
    redaction: redact_secrets
    integrity: checksum
    retention: run_lifetime
    loss_disclosure: required
    observation_demand:
      rule_id: fact-k31-2
      scope: /features
      purpose: experimental
      mode: selected
      selector:
        semantic_scope: /features
        data_kind: artifact
        names:
        - cinder.k31-2.satisfied
        component_refs:
        - features.k-cloud.k-workload--manage
      collection: require
      retention: require
      redaction: redact-secrets
      integrity: checksum
      required: true
      basis: observed
    notes:
    - 'Author checks: Verify the normal baseline, the exact intended path, and the fresh evidence described above.
      Reject a wrong identifier, revision, digest, tenant, identity, stale result, or cross-participant reference.
      Verify unrelated records and permissions remain unchanged and that the result remains recognizable and usable
      by every declared downstream consumer.'
  c3:
    description: |-
      Recover the actual field archive through the resource's independent access boundary. Merely changing a label earns nothing; ordinary medium routes still provide required ARWC knowledge.

      Required technical proof: Completion is observed by the owning service from the fresh result and its immutable audit correlation. The evidence binds the participant, accepted identity or job, exact input and output identifiers, relevant revision or digest, and destination-side observation where a second service consumes the result. Objective evaluation does not create the result or grant authority.
    source_refs:
    - features.k-cloud.k-workload--runtime
    - features.k-cloud.k-data--field-archive
    scope: Per-participant in-world evidence; no other participant state.
    boundary_kind: assertion_evaluation
    channel: other
    artifact_role: proposition_truth_evidence
    sensitivity: plain
    redaction: redact_secrets
    integrity: checksum
    retention: run_lifetime
    loss_disclosure: required
    observation_demand:
