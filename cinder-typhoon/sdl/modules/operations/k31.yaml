    lifecycle_state: draft
    behavioral_granularity: aggregate
    procedure_basis: 'The intended path is limited to the authored software, data, configuration, identity, permission,
      or state described above. The participant must exercise that real condition through the declared service interface
      and produce this result: Protected policy read plus whoami result for management operation. Merely describing
      the condition, editing a local copy, or presenting a value obtained from another surface does not satisfy
      the contract.'
    realization_profile: backend-declared
    fidelity_claim: The exact starting state, service transition, denial cases, participant-state persistence, and
      independently owned evidence are required. Backend choices remain open only where they cannot change those
      facts.
    preconditions:
    - precondition_id: eligibility
      precondition_class: authority
      description: Satisfy one complete alternative in the referenced workflow and obtain the required scoped access
        to every listed surface.
      support_refs:
      - workflows.k31.c1
      - features.k-cloud.k-cloud-api--authority
    - precondition_id: normal-surface
      precondition_class: target
      description: '`k-cloud-api` owns this part of the operation. Its starting state is exact: Policy distinguishes
        management caller, scheduler, runtime service account and resource label; worker may manage own bounded
        job. The owning service uses the listener, route, identity, authorization, storage, and audit contract declared
        in the corresponding world module. Records that are not explicitly mutable remain immutable. The private
        service-loader contract `content.keplerops-k-cloud-api.k31-1-whose-maintenance-job` freezes the request,
        denial, state-transition, evidence, and any exploit-critical implementation details.'
      support_refs:
      - features.k-cloud.k-cloud-api
      - content.keplerops-k-cloud-api.k31-1-whose-maintenance-job
    - precondition_id: scope-and-persistence
      precondition_class: realization
      description: Input to K31.2 Participant-created service state persists for the life of the participant world
        and ordinary retries do not erase it. The action is limited to the exact records, identities, routes, and
        destination effects declared here; unrelated tenants and services remain denied. Infrastructure recovery
        and submission adjudication are outside this in-world contract.
      support_refs:
      - features.k-cloud.k-cloud-api
    effects:
    - effect_id: outcome
      effect_class: intended_effect
      description: Recover the protected policy and demonstrate the relevant identity distinction through a scoped
        operation. A policy read alone is insufficient.
      target_refs:
      - features.k-cloud.k-cloud-api--authority
      evidence_refs:
