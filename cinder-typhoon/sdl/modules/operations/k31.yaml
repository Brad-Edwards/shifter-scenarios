objectives:
  c1:
    name: 'K31.1: Whose maintenance job'
    description: |-
      Recover the scheduler's maintenance policy and establish which identity its different operations actually evaluate.

      Separates job ownership from the identity of a running workload.
    agent: participant.operator
    actions:
    - k31.c1
    targets:
    - features.k-cloud.k-cloud-api--authority
    success:
      mode: all_of
      assertions:
      - c1-done
    window:
      workflows:
      - k31.c1
  c2:
    name: 'K31.2: A different identity at runtime'
    description: |-
      Obtain the workload's separate runtime capability through a change you are permitted to make, while preserving its ordinary job interface.

      Creates a new cloud execution capability under meaningful constraints.
    agent: participant.operator
    actions:
    - k31.c2
    targets:
    - features.k-cloud.k-workload--manage
    success:
      mode: all_of
      assertions:
      - c2-done
    window:
      workflows:
      - k31.c2
  c3:
    name: 'K31.3: The maintenance label'
    description: |-
      Use the earned runtime capability and maintenance classification relationship to recover the protected field archive.

      Reveals a calibration change missing from the business export.
    agent: participant.operator
    actions:
    - k31.c3
    targets:
    - features.k-cloud.k-workload--runtime
    - features.k-cloud.k-data--field-archive
    success:
      mode: all_of
      assertions:
      - c3-done
    window:
      workflows:
      - k31.c3
workflows:
  c1:
    description: 'K31.1: availability follows the evidence/authority alternatives. This independent objective may
      be revisited when facts change; no campaign-wide sequence or deadline is imposed.'
    start: requirements
    steps:
      requirements:
        type: switch
        cases:
        - when:
            assertions:
            - k14.c2-ready
          next: attempt
        - when:
            assertions:
            - k09.c4-ready
          next: attempt
        default: unavailable
      available:
        type: end
      unavailable:
        type: end
      attempt:
        type: objective
        execution_mode: objective
        objective: k31.c1
        on_success: available
        on_failure: unavailable
  c2:
    description: 'K31.2: availability follows the evidence/authority alternatives. This independent objective may
      be revisited when facts change; no campaign-wide sequence or deadline is imposed.'
    start: requirements
    steps:
      requirements:
        type: switch
        cases:
        - when:
            assertions:
            - k31.c1-ready
          next: attempt
        default: unavailable
      available:
        type: end
      unavailable:
        type: end
      attempt:
        type: objective
        execution_mode: objective
        objective: k31.c2
        on_success: available
        on_failure: unavailable
  c3:
    description: 'K31.3: availability follows the evidence/authority alternatives. This independent objective may
      be revisited when facts change; no campaign-wide sequence or deadline is imposed.'
    start: requirements
    steps:
      requirements:
        type: switch
        cases:
        - when:
            assertions:
            - k31.c2-ready
          next: attempt
        default: unavailable
      available:
        type: end
      unavailable:
        type: end
      attempt:
        type: objective
        execution_mode: objective
        objective: k31.c3
        on_success: available
        on_failure: unavailable
