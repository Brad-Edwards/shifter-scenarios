objectives:
  c1:
    name: 'W24.1: Two kinds of answer'
    description: |-
      Recover the legacy recovery contract and distinguish the response classes produced for the supplied engineering record.

      Establishes what the recovery interface actually reveals.
    agent: participant.operator
    actions:
    - w24.c1
    targets: &id005
    - features.a-engineering.a-diagnostics
    success:
      mode: all_of
      assertions:
      - c1-done
    window:
      workflows:
      - w24.c1
  c2:
    name: 'W24.2: Which answer comes next'
    description: |-
      Predict the recovery interface's response selection well enough to satisfy the designated challenge cases.

      Develops a useful cryptographic observation capability.
    agent: participant.operator
    actions:
    - w24.c2
    targets: &id006
    - features.a-engineering.a-diagnostics
    success:
      mode: all_of
      assertions:
      - c2-done
    window:
      workflows:
      - w24.c2
  c3:
    name: 'W24.3: The diagnostic evidence bundle'
    description: |-
      Recover the archive-unlock value within the recovery interface's query allowance and open the diagnostic evidence bundle bound to the current engineering project.

      Turns the observation capability into protected engineering evidence and reveals the separate diagnostic-signing component behind the legacy service.
    agent: participant.operator
    actions:
    - w24.c3
    targets: &id007
    - features.a-engineering.a-diagnostics
    success:
      mode: all_of
      assertions:
      - c3-done
    window:
      workflows:
      - w24.c3
  c4:
    name: 'W24.4: Signed by someone who never approved it'
    description: |-
      The diagnostic service requires a signed authorization to export its private calibration-exception log. Use the recovered signer and its old records to produce an authorization for a fresh export request bound to the current project, then obtain the log.

      Lets Cinder impersonate the diagnostic approver and recover the calibration exceptions omitted from routine support exports. Recovering archived evidence now leads to a distinct breach of the service's approval boundary.
    agent: participant.operator
    actions:
    - w24.c4
    targets: &id008
    - features.a-engineering.a-diagnostics
    success:
      mode: all_of
      assertions:
      - c4-done
    window:
      workflows:
      - w24.c4
workflows:
  c1:
    description: 'W24.1: availability follows the evidence/authority alternatives. This independent objective
      may be revisited when facts change; no campaign-wide sequence or deadline is imposed.'
    start: requirements
    steps:
      requirements:
        type: switch
        cases:
        - when:
            assertions:
            - capabilities.w21-revision-ready
          next: attempt
        default: unavailable
      available:
        type: end
      unavailable:
        type: end
      attempt:
