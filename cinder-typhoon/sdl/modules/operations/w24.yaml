evidence_requirements:
  c1:
    description: Recover the actual contract and correctly classify the supplied responses. A service
      banner or guessed algorithm name is insufficient.
    source_refs: &id001
    - features.a-engineering.a-diagnostics
    scope: Per-participant in-world evidence; no other participant state.
    boundary_kind: assertion_evaluation
    channel: other
    artifact_role: proposition_truth_evidence
    sensitivity: plain
    redaction: redact_secrets
    integrity: checksum
    retention: run_lifetime
    loss_disclosure: required
    observation_demand:
      rule_id: fact-w24-1
      scope: /features
      purpose: experimental
      mode: selected
      selector:
        semantic_scope: /features
        data_kind: artifact
        names:
        - cinder.w24-1.satisfied
        component_refs:
        - features.a-engineering.a-diagnostics
      collection: require
      retention: require
      redaction: redact-secrets
      integrity: checksum
      required: true
      basis: observed
  c2:
    description: Demonstrate correct selection predictions under the stated conditions. Replaying a known
      sequence does not count.
    source_refs: &id002
    - features.a-engineering.a-diagnostics
    scope: Per-participant in-world evidence; no other participant state.
    boundary_kind: assertion_evaluation
    channel: other
    artifact_role: proposition_truth_evidence
    sensitivity: plain
    redaction: redact_secrets
    integrity: checksum
    retention: run_lifetime
    loss_disclosure: required
    observation_demand:
