action_contracts:
  c1:
    semantic_version: 1.0.0
    lifecycle_state: draft
    behavioral_granularity: aggregate
    procedure_basis: |-
      This card is an exact discovery, interpretation, or reconciliation task rather than an additional privilege flaw. Recovery contract RECOVERY-ORACLE-R4 uses RSA-2048 PKCS#1 v1.5 and four classes: A for missing 00 02 prefix, B for fewer than eight nonzero padding bytes, C for missing separator or wrong ENG1 payload tag, and D for structurally valid padding; it enforces 4096 total queries and supplies labeled examples for engineering record ENG-REC-24. The result must come from the declared source and bindings, not from a duplicate clue or pre-completed record.

      The required result is: Recover the actual contract and correctly classify the supplied responses. A service banner or guessed algorithm name is insufficient.
    realization_profile: backend-declared
    fidelity_claim: The exact initial state, versions, formats, validation order, authorization decisions, process
      quantities, denial cases, persistent state, and independently owned evidence are required. Implementation
      choices remain open only when none of those facts change.
    preconditions:
    - precondition_id: eligibility
      precondition_class: authority
      description: Satisfy one complete alternative in the referenced workflow and obtain the required scoped access
        to every listed surface.
      support_refs:
      - workflows.w24.c1
      - features.a-engineering.a-diagnostics
    - precondition_id: normal-surface
      precondition_class: target
      description: |-
        `a-diagnostics` and its `diagnostic-services` application own this part of **Two kinds of answer**. Normal behavior applies the declared identity, tenant, object, revision, and process bindings and returns or changes only the caller-scoped object. The exact initial state is: Recovery contract RECOVERY-ORACLE-R4 uses RSA-2048 PKCS#1 v1.5 and four classes: A for missing 00 02 prefix, B for fewer than eight nonzero padding bytes, C for missing separator or wrong ENG1 payload tag, and D for structurally valid padding; it enforces 4096 total queries and supplies labeled examples for engineering record ENG-REC-24.

        Native bindings:

        - `a-engineering.a-diagnostics/diagnostic-services/two-kinds-of-answer`
        - `a-engineering.a-diagnostics/filesystem:/var/lib/arwc-diagnostics/artifacts/two-kinds-of-answer`

        The private service-loader contract is `content.arwc-a-diagnostics.w24-1-two-kinds-of-answer`. It freezes accepted and denied requests, state transition, persistence, and evidence; it does not seed a successful result.
