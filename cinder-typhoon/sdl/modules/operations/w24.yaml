        component_refs:
        - features.a-engineering.a-diagnostics
      collection: require
      retention: require
      redaction: redact-secrets
      integrity: checksum
      required: true
      basis: observed
  c3:
    description: Recover the correct archive-unlock value and open the matching bundle within the allowance.
      These are one achievement. The bundle contains the retained diagnostic signer executable and signed
      records with their original metadata, providing W24.4's analysis material. Its unlock value is separate
      from diagnostic signing authority; no signing key or fresh authorization is awarded here.
    source_refs: &id003
    - features.a-engineering.a-diagnostics
    scope: Per-participant in-world evidence; no other participant state.
    boundary_kind: assertion_evaluation
    channel: other
    artifact_role: proposition_truth_evidence
    sensitivity: plain
    redaction: redact_secrets
    integrity: checksum
    retention: run_lifetime
    loss_disclosure: required
