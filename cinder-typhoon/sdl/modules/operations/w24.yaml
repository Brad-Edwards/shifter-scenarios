        names:
        - cinder.w24-3.satisfied
        component_refs:
        - features.a-engineering.a-diagnostics
      collection: require
      retention: require
      redaction: redact-secrets
      integrity: checksum
      required: true
      basis: observed
  c4:
    description: Produce an authorization accepted for the fresh request under the service's existing
      verification identity and retrieve the corresponding calibration-exception log. Replaying an old
      approval, substituting a trusted key, or using the archive-unlock value does not satisfy that request.
      Reconstructing the signer, obtaining signing capability, and its first successful use form one achievement.
      This authorization is scoped to the diagnostic export and does not supply W15.APPROVAL or CONTROL.
