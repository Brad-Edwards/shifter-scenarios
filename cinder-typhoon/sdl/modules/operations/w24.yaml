content:
  c1-records-1:
    type: dataset
    description: |-
      W24.1: required in-world starting records. Allocate each record to its actual owning service; this declaration does not duplicate secrets across services or grant their visibility.
      The legacy engineering recovery interface, its ordinary examples, the sealed diagnostic evidence bundle, the current project binding, and a bounded query allowance. The bundle's contents are not yet readable.
    target: a-engineering.a-diagnostics
    tags:
    - synthetic
    - w24
    - c1
    - seed-requirement
    items:
    - name: starting-records
      description: The legacy engineering recovery interface, its ordinary examples, the sealed diagnostic
        evidence bundle, the current project binding, and a bounded query allowance. The bundle's contents
        are not yet readable.
  c2-records-1:
    type: dataset
    description: |-
      W24.2: required in-world starting records. Allocate each record to its actual owning service; this declaration does not duplicate secrets across services or grant their visibility.
      The recovery contract and response classes earned in W24.1, the sealed diagnostic evidence bundle, the current project binding, and the bounded query allowance. The bundle's contents are not yet readable.
    target: a-engineering.a-diagnostics
    tags:
    - synthetic
    - w24
    - c2
    - seed-requirement
    items:
    - name: starting-records
      description: The recovery contract and response classes earned in W24.1, the sealed diagnostic evidence
        bundle, the current project binding, and the bounded query allowance. The bundle's contents are
        not yet readable.
  c3-records-1:
    type: dataset
    description: |-
      W24.3: required in-world starting records. Allocate each record to its actual owning service; this declaration does not duplicate secrets across services or grant their visibility.
      The legacy recovery interface and its response-selection capability earned in W24.2, the sealed diagnostic evidence bundle, a bounded query allowance, and the current project binding from W21.
    target: a-engineering.a-diagnostics
    tags:
    - synthetic
    - w24
    - c3
    - seed-requirement
    items:
    - name: starting-records
      description: The legacy recovery interface and its response-selection capability earned in W24.2,
        the sealed diagnostic evidence bundle, a bounded query allowance, and the current project binding
        from W21.
  c4-records-1:
    type: dataset
    description: |-
      W24.4: required in-world starting records. Allocate each record to its actual owning service; this declaration does not duplicate secrets across services or grant their visibility.
      W24.3's opened bundle supplies the retained signer executable and a finite set of signed diagnostic records with their original metadata. The service supplies its public verification contract, the current project binding, and a fresh read-only export request. The archive-unlock value is already held; the signing key, signing equations, and an authorization for this request are not supplied.
    target: a-engineering.a-diagnostics
    tags:
    - synthetic
    - w24
    - c4
    - seed-requirement
    items:
    - name: starting-records
      description: W24.3's opened bundle supplies the retained signer executable and a finite set of signed
        diagnostic records with their original metadata. The service supplies its public verification
        contract, the current project binding, and a fresh read-only export request. The archive-unlock
        value is already held; the signing key, signing equations, and an authorization for this request
        are not supplied.
