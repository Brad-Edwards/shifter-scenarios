    semantic_version: 1.0.0
    lifecycle_state: draft
    behavioral_granularity: aggregate
    procedure_basis: |-
      The authored condition is **bounded RSA response-class oracle**. RSA is 2048-bit with exponent 65537. Decode the predicted rotation before applying the four PKCS#1 v1.5 classes: A lacks 00 02, B has fewer than eight nonzero padding bytes, C lacks the separator or ENG1 tag, and D is structurally valid. Standard multiplicative blinding and Bleichenbacher interval narrowing must recover the unique ENG1 plaintext within the 4096-query per-instance budget; repeat ciphertexts and out-of-range integers consume budget and return no extra state. The hand build must preserve every named version, encoding, bound, validation order, identity, and unaffected field; substituting a generic vulnerable service would change the task.

