# In-world draft. Unspecified realization remains open.
name: cinder-k21
version: 0.1.0
semantic_revision: raes-progressive-semantics/v1
module:
  id: cinder-typhoon/k21
  version: 0.1.0
  exports:
    evidence_requirements:
    - c1
    - c2
    - c3
    propositions:
    - c1
    - c2
    - c3
    assertions:
    - c1-ready
    - c1-done
    - c2-ready
    - c2-done
    - c3-ready
    - c3-done
    objectives:
    - c1
    - c2
    - c3
    workflows:
    - c1
    - c2
    - c3
    action_contracts:
    - c1
    - c2
    - c3
    relationships:
    - c1-surface-1
    - c2-surface-1
    - c3-surface-1
    content:
    - c1-records-1
    - c2-records-1
    - c3-records-1
realization:
  default: open
evidence_requirements:
  c1:
    description: Recover the configuration and its actual context reference. This supplies the K24 configuration
      lead; no prompt attack is required.
    source_refs: &id001
    - features.k-cloud.k-assistant
    scope: Per-participant in-world evidence; no other participant state.
    boundary_kind: assertion_evaluation
    channel: other
    artifact_role: proposition_truth_evidence
    sensitivity: plain
    redaction: redact_secrets
    integrity: checksum
    retention: run_lifetime
    loss_disclosure: required
    observation_demand:
      rule_id: fact-k21-1
      scope: /features
      purpose: experimental
      mode: selected
      selector:
        semantic_scope: /features
        data_kind: artifact
        names:
        - cinder.k21-1.satisfied
        component_refs:
        - features.k-cloud.k-assistant
      collection: require
      retention: require
      redaction: redact-secrets
      integrity: checksum
      required: true
      basis: observed
  c2:
    description: Recover the retained conversation's actual case detail. The configuration from K21.1
      contains neither the conversation nor its answer.
    source_refs: &id002
    - features.k-cloud.k-assistant
    scope: Per-participant in-world evidence; no other participant state.
    boundary_kind: assertion_evaluation
    channel: other
    artifact_role: proposition_truth_evidence
    sensitivity: plain
    redaction: redact_secrets
    integrity: checksum
    retention: run_lifetime
    loss_disclosure: required
    observation_demand:
      rule_id: fact-k21-2
      scope: /features
      purpose: experimental
      mode: selected
      selector:
        semantic_scope: /features
        data_kind: artifact
        names:
        - cinder.k21-2.satisfied
        component_refs:
        - features.k-cloud.k-assistant
      collection: require
      retention: require
      redaction: redact-secrets
      integrity: checksum
      required: true
      basis: observed
  c3:
    description: Recover the actual synthetic escalation note, including the unresolved commissioning
      concern. Public ticket text or an invented account of the dispute does not satisfy the objective.
      Acceptance concerns the recovered evidence and its case binding, with no required conversational
      wording.
    source_refs: &id003
    - features.k-cloud.k-assistant
    scope: Per-participant in-world evidence; no other participant state.
    boundary_kind: assertion_evaluation
    channel: other
    artifact_role: proposition_truth_evidence
    sensitivity: plain
    redaction: redact_secrets
    integrity: checksum
    retention: run_lifetime
    loss_disclosure: required
    observation_demand:
      rule_id: fact-k21-3
      scope: /features
      purpose: experimental
      mode: selected
      selector:
        semantic_scope: /features
        data_kind: artifact
        names:
        - cinder.k21-3.satisfied
        component_refs:
        - features.k-cloud.k-assistant
      collection: require
      retention: require
      redaction: redact-secrets
      integrity: checksum
      required: true
      basis: observed
propositions:
  c1:
    description: Recover the configuration and its actual context reference. This supplies the K24 configuration
      lead; no prompt attack is required.
    subjects: *id001
    basis: observed_state
    predicate:
      kind: boolean
      property: cinder.k21-1.satisfied
      semantic_ref: urn:cinder-typhoon:fact:K21.1
      operator: equals
      expected: true
    evidence_requirements:
    - c1
    quantifier: all
  c2:
    description: Recover the retained conversation's actual case detail. The configuration from K21.1
      contains neither the conversation nor its answer.
    subjects: *id002
    basis: observed_state
    predicate:
      kind: boolean
      property: cinder.k21-2.satisfied
      semantic_ref: urn:cinder-typhoon:fact:K21.2
      operator: equals
      expected: true
    evidence_requirements:
    - c2
    quantifier: all
  c3:
    description: Recover the actual synthetic escalation note, including the unresolved commissioning
      concern. Public ticket text or an invented account of the dispute does not satisfy the objective.
      Acceptance concerns the recovered evidence and its case binding, with no required conversational
      wording.
    subjects: *id003
    basis: observed_state
    predicate:
      kind: boolean
      property: cinder.k21-3.satisfied
      semantic_ref: urn:cinder-typhoon:fact:K21.3
      operator: equals
      expected: true
    evidence_requirements:
    - c3
    quantifier: all
assertions:
  c1-ready:
    proposition: c1
    role: precondition
    polarity: positive
  c1-done:
    proposition: c1
    role: postcondition
    polarity: positive
  c2-ready:
    proposition: c2
    role: precondition
    polarity: positive
  c2-done:
    proposition: c2
    role: postcondition
    polarity: positive
  c3-ready:
    proposition: c3
    role: precondition
    polarity: positive
  c3-done:
    proposition: c3
    role: postcondition
    polarity: positive
objectives:
  c1:
    name: 'K21.1: The policy beside the prompt'
    description: |-
      Recover the support assistant's exposed configuration and identify the restricted support context attached to it.

      Introduces the in-story assistant as an ordinary application with data boundaries.
    agent: participant.operator
    actions:
    - k21.c1
    targets: &id004
    - features.k-cloud.k-assistant
    success:
      mode: all_of
      assertions:
      - c1-done
    window:
      workflows:
      - k21.c1
  c2:
    name: 'K21.2: A conversation kept too long'
    description: |-
      Recover the separately retained support conversation and the unpublished case detail it contains.

      Provides a distinct privacy failure with a useful case clue.
    agent: participant.operator
    actions:
    - k21.c2
    targets: &id005
    - features.k-cloud.k-assistant
    success:
      mode: all_of
      assertions:
      - c2-done
    window:
      workflows:
      - k21.c2
  c3:
    name: 'K21.3: The answer it should withhold'
    description: |-
      Recover the support engineer's private escalation note about ARWC from the assistant's case context, although the assistant's ordinary support role should withhold it.

      Produces a bounded information result from an assistant trust failure.
    agent: participant.operator
    actions:
    - k21.c3
    targets: &id006
    - features.k-cloud.k-assistant
    success:
      mode: all_of
      assertions:
      - c3-done
    window:
      workflows:
      - k21.c3
workflows:
  c1:
    description: 'K21.1: availability follows the evidence/authority alternatives. This independent objective
      may be revisited when facts change; no campaign-wide sequence or deadline is imposed.'
    start: requirements
    steps:
      requirements:
        type: switch
        cases:
        - when:
            assertions:
            - capabilities.g01-ready
          next: attempt
        default: unavailable
      available:
        type: end
      unavailable:
        type: end
      attempt:
        type: objective
        execution_mode: objective
        objective: k21.c1
        on_success: available
        on_failure: unavailable
  c2:
    description: 'K21.2: availability follows the evidence/authority alternatives. This independent objective
      may be revisited when facts change; no campaign-wide sequence or deadline is imposed.'
    start: requirements
    steps:
      requirements:
        type: switch
        cases:
        - when:
            assertions:
            - capabilities.g01-ready
          next: attempt
        default: unavailable
      available:
        type: end
      unavailable:
        type: end
      attempt:
        type: objective
        execution_mode: objective
        objective: k21.c2
        on_success: available
        on_failure: unavailable
  c3:
    description: 'K21.3: availability follows the evidence/authority alternatives. This independent objective
      may be revisited when facts change; no campaign-wide sequence or deadline is imposed.'
    start: requirements
    steps:
      requirements:
        type: switch
        cases:
        - when:
            assertions:
            - k21.c1-ready
          next: attempt
        default: unavailable
      available:
        type: end
      unavailable:
        type: end
      attempt:
        type: objective
        execution_mode: objective
        objective: k21.c3
        on_success: available
        on_failure: unavailable
