# In-world draft. Unspecified realization remains open.
name: cinder-k21
version: 0.1.0
semantic_revision: raes-progressive-semantics/v1
module:
  id: cinder-typhoon/k21
  version: 0.1.0
  exports:
    evidence_requirements:
    - c1
    - c2
    - c3
    propositions:
    - c1
    - c2
    - c3
    assertions:
    - c1-ready
    - c1-done
    - c2-ready
    - c2-done
    - c3-ready
    - c3-done
    objectives:
    - c1
    - c2
    - c3
    workflows:
    - c1
    - c2
    - c3
    action_contracts:
    - c1
    - c2
    - c3
realization:
  default: open
evidence_requirements:
  c1:
    description: |-
      Recover the configuration and its actual context reference. This supplies the K24 configuration lead; no prompt attack is required.

      Required technical proof: Completion is observed by the owning service from the fresh result and its immutable audit correlation. The evidence binds the participant, accepted identity or job, exact input and output identifiers, relevant revision or digest, and destination-side observation where a second service consumes the result. Objective evaluation does not create the result or grant authority.
    source_refs:
    - features.k-cloud.k-assistant
    scope: Per-participant in-world evidence; no other participant state.
    boundary_kind: assertion_evaluation
    channel: other
    artifact_role: proposition_truth_evidence
    sensitivity: plain
    redaction: redact_secrets
    integrity: checksum
    retention: run_lifetime
    loss_disclosure: required
    observation_demand:
      rule_id: fact-k21-1
      scope: /features
      purpose: experimental
      mode: selected
      selector:
        semantic_scope: /features
        data_kind: artifact
        names:
        - cinder.k21-1.satisfied
        component_refs:
        - features.k-cloud.k-assistant
      collection: require
      retention: require
      redaction: redact-secrets
      integrity: checksum
      required: true
      basis: observed
    notes:
    - 'Author checks: Verify the normal baseline, the exact intended path, and the fresh evidence described above.
      Reject a wrong identifier, revision, digest, tenant, identity, stale result, or cross-participant reference.
      Verify unrelated records and permissions remain unchanged and that the result remains recognizable and usable
      by every declared downstream consumer.'
  c2:
    description: |-
      Recover the retained conversation's actual case detail. The configuration from K21.1 contains neither the conversation nor its answer.

      Required technical proof: Completion is observed by the owning service from the fresh result and its immutable audit correlation. The evidence binds the participant, accepted identity or job, exact input and output identifiers, relevant revision or digest, and destination-side observation where a second service consumes the result. Objective evaluation does not create the result or grant authority.
    source_refs:
    - features.k-cloud.k-assistant
    scope: Per-participant in-world evidence; no other participant state.
    boundary_kind: assertion_evaluation
    channel: other
    artifact_role: proposition_truth_evidence
    sensitivity: plain
    redaction: redact_secrets
    integrity: checksum
    retention: run_lifetime
    loss_disclosure: required
    observation_demand:
      rule_id: fact-k21-2
      scope: /features
      purpose: experimental
      mode: selected
      selector:
        semantic_scope: /features
        data_kind: artifact
        names:
        - cinder.k21-2.satisfied
        component_refs:
        - features.k-cloud.k-assistant
      collection: require
      retention: require
      redaction: redact-secrets
      integrity: checksum
      required: true
      basis: observed
    notes:
    - 'Author checks: Verify the normal baseline, the exact intended path, and the fresh evidence described above.
      Reject a wrong identifier, revision, digest, tenant, identity, stale result, or cross-participant reference.
      Verify unrelated records and permissions remain unchanged and that the result remains recognizable and usable
      by every declared downstream consumer.'
  c3:
    description: |-
      Recover the actual synthetic escalation note, including the unresolved commissioning concern. Public ticket text or an invented account of the dispute does not satisfy the objective. Acceptance concerns the recovered evidence and its case binding, with no required conversational wording.

      Required technical proof: Completion is observed by the owning service from the fresh result and its immutable audit correlation. The evidence binds the participant, accepted identity or job, exact input and output identifiers, relevant revision or digest, and destination-side observation where a second service consumes the result. Objective evaluation does not create the result or grant authority.
    source_refs:
    - features.k-cloud.k-assistant
    scope: Per-participant in-world evidence; no other participant state.
    boundary_kind: assertion_evaluation
    channel: other
    artifact_role: proposition_truth_evidence
    sensitivity: plain
    redaction: redact_secrets
    integrity: checksum
    retention: run_lifetime
    loss_disclosure: required
    observation_demand:
      rule_id: fact-k21-3
      scope: /features
      purpose: experimental
      mode: selected
      selector:
        semantic_scope: /features
        data_kind: artifact
        names:
        - cinder.k21-3.satisfied
        component_refs:
        - features.k-cloud.k-assistant
      collection: require
      retention: require
      redaction: redact-secrets
      integrity: checksum
      required: true
      basis: observed
    notes:
    - 'Author checks: Verify the normal baseline, the exact intended path, and the fresh evidence described above.
      Reject a wrong identifier, revision, digest, tenant, identity, stale result, or cross-participant reference.
      Verify unrelated records and permissions remain unchanged and that the result remains recognizable and usable
      by every declared downstream consumer.'
propositions:
  c1:
    description: Recover the configuration and its actual context reference. This supplies the K24 configuration
      lead; no prompt attack is required.
    subjects:
    - features.k-cloud.k-assistant
    basis: observed_state
    predicate:
      kind: boolean
      property: cinder.k21-1.satisfied
      semantic_ref: urn:cinder-typhoon:fact:K21.1
      operator: equals
      expected: true
    evidence_requirements:
    - c1
    quantifier: all
  c2:
    description: Recover the retained conversation's actual case detail. The configuration from K21.1 contains neither
      the conversation nor its answer.
    subjects:
    - features.k-cloud.k-assistant
    basis: observed_state
    predicate:
      kind: boolean
      property: cinder.k21-2.satisfied
      semantic_ref: urn:cinder-typhoon:fact:K21.2
      operator: equals
      expected: true
    evidence_requirements:
    - c2
    quantifier: all
  c3:
    description: Recover the actual synthetic escalation note, including the unresolved commissioning concern. Public
      ticket text or an invented account of the dispute does not satisfy the objective. Acceptance concerns the
      recovered evidence and its case binding, with no required conversational wording.
    subjects:
    - features.k-cloud.k-assistant
    basis: observed_state
    predicate:
      kind: boolean
      property: cinder.k21-3.satisfied
      semantic_ref: urn:cinder-typhoon:fact:K21.3
      operator: equals
      expected: true
    evidence_requirements:
    - c3
    quantifier: all
assertions:
  c1-ready:
    proposition: c1
    role: precondition
    polarity: positive
  c1-done:
    proposition: c1
    role: postcondition
    polarity: positive
  c2-ready:
    proposition: c2
    role: precondition
    polarity: positive
  c2-done:
    proposition: c2
    role: postcondition
    polarity: positive
  c3-ready:
    proposition: c3
    role: precondition
    polarity: positive
  c3-done:
    proposition: c3
    role: postcondition
    polarity: positive
objectives:
  c1:
    name: 'K21.1: The policy beside the prompt'
    description: |-
      Recover the support assistant's exposed configuration and identify the restricted support context attached to it.

      Introduces the in-story assistant as an ordinary application with data boundaries.
    agent: participant.operator
    actions:
    - k21.c1
    targets:
    - features.k-cloud.k-assistant
    success:
      mode: all_of
      assertions:
      - c1-done
    window:
      workflows:
      - k21.c1
  c2:
    name: 'K21.2: A conversation kept too long'
    description: |-
      Recover the separately retained support conversation and the unpublished case detail it contains.

      Provides a distinct privacy failure with a useful case clue.
    agent: participant.operator
    actions:
    - k21.c2
    targets:
    - features.k-cloud.k-assistant
    success:
      mode: all_of
      assertions:
      - c2-done
    window:
      workflows:
      - k21.c2
  c3:
    name: 'K21.3: The answer it should withhold'
    description: |-
      Recover the support engineer's private escalation note about ARWC from the assistant's case context, although the assistant's ordinary support role should withhold it.

      Produces a bounded information result from an assistant trust failure.
    agent: participant.operator
    actions:
    - k21.c3
    targets:
    - features.k-cloud.k-assistant
    success:
      mode: all_of
      assertions:
      - c3-done
    window:
      workflows:
      - k21.c3
workflows:
  c1:
    description: 'K21.1: availability follows the evidence/authority alternatives. This independent objective may
      be revisited when facts change; no campaign-wide sequence or deadline is imposed.'
    start: requirements
    steps:
      requirements:
        type: switch
        cases:
        - when:
            assertions:
            - capabilities.g01-ready
          next: attempt
        default: unavailable
      available:
        type: end
      unavailable:
        type: end
      attempt:
        type: objective
        execution_mode: objective
        objective: k21.c1
        on_success: available
        on_failure: unavailable
  c2:
    description: 'K21.2: availability follows the evidence/authority alternatives. This independent objective may
      be revisited when facts change; no campaign-wide sequence or deadline is imposed.'
    start: requirements
    steps:
      requirements:
        type: switch
        cases:
        - when:
            assertions:
            - capabilities.g01-ready
          next: attempt
        default: unavailable
      available:
        type: end
      unavailable:
        type: end
      attempt:
        type: objective
        execution_mode: objective
        objective: k21.c2
        on_success: available
        on_failure: unavailable
  c3:
    description: 'K21.3: availability follows the evidence/authority alternatives. This independent objective may
      be revisited when facts change; no campaign-wide sequence or deadline is imposed.'
    start: requirements
    steps:
      requirements:
        type: switch
        cases:
        - when:
            assertions:
            - k21.c1-ready
          next: attempt
        default: unavailable
      available:
        type: end
      unavailable:
        type: end
      attempt:
        type: objective
        execution_mode: objective
        objective: k21.c3
        on_success: available
        on_failure: unavailable
action_contracts:
  c1:
    semantic_version: 1.0.0
    lifecycle_state: draft
    behavioral_granularity: aggregate
    procedure_basis: 'The intended path is limited to the authored software, data, configuration, identity, permission,
      or state described above. The participant must exercise that real condition through the declared service interface
      and produce this result: Config/context-reference read. Merely describing the condition, editing a local copy,
      or presenting a value obtained from another surface does not satisfy the contract.'
    realization_profile: backend-declared
    fidelity_claim: The exact starting state, service transition, denial cases, participant-state persistence, and
      independently owned evidence are required. Backend choices remain open only where they cannot change those
      facts.
    preconditions:
    - precondition_id: eligibility
      precondition_class: authority
      description: Satisfy one complete alternative in the referenced workflow and obtain the required scoped access
        to every listed surface.
      support_refs:
      - workflows.k21.c1
      - features.k-cloud.k-assistant
    - precondition_id: normal-surface
      precondition_class: target
      description: '`k-assistant` owns this part of the operation. Its starting state is exact: Public static bundle
        references exposed /api/config; config names context ctx-support-private-v4, retrieval collection and policy
        version. The owning service uses the listener, route, identity, authorization, storage, and audit contract
        declared in the corresponding world module. Records that are not explicitly mutable remain immutable. The
        private service-loader contract `content.keplerops-k-assistant.k21-1-the-policy-beside-the-prompt` freezes
        the request, denial, state-transition, evidence, and any exploit-critical implementation details.'
      support_refs:
      - features.k-cloud.k-assistant
      - content.keplerops-k-assistant.k21-1-the-policy-beside-the-prompt
    - precondition_id: scope-and-persistence
      precondition_class: realization
      description: Lead to K24. Participant-created service state persists for the life of the participant world
        and ordinary retries do not erase it. The selected route cannot act on unrelated tenants, records, packages,
        identities, jobs, or services. Infrastructure recovery and submission adjudication are outside this in-world
        contract.
      support_refs:
      - features.k-cloud.k-assistant
    effects:
    - effect_id: outcome
      effect_class: intended_effect
      description: Recover the configuration and its actual context reference. This supplies the K24 configuration
        lead; no prompt attack is required.
      target_refs:
      - features.k-cloud.k-assistant
      evidence_refs:
      - evidence_requirements.k21.c1
    failure_classes:
    - precondition_unsatisfied
    - authority_denied
    - target_unavailable
    - partial_success
    - backend_error
    - unknown
  c2:
    semantic_version: 1.0.0
    lifecycle_state: draft
    behavioral_granularity: aggregate
    procedure_basis: 'The intended path is limited to the authored software, data, configuration, identity, permission,
      or state described above. The participant must exercise that real condition through the declared service interface
      and produce this result: Retained-conversation read. Merely describing the condition, editing a local copy,
      or presenting a value obtained from another surface does not satisfy the contract.'
    realization_profile: backend-declared
    fidelity_claim: The exact starting state, service transition, denial cases, participant-state persistence, and
      independently owned evidence are required. Backend choices remain open only where they cannot change those
      facts.
    preconditions:
    - precondition_id: eligibility
      precondition_class: authority
      description: Satisfy one complete alternative in the referenced workflow and obtain the required scoped access
        to every listed surface.
      support_refs:
      - workflows.k21.c2
      - features.k-cloud.k-assistant
    - precondition_id: normal-surface
