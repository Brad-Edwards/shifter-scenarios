    description: |-
      K21.1: required in-world starting records. Allocate each record to its actual owning service; this declaration does not duplicate secrets across services or grant their visibility.
      The repository's support-assistant references, retained assistant artifacts, and its ordinary support interface.
    target: k-cloud.k-assistant
    tags:
    - synthetic
    - k21
    - c1
    - seed-requirement
    items:
    - name: starting-records
      description: The repository's support-assistant references, retained assistant artifacts, and its
