evidence_requirements:
  c1:
    description: Recover the unpublished job record and dataset binding. The job is a lead, not the collection
      itself.
    source_refs: &id001
    - features.k-cloud.k-data
    scope: Per-participant in-world evidence; no other participant state.
    boundary_kind: assertion_evaluation
    channel: other
    artifact_role: proposition_truth_evidence
    sensitivity: plain
    redaction: redact_secrets
    integrity: checksum
    retention: run_lifetime
    loss_disclosure: required
    observation_demand:
      rule_id: fact-k15-1
      scope: /features
      purpose: experimental
      mode: selected
      selector:
        semantic_scope: /features
        data_kind: artifact
        names:
        - cinder.k15-1.satisfied
        component_refs:
        - features.k-cloud.k-data
      collection: require
      retention: require
      redaction: redact-secrets
      integrity: checksum
      required: true
      basis: observed
  c2:
    description: Recover the protected job definition and its source boundaries. This does not yet change
      the destination or retrieve the collection.
    source_refs: &id002
    - features.k-cloud.k-data
    scope: Per-participant in-world evidence; no other participant state.
    boundary_kind: assertion_evaluation
    channel: other
    artifact_role: proposition_truth_evidence
