objectives:
  c1:
    name: 'K15.1: An export in progress'
    description: |-
      Recover the export job that support started for its unresolved customer case. Identify the actual dataset and job revision.

      Gives cloud collection a legitimate business workflow and a specific target.
    agent: participant.operator
    actions:
    - k15.c1
    targets: &id005
    - features.k-cloud.k-data
    success:
      mode: all_of
      assertions:
      - c1-done
    window:
      workflows:
      - k15.c1
  c2:
    name: 'K15.2: A job outside your account'
    description: |-
      Obtain the restricted export definition for the customer's job even though your identity does not own it.

      Establishes a distinct authorization breach in export administration.
    agent: participant.operator
    actions:
    - k15.c2
    targets: &id006
    - features.k-cloud.k-data
    success:
      mode: all_of
      assertions:
      - c2-done
    window:
      workflows:
      - k15.c2
  c3:
    name: 'K15.3: Change the handover point'
    description: |-
      Use the available delegated job rights to redirect the export handover while keeping the customer's job valid.

      Changes a business workflow's data destination.
    agent: participant.operator
    actions:
    - k15.c3
    targets: &id007
    - features.k-cloud.k-data
    success:
      mode: all_of
      assertions:
      - c3-done
    window:
      workflows:
      - k15.c3
  c4:
    name: 'K15.4: The right customer''s collection'
    description: |-
      Recover the ARWC collection from the handed-over export material. Resolve its partition and revision records so the result belongs to the current customer binding.

      Produces useful customer intelligence, not merely a downloaded archive.
    agent: participant.operator
    actions:
    - k15.c4
    targets: &id008
    - features.k-cloud.k-data
    success:
      mode: all_of
      assertions:
      - c4-done
    window:
      workflows:
      - k15.c4
workflows:
  c1:
    description: 'K15.1: availability follows the evidence/authority alternatives. This independent objective
      may be revisited when facts change; no campaign-wide sequence or deadline is imposed.'
    start: requirements
    steps:
      requirements:
        type: switch
        cases:
        - when:
            assertions:
            - k13.c4-ready
          next: attempt
        - when:
            assertions:
            - k17.c1-ready
          next: attempt
        default: unavailable
      available:
        type: end
      unavailable:
        type: end
      attempt:
        type: objective
        execution_mode: objective
        objective: k15.c1
        on_success: available
        on_failure: unavailable
  c2:
    description: 'K15.2: availability follows the evidence/authority alternatives. This independent objective
      may be revisited when facts change; no campaign-wide sequence or deadline is imposed.'
    start: requirements
    steps:
      requirements:
        type: switch
        cases:
        - when:
            assertions:
            - k15.c1-ready
          next: attempt
        default: unavailable
      available:
        type: end
      unavailable:
        type: end
      attempt:
        type: objective
        execution_mode: objective
        objective: k15.c2
        on_success: available
        on_failure: unavailable
  c3:
    description: 'K15.3: availability follows the evidence/authority alternatives. This independent objective
      may be revisited when facts change; no campaign-wide sequence or deadline is imposed.'
    start: requirements
    steps:
      requirements:
        type: switch
        cases:
        - when:
            assertions:
            - k15.c2-ready
          next: attempt
        default: unavailable
      available:
        type: end
      unavailable:
        type: end
      attempt:
        type: objective
        execution_mode: objective
        objective: k15.c3
        on_success: available
        on_failure: unavailable
  c4:
    description: 'K15.4: availability follows the evidence/authority alternatives. This independent objective
      may be revisited when facts change; no campaign-wide sequence or deadline is imposed.'
    start: requirements
    steps:
      requirements:
        type: switch
        cases:
        - when:
            assertions:
            - k15.c3-ready
            - capabilities.g02-ready
          next: attempt
        default: unavailable
      available:
        type: end
      unavailable:
        type: end
      attempt:
        type: objective
        execution_mode: objective
        objective: k15.c4
        on_success: available
        on_failure: unavailable
