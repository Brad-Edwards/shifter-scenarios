action_contracts:
  c1:
    semantic_version: 1.0.0
    lifecycle_state: draft
    behavioral_granularity: aggregate
    procedure_basis: 'The intended path is limited to the authored software, data, configuration, identity, permission,
      or state described above. The participant must exercise that real condition through the declared service interface
      and produce this result: Job-summary read. Merely describing the condition, editing a local copy, or presenting
      a value obtained from another surface does not satisfy the contract.'
    realization_profile: backend-declared
    fidelity_claim: The exact starting state, service transition, denial cases, participant-state persistence, and
      independently owned evidence are required. Backend choices remain open only where they cannot change those
      facts.
    preconditions:
    - precondition_id: eligibility
      precondition_class: authority
      description: Satisfy one complete alternative in the referenced workflow and obtain the required scoped access
        to every listed surface.
      support_refs:
      - workflows.k15.c1
      - features.k-cloud.k-data
    - precondition_id: normal-surface
      precondition_class: target
      description: '`k-data` owns this part of the operation. Its starting state is exact: SUP-2841 references unpublished
        job EXP-2841, dataset support-case-history, revision 6. The owning service uses the listener, route, identity,
        authorization, storage, and audit contract declared in the corresponding world module. Records that are
        not explicitly mutable remain immutable. The private service-loader contract `content.keplerops-k-data.k15-1-an-export-in-progress`
        freezes the request, denial, state-transition, evidence, and any exploit-critical implementation details.'
      support_refs:
      - features.k-cloud.k-data
      - content.keplerops-k-data.k15-1-an-export-in-progress
    - precondition_id: scope-and-persistence
      precondition_class: realization
      description: Lead only. Participant-created service state persists for the life of the participant world and
        ordinary retries do not erase it. The selected route cannot act on unrelated tenants, records, packages,
        identities, jobs, or services. Infrastructure recovery and submission adjudication are outside this in-world
        contract.
      support_refs:
      - features.k-cloud.k-data
    effects:
    - effect_id: outcome
      effect_class: intended_effect
      description: Recover the unpublished job record and dataset binding. The job is a lead, not the collection
        itself.
      target_refs:
      - features.k-cloud.k-data
      evidence_refs:
