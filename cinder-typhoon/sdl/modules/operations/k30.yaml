objectives:
  c1:
    name: 'K30.1: Authority over the backup'
    description: |-
      Recover the scoped backup principal from the build records and establish its allowed operation while direct access to the source database remains denied.

      Introduces a separate control-plane capability over protected history.
    agent: participant.operator
    actions:
    - k30.c1
    targets:
    - features.k-cloud.k-cloud-api--build-records
    - features.k-cloud.k-data--backup
    success:
      mode: all_of
      assertions:
      - c1-done
    window:
      workflows:
      - k30.c1
  c2:
    name: 'K30.2: The database you cannot reach'
    description: |-
      Recover the protected historical records using the authority you have over their backup, without gaining direct access to the source database.

      Completes a substantive cloud-data compromise through a different trust boundary.
    agent: participant.operator
    actions:
    - k30.c2
    targets:
    - features.k-cloud.k-data--backup
    success:
      mode: all_of
      assertions:
      - c2-done
    window:
      workflows:
      - k30.c2
  c3:
    name: 'K30.3: Before ARWC changed its name'
    description: |-
      Identify ARWC's correct migration record within the recovered history and connect its older identifiers to the active customer integration.

      Explains why supplier and plant records describe the same installation differently.
    agent: participant.operator
    actions:
    - k30.c3
    targets:
    - features.k-cloud.k-data--backup
    success:
      mode: all_of
      assertions:
      - c3-done
    window:
      workflows:
      - k30.c3
workflows:
  c1:
    description: 'K30.1: availability follows the evidence/authority alternatives. This independent objective may
      be revisited when facts change; no campaign-wide sequence or deadline is imposed.'
    start: requirements
    steps:
      requirements:
        type: switch
        cases:
        - when:
            assertions:
            - k13.c4-ready
          next: attempt
        - when:
            assertions:
            - k09.c4-ready
          next: attempt
        default: unavailable
      available:
        type: end
      unavailable:
        type: end
      attempt:
        type: objective
        execution_mode: objective
        objective: k30.c1
        on_success: available
        on_failure: unavailable
  c2:
    description: 'K30.2: availability follows the evidence/authority alternatives. This independent objective may
      be revisited when facts change; no campaign-wide sequence or deadline is imposed.'
    start: requirements
    steps:
      requirements:
        type: switch
        cases:
        - when:
            assertions:
            - k30.c1-ready
          next: attempt
        default: unavailable
      available:
        type: end
      unavailable:
        type: end
      attempt:
        type: objective
        execution_mode: objective
        objective: k30.c2
        on_success: available
        on_failure: unavailable
  c3:
    description: 'K30.3: availability follows the evidence/authority alternatives. This independent objective may
      be revisited when facts change; no campaign-wide sequence or deadline is imposed.'
    start: requirements
    steps:
      requirements:
        type: switch
        cases:
        - when:
            assertions:
            - k30.c2-ready
            - capabilities.g02-ready
          next: attempt
        default: unavailable
      available:
        type: end
      unavailable:
        type: end
      attempt:
        type: objective
        execution_mode: objective
        objective: k30.c3
        on_success: available
        on_failure: unavailable
action_contracts:
  c1:
    semantic_version: 1.0.0
    lifecycle_state: draft
    behavioral_granularity: aggregate
    procedure_basis: 'The intended path is limited to the authored software, data, configuration, identity, permission,
      or state described above. The participant must exercise that real condition through the declared service interface
      and produce this result: Backup session and catalog probe succeed while direct source query is denied and
      audited. Merely describing the condition, editing a local copy, or presenting a value obtained from another
      surface does not satisfy the contract.'
    realization_profile: backend-declared
    fidelity_claim: The exact starting state, service transition, denial cases, participant-state persistence, and
      independently owned evidence are required. Backend choices remain open only where they cannot change those
      facts.
    preconditions:
    - precondition_id: eligibility
      precondition_class: authority
      description: Satisfy one complete alternative in the referenced workflow and obtain the required scoped access
        to every listed surface.
      support_refs:
      - workflows.c1
      - features.k-cloud.k-cloud-api--build-records
      - features.k-cloud.k-data--backup
    - precondition_id: normal-surface
      precondition_class: target
      description: '`k-data` owns this part of the operation. Its starting state is exact: Authenticated build record
        names svc-history-recovery, backup BAK-2026-021 and allowed restore operation; source DB explicitly denies
        principal. The owning service uses the listener, route, identity, authorization, storage, and audit contract
        declared in the corresponding world module. Records that are not explicitly mutable remain immutable. The
        private service-loader contract `content.keplerops-k-data.k30-1-authority-over-the-backup` freezes the request,
        denial, state-transition, evidence, and any exploit-critical implementation details.'
      support_refs:
      - features.k-cloud.k-cloud-api--build-records
      - features.k-cloud.k-data--backup
      - content.keplerops-k-data.k30-1-authority-over-the-backup
    - precondition_id: scope-and-persistence
      precondition_class: realization
      description: Input to K30.2 Participant-created service state persists for the life of the participant world
        and ordinary retries do not erase it. The action is limited to the exact records, identities, routes, and
        destination effects declared here; unrelated tenants and services remain denied. Infrastructure recovery
        and submission adjudication are outside this in-world contract.
      support_refs:
      - features.k-cloud.k-cloud-api--build-records
      - features.k-cloud.k-data--backup
