    quantifier: all
assertions:
  c1-ready:
    proposition: c1
    role: precondition
    polarity: positive
  c1-done:
    proposition: c1
    role: postcondition
    polarity: positive
  c2-ready:
    proposition: c2
    role: precondition
    polarity: positive
  c2-done:
    proposition: c2
    role: postcondition
    polarity: positive
  c3-ready:
    proposition: c3
    role: precondition
    polarity: positive
  c3-done:
    proposition: c3
    role: postcondition
    polarity: positive
objectives:
  c1:
    name: 'K30.1: Authority over the backup'
    description: |-
      Recover the scoped backup principal from the build records and establish its allowed operation while direct access to the source database remains denied.

      Introduces a separate control-plane capability over protected history.
    agent: participant.operator
    actions:
    - k30.c1
    targets: &id004
    - features.k-cloud.k-cloud-api--build-records
    success:
      mode: all_of
      assertions:
      - c1-done
    window:
      workflows:
      - k30.c1
  c2:
    name: 'K30.2: The database you cannot reach'
    description: |-
      Recover the protected historical records using the authority you have over their backup, without gaining direct access to the source database.

      Completes a substantive cloud-data compromise through a different trust boundary.
    agent: participant.operator
    actions:
    - k30.c2
    targets: &id005
    - features.k-cloud.k-data--backup
    success:
      mode: all_of
      assertions:
      - c2-done
    window:
      workflows:
      - k30.c2
  c3:
    name: 'K30.3: Before ARWC changed its name'
    description: |-
      Identify ARWC's correct migration record within the recovered history and connect its older identifiers to the active customer integration.

      Explains why supplier and plant records describe the same installation differently.
    agent: participant.operator
    actions:
    - k30.c3
    targets: &id006
    - features.k-cloud.k-data--backup
    success:
      mode: all_of
      assertions:
      - c3-done
    window:
      workflows:
      - k30.c3
workflows:
  c1:
    description: 'K30.1: availability follows the evidence/authority alternatives. This independent objective
      may be revisited when facts change; no campaign-wide sequence or deadline is imposed.'
    start: requirements
    steps:
      requirements:
        type: switch
        cases:
        - when:
            assertions:
            - k13.c4-ready
          next: attempt
        - when:
            assertions:
            - k09.c4-ready
          next: attempt
        default: unavailable
      available:
        type: end
      unavailable:
        type: end
      attempt:
        type: objective
        execution_mode: objective
        objective: k30.c1
        on_success: available
        on_failure: unavailable
  c2:
    description: 'K30.2: availability follows the evidence/authority alternatives. This independent objective
      may be revisited when facts change; no campaign-wide sequence or deadline is imposed.'
    start: requirements
    steps:
      requirements:
        type: switch
        cases:
        - when:
            assertions:
            - k30.c1-ready
          next: attempt
        default: unavailable
      available:
        type: end
      unavailable:
        type: end
      attempt:
        type: objective
        execution_mode: objective
        objective: k30.c2
        on_success: available
        on_failure: unavailable
  c3:
    description: 'K30.3: availability follows the evidence/authority alternatives. This independent objective
      may be revisited when facts change; no campaign-wide sequence or deadline is imposed.'
    start: requirements
    steps:
      requirements:
        type: switch
        cases:
        - when:
            assertions:
            - k30.c2-ready
            - capabilities.g02-ready
          next: attempt
        default: unavailable
      available:
        type: end
      unavailable:
        type: end
      attempt:
        type: objective
        execution_mode: objective
        objective: k30.c3
        on_success: available
        on_failure: unavailable
