        component_refs:
        - features.k-cloud.k-data--backup
      collection: require
      retention: require
      redaction: redact-secrets
      integrity: checksum
      required: true
      basis: observed
  c3:
    description: Recover the migration record matching G02's current tenant and revision. It supplies
      historical provenance, not a substitute for W21's current deployed revision.
    source_refs: &id003
    - features.k-cloud.k-data--backup
    scope: Per-participant in-world evidence; no other participant state.
    boundary_kind: assertion_evaluation
    channel: other
    artifact_role: proposition_truth_evidence
    sensitivity: plain
    redaction: redact_secrets
    integrity: checksum
    retention: run_lifetime
    loss_disclosure: required
    observation_demand:
      rule_id: fact-k30-3
      scope: /features
      purpose: experimental
      mode: selected
      selector:
        semantic_scope: /features
        data_kind: artifact
        names:
        - cinder.k30-3.satisfied
        component_refs:
        - features.k-cloud.k-data--backup
      collection: require
      retention: require
      redaction: redact-secrets
      integrity: checksum
      required: true
      basis: observed
propositions:
  c1:
    description: Demonstrate the backup principal's permitted scope and the continuing source-data restriction.
      Finding the catalog alone does not count.
    subjects: *id001
    basis: observed_state
    predicate:
      kind: boolean
      property: cinder.k30-1.satisfied
      semantic_ref: urn:cinder-typhoon:fact:K30.1
      operator: equals
      expected: true
    evidence_requirements:
    - c1
    quantifier: all
  c2:
    description: Recover the actual protected record set. All necessary recovery and access work earns
      one score; creating a data copy without reading it is insufficient.
    subjects: *id002
    basis: observed_state
    predicate:
      kind: boolean
      property: cinder.k30-2.satisfied
      semantic_ref: urn:cinder-typhoon:fact:K30.2
      operator: equals
      expected: true
    evidence_requirements:
    - c2
    quantifier: all
  c3:
    description: Recover the migration record matching G02's current tenant and revision. It supplies
      historical provenance, not a substitute for W21's current deployed revision.
    subjects: *id003
    basis: observed_state
    predicate:
      kind: boolean
      property: cinder.k30-3.satisfied
      semantic_ref: urn:cinder-typhoon:fact:K30.3
      operator: equals
      expected: true
