content:
  c1-records-1:
    type: dataset
    description: |-
      K30.1: required in-world starting records. Allocate each record to its actual owning service; this declaration does not duplicate secrets across services or grant their visibility.
      The earned workload identity's authenticated build-record view, a backup-catalog lead, and records describing the protected history. K09.1 and K13.1 can reveal the lead earlier but supply no authenticated workload context.
    target: k-cloud.k-cloud-api
    tags:
    - synthetic
    - k30
    - c1
    - seed-requirement
    items:
    - name: starting-records
      description: The earned workload identity's authenticated build-record view, a backup-catalog lead,
        and records describing the protected history. K09.1 and K13.1 can reveal the lead earlier but
        supply no authenticated workload context.
  c2-records-1:
