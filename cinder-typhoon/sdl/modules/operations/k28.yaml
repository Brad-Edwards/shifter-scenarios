    description: Recover the actual behavior distinction and its relevant runtime condition. A binary filename or
      unexplained crash is insufficient.
    subjects:
    - features.k-delivery.k-source
    basis: observed_state
    predicate:
      kind: boolean
      property: cinder.k28-1.satisfied
      semantic_ref: urn:cinder-typhoon:fact:K28.1
      operator: equals
      expected: true
    evidence_requirements:
