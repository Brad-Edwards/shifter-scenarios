      collection: require
      retention: require
      redaction: redact-secrets
      integrity: checksum
      required: true
      basis: observed
propositions:
  c1:
    description: Recover the actual behavior distinction and its relevant runtime condition. A binary
      filename or unexplained crash is insufficient.
    subjects: *id001
    basis: observed_state
    predicate:
      kind: boolean
      property: cinder.k28-1.satisfied
      semantic_ref: urn:cinder-typhoon:fact:K28.1
      operator: equals
      expected: true
    evidence_requirements:
    - c1
    quantifier: all
  c2:
    description: Produce the correct diagnostic transformation for the supplied distinguishing inputs.
      Merely identifying a loader feature does not count.
    subjects: *id002
    basis: observed_state
    predicate:
      kind: boolean
      property: cinder.k28-2.satisfied
      semantic_ref: urn:cinder-typhoon:fact:K28.2
