evidence_requirements:
  c1:
    description: Recover the actual behavior distinction and its relevant runtime condition. A binary
      filename or unexplained crash is insufficient.
    source_refs: &id001
    - features.k-delivery.k-source
    scope: Per-participant in-world evidence; no other participant state.
    boundary_kind: assertion_evaluation
    channel: other
    artifact_role: proposition_truth_evidence
    sensitivity: plain
    redaction: redact_secrets
    integrity: checksum
    retention: run_lifetime
    loss_disclosure: required
    observation_demand:
      rule_id: fact-k28-1
      scope: /features
      purpose: experimental
      mode: selected
      selector:
        semantic_scope: /features
        data_kind: artifact
        names:
        - cinder.k28-1.satisfied
        component_refs:
        - features.k-delivery.k-source
      collection: require
      retention: require
      redaction: redact-secrets
      integrity: checksum
      required: true
      basis: observed
  c2:
    description: Produce the correct diagnostic transformation for the supplied distinguishing inputs.
      Merely identifying a loader feature does not count.
    source_refs: &id002
    - features.k-delivery.k-source
    scope: Per-participant in-world evidence; no other participant state.
    boundary_kind: assertion_evaluation
    channel: other
    artifact_role: proposition_truth_evidence
    sensitivity: plain
    redaction: redact_secrets
    integrity: checksum
    retention: run_lifetime
    loss_disclosure: required
