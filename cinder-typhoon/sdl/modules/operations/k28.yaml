assertions:
  c1-ready:
    proposition: c1
    role: precondition
    polarity: positive
  c1-done:
    proposition: c1
    role: postcondition
    polarity: positive
  c2-ready:
    proposition: c2
    role: precondition
    polarity: positive
  c2-done:
    proposition: c2
    role: postcondition
    polarity: positive
  c3-ready:
    proposition: c3
    role: precondition
    polarity: positive
  c3-done:
    proposition: c3
    role: postcondition
    polarity: positive
objectives:
  c1:
    name: 'K28.1: A connector with two faces'
    description: |-
      Determine when the archived connector behaves differently from its ordinary interface and recover the diagnostic evidence for that difference.

      Introduces a product-history mystery tied to the later engineering material.
    agent: participant.operator
    actions:
    - k28.c1
    targets: &id004
    - features.k-delivery.k-source
    success:
      mode: all_of
      assertions:
      - c1-done
    window:
      workflows:
      - k28.c1
  c2:
    name: 'K28.2: What the loader changes'
    description: |-
      Reconstruct the connector's hidden loaded behavior well enough to reproduce its diagnostic transformation.

      Establishes understanding beyond the connector's visible entry path.
    agent: participant.operator
    actions:
    - k28.c2
    targets: &id005
    - features.k-delivery.k-source
    success:
      mode: all_of
      assertions:
      - c2-done
    window:
      workflows:
      - k28.c2
  c3:
    name: 'K28.3: The path that appears at runtime'
    description: |-
      Recover the hidden diagnostic path and the retained engineering note reachable through it.

      Pays off the supplier mystery with a later ARWC lead.
    agent: participant.operator
    actions:
    - k28.c3
    targets: &id006
    - features.k-delivery.k-source
    success:
      mode: all_of
      assertions:
      - c3-done
    window:
      workflows:
      - k28.c3
workflows:
  c1:
    description: 'K28.1: availability follows the evidence/authority alternatives. This independent objective
      may be revisited when facts change; no campaign-wide sequence or deadline is imposed.'
    start: requirements
    steps:
      requirements:
        type: switch
        cases:
        - when:
            assertions:
            - capabilities.g01-ready
          next: attempt
        default: unavailable
      available:
        type: end
      unavailable:
        type: end
      attempt:
        type: objective
        execution_mode: objective
        objective: k28.c1
        on_success: available
        on_failure: unavailable
  c2:
    description: 'K28.2: availability follows the evidence/authority alternatives. This independent objective
      may be revisited when facts change; no campaign-wide sequence or deadline is imposed.'
    start: requirements
    steps:
      requirements:
        type: switch
        cases:
        - when:
            assertions:
            - k28.c1-ready
          next: attempt
        default: unavailable
      available:
        type: end
      unavailable:
        type: end
      attempt:
        type: objective
        execution_mode: objective
        objective: k28.c2
        on_success: available
        on_failure: unavailable
  c3:
    description: 'K28.3: availability follows the evidence/authority alternatives. This independent objective
      may be revisited when facts change; no campaign-wide sequence or deadline is imposed.'
    start: requirements
    steps:
      requirements:
        type: switch
        cases:
        - when:
            assertions:
            - k28.c2-ready
          next: attempt
        default: unavailable
      available:
        type: end
      unavailable:
        type: end
      attempt:
        type: objective
        execution_mode: objective
