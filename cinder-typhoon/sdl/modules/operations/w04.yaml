objectives:
  c1:
    name: 'This action: The archive''s missing contract'
    description: |-
      Recover the restricted archive-workflow record and the identity relationship its attachment processing relies on.

      Introduces the archive as a working business service.
    agent: participant.operator
    actions:
    - w04.c1
    targets:
    - features.a-corporate.a-archive
    success:
      mode: all_of
      assertions:
      - c1-done
    window:
      workflows:
      - w04.c1
  c2:
    name: 'This action: The query behind the identity'
    description: |-
      Cross the archive's identity-to-query boundary and recover the protected archive record withheld from the ordinary attachment view.

      Creates a useful data capability before archive execution.
    agent: participant.operator
    actions:
    - w04.c2
    targets:
    - features.a-corporate.a-archive
    success:
      mode: all_of
      assertions:
      - c2-done
    window:
      workflows:
      - w04.c2
  c3:
    name: 'This action: The archive helper acts'
    description: |-
      Compose the earned archive access into execution under the archive helper's actual authority and recover its protected handover.

      Completes an alternate corporate exploitation branch.
    agent: participant.operator
    actions:
    - w04.c3
    targets:
    - features.a-corporate.a-archive
    success:
      mode: all_of
      assertions:
      - c3-done
    window:
      workflows:
      - w04.c3
