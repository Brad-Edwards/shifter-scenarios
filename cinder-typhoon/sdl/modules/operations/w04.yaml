    semantic_version: 1.0.0
    lifecycle_state: draft
    behavioral_granularity: aggregate
    procedure_basis: |-
      This card is an exact discovery, interpretation, or reconciliation task rather than an additional privilege flaw. Archive workflow AWF-CRR-229-R4 binds attachment ARC-229-A, protected record AR-CRR-229, and one-use enrollment profile ArchiveSubmitter, which fixes CN to the corporate subject and clientAuth EKU but permits a caller-supplied organizationalUnit. The result must come from the declared source and bindings, not from a duplicate clue or pre-completed record.

      The required result is: Recover the actual workflow record with its attachment and identity binding. General service discovery is insufficient.
    realization_profile: backend-declared
    fidelity_claim: The exact initial state, versions, formats, validation order, authorization decisions, process
      quantities, denial cases, persistent state, and independently owned evidence are required. Implementation
      choices remain open only when none of those facts change.
    preconditions:
    - precondition_id: eligibility
      precondition_class: authority
      description: Satisfy one complete alternative in the referenced workflow and obtain the required scoped access
        to every listed surface.
      support_refs:
      - workflows.w04.c1
      - features.a-corporate.a-archive
    - precondition_id: normal-surface
      precondition_class: target
      description: |-
        `a-archive` and its `retained-archive` application own this part of **The archive's missing contract**. Normal behavior applies the declared identity, tenant, object, revision, and process bindings and returns or changes only the caller-scoped object. The exact initial state is: Archive workflow AWF-CRR-229-R4 binds attachment ARC-229-A, protected record AR-CRR-229, and one-use enrollment profile ArchiveSubmitter, which fixes CN to the corporate subject and clientAuth EKU but permits a caller-supplied organizationalUnit.

        Native bindings:

        - `a-corporate.a-archive/retained-archive/the-archive-s-missing-contract`

        The private service-loader contract is `content.arwc-a-archive.w04-1-the-archive-s-missing-contract`. It freezes accepted and denied requests, state transition, persistence, and evidence; it does not seed a successful result.
      support_refs:
      - features.a-corporate.a-archive
      - content.arwc-a-archive.w04-1-the-archive-s-missing-contract
    - precondition_id: scope-and-persistence
      precondition_class: realization
      description: |-
        The result remains local evidence unless a downstream workflow explicitly names it. Tenant-scoped mutations, sessions that have not expired, generated artifacts, and audits persist across ordinary retries and later sessions. Initial immutable records remain unchanged unless the named route explicitly permits a field-level revision. Infrastructure recovery and submission adjudication are external to the SDL.

        The behavior is limited to the named fictional objects and bounded service operation. It provides no general shell, arbitrary network target, unrelated district access, real process interface, or authority not expressly declared by the card.
      support_refs:
      - features.a-corporate.a-archive
    effects:
