objectives:
  c1:
    name: 'This action: The project and the note'
    description: |-
      Recover the engineering project and its commissioning note for the outlet group.

      Gives the controls engineer's records a concrete place in the operating context.
    agent: participant.operator
    actions:
    - w21.c1
    targets:
    - features.a-engineering.a-engineering
    success:
      mode: all_of
      assertions:
      - c1-done
    window:
      workflows:
      - w21.c1
  c2:
    name: 'This action: Which project is running'
    description: |-
      Compare the recovered project claims with the independently observed deployed revision. Establish which version is actually in use.

      Supplies current engineering context for control and the final consequence.
    agent: participant.operator
    actions:
    - w21.c2
    targets:
    - features.a-engineering.a-engineering
    - features.a-control.a-instruments
    success:
      mode: all_of
      assertions:
      - c2-done
    window:
      workflows:
      - w21.c2
workflows:
