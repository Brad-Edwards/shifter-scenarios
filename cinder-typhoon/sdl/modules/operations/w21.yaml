# In-world draft. Unspecified realization remains open.
name: cinder-w21
version: 0.1.0
semantic_revision: raes-progressive-semantics/v1
module:
  id: cinder-typhoon/w21
  version: 0.1.0
  exports:
    evidence_requirements:
    - c1
    - c2
    propositions:
    - c1
    - c2
    assertions:
    - c1-ready
    - c1-done
    - c2-ready
    - c2-done
    objectives:
    - c1
    - c2
    workflows:
    - c1
    - c2
    action_contracts:
    - c1
    - c2
realization:
  default: open
evidence_requirements:
  c1:
    description: |-
      Identify the saved project's actual structure, declared ProjectRevision, task interval, and configured Runtime v4 target. This establishes the saved-project side of the W21 comparison; it does not establish what is running.

      Required technical proof: Completion compares the participant's observation with fresh, read-only product records. Product evidence is supplied by the range, never by the participant, and the completion path cannot write a tag, issue a command, change controller state, or create its own product evidence.

      Evidence sources are `features.a-engineering.a-engineering`. A wrong project structure, task interval, declared revision, runtime target, or address is rejected.
    source_refs:
    - features.a-engineering.a-engineering
    scope: Per-participant in-world evidence; no other participant state.
    boundary_kind: assertion_evaluation
    channel: other
    artifact_role: proposition_truth_evidence
    sensitivity: plain
    redaction: redact_secrets
    integrity: checksum
    retention: run_lifetime
    loss_disclosure: required
    observation_demand:
      rule_id: fact-w21-1
      scope: /features
      purpose: experimental
      mode: selected
      selector:
        semantic_scope: /features
        data_kind: artifact
        names:
        - cinder.w21-1.satisfied
        component_refs:
        - features.a-engineering.a-engineering
      collection: require
      retention: require
      redaction: redact-secrets
      integrity: checksum
      required: true
      basis: observed
    notes:
    - 'Author checks: Verify the healthy baseline through the participant workstation. Complete the card using only
      the declared native products and image-owned starting material. Confirm that a matching post-action product
      snapshot accepts the observation, while a wrong asset, stale observation, mismatched native identity, participant-supplied
      product evidence, or missing required product source prevents completion. Confirm the flow does not upload,
      start, stop, force, or otherwise change controller state and reset leaves no work item-created process state.'
  c2:
    description: |-
      Prove that the native debugger's locally compiled project identity matches the runtime-reported program identity, the controller is connected and running, there are no active forces, and live `ProjectRevision` is 364. This supplies W21.REVISION. Do not upload a program to make a mismatch disappear.

      Required technical proof: Completion compares the participant's observation with fresh, read-only product records. Product evidence is supplied by the range, never by the participant, and the completion path cannot write a tag, issue a command, change controller state, or create its own product evidence.

      Evidence sources are `features.a-engineering.a-engineering`. A wrong runtime target, program identity, running state, forced set, or live revision is rejected.
    source_refs:
    - features.a-engineering.a-engineering
    scope: Per-participant in-world evidence; no other participant state.
    boundary_kind: assertion_evaluation
    channel: other
    artifact_role: proposition_truth_evidence
    sensitivity: plain
    redaction: redact_secrets
    integrity: checksum
    retention: run_lifetime
    loss_disclosure: required
    observation_demand:
      rule_id: fact-w21-2
      scope: /features
      purpose: experimental
      mode: selected
      selector:
        semantic_scope: /features
        data_kind: artifact
        names:
        - cinder.w21-2.satisfied
        component_refs:
        - features.a-engineering.a-engineering
      collection: require
      retention: require
      redaction: redact-secrets
      integrity: checksum
      required: true
      basis: observed
    notes:
    - 'Author checks: Verify the healthy baseline through the participant workstation. Complete the card using only
      the declared native products and image-owned starting material. Confirm that a matching post-action product
      snapshot accepts the observation, while a wrong asset, stale observation, mismatched native identity, participant-supplied
      product evidence, or missing required product source prevents completion. Confirm the flow does not upload,
      start, stop, force, or otherwise change controller state and reset leaves no work item-created process state.'
propositions:
  c1:
    description: Identify the saved project's actual structure, declared ProjectRevision, task interval, and configured
      Runtime v4 target. This establishes the saved-project side of the W21 comparison; it does not establish what
      is running.
    subjects:
    - features.a-engineering.a-engineering
    basis: observed_state
    predicate:
      kind: boolean
      property: cinder.w21-1.satisfied
      semantic_ref: urn:cinder-typhoon:fact:W21.1
      operator: equals
      expected: true
    evidence_requirements:
    - c1
    quantifier: all
  c2:
    description: Prove that the native debugger's locally compiled project identity matches the runtime-reported
      program identity, the controller is connected and running, there are no active forces, and live `ProjectRevision`
      is 364. This supplies W21.REVISION. Do not upload a program to make a mismatch disappear.
    subjects:
    - features.a-engineering.a-engineering
    basis: observed_state
    predicate:
      kind: boolean
      property: cinder.w21-2.satisfied
      semantic_ref: urn:cinder-typhoon:fact:W21.2
      operator: equals
      expected: true
    evidence_requirements:
    - c2
    quantifier: all
assertions:
  c1-ready:
    proposition: c1
    role: precondition
    polarity: positive
  c1-done:
    proposition: c1
    role: postcondition
    polarity: positive
  c2-ready:
    proposition: c2
    role: precondition
    polarity: positive
  c2-done:
    proposition: c2
    role: postcondition
    polarity: positive
objectives:
  c1:
    name: 'This action: The project and the note'
    description: |-
      Open the supplied native controller project and commissioning note. Identify the
      project, main program, scheduled task, declared revision, and runtime target.
    assigned_participant: participant.operator
    actions:
    - w21.c1
    targets:
    - features.a-engineering.a-engineering
    success:
      mode: all_of
      assertions:
      - c1-done
    window:
      workflows:
      - w21.c1
  c2:
    name: 'This action: Which project is running'
    description: |-
      Use the normal OpenPLC debug and Runtime Status views to determine whether the
      saved project is the program currently running on the Cairn Reach controller.
    assigned_participant: participant.operator
    actions:
    - w21.c2
    targets:
    - features.a-engineering.a-engineering
    success:
      mode: all_of
      assertions:
      - c2-done
    window:
      workflows:
      - w21.c2
workflows:
  c1:
    description: 'This action: availability follows the evidence/authority alternatives. This independent objective
      may be revisited when facts change; no global sequence or deadline is imposed.'
    start: requirements
    steps:
      requirements:
        type: switch
        cases:
        - when:
            assertions:
            - capabilities.ot-read-ready
          next: attempt
        default: unavailable
      available:
        type: end
      unavailable:
        type: end
      attempt:
        type: objective
        execution_mode: objective
        objective: w21.c1
        on_success: available
        on_failure: unavailable
  c2:
    description: 'This action: availability follows the evidence/authority alternatives. This independent objective
      may be revisited when facts change; no global sequence or deadline is imposed.'
    start: requirements
    steps:
      requirements:
        type: switch
        cases:
        - when:
            assertions:
            - w21.c1-ready
          next: attempt
        default: unavailable
      available:
        type: end
      unavailable:
        type: end
      attempt:
        type: objective
        execution_mode: objective
        objective: w21.c2
        on_success: available
        on_failure: unavailable
action_contracts:
  c1:
    semantic_version: 1.0.0
    lifecycle_state: draft
    behavioral_granularity: aggregate
    procedure_basis: |-
      This is a bounded operating observation and interpretation task, not a privilege flaw. The participant must use the installed products to identify the saved native project from its actual program, scheduled task, declared ProjectRevision, and Runtime v4 device configuration. A copied value, inferred default, or synthetic API response does not establish the result.

      The required result is: Identify the saved project's actual structure, declared ProjectRevision, task interval, and configured Runtime v4 target. This establishes the saved-project side of the W21 comparison; it does not establish what is running.
    realization_profile: backend-declared
    fidelity_claim: The exact initial state, versions, formats, validation order, authorization decisions, process
      quantities, denial cases, persistent state, and independently owned evidence are required. Implementation
      choices remain open only when none of those facts change.
    preconditions:
    - precondition_id: eligibility
      precondition_class: authority
      description: Satisfy one complete alternative in the referenced workflow and obtain the required scoped access
        to every listed surface.
      support_refs:
      - workflows.w21.c1
      - features.a-engineering.a-engineering
    - precondition_id: normal-surface
      precondition_class: target
      description: |-
        The installed Cairn Reach OT products own this part of **The project and the note**. The exact initial state is: Image-owned handover CRR-PLC-COM-364 identifies native project arwc-site, main FBD program, `T#100ms` task, ProjectRevision 364, and OpenPLC Runtime v4 target 172.29.63.20; the participant must confirm those claims in the supplied native project.

        Native bindings:

        - `a-engineering.a-engineering/filesystem:/home/fieldlink/CairnReach/controller`
        - `a-engineering.a-engineering/filesystem:/home/fieldlink/CairnReach/Briefs/W21`
        - `a-engineering.a-engineering/OpenPLC-Editor:project-structure-and-device-configuration`

        The image-owned W21 handover and commissioning note are starting material only. The supplied OpenPLC project's own FBD, resource task, and Device Configuration remain authoritative; no private service-loader route duplicates them.
      support_refs:
      - features.a-engineering.a-engineering
    - precondition_id: scope-and-persistence
      precondition_class: realization
      description: |-
        The result remains local evidence unless a downstream workflow explicitly names it. The task is read-only and creates no process mutation to retain or reset. Ordinary historian retention continues independently. Infrastructure recovery and submission adjudication are external to the SDL.

        The behavior is limited to the installed Cairn Reach products, the named asset, and the supplied participant material. It provides no alternate work item service, simulated completion endpoint, or authority not already present in the OT environment.
      support_refs:
      - features.a-engineering.a-engineering
    effects:
    - effect_id: outcome
      effect_class: intended_effect
      description: Identify the saved project's actual structure, declared ProjectRevision, task interval, and configured
        Runtime v4 target. This establishes the saved-project side of the W21 comparison; it does not establish
        what is running.
      target_refs:
      - features.a-engineering.a-engineering
      evidence_refs:
      - evidence_requirements.w21.c1
    - effect_id: verified-evidence
      effect_class: evidence_effect
      description: |-
        Completion compares the participant's observation with fresh, read-only product records. Product evidence is supplied by the range, never by the participant, and the completion path cannot write a tag, issue a command, change controller state, or create its own product evidence.

        Evidence sources are `features.a-engineering.a-engineering`. A wrong project structure, task interval, declared revision, runtime target, or address is rejected.
      target_refs:
      - features.a-engineering.a-engineering
      evidence_refs:
      - evidence_requirements.w21.c1
    failure_classes:
    - precondition_unsatisfied
    - authority_denied
    - target_unavailable
    - partial_success
    - backend_error
    - unknown
  c2:
    semantic_version: 1.0.0
    lifecycle_state: draft
    behavioral_granularity: aggregate
    procedure_basis: |-
      This is a bounded operating observation and interpretation task, not a privilege flaw. The participant must use the installed products to reconcile the saved project with the running controller by program MD5 match, connected running state, absence of active forces, and the live ProjectRevision value. A copied value, inferred default, or synthetic API response does not establish the result.

      The required result is: Prove that the native debugger's locally compiled project identity matches the runtime-reported program identity, the controller is connected and running, there are no active forces, and live `ProjectRevision` is 364. This supplies W21.REVISION. Do not upload a program to make a mismatch disappear.
    realization_profile: backend-declared
    fidelity_claim: The exact initial state, versions, formats, validation order, authorization decisions, process
      quantities, denial cases, persistent state, and independently owned evidence are required. Implementation
      choices remain open only when none of those facts change.
    preconditions:
    - precondition_id: eligibility
      precondition_class: authority
      description: Satisfy one complete alternative in the referenced workflow and obtain the required scoped access
        to every listed surface.
      support_refs:
      - workflows.w21.c2
      - features.a-engineering.a-engineering
    - precondition_id: normal-surface
      precondition_class: target
      description: |-
        The installed Cairn Reach OT products own this part of **Which project is running**. The exact initial state is: The OpenPLC debug channel reports the running program MD5 and whether it matches the locally compiled saved project; a clean conclusion also requires connected running state, no active forces, and live ProjectRevision 364.

        Native bindings:

        - `a-engineering.a-engineering/OpenPLC-Editor:debug-program-md5-match`
        - `a-engineering.a-engineering/OpenPLC-Runtime-v4:running-status`
        - `a-engineering.a-engineering/OpenPLC-Debugger:ProjectRevision`

        The image-owned W21 handover and commissioning note are starting material only. The supplied OpenPLC project, the Editor's compiled-program identity check, the Runtime v4 status, and the live debugger value remain authoritative; no private service-loader route duplicates them.
      support_refs:
      - features.a-engineering.a-engineering
    - precondition_id: scope-and-persistence
      precondition_class: realization
      description: |-
        Supplies W21.REVISION. The task is read-only and creates no process mutation to retain or reset. Ordinary historian retention continues independently. Infrastructure recovery and submission adjudication are external to the SDL.

        The behavior is limited to the installed Cairn Reach products, the named asset, and the supplied participant material. It provides no alternate work item service, simulated completion endpoint, or authority not already present in the OT environment.
      support_refs:
      - features.a-engineering.a-engineering
    effects:
    - effect_id: outcome
      effect_class: intended_effect
      description: Prove that the native debugger's locally compiled project identity matches the runtime-reported
        program identity, the controller is connected and running, there are no active forces, and live `ProjectRevision`
        is 364. This supplies W21.REVISION. Do not upload a program to make a mismatch disappear.
      target_refs:
      - features.a-engineering.a-engineering
      evidence_refs:
      - evidence_requirements.w21.c2
    - effect_id: verified-evidence
      effect_class: evidence_effect
      description: |-
        Completion compares the participant's observation with fresh, read-only product records. Product evidence is supplied by the range, never by the participant, and the completion path cannot write a tag, issue a command, change controller state, or create its own product evidence.

        Evidence sources are `features.a-engineering.a-engineering`. A wrong runtime target, program identity, running state, forced set, or live revision is rejected.
      target_refs:
      - features.a-engineering.a-engineering
      evidence_refs:
      - evidence_requirements.w21.c2
    failure_classes:
    - precondition_unsatisfied
    - authority_denied
    - target_unavailable
    - partial_success
    - backend_error
    - unknown
