content:
  c1-records-1:
    type: dataset
    description: |-
      W34.1: required in-world starting records. Allocate each record to its actual owning service; this declaration does not duplicate secrets across services or grant their visibility.
      The earned planning-view capability, current process interpretation, the planner's input/refresh records, and independent observations. This reporting-only stage needs no live control client, operating sequence, or release plan.
    target: a-corporate.a-data
    tags:
    - synthetic
    - w34
    - c1
    - seed-requirement
    items:
    - name: starting-records
      description: The earned planning-view capability, current process interpretation, the planner's
        input/refresh records, and independent observations. This reporting-only stage needs no live control
        client, operating sequence, or release plan.
