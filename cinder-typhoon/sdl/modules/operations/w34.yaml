        - features.a-corporate.a-data
      collection: require
      retention: require
      redaction: redact-secrets
      integrity: checksum
      required: true
      basis: observed
    notes:
    - 'Author checks: Build and test the normal baseline first. Exercise the exact authored path and verify the
      named result plus its immutable audit. Test wrong authority, wrong object or district, stale revision, replay,
      another tenant instance, and every declared constraint or unaffected record. Repeat the accepted action according
      to its idempotence rule and confirm ordinary retries preserve the result. For a joined result, verify each
      destination observed the same correlation and that removal of any independently owned source prevents completion.'
  c3:
    description: |-
      Demonstrate the changed decision, bounded volume loss, and continued reporting consistency across the handover, using evidence, authority, and the release calculation for the same earned checkpoint. Live control is required here; independent process truth and prior operating context results remain intact. The conclusion places the planner's reassuring handover beside the independently measured reserve loss and the different allocation decision the operator caused. Both accounts concern the same interval. The contrast is the payoff: ARWC's planning view remains convincing while Cinder can show what actually happened. It deepens the reporting theme without enlarging the disaster or superseding the main ending; the controls engineer's warning is quoted only if the operator recovered it.

