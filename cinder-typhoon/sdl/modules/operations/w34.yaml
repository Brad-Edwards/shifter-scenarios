        execution_mode: objective
        objective: w34.c3
        on_success: available
        on_failure: unavailable
action_contracts:
  c1:
    semantic_version: 1.0.0
    lifecycle_state: draft
    behavioral_granularity: aggregate
    procedure_basis: |-
      The authored condition is **estimate-output consumer binding**. Planning consumer PLAN-CONSUMER-R8 accepts Cairn estimate output from the W23 estimator or W27 verifier path and refreshes checkpoint REH-REPORT-34 while retaining raw-observation links. The hand build must preserve every named version, encoding, bound, validation order, identity, and unaffected field; substituting a generic vulnerable service would change the task.

      The required result is: Demonstrate the bound consumer effect and its actual input/refresh context. The earlier estimator or program compromise earns no additional credit here. Process quantities and state separation are governed by `arwc-process-model.md`, specifically `REH-REPORT-34`, `PLAN-CONSUMER-R8`.
    realization_profile: backend-declared
    fidelity_claim: The exact initial state, versions, formats, validation order, authorization decisions, process
      quantities, denial cases, persistent state, and independently owned evidence are required. Implementation
      choices remain open only when none of those facts change.
    preconditions:
    - precondition_id: eligibility
      precondition_class: authority
      description: Satisfy one complete alternative in the referenced workflow and obtain the required scoped access
        to every listed surface.
      support_refs:
      - workflows.w34.c1
      - features.a-corporate.a-data--planning
      - features.a-corporate.a-data
    - precondition_id: normal-surface
      precondition_class: target
      description: |-
        `a-data` and its `planning-data` application own this part of **Which view the planner trusts**. Normal behavior applies the declared identity, tenant, object, revision, and process bindings and returns or changes only the caller-scoped object. The exact initial state is: Planning consumer PLAN-CONSUMER-R8 accepts Cairn estimate output from the W23 estimator or W27 verifier path and refreshes checkpoint REH-REPORT-34 while retaining raw-observation links.

        Native bindings:

        - `a-corporate.a-data/planning-data/which-view-the-planner-trusts`

        The private service-loader contract is `content.arwc-a-data.w34-1-which-view-the-planner-trusts`. It freezes accepted and denied requests, state transition, persistence, and evidence; it does not seed a successful result.
      support_refs:
      - features.a-corporate.a-data--planning
      - features.a-corporate.a-data
      - content.arwc-a-data.w34-1-which-view-the-planner-trusts
    - precondition_id: scope-and-persistence
      precondition_class: realization
      description: |-
        The result remains local evidence unless a downstream workflow explicitly names it. Tenant-scoped mutations, sessions that have not expired, generated artifacts, and audits persist across ordinary retries and later sessions. Initial immutable records remain unchanged unless the named route explicitly permits a field-level revision. Infrastructure recovery and submission adjudication are external to the SDL.

