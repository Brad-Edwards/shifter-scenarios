      snapshot accepts the observation, while a wrong asset, stale observation, mismatched native identity, participant-supplied
      product evidence, or missing required product source prevents completion. Confirm the flow does not upload,
      start, stop, force, or otherwise change controller state and reset leaves no work item-created process state.'
