evidence_requirements:
  c1:
    description: |-
      Recover the current tariff and its effective window. This is distinct from W35's general procurement catalog and its private district quote.

      Required technical proof: The owning service writes an immutable audit for the accepted request and result. Caller-supplied output, a local copy, or knowledge of an identifier is not sufficient. Completion is evaluated from fresh service-owned evidence after the action. It cannot issue the identity, create the mutation, move a simulated actuator, or fabricate a downstream acceptance needed to prove itself.

      Evidence sources are `features.a-corporate.a-data`. A wrong identifier, stale revision, replayed one-time value, different checkpoint, or cross-tenant artifact is rejected.
    source_refs:
    - features.a-corporate.a-data
    scope: Per-participant in-world evidence; no other participant state.
    boundary_kind: assertion_evaluation
    channel: other
    artifact_role: proposition_truth_evidence
    sensitivity: plain
    redaction: redact_secrets
    integrity: checksum
    retention: run_lifetime
    loss_disclosure: required
    observation_demand:
      rule_id: fact-w29-1
      scope: /features
      purpose: experimental
      mode: selected
      selector:
        semantic_scope: /features
        data_kind: artifact
        names:
        - cinder.w29-1.satisfied
        component_refs:
        - features.a-corporate.a-data
      collection: require
      retention: require
      redaction: redact-secrets
      integrity: checksum
      required: true
      basis: observed
    notes:
    - 'Author checks: Build and test the normal baseline first. Exercise the exact authored path and verify the
      named result plus its immutable audit. Test wrong authority, wrong object or district, stale revision, replay,
      another tenant instance, and every declared constraint or unaffected record. Repeat the accepted action according
      to its idempotence rule and confirm ordinary retries preserve the result. For a joined result, verify each
      destination observed the same correlation and that removal of any independently owned source prevents completion.'
  c2:
    description: |-
      Produce the correctly bound current reserve/commitment balance. Repeating W09's historical reporting discrepancy is insufficient.

