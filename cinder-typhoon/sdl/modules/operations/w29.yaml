objectives:
  c1:
    name: 'This action: The price of this planning window'
    description: Use the Cairn Reach allocation export and corporate planning records to identify the replacement-supply
      tariff, its effective interval, and the allocation commitment for the same asset and planning window.
    assigned_participant: participant.operator
    actions:
    - w29.c1
    targets:
    - features.a-corporate.a-data
    - features.a-engineering.a-engineering
    success:
      mode: all_of
      assertions:
      - c1-done
    window:
      workflows:
      - w29.c1
  c2:
    name: 'This action: What reserve remains uncommitted'
    description: Select a fresh good-quality `UsableVolumeML` observation from native Cairn Reach history and reconcile
      it with the 12.00 ML allocation commitment to calculate the current uncommitted margin.
    assigned_participant: participant.operator
    actions:
    - w29.c2
    targets:
    - features.a-corporate.a-data
    - features.a-engineering.a-historian
    success:
      mode: all_of
      assertions:
      - c2-done
    window:
      workflows:
      - w29.c2
  c3:
    name: 'This action: Paper truth'
    description: Compare corporate report `RPT-CRR-DP3-R7` with the later good-quality native usable-volume observation,
      calculate their signed difference, and explain what their different as-of times allow you to conclude.
    assigned_participant: participant.operator
    actions:
    - w29.c3
    targets:
    - features.a-corporate.a-data
    - features.a-engineering.a-historian
    success:
      mode: all_of
      assertions:
      - c3-done
    window:
      workflows:
      - w29.c3
