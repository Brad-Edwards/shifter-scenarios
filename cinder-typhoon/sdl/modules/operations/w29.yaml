      Required technical proof: Completion compares the participant's observation with fresh, read-only product records. Product evidence is supplied by the range, never by the participant, and the completion path cannot write a tag, issue a command, change controller state, or create its own product evidence.

      Evidence sources are `features.a-corporate.a-data`, `features.a-engineering.a-engineering`. A wrong planning window, record revision, asset, source time, process quality, unit, signed calculation, or time-basis conclusion is rejected.
