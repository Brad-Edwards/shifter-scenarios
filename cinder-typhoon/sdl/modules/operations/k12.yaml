realization:
  default: open
evidence_requirements:
  c1:
    description: Demonstrate the controlled preview being processed in the intended privileged review
      context. A visit by an ordinary account is insufficient.
    source_refs: &id001
    - features.k-delivery.k-preview
    scope: Per-participant in-world evidence; no other participant state.
    boundary_kind: assertion_evaluation
    channel: other
    artifact_role: proposition_truth_evidence
    sensitivity: plain
    redaction: redact_secrets
    integrity: checksum
    retention: run_lifetime
    loss_disclosure: required
    observation_demand:
      rule_id: fact-k12-1
      scope: /features
      purpose: experimental
      mode: selected
      selector:
        semantic_scope: /features
        data_kind: artifact
        names:
        - cinder.k12-1.satisfied
        component_refs:
        - features.k-delivery.k-preview
      collection: require
      retention: require
      redaction: redact-secrets
      integrity: checksum
      required: true
      basis: observed
  c2:
    description: Complete the protected action with the current value and correct review binding. Disclosure
      and scoped use form one achievement.
    source_refs: &id002
    - features.k-delivery.k-preview
    scope: Per-participant in-world evidence; no other participant state.
    boundary_kind: assertion_evaluation
    channel: other
    artifact_role: proposition_truth_evidence
    sensitivity: plain
    redaction: redact_secrets
    integrity: checksum
    retention: run_lifetime
    loss_disclosure: required
    observation_demand:
      rule_id: fact-k12-2
      scope: /features
      purpose: experimental
      mode: selected
      selector:
        semantic_scope: /features
        data_kind: artifact
        names:
        - cinder.k12-2.satisfied
        component_refs:
        - features.k-delivery.k-preview
      collection: require
      retention: require
      redaction: redact-secrets
      integrity: checksum
      required: true
      basis: observed
  c3:
    description: Demonstrate the worker producing Cinder's chosen compatible preview behavior. Replaying
      the preceding privileged action does not suffice.
    source_refs: &id003
    - features.k-delivery.k-preview
    scope: Per-participant in-world evidence; no other participant state.
    boundary_kind: assertion_evaluation
    channel: other
    artifact_role: proposition_truth_evidence
    sensitivity: plain
    redaction: redact_secrets
    integrity: checksum
    retention: run_lifetime
    loss_disclosure: required
    observation_demand:
      rule_id: fact-k12-3
      scope: /features
      purpose: experimental
      mode: selected
      selector:
        semantic_scope: /features
        data_kind: artifact
        names:
        - cinder.k12-3.satisfied
        component_refs:
        - features.k-delivery.k-preview
      collection: require
      retention: require
      redaction: redact-secrets
      integrity: checksum
      required: true
      basis: observed
  c4:
    description: |-
      Demonstrate execution in the renderer's actual context and the changed consumed preview. Its scope remains the supplier's preview workflow.

      The conclusion lets the player inspect the release document as the support engineer actually received it, alongside the ordinary version. The chosen change survives the privileged rendering path and appears inside the otherwise recognizable document. The comparison uses the proven renderer result; a local mock-up or decorative completion banner cannot substitute for it. This is a complete specialist payoff even if the player never reaches ARWC.
    source_refs: &id004
    - features.k-delivery.k-preview
    scope: Per-participant in-world evidence; no other participant state.
    boundary_kind: assertion_evaluation
    channel: other
    artifact_role: proposition_truth_evidence
    sensitivity: plain
    redaction: redact_secrets
    integrity: checksum
    retention: run_lifetime
    loss_disclosure: required
