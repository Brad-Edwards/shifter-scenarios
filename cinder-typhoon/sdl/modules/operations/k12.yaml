    description: Demonstrate the controlled preview being processed in the intended privileged review
      context. A visit by an ordinary account is insufficient.
    subjects: *id001
    basis: observed_state
    predicate:
      kind: boolean
      property: cinder.k12-1.satisfied
      semantic_ref: urn:cinder-typhoon:fact:K12.1
      operator: equals
      expected: true
    evidence_requirements:
    - c1
    quantifier: all
  c2:
