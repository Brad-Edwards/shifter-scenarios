objectives:
  c1:
    name: 'K12.1: The reviewer arrives second'
    description: |-
      Place your controlled preview content in the privileged reviewer's effective workflow despite the account and review-state boundaries.

      Establishes a useful browser position rather than merely submitting an attachment.
    agent: participant.operator
    actions:
    - k12.c1
    targets:
    - features.k-delivery.k-preview
    success:
      mode: all_of
      assertions:
      - c1-done
    window:
      workflows:
      - k12.c1
  c2:
    name: 'K12.2: A value across the action boundary'
    description: |-
      Recover the protected browser value required for a privileged preview action and make that separate action accept it.

      Turns browser access into a new application capability.
    agent: participant.operator
    actions:
    - k12.c2
    targets:
    - features.k-delivery.k-preview
    success:
      mode: all_of
      assertions:
      - c2-done
    window:
      workflows:
      - k12.c2
  c3:
    name: 'K12.3: The worker changes sides'
    description: |-
      Take control of the preview worker's contribution to the support review while preserving the expected review interface.

      Adds control of an active processing component.
    agent: participant.operator
    actions:
    - k12.c3
    targets:
    - features.k-delivery.k-preview
    success:
      mode: all_of
      assertions:
      - c3-done
    window:
      workflows:
      - k12.c3
  c4:
    name: 'K12.4: The preview is ours'
    description: |-
      Complete the chain into the constrained renderer and make the support engineer's release preview reflect Cinder's chosen result.

      Delivers a memorable local conclusion to the long browser investigation.
    agent: participant.operator
    actions:
    - k12.c4
    targets:
    - features.k-delivery.k-preview
    success:
      mode: all_of
      assertions:
      - c4-done
    window:
      workflows:
      - k12.c4
