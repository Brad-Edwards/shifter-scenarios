    procedure_basis: 'The intended path is limited to the authored software, data, configuration, identity, permission,
      or state described above. The participant must exercise that real condition through the declared service interface
      and produce this result: Privileged reviewer worker loads participant content; navigation/load audit. Merely
      describing the condition, editing a local copy, or presenting a value obtained from another surface does not
      satisfy the contract.'
    realization_profile: backend-declared
    fidelity_claim: The exact starting state, service transition, denial cases, participant-state persistence, and
      independently owned evidence are required. Backend choices remain open only where they cannot change those
      facts.
    preconditions:
    - precondition_id: eligibility
      precondition_class: authority
      description: Satisfy one complete alternative in the referenced workflow and obtain the required scoped access
        to every listed surface.
      support_refs:
      - workflows.k12.c1
      - features.k-delivery.k-preview
    - precondition_id: normal-surface
      precondition_class: target
      description: '`k-preview` owns this part of the operation. Its starting state is exact: Ordinary release-preview
        account; review item PRV-771; authored same-origin preview whose queue ownership check omits submitter on
        reassignment. The owning service uses the listener, route, identity, authorization, storage, and audit contract
        declared in the corresponding world module. Records that are not explicitly mutable remain immutable. The
        private service-loader contract `content.keplerops-k-preview.k12-1-the-reviewer-arrives-second` freezes
        the request, denial, state-transition, evidence, and any exploit-critical implementation details.'
      support_refs:
      - features.k-delivery.k-preview
      - content.keplerops-k-preview.k12-1-the-reviewer-arrives-second
    - precondition_id: scope-and-persistence
      precondition_class: realization
      description: Input to K12.2 Participant-created service state persists for the life of the participant world
        and ordinary retries do not erase it. The action is limited to the exact records, identities, routes, and
        destination effects declared here; unrelated tenants and services remain denied. Infrastructure recovery
        and submission adjudication are outside this in-world contract.
      support_refs:
      - features.k-delivery.k-preview
    effects:
    - effect_id: outcome
      effect_class: intended_effect
      description: Demonstrate the controlled preview being processed in the intended privileged review context.
