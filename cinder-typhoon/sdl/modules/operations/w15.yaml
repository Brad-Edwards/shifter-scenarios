objectives:
  c1:
    name: 'W15.1: Which drawing did the cache keep'
    description: |-
      Recover the restricted cache association for the maintenance drawing and identify the version the review workflow will serve.

      Grounds the cache investigation in an actual maintenance record.
    agent: participant.operator
    actions:
    - w15.c1
    targets: &id005
    - features.a-maintenance.a-approval
    success:
      mode: all_of
      assertions:
      - c1-done
    window:
      workflows:
      - w15.c1
  c2:
    name: 'W15.2: A drawing of our choosing'
    description: |-
      Make the maintenance viewer serve your controlled response for the designated cached drawing while preserving its expected identity.

      Establishes a meaningful cache-control capability.
    agent: participant.operator
    actions:
    - w15.c2
    targets: &id006
    - features.a-maintenance.a-approval
    success:
      mode: all_of
      assertions:
      - c2-done
    window:
      workflows:
      - w15.c2
  c3:
    name: 'W15.3: The reviewer trusts the drawing'
    description: |-
      Use the controlled drawing delivery to obtain the reviewer's private maintenance-review submission capability.

      Connects cache control to an actual browser/application effect.
    agent: participant.operator
    actions:
    - w15.c3
    targets: &id007
    - features.a-maintenance.a-approval
    success:
      mode: all_of
      assertions:
      - c3-done
    window:
      workflows:
      - w15.c3
  c4:
    name: 'W15.4: Approval beyond the token'
    description: |-
      Recover the protected maintenance approval through the downstream authority check that still restricts the review capability.

      Completes an advanced path to a useful approval artifact.
    agent: participant.operator
    actions:
    - w15.c4
    targets: &id008
    - features.a-maintenance.a-approval
    success:
      mode: all_of
      assertions:
      - c4-done
    window:
      workflows:
      - w15.c4
workflows:
  c1:
    description: 'W15.1: availability follows the evidence/authority alternatives. This independent objective
      may be revisited when facts change; no campaign-wide sequence or deadline is imposed.'
    start: requirements
    steps:
      requirements:
        type: switch
        cases:
        - when:
            assertions:
            - capabilities.w13-session-ready
          next: attempt
        - when:
            assertions:
            - capabilities.w03-read-ready
          next: attempt
        default: unavailable
      available:
        type: end
      unavailable:
        type: end
      attempt:
        type: objective
        execution_mode: objective
        objective: w15.c1
        on_success: available
        on_failure: unavailable
  c2:
