evidence_requirements:
  c1:
    description: Recover the real cache/drawing association. Public viewer configuration or an unrelated
      cached object is insufficient.
    source_refs: &id001
    - features.a-maintenance.a-approval
    scope: Per-participant in-world evidence; no other participant state.
    boundary_kind: assertion_evaluation
    channel: other
    artifact_role: proposition_truth_evidence
    sensitivity: plain
    redaction: redact_secrets
    integrity: checksum
    retention: run_lifetime
    loss_disclosure: required
    observation_demand:
      rule_id: fact-w15-1
      scope: /features
      purpose: experimental
      mode: selected
      selector:
        semantic_scope: /features
        data_kind: artifact
        names:
        - cinder.w15-1.satisfied
        component_refs:
        - features.a-maintenance.a-approval
      collection: require
      retention: require
      redaction: redact-secrets
      integrity: checksum
      required: true
      basis: observed
  c2:
    description: Demonstrate the fresh controlled response being served for the intended drawing. A local
