        component_refs:
        - features.training.t-workbench
      collection: require
      retention: require
      redaction: redact-secrets
      integrity: checksum
      required: true
      basis: observed
    notes:
    - 'Author checks: Check the courier/profile binding, manifest revision, denial for another

