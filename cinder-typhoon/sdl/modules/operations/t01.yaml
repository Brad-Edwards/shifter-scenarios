content:
  c1-records-1:
    type: dataset
    description: |-
      T01.1: required in-world starting records. Allocate each record to its actual owning service; this declaration does not duplicate secrets across services or grant their visibility.
      The supplied training workspace, dispatch site, retired courier-client material, and a diagnostic helper.

      The supplied workspace contains an ordinary shared handover directory, a local
      Git worktree, and a delivery tracker export. The outgoing operator replaced a
      handover file with an empty template while retaining the worktree history and
      the tracker record named by the note.
    target: training.t-workbench
    tags:
    - synthetic
    - t01
    - c1
    - seed-requirement
    items:
    - name: starting-records
      description: The supplied training workspace, dispatch site, retired courier-client material, and
        a diagnostic helper.
  c2-records-1:
    type: dataset
    description: |-
      T01.2: required in-world starting records. Allocate each record to its actual owning service; this declaration does not duplicate secrets across services or grant their visibility.
      The supplied training workspace and dispatch site. The site's ordinary, accessible page material retains a reference to the withdrawn rehearsal material; following that evidence leads to the amendment. Inspecting the reference requires no other challenge completion. The retired courier-client material and diagnostic helper are also available for the other training objectives.

      The training dispatch site is a small authored read-only web application. Its
      public delivery notice names a rehearsal shipment; its static site manifest,
      retired-content index, and ordinary linked assets retain a specific amendment
      that the navigation no longer presents.
    target: training.t-workbench
    tags:
    - synthetic
    - t01
    - c2
    - seed-requirement
    items:
    - name: starting-records
      description: The supplied training workspace and dispatch site. The site's ordinary, accessible
        page material retains a reference to the withdrawn rehearsal material; following that evidence
        leads to the amendment. Inspecting the reference requires no other challenge completion. The retired
        courier-client material and diagnostic helper are also available for the other training objectives.
  c3-records-1:
    type: dataset
    description: |-
      T01.3: required in-world starting records. Allocate each record to its actual owning service; this declaration does not duplicate secrets across services or grant their visibility.
      The supplied training workspace, dispatch site, retired courier-client material, and a diagnostic helper.

