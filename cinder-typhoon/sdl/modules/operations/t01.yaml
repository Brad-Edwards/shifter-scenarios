evidence_requirements:
  c1:
    description: 'Recover the actual handover and its delivery reference. It provides story context but no required
      campaign credential.


      Required technical proof: The recovered handover carries the delivery reference matching the tracker.

      Its bytes belong to an actual historical revision, not a file fabricated after

      the fact. Recovery creates no credential or standing authority.'
    source_refs:
    - features.training.t-workbench
    scope: Per-participant in-world evidence; no other participant state.
    boundary_kind: assertion_evaluation
    channel: other
    artifact_role: proposition_truth_evidence
    sensitivity: plain
    redaction: redact_secrets
    integrity: checksum
    retention: run_lifetime
    loss_disclosure: required
    observation_demand:
      rule_id: fact-t01-1
      scope: /features
      purpose: experimental
      mode: selected
      selector:
        semantic_scope: /features
        data_kind: artifact
        names:
        - cinder.t01-1.satisfied
        component_refs:
        - features.training.t-workbench
      collection: require
      retention: require
      redaction: redact-secrets
      integrity: checksum
      required: true
      basis: observed
    notes:
    - 'Author checks: Verify the current note is empty, the historical bytes are genuinely

      recoverable, the tracker reference resolves once, and ordinary reads preserve

      both history and tracker data.'
  c2:
    description: 'Recover the actual unpublished amendment and its delivery binding. Finding an address alone does
      not count.


      Required technical proof: The retrieved amendment''s immutable record ID and delivery reference agree

      with the public notice. The server retains its ordinary retrieval audit.

      An address alone is not the amendment.'
    source_refs:
    - features.training.t-workbench
    scope: Per-participant in-world evidence; no other participant state.
    boundary_kind: assertion_evaluation
    channel: other
    artifact_role: proposition_truth_evidence
    sensitivity: plain
    redaction: redact_secrets
    integrity: checksum
    retention: run_lifetime
    loss_disclosure: required
    observation_demand:
