action_contracts:
  c1:
    semantic_version: 1.0.0
    lifecycle_state: draft
    behavioral_granularity: aggregate
    procedure_basis: |-
      This is an evidence-recovery exercise: the visible workspace does not represent
      the complete local history. The intended solution class is inspection of normal
      local artifacts and revision history, then correlation with the tracker rather
      than filename guessing.
    realization_profile: backend-declared
    fidelity_claim: The authored mechanism, normal behavior, proof, authority limits, and reset requirements
      are required. Hosting and their implementation remain backend-declared.
    preconditions:
    - precondition_id: eligibility
      precondition_class: authority
      description: Satisfy one complete alternative in the referenced workflow and obtain the required
        scoped access to every listed surface.
      support_refs:
      - workflows.t01.c1
      - features.training.t-workbench
    - precondition_id: normal-surface
      precondition_class: target
      description: |-
        The supplied workspace contains an ordinary shared handover directory, a local
        Git worktree, and a delivery tracker export. The outgoing operator replaced a
        handover file with an empty template while retaining the worktree history and
        the tracker record named by the note.
      support_refs: *id005
    - precondition_id: boundaries-and-reset
      precondition_class: realization
      description: |-
        These are requirements on the realized environment. Apply reset behavior only when a participant reset is requested, not on challenge completion.

        The worktree is read-only and contains only training fixtures. Reset restores
        the checkout and removes the player's evidence event without changing the
        shared commit graph.
      support_refs:
      - features.training.t-workbench
    effects:
    - effect_id: outcome
      effect_class: intended_effect
      description: Recover the actual handover and its delivery reference. It provides story context but
        no required campaign credential.
      target_refs: *id005
      evidence_refs:
      - evidence_requirements.t01.c1
    - effect_id: verified-evidence
      effect_class: evidence_effect
      description: |-
        Completion requires the historical handover contents and its matching delivery
        reference. The scorer checks the fixture revision and tracker ID against the
        player's isolated evidence record; no credential or standing authority results.
      target_refs: *id001
      evidence_refs:
      - evidence_requirements.t01.c1
    failure_classes:
    - precondition_unsatisfied
    - authority_denied
    - target_unavailable
    - partial_success
    - backend_error
    - unknown
  c2:
    semantic_version: 1.0.0
    lifecycle_state: draft
    behavioral_granularity: aggregate
    procedure_basis: |-
      Removal from navigation incorrectly substitutes for removal from the site's
      published content inventory. The intended solution is evidence-led discovery
      from the notice and published site metadata, followed by retrieving and
      validating the actual amendment rather than enumerating arbitrary paths.
    realization_profile: backend-declared
    fidelity_claim: The authored mechanism, normal behavior, proof, authority limits, and reset requirements
      are required. Hosting and their implementation remain backend-declared.
    preconditions:
    - precondition_id: eligibility
      precondition_class: authority
      description: Satisfy one complete alternative in the referenced workflow and obtain the required
        scoped access to every listed surface.
      support_refs:
      - workflows.t01.c2
      - features.training.t-workbench
    - precondition_id: normal-surface
      precondition_class: target
      description: |-
        The training dispatch site is a small authored read-only web application. Its
        public delivery notice names a rehearsal shipment; its static site manifest,
        retired-content index, and ordinary linked assets retain a specific amendment
        that the navigation no longer presents.
      support_refs: *id006
    - precondition_id: boundaries-and-reset
      precondition_class: realization
      description: |-
        These are requirements on the realized environment. Apply reset behavior only when a participant reset is requested, not on challenge completion.

        Only the fixed rehearsal content namespace is exposed. The site has no write
        route, and reset clears the player event while leaving the published inventory
        unchanged.
      support_refs:
      - features.training.t-workbench
    effects:
    - effect_id: outcome
      effect_class: intended_effect
      description: Recover the actual unpublished amendment and its delivery binding. Finding an address
        alone does not count.
      target_refs: *id006
      evidence_refs:
      - evidence_requirements.t01.c2
    - effect_id: verified-evidence
      effect_class: evidence_effect
      description: |-
        The amendment carries a delivery binding that matches the public notice. A
        server-side retrieval event and the amendment's immutable record ID establish
        completion; an address or a guessed identifier alone does not.
      target_refs: *id002
      evidence_refs:
      - evidence_requirements.t01.c2
    failure_classes:
    - precondition_unsatisfied
    - authority_denied
    - target_unavailable
    - partial_success
    - backend_error
    - unknown
  c3:
    semantic_version: 1.0.0
    lifecycle_state: draft
    behavioral_granularity: aggregate
    procedure_basis: |-
      A decommissioned client profile retains a still-valid, narrowly scoped bearer
      credential. The intended solution is to identify its scope from surrounding
      client material and use the actual courier API for the assigned delivery.
    realization_profile: backend-declared
    fidelity_claim: The authored mechanism, normal behavior, proof, authority limits, and reset requirements
      are required. Hosting and their implementation remain backend-declared.
    preconditions:
    - precondition_id: eligibility
      precondition_class: authority
      description: Satisfy one complete alternative in the referenced workflow and obtain the required
        scoped access to every listed surface.
      support_refs:
      - workflows.t01.c3
      - features.training.t-workbench
    - precondition_id: normal-surface
      precondition_class: target
      description: |-
        Retired courier-client material in the workspace includes a configuration
        profile, request history, and a courier API with normal manifest retrieval.
        Each courier token is bound to a courier record and one sealed delivery.
      support_refs: *id007
    - precondition_id: boundaries-and-reset
      precondition_class: realization
      description: |-
        These are requirements on the realized environment. Apply reset behavior only when a participant reset is requested, not on challenge completion.

        The token can read one synthetic manifest and cannot list, write, or access any
        non-training service. Its per-player copy is revoked and reissued on reset.
      support_refs:
      - features.training.t-workbench
    effects:
    - effect_id: outcome
      effect_class: intended_effect
      description: Recover and use the limited credential to obtain the protected manifest. Credential
        discovery and use earn one score.
      target_refs: *id007
      evidence_refs:
      - evidence_requirements.t01.c3
    - effect_id: verified-evidence
      effect_class: evidence_effect
      description: |-
        The API emits a manifest-read event containing the token's courier ID, target
        delivery ID, and object version. Scoring accepts only the expected scoped read,
        which also makes the manifest available as player evidence.
      target_refs: *id003
      evidence_refs:
      - evidence_requirements.t01.c3
    failure_classes:
    - precondition_unsatisfied
    - authority_denied
    - target_unavailable
    - partial_success
    - backend_error
    - unknown
  c4:
    semantic_version: 1.0.0
    lifecycle_state: draft
    behavioral_granularity: aggregate
    procedure_basis: |-
      One helper argument is incorporated into a secondary diagnostic action without
      the validation applied to the public report path. The intended solution class
      is analysis of the supplied helper's real input handling to invoke that action
      in its existing context; it is not a generic host compromise exercise.
    realization_profile: backend-declared
    fidelity_claim: The authored mechanism, normal behavior, proof, authority limits, and reset requirements
      are required. Hosting and their implementation remain backend-declared.
    preconditions:
    - precondition_id: eligibility
      precondition_class: authority
      description: Satisfy one complete alternative in the referenced workflow and obtain the required
        scoped access to every listed surface.
      support_refs:
      - workflows.t01.c4
      - features.training.t-workbench
    - precondition_id: normal-surface
      precondition_class: target
      description: |-
        The dispatch diagnostic helper accepts a delivery selector and produces a
        sanitized public report from a local rehearsal dataset. A separate internal
        summary is available only to the helper's service context and is tied to the
        same delivery record.
      support_refs: *id008
    - precondition_id: boundaries-and-reset
      precondition_class: realization
      description: |-
        These are requirements on the realized environment. Apply reset behavior only when a participant reset is requested, not on challenge completion.

        The helper runs against a card-local data directory with no network route,
        shell persistence, or reusable system credential. Reset recreates its player
        workspace and diagnostic audit log.
      support_refs:
      - features.training.t-workbench
    effects:
    - effect_id: outcome
      effect_class: intended_effect
      description: Recover the internal summary through an action in the helper's actual context. Echoing
        supplied text or returning an ordinary report is insufficient.
      target_refs: *id008
      evidence_refs:
      - evidence_requirements.t01.c4
    - effect_id: verified-evidence
      effect_class: evidence_effect
      description: |-
        The helper records a successful internal-summary retrieval with the selected
        delivery and returns the record's immutable summary. Completion requires that
        server-side action, not echoed input or an ordinary public report.
      target_refs: *id004
      evidence_refs:
      - evidence_requirements.t01.c4
    failure_classes:
    - precondition_unsatisfied
    - authority_denied
    - target_unavailable
    - partial_success
    - backend_error
    - unknown
