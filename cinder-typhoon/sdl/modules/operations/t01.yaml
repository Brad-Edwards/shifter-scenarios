evidence_requirements:
  c1:
    description: |-
      Recover the actual handover and its delivery reference. It provides story context but no required campaign credential.

      Required technical proof: Completion requires the historical handover contents and its matching delivery
      reference. The scorer checks the fixture revision and tracker ID against the
      player's isolated evidence record; no credential or standing authority results.
    source_refs: &id001
    - features.training.t-workbench
    scope: Per-participant in-world evidence; no other participant state.
    boundary_kind: assertion_evaluation
    channel: other
    artifact_role: proposition_truth_evidence
    sensitivity: plain
    redaction: redact_secrets
    integrity: checksum
    retention: run_lifetime
    loss_disclosure: required
    observation_demand:
      rule_id: fact-t01-1
      scope: /features
      purpose: experimental
      mode: selected
      selector:
        semantic_scope: /features
        data_kind: artifact
        names:
        - cinder.t01-1.satisfied
        component_refs:
        - features.training.t-workbench
      collection: require
      retention: require
      redaction: redact-secrets
      integrity: checksum
      required: true
      basis: observed
    notes:
    - |-
      Author checks: Verify the visible note is empty, its prior content is recoverable through an
      ordinary local path, the tracker reference resolves once, arbitrary filenames
      do not score, and a reset returns the starting checkout.
  c2:
    description: |-
      Recover the actual unpublished amendment and its delivery binding. Finding an address alone does not count.

      Required technical proof: The amendment carries a delivery binding that matches the public notice. A
      server-side retrieval event and the amendment's immutable record ID establish
      completion; an address or a guessed identifier alone does not.
    source_refs: &id002
    - features.training.t-workbench
    scope: Per-participant in-world evidence; no other participant state.
    boundary_kind: assertion_evaluation
    channel: other
    artifact_role: proposition_truth_evidence
    sensitivity: plain
    redaction: redact_secrets
    integrity: checksum
    retention: run_lifetime
    loss_disclosure: required
    observation_demand:
      rule_id: fact-t01-2
      scope: /features
      purpose: experimental
      mode: selected
      selector:
        semantic_scope: /features
        data_kind: artifact
        names:
        - cinder.t01-2.satisfied
        component_refs:
        - features.training.t-workbench
      collection: require
      retention: require
      redaction: redact-secrets
      integrity: checksum
      required: true
      basis: observed
    notes:
    - |-
      Author checks: Check that the notice supplies a fair content lead, metadata names one relevant
      retired item, the amendment matches the delivery record, random path scans do
      not create completion, and the expected retrieval is auditable.
  c3:
    description: |-
      Recover and use the limited credential to obtain the protected manifest. Credential discovery and use earn one score.

      Required technical proof: The API emits a manifest-read event containing the token's courier ID, target
      delivery ID, and object version. Scoring accepts only the expected scoped read,
      which also makes the manifest available as player evidence.
    source_refs: &id003
    - features.training.t-workbench
    scope: Per-participant in-world evidence; no other participant state.
    boundary_kind: assertion_evaluation
    channel: other
    artifact_role: proposition_truth_evidence
    sensitivity: plain
    redaction: redact_secrets
    integrity: checksum
    retention: run_lifetime
    loss_disclosure: required
    observation_demand:
      rule_id: fact-t01-3
      scope: /features
      purpose: experimental
      mode: selected
      selector:
        semantic_scope: /features
        data_kind: artifact
        names:
        - cinder.t01-3.satisfied
        component_refs:
        - features.training.t-workbench
      collection: require
      retention: require
      redaction: redact-secrets
      integrity: checksum
      required: true
      basis: observed
    notes:
    - |-
      Author checks: Confirm a normal courier read succeeds, the intended profile maps to one
      courier, a different delivery is denied, copied token text without an API event
      does not score, and reset invalidates the old token.
  c4:
    description: |-
      Recover the internal summary through an action in the helper's actual context. Echoing supplied text or returning an ordinary report is insufficient.

      Required technical proof: The helper records a successful internal-summary retrieval with the selected
      delivery and returns the record's immutable summary. Completion requires that
      server-side action, not echoed input or an ordinary public report.
    source_refs: &id004
    - features.training.t-workbench
    scope: Per-participant in-world evidence; no other participant state.
    boundary_kind: assertion_evaluation
    channel: other
    artifact_role: proposition_truth_evidence
    sensitivity: plain
    redaction: redact_secrets
    integrity: checksum
    retention: run_lifetime
    loss_disclosure: required
    observation_demand:
      rule_id: fact-t01-4
      scope: /features
      purpose: experimental
      mode: selected
      selector:
        semantic_scope: /features
        data_kind: artifact
        names:
        - cinder.t01-4.satisfied
        component_refs:
        - features.training.t-workbench
      collection: require
      retention: require
      redaction: redact-secrets
      integrity: checksum
      required: true
      basis: observed
    notes:
    - |-
      Author checks: Test an ordinary report, the intended bounded secondary action, rejected
      malformed selectors, absence of access outside the fixture directory, the audit
      record, and a clean reset.
propositions:
  c1:
    description: Recover the actual handover and its delivery reference. It provides story context but
      no required campaign credential.
    subjects: *id001
    basis: observed_state
    predicate:
      kind: boolean
      property: cinder.t01-1.satisfied
      semantic_ref: urn:cinder-typhoon:fact:T01.1
      operator: equals
      expected: true
    evidence_requirements:
    - c1
    quantifier: all
  c2:
    description: Recover the actual unpublished amendment and its delivery binding. Finding an address
      alone does not count.
    subjects: *id002
    basis: observed_state
    predicate:
      kind: boolean
      property: cinder.t01-2.satisfied
      semantic_ref: urn:cinder-typhoon:fact:T01.2
      operator: equals
      expected: true
    evidence_requirements:
    - c2
    quantifier: all
  c3:
    description: Recover and use the limited credential to obtain the protected manifest. Credential discovery
      and use earn one score.
    subjects: *id003
    basis: observed_state
    predicate:
      kind: boolean
      property: cinder.t01-3.satisfied
      semantic_ref: urn:cinder-typhoon:fact:T01.3
      operator: equals
      expected: true
    evidence_requirements:
    - c3
    quantifier: all
  c4:
    description: Recover the internal summary through an action in the helper's actual context. Echoing
      supplied text or returning an ordinary report is insufficient.
    subjects: *id004
    basis: observed_state
    predicate:
      kind: boolean
      property: cinder.t01-4.satisfied
      semantic_ref: urn:cinder-typhoon:fact:T01.4
