action_contracts:
  c1:
    semantic_version: 1.0.0
    lifecycle_state: draft
    behavioral_granularity: aggregate
    procedure_basis: 'The current tree is intentionally incomplete while the ancestor object remains

      reachable through ordinary Git history. The intended solution is to clone or

      browse that repository, recover the ancestor `handover.md`, and correlate its

      single delivery ID with the tracker. No hidden path or arbitrary filename guess

      is required.'
    realization_profile: backend-declared
    fidelity_claim: The authored mechanism, normal behavior, observable outcome, and authority boundaries constrain
      realization. Validation is not evidence that the application has been built or that the mechanism works.
    preconditions:
    - precondition_id: eligibility
      precondition_class: authority
      description: Satisfy one complete alternative in the referenced workflow and obtain the required scoped access
        to every listed surface.
      support_refs:
      - workflows.t01.c1
      - features.training.t-workbench
    - precondition_id: normal-surface
      precondition_class: target
      description: '`workbench.training:8080` publishes the workspace index, the read-only

        `handover.git` smart-HTTP repository, and `workspace/delivery-tracker.csv`.

        The repository has exactly two deterministic commits. `handover-written`

        contains a completed `handover.md` naming `DL-204` and courier `CR-17`;

        `blank-template` is its child and replaces that file with the visible blank

        template. The tracker contains exactly one `DL-204` row. Authors, committers,

        UTC times, messages, modes, parents, paths, and bytes are fixed by

        `repository-seed.json`.'
      support_refs:
      - features.training.t-workbench
      - content.training-workbench-content.workbench-index-md
      - content.training-workbench-content.workbench-workspace-handover-current-md
      - content.training-workbench-content.workbench-workspace-delivery-tracker-csv
      - content.training-workbench-content.workbench-workspace-repository-seed-json
    - precondition_id: boundaries
      precondition_class: realization
      description: 'The worktree is read-only and contains only training fixtures. The retained

        commit graph and tracker remain unchanged by reads.'
      support_refs:
      - features.training.t-workbench
    effects:
    - effect_id: outcome
      effect_class: intended_effect
      description: Recover the actual handover and its delivery reference. It provides story context but no required
        campaign credential.
      target_refs:
      - features.training.t-workbench
      evidence_refs:
      - evidence_requirements.t01.c1
    - effect_id: verified-evidence
      effect_class: evidence_effect
      description: 'The recovered handover carries the delivery reference matching the tracker.

        Its bytes belong to an actual historical revision, not a file fabricated after

        the fact. Recovery creates no credential or standing authority.'
      target_refs:
      - features.training.t-workbench
      evidence_refs:
      - evidence_requirements.t01.c1
    failure_classes:
    - precondition_unsatisfied
    - authority_denied
    - target_unavailable
    - partial_success
    - backend_error
    - unknown
  c2:
    semantic_version: 1.0.0
    lifecycle_state: draft
    behavioral_granularity: aggregate
    procedure_basis: 'The amendment was removed from navigation but not from the published retired

      content index or its fixed route. The intended solution follows the notice,

      manifest, and retired index in order, then retrieves the bound record. Directory

      enumeration and wordlists are unnecessary.'
    realization_profile: backend-declared
    fidelity_claim: The authored mechanism, normal behavior, observable outcome, and authority boundaries constrain
      realization. Validation is not evidence that the application has been built or that the mechanism works.
    preconditions:
    - precondition_id: eligibility
      precondition_class: authority
      description: Satisfy one complete alternative in the referenced workflow and obtain the required scoped access
        to every listed surface.
      support_refs:
      - workflows.t01.c2
      - features.training.t-workbench
    - precondition_id: normal-surface
      precondition_class: target
      description: '`workbench.training:8081` is a read-only dispatch site. `/notice-DL-204.md`

        names the shipment and tells offline clients to use `/site.webmanifest`. That

        manifest names `/content/current.json` and `/content/retired.json`; the retired

        index binds record `AMEND-204` and delivery `DL-204` to

        `/retired/amendment-AMEND-204.json`. The amendment contains revision 2, Bay 4,

        and the courier-verification instruction. Unknown paths return 404 and every

        non-read method returns 405.'
      support_refs:
      - features.training.t-workbench
      - content.training-workbench-content.workbench-dispatch-index-md
      - content.training-workbench-content.workbench-dispatch-notice-dl-204-md
      - content.training-workbench-content.workbench-dispatch-site-webmanifest
      - content.training-workbench-content.workbench-dispatch-current-json
      - content.training-workbench-content.workbench-dispatch-retired-json
      - content.training-workbench-content.workbench-dispatch-amendment-amend-204-json
    - precondition_id: boundaries
      precondition_class: realization
      description: 'Only the fixed rehearsal content namespace is exposed. The site has no write

        route. Reading a document does not modify the published inventory.'
      support_refs:
      - features.training.t-workbench
    effects:
    - effect_id: outcome
      effect_class: intended_effect
      description: Recover the actual unpublished amendment and its delivery binding. Finding an address alone does
        not count.
      target_refs:
      - features.training.t-workbench
      evidence_refs:
      - evidence_requirements.t01.c2
    - effect_id: verified-evidence
      effect_class: evidence_effect
      description: 'The retrieved amendment''s immutable record ID and delivery reference agree

        with the public notice. The server retains its ordinary retrieval audit.

        An address alone is not the amendment.'
      target_refs:
      - features.training.t-workbench
      evidence_refs:
      - evidence_requirements.t01.c2
    failure_classes:
    - precondition_unsatisfied
    - authority_denied
    - target_unavailable
    - partial_success
    - backend_error
    - unknown
  c3:
    semantic_version: 1.0.0
    lifecycle_state: draft
    behavioral_granularity: aggregate
    procedure_basis: 'The decommissioned profile retains the still-valid bearer value in an ordinary

      client field. The intended solution is to read its explicit courier/delivery

      scope and replay the normal manifest request. Reading the profile alone is not

      the required protected read.'
    realization_profile: backend-declared
    fidelity_claim: The authored mechanism, normal behavior, observable outcome, and authority boundaries constrain
      realization. Validation is not evidence that the application has been built or that the mechanism works.
    preconditions:
    - precondition_id: eligibility
      precondition_class: authority
      description: Satisfy one complete alternative in the referenced workflow and obtain the required scoped access
        to every listed surface.
      support_refs:
      - workflows.t01.c3
      - features.training.t-workbench
    - precondition_id: normal-surface
      precondition_class: target
      description: 'The workspace publishes `/retired-client/profile.json` and its request history.

        The profile names courier `CR-17`, delivery `DL-204`, the API at

        `workbench.training:8082`, and the synthetic bearer credential. Native

        application RBAC grants that principal only `read` on `manifest/DL-204`.

        `GET /api/deliveries/{delivery_id}/manifest` returns object `MF-204` revision 4

        for the permitted delivery, 401 for missing/wrong access, 403 for another

        delivery or listing, and 405 for writes.'
      support_refs:
      - features.training.t-workbench
      - content.training-workbench-content.workbench-courier-profile-json
      - content.training-workbench-content.workbench-courier-request-history-txt
      - content.training-workbench-content.workbench-courier-manifest-dl-204-json
      - content.training-workbench-content.workbench-service-contract-json
    - precondition_id: boundaries
      precondition_class: realization
      description: 'The courier credential is individual to this rehearsal workspace. It can read

        one synthetic manifest and cannot list, write, or access a non-training service.

        Reading the manifest does not consume the credential or change its permissions.'
      support_refs:
      - features.training.t-workbench
    effects:
    - effect_id: outcome
      effect_class: intended_effect
      description: Recover and use the limited credential to obtain the protected manifest.
      target_refs:
      - features.training.t-workbench
      evidence_refs:
      - evidence_requirements.t01.c3
    - effect_id: verified-evidence
      effect_class: evidence_effect
      description: 'The API returns the actual manifest and emits its ordinary manifest-read audit

        with courier ID, delivery ID, and object version. The response makes the

        document available without changing the credential''s permissions.'
      target_refs:
      - features.training.t-workbench
      evidence_refs:
      - evidence_requirements.t01.c3
    failure_classes:
    - precondition_unsatisfied
    - authority_denied
    - target_unavailable
    - partial_success
    - backend_error
    - unknown
  c4:
    semantic_version: 1.0.0
    lifecycle_state: draft
    behavioral_granularity: aggregate
    procedure_basis: 'The helper first checks that the raw, not-yet-decoded `view` begins with

      `public/`; it then percent-decodes exactly once and normalizes the result without

      rechecking the public prefix. The intended value is

      `public%2F..%2Finternal%2FDL-204.json`, which normalizes to the existing internal

      record while remaining inside the fixed diagnostic root. Paths outside that

      root are rejected. Values are never interpolated into a command or executed.'
    realization_profile: backend-declared
    fidelity_claim: The authored mechanism, normal behavior, observable outcome, and authority boundaries constrain
      realization. Validation is not evidence that the application has been built or that the mechanism works.
    preconditions:
    - precondition_id: eligibility
      precondition_class: authority
      description: Satisfy one complete alternative in the referenced workflow and obtain the required scoped access
        to every listed surface.
      support_refs:
      - workflows.t01.c4
      - features.training.t-workbench
    - precondition_id: normal-surface
      precondition_class: target
      description: '`workbench.training:8083` exposes

        `GET /api/diagnostics/render?delivery_id=DL-204&view=...`. The default view is

        `public/DL-204.json`; the separate existing internal record is

        `internal/DL-204.json` with summary ID `DS-204-I`. The helper accepts only

        delivery `DL-204`, reads JSON beneath `/var/lib/cinder-workbench/diagnostics`,

        and records the raw view, normalized relative path, summary ID, status, and UTC

        time.'
      support_refs:
      - features.training.t-workbench
      - content.training-workbench-content.workbench-diagnostics-public-dl-204-json
      - content.training-workbench-content.workbench-diagnostics-internal-dl-204-json
      - content.training-workbench-content.workbench-service-contract-json
    - precondition_id: boundaries
      precondition_class: realization
      description: 'The helper uses only its private rehearsal data directory. Its service context

        has no outbound network access, persistent shell, or reusable system credential.

        A report request does not recreate the workspace or erase earlier activity.'
      support_refs:
      - features.training.t-workbench
    effects:
    - effect_id: outcome
      effect_class: intended_effect
      description: Recover the internal summary through an action in the helper's actual context. Echoing supplied
        text or returning an ordinary report is insufficient.
      target_refs:
      - features.training.t-workbench
      evidence_refs:
      - evidence_requirements.t01.c4
    - effect_id: verified-evidence
      effect_class: evidence_effect
      description: 'The helper returns the existing internal summary for the selected delivery

        and records that retrieval in its ordinary service audit. Echoed input and

        the public report are not the internal record.'
      target_refs:
      - features.training.t-workbench
      evidence_refs:
      - evidence_requirements.t01.c4
    failure_classes:
    - precondition_unsatisfied
    - authority_denied
    - target_unavailable
    - partial_success
    - backend_error
    - unknown
