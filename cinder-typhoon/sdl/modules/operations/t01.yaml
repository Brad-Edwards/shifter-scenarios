objectives:
  c1:
    name: 'T01.1: The copy nobody deleted'
    description: 'The last training operator left an empty handover note and an unfinished delivery. Recover the
      missing handover from the supplied workspace.


      Gives a new player a quick evidence-recovery success with a recognizable purpose.'
    agent: participant.operator
    actions:
    - t01.c1
    targets:
    - features.training.t-workbench
    success:
      mode: all_of
      assertions:
      - c1-done
    window:
      workflows:
      - t01.c1
  c2:
    name: 'T01.2: Off the menu'
    description: 'The training dispatch site removed its rehearsal page from the menu. Find the page and recover
      the delivery amendment the public notice omits.


      Introduces a separate web discovery with useful information.'
    agent: participant.operator
    actions:
    - t01.c2
    targets:
    - features.training.t-workbench
    success:
      mode: all_of
      assertions:
      - c2-done
    window:
      workflows:
      - t01.c2
  c3:
    name: 'T01.3: A token with a job'
    description: 'Recover the retired courier client''s usable access and retrieve the sealed manifest assigned
      to that courier.


      Turns recovered access into a scoped information result.'
    agent: participant.operator
    actions:
    - t01.c3
    targets:
    - features.training.t-workbench
    success:
      mode: all_of
      assertions:
      - c3-done
    window:
      workflows:
      - t01.c3
  c4:
    name: 'T01.4: The helper has another job'
    description: 'Make the dispatch diagnostic helper reveal the internal delivery summary that its ordinary report
      leaves out.


      Provides an early application-exploitation payoff.'
    agent: participant.operator
    actions:
    - t01.c4
    targets:
    - features.training.t-workbench
    success:
      mode: all_of
      assertions:
      - c4-done
    window:
      workflows:
      - t01.c4
