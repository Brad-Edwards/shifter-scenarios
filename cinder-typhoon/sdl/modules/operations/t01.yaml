      scope: /features
      purpose: experimental
      mode: selected
      selector:
        semantic_scope: /features
        data_kind: artifact
        names:
        - cinder.t01-2.satisfied
        component_refs:
        - features.training.t-workbench
      collection: require
      retention: require
      redaction: redact-secrets
      integrity: checksum
      required: true
      basis: observed
    notes:
    - 'Author checks: Check that the notice supplies a content lead, metadata names the relevant

      retired item, the amendment matches the delivery, and its retrieval is audited.

      Verify that no published route writes the collection.'
  c3:
    description: 'Recover and use the limited credential to obtain the protected manifest.


      Required technical proof: The API returns the actual manifest and emits its ordinary manifest-read audit

      with courier ID, delivery ID, and object version. The response makes the

      document available without changing the credential''s permissions.'
    source_refs:
    - features.training.t-workbench
    scope: Per-participant in-world evidence; no other participant state.
