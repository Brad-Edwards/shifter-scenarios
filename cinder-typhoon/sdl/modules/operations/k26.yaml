evidence_requirements:
  c1:
    description: |-
      Publish the compatible changed package with the correct tenant/channel binding. This supplies A03. Customer-side activation and execution remain K26.2.

      Required technical proof: Completion is observed by the owning service from the fresh result and its immutable audit correlation. The evidence binds the participant, accepted identity or job, exact input and output identifiers, relevant revision or digest, and destination-side observation where a second service consumes the result. Objective evaluation does not create the result or grant authority.
    source_refs:
    - features.k-delivery.k-registry
    scope: Per-participant in-world evidence; no other participant state.
    boundary_kind: assertion_evaluation
    channel: other
    artifact_role: proposition_truth_evidence
    sensitivity: plain
    redaction: redact_secrets
    integrity: checksum
    retention: run_lifetime
    loss_disclosure: required
    observation_demand:
      rule_id: fact-k26-1
      scope: /features
      purpose: experimental
      mode: selected
      selector:
        semantic_scope: /features
        data_kind: artifact
        names:
        - cinder.k26-1.satisfied
        component_refs:
        - features.k-delivery.k-registry
      collection: require
      retention: require
      redaction: redact-secrets
      integrity: checksum
      required: true
      basis: observed
    notes:
    - 'Author checks: Verify the normal baseline, the exact intended path, and the fresh evidence described above.
      Reject a wrong identifier, revision, digest, tenant, identity, stale result, or cross-participant reference.
      Verify unrelated records and permissions remain unchanged and that the result remains recognizable and usable
      by every declared downstream consumer.'
  c2:
    description: |-
      Resolve actual consumer activation and demonstrate execution in FieldKest's limited ARWC corporate context. This supplies A04 and CORPORATE; an upload or registry receipt alone is insufficient.

      The conclusion pairs the supplied release with the ARWC connector's actual changed output and customer identity. The maintenance ticket the operator knew from KeplerOps now appears in its customer context under ARWC's name. The effect is their package running at the victim, with the existing execution evidence making that transition tangible. Customer identity and a familiar ticket alone are not proof of execution.

      Required technical proof: Completion is observed by the owning service from the fresh result and its immutable audit correlation. The evidence binds the participant, accepted identity or job, exact input and output identifiers, relevant revision or digest, and destination-side observation where a second service consumes the result. Objective evaluation does not create the result or grant authority.
    source_refs:
    - features.k-delivery.k-registry
    - features.a-corporate.a-connector
    scope: Per-participant in-world evidence; no other participant state.
    boundary_kind: assertion_evaluation
    channel: other
    artifact_role: proposition_truth_evidence
    sensitivity: plain
    redaction: redact_secrets
    integrity: checksum
    retention: run_lifetime
    loss_disclosure: required
    observation_demand:
      rule_id: fact-k26-2
      scope: /features
      purpose: experimental
      mode: selected
      selector:
        semantic_scope: /features
        data_kind: artifact
        names:
        - cinder.k26-2.satisfied
        component_refs:
        - features.k-delivery.k-registry
        - features.a-corporate.a-connector
      collection: require
      retention: require
      redaction: redact-secrets
      integrity: checksum
      required: true
      basis: observed
    notes:
    - 'Author checks: Verify the normal baseline, the exact intended path, and the fresh evidence described above.
      Reject a wrong identifier, revision, digest, tenant, identity, stale result, or cross-participant reference.
      Verify unrelated records and permissions remain unchanged and that the result remains recognizable and usable
      by every declared downstream consumer.'
  c3:
    description: |-
      Demonstrate a fresh consumption through the distinct rollback/version-selection weakness in a private future-state rehearsal. Replaying the first execution is insufficient.

      Required technical proof: Completion is observed by the owning service from the fresh result and its immutable audit correlation. The evidence binds the participant, accepted identity or job, exact input and output identifiers, relevant revision or digest, and destination-side observation where a second service consumes the result. Objective evaluation does not create the result or grant authority.
    source_refs:
    - features.k-delivery.k-registry
    - features.a-corporate.a-connector
    scope: Per-participant in-world evidence; no other participant state.
    boundary_kind: assertion_evaluation
    channel: other
    artifact_role: proposition_truth_evidence
    sensitivity: plain
    redaction: redact_secrets
    integrity: checksum
    retention: run_lifetime
    loss_disclosure: required
    observation_demand:
      rule_id: fact-k26-3
      scope: /features
      purpose: experimental
      mode: selected
      selector:
