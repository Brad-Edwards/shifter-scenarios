    subjects:
    - features.k-delivery.k-registry
    basis: observed_state
    predicate:
      kind: boolean
      property: cinder.k26-1.satisfied
      semantic_ref: urn:cinder-typhoon:fact:K26.1
      operator: equals
      expected: true
    evidence_requirements:
