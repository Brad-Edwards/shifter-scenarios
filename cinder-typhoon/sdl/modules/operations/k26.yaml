assertions:
  c1-ready:
    proposition: c1
    role: precondition
    polarity: positive
  c1-done:
    proposition: c1
    role: postcondition
    polarity: positive
  c2-ready:
    proposition: c2
    role: precondition
    polarity: positive
  c2-done:
    proposition: c2
    role: postcondition
    polarity: positive
  c3-ready:
    proposition: c3
    role: precondition
    polarity: positive
  c3-done:
    proposition: c3
    role: postcondition
    polarity: positive
objectives:
  c1:
    name: 'K26.1: Ready for their channel'
    description: |-
      Build an altered FieldKest package that preserves the customer's expected interface and publish it to the release channel the active ARWC integration consumes.

      Turns supplier authority into a customer-compatible delivery artifact.
    agent: participant.operator
    actions:
    - k26.c1
    targets:
    - features.k-delivery.k-registry
    success:
      mode: all_of
      assertions:
      - c1-done
    window:
      workflows:
      - k26.c1
  c2:
    name: 'K26.2: Customer accepted'
    description: |-
      Make the active ARWC connector select and run your published package. Demonstrate the changed behavior from the customer's side.

      Pays off the organization transition with the same ticket under new letterhead.
    agent: participant.operator
    actions:
    - k26.c2
    targets:
    - features.k-delivery.k-registry
    - features.a-corporate.a-connector
    success:
      mode: all_of
      assertions:
      - c2-done
    window:
      workflows:
      - k26.c2
  c3:
    name: 'K26.3: The release they can roll back to'
    description: |-
      Establish a separate retained delivery option through the customer's rollback workflow, even when the current release selection has moved on.

      Adds an optional supplier persistence conclusion after initial delivery.
    agent: participant.operator
    actions:
    - k26.c3
    targets:
    - features.k-delivery.k-registry
    - features.a-corporate.a-connector
    success:
      mode: all_of
      assertions:
      - c3-done
    window:
      workflows:
      - k26.c3
workflows:
  c1:
    description: 'K26.1: availability follows the evidence/authority alternatives. This independent objective may
      be revisited when facts change; no campaign-wide sequence or deadline is imposed.'
    start: requirements
    steps:
      requirements:
        type: switch
        cases:
        - when:
            assertions:
            - capabilities.a01-ready
            - capabilities.g02-ready
          next: attempt
        - when:
            assertions:
            - k20.c3-ready
            - capabilities.g02-ready
            - capabilities.g03-ready
          next: attempt
        default: unavailable
      available:
        type: end
      unavailable:
        type: end
      attempt:
        type: objective
        execution_mode: objective
        objective: k26.c1
        on_success: available
        on_failure: unavailable
  c2:
    description: 'K26.2: availability follows the evidence/authority alternatives. This independent objective may
      be revisited when facts change; no campaign-wide sequence or deadline is imposed.'
    start: requirements
    steps:
      requirements:
        type: switch
        cases:
        - when:
            assertions:
            - k26.c1-ready
          next: attempt
        default: unavailable
      available:
        type: end
      unavailable:
        type: end
      attempt:
        type: objective
        execution_mode: objective
        objective: k26.c2
        on_success: available
        on_failure: unavailable
  c3:
    description: 'K26.3: availability follows the evidence/authority alternatives. This independent objective may
      be revisited when facts change; no campaign-wide sequence or deadline is imposed.'
    start: requirements
    steps:
      requirements:
        type: switch
        cases:
        - when:
            assertions:
            - k26.c2-ready
          next: attempt
        default: unavailable
      available:
        type: end
      unavailable:
        type: end
      attempt:
        type: objective
        execution_mode: objective
        objective: k26.c3
        on_success: available
        on_failure: unavailable
action_contracts:
  c1:
    semantic_version: 1.0.0
    lifecycle_state: draft
    behavioral_granularity: aggregate
    procedure_basis: 'The intended path is limited to the authored software, data, configuration, identity, permission,
      or state described above. The participant must exercise that real condition through the declared service interface
      and produce this result: Compatible changed package 7.4.3-cinder.<participant> and publication/approval audit.
      Merely describing the condition, editing a local copy, or presenting a value obtained from another surface
      does not satisfy the contract.'
    realization_profile: backend-declared
    fidelity_claim: The exact starting state, service transition, denial cases, participant-state persistence, and
      independently owned evidence are required. Backend choices remain open only where they cannot change those
      facts.
    preconditions:
    - precondition_id: eligibility
      precondition_class: authority
      description: Satisfy one complete alternative in the referenced workflow and obtain the required scoped access
        to every listed surface.
      support_refs:
      - workflows.k26.c1
      - features.k-delivery.k-registry
    - precondition_id: normal-surface
      precondition_class: target
      description: '`k-registry` owns this part of the operation. Its starting state is exact: G03 interface contract;
        G02 channel arwc-stable; A01 or K20 approval authority. The owning service uses the listener, route, identity,
        authorization, storage, and audit contract declared in the corresponding world module. Records that are
        not explicitly mutable remain immutable. The private service-loader contract `content.keplerops-k-registry.k26-1-ready-for-their-channel`
        freezes the request, denial, state-transition, evidence, and any exploit-critical implementation details.'
      support_refs:
      - features.k-delivery.k-registry
      - content.keplerops-k-registry.k26-1-ready-for-their-channel
    - precondition_id: scope-and-persistence
      precondition_class: realization
      description: Supplies A03; not execution. Participant-created service state persists for the life of the participant
        world and ordinary retries do not erase it. The selected route cannot act on unrelated tenants, records,
        packages, identities, jobs, or services. Infrastructure recovery and submission adjudication are outside
        this in-world contract.
      support_refs:
      - features.k-delivery.k-registry
    effects:
    - effect_id: outcome
      effect_class: intended_effect
      description: Publish the compatible changed package with the correct tenant/channel binding. This supplies
        A03. Customer-side activation and execution remain K26.2.
      target_refs:
      - features.k-delivery.k-registry
      evidence_refs:
      - evidence_requirements.k26.c1
    failure_classes:
    - precondition_unsatisfied
    - authority_denied
    - target_unavailable
    - partial_success
    - backend_error
    - unknown
