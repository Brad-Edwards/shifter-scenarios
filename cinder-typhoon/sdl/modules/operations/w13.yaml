objectives:
  c1:
    name: 'W13.1: Window on Thursday'
    description: |-
      Recover the upcoming outlet-inspection appointment and its maintenance reference.

      Gives the planner's inspection a concrete schedule and purpose.
    agent: participant.operator
    actions:
    - w13.c1
    targets: &id005
    - features.a-maintenance.a-contractors
    success:
      mode: all_of
      assertions:
      - c1-done
    window:
      workflows:
      - w13.c1
  c2:
    name: 'W13.2: Who is expected at the gate'
    description: |-
      Recover the separate access roster for the inspection crew and identify the relevant contractor assignment.

      Adds independent identity evidence for the appointment.
    agent: participant.operator
    actions:
    - w13.c2
    targets: &id006
    - features.a-maintenance.a-contractors
    success:
      mode: all_of
      assertions:
      - c2-done
    window:
      workflows:
      - w13.c2
  c3:
    name: 'W13.3: An appointment we do not own'
    description: |-
      Replace the registered attendee on the outlet-inspection appointment with the contractor identity in Cinder's assignment, despite lacking the appointment owner's rights.

      Crosses an administrative boundary before credential issuance.
    agent: participant.operator
    actions:
    - w13.c3
    targets: &id007
    - features.a-maintenance.a-contractors
    success:
      mode: all_of
      assertions:
      - c3-done
    window:
      workflows:
      - w13.c3
  c4:
    name: 'W13.4: Checked in as the contractor'
    description: |-
      Cross the check-in service's separate identity boundary and establish the contractor session for the correct inspection scope.

      Completes the alternative contractor route's identity stage.
    agent: participant.operator
    actions:
    - w13.c4
    targets: &id008
    - features.a-maintenance.a-contractors
    success:
      mode: all_of
      assertions:
      - c4-done
    window:
      workflows:
      - w13.c4
workflows:
  c1:
    description: 'W13.1: availability follows the evidence/authority alternatives. This independent objective
      may be revisited when facts change; no campaign-wide sequence or deadline is imposed.'
    start: requirements
    steps:
      requirements:
        type: switch
        cases:
        - when:
            assertions:
            - capabilities.corporate-ready
          next: attempt
        default: unavailable
      available:
        type: end
      unavailable:
        type: end
      attempt:
        type: objective
        execution_mode: objective
        objective: w13.c1
        on_success: available
        on_failure: unavailable
