objectives:
  c1:
    name: 'W26.1: Which renderer holds the approval'
    description: |-
      Recover the protected maintenance-renderer profile and bind it to the approved inspection.

      Identifies the actual consumer of the earned approval.
    agent: participant.operator
    actions:
    - w26.c1
    targets: &id005
    - features.a-maintenance.a-renderer
    success:
      mode: all_of
      assertions:
      - c1-done
    window:
      workflows:
      - w26.c1
  c2:
    name: 'W26.2: Authority behind the preview'
    description: |-
      Make the maintenance renderer accept a contractor-submitted work package for the privileged inspection preview it normally reserves for the maintenance reviewer.

      Crosses an application privilege boundary before execution.
    agent: participant.operator
    actions:
    - w26.c2
    targets: &id006
    - features.a-maintenance.a-renderer
    success:
      mode: all_of
      assertions:
      - c2-done
    window:
      workflows:
      - w26.c2
  c3:
    name: 'W26.3: The preview executes'
    description: |-
      Make the renderer recover its internal maintenance handover through an action executed under its service identity, while still producing the expected inspection preview.

      Adds an execution capability under real application constraints.
    agent: participant.operator
    actions:
    - w26.c3
    targets: &id007
    - features.a-maintenance.a-renderer
    success:
      mode: all_of
      assertions:
      - c3-done
    window:
      workflows:
      - w26.c3
  c4:
    name: 'W26.4: An approval becomes a control client'
    description: |-
      Cross the remaining render-to-action boundary and establish a live control client bound to the earned contractor identity and maintenance approval.

      Completes the advanced maintenance route to control authority.
    agent: participant.operator
    actions:
    - w26.c4
    targets: &id008
    - features.a-dmz.a-control-broker--maintenance-issuer
    success:
      mode: all_of
      assertions:
      - c4-done
    window:
      workflows:
      - w26.c4
workflows:
  c1:
    description: 'W26.1: availability follows the evidence/authority alternatives. This independent objective
      may be revisited when facts change; no campaign-wide sequence or deadline is imposed.'
    start: requirements
    steps:
      requirements:
        type: switch
        cases:
        - when:
            assertions:
            - capabilities.w13-session-ready
            - capabilities.w15-approval-ready
          next: attempt
        default: unavailable
      available:
        type: end
      unavailable:
        type: end
      attempt:
        type: objective
        execution_mode: objective
        objective: w26.c1
        on_success: available
        on_failure: unavailable
