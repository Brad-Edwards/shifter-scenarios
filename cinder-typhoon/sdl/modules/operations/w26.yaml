objectives:
  c1:
    name: 'This action: Which renderer holds the approval'
    description: |-
      Recover the protected maintenance-renderer profile and bind it to the approved inspection.

      Identifies the actual consumer of the earned approval.
    agent: participant.operator
    actions:
    - w26.c1
    targets:
    - features.a-maintenance.a-renderer
    success:
      mode: all_of
      assertions:
      - c1-done
    window:
      workflows:
      - w26.c1
  c2:
    name: 'This action: Authority behind the preview'
    description: |-
      Make the maintenance renderer accept a contractor-submitted work package for the privileged inspection preview it normally reserves for the maintenance reviewer.

      Crosses an application privilege boundary before execution.
    agent: participant.operator
    actions:
    - w26.c2
    targets:
    - features.a-maintenance.a-renderer
    success:
      mode: all_of
      assertions:
      - c2-done
    window:
      workflows:
      - w26.c2
  c3:
    name: 'This action: The preview executes'
    description: |-
      Make the renderer recover its internal maintenance handover through an action executed under its service identity, while still producing the expected inspection preview.

      Adds an execution capability under real application constraints.
    agent: participant.operator
    actions:
    - w26.c3
    targets:
    - features.a-maintenance.a-renderer
    success:
      mode: all_of
      assertions:
      - c3-done
    window:
      workflows:
      - w26.c3
  c4:
    name: 'This action: An approval becomes a control client'
    description: |-
      Cross the remaining render-to-action boundary and establish a live control client bound to the earned contractor identity and maintenance approval.

      Completes the advanced maintenance route to control authority.
    agent: participant.operator
    actions:
    - w26.c4
    targets:
    - features.a-dmz.a-control-broker--maintenance-issuer
    success:
      mode: all_of
      assertions:
      - c4-done
    window:
      workflows:
      - w26.c4
