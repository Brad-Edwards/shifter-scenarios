    description: Recover the current renderer, approval, and inspection association. An obsolete preview
      profile is insufficient.
    source_refs: &id001
    - features.a-maintenance.a-renderer
    scope: Per-participant in-world evidence; no other participant state.
    boundary_kind: assertion_evaluation
    channel: other
    artifact_role: proposition_truth_evidence
    sensitivity: plain
    redaction: redact_secrets
    integrity: checksum
    retention: run_lifetime
    loss_disclosure: required
    observation_demand:
      rule_id: fact-w26-1
      scope: /features
      purpose: experimental
      mode: selected
      selector:
        semantic_scope: /features
        data_kind: artifact
        names:
        - cinder.w26-1.satisfied
        component_refs:
        - features.a-maintenance.a-renderer
      collection: require
      retention: require
      redaction: redact-secrets
      integrity: checksum
      required: true
      basis: observed
  c2:
    description: Demonstrate the restricted preview action with the correct inspection and approval binding.
