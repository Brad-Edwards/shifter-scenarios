objectives:
  c1:
    name: 'K04.1: A bundle with consequences'
    description: |-
      The support indexer treats uploaded bundles as routine work. Construct a bundle that causes a controlled change beyond the object it should be allowed to affect.

      Begins an optional deep investigation from the initial workstation.
    agent: participant.operator
    actions:
    - k04.c1
    targets:
    - features.k-delivery.k-indexer
    success:
      mode: all_of
      assertions:
      - c1-done
    window:
      workflows:
      - k04.c1
  c2:
    name: 'K04.2: Read past the index'
    description: |-
      Use the compromised indexing behavior to recover protected runtime information that an ordinary bundle cannot see.

      Turns a narrow fault into a new information capability.
    agent: participant.operator
    actions:
    - k04.c2
    targets:
    - features.k-delivery.k-indexer
    success:
      mode: all_of
      assertions:
      - c2-done
    window:
      workflows:
      - k04.c2
  c3:
    name: 'K04.3: Control the allocation'
    description: |-
      The indexer still restricts what your corrupted object can influence. Establish a controlled write capability under those restrictions and demonstrate it against the designated protected state.

      Provides a substantive elite milestone before final execution.
    agent: participant.operator
    actions:
    - k04.c3
    targets:
    - features.k-delivery.k-indexer
    success:
      mode: all_of
      assertions:
      - c3-done
    window:
      workflows:
      - k04.c3
  c4:
    name: 'K04.4: The exception queue'
    description: |-
      Turn the indexer compromise into execution under its service identity. Recover the release-exception queue the support engineer has been trying to clear.

      Completes the native branch with useful release intelligence.
    agent: participant.operator
    actions:
    - k04.c4
    targets:
    - features.k-delivery.k-indexer
    success:
      mode: all_of
      assertions:
      - c4-done
    window:
      workflows:
      - k04.c4
