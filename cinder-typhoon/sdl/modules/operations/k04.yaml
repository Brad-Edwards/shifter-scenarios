action_contracts:
  c1:
    semantic_version: 1.0.0
    lifecycle_state: draft
    behavioral_granularity: aggregate
    procedure_basis: A deliberately flawed deserializer confuses attacker-controlled entry metadata with an internal
      object length. The intended solution is a reproducible, constrained object-boundary corruption that preserves
      service liveness; a crash is not a solution.
    realization_profile: backend-declared
    fidelity_claim: The exact starting state, service transition, denial cases, participant-state persistence, and
      independently owned evidence are required. Backend choices remain open only where they cannot change those
      facts.
    preconditions:
    - precondition_id: eligibility
      precondition_class: authority
      description: Satisfy one complete alternative in the referenced workflow and obtain the required scoped access
        to every listed surface.
      support_refs:
      - workflows.k04.c1
      - features.k-delivery.k-indexer
    - precondition_id: normal-surface
      precondition_class: target
      description: The source-available support indexer accepts signed archive bundles, indexes their entries, and
        maintains an in-memory object graph for the release-exception queue.
      support_refs:
      - features.k-delivery.k-indexer
      - content.keplerops-k-indexer.k04-1-a-bundle-with-consequences
    - precondition_id: scope-and-persistence
      precondition_class: realization
      description: Foundation of isolated elite branch Participant-created service state persists for the life of
        the participant world and ordinary retries do not erase it. The action is limited to the exact records,
        identities, routes, and destination effects declared here; unrelated tenants and services remain denied.
        Infrastructure recovery and submission adjudication are outside this in-world contract.
      support_refs:
      - features.k-delivery.k-indexer
      - content.keplerops-k-indexer.k04-1-a-bundle-with-consequences
    effects:
    - effect_id: outcome
      effect_class: intended_effect
      description: Demonstrate reproducible, controlled corruption across the indexer's object boundary. A crash
        alone is insufficient; this is the foundation for the later capabilities.
      target_refs:
      - features.k-delivery.k-indexer
      evidence_refs:
      - evidence_requirements.k04.c1
    - effect_id: verified-evidence
      effect_class: evidence_effect
      description: The daemon records a controlled mutation of the designated sentinel object and a successful subsequent
        normal index operation.
      target_refs:
      - features.k-delivery.k-indexer
      evidence_refs:
      - evidence_requirements.k04.c1
    failure_classes:
    - precondition_unsatisfied
    - authority_denied
    - target_unavailable
    - partial_success
    - backend_error
    - unknown
