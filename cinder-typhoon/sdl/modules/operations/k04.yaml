    description: Demonstrate reproducible, controlled corruption across the indexer's object boundary. A crash alone
      is insufficient; this is the foundation for the later capabilities.
    subjects:
    - features.k-delivery.k-indexer
    basis: observed_state
    predicate:
      kind: boolean
      property: cinder.k04-1.satisfied
      semantic_ref: urn:cinder-typhoon:fact:K04.1
      operator: equals
      expected: true
    evidence_requirements:
    - c1
    quantifier: all
  c2:
    description: Recover the protected runtime evidence needed to reason about the actual process state. This is
      a separate disclosure capability, not another reward for the first corruption.
    subjects:
    - features.k-delivery.k-indexer
    basis: observed_state
    predicate:
      kind: boolean
      property: cinder.k04-2.satisfied
      semantic_ref: urn:cinder-typhoon:fact:K04.2
      operator: equals
      expected: true
    evidence_requirements:
    - c2
    quantifier: all
  c3:
    description: Demonstrate the scoped write capability while the indexer remains usable. The prior disclosure
