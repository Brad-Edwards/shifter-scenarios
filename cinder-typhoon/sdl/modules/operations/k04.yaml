realization:
  default: open
evidence_requirements:
  c1:
    description: |-
      Demonstrate reproducible, controlled corruption across the indexer's object boundary. A crash alone is insufficient; this is the foundation for the later capabilities.

      Required technical proof: The daemon records a controlled mutation of the designated sentinel object and a successful subsequent normal index operation.
    source_refs:
    - features.k-delivery.k-indexer
    scope: Per-participant in-world evidence; no other participant state.
    boundary_kind: assertion_evaluation
    channel: other
    artifact_role: proposition_truth_evidence
    sensitivity: plain
    redaction: redact_secrets
    integrity: checksum
    retention: run_lifetime
    loss_disclosure: required
    observation_demand:
      rule_id: fact-k04-1
      scope: /features
      purpose: experimental
      mode: selected
      selector:
        semantic_scope: /features
        data_kind: artifact
        names:
        - cinder.k04-1.satisfied
        component_refs:
        - features.k-delivery.k-indexer
      collection: require
      retention: require
      redaction: redact-secrets
      integrity: checksum
      required: true
      basis: observed
    notes:
    - 'Author checks: Test valid indexing, nonpersistent crash rejection, intended sentinel-only mutation, continued
      normal indexing, no out-of-fixture data exposure.'
  c2:
    description: |-
      Recover the protected runtime evidence needed to reason about the actual process state. This is a separate disclosure capability, not another reward for the first corruption.

      Required technical proof: Completion returns the expected runtime descriptor with process generation, protected object marker, and integrity relation checked by the daemon.
    source_refs:
    - features.k-delivery.k-indexer
    scope: Per-participant in-world evidence; no other participant state.
    boundary_kind: assertion_evaluation
    channel: other
    artifact_role: proposition_truth_evidence
    sensitivity: plain
    redaction: redact_secrets
    integrity: checksum
    retention: run_lifetime
    loss_disclosure: required
    observation_demand:
      rule_id: fact-k04-2
      scope: /features
      purpose: experimental
      mode: selected
      selector:
        semantic_scope: /features
        data_kind: artifact
        names:
        - cinder.k04-2.satisfied
        component_refs:
        - features.k-delivery.k-indexer
      collection: require
      retention: require
      redaction: redact-secrets
      integrity: checksum
      required: true
      basis: observed
    notes:
    - 'Author checks: Verify K04.1 alone cannot read the descriptor, partial/incorrect disclosures fail, intended
      runtime evidence is consistent, normal requests remain functional.'
  c3:
    description: |-
      Demonstrate the scoped write capability while the indexer remains usable. The prior disclosure or another crash does not satisfy this achievement.

      Required technical proof: The service accepts completion only when the target state changes to the specified value, its integrity relation remains valid, and a normal indexing transaction still succeeds.
    source_refs:
    - features.k-delivery.k-indexer
    scope: Per-participant in-world evidence; no other participant state.
    boundary_kind: assertion_evaluation
    channel: other
    artifact_role: proposition_truth_evidence
    sensitivity: plain
    redaction: redact_secrets
    integrity: checksum
    retention: run_lifetime
    loss_disclosure: required
    observation_demand:
      rule_id: fact-k04-3
      scope: /features
      purpose: experimental
      mode: selected
      selector:
        semantic_scope: /features
        data_kind: artifact
        names:
        - cinder.k04-3.satisfied
        component_refs:
        - features.k-delivery.k-indexer
      collection: require
      retention: require
      redaction: redact-secrets
      integrity: checksum
      required: true
      basis: observed
    notes:
    - 'Author checks: Test direct state mutation denial, disclosure prerequisite, intended bounded write, integrity
      failure rejection, service liveness after success, and private-state persistence.'
  c4:
    description: |-
      Demonstrate execution in the indexer's actual context and recover the protected exception queue. It is an alternative K29 dossier lead, not cloud authority or ARWC access.

      Required technical proof: The daemon logs the internal routine, service identity, queue record revision, and recovered exception dossier; that dossier is an alternative K29 lead.
    source_refs:
    - features.k-delivery.k-indexer
    scope: Per-participant in-world evidence; no other participant state.
    boundary_kind: assertion_evaluation
    channel: other
    artifact_role: proposition_truth_evidence
    sensitivity: plain
    redaction: redact_secrets
    integrity: checksum
    retention: run_lifetime
    loss_disclosure: required
    observation_demand:
      rule_id: fact-k04-4
      scope: /features
      purpose: experimental
      mode: selected
      selector:
        semantic_scope: /features
        data_kind: artifact
        names:
        - cinder.k04-4.satisfied
        component_refs:
        - features.k-delivery.k-indexer
      collection: require
      retention: require
      redaction: redact-secrets
      integrity: checksum
      required: true
      basis: observed
    notes:
    - 'Author checks: Verify queue access is denied normally, invalid routine arguments fail, intended invocation
      produces one audited dossier, no process escape exists, downstream dossier format is valid.'
