action_contracts:
  c1:
    semantic_version: 1.0.0
    lifecycle_state: draft
    behavioral_granularity: aggregate
    procedure_basis: |-
      This is a source-provenance exercise, not a hidden-path puzzle. The intended
      solution is to use normal Forge and Git history to recover the deleted fixture
      and correlate its assertion with the consumer record.
    realization_profile: backend-declared
    fidelity_claim: The authored mechanism, normal behavior, proof, authority limits, and reset requirements
      are required. Hosting and their implementation remain backend-declared.
    preconditions:
    - precondition_id: eligibility
      precondition_class: authority
      description: Satisfy one complete alternative in the referenced workflow and obtain the required
        scoped access to every listed surface.
      support_refs:
      - workflows.t03.c1
      - features.training.t-developer
    - precondition_id: normal-surface
      precondition_class: target
      description: |-
        A Gitea training repository contains the formatter package, review discussion,
        and a real commit history. A review note names a removed delivery fixture; the
        fixture existed in a prior ordinary commit and describes an expected consumer
        outcome.
      support_refs: *id005
    - precondition_id: boundaries-and-reset
      precondition_class: realization
      description: |-
        These are requirements on the realized environment. Apply reset behavior only when a participant reset is requested, not on challenge completion.

        The repository is read-only for this card and contains only training source.
        History is immutable; reset only removes the player's completion evidence.
      support_refs:
      - features.training.t-developer
    effects:
    - effect_id: outcome
      effect_class: intended_effect
      description: Recover the actual fixture and expected delivery outcome. A revision identifier alone
        does not count.
      target_refs: *id005
      evidence_refs:
      - evidence_requirements.t03.c1
    - effect_id: verified-evidence
      effect_class: evidence_effect
      description: |-
        The fixture's content hash, historical commit, and expected delivery outcome
        are submitted as one evidence record. Scoring verifies the object is an actual
        ancestor artifact and makes its expectation available to T03.4.
      target_refs: *id001
      evidence_refs:
      - evidence_requirements.t03.c1
    failure_classes:
    - precondition_unsatisfied
    - authority_denied
    - target_unavailable
    - partial_success
    - backend_error
    - unknown
  c2:
    semantic_version: 1.0.0
    lifecycle_state: draft
    behavioral_granularity: aggregate
    procedure_basis: |-
      The job output over-discloses a valid but narrowly scoped registry credential.
      The intended solution is to recover it from the genuine build evidence and use
      the registry's normal protected-manifest read, rather than treat log text as
      completion.
    realization_profile: backend-declared
    fidelity_claim: The authored mechanism, normal behavior, proof, authority limits, and reset requirements
      are required. Hosting and their implementation remain backend-declared.
    preconditions:
    - precondition_id: eligibility
      precondition_class: authority
      description: Satisfy one complete alternative in the referenced workflow and obtain the required
        scoped access to every listed surface.
      support_refs:
      - workflows.t03.c2
      - features.training.t-developer
    - precondition_id: normal-surface
      precondition_class: target
      description: |-
        The training build service publishes ordinary failed-job logs and stores its
        rehearsal-channel manifest in the package registry. A failed release step logs
        a registry configuration reference for the job's scoped publisher identity.
      support_refs: *id006
    - precondition_id: boundaries-and-reset
      precondition_class: realization
      description: |-
        These are requirements on the realized environment. Apply reset behavior only when a participant reset is requested, not on challenge completion.

        The credential can read its one manifest and publish only the training formatter
        scope; it cannot alter build configuration or other packages. Reset revokes and
        regenerates the player-specific credential.
      support_refs:
      - features.training.t-developer
    effects:
    - effect_id: outcome
      effect_class: intended_effect
      description: Recover and demonstrate the scoped publication access through the protected manifest.
        This supplies T03.4; copying a credential alone is insufficient.
      target_refs: *id006
      evidence_refs:
      - evidence_requirements.t03.c2
    - effect_id: verified-evidence
      effect_class: evidence_effect
      description: |-
        Registry audit data must show the scoped identity reading the rehearsal-channel
        manifest. That event awards the publication capability consumed by T03.4 and
        records the manifest revision.
      target_refs: *id002
      evidence_refs:
      - evidence_requirements.t03.c2
    failure_classes:
    - precondition_unsatisfied
    - authority_denied
    - target_unavailable
    - partial_success
    - backend_error
    - unknown
  c3:
    semantic_version: 1.0.0
    lifecycle_state: draft
    behavioral_granularity: aggregate
    procedure_basis: |-
      The exercise teaches static package inspection before execution. The intended
      solution class is manifest and source analysis that reconstructs the lifecycle
      action and its bound data flow; no package installation is necessary.
    realization_profile: backend-declared
    fidelity_claim: The authored mechanism, normal behavior, proof, authority limits, and reset requirements
      are required. Hosting and their implementation remain backend-declared.
    preconditions:
    - precondition_id: eligibility
      precondition_class: authority
      description: Satisfy one complete alternative in the referenced workflow and obtain the required
        scoped access to every listed surface.
      support_refs:
      - workflows.t03.c3
      - features.training.t-developer
    - precondition_id: normal-surface
      precondition_class: target
      description: |-
        The supplied npm-compatible training package has a normal manifest, lockfile,
        and unpacked package contents. Its installation lifecycle includes an extra
        action intended for the rehearsal consumer, with data source and destination
        named in the package metadata and fixture code.
      support_refs: *id007
    - precondition_id: boundaries-and-reset
      precondition_class: realization
      description: |-
        These are requirements on the realized environment. Apply reset behavior only when a participant reset is requested, not on challenge completion.

        The package is presented as content only; its lifecycle action is never invoked
        by the player environment. The data names resolve only to synthetic training
        fixtures and reset clears the submitted evidence.
      support_refs:
      - features.training.t-developer
    effects:
    - effect_id: outcome
      effect_class: intended_effect
      description: Recover the package's actual extra behavior with its source and destination binding.
        A suspicious filename or a generic warning is insufficient.
      target_refs: *id007
      evidence_refs:
      - evidence_requirements.t03.c3
    - effect_id: verified-evidence
      effect_class: evidence_effect
      description: |-
        Completion records the lifecycle action, source fixture ID, and intended
        destination ID. The scorer validates all three against the authored package
        revision, rejecting generic warnings or a suspicious filename alone.
      target_refs: *id003
      evidence_refs:
      - evidence_requirements.t03.c3
    failure_classes:
    - precondition_unsatisfied
    - authority_denied
    - target_unavailable
    - partial_success
    - backend_error
    - unknown
  c4:
    semantic_version: 1.0.0
    lifecycle_state: draft
    behavioral_granularity: aggregate
    procedure_basis: |-
      This is a controlled supply-chain construction task. The intended solution
      combines T03.1's expected behavior with T03.2's scoped publication capability
      to create a compatible package that preserves the ordinary report while adding
      the named rehearsal marker.
    realization_profile: backend-declared
    fidelity_claim: The authored mechanism, normal behavior, proof, authority limits, and reset requirements
      are required. Hosting and their implementation remain backend-declared.
    preconditions:
    - precondition_id: eligibility
      precondition_class: authority
      description: Satisfy one complete alternative in the referenced workflow and obtain the required
        scoped access to every listed surface.
      support_refs:
      - workflows.t03.c4
      - features.training.t-developer
    - precondition_id: normal-surface
      precondition_class: target
      description: |-
        The training registry serves a formatter package to a separate consumer
        emulator. The emulator resolves a semver-compatible version, runs a normal
        formatting report, and posts a receipt containing its resolved package and
        output digest.
      support_refs: *id008
    - precondition_id: boundaries-and-reset
      precondition_class: realization
      description: |-
        These are requirements on the realized environment. Apply reset behavior only when a participant reset is requested, not on challenge completion.

        The registry scope, consumer tenant, and report data are player-specific.
        Packages cannot affect other consumers, external package resolution, or later
        campaign systems. Reset restores the consumer lock state and removes player
        published versions.
      support_refs:
      - features.training.t-developer
    effects:
    - effect_id: outcome
      effect_class: intended_effect
      description: Demonstrate a fresh consumer report with the marker and preserved ordinary behavior.
        Construction, publication, activation, and consumption earn one score here.
      target_refs: *id008
      evidence_refs:
      - evidence_requirements.t03.c4
    - effect_id: verified-evidence
      effect_class: evidence_effect
      description: |-
        Completion requires registry publication, consumer resolution after publication,
        and a fresh report receipt showing the marker and baseline behavior. The event
        chain is the score; publishing an unused version does not count.
      target_refs: *id004
      evidence_refs:
      - evidence_requirements.t03.c4
    failure_classes:
    - precondition_unsatisfied
    - authority_denied
    - target_unavailable
    - partial_success
    - backend_error
    - unknown
