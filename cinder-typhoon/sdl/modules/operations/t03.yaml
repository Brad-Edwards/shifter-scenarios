realization:
  default: open
evidence_requirements:
  c1:
    description: |-
      Recover the actual fixture and expected delivery outcome. A revision identifier alone does not count.

      Required technical proof: The fixture's content hash, historical commit, and expected delivery outcome
      are submitted as one evidence record. Scoring verifies the object is an actual
      ancestor artifact and makes its expectation available to T03.4.
    source_refs: &id001
    - features.training.t-developer
    scope: Per-participant in-world evidence; no other participant state.
    boundary_kind: assertion_evaluation
    channel: other
    artifact_role: proposition_truth_evidence
    sensitivity: plain
    redaction: redact_secrets
    integrity: checksum
    retention: run_lifetime
    loss_disclosure: required
    observation_demand:
      rule_id: fact-t03-1
      scope: /features
      purpose: experimental
      mode: selected
      selector:
        semantic_scope: /features
        data_kind: artifact
        names:
        - cinder.t03-1.satisfied
        component_refs:
        - features.training.t-developer
      collection: require
      retention: require
      redaction: redact-secrets
      integrity: checksum
      required: true
      basis: observed
    notes:
    - |-
      Author checks: Confirm the head checkout lacks the fixture, the review note gives a fair lead,
      the parent history contains one matching artifact, an unrelated commit fails,
      and the expected outcome agrees with the consumer fixture.
  c2:
    description: |-
      Recover and demonstrate the scoped publication access through the protected manifest. This supplies T03.4; copying a credential alone is insufficient.

      Required technical proof: Registry audit data must show the scoped identity reading the rehearsal-channel
      manifest. That event awards the publication capability consumed by T03.4 and
      records the manifest revision.
    source_refs: &id002
    - features.training.t-developer
    scope: Per-participant in-world evidence; no other participant state.
    boundary_kind: assertion_evaluation
    channel: other
    artifact_role: proposition_truth_evidence
    sensitivity: plain
    redaction: redact_secrets
    integrity: checksum
    retention: run_lifetime
    loss_disclosure: required
    observation_demand:
      rule_id: fact-t03-2
      scope: /features
      purpose: experimental
      mode: selected
      selector:
        semantic_scope: /features
        data_kind: artifact
        names:
        - cinder.t03-2.satisfied
        component_refs:
        - features.training.t-developer
      collection: require
      retention: require
      redaction: redact-secrets
      integrity: checksum
      required: true
      basis: observed
    notes:
    - |-
      Author checks: Test readable failed logs, correct credential scope, protected manifest read,
      denial for another package scope, absence of score for copied secret text, and
      credential revocation on reset.
  c3:
    description: |-
      Recover the package's actual extra behavior with its source and destination binding. A suspicious filename or a generic warning is insufficient.

      Required technical proof: Completion records the lifecycle action, source fixture ID, and intended
      destination ID. The scorer validates all three against the authored package
      revision, rejecting generic warnings or a suspicious filename alone.
    source_refs: &id003
    - features.training.t-developer
    scope: Per-participant in-world evidence; no other participant state.
    boundary_kind: assertion_evaluation
    channel: other
    artifact_role: proposition_truth_evidence
    sensitivity: plain
    redaction: redact_secrets
    integrity: checksum
    retention: run_lifetime
    loss_disclosure: required
    observation_demand:
      rule_id: fact-t03-3
      scope: /features
      purpose: experimental
      mode: selected
      selector:
        semantic_scope: /features
        data_kind: artifact
        names:
        - cinder.t03-3.satisfied
        component_refs:
        - features.training.t-developer
      collection: require
      retention: require
      redaction: redact-secrets
      integrity: checksum
      required: true
      basis: observed
    notes:
    - |-
      Author checks: Verify ordinary package metadata remains useful, static inspection exposes the
      complete action, the source and destination are unambiguous, installation is
      not required, incomplete data-flow answers fail, and reset is idempotent.
  c4:
    description: |-
      Demonstrate a fresh consumer report with the marker and preserved ordinary behavior. Construction, publication, activation, and consumption earn one score here.

      Required technical proof: Completion requires registry publication, consumer resolution after publication,
      and a fresh report receipt showing the marker and baseline behavior. The event
      chain is the score; publishing an unused version does not count.
    source_refs: &id004
    - features.training.t-developer
    scope: Per-participant in-world evidence; no other participant state.
    boundary_kind: assertion_evaluation
    channel: other
    artifact_role: proposition_truth_evidence
    sensitivity: plain
    redaction: redact_secrets
    integrity: checksum
    retention: run_lifetime
    loss_disclosure: required
    observation_demand:
      rule_id: fact-t03-4
      scope: /features
      purpose: experimental
      mode: selected
      selector:
        semantic_scope: /features
        data_kind: artifact
        names:
        - cinder.t03-4.satisfied
        component_refs:
        - features.training.t-developer
      collection: require
      retention: require
      redaction: redact-secrets
      integrity: checksum
      required: true
      basis: observed
    notes:
    - |-
      Author checks: Test baseline consumer behavior, incompatible version rejection, intended
      compatible resolution, preserved report fields, marker receipt correlation, no
      cross-player consumption, and full package/consumer reset.
propositions:
  c1:
    description: Recover the actual fixture and expected delivery outcome. A revision identifier alone
      does not count.
    subjects: *id001
    basis: observed_state
    predicate:
      kind: boolean
      property: cinder.t03-1.satisfied
      semantic_ref: urn:cinder-typhoon:fact:T03.1
      operator: equals
      expected: true
    evidence_requirements:
    - c1
    quantifier: all
  c2:
    description: Recover and demonstrate the scoped publication access through the protected manifest.
      This supplies T03.4; copying a credential alone is insufficient.
    subjects: *id002
    basis: observed_state
    predicate:
      kind: boolean
      property: cinder.t03-2.satisfied
      semantic_ref: urn:cinder-typhoon:fact:T03.2
      operator: equals
      expected: true
    evidence_requirements:
    - c2
    quantifier: all
  c3:
    description: Recover the package's actual extra behavior with its source and destination binding.
      A suspicious filename or a generic warning is insufficient.
    subjects: *id003
    basis: observed_state
    predicate:
      kind: boolean
      property: cinder.t03-3.satisfied
      semantic_ref: urn:cinder-typhoon:fact:T03.3
      operator: equals
      expected: true
    evidence_requirements:
    - c3
    quantifier: all
  c4:
    description: Demonstrate a fresh consumer report with the marker and preserved ordinary behavior.
      Construction, publication, activation, and consumption earn one score here.
    subjects: *id004
    basis: observed_state
    predicate:
      kind: boolean
      property: cinder.t03-4.satisfied
      semantic_ref: urn:cinder-typhoon:fact:T03.4
      operator: equals
      expected: true
    evidence_requirements:
    - c4
    quantifier: all
assertions:
  c1-ready:
    proposition: c1
    role: precondition
    polarity: positive
  c1-done:
    proposition: c1
    role: postcondition
    polarity: positive
  c2-ready:
    proposition: c2
    role: precondition
    polarity: positive
  c2-done:
    proposition: c2
    role: postcondition
    polarity: positive
  c3-ready:
    proposition: c3
    role: precondition
    polarity: positive
  c3-done:
    proposition: c3
    role: postcondition
    polarity: positive
  c4-ready:
    proposition: c4
    role: precondition
    polarity: positive
  c4-done:
    proposition: c4
    role: postcondition
    polarity: positive
objectives:
  c1:
    name: 'T03.1: Deleted from the checkout'
    description: |-
      Recover the missing delivery fixture named in the training package's review note and identify the behavior it covered.

      Introduces development history as useful evidence.
    agent: participant.operator
    actions:
    - t03.c1
    targets: &id005
    - features.training.t-developer
    success:
      mode: all_of
      assertions:
      - c1-done
    window:
      workflows:
      - t03.c1
  c2:
    name: 'T03.2: Verbose enough to publish'
    description: |-
      Recover the release access exposed by the failed training build and retrieve the protected rehearsal-channel manifest.

      Establishes a limited release capability with a concrete result.
    agent: participant.operator
    actions:
    - t03.c2
    targets: &id006
    - features.training.t-developer
    success:
      mode: all_of
      assertions:
      - c2-done
    window:
      workflows:
      - t03.c2
  c3:
    name: 'T03.3: What installation really runs'
    description: |-
      Inspect the supplied training package without installing it. Recover the extra action installation would trigger, including the data involved and its destination.

      Foreshadows the fictional supply-chain compromise behind the campaign.
    agent: participant.operator
    actions:
    - t03.c3
    targets: &id007
    - features.training.t-developer
    success:
      mode: all_of
      assertions:
      - c3-done
    window:
      workflows:
      - t03.c3
  c4:
    name: 'T03.4: A release they will consume'
    description: |-
      Deliver a compatible training formatter that adds Cinder's rehearsal marker to the intended consumer's delivery report.

      Completes a miniature supplier-to-consumer episode.
    agent: participant.operator
    actions:
    - t03.c4
    targets: &id008
    - features.training.t-developer
    success:
      mode: all_of
      assertions:
      - c4-done
    window:
      workflows:
      - t03.c4
workflows:
  c1:
    description: 'T03.1: availability follows the evidence/authority alternatives. This independent objective
      may be revisited when facts change; no campaign-wide sequence or deadline is imposed.'
    start: requirements
    steps:
      requirements:
        type: switch
        cases:
        - when:
            assertions:
            - participant.training-ready
          next: attempt
        default: unavailable
      available:
