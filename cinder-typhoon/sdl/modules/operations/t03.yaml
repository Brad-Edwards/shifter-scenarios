      scope: /features
      purpose: experimental
      mode: selected
      selector:
        semantic_scope: /features
        data_kind: artifact
        names:
        - cinder.t03-3.satisfied
        component_refs:
        - features.training.t-developer
      collection: require
      retention: require
      redaction: redact-secrets
      integrity: checksum
      required: true
      basis: observed
    notes:
    - 'Author checks: Check that ordinary package metadata remains useful, static inspection

      identifies the complete action and its source/destination, and neither opening

      nor inspecting the package invokes its lifecycle action.'
  c4:
    description: 'Demonstrate a fresh consumer report with the marker and preserved ordinary behavior. Publication
      without consumption is insufficient.


      Required technical proof: The registry retains publication time and revision. The independent consumer

      records the subsequently resolved version and digest and produces a fresh

      report containing the rehearsal marker while preserving ordinary fields.

      An unused published version has no corresponding consumer receipt.'
    source_refs:
    - features.training.t-developer
    scope: Per-participant in-world evidence; no other participant state.
    boundary_kind: assertion_evaluation
    channel: other
    artifact_role: proposition_truth_evidence
    sensitivity: plain
    redaction: redact_secrets
    integrity: checksum
    retention: run_lifetime
    loss_disclosure: required
