action_contracts:
  c1:
    semantic_version: 1.0.0
    lifecycle_state: draft
    behavioral_granularity: aggregate
    procedure_basis: 'The head checkout lacks the named file while its ancestor object remains

      reachable through ordinary history. The intended solution follows `REVIEW.md`,

      recovers that one ancestor file, and compares it with the independently

      published `/consumer-contract.md`. No hidden route or path guess is needed.'
    realization_profile: backend-declared
    fidelity_claim: The authored mechanism, normal behavior, observable outcome, and authority boundaries constrain
      realization. Validation is not evidence that the application has been built or that the mechanism works.
    preconditions:
    - precondition_id: eligibility
      precondition_class: authority
      description: Satisfy one complete alternative in the referenced workflow and obtain the required scoped access
        to every listed surface.
      support_refs:
      - workflows.t03.c1
      - features.training.t-developer
    - precondition_id: normal-surface
      precondition_class: target
      description: '`developer.training:8081` exposes a read-only Forge view and Git smart HTTP for

        `cinder/delivery-formatter`. Deterministic commit `fixture-added` contains

        `test/fixtures/DL-204.json`; child `fixture-removed` deletes it and adds

        `REVIEW.md`, which names the missing path. The ancestor fixture binds the fixed

        DL-204 input to summary `DL-204 | Cinder receiving desk | 3 parcels`. Exact

        authors, UTC times, messages, parent, paths, modes, deletions, and bytes are in

        `repository-seed.json`.'
      support_refs:
      - features.training.t-developer
      - content.training-developer-system-content.developer-index-md
      - content.training-developer-system-content.developer-repository-seed-json
      - content.training-developer-content.consumer-contract
    - precondition_id: boundaries
      precondition_class: realization
      description: 'The repository is read-only for this task and contains only training source.

        History is immutable. Recovering a historical object does not change the branch,

        the consumer, or the registry.'
      support_refs:
      - features.training.t-developer
    effects:
    - effect_id: outcome
      effect_class: intended_effect
      description: Recover the actual fixture and expected delivery outcome. A revision identifier alone does not
        count.
      target_refs:
      - features.training.t-developer
      evidence_refs:
      - evidence_requirements.t03.c1
    - effect_id: verified-evidence
      effect_class: evidence_effect
      description: 'The recovered fixture has a content hash and historical commit identifying

        an actual ancestor artifact. Its expected delivery outcome agrees with the

        separately available current consumer contract. Recovering it is not required

        to obtain that contract.'
      target_refs:
      - features.training.t-developer
      evidence_refs:
      - evidence_requirements.t03.c1
    failure_classes:
    - precondition_unsatisfied
    - authority_denied
    - target_unavailable
    - partial_success
    - backend_error
    - unknown
  c2:
    semantic_version: 1.0.0
    lifecycle_state: draft
    behavioral_granularity: aggregate
    procedure_basis: 'The failed job logs the still-valid raw publisher value. Native application RBAC

      grants its principal only `read` on `channels/rehearsal/manifest` and `publish`

      on `packages/@cinder/delivery-formatter`. The intended solution retrieves the

      protected manifest with that bearer value. Missing/wrong access returns 401 and

      another package or administrative scope returns 403.'
    realization_profile: backend-declared
    fidelity_claim: The authored mechanism, normal behavior, observable outcome, and authority boundaries constrain
      realization. Validation is not evidence that the application has been built or that the mechanism works.
    preconditions:
    - precondition_id: eligibility
      precondition_class: authority
      description: Satisfy one complete alternative in the referenced workflow and obtain the required scoped access
        to every listed surface.
      support_refs:
      - workflows.t03.c2
      - features.training.t-developer
    - precondition_id: normal-surface
      precondition_class: target
      description: '`developer.training:8082/jobs/BLD-204/log` publishes the retained failed release

        log. It names registry `developer.training:8083`, package

        `@cinder/delivery-formatter`, and the synthetic publisher bearer credential.

        The registry protects `GET /api/channels/rehearsal/manifest`; its manifest is

        revision 6 with baseline 1.4.0, consumer range `>=1.4.0 <2.0.0`, no prereleases,

        and highest-compatible selection.'
      support_refs:
      - features.training.t-developer
      - content.training-developer-system-content.developer-build-bld-204-log
      - content.training-developer-system-content.developer-channel-manifest-json
      - content.training-developer-system-content.developer-service-contract-json
    - precondition_id: boundaries
      precondition_class: realization
      description: 'The credential can read its one manifest and publish only the training formatter

        scope; it cannot alter build configuration or other packages. Its permissions

        exist before manifest retrieval and remain unchanged by that read.'
      support_refs:
      - features.training.t-developer
    effects:
    - effect_id: outcome
      effect_class: intended_effect
      description: Recover and demonstrate the scoped publication access through the protected manifest. This supplies
        T03.4; copying a credential alone is insufficient.
      target_refs:
      - features.training.t-developer
      evidence_refs:
      - evidence_requirements.t03.c2
    - effect_id: verified-evidence
      effect_class: evidence_effect
      description: 'Registry audit records the scoped identity reading the existing rehearsal

        manifest and its revision. Reading it demonstrates existing access; it does

        not award publication permission. The same credential already carries the

        publication scope used by the later formatter task.'
      target_refs:
      - features.training.t-developer
      evidence_refs:
      - evidence_requirements.t03.c2
    failure_classes:
    - precondition_unsatisfied
    - authority_denied
    - target_unavailable
    - partial_success
    - backend_error
    - unknown
  c3:
    semantic_version: 1.0.0
    lifecycle_state: draft
    behavioral_granularity: aggregate
    procedure_basis: 'The intended solution reads the manifest and script to recover the lifecycle,

      source, and destination binding. The package is served only as static files;

      the environment never runs an installer or that script, and the named ingest

      route returns 405 to direct calls. Opening or downloading any file has no

      lifecycle effect.'
    realization_profile: backend-declared
    fidelity_claim: The authored mechanism, normal behavior, observable outcome, and authority boundaries constrain
      realization. Validation is not evidence that the application has been built or that the mechanism works.
    preconditions:
    - precondition_id: eligibility
      precondition_class: authority
      description: Satisfy one complete alternative in the referenced workflow and obtain the required scoped access
        to every listed surface.
      support_refs:
      - workflows.t03.c3
      - features.training.t-developer
    - precondition_id: normal-surface
      precondition_class: target
      description: 'The Developer desk publishes an unpacked npm-compatible package with

        `package.json`, lockfile v3, `scripts/register-rehearsal.js`, and

        `fixtures/rehearsal-source.json`. The manifest maps `postinstall` to that

        script. Its code reads

        `/opt/cinder-sample/fixtures/rehearsal-source.json` (record `SRC-204`) and sends

        the JSON to `http://developer.training:8084/api/rehearsal/ingest`.'
      support_refs:
      - features.training.t-developer
      - content.training-developer-system-content.developer-sample-package-package-json
      - content.training-developer-system-content.developer-sample-package-package-lock-json
      - content.training-developer-system-content.developer-sample-package-scripts-register-rehearsal-js
      - content.training-developer-system-content.developer-sample-package-fixtures-rehearsal-source-json
    - precondition_id: boundaries
      precondition_class: realization
      description: 'The package is presented as content only; its lifecycle action is never invoked

        by the supplied environment. The data names refer only to synthetic training

        records. Inspection does not install the package or modify those records.'
      support_refs:
      - features.training.t-developer
    effects:
    - effect_id: outcome
      effect_class: intended_effect
      description: Recover the package's actual extra behavior with its source and destination binding. A suspicious
        filename or a generic warning is insufficient.
      target_refs:
      - features.training.t-developer
      evidence_refs:
      - evidence_requirements.t03.c3
    - effect_id: verified-evidence
      effect_class: evidence_effect
      description: 'The retained package revision identifies a lifecycle action, a source record,

        and a destination. These are facts of the package contents, not a generic

        warning or filename.'
      target_refs:
      - features.training.t-developer
      evidence_refs:
      - evidence_requirements.t03.c3
    failure_classes:
    - precondition_unsatisfied
    - authority_denied
    - target_unavailable
    - partial_success
    - backend_error
    - unknown
  c4:
    semantic_version: 1.0.0
    lifecycle_state: draft
    behavioral_granularity: aggregate
    procedure_basis: 'The intended solution publishes a compatible version using T03.2''s pre-existing

      scope, preserves all DF-1 fields and summary, and adds only

      `"rehearsal_marker":"Cinder rehearsal"`, then invokes a fresh consumer run.

      The worker has a two-second limit, 64 MiB memory, no network, an empty

      environment, a read-only filesystem, and one invocation. Invalid output returns

      422 and creates no successful report; publication without a consumer receipt is

      insufficient.'
    realization_profile: backend-declared
    fidelity_claim: The authored mechanism, normal behavior, observable outcome, and authority boundaries constrain
      realization. Validation is not evidence that the application has been built or that the mechanism works.
    preconditions:
    - precondition_id: eligibility
      precondition_class: authority
      description: Satisfy one complete alternative in the referenced workflow and obtain the required scoped access
        to every listed surface.
      support_refs:
      - workflows.t03.c4
      - features.training.t-developer
    - precondition_id: normal-surface
      precondition_class: target
      description: '`PUT /api/packages/@cinder/delivery-formatter/{version}` on

        `developer.training:8083` accepts bearer-authenticated JSON containing exactly

        `name`, matching `version`, and `files` with UTF-8 `package.json` and `index.js`.

        The body limit is 256 KiB. Only a new stable version greater than 1.4.0 and

        below 2.0.0 is accepted; versions are immutable and canonically SHA-256 hashed.

        `POST developer.training:8084/api/consumer/run` resolves the highest compatible

        stable version afresh, invokes its `formatDelivery` export once with the fixed

        DL-204 input, and records version, package digest, input, output, output digest,

        receipt ID, and acceptance time. `/consumer-contract.md` independently defines

        DF-1 and the permitted `rehearsal_marker`; T03.1 is not required.'
      support_refs:
      - features.training.t-developer
      - content.training-developer-content.consumer-contract
      - content.training-developer-system-content.developer-channel-manifest-json
      - content.training-developer-system-content.developer-baseline-package-json
      - content.training-developer-system-content.developer-service-contract-json
    - precondition_id: boundaries
      precondition_class: realization
      description: 'The registry scope, consumer tenant, and report data belong to the individual

        workspace. Packages cannot affect other consumers, external package resolution,

        or later campaign systems. Published versions and consumer receipts persist

        across attempts and breaks.'
      support_refs:
      - features.training.t-developer
    effects:
    - effect_id: outcome
      effect_class: intended_effect
      description: Demonstrate a fresh consumer report with the marker and preserved ordinary behavior. Publication
        without consumption is insufficient.
      target_refs:
      - features.training.t-developer
      evidence_refs:
      - evidence_requirements.t03.c4
    - effect_id: verified-evidence
      effect_class: evidence_effect
      description: 'The registry retains publication time and revision. The independent consumer

        records the subsequently resolved version and digest and produces a fresh

        report containing the rehearsal marker while preserving ordinary fields.

        An unused published version has no corresponding consumer receipt.'
      target_refs:
      - features.training.t-developer
      evidence_refs:
      - evidence_requirements.t03.c4
    failure_classes:
    - precondition_unsatisfied
    - authority_denied
    - target_unavailable
    - partial_success
    - backend_error
    - unknown
