objectives:
  c1:
    name: 'T03.1: Deleted from the checkout'
    description: 'Recover the missing delivery fixture named in the training package''s review note and identify
      the behavior it covered.


      Introduces development history as useful evidence.'
    agent: participant.operator
    actions:
    - t03.c1
    targets:
    - features.training.t-developer
    success:
      mode: all_of
      assertions:
      - c1-done
    window:
      workflows:
      - t03.c1
  c2:
    name: 'T03.2: Verbose enough to publish'
    description: 'Recover the release access exposed by the failed training build and retrieve the protected rehearsal-channel
      manifest.


      Establishes a limited release capability with a concrete result.'
    agent: participant.operator
    actions:
    - t03.c2
    targets:
    - features.training.t-developer
    success:
      mode: all_of
      assertions:
      - c2-done
    window:
      workflows:
      - t03.c2
  c3:
    name: 'T03.3: What installation really runs'
    description: 'Inspect the supplied training package without installing it. Recover the extra action installation
      would trigger, including the data involved and its destination.


      Foreshadows the fictional supply-chain compromise behind the campaign.'
    agent: participant.operator
    actions:
    - t03.c3
    targets:
    - features.training.t-developer
    success:
      mode: all_of
      assertions:
      - c3-done
    window:
      workflows:
      - t03.c3
  c4:
    name: 'T03.4: A release they will consume'
    description: 'Deliver a compatible training formatter that adds Cinder''s rehearsal marker to the intended consumer''s
      delivery report.


      Completes a miniature supplier-to-consumer episode.'
    agent: participant.operator
    actions:
    - t03.c4
    targets:
    - features.training.t-developer
    success:
      mode: all_of
      assertions:
      - c4-done
    window:
      workflows:
      - t03.c4
