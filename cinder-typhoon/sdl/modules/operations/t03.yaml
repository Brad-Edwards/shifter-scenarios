evidence_requirements:
  c1:
    description: 'Recover the actual fixture and expected delivery outcome. A revision identifier alone does not
      count.


      Required technical proof: The recovered fixture has a content hash and historical commit identifying

      an actual ancestor artifact. Its expected delivery outcome agrees with the

      separately available current consumer contract. Recovering it is not required

      to obtain that contract.'
    source_refs:
    - features.training.t-developer
    scope: Per-participant in-world evidence; no other participant state.
    boundary_kind: assertion_evaluation
    channel: other
    artifact_role: proposition_truth_evidence
    sensitivity: plain
    redaction: redact_secrets
    integrity: checksum
    retention: run_lifetime
    loss_disclosure: required
    observation_demand:
      rule_id: fact-t03-1
      scope: /features
      purpose: experimental
      mode: selected
      selector:
        semantic_scope: /features
        data_kind: artifact
        names:
        - cinder.t03-1.satisfied
        component_refs:
        - features.training.t-developer
      collection: require
      retention: require
      redaction: redact-secrets
      integrity: checksum
      required: true
      basis: observed
    notes:
    - 'Author checks: Confirm the head checkout lacks the fixture, the review note gives a fair lead,

      the parent history contains one matching artifact, an unrelated commit fails,

      and the expected outcome agrees with the consumer fixture.'
  c2:
    description: 'Recover and demonstrate the scoped publication access through the protected manifest. This supplies
      T03.4; copying a credential alone is insufficient.


      Required technical proof: Registry audit records the scoped identity reading the existing rehearsal

      manifest and its revision. Reading it demonstrates existing access; it does

      not award publication permission. The same credential already carries the

      publication scope used by the later formatter task.'
    source_refs:
    - features.training.t-developer
    scope: Per-participant in-world evidence; no other participant state.
    boundary_kind: assertion_evaluation
    channel: other
    artifact_role: proposition_truth_evidence
    sensitivity: plain
    redaction: redact_secrets
    integrity: checksum
    retention: run_lifetime
    loss_disclosure: required
    observation_demand:
      rule_id: fact-t03-2
      scope: /features
      purpose: experimental
      mode: selected
      selector:
        semantic_scope: /features
        data_kind: artifact
        names:
        - cinder.t03-2.satisfied
        component_refs:
        - features.training.t-developer
      collection: require
      retention: require
      redaction: redact-secrets
      integrity: checksum
      required: true
      basis: observed
    notes:
    - 'Author checks: Check readable failed-job records, correct credential scope, the protected

      manifest response, denial for another package scope, and publication authority

      that exists independently of manifest retrieval.'
  c3:
    description: 'Recover the package''s actual extra behavior with its source and destination binding. A suspicious
      filename or a generic warning is insufficient.


      Required technical proof: The retained package revision identifies a lifecycle action, a source record,

      and a destination. These are facts of the package contents, not a generic

      warning or filename.'
    source_refs:
    - features.training.t-developer
    scope: Per-participant in-world evidence; no other participant state.
    boundary_kind: assertion_evaluation
    channel: other
    artifact_role: proposition_truth_evidence
    sensitivity: plain
    redaction: redact_secrets
    integrity: checksum
    retention: run_lifetime
    loss_disclosure: required
    observation_demand:
