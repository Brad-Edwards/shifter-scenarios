assertions:
  c1-ready:
    proposition: c1
    role: precondition
    polarity: positive
  c1-done:
    proposition: c1
    role: postcondition
    polarity: positive
  c2-ready:
    proposition: c2
    role: precondition
    polarity: positive
  c2-done:
    proposition: c2
    role: postcondition
    polarity: positive
  c3-ready:
    proposition: c3
    role: precondition
    polarity: positive
  c3-done:
    proposition: c3
    role: postcondition
    polarity: positive
objectives:
  c1:
    name: 'W05.1: A starter pack left open'
    description: |-
      Recover the temporary employee's exposed starter pack and the corporate assignment it names.

      Introduces a believable new-starter workflow.
    agent: participant.operator
    actions:
    - w05.c1
    targets: &id004
    - features.a-corporate.a-identity
    success:
      mode: all_of
      assertions:
      - c1-done
    window:
      workflows:
      - w05.c1
  c2:
    name: 'W05.2: The activation roster'
    description: |-
      Recover the separate activation roster that the onboarding portal should keep internal.

      Provides a second independent identity artifact.
    agent: participant.operator
    actions:
    - w05.c2
    targets: &id005
    - features.a-corporate.a-identity
    success:
      mode: all_of
      assertions:
      - c2-done
    window:
      workflows:
      - w05.c2
  c3:
    name: 'W05.3: Temporary, with the wrong rights'
    description: |-
      Establish the temporary employee's usable corporate identity with the restricted assignment the onboarding workflow should deny.

      Turns onboarding data into a meaningful identity compromise.
    agent: participant.operator
    actions:
    - w05.c3
    targets: &id006
    - features.a-corporate.a-identity
    success:
      mode: all_of
      assertions:
      - c3-done
    window:
      workflows:
      - w05.c3
workflows:
  c1:
    description: 'W05.1: availability follows the evidence/authority alternatives. This independent objective
      may be revisited when facts change; no campaign-wide sequence or deadline is imposed.'
    start: requirements
    steps:
      requirements:
        type: switch
        cases:
        - when:
            assertions:
            - capabilities.corporate-ready
          next: attempt
        default: unavailable
      available:
        type: end
      unavailable:
        type: end
      attempt:
        type: objective
        execution_mode: objective
        objective: w05.c1
        on_success: available
        on_failure: unavailable
  c2:
    description: 'W05.2: availability follows the evidence/authority alternatives. This independent objective
      may be revisited when facts change; no campaign-wide sequence or deadline is imposed.'
    start: requirements
    steps:
      requirements:
        type: switch
        cases:
        - when:
            assertions:
            - capabilities.corporate-ready
          next: attempt
        default: unavailable
      available:
        type: end
      unavailable:
        type: end
      attempt:
        type: objective
        execution_mode: objective
        objective: w05.c2
        on_success: available
        on_failure: unavailable
  c3:
    description: 'W05.3: availability follows the evidence/authority alternatives. This independent objective
      may be revisited when facts change; no campaign-wide sequence or deadline is imposed.'
    start: requirements
    steps:
      requirements:
        type: switch
        cases:
        - when:
            assertions:
            - w05.c1-ready
            - w05.c2-ready
          next: attempt
        default: unavailable
      available:
        type: end
      unavailable:
        type: end
      attempt:
        type: objective
        execution_mode: objective
        objective: w05.c3
        on_success: available
        on_failure: unavailable
