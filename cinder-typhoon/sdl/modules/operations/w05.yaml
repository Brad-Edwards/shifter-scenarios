objectives:
  c1:
    name: 'This action: A starter pack left open'
    description: |-
      Recover the temporary employee's exposed starter pack and the corporate assignment it names.

      Introduces a believable new-starter workflow.
    agent: participant.operator
    actions:
    - w05.c1
    targets:
    - features.a-corporate.a-identity
    success:
      mode: all_of
      assertions:
      - c1-done
    window:
      workflows:
      - w05.c1
  c2:
    name: 'This action: The activation roster'
    description: |-
      Recover the separate activation roster that the onboarding portal should keep internal.

      Provides a second independent identity artifact.
    agent: participant.operator
    actions:
    - w05.c2
    targets:
    - features.a-corporate.a-identity
    success:
      mode: all_of
      assertions:
      - c2-done
    window:
      workflows:
      - w05.c2
  c3:
    name: 'This action: Temporary, with the wrong rights'
    description: |-
      Establish the temporary employee's usable corporate identity with the restricted assignment the onboarding workflow should deny.

      Turns onboarding data into a meaningful identity compromise.
    agent: participant.operator
    actions:
    - w05.c3
    targets:
    - features.a-corporate.a-identity
    success:
      mode: all_of
      assertions:
      - c3-done
    window:
      workflows:
      - w05.c3
workflows:
