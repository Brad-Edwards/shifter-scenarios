action_contracts:
  c1:
    semantic_version: 1.0.0
    lifecycle_state: draft
    behavioral_granularity: aggregate
    procedure_basis: 'The intended path is limited to the authored software, data, configuration, identity, permission,
      or state described above. The participant must exercise that real condition through the declared service interface
      and produce this result: Extracted program entry, byte digest and input-record binding. Merely describing
      the condition, editing a local copy, or presenting a value obtained from another surface does not satisfy
      the contract.'
    realization_profile: backend-declared
    fidelity_claim: The exact starting state, service transition, denial cases, participant-state persistence, and
      independently owned evidence are required. Backend choices remain open only where they cannot change those
      facts.
    preconditions:
    - precondition_id: eligibility
      precondition_class: authority
      description: Satisfy one complete alternative in the referenced workflow and obtain the required scoped access
        to every listed surface.
      support_refs:
      - workflows.k11.c1
      - features.k-delivery.k-source
    - precondition_id: normal-surface
      precondition_class: target
      description: '`k-source` owns this part of the operation. Its starting state is exact: Retained fieldkest-policyc
        2.6.4 Linux x86-64 ELF, unstripped map, examples and accepted-input endpoint; embedded program offset/table.
        The owning service uses the listener, route, identity, authorization, storage, and audit contract declared
        in the corresponding world module. Records that are not explicitly mutable remain immutable. The private
        service-loader contract `content.keplerops-k-source.k11-1-where-the-policy-begins` freezes the request,
        denial, state-transition, evidence, and any exploit-critical implementation details.'
      support_refs:
      - features.k-delivery.k-source
      - content.keplerops-k-source.k11-1-where-the-policy-begins
    - precondition_id: scope-and-persistence
      precondition_class: realization
      description: Starts native policy branch. Participant-created service state persists for the life of the participant
        world and ordinary retries do not erase it. The selected route cannot act on unrelated tenants, records,
        packages, identities, jobs, or services. Infrastructure recovery and submission adjudication are outside
        this in-world contract.
      support_refs:
      - features.k-delivery.k-source
    effects:
    - effect_id: outcome
      effect_class: intended_effect
      description: Recover the actual policy entry and input binding. A filename or compiler banner is insufficient.
      target_refs:
      - features.k-delivery.k-source
      evidence_refs:
