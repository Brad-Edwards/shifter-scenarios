objectives:
  c1:
    name: 'K11.1: Where the policy begins'
    description: |-
      Recover the policy program embedded in the retained rules compiler and identify the input it actually evaluates.

      Makes the compiler's hidden policy an inspectable campaign artifact.
    agent: participant.operator
    actions:
    - k11.c1
    targets:
    - features.k-delivery.k-source
    success:
      mode: all_of
      assertions:
      - c1-done
    window:
      workflows:
      - k11.c1
  c2:
    name: 'K11.2: Learn its instructions'
    description: |-
      Reconstruct enough of the compiler's internal instruction behavior to reproduce the supplied policy fragments.

      Establishes a reusable understanding of the policy language.
    agent: participant.operator
    actions:
    - k11.c2
    targets:
    - features.k-delivery.k-source
    success:
      mode: all_of
      assertions:
      - c2-done
    window:
      workflows:
      - k11.c2
  c3:
    name: 'K11.3: The rule behind the rule'
    description: |-
      Recover the complete acceptance conditions enforced by the embedded policy program. Account for the constraints the ordinary documentation omits.

      Reveals what the package gate actually demands.
    agent: participant.operator
    actions:
    - k11.c3
    targets:
    - features.k-delivery.k-source
    success:
      mode: all_of
      assertions:
      - c3-done
    window:
      workflows:
      - k11.c3
  c4:
    name: 'K11.4: An input the compiler believes'
    description: |-
      Construct a package-policy input that satisfies the recovered program while authorizing Cinder's requested compatibility case.

      Ends the compiler branch with an accepted, purposeful artifact.
    agent: participant.operator
    actions:
    - k11.c4
    targets:
    - features.k-delivery.k-source
    success:
      mode: all_of
      assertions:
      - c4-done
    window:
      workflows:
      - k11.c4
