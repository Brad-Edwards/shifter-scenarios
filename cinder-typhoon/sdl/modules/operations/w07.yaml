    proposition: c3
    role: postcondition
    polarity: positive
objectives:
  c1:
    name: 'W07.1: The query the planner keeps'
    description: |-
      Recover the private reserve-report definition and determine which report operations the planner's query interface actually permits. Resolve the disagreement between its 'read-only' label and the supplied ordinary request results.

      Introduces the backend's actual data scope.
    agent: participant.operator
    actions:
    - w07.c1
    targets: &id004
    - features.a-corporate.a-data--query
    success:
      mode: all_of
      assertions:
      - c1-done
    window:
      workflows:
      - w07.c1
  c2:
    name: 'W07.2: Read beyond the allowed statement'
    description: |-
      Recover the restricted district-allocation adjustment ledger through the planner's query interface, despite the rules that exclude it from ordinary reserve reports.

      Establishes a useful data primitive beyond normal planning queries.
    agent: participant.operator
    actions:
    - w07.c2
    targets: &id005
    - features.a-corporate.a-data--query
    success:
      mode: all_of
      assertions:
      - c2-done
    window:
      workflows:
      - w07.c2
  c3:
    name: 'W07.3: The database does more than read'
    description: |-
      Make the database service execute a job that produces a copy of its protected reconciliation log under the service's own execution identity.

      Completes the application-to-backend chain with a concrete effect.
    agent: participant.operator
    actions:
    - w07.c3
    targets: &id006
    - features.a-corporate.a-data--query
    success:
      mode: all_of
      assertions:
      - c3-done
    window:
      workflows:
      - w07.c3
workflows:
  c1:
    description: 'W07.1: availability follows the evidence/authority alternatives. This independent objective
      may be revisited when facts change; no campaign-wide sequence or deadline is imposed.'
    start: requirements
    steps:
      requirements:
        type: switch
        cases:
        - when:
            assertions:
            - w06.c3-ready
          next: attempt
        default: unavailable
      available:
        type: end
      unavailable:
        type: end
      attempt:
        type: objective
        execution_mode: objective
        objective: w07.c1
        on_success: available
        on_failure: unavailable
  c2:
    description: 'W07.2: availability follows the evidence/authority alternatives. This independent objective
      may be revisited when facts change; no campaign-wide sequence or deadline is imposed.'
    start: requirements
