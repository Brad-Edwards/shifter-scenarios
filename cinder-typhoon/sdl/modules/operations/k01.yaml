objectives:
  c1:
    name: 'K01.1: The developer left a way back'
    description: |-
      The workstation is yours, but the FieldKest repositories still expect an identity. Recover the developer's usable repository access and retrieve the current project handover.

      Establishes a useful first foothold beyond the borrowed desktop.
    agent: participant.operator
    actions:
    - k01.c1
    targets:
    - features.k-corporate.k-dev
    - features.k-delivery.k-source
    success:
      mode: all_of
      assertions:
      - c1-done
    window:
      workflows:
      - k01.c1
  c2:
    name: 'K01.2: The tab that survived'
    description: |-
      The developer closed the support portal before leaving. Recover the unfinished ARWC conversation retained by the browser.

      Introduces the recurring support engineer and the customer ticket.
    agent: participant.operator
    actions:
    - k01.c2
    targets:
    - features.k-corporate.k-dev
    - features.k-delivery.k-support
    success:
      mode: all_of
      assertions:
      - c2-done
    window:
      workflows:
      - k01.c2
  c3:
    name: 'K01.3: Outside the working folder'
    description: |-
      A release review refers to a work file missing from the checkout. Find the developer's exposed copy and recover the unresolved review comments.

      Makes the workstation feel like a working environment with unfinished decisions.
    agent: participant.operator
    actions:
    - k01.c3
    targets:
    - features.k-corporate.k-dev
    success:
      mode: all_of
      assertions:
      - c3-done
    window:
      workflows:
      - k01.c3
  c4:
    name: 'K01.4: Put it on the workbench'
    description: |-
      The local FieldKest helper has an unfinished support-report job. Make it produce a fresh inspection summary from the developer's supplied sample, with that sample's asset and revision correctly represented.

      Gives a newcomer a visible application result before a larger compromise.
    agent: participant.operator
    actions:
    - k01.c4
    targets:
    - features.k-corporate.k-dev
    success:
      mode: all_of
      assertions:
      - c4-done
    window:
      workflows:
      - k01.c4
