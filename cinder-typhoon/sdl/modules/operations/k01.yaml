content:
  c1-records-1:
    type: dataset
    description: |-
      K01.1: required in-world starting records. Allocate each record to its actual owning service; this declaration does not duplicate secrets across services or grant their visibility.
      The developer's working directory, browser profile, saved client settings, and local FieldKest tools.

      Rowan's supplied workspace has a Gitea credential helper and FieldKest Forge project; the current handover is protected by the developer's normal repository role.

      Records owned by this system: Rowan's local Gitea credential-helper/session material and FieldKest Forge project reference; the protected current handover and Forge audit remain at the source service.
    target: k-corporate.k-dev
    tags:
    - synthetic
    - k01
    - c1
    - seed-requirement
    items:
    - name: starting-records
      description: Rowan's local Gitea credential-helper/session material and FieldKest Forge project
        reference; the protected current handover and Forge audit remain at the source service.
  c1-records-2:
