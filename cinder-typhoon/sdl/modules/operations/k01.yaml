        support gateway and its seeded ARWC conversation.
      support_refs: *id006
    - precondition_id: boundaries-and-reset
      precondition_class: realization
      description: |-
        These are requirements on the realized environment. Apply reset behavior only when a participant reset is requested, not on challenge completion.

        The restored view is read-only, limited to one conversation, and grants no support action or customer delivery; reset removes its session and event.
      support_refs:
      - features.k-corporate.k-dev
      - features.k-delivery.k-support
    effects:
    - effect_id: outcome
