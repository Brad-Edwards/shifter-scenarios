action_contracts:
  c1:
    semantic_version: 1.0.0
    lifecycle_state: draft
    behavioral_granularity: aggregate
    procedure_basis: The workstation retains a usable developer session after handover. The intended solution
      is local credential recovery followed by an ordinary authenticated Forge read.
    realization_profile: backend-declared
    fidelity_claim: The authored mechanism, normal behavior, proof, authority limits, and reset requirements
      are required. Hosting and their implementation remain backend-declared.
    preconditions:
    - precondition_id: eligibility
      precondition_class: authority
      description: Satisfy one complete alternative in the referenced workflow and obtain the required
        scoped access to every listed surface.
      support_refs:
      - workflows.k01.c1
      - features.k-corporate.k-dev
      - features.k-delivery.k-source
    - precondition_id: normal-surface
      precondition_class: target
      description: Rowan's supplied workspace has a Gitea credential helper and FieldKest Forge project;
        the current handover is protected by the developer's normal repository role.
      support_refs: *id005
    - precondition_id: boundaries-and-reset
      precondition_class: realization
      description: |-
        These are requirements on the realized environment. Apply reset behavior only when a participant reset is requested, not on challenge completion.

        The identity is read-only for its assigned projects and cannot alter protected branches, CI, registry, or customer systems; reset revokes its session.
      support_refs:
      - features.k-corporate.k-dev
      - features.k-delivery.k-source
    effects:
    - effect_id: outcome
      effect_class: intended_effect
      description: Recover and use the limited repository identity to obtain the protected handover. This
        supplies G01; credential discovery and use earn one score.
      target_refs: *id005
      evidence_refs:
      - evidence_requirements.k01.c1
    - effect_id: verified-evidence
      effect_class: evidence_effect
      description: Gitea records a handover read by the player-scoped developer identity and returns its
        current revision, awarding `G01`.
      target_refs: *id001
      evidence_refs:
      - evidence_requirements.k01.c1
    failure_classes:
    - precondition_unsatisfied
    - authority_denied
    - target_unavailable
    - partial_success
    - backend_error
    - unknown
  c2:
    semantic_version: 1.0.0
    lifecycle_state: draft
    behavioral_granularity: aggregate
    procedure_basis: Closing the tab did not clear recoverable browser state. The intended solution is
      forensic recovery of the existing conversation and correlation of its actual ticket ID.
    realization_profile: backend-declared
