      The developer's working directory, browser profile, saved client settings, and local FieldKest tools.

      Rowan's supplied workspace has a Gitea credential helper and FieldKest Forge project; the current handover is protected by the developer's normal repository role.

      Records owned by this system: The protected current FieldKest handover and revision, read-only developer project role, session binding, and authenticated handover-read audit. The developer workspace holds the recovery material.
    target: k-delivery.k-source
    tags:
    - synthetic
    - k01
    - c1
    - seed-requirement
    items:
    - name: starting-records
      description: The protected current FieldKest handover and revision, read-only developer project
