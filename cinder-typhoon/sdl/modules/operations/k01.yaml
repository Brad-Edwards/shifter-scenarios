evidence_requirements:
  c1:
    description: |-
      Recover and use the limited repository identity to obtain the protected handover. This supplies G01; credential discovery and use earn one score.

      Required technical proof: Gitea records a handover read by the player-scoped developer identity and returns its current revision, awarding `G01`.
    source_refs: &id001
    - features.k-delivery.k-source
    scope: Per-participant in-world evidence; no other participant state.
    boundary_kind: assertion_evaluation
    channel: other
    artifact_role: proposition_truth_evidence
    sensitivity: plain
    redaction: redact_secrets
    integrity: checksum
    retention: run_lifetime
    loss_disclosure: required
    observation_demand:
      rule_id: fact-k01-1
      scope: /features
      purpose: experimental
      mode: selected
      selector:
        semantic_scope: /features
        data_kind: artifact
        names:
        - cinder.k01-1.satisfied
        component_refs:
        - features.k-delivery.k-source
      collection: require
      retention: require
      redaction: redact-secrets
      integrity: checksum
      required: true
      basis: observed
    notes:
    - 'Author checks: Test anonymous denial, intended credential use, no write access, correct handover
      revision, audit attribution, and session revocation.'
  c2:
    description: |-
      Recover the retained conversation and its actual ticket reference. It supplies optional story context, not the credentials or current customer binding required for entry.

      Required technical proof: The support gateway logs the conversation restoration and exposes the immutable `SUP-2841` record as player evidence.
    source_refs: &id002
    - features.k-delivery.k-support
    scope: Per-participant in-world evidence; no other participant state.
    boundary_kind: assertion_evaluation
    channel: other
    artifact_role: proposition_truth_evidence
    sensitivity: plain
    redaction: redact_secrets
    integrity: checksum
    retention: run_lifetime
    loss_disclosure: required
    observation_demand:
      rule_id: fact-k01-2
      scope: /features
      purpose: experimental
      mode: selected
      selector:
        semantic_scope: /features
        data_kind: artifact
        names:
        - cinder.k01-2.satisfied
        component_refs:
        - features.k-delivery.k-support
      collection: require
      retention: require
      redaction: redact-secrets
      integrity: checksum
      required: true
      basis: observed
    notes:
    - 'Author checks: Verify no tab is initially open, the profile holds one fair restoration lead, the
      recovered ticket resolves once, direct unrelated ticket reads fail, and reset clears state.'
  c3:
    description: |-
      Recover the separate review document and its release reference. Reading the browser conversation does not reveal this content.

      Required technical proof: Completion records the document digest, unresolved comments, and related release ID; the document is distinct from the browser conversation.
    source_refs: &id003
    - features.k-corporate.k-dev
    scope: Per-participant in-world evidence; no other participant state.
    boundary_kind: assertion_evaluation
    channel: other
    artifact_role: proposition_truth_evidence
    sensitivity: plain
    redaction: redact_secrets
    integrity: checksum
    retention: run_lifetime
    loss_disclosure: required
    observation_demand:
      rule_id: fact-k01-3
      scope: /features
      purpose: experimental
      mode: selected
      selector:
        semantic_scope: /features
        data_kind: artifact
        names:
        - cinder.k01-3.satisfied
        component_refs:
        - features.k-corporate.k-dev
      collection: require
      retention: require
      redaction: redact-secrets
      integrity: checksum
      required: true
      basis: observed
    notes:
    - 'Author checks: Check the checkout lacks the file, the review references it, the external copy has
      one matching release, K01.2 is insufficient, and unrelated artifacts do not score.'
  c4:
    description: |-
      Produce the sample's inspection summary through the local helper, preserving its asset and revision binding. This is an introductory interface task with a visible result, not a claimed privilege escalation.

      Required technical proof: The helper stores a fresh report receipt containing the expected sample ID, asset, revision, and output digest; local file edits do not score.
    source_refs: &id004
    - features.k-corporate.k-dev
    scope: Per-participant in-world evidence; no other participant state.
    boundary_kind: assertion_evaluation
    channel: other
    artifact_role: proposition_truth_evidence
    sensitivity: plain
    redaction: redact_secrets
    integrity: checksum
    retention: run_lifetime
    loss_disclosure: required
    observation_demand:
      rule_id: fact-k01-4
      scope: /features
      purpose: experimental
      mode: selected
      selector:
        semantic_scope: /features
        data_kind: artifact
        names:
        - cinder.k01-4.satisfied
        component_refs:
        - features.k-corporate.k-dev
      collection: require
      retention: require
      redaction: redact-secrets
      integrity: checksum
      required: true
      basis: observed
    notes:
    - 'Author checks: Test documented sample success, malformed sample rejection, correct asset/revision
      preservation, receipt generation, no external request, and reset.'
