objectives:
  c1:
    name: 'W08.1: Something in the work bundle'
    description: |-
      Recover the contractor's hidden script from the retained work material and identify the collection it was intended to retrieve.

      Starts an intelligence-recovery branch from ordinary corporate work.
    agent: participant.operator
    actions:
    - w08.c1
    targets: &id005
    - features.a-corporate.a-archive
    success:
      mode: all_of
      assertions:
      - c1-done
    window:
      workflows:
      - w08.c1
  c2:
    name: 'W08.2: Reassemble the exchange'
    description: |-
      Reconstruct the script's retained message exchange and recover the missing instructions that belong to this collection.

      Makes messaging evidence useful without involving an external service.
    agent: participant.operator
    actions:
    - w08.c2
    targets: &id006
    - features.a-corporate.a-archive
    success:
      mode: all_of
      assertions:
      - c2-done
    window:
      workflows:
      - w08.c2
  c3:
    name: 'W08.3: The collector inside the handover'
    description: |-
      Recover the compiled collector carried by the reconstructed exchange and establish its usable analysis artifact.

      Adds a distinct compiled-code recovery task.
    agent: participant.operator
    actions:
    - w08.c3
    targets: &id007
    - features.a-corporate.a-archive
    success:
      mode: all_of
      assertions:
      - c3-done
    window:
      workflows:
      - w08.c3
  c4:
    name: 'W08.4: Where the contractor put it'
    description: |-
      Recover the collector's protected configuration and the historical archive reference it was using.

      Gives the analysis branch a useful collection destination.
    agent: participant.operator
    actions:
    - w08.c4
    targets: &id008
    - features.a-corporate.a-archive
    success:
      mode: all_of
      assertions:
      - c4-done
    window:
      workflows:
      - w08.c4
workflows:
  c1:
    description: 'W08.1: availability follows the evidence/authority alternatives. This independent objective
      may be revisited when facts change; no campaign-wide sequence or deadline is imposed.'
    start: requirements
    steps:
      requirements:
        type: switch
        cases:
        - when:
            assertions:
            - w05.c3-ready
          next: attempt
        - when:
            assertions:
            - capabilities.w03-read-ready
          next: attempt
        default: unavailable
      available:
