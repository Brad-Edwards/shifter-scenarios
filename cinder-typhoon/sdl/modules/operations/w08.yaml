    lifecycle_state: draft
    behavioral_granularity: aggregate
    procedure_basis: |-
      The authored condition is **ordered erasure-code reconstruction**. Interpret shard bytes as coefficients in GF(256) with primitive polynomial 0x11d, generator alpha=2, and systematic Vandermonde rows V[r,c]=alpha^(r*c) for parity rows r=12 and 13 and data columns c=0..11. Shards are numbered 0..13, each is exactly 96 bytes, data shards 7 and 11 are absent, and Gaussian elimination is performed independently at each byte position. The manifest fixes numeric shard order, 96-byte length, and each retained shard's SHA-256; any other polynomial, row convention, order, or digest is rejected. The hand build must preserve every named version, encoding, bound, validation order, identity, and unaffected field; substituting a generic vulnerable service would change the task.

