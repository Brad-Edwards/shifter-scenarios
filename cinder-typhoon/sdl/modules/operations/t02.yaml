objectives:
  c1:
    name: 'T02.1: An account by any other response'
    description: 'Identify the active rehearsal account and recover the account-bound case reference exposed by
      the identity desk.


      Provides a useful identity lead without password guessing.'
    agent: participant.operator
    actions:
    - t02.c1
    targets:
    - features.training.t-accounts
    success:
      mode: all_of
      assertions:
      - c1-done
    window:
      workflows:
      - t02.c1
  c2:
    name: 'T02.2: Hidden on the page'
    description: 'The identity desk''s public directory hides rehearsal assignments from visitors. Recover the private
      assignment and associated staff detail it should not expose.


      Adds an independent data disclosure to the identity story.'
    agent: participant.operator
    actions:
    - t02.c2
    targets:
    - features.training.t-accounts
    success:
      mode: all_of
      assertions:
      - c2-done
    window:
      workflows:
      - t02.c2
  c3:
    name: 'T02.3: Recovery is another way in'
    description: 'Use the identity evidence you recovered to take control of the rehearsal account through its recovery
      workflow and retrieve its private handover.


      Makes the identity trail produce actual account access.'
    agent: participant.operator
    actions:
    - t02.c3
    targets:
    - features.training.t-accounts
    success:
      mode: all_of
      assertions:
      - c3-done
    window:
      workflows:
      - t02.c3
  c4:
    name: 'T02.4: Someone else''s assignment'
    description: 'Your recovered account can list its own assignments. Obtain the other operator''s sealed rehearsal
      brief through the assignment service.


      Introduces authorization beyond successful authentication.'
    agent: participant.operator
    actions:
    - t02.c4
    targets:
    - features.training.t-accounts
    success:
      mode: all_of
      assertions:
      - c4-done
    window:
      workflows:
      - t02.c4
