    description: 'Recover the actual active account and its case reference. Submitting candidate names alone is
      insufficient. These are inputs to T02.3.


      Required technical proof: The normal lookup response contains the active subject and its linked case

      reference. The desk retains the corresponding lookup audit. That response

      itself supplies the information used in recovery; it authenticates nobody.'
    source_refs:
    - features.training.t-accounts
    scope: Per-participant in-world evidence; no other participant state.
    boundary_kind: assertion_evaluation
    channel: other
    artifact_role: proposition_truth_evidence
    sensitivity: plain
    redaction: redact_secrets
    integrity: checksum
    retention: run_lifetime
    loss_disclosure: required
    observation_demand:
      rule_id: fact-t02-1
      scope: /features
      purpose: experimental
      mode: selected
      selector:
        semantic_scope: /features
        data_kind: artifact
        names:
        - cinder.t02-1.satisfied
        component_refs:
        - features.training.t-accounts
      collection: require
      retention: require
      redaction: redact-secrets
      integrity: checksum
      required: true
      basis: observed
    notes:
    - 'Author checks: Verify the supplied lead narrows the candidates, response classes are stable,

      only the active account yields the case fragment, bulk submission is bounded,

      and a correct lookup records the expected subject.'
  c2:
    description: 'Recover the actual private roster entry. Its staff detail supports T02.3; the public name list
      alone does not count.


      Required technical proof: The roster response contains the requested private assignment detail and

      staff-record revision; the service retains its normal read audit. The public

      listing does not contain the same recovery data.'
    source_refs:
    - features.training.t-accounts
    scope: Per-participant in-world evidence; no other participant state.
    boundary_kind: assertion_evaluation
    channel: other
    artifact_role: proposition_truth_evidence
    sensitivity: plain
    redaction: redact_secrets
    integrity: checksum
    retention: run_lifetime
    loss_disclosure: required
    observation_demand:
      rule_id: fact-t02-2
      scope: /features
      purpose: experimental
      mode: selected
      selector:
        semantic_scope: /features
        data_kind: artifact
        names:
        - cinder.t02-2.satisfied
        component_refs:
        - features.training.t-accounts
      collection: require
      retention: require
      redaction: redact-secrets
      integrity: checksum
      required: true
      basis: observed
    notes:
    - 'Author checks: Confirm public listing works, the coordinator route is discoverable from normal

      client material, one expected detail returns, unrelated roster IDs are denied,

      and the recorded entry matches T02.3''s recovery data.'
  c3:
    description: 'Demonstrate the recovered identity and obtain its private handover. A recovery acknowledgement
      without usable access is insufficient. The session enables T02.4.


      Required technical proof: Recovery creates a session tied to the rehearsal subject. The authenticated

      handover read returns that subject''s private document and has its own service

      audit. The same session remains usable at the assignment service, including

      after a break or day-two resume.'
    source_refs:
    - features.training.t-accounts
