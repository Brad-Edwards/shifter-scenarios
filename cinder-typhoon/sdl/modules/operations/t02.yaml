      description: The rehearsal identity desk, candidate account notes, a public directory, recovery
        workflow, and assignment service.
  c2-records-1:
    type: dataset
    description: |-
      T02.2: required in-world starting records. Allocate each record to its actual owning service; this declaration does not duplicate secrets across services or grant their visibility.
      The rehearsal identity desk, candidate account notes, a public directory, recovery workflow, and assignment service.

