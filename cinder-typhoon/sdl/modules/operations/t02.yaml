realization:
  default: open
evidence_requirements:
  c1:
    description: |-
      Recover the actual active account and its case reference. Submitting candidate names alone is insufficient. These are inputs to T02.3.

      Required technical proof: The desk writes a lookup event for the active subject and discloses its linked
      case reference. Scoring checks both values and makes the evidence available to
      T02.3 without authenticating the player.
    source_refs: &id001
    - features.training.t-accounts
    scope: Per-participant in-world evidence; no other participant state.
    boundary_kind: assertion_evaluation
    channel: other
    artifact_role: proposition_truth_evidence
    sensitivity: plain
    redaction: redact_secrets
    integrity: checksum
    retention: run_lifetime
    loss_disclosure: required
    observation_demand:
      rule_id: fact-t02-1
      scope: /features
      purpose: experimental
      mode: selected
      selector:
        semantic_scope: /features
        data_kind: artifact
        names:
        - cinder.t02-1.satisfied
        component_refs:
        - features.training.t-accounts
      collection: require
      retention: require
      redaction: redact-secrets
      integrity: checksum
      required: true
      basis: observed
    notes:
    - |-
      Author checks: Verify the supplied lead narrows the candidates, response classes are stable,
      only the active account yields the case fragment, bulk submission is bounded,
      and a correct lookup records the expected subject.
  c2:
    description: |-
      Recover the actual private roster entry. Its staff detail supports T02.3; the public name list alone does not count.

      Required technical proof: The roster service emits a detail-read event with the assignment and staff
      record version. That exact private entry becomes player evidence for recovery;
      the public display response cannot satisfy the score.
    source_refs: &id002
    - features.training.t-accounts
    scope: Per-participant in-world evidence; no other participant state.
    boundary_kind: assertion_evaluation
    channel: other
    artifact_role: proposition_truth_evidence
    sensitivity: plain
    redaction: redact_secrets
    integrity: checksum
    retention: run_lifetime
    loss_disclosure: required
    observation_demand:
      rule_id: fact-t02-2
      scope: /features
      purpose: experimental
      mode: selected
      selector:
        semantic_scope: /features
        data_kind: artifact
        names:
        - cinder.t02-2.satisfied
        component_refs:
        - features.training.t-accounts
      collection: require
      retention: require
      redaction: redact-secrets
      integrity: checksum
      required: true
      basis: observed
    notes:
    - |-
      Author checks: Confirm public listing works, the coordinator route is discoverable from normal
      client material, one expected detail returns, unrelated roster IDs are denied,
      and the recorded entry matches T02.3's recovery data.
  c3:
    description: |-
      Demonstrate the recovered identity and obtain its private handover. A recovery acknowledgement without usable access is insufficient. The session enables T02.4.

      Required technical proof: A successful recovery creates a player-scoped session tied to the rehearsal
      subject and a handover-read event. Scoring requires both session issuance and
      the private handover retrieval, then exposes the session for T02.4.
    source_refs: &id003
    - features.training.t-accounts
    scope: Per-participant in-world evidence; no other participant state.
    boundary_kind: assertion_evaluation
    channel: other
    artifact_role: proposition_truth_evidence
    sensitivity: plain
    redaction: redact_secrets
    integrity: checksum
    retention: run_lifetime
    loss_disclosure: required
    observation_demand:
      rule_id: fact-t02-3
      scope: /features
      purpose: experimental
      mode: selected
      selector:
        semantic_scope: /features
        data_kind: artifact
        names:
        - cinder.t02-3.satisfied
        component_refs:
        - features.training.t-accounts
      collection: require
      retention: require
      redaction: redact-secrets
      integrity: checksum
      required: true
      basis: observed
    notes:
    - |-
      Author checks: Test each factor separately fails, the intended three-record join succeeds,
      the resulting session reads only its own handover, T02.4 receives the expected
      identity, and reset invalidates the session.
  c4:
    description: |-
      Recover the specified other operator's private brief while retaining the recovered account's identity. Reading its own handover is not new credit.

      Required technical proof: Completion is a read of the specified other operator's brief, recorded with the
      recovered subject, requested assignment, and document revision. Reading the
      caller's own brief is ordinary behavior and earns no new event.
    source_refs: &id004
    - features.training.t-accounts
    scope: Per-participant in-world evidence; no other participant state.
    boundary_kind: assertion_evaluation
    channel: other
    artifact_role: proposition_truth_evidence
    sensitivity: plain
    redaction: redact_secrets
    integrity: checksum
    retention: run_lifetime
    loss_disclosure: required
    observation_demand:
      rule_id: fact-t02-4
      scope: /features
      purpose: experimental
      mode: selected
      selector:
        semantic_scope: /features
        data_kind: artifact
        names:
        - cinder.t02-4.satisfied
        component_refs:
        - features.training.t-accounts
      collection: require
      retention: require
      redaction: redact-secrets
      integrity: checksum
      required: true
      basis: observed
    notes:
    - |-
      Author checks: Verify own-assignment access, denial without a recovered session, intended
      cross-assignment read, no access to an unknown assignment, exact audit fields,
      and repeatable reset.
