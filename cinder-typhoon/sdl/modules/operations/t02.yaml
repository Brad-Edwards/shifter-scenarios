action_contracts:
  c1:
    semantic_version: 1.0.0
    lifecycle_state: draft
    behavioral_granularity: aggregate
    procedure_basis: 'The endpoint returns 410 plus `inactive` for Mina, 404 plus `unknown` for Owen,

      and 200 for Rhea with the account-bound fragment `CASE-7Q4M`. Malformed or

      extra-field bodies return 400 and the rate limit returns 429. The intended

      solution tests only the three supplied contextual candidates and retains the

      active response; the lookup does not create a session.'
    realization_profile: backend-declared
    fidelity_claim: The authored mechanism, normal behavior, observable outcome, and authority boundaries constrain
      realization. Validation is not evidence that the application has been built or that the mechanism works.
    preconditions:
    - precondition_id: eligibility
      precondition_class: authority
      description: Satisfy one complete alternative in the referenced workflow and obtain the required scoped access
        to every listed surface.
      support_refs:
      - workflows.t02.c1
      - features.training.t-accounts
    - precondition_id: normal-surface
      precondition_class: target
      description: '`accounts.training:8080` publishes candidate notes and

        `POST /api/recovery/lookup` with the exact JSON field `account`. The notes bound

        the search to `mina.cho`, `rhea.moss`, and `owen.pike`. The realm contains an

        inactive Mina record, active Rhea record, and no Owen record. Lookup is limited

        to six requests per minute and records submitted handle, response class, status,

        and UTC time.'
      support_refs:
      - features.training.t-accounts
      - content.training-accounts-content.accounts-index-md
      - content.training-accounts-content.accounts-candidates-md
      - content.training-accounts-content.accounts-realm-json
      - content.training-accounts-content.accounts-service-contract-json
    - precondition_id: boundaries
      precondition_class: realization
      description: 'The endpoint is limited to the small rehearsal account set and rate-bounded.

        The lookup itself cannot change a password or create an authenticated session.

        Repeated lookups preserve the account states and the existing case reference.'
      support_refs:
      - features.training.t-accounts
    effects:
    - effect_id: outcome
      effect_class: intended_effect
      description: Recover the actual active account and its case reference. Submitting candidate names alone is
        insufficient. These are inputs to T02.3.
      target_refs:
      - features.training.t-accounts
      evidence_refs:
      - evidence_requirements.t02.c1
    - effect_id: verified-evidence
      effect_class: evidence_effect
      description: 'The normal lookup response contains the active subject and its linked case

        reference. The desk retains the corresponding lookup audit. That response

        itself supplies the information used in recovery; it authenticates nobody.'
      target_refs:
      - features.training.t-accounts
      evidence_refs:
      - evidence_requirements.t02.c1
    failure_classes:
    - precondition_unsatisfied
    - authority_denied
    - target_unavailable
    - partial_success
    - backend_error
    - unknown
  c2:
    semantic_version: 1.0.0
    lifecycle_state: draft
    behavioral_granularity: aggregate
    procedure_basis: 'The browser omits the coordinator control, but the server route has

      `auth_required: false` and performs no session or role check for `STF-204`.

      Inspecting the public client supplies the exact route; the visible directory

      supplies the ID. `STF-204` returns 200, another known record returns 403, and an

      unknown record returns 404, preventing open-ended roster enumeration.'
    realization_profile: backend-declared
    fidelity_claim: The authored mechanism, normal behavior, observable outcome, and authority boundaries constrain
      realization. Validation is not evidence that the application has been built or that the mechanism works.
    preconditions:
    - precondition_id: eligibility
      precondition_class: authority
      description: Satisfy one complete alternative in the referenced workflow and obtain the required scoped access
        to every listed surface.
      support_refs:
      - workflows.t02.c2
      - features.training.t-accounts
    - precondition_id: normal-surface
      precondition_class: target
      description: 'The public directory and `/api/directory/staff` expose two ordinary entries:

        `STF-204` for Rhea Moss and `STF-317` for Dax Hale. `/directory/app.js` contains

        the coordinator client call to

        `/api/directory/staff/{staff_id}/assignment`. The private `STF-204` response

        binds Rhea to `ASG-204`, staff-record revision 8, and staff detail

        `Blue cabinet 17`.'
      support_refs:
      - features.training.t-accounts
      - content.training-accounts-content.accounts-directory-index-json
      - content.training-accounts-content.accounts-directory-app-js
      - content.training-accounts-content.accounts-directory-assignment-stf-204-json
      - content.training-accounts-content.accounts-service-contract-json
    - precondition_id: boundaries
      precondition_class: realization
      description: 'The API contains only synthetic rehearsal roster entries and provides no

        identity mutation. Reading an entry does not change the underlying staff data.'
      support_refs:
      - features.training.t-accounts
    effects:
    - effect_id: outcome
      effect_class: intended_effect
      description: Recover the actual private roster entry. Its staff detail supports T02.3; the public name list
        alone does not count.
      target_refs:
      - features.training.t-accounts
      evidence_refs:
      - evidence_requirements.t02.c2
    - effect_id: verified-evidence
      effect_class: evidence_effect
      description: 'The roster response contains the requested private assignment detail and

        staff-record revision; the service retains its normal read audit. The public

        listing does not contain the same recovery data.'
      target_refs:
      - features.training.t-accounts
      evidence_refs:
      - evidence_requirements.t02.c2
    failure_classes:
    - precondition_unsatisfied
    - authority_denied
    - target_unavailable
    - partial_success
    - backend_error
    - unknown
  c3:
    semantic_version: 1.0.0
    lifecycle_state: draft
    behavioral_granularity: aggregate
    procedure_basis: 'The workflow treats the two independently disclosed values plus the public

      account name as ownership proof. A missing or wrong value returns 403; malformed

      or extra fields return 400; a second redemption returns 409 without invalidating

      the original session. The intended solution supplies the exact outputs of

      T02.1 and T02.2, then proves access by reading the authenticated handover.'
    realization_profile: backend-declared
    fidelity_claim: The authored mechanism, normal behavior, observable outcome, and authority boundaries constrain
      realization. Validation is not evidence that the application has been built or that the mechanism works.
    preconditions:
    - precondition_id: eligibility
      precondition_class: authority
      description: Satisfy one complete alternative in the referenced workflow and obtain the required scoped access
        to every listed surface.
      support_refs:
      - workflows.t02.c3
      - features.training.t-accounts
    - precondition_id: normal-surface
      precondition_class: target
      description: '`POST /api/recovery/redeem` accepts exactly the JSON fields `account`,

        `case_fragment`, and `staff_detail`. Only the tuple `rhea.moss`, `CASE-7Q4M`,

        and `Blue cabinet 17` succeeds. It returns 201 and creates a 32-random-byte,

        unpadded-base64url session for `rhea.moss`, also usable as the HttpOnly,

        SameSite=Strict `CINDER_REHEARSAL_SESSION` cookie. The redemption is single-use;

        the server-side session persists for the environment lifetime. `GET

        /api/handover` requires that session and returns only Rhea''s private handover.'
      support_refs:
      - features.training.t-accounts
      - content.training-accounts-content.accounts-realm-json
      - content.training-accounts-content.accounts-directory-assignment-stf-204-json
      - content.training-accounts-content.accounts-handover-rhea-moss-md
      - content.training-accounts-content.accounts-service-contract-json
    - precondition_id: boundaries
      precondition_class: realization
      description: 'The session authenticates only this training subject. It can read the subject''s

        handover and use the assignment service, including the deliberately flawed

        assignment authorization in T02.4. It cannot change recovery factors, password,

        directory records, or any non-training application. There is no short expiry

        that makes a break or day-two resume lose acquired access. Neither handover

        reads nor assignment attempts revoke the session.'
      support_refs:
      - features.training.t-accounts
    effects:
    - effect_id: outcome
      effect_class: intended_effect
      description: Demonstrate the recovered identity and obtain its private handover. A recovery acknowledgement
        without usable access is insufficient. The session enables T02.4.
      target_refs:
      - features.training.t-accounts
      evidence_refs:
      - evidence_requirements.t02.c3
    - effect_id: verified-evidence
      effect_class: evidence_effect
      description: 'Recovery creates a session tied to the rehearsal subject. The authenticated

        handover read returns that subject''s private document and has its own service

        audit. The same session remains usable at the assignment service, including

        after a break or day-two resume.'
      target_refs:
      - features.training.t-accounts
      evidence_refs:
      - evidence_requirements.t02.c3
    failure_classes:
    - precondition_unsatisfied
    - authority_denied
    - target_unavailable
    - partial_success
    - backend_error
    - unknown
  c4:
    semantic_version: 1.0.0
    lifecycle_state: draft
    behavioral_granularity: aggregate
    procedure_basis: 'Native application RBAC maps the recovered Rhea principal to an intentionally

      over-broad `read` grant on `assignment-briefs/*`. The list correctly filters by

      owner, but the brief route checks only whether the subject owns any assignment;

      it never compares the requested record''s owner. Requesting discovered

      `ASG-317` therefore returns Dax''s brief. No session returns 401 and an unknown

      assignment returns 404.'
    realization_profile: backend-declared
    fidelity_claim: The authored mechanism, normal behavior, observable outcome, and authority boundaries constrain
      realization. Validation is not evidence that the application has been built or that the mechanism works.
    preconditions:
    - precondition_id: eligibility
      precondition_class: authority
      description: Satisfy one complete alternative in the referenced workflow and obtain the required scoped access
        to every listed surface.
      support_refs:
      - workflows.t02.c4
      - features.training.t-accounts
    - precondition_id: normal-surface
      precondition_class: target
      description: 'The recovered session''s assignment list contains only Rhea''s `ASG-204`. Its own

        brief is revision 3 and names paired dispatch assignment `ASG-317`, providing a

        fair record lead. `ASG-317` is revision 5 and belongs to `dax.hale`. `GET

        /api/assignments/{assignment_id}/brief` requires the recovered session and logs

        the session subject, requested ID, document revision, status, and UTC time.'
      support_refs:
      - features.training.t-accounts
      - content.training-accounts-content.accounts-handover-rhea-moss-md
      - content.training-accounts-content.accounts-assignment-asg-204-json
      - content.training-accounts-content.accounts-assignment-asg-317-json
      - content.training-accounts-content.accounts-service-contract-json
    - precondition_id: boundaries
      precondition_class: realization
      description: 'Only two synthetic training assignments exist and document access is read-only.

        The flaw cannot enumerate arbitrary accounts or cross into KeplerOps. Repeated

        reads and unsuccessful requests preserve the recovered session and all records.'
      support_refs:
      - features.training.t-accounts
    effects:
    - effect_id: outcome
      effect_class: intended_effect
      description: Recover the specified other operator's private brief while retaining the recovered account's
        identity. Reading its own handover is not new credit.
      target_refs:
      - features.training.t-accounts
      evidence_refs:
      - evidence_requirements.t02.c4
    - effect_id: verified-evidence
      effect_class: evidence_effect
      description: 'The assignment service returns the specified other operator''s brief and

        records the authenticated subject, requested assignment, and document revision.

        Reading the caller''s own brief remains an ordinary separately identifiable read.'
      target_refs:
      - features.training.t-accounts
      evidence_refs:
      - evidence_requirements.t02.c4
    failure_classes:
    - precondition_unsatisfied
    - authority_denied
    - target_unavailable
    - partial_success
    - backend_error
    - unknown
