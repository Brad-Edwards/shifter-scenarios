    - c2
    - seed-requirement
    items:
    - name: starting-records
      description: The rehearsal identity desk, candidate account notes, a public directory, recovery
        workflow, and assignment service.
  c3-records-1:
    type: dataset
    description: |-
      T02.3: required in-world starting records. Allocate each record to its actual owning service; this declaration does not duplicate secrets across services or grant their visibility.
      The rehearsal identity desk, candidate account notes, a public directory, recovery workflow, and assignment service.

      The training recovery workflow verifies an account, case reference, and a
