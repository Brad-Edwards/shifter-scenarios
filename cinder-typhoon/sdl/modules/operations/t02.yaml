action_contracts:
  c1:
    semantic_version: 1.0.0
    lifecycle_state: draft
    behavioral_granularity: aggregate
    procedure_basis: |-
      Its recovery lookup distinguishes inactive, unknown, and active accounts and
      returns a case-reference fragment only for an active assignment. The intended
      solution is to use the supplied contextual leads and response differences to
      identify the actual account, not to submit an unrestricted name list.
    realization_profile: backend-declared
    fidelity_claim: The authored mechanism, normal behavior, proof, authority limits, and reset requirements
      are required. Hosting and their implementation remain backend-declared.
    preconditions:
    - precondition_id: eligibility
      precondition_class: authority
      description: Satisfy one complete alternative in the referenced workflow and obtain the required
        scoped access to every listed surface.
      support_refs:
      - workflows.t02.c1
      - features.training.t-accounts
    - precondition_id: normal-surface
      precondition_class: target
      description: |-
        The identity desk is an authored self-service front end backed by the training
        realm in the shared identity broker. It accepts an account-recovery lookup and
        creates a case record for an active rehearsal account.
      support_refs: *id005
    - precondition_id: boundaries-and-reset
      precondition_class: realization
      description: |-
        These are requirements on the realized environment. Apply reset behavior only when a participant reset is requested, not on challenge completion.

        The endpoint is limited to the small rehearsal account set, rate-bounded, and
        has no password reset or session creation path. Reset clears lookup events and
        returns the fixed account states.
      support_refs:
      - features.training.t-accounts
    effects:
    - effect_id: outcome
      effect_class: intended_effect
      description: Recover the actual active account and its case reference. Submitting candidate names
        alone is insufficient. These are inputs to T02.3.
      target_refs: *id005
      evidence_refs:
      - evidence_requirements.t02.c1
    - effect_id: verified-evidence
      effect_class: evidence_effect
      description: |-
        The desk writes a lookup event for the active subject and discloses its linked
        case reference. Scoring checks both values and makes the evidence available to
        T02.3 without authenticating the player.
      target_refs: *id001
      evidence_refs:
      - evidence_requirements.t02.c1
    failure_classes:
    - precondition_unsatisfied
    - authority_denied
    - target_unavailable
    - partial_success
    - backend_error
    - unknown
  c2:
    semantic_version: 1.0.0
    lifecycle_state: draft
    behavioral_granularity: aggregate
    procedure_basis: |-
      The detail route relies on a client-side visibility decision and lacks the
      corresponding server-side authorization check. The intended solution is to
      inspect the normal public application and retrieve the one roster detail named
      by the training context.
    realization_profile: backend-declared
    fidelity_claim: The authored mechanism, normal behavior, proof, authority limits, and reset requirements
      are required. Hosting and their implementation remain backend-declared.
    preconditions:
    - precondition_id: eligibility
      precondition_class: authority
      description: Satisfy one complete alternative in the referenced workflow and obtain the required
        scoped access to every listed surface.
      support_refs:
      - workflows.t02.c2
      - features.training.t-accounts
    - precondition_id: normal-surface
      precondition_class: target
      description: |-
        The public directory renders a limited staff list from an API used by the
        identity desk. Its browser bundle also contains an assignment-detail request
        used by internal rehearsal coordinators and seeded roster records with staff
        IDs and assignments.
      support_refs: *id006
    - precondition_id: boundaries-and-reset
      precondition_class: realization
      description: |-
        These are requirements on the realized environment. Apply reset behavior only when a participant reset is requested, not on challenge completion.

        The API exposes only synthetic rehearsal roster entries and no identity
        mutation. Reset removes player read events; it does not change staff data.
      support_refs:
      - features.training.t-accounts
    effects:
    - effect_id: outcome
      effect_class: intended_effect
      description: Recover the actual private roster entry. Its staff detail supports T02.3; the public
        name list alone does not count.
      target_refs: *id006
      evidence_refs:
      - evidence_requirements.t02.c2
    - effect_id: verified-evidence
      effect_class: evidence_effect
      description: |-
        The roster service emits a detail-read event with the assignment and staff
        record version. That exact private entry becomes player evidence for recovery;
        the public display response cannot satisfy the score.
      target_refs: *id002
      evidence_refs:
      - evidence_requirements.t02.c2
    failure_classes:
    - precondition_unsatisfied
    - authority_denied
    - target_unavailable
    - partial_success
    - backend_error
    - unknown
  c3:
    semantic_version: 1.0.0
    lifecycle_state: draft
    behavioral_granularity: aggregate
    procedure_basis: |-
      The workflow accepts independently observable identity attributes as if they
      were proof of account ownership. The intended solution combines the exact
      outputs of T02.1 and T02.2 in the normal recovery flow; neither alone is
      sufficient.
    realization_profile: backend-declared
    fidelity_claim: The authored mechanism, normal behavior, proof, authority limits, and reset requirements
      are required. Hosting and their implementation remain backend-declared.
    preconditions:
    - precondition_id: eligibility
      precondition_class: authority
      description: Satisfy one complete alternative in the referenced workflow and obtain the required
        scoped access to every listed surface.
      support_refs:
      - workflows.t02.c3
      - features.training.t-accounts
    - precondition_id: normal-surface
      precondition_class: target
      description: |-
        The training recovery workflow verifies an account, case reference, and a
        staff-detail value before issuing a one-use recovery session. The recovered
        account owns a private handover document in the identity desk.
      support_refs: *id007
    - precondition_id: boundaries-and-reset
      precondition_class: realization
      description: |-
        These are requirements on the realized environment. Apply reset behavior only when a participant reset is requested, not on challenge completion.

        The session can view only this training account and expires rapidly. It cannot
        change recovery factors, password, directory records, or any non-training
        application. Reset revokes the session and restores case state.
      support_refs:
      - features.training.t-accounts
    effects:
    - effect_id: outcome
      effect_class: intended_effect
      description: Demonstrate the recovered identity and obtain its private handover. A recovery acknowledgement
        without usable access is insufficient. The session enables T02.4.
      target_refs: *id007
      evidence_refs:
      - evidence_requirements.t02.c3
    - effect_id: verified-evidence
      effect_class: evidence_effect
      description: |-
        A successful recovery creates a player-scoped session tied to the rehearsal
        subject and a handover-read event. Scoring requires both session issuance and
        the private handover retrieval, then exposes the session for T02.4.
      target_refs: *id003
      evidence_refs:
      - evidence_requirements.t02.c3
    failure_classes:
    - precondition_unsatisfied
    - authority_denied
    - target_unavailable
    - partial_success
    - backend_error
    - unknown
  c4:
    semantic_version: 1.0.0
    lifecycle_state: draft
    behavioral_granularity: aggregate
    procedure_basis: |-
      The service checks that a caller has any training assignment but does not bind
      the requested brief to that caller's assignment. The intended solution is a
      record-level authorization test using the session earned in T02.3.
    realization_profile: backend-declared
    fidelity_claim: The authored mechanism, normal behavior, proof, authority limits, and reset requirements
      are required. Hosting and their implementation remain backend-declared.
    preconditions:
    - precondition_id: eligibility
      precondition_class: authority
      description: Satisfy one complete alternative in the referenced workflow and obtain the required
        scoped access to every listed surface.
      support_refs:
      - workflows.t02.c4
      - features.training.t-accounts
    - precondition_id: normal-surface
      precondition_class: target
      description: |-
        The assignment service lists assignments for the recovered training subject and
        serves sealed briefs by assignment ID. Each brief has a distinct owner,
        rehearsal scope, and immutable document revision.
      support_refs: *id008
    - precondition_id: boundaries-and-reset
      precondition_class: realization
      description: |-
        These are requirements on the realized environment. Apply reset behavior only when a participant reset is requested, not on challenge completion.

        Only two synthetic training assignments exist and document access is read-only.
        The flaw cannot enumerate arbitrary accounts or cross into KeplerOps. Reset
        clears player events and restores the session fixture.
      support_refs:
      - features.training.t-accounts
    effects:
    - effect_id: outcome
      effect_class: intended_effect
      description: Recover the specified other operator's private brief while retaining the recovered
        account's identity. Reading its own handover is not new credit.
      target_refs: *id008
      evidence_refs:
      - evidence_requirements.t02.c4
    - effect_id: verified-evidence
      effect_class: evidence_effect
      description: |-
        Completion is a read of the specified other operator's brief, recorded with the
        recovered subject, requested assignment, and document revision. Reading the
        caller's own brief is ordinary behavior and earns no new event.
      target_refs: *id004
      evidence_refs:
      - evidence_requirements.t02.c4
    failure_classes:
    - precondition_unsatisfied
    - authority_denied
    - target_unavailable
    - partial_success
    - backend_error
    - unknown
