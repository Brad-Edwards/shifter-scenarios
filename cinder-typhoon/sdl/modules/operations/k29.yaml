assertions:
  c1-ready:
    proposition: c1
    role: precondition
    polarity: positive
  c1-done:
    proposition: c1
    role: postcondition
    polarity: positive
  c2-ready:
    proposition: c2
    role: precondition
    polarity: positive
  c2-done:
    proposition: c2
    role: postcondition
    polarity: positive
  c3-ready:
    proposition: c3
    role: precondition
    polarity: positive
  c3-done:
    proposition: c3
    role: postcondition
    polarity: positive
  c4-ready:
    proposition: c4
    role: precondition
    polarity: positive
  c4-done:
    proposition: c4
    role: postcondition
    polarity: positive
objectives:
  c1:
    name: 'K29.1: The build record''s principal'
    description: |-
      Recover the limited release principal behind the protected build dossier and establish what it can actually access.

      Starts the durable-delivery branch with a scoped cloud capability.
    agent: participant.operator
    actions:
    - k29.c1
    targets: &id005
    - features.k-delivery.k-ci
    success:
      mode: all_of
      assertions:
      - c1-done
    window:
      workflows:
      - k29.c1
  c2:
    name: 'K29.2: The signer in the history'
    description: |-
      Recover usable signing authority for the accepted release lineage from the protected source history and release records.

      Connects cloud access to historical source and signing trust.
    agent: participant.operator
    actions:
    - k29.c2
    targets: &id006
    - features.k-delivery.k-source
    success:
      mode: all_of
      assertions:
      - c2-done
    window:
      workflows:
      - k29.c2
  c3:
    name: 'K29.3: Signed, compatible, consumed'
    description: |-
      Deliver one signed support release that carries Cinder's change for ARWC while preserving the unrelated reference customer's behavior. Both the current and retained supported connector interfaces must continue to accept the release.

      Demonstrates a complete trusted-delivery compromise.
    agent: participant.operator
    actions:
    - k29.c3
    targets: &id007
    - features.k-delivery.k-ci--rehearsals
    - features.k-delivery.k-registry
    success:
      mode: all_of
      assertions:
      - c3-done
    window:
      workflows:
      - k29.c3
  c4:
    name: 'K29.4: After the old key expires'
    description: |-
      Carry your delivery capability through the disclosed release-credential rollover. Make the replacement release work after the old credential stops being accepted.

      Closes the support ticket on a release Cinder can reproduce.
    agent: participant.operator
    actions:
    - k29.c4
    targets: &id008
    - features.k-delivery.k-ci--rehearsals
    success:
      mode: all_of
      assertions:
      - c4-done
    window:
      workflows:
      - k29.c4
workflows:
  c1:
    description: 'K29.1: availability follows the evidence/authority alternatives. This independent objective
      may be revisited when facts change; no campaign-wide sequence or deadline is imposed.'
    start: requirements
    steps:
      requirements:
        type: switch
        cases:
        - when:
            assertions:
            - capabilities.g01-ready
            - capabilities.g02-ready
            - k09.c1-ready
          next: attempt
        - when:
            assertions:
            - capabilities.g01-ready
            - capabilities.g02-ready
            - k13.c1-ready
          next: attempt
        - when:
            assertions:
            - capabilities.g01-ready
            - capabilities.g02-ready
            - k04.c4-ready
          next: attempt
        default: unavailable
      available:
        type: end
      unavailable:
        type: end
      attempt:
        type: objective
        execution_mode: objective
        objective: k29.c1
        on_success: available
        on_failure: unavailable
  c2:
