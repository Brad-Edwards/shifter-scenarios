objectives:
  c1:
    name: 'K29.1: The build record''s principal'
    description: |-
      Recover the limited release principal behind the protected build dossier and establish what it can actually access.

      Starts the durable-delivery branch with a scoped cloud capability.
    agent: participant.operator
    actions:
    - k29.c1
    targets:
    - features.k-cloud.k-cloud-api--build-records
    - features.k-delivery.k-ci
    success:
      mode: all_of
      assertions:
      - c1-done
    window:
      workflows:
      - k29.c1
  c2:
    name: 'K29.2: The signer in the history'
    description: |-
      Recover usable signing authority for the accepted release lineage from the protected source history and release records.

      Connects cloud access to historical source and signing trust.
    agent: participant.operator
    actions:
    - k29.c2
    targets:
    - features.k-delivery.k-source
    success:
      mode: all_of
      assertions:
      - c2-done
    window:
      workflows:
      - k29.c2
  c3:
    name: 'K29.3: Signed, compatible, consumed'
    description: |-
      Deliver one signed support release that carries Cinder's change for ARWC while preserving the unrelated reference customer's behavior. Both the current and retained supported connector interfaces must continue to accept the release.

      Demonstrates a complete trusted-delivery compromise.
    agent: participant.operator
    actions:
    - k29.c3
    targets:
    - features.k-delivery.k-registry
    - features.k-delivery.k-ci--rehearsals
    success:
      mode: all_of
      assertions:
      - c3-done
    window:
      workflows:
      - k29.c3
  c4:
    name: 'K29.4: After the old key expires'
    description: |-
      Carry your delivery capability through the disclosed release-credential rollover. Make the replacement release work after the old credential stops being accepted.

      Closes the support ticket on a release Cinder can reproduce.
    agent: participant.operator
    actions:
    - k29.c4
    targets:
    - features.k-delivery.k-ci--rehearsals
    success:
      mode: all_of
      assertions:
      - c4-done
    window:
      workflows:
      - k29.c4
