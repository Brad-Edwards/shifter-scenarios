      retention: require
      redaction: redact-secrets
      integrity: checksum
      required: true
      basis: observed
    notes:
    - 'Author checks: Verify the normal baseline, the exact intended path, and the fresh evidence described above.
      Reject a wrong identifier, revision, digest, tenant, identity, stale result, or cross-participant reference.
      Verify unrelated records and permissions remain unchanged and that the result remains recognizable and usable
      by every declared downstream consumer.'
  c3:
    description: |-
      Produce fresh customer test results tying the signed revision to its actual consumed content. ARWC must exhibit the chosen change; the supplied reference customer and both supported interfaces must retain their required behavior. Merely signing an artifact with K29.2's key does not count.

      Required technical proof: Completion is observed by the owning service from the fresh result and its immutable audit correlation. The evidence binds the participant, accepted identity or job, exact input and output identifiers, relevant revision or digest, and destination-side observation where a second service consumes the result. Objective evaluation does not create the result or grant authority.
    source_refs:
    - features.k-delivery.k-registry
    - features.k-delivery.k-ci--rehearsals
    scope: Per-participant in-world evidence; no other participant state.
    boundary_kind: assertion_evaluation
