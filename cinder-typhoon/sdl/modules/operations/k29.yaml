evidence_requirements:
  c1:
    description: Cross the build-record boundary and demonstrate the recovered principal against its protected
      release dossier. The dossier also supplies the package-interface examples used by K29.3. A credential
      string alone is insufficient.
    source_refs: &id001
    - features.k-delivery.k-ci
    scope: Per-participant in-world evidence; no other participant state.
    boundary_kind: assertion_evaluation
    channel: other
    artifact_role: proposition_truth_evidence
    sensitivity: plain
    redaction: redact_secrets
    integrity: checksum
    retention: run_lifetime
    loss_disclosure: required
    observation_demand:
      rule_id: fact-k29-1
      scope: /features
      purpose: experimental
      mode: selected
      selector:
        semantic_scope: /features
        data_kind: artifact
        names:
        - cinder.k29-1.satisfied
        component_refs:
        - features.k-delivery.k-ci
      collection: require
      retention: require
      redaction: redact-secrets
      integrity: checksum
      required: true
      basis: observed
  c2:
    description: Establish signing authority that matches the consumer's accepted release lineage. The
      current checkout or an unrelated old key does not satisfy the objective.
    source_refs: &id002
    - features.k-delivery.k-source
    scope: Per-participant in-world evidence; no other participant state.
    boundary_kind: assertion_evaluation
    channel: other
    artifact_role: proposition_truth_evidence
    sensitivity: plain
    redaction: redact_secrets
    integrity: checksum
    retention: run_lifetime
    loss_disclosure: required
    observation_demand:
      rule_id: fact-k29-2
      scope: /features
      purpose: experimental
      mode: selected
      selector:
        semantic_scope: /features
        data_kind: artifact
        names:
        - cinder.k29-2.satisfied
        component_refs:
        - features.k-delivery.k-source
      collection: require
      retention: require
      redaction: redact-secrets
      integrity: checksum
      required: true
      basis: observed
  c3:
    description: Produce fresh customer test results tying the signed revision to its actual consumed
      content. ARWC must exhibit the chosen change; the supplied reference customer and both supported
      interfaces must retain their required behavior. Merely signing an artifact with K29.2's key does
      not count.
    source_refs: &id003
    - features.k-delivery.k-ci--rehearsals
    - features.k-delivery.k-registry
    scope: Per-participant in-world evidence; no other participant state.
    boundary_kind: assertion_evaluation
    channel: other
    artifact_role: proposition_truth_evidence
    sensitivity: plain
    redaction: redact_secrets
    integrity: checksum
    retention: run_lifetime
    loss_disclosure: required
    observation_demand:
      rule_id: fact-k29-3
      scope: /features
      purpose: experimental
      mode: selected
      selector:
        semantic_scope: /features
        data_kind: artifact
        names:
        - cinder.k29-3.satisfied
        component_refs:
        - features.k-delivery.k-ci--rehearsals
        - features.k-delivery.k-registry
      collection: require
      retention: require
      redaction: redact-secrets
      integrity: checksum
      required: true
      basis: observed
  c4:
    description: Demonstrate a fresh post-rollover delivery with the old credential rejected and the unrelated
      customer's behavior preserved. The rehearsal does not revoke main-campaign access.
    source_refs: &id004
    - features.k-delivery.k-ci--rehearsals
    scope: Per-participant in-world evidence; no other participant state.
    boundary_kind: assertion_evaluation
    channel: other
