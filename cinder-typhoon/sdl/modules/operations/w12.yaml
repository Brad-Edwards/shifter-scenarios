action_contracts:
  c1:
    semantic_version: 1.0.0
    lifecycle_state: draft
    behavioral_granularity: aggregate
    procedure_basis: |-
      This card is an exact discovery, interpretation, or reconciliation task rather than an additional privilege flaw. Quarantine object QTN-COL-2019-12 uses fictional AQTN1 framing with metadata length, encrypted payload length, SHA-256, and collector build ID COLLECT-CRR-12. The result must come from the declared source and bindings, not from a duplicate clue or pre-completed record.

      The required result is: Recover the actual collector and its archive binding. There is no objective to deploy it or damage data.
    realization_profile: backend-declared
    fidelity_claim: The exact initial state, versions, formats, validation order, authorization decisions, process
      quantities, denial cases, persistent state, and independently owned evidence are required. Implementation
      choices remain open only when none of those facts change.
    preconditions:
    - precondition_id: eligibility
      precondition_class: authority
      description: Satisfy one complete alternative in the referenced workflow and obtain the required scoped access
        to every listed surface.
      support_refs:
      - workflows.w12.c1
      - features.a-corporate.a-archive
    - precondition_id: normal-surface
      precondition_class: target
      description: |-
        `a-archive` and its `retained-archive` application own this part of **A collector in quarantine**. Normal behavior applies the declared identity, tenant, object, revision, and process bindings and returns or changes only the caller-scoped object. The exact initial state is: Quarantine object QTN-COL-2019-12 uses fictional AQTN1 framing with metadata length, encrypted payload length, SHA-256, and collector build ID COLLECT-CRR-12.

        Native bindings:

        - `a-corporate.a-archive/retained-archive/a-collector-in-quarantine`
        - `a-corporate.a-archive/filesystem:/var/lib/arwc-archive/artifacts/a-collector-in-quarantine`

        The private service-loader contract is `content.arwc-a-archive.w12-1-a-collector-in-quarantine`. It freezes accepted and denied requests, state transition, persistence, and evidence; it does not seed a successful result.
      support_refs:
      - features.a-corporate.a-archive
      - content.arwc-a-archive.w12-1-a-collector-in-quarantine
    - precondition_id: scope-and-persistence
      precondition_class: realization
      description: |-
        The result remains local evidence unless a downstream workflow explicitly names it. Tenant-scoped mutations, sessions that have not expired, generated artifacts, and audits persist across ordinary retries and later sessions. Initial immutable records remain unchanged unless the named route explicitly permits a field-level revision. Infrastructure recovery and submission adjudication are external to the SDL.

        The behavior is limited to the named fictional objects and bounded service operation. It provides no general shell, arbitrary network target, unrelated district access, real process interface, or authority not expressly declared by the card.
      support_refs:
      - features.a-corporate.a-archive
    effects:
