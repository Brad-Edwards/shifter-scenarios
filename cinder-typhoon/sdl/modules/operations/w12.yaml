objectives:
  c1:
    name: 'W12.1: A collector in quarantine'
    description: |-
      Recover the historical collector associated with the archive lead and restore it as a usable analysis artifact.

      Continues the intelligence trail from contractor or lineage evidence.
    agent: participant.operator
    actions:
    - w12.c1
    targets: &id005
    - features.a-corporate.a-archive
    success:
      mode: all_of
      assertions:
      - c1-done
    window:
      workflows:
      - w12.c1
  c2:
    name: 'W12.2: How the collection was protected'
    description: |-
      Reconstruct the collector's cryptographic behavior well enough to reproduce its handling of the supplied archive samples.

      Establishes understanding before recovering the protected collection.
    agent: participant.operator
    actions:
    - w12.c2
    targets: &id006
    - features.a-corporate.a-archive
    success:
      mode: all_of
      assertions:
      - c2-done
    window:
      workflows:
      - w12.c2
  c3:
    name: 'W12.3: The cold archive opens'
    description: |-
      Recover the protected archive and the maintenance history it contains.

      Gives the reconstruction an actual data-recovery payoff.
    agent: participant.operator
    actions:
    - w12.c3
    targets: &id007
    - features.a-corporate.a-archive
    success:
      mode: all_of
      assertions:
      - c3-done
    window:
      workflows:
      - w12.c3
  c4:
    name: 'W12.4: A collection path still alive'
    description: |-
      Reconstruct the surviving collection relationship and obtain the current protected data associated with the archived maintenance identity.

      Makes old intelligence useful without substituting it for current plant observations.
    agent: participant.operator
    actions:
    - w12.c4
    targets: &id008
    - features.a-corporate.a-archive
    success:
      mode: all_of
      assertions:
      - c4-done
    window:
      workflows:
      - w12.c4
workflows:
  c1:
    description: 'W12.1: availability follows the evidence/authority alternatives. This independent objective
      may be revisited when facts change; no campaign-wide sequence or deadline is imposed.'
    start: requirements
    steps:
      requirements:
        type: switch
        cases:
        - when:
            assertions:
            - w08.c4-ready
          next: attempt
        - when:
            assertions:
            - w11.c3-ready
          next: attempt
        default: unavailable
      available:
        type: end
      unavailable:
        type: end
      attempt:
        type: objective
        execution_mode: objective
        objective: w12.c1
        on_success: available
        on_failure: unavailable
