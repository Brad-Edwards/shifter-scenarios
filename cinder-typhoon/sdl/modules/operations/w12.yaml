objectives:
  c1:
    name: 'This action: A collector in quarantine'
    description: |-
      Recover the historical collector associated with the archive lead and restore it as a usable analysis artifact.

      Continues the intelligence trail from contractor or lineage evidence.
    agent: participant.operator
    actions:
    - w12.c1
    targets:
    - features.a-corporate.a-archive
    success:
      mode: all_of
      assertions:
      - c1-done
    window:
      workflows:
      - w12.c1
  c2:
    name: 'This action: How the collection was protected'
    description: |-
      Reconstruct the collector's cryptographic behavior well enough to reproduce its handling of the supplied archive samples.

      Establishes understanding before recovering the protected collection.
    agent: participant.operator
    actions:
    - w12.c2
    targets:
    - features.a-corporate.a-archive
    success:
      mode: all_of
      assertions:
      - c2-done
    window:
      workflows:
      - w12.c2
  c3:
    name: 'This action: The cold archive opens'
    description: |-
      Recover the protected archive and the maintenance history it contains.

      Gives the reconstruction an actual data-recovery payoff.
    agent: participant.operator
    actions:
    - w12.c3
    targets:
    - features.a-corporate.a-archive
    success:
      mode: all_of
      assertions:
      - c3-done
    window:
      workflows:
      - w12.c3
  c4:
    name: 'This action: A collection path still alive'
    description: |-
      Reconstruct the surviving collection relationship and obtain the current protected data associated with the archived maintenance identity.

      Makes old intelligence useful without substituting it for current plant observations.
    agent: participant.operator
    actions:
    - w12.c4
    targets:
    - features.a-corporate.a-archive
    success:
      mode: all_of
      assertions:
      - c4-done
    window:
      workflows:
      - w12.c4
