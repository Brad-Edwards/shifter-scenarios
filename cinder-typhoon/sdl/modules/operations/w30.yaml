evidence_requirements:
  c1:
    description: |-
      Produce a command plan whose target, current revision, units, mode, and authority match the intended bounded release. A copied practice sequence is insufficient.

      Required technical proof: Evidence joins the independently owned service observations listed below; all are required for the same tenant instance, request correlation, identifiers, revision, and interval. Completion is evaluated from fresh service-owned evidence after the action. It cannot issue the identity, create the mutation, move a simulated actuator, or fabricate a downstream acceptance needed to prove itself.

      Evidence sources are `features.a-engineering.a-hmi`, `features.a-control.a-reservoir`. A wrong identifier, stale revision, replayed one-time value, different checkpoint, or cross-tenant artifact is rejected.
    source_refs:
    - features.a-engineering.a-hmi
    - features.a-control.a-reservoir
    scope: Per-participant in-world evidence; no other participant state.
    boundary_kind: assertion_evaluation
    channel: other
    artifact_role: proposition_truth_evidence
    sensitivity: plain
    redaction: redact_secrets
    integrity: checksum
    retention: run_lifetime
    loss_disclosure: required
    observation_demand:
      rule_id: fact-w30-1
      scope: /features
      purpose: experimental
      mode: selected
      selector:
        semantic_scope: /features
        data_kind: artifact
        names:
        - cinder.w30-1.satisfied
        component_refs:
        - features.a-engineering.a-hmi
        - features.a-control.a-reservoir
      collection: require
      retention: require
      redaction: redact-secrets
      integrity: checksum
      required: true
      basis: observed
    notes:
    - 'Author checks: Build and test the normal baseline first. Exercise the exact authored path and verify the
      named result plus its immutable audit. Test wrong authority, wrong object or district, stale revision, replay,
      another tenant instance, and every declared constraint or unaffected record. Repeat the accepted action according
      to its idempotence rule and confirm ordinary retries preserve the result. For a joined result, verify each
      destination observed the same correlation and that removal of any independently owned source prevents completion.'
  c2:
    description: |-
      Demonstrate the opening and resulting volume change through independent process observations. This supplies W30.RESULT. A command acknowledgement or altered report does not establish the result; the release remains within the normal channel envelope. The conclusion follows the verified effect through three connected facts: the identified reservoir gates moved, usable reserve fell by the observed amount, and that loss produces the calculated replacement cost and water restrictions. ARWC's resulting continuity notice makes the economic consequence explicit. The gate state, before-and-after reserve, cost, and restrictions all belong to this operator's same completed release; success does not require waiting for an additional delay. The earlier maintenance ticket and the outlet the operator identified anchor the ending in familiar evidence. Additional contextual records appear only when their source records are present. The fictional consequence remains financial loss and restrictions, with the dam intact and no catastrophic flooding. The authored notice expresses the existing consequence calculation; it does not require a new procurement, messaging, or control capability.

      Required technical proof: Evidence joins the independently owned service observations listed below; all are required for the same tenant instance, request correlation, identifiers, revision, and interval. Completion is evaluated from fresh service-owned evidence after the action. It cannot issue the identity, create the mutation, move a simulated actuator, or fabricate a downstream acceptance needed to prove itself.

      Evidence sources are `features.a-control.a-reservoir`, `features.a-control.a-instruments`. A wrong identifier, stale revision, replayed one-time value, different checkpoint, or cross-tenant artifact is rejected.
    source_refs:
    - features.a-control.a-reservoir
    - features.a-control.a-instruments
