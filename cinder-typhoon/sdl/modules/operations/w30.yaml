evidence_requirements:
  c1:
    description: |-
      Produce an exact request plan for `CRR-OP-W30-R1`: asset `AST-CRR-017`, automatic total flow 0.30 m³/s, non-retained QoS 1 delivery, a fresh UUID, a 90-second Unix-time expiry, and the separate local FUXA restoration to manual A20/B20. This card prepares the request but does not issue it.

      Required technical proof: Completion reads a range-supplied snapshot of the installed dispatcher contract, journal, native PLC decisions, and process history as applicable to the card. The participant cannot supply product evidence. The evaluator cannot issue a broker request, write a controller tag, move an outlet, retry an uncertain request, take local priority, or create product evidence.

      Evidence sources are `features.a-engineering.a-engineering`, `features.a-engineering.a-hmi`. A wrong asset, project revision, request schema, topic, QoS, retain status marker, principal, target, expiry, outcome sequence, retry rule, or restoration path is rejected.
    source_refs:
    - features.a-engineering.a-engineering
    - features.a-engineering.a-hmi
    scope: Per-participant in-world evidence; no other participant state.
    boundary_kind: assertion_evaluation
    channel: other
    artifact_role: proposition_truth_evidence
    sensitivity: plain
    redaction: redact_secrets
    integrity: checksum
    retention: run_lifetime
    loss_disclosure: required
    observation_demand:
      rule_id: fact-w30-1
      scope: /features
      purpose: experimental
      mode: selected
      selector:
        semantic_scope: /features
        data_kind: artifact
        names:
        - cinder.w30-1.satisfied
        component_refs:
        - features.a-engineering.a-engineering
        - features.a-engineering.a-hmi
      collection: require
      retention: require
      redaction: redact-secrets
      integrity: checksum
      required: true
      basis: observed
    notes:
    - 'Author checks: Confirm the image-owned plan agrees with the installed dispatcher contract and running project.
      Accept the exact target, delivery, identity, expiry, outcome, retry, and restoration rules. Reject wrong assets,
      stale project revisions, ISO timestamps, retained delivery, arbitrary topics, caller-supplied authority, automatic
      uncertain retries, alternate write paths, or any claimed product action. Confirm completion leaves dispatcher,
      PLC, and field state unchanged.'
  c2:
    description: |-
      Demonstrate one completed automatic-flow request for `AST-CRR-017` through the authenticated MQTT dispatcher, native OpenPLC acceptance, and settled two-outlet field feedback at approximately 0.15 m³/s per outlet. Then use the local FUXA HMI to take priority and restore manual A20/B20, approximately 0.10 m³/s per outlet and 0.20 m³/s total, with healthy I/O, valid permissives, no motion, and no travel fault. This supplies W30.RESULT. Broker receipt, durable dispatcher receipt, PLC acceptance, and settled equipment feedback are distinct. The dispatcher journal, native PLC decision history, and process historian must agree on the same request, sequence, and interval. Completion never issues a request, retries an uncertain result, or restores the plant on the participant's behalf.

      Required technical proof: Completion reads a range-supplied snapshot of the installed dispatcher contract, journal, native PLC decisions, and process history as applicable to the card. The participant cannot supply product evidence. The evaluator cannot issue a broker request, write a controller tag, move an outlet, retry an uncertain request, take local priority, or create product evidence.

      Evidence sources are `features.a-engineering.a-hmi`, `features.a-engineering.a-historian`, `features.a-control.a-reservoir`, `features.a-control.a-instruments`. A wrong request identity, asset, principal, mode, expiry, transition order, PLC sequence, ownership, permissive, product time, process quality, measured feedback, or restored baseline is rejected.
    source_refs:
    - features.a-engineering.a-hmi
    - features.a-engineering.a-historian
    - features.a-control.a-reservoir
    - features.a-control.a-instruments
    scope: Per-participant in-world evidence; no other participant state.
    boundary_kind: assertion_evaluation
    channel: other
    artifact_role: proposition_truth_evidence
    sensitivity: plain
    redaction: redact_secrets
    integrity: checksum
    retention: run_lifetime
    loss_disclosure: required
    observation_demand:
      rule_id: fact-w30-2
      scope: /features
      purpose: experimental
      mode: selected
      selector:
        semantic_scope: /features
        data_kind: artifact
        names:
        - cinder.w30-2.satisfied
        component_refs:
        - features.a-engineering.a-hmi
        - features.a-engineering.a-historian
        - features.a-control.a-reservoir
        - features.a-control.a-instruments
      collection: require
      retention: require
      redaction: redact-secrets
      integrity: checksum
      required: true
      basis: observed
    notes:
    - 'Author checks: Begin at the qualified A20/B20 baseline. Execute the exact remote automatic-flow request through
      the participant workstation, then restore through local FUXA priority. Require ordered durable dispatcher
      transitions, the matching native PLC acceptance, remote ownership, good-quality two-outlet settled feedback,
      a later local HMI acceptance, and the fully restored baseline. Reject wrong or duplicate identities, conflicts,
      expiry, rejection, uncertainty, supersession before completion, missing sources, stale or bad-quality observations,
      participant-supplied product evidence, or failure to restore. Reset must return the same qualified baseline
      without replaying a dispatcher request or changing product identities and trust material.'
