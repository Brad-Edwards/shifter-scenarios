    semantic_version: 1.0.0
    lifecycle_state: draft
    behavioral_granularity: aggregate
    procedure_basis: |-
      The authored condition is **bounded actuation with independent measurement**. Live reservoir accepts bound plan PLAN-CRR-LOSS-1000; command audit records the ramp and setpoint timeline while independent instruments integrate 1.00 ML and reserve 12.40 to 11.40 ML, producing liability and Stage A continuity records. The hand build must preserve every named version, encoding, bound, validation order, identity, and unaffected field; substituting a generic vulnerable service would change the task.

