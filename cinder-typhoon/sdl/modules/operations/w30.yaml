objectives:
  c1:
    name: 'This action: Bind the plan to the plant'
    description: |-
      Turn the bounded release plan into a correctly bound live command plan using the client and authority you earned.

      Joins the operating context's separately earned knowledge and control capabilities.
    agent: participant.operator
    actions:
    - w30.c1
    targets:
    - features.a-engineering.a-hmi
    - features.a-control.a-reservoir
    success:
      mode: all_of
      assertions:
      - c1-done
    window:
      workflows:
      - w30.c1
  c2:
    name: 'This action: Open the gates'
    description: |-
      Execute the bounded opening and establish its actual effect on usable reserve. Show the replacement cost and restrictions that follow from the lost water.

      Completes the main story with gates moving and a credible financial consequence.
    agent: participant.operator
    actions:
    - w30.c2
    targets:
    - features.a-control.a-reservoir
    - features.a-control.a-instruments
    success:
      mode: all_of
      assertions:
      - c2-done
    window:
      workflows:
      - w30.c2
workflows:
  c1:
    description: 'This action: availability follows the evidence/authority alternatives. This independent objective
      may be revisited when facts change; no global sequence or deadline is imposed.'
    start: requirements
    steps:
      requirements:
        type: switch
        cases:
        - when:
            assertions:
            - capabilities.process-interpretation-ready
            - capabilities.control-ready
            - capabilities.mode-ready
            - capabilities.consequence-plan-ready
          next: attempt
        default: unavailable
      available:
        type: end
      unavailable:
        type: end
      attempt:
        type: objective
        execution_mode: objective
        objective: w30.c1
        on_success: available
        on_failure: unavailable
  c2:
    description: 'This action: availability follows the evidence/authority alternatives. This independent objective
      may be revisited when facts change; no global sequence or deadline is imposed.'
    start: requirements
    steps:
      requirements:
        type: switch
        cases:
        - when:
            assertions:
            - w30.c1-ready
          next: attempt
        default: unavailable
      available:
        type: end
      unavailable:
        type: end
      attempt:
        type: objective
        execution_mode: objective
        objective: w30.c2
        on_success: available
        on_failure: unavailable
action_contracts:
  c1:
    semantic_version: 1.0.0
    lifecycle_state: draft
    behavioral_granularity: aggregate
    procedure_basis: |-
      The authored condition is **multi-authority live command binding**. Command-plan binder requires scoped client, asset AST-CRR-017, outlet OG-CRR-02, project CRR-CTRL-R21, map MAP-OG2-R8, mode MODE-CRR-17, envelope ENV-OG2-R6, and plan PLAN-CRR-LOSS-1000. The hand build must preserve every named version, encoding, bound, validation order, identity, and unaffected field; substituting a generic vulnerable service would change the task.

      The required result is: Produce a command plan whose target, current revision, units, mode, and authority match the intended bounded release. A copied practice sequence is insufficient. Process quantities and state separation are governed by `arwc-process-model.md`, specifically `PLAN-CRR-LOSS-1000`, `ENV-OG2-R6`.
    realization_profile: backend-declared
    fidelity_claim: The exact initial state, versions, formats, validation order, authorization decisions, process
      quantities, denial cases, persistent state, and independently owned evidence are required. Implementation
      choices remain open only when none of those facts change.
    preconditions:
    - precondition_id: eligibility
      precondition_class: authority
      description: Satisfy one complete alternative in the referenced workflow and obtain the required scoped access
        to every listed surface.
      support_refs:
      - workflows.w30.c1
      - features.a-engineering.a-hmi
      - features.a-control.a-reservoir
    - precondition_id: normal-surface
      precondition_class: target
      description: |-
        `a-hmi` and its `supervisory-operations` application own this part of **Bind the plan to the plant**. Normal behavior applies the declared identity, tenant, object, revision, and process bindings and returns or changes only the caller-scoped object. The exact initial state is: Command-plan binder requires scoped client, asset AST-CRR-017, outlet OG-CRR-02, project CRR-CTRL-R21, map MAP-OG2-R8, mode MODE-CRR-17, envelope ENV-OG2-R6, and plan PLAN-CRR-LOSS-1000.

        Native bindings:

        - `a-engineering.a-hmi/supervisory-operations/bind-the-plan-to-the-plant`
        - `a-control.a-reservoir/reservoir-controller/bind-the-plan-to-the-plant`

        The private service-loader contract is `content.arwc-a-hmi.w30-1-bind-the-plan-to-the-plant`. It freezes accepted and denied requests, state transition, persistence, and evidence; it does not seed a successful result.
      support_refs:
      - features.a-engineering.a-hmi
      - features.a-control.a-reservoir
      - content.arwc-a-hmi.w30-1-bind-the-plan-to-the-plant
    - precondition_id: scope-and-persistence
      precondition_class: realization
      description: |-
        The result remains local evidence unless a downstream workflow explicitly names it. Tenant-scoped mutations, sessions that have not expired, generated artifacts, and audits persist across ordinary retries and later sessions. Initial immutable records remain unchanged unless the named route explicitly permits a field-level revision. Infrastructure recovery and submission adjudication are external to the SDL.

        The behavior is limited to the named fictional objects and bounded service operation. It provides no general shell, arbitrary network target, unrelated district access, real process interface, or authority not expressly declared by the card.
      support_refs:
      - features.a-engineering.a-hmi
      - features.a-control.a-reservoir
    effects:
    - effect_id: outcome
      effect_class: intended_effect
      description: Produce a command plan whose target, current revision, units, mode, and authority match the intended
        bounded release. A copied practice sequence is insufficient.
      target_refs:
      - features.a-engineering.a-hmi
      - features.a-control.a-reservoir
      evidence_refs:
      - evidence_requirements.w30.c1
    - effect_id: verified-evidence
      effect_class: evidence_effect
      description: |-
        Evidence joins the independently owned service observations listed below; all are required for the same tenant instance, request correlation, identifiers, revision, and interval. Completion is evaluated from fresh service-owned evidence after the action. It cannot issue the identity, create the mutation, move a simulated actuator, or fabricate a downstream acceptance needed to prove itself.

        Evidence sources are `features.a-engineering.a-hmi`, `features.a-control.a-reservoir`. A wrong identifier, stale revision, replayed one-time value, different checkpoint, or cross-tenant artifact is rejected.
      target_refs:
      - features.a-engineering.a-hmi
      - features.a-control.a-reservoir
      evidence_refs:
      - evidence_requirements.w30.c1
    failure_classes:
    - precondition_unsatisfied
    - authority_denied
    - target_unavailable
    - partial_success
    - backend_error
    - unknown
