objectives:
  c1:
    name: 'This action: Bind the plan to the plant'
    description: Turn the approved operating instruction into an exact request for the installed Cairn Reach dispatcher.
      Bind the asset, mode, setpoint, expiry, delivery rules, and recovery path before anything moves.
    assigned_participant: participant.operator
    actions:
    - w30.c1
    targets:
    - features.a-engineering.a-engineering
    - features.a-engineering.a-hmi
    success:
      mode: all_of
      assertions:
      - c1-done
    window:
      workflows:
      - w30.c1
  c2:
    name: 'This action: Operate and hand back'
    description: Execute the approved dispatcher request, prove the PLC and both outlets reached the requested flow,
      then take local control through FUXA and restore the normal A20/B20 baseline.
    assigned_participant: participant.operator
    actions:
    - w30.c2
    targets:
    - features.a-engineering.a-hmi
    - features.a-engineering.a-historian
    - features.a-control.a-reservoir
    - features.a-control.a-instruments
    success:
      mode: all_of
      assertions:
      - c2-done
    window:
      workflows:
      - w30.c2
workflows:
  c1:
    description: 'This action: availability follows the evidence/authority alternatives. This independent objective
      may be revisited when facts change; no global sequence or deadline is imposed.'
    start: requirements
    steps:
      requirements:
        type: switch
        cases:
        - when:
            assertions:
            - capabilities.process-interpretation-ready
            - capabilities.control-ready
            - capabilities.mode-ready
            - capabilities.w29-plan-ready
          next: attempt
        default: unavailable
      available:
        type: end
      unavailable:
        type: end
      attempt:
        type: objective
        execution_mode: objective
        objective: w30.c1
        on_success: available
        on_failure: unavailable
  c2:
    description: 'This action: availability follows the evidence/authority alternatives. This independent objective
      may be revisited when facts change; no global sequence or deadline is imposed.'
    start: requirements
    steps:
      requirements:
        type: switch
        cases:
        - when:
            assertions:
            - w30.c1-ready
          next: attempt
        default: unavailable
      available:
        type: end
      unavailable:
        type: end
      attempt:
        type: objective
        execution_mode: objective
        objective: w30.c2
        on_success: available
        on_failure: unavailable
action_contracts:
  c1:
    semantic_version: 1.0.0
    lifecycle_state: draft
    behavioral_granularity: aggregate
    procedure_basis: |-
      This is a bounded operating integration task, not a privilege flaw. The participant must use the installed products to bind the approved asset, automatic-flow target, MQTT delivery rules, fresh request identity, numeric expiry, outcome stages, retry rule, and independent local restoration into one exact request plan without issuing it. A locally invented response, synthetic API, request acknowledgement, or copied practice sequence does not establish the result.

      The required result is: Produce an exact request plan for `CRR-OP-W30-R1`: asset `AST-CRR-017`, automatic total flow 0.30 m³/s, non-retained QoS 1 delivery, a fresh UUID, a 90-second Unix-time expiry, and the separate local FUXA restoration to manual A20/B20. This card prepares the request but does not issue it.
    realization_profile: backend-declared
    fidelity_claim: The exact initial state, versions, formats, validation order, authorization decisions, process
      quantities, denial cases, persistent state, and independently owned evidence are required. Implementation
      choices remain open only when none of those facts change.
    preconditions:
    - precondition_id: eligibility
      precondition_class: authority
      description: Satisfy one complete alternative in the referenced workflow and obtain the required scoped access
        to every listed surface.
      support_refs:
      - workflows.w30.c1
      - features.a-engineering.a-engineering
      - features.a-engineering.a-hmi
    - precondition_id: normal-surface
      precondition_class: target
      description: |-
        The installed Cairn Reach OT products own this part of **Bind the plan to the plant**. The exact initial state is: Operating instruction CRR-OP-W30-R1 binds AST-CRR-017 to the installed arwc.remote-request/v1 dispatcher contract, automatic total flow 0.30 m3/s, a fresh UUID, 90-second Unix-time expiry, non-retained QoS 1 delivery, and a separate local FUXA restoration to manual A20/B20.

        Native bindings:

        - `a-engineering.a-engineering/filesystem:/home/fieldlink/CairnReach/Briefs/W30/release-plan.json`
        - `a-engineering.a-engineering/filesystem:/home/fieldlink/CairnReach/Briefs/W30/operator-brief.md`
        - `a-engineering.a-hmi/filesystem:/usr/share/arwc-ot/remote-request.json`
        - `a-engineering.a-hmi/Mosquitto:arwc/crr/commands/operator`

        The image-owned W30 release plan and operator brief define the approved work, but do not replace the installed dispatcher contract or prove a product request. The published arwc.remote-request/v1 contract and running ProjectRevision remain authoritative.
      support_refs:
      - features.a-engineering.a-engineering
      - features.a-engineering.a-hmi
    - precondition_id: scope-and-persistence
      precondition_class: realization
      description: |-
        The result remains local evidence unless a downstream workflow explicitly names it. This card is read-only and creates no dispatcher or controller state. The prepared plan uses a fresh UUID only when W30.2 is actually executed, so completing W30.1 cannot leave an expired or replayable command behind. Infrastructure recovery and submission adjudication are external to the SDL.

        The behavior is limited to AST-CRR-017 and CRR-OP-W30-R1. It grants no arbitrary MQTT topic, OPC UA write, engineering force, program upload, interlock bypass, automatic retry after uncertainty, or alternate control endpoint.
      support_refs:
      - features.a-engineering.a-engineering
      - features.a-engineering.a-hmi
    effects:
    - effect_id: outcome
      effect_class: intended_effect
      description: 'Produce an exact request plan for `CRR-OP-W30-R1`: asset `AST-CRR-017`, automatic total flow
        0.30 m³/s, non-retained QoS 1 delivery, a fresh UUID, a 90-second Unix-time expiry, and the separate local
        FUXA restoration to manual A20/B20. This card prepares the request but does not issue it.'
      target_refs:
      - features.a-engineering.a-engineering
      - features.a-engineering.a-hmi
      evidence_refs:
      - evidence_requirements.w30.c1
    - effect_id: verified-evidence
      effect_class: evidence_effect
      description: |-
        Completion reads a range-supplied snapshot of the installed dispatcher contract, journal, native PLC decisions, and process history as applicable to the card. The participant cannot supply product evidence. The evaluator cannot issue a broker request, write a controller tag, move an outlet, retry an uncertain request, take local priority, or create product evidence.

        Evidence sources are `features.a-engineering.a-engineering`, `features.a-engineering.a-hmi`. A wrong asset, project revision, request schema, topic, QoS, retain status marker, principal, target, expiry, outcome sequence, retry rule, or restoration path is rejected.
      target_refs:
