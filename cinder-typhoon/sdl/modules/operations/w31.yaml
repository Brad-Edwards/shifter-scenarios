objectives:
  c1:
    name: 'W31.1: The vault''s misleading length'
    description: |-
      Recover the diagnostic vault's actual record-boundary behavior and the protected diagnostic reference associated with the supplied case.

      Establishes useful evidence about the service's input contract.
    agent: participant.operator
    actions:
    - w31.c1
    targets: &id005
    - features.a-engineering.a-diagnostics
    success:
      mode: all_of
      assertions:
      - c1-done
    window:
      workflows:
      - w31.c1
  c2:
    name: 'W31.2: Past the parser''s boundary'
    description: |-
      Combine the observed record behavior into a controlled access beyond the parser's intended boundary.

      Creates a substantive native capability.
    agent: participant.operator
    actions:
    - w31.c2
    targets: &id006
    - features.a-engineering.a-diagnostics
    success:
      mode: all_of
      assertions:
      - c2-done
    window:
      workflows:
      - w31.c2
  c3:
    name: 'W31.3: The state execution returns to'
    description: |-
      Establish controlled influence over the saved execution state under the vault's remaining constraints.

      Advances from data access to a distinct execution primitive.
    agent: participant.operator
    actions:
    - w31.c3
    targets: &id007
    - features.a-engineering.a-diagnostics
    success:
      mode: all_of
      assertions:
      - c3-done
    window:
      workflows:
      - w31.c3
  c4:
    name: 'W31.4: The diagnostic service''s authority'
    description: |-
      Complete the diagnostic-vault compromise and recover the restricted maintenance approval history under the diagnostic service's execution identity.

      Provides a complete local ending for the alternate native branch.
    agent: participant.operator
    actions:
    - w31.c4
    targets: &id008
    - features.a-engineering.a-diagnostics
    success:
      mode: all_of
      assertions:
      - c4-done
    window:
      workflows:
      - w31.c4
workflows:
  c1:
    description: 'W31.1: availability follows the evidence/authority alternatives. This independent objective
      may be revisited when facts change; no campaign-wide sequence or deadline is imposed.'
    start: requirements
    steps:
      requirements:
        type: switch
        cases:
        - when:
            assertions:
            - capabilities.w21-revision-ready
          next: attempt
        default: unavailable
      available:
        type: end
      unavailable:
