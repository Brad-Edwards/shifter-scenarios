realization:
  default: open
evidence_requirements:
  c1:
    description: |-
      Recover the entitlement's actual structure and associated compatibility record. The current package-signing system is outside this task.

      Required technical proof: Completion records the protected record revision, customer, feature, and legacy field grammar for K08.2.
    source_refs:
    - features.k-delivery.k-registry
    scope: Per-participant in-world evidence; no other participant state.
    boundary_kind: assertion_evaluation
    channel: other
    artifact_role: proposition_truth_evidence
    sensitivity: plain
    redaction: redact_secrets
    integrity: checksum
    retention: run_lifetime
    loss_disclosure: required
    observation_demand:
      rule_id: fact-k08-1
      scope: /features
      purpose: experimental
      mode: selected
      selector:
        semantic_scope: /features
        data_kind: artifact
        names:
        - cinder.k08-1.satisfied
        component_refs:
        - features.k-delivery.k-registry
      collection: require
      retention: require
      redaction: redact-secrets
      integrity: checksum
      required: true
      basis: observed
    notes:
    - 'Author checks: Test current/legacy distinction, fair lookup lead, unique record recovery, no direct entitlement
      activation.'
  c2:
    description: |-
      Recover context that reproduces the checker result for the designated entitlement. Merely naming an algorithm or extracting an unused constant is insufficient.

      Required technical proof: The checker accepts the recovered context only when it decrypts/verifies the supplied record and binds it to the expected legacy revision.
    source_refs:
    - features.k-delivery.k-registry
    scope: Per-participant in-world evidence; no other participant state.
    boundary_kind: assertion_evaluation
    channel: other
    artifact_role: proposition_truth_evidence
    sensitivity: plain
    redaction: redact_secrets
    integrity: checksum
    retention: run_lifetime
    loss_disclosure: required
    observation_demand:
      rule_id: fact-k08-2
      scope: /features
      purpose: experimental
      mode: selected
      selector:
        semantic_scope: /features
        data_kind: artifact
        names:
        - cinder.k08-2.satisfied
        component_refs:
        - features.k-delivery.k-registry
      collection: require
      retention: require
      redaction: redact-secrets
      integrity: checksum
      required: true
      basis: observed
    notes:
    - 'Author checks: Verify incomplete context fails, expected context validates one record, wrong revision/key
      ID fails, no other archive object opens.'
  c3:
    description: |-
      Obtain acceptance for a distinct, correctly scoped entitlement. It does not confer customer execution or modern release-signing authority.

      Required technical proof: The service records legacy acceptance, customer/feature binding, and test entitlement state; a text artifact alone does not satisfy the result.
    source_refs:
    - features.k-delivery.k-registry
    scope: Per-participant in-world evidence; no other participant state.
    boundary_kind: assertion_evaluation
    channel: other
    artifact_role: proposition_truth_evidence
    sensitivity: plain
    redaction: redact_secrets
    integrity: checksum
    retention: run_lifetime
    loss_disclosure: required
    observation_demand:
      rule_id: fact-k08-3
      scope: /features
      purpose: experimental
      mode: selected
      selector:
        semantic_scope: /features
        data_kind: artifact
        names:
        - cinder.k08-3.satisfied
        component_refs:
        - features.k-delivery.k-registry
      collection: require
      retention: require
      redaction: redact-secrets
      integrity: checksum
      required: true
      basis: observed
    notes:
    - 'Author checks: Test current checker rejection, intended legacy acceptance, wrong customer/feature rejection,
      expiry handling, no cross-service effect.'
propositions:
  c1:
    description: Recover the entitlement's actual structure and associated compatibility record. The current package-signing
      system is outside this task.
    subjects:
    - features.k-delivery.k-registry
    basis: observed_state
    predicate:
      kind: boolean
      property: cinder.k08-1.satisfied
      semantic_ref: urn:cinder-typhoon:fact:K08.1
      operator: equals
      expected: true
    evidence_requirements:
    - c1
    quantifier: all
  c2:
    description: Recover context that reproduces the checker result for the designated entitlement. Merely naming
      an algorithm or extracting an unused constant is insufficient.
    subjects:
    - features.k-delivery.k-registry
    basis: observed_state
    predicate:
      kind: boolean
      property: cinder.k08-2.satisfied
      semantic_ref: urn:cinder-typhoon:fact:K08.2
      operator: equals
      expected: true
    evidence_requirements:
    - c2
    quantifier: all
  c3:
    description: Obtain acceptance for a distinct, correctly scoped entitlement. It does not confer customer execution
      or modern release-signing authority.
    subjects:
    - features.k-delivery.k-registry
    basis: observed_state
    predicate:
      kind: boolean
      property: cinder.k08-3.satisfied
      semantic_ref: urn:cinder-typhoon:fact:K08.3
      operator: equals
      expected: true
    evidence_requirements:
    - c3
    quantifier: all
assertions:
  c1-ready:
    proposition: c1
    role: precondition
    polarity: positive
  c1-done:
    proposition: c1
    role: postcondition
    polarity: positive
  c2-ready:
    proposition: c2
    role: precondition
    polarity: positive
  c2-done:
    proposition: c2
    role: postcondition
    polarity: positive
  c3-ready:
    proposition: c3
    role: precondition
    polarity: positive
  c3-done:
    proposition: c3
    role: postcondition
    polarity: positive
objectives:
  c1:
    name: 'K08.1: The old entitlement'
    description: |-
      FieldKest still recognizes an old entitlement format. Recover its protected compatibility record and determine what the checker considers an entitlement.

      Introduces a legacy product boundary with a concrete protected record.
    agent: participant.operator
    actions:
    - k08.c1
    targets:
    - features.k-delivery.k-registry
    success:
      mode: all_of
      assertions:
      - c1-done
    window:
      workflows:
      - k08.c1
  c2:
    name: 'K08.2: The missing encryption context'
    description: |-
      Recover the cryptographic context needed to reproduce the legacy entitlement check for the supplied record.

      Builds a substantive cryptographic capability before entitlement abuse.
    agent: participant.operator
    actions:
    - k08.c2
    targets:
    - features.k-delivery.k-registry
    success:
      mode: all_of
      assertions:
      - c2-done
    window:
      workflows:
      - k08.c2
  c3:
    name: 'K08.3: An entitlement of our choosing'
    description: |-
      Create an alternative entitlement the legacy checker accepts while preserving the required customer and feature binding.

      Completes the legacy-license branch with an unauthorized accepted entitlement.
    agent: participant.operator
    actions:
    - k08.c3
    targets:
    - features.k-delivery.k-registry
    success:
      mode: all_of
      assertions:
      - c3-done
    window:
      workflows:
      - k08.c3
workflows:
  c1:
    description: 'K08.1: availability follows the evidence/authority alternatives. This independent objective may
      be revisited when facts change; no campaign-wide sequence or deadline is imposed.'
    start: requirements
    steps:
      requirements:
        type: switch
        cases:
        - when:
            assertions:
            - capabilities.g01-ready
          next: attempt
        default: unavailable
      available:
        type: end
      unavailable:
        type: end
      attempt:
        type: objective
        execution_mode: objective
        objective: k08.c1
        on_success: available
        on_failure: unavailable
  c2:
    description: 'K08.2: availability follows the evidence/authority alternatives. This independent objective may
      be revisited when facts change; no campaign-wide sequence or deadline is imposed.'
    start: requirements
    steps:
      requirements:
        type: switch
        cases:
        - when:
            assertions:
            - k08.c1-ready
          next: attempt
        default: unavailable
      available:
        type: end
      unavailable:
        type: end
      attempt:
        type: objective
        execution_mode: objective
        objective: k08.c2
        on_success: available
        on_failure: unavailable
  c3:
    description: 'K08.3: availability follows the evidence/authority alternatives. This independent objective may
      be revisited when facts change; no campaign-wide sequence or deadline is imposed.'
    start: requirements
    steps:
      requirements:
        type: switch
        cases:
        - when:
            assertions:
            - k08.c2-ready
          next: attempt
        default: unavailable
      available:
        type: end
      unavailable:
        type: end
      attempt:
        type: objective
        execution_mode: objective
        objective: k08.c3
        on_success: available
        on_failure: unavailable
action_contracts:
  c1:
    semantic_version: 1.0.0
    lifecycle_state: draft
    behavioral_granularity: aggregate
    procedure_basis: A compatibility lookup treats a legacy record as public metadata despite its protected feature
      binding. The intended solution recovers the record and models the checker's claimed entitlement fields.
    realization_profile: backend-declared
    fidelity_claim: The exact starting state, service transition, denial cases, participant-state persistence, and
      independently owned evidence are required. Backend choices remain open only where they cannot change those
      facts.
    preconditions:
    - precondition_id: eligibility
      precondition_class: authority
      description: Satisfy one complete alternative in the referenced workflow and obtain the required scoped access
        to every listed surface.
      support_refs:
      - workflows.k08.c1
      - features.k-delivery.k-registry
    - precondition_id: normal-surface
      precondition_class: target
      description: The FieldKest compatibility service exposes current package entitlements and retains a versioned
        legacy-format record for a named customer feature.
      support_refs:
      - features.k-delivery.k-registry
      - content.keplerops-k-registry.k08-1-the-old-entitlement
    - precondition_id: scope-and-persistence
      precondition_class: realization
      description: Input to K08.2 Participant-created service state persists for the life of the participant world
        and ordinary retries do not erase it. The action is limited to the exact records, identities, routes, and
        destination effects declared here; unrelated tenants and services remain denied. Infrastructure recovery
        and submission adjudication are outside this in-world contract.
      support_refs:
      - features.k-delivery.k-registry
      - content.keplerops-k-registry.k08-1-the-old-entitlement
    effects:
    - effect_id: outcome
      effect_class: intended_effect
      description: Recover the entitlement's actual structure and associated compatibility record. The current package-signing
        system is outside this task.
      target_refs:
      - features.k-delivery.k-registry
      evidence_refs:
      - evidence_requirements.k08.c1
    - effect_id: verified-evidence
      effect_class: evidence_effect
      description: Completion records the protected record revision, customer, feature, and legacy field grammar
        for K08.2.
      target_refs:
      - features.k-delivery.k-registry
      evidence_refs:
      - evidence_requirements.k08.c1
    failure_classes:
    - precondition_unsatisfied
    - authority_denied
    - target_unavailable
    - partial_success
    - backend_error
    - unknown
  c2:
    semantic_version: 1.0.0
    lifecycle_state: draft
    behavioral_granularity: aggregate
    procedure_basis: Archive metadata separates encrypted payload from its protected context weakly enough that
      the named record's context can be reconstructed. The intended solution is cryptographic-context recovery and
      validation, not key guessing.
    realization_profile: backend-declared
    fidelity_claim: The exact starting state, service transition, denial cases, participant-state persistence, and
      independently owned evidence are required. Backend choices remain open only where they cannot change those
      facts.
    preconditions:
    - precondition_id: eligibility
      precondition_class: authority
      description: Satisfy one complete alternative in the referenced workflow and obtain the required scoped access
        to every listed surface.
      support_refs:
      - workflows.k08.c2
      - features.k-delivery.k-registry
    - precondition_id: normal-surface
      precondition_class: target
      description: The compatibility record refers to a key identifier, derivation version, and archived encryption-context
        metadata stored in the FieldKest release archive.
      support_refs:
      - features.k-delivery.k-registry
      - content.keplerops-k-registry.k08-2-the-missing-encryption-context
    - precondition_id: scope-and-persistence
      precondition_class: realization
      description: Cryptographic context for K08.3 Participant-created service state persists for the life of the
        participant world and ordinary retries do not erase it. The action is limited to the exact records, identities,
        routes, and destination effects declared here; unrelated tenants and services remain denied. Infrastructure
        recovery and submission adjudication are outside this in-world contract.
      support_refs:
      - features.k-delivery.k-registry
      - content.keplerops-k-registry.k08-2-the-missing-encryption-context
    effects:
    - effect_id: outcome
      effect_class: intended_effect
      description: Recover context that reproduces the checker result for the designated entitlement. Merely naming
        an algorithm or extracting an unused constant is insufficient.
      target_refs:
      - features.k-delivery.k-registry
      evidence_refs:
      - evidence_requirements.k08.c2
    - effect_id: verified-evidence
      effect_class: evidence_effect
      description: The checker accepts the recovered context only when it decrypts/verifies the supplied record
        and binds it to the expected legacy revision.
      target_refs:
      - features.k-delivery.k-registry
      evidence_refs:
      - evidence_requirements.k08.c2
    failure_classes:
    - precondition_unsatisfied
    - authority_denied
    - target_unavailable
    - partial_success
    - backend_error
    - unknown
  c3:
    semantic_version: 1.0.0
    lifecycle_state: draft
    behavioral_granularity: aggregate
    procedure_basis: The legacy derivation omits a field required by the current policy. The intended solution uses
      K08.2's legitimate reconstructed context to craft an alternate but correctly customer/feature-bound entitlement
      accepted by the legacy checker.
    realization_profile: backend-declared
    fidelity_claim: The exact starting state, service transition, denial cases, participant-state persistence, and
      independently owned evidence are required. Backend choices remain open only where they cannot change those
      facts.
    preconditions:
    - precondition_id: eligibility
      precondition_class: authority
      description: Satisfy one complete alternative in the referenced workflow and obtain the required scoped access
        to every listed surface.
      support_refs:
      - workflows.k08.c3
      - features.k-delivery.k-registry
    - precondition_id: normal-surface
      precondition_class: target
      description: The legacy entitlement checker validates a customer, feature, expiry, and compatibility integrity
        field before enabling a test entitlement in the isolated service.
      support_refs:
      - features.k-delivery.k-registry
      - content.keplerops-k-registry.k08-3-an-entitlement-of-our-choosing
    - precondition_id: scope-and-persistence
      precondition_class: realization
      description: No package/customer authority Participant-created service state persists for the life of the
        participant world and ordinary retries do not erase it. The action is limited to the exact records, identities,
        routes, and destination effects declared here; unrelated tenants and services remain denied. Infrastructure
        recovery and submission adjudication are outside this in-world contract.
      support_refs:
      - features.k-delivery.k-registry
      - content.keplerops-k-registry.k08-3-an-entitlement-of-our-choosing
    effects:
    - effect_id: outcome
      effect_class: intended_effect
      description: Obtain acceptance for a distinct, correctly scoped entitlement. It does not confer customer execution
        or modern release-signing authority.
      target_refs:
      - features.k-delivery.k-registry
      evidence_refs:
      - evidence_requirements.k08.c3
    - effect_id: verified-evidence
      effect_class: evidence_effect
      description: The service records legacy acceptance, customer/feature binding, and test entitlement state;
        a text artifact alone does not satisfy the result.
      target_refs:
      - features.k-delivery.k-registry
      evidence_refs:
      - evidence_requirements.k08.c3
    failure_classes:
    - precondition_unsatisfied
    - authority_denied
    - target_unavailable
    - partial_success
    - backend_error
    - unknown
