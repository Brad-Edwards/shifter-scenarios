# In-world draft. Unspecified realization remains open.
name: cinder-k08
version: 0.1.0
semantic_revision: raes-progressive-semantics/v1
module:
  id: cinder-typhoon/k08
  version: 0.1.0
  exports:
    evidence_requirements:
    - c1
    - c2
    - c3
    propositions:
    - c1
    - c2
    - c3
    assertions:
    - c1-ready
    - c1-done
    - c2-ready
    - c2-done
    - c3-ready
    - c3-done
    objectives:
    - c1
    - c2
    - c3
    workflows:
    - c1
    - c2
    - c3
    action_contracts:
    - c1
    - c2
