# In-world draft. Unspecified realization remains open.
name: cinder-k19
version: 0.1.0
semantic_revision: raes-progressive-semantics/v1
module:
  id: cinder-typhoon/k19
  version: 0.1.0
  exports:
    evidence_requirements:
    - c1
    - c2
    - c3
    propositions:
    - c1
    - c2
    - c3
    assertions:
    - c1-ready
    - c1-done
    - c2-ready
    - c2-done
    - c3-ready
    - c3-done
    objectives:
    - c1
    - c2
    - c3
    workflows:
    - c1
    - c2
    - c3
    action_contracts:
    - c1
    - c2
    - c3
realization:
  default: open
evidence_requirements:
  c1:
    description: |-
      Recover the protected trust and enrollment evidence with its staff binding. Public product documentation alone is insufficient.

      Required technical proof: Completion is observed by the owning service from the fresh result and its immutable audit correlation. The evidence binds the participant, accepted identity or job, exact input and output identifiers, relevant revision or digest, and destination-side observation where a second service consumes the result. Objective evaluation does not create the result or grant authority.
    source_refs:
    - features.k-corporate.k-cert
    - features.k-corporate.k-staff
    scope: Per-participant in-world evidence; no other participant state.
    boundary_kind: assertion_evaluation
    channel: other
    artifact_role: proposition_truth_evidence
    sensitivity: plain
    redaction: redact_secrets
    integrity: checksum
    retention: run_lifetime
    loss_disclosure: required
    observation_demand:
      rule_id: fact-k19-1
      scope: /features
      purpose: experimental
      mode: selected
      selector:
        semantic_scope: /features
        data_kind: artifact
        names:
        - cinder.k19-1.satisfied
        component_refs:
        - features.k-corporate.k-cert
        - features.k-corporate.k-staff
      collection: require
      retention: require
      redaction: redact-secrets
      integrity: checksum
      required: true
      basis: observed
    notes:
    - 'Author checks: Verify the normal baseline, the exact intended path, and the fresh evidence described above.
      Reject a wrong identifier, revision, digest, tenant, identity, stale result, or cross-participant reference.
      Verify unrelated records and permissions remain unchanged and that the result remains recognizable and usable
      by every declared downstream consumer.'
  c2:
    description: |-
      Demonstrate the colleague's authority on the protected handover. Recovering a certificate file without usable identity does not count.

      Required technical proof: Completion is observed by the owning service from the fresh result and its immutable audit correlation. The evidence binds the participant, accepted identity or job, exact input and output identifiers, relevant revision or digest, and destination-side observation where a second service consumes the result. Objective evaluation does not create the result or grant authority.
    source_refs:
    - features.k-corporate.k-cert
    - features.k-corporate.k-staff
    scope: Per-participant in-world evidence; no other participant state.
    boundary_kind: assertion_evaluation
    channel: other
    artifact_role: proposition_truth_evidence
    sensitivity: plain
    redaction: redact_secrets
    integrity: checksum
    retention: run_lifetime
    loss_disclosure: required
    observation_demand:
      rule_id: fact-k19-2
      scope: /features
      purpose: experimental
      mode: selected
      selector:
        semantic_scope: /features
        data_kind: artifact
        names:
        - cinder.k19-2.satisfied
        component_refs:
        - features.k-corporate.k-cert
        - features.k-corporate.k-staff
      collection: require
      retention: require
      redaction: redact-secrets
      integrity: checksum
      required: true
      basis: observed
    notes:
    - 'Author checks: Verify the normal baseline, the exact intended path, and the fresh evidence described above.
      Reject a wrong identifier, revision, digest, tenant, identity, stale result, or cross-participant reference.
      Verify unrelated records and permissions remain unchanged and that the result remains recognizable and usable
      by every declared downstream consumer.'
  c3:
    description: |-
      Demonstrate the delegated context against the protected administration probe. This is the input to K20, not release-administrator authority.

      Required technical proof: Completion is observed by the owning service from the fresh result and its immutable audit correlation. The evidence binds the participant, accepted identity or job, exact input and output identifiers, relevant revision or digest, and destination-side observation where a second service consumes the result. Objective evaluation does not create the result or grant authority.
    source_refs:
    - features.k-corporate.k-staff
    - features.k-corporate.k-identity--delegation
    scope: Per-participant in-world evidence; no other participant state.
    boundary_kind: assertion_evaluation
    channel: other
    artifact_role: proposition_truth_evidence
    sensitivity: plain
    redaction: redact_secrets
    integrity: checksum
    retention: run_lifetime
    loss_disclosure: required
    observation_demand:
      rule_id: fact-k19-3
      scope: /features
      purpose: experimental
      mode: selected
      selector:
        semantic_scope: /features
        data_kind: artifact
        names:
        - cinder.k19-3.satisfied
        component_refs:
        - features.k-corporate.k-staff
        - features.k-corporate.k-identity--delegation
      collection: require
      retention: require
      redaction: redact-secrets
      integrity: checksum
      required: true
      basis: observed
    notes:
    - 'Author checks: Verify the normal baseline, the exact intended path, and the fresh evidence described above.
      Reject a wrong identifier, revision, digest, tenant, identity, stale result, or cross-participant reference.
      Verify unrelated records and permissions remain unchanged and that the result remains recognizable and usable
      by every declared downstream consumer.'
propositions:
  c1:
    description: Recover the protected trust and enrollment evidence with its staff binding. Public product documentation
      alone is insufficient.
    subjects:
    - features.k-corporate.k-cert
    - features.k-corporate.k-staff
    basis: observed_state
    predicate:
      kind: boolean
      property: cinder.k19-1.satisfied
      semantic_ref: urn:cinder-typhoon:fact:K19.1
      operator: equals
      expected: true
    evidence_requirements:
    - c1
    quantifier: all
  c2:
    description: Demonstrate the colleague's authority on the protected handover. Recovering a certificate file
      without usable identity does not count.
    subjects:
    - features.k-corporate.k-cert
    - features.k-corporate.k-staff
    basis: observed_state
    predicate:
      kind: boolean
      property: cinder.k19-2.satisfied
      semantic_ref: urn:cinder-typhoon:fact:K19.2
      operator: equals
      expected: true
    evidence_requirements:
    - c2
    quantifier: all
  c3:
    description: Demonstrate the delegated context against the protected administration probe. This is the input
      to K20, not release-administrator authority.
    subjects:
    - features.k-corporate.k-staff
    - features.k-corporate.k-identity--delegation
    basis: observed_state
    predicate:
      kind: boolean
      property: cinder.k19-3.satisfied
      semantic_ref: urn:cinder-typhoon:fact:K19.3
      operator: equals
      expected: true
    evidence_requirements:
    - c3
    quantifier: all
assertions:
  c1-ready:
    proposition: c1
    role: precondition
    polarity: positive
  c1-done:
    proposition: c1
    role: postcondition
    polarity: positive
  c2-ready:
    proposition: c2
    role: precondition
    polarity: positive
  c2-done:
    proposition: c2
    role: postcondition
    polarity: positive
  c3-ready:
    proposition: c3
    role: precondition
    polarity: positive
  c3-done:
    proposition: c3
    role: postcondition
    polarity: positive
objectives:
  c1:
    name: 'K19.1: Who vouches for whom'
    description: |-
      Recover the staff certificate relationship and the enrollment record relevant to the archive handover.

      Makes the organization's identity trust legible through actual records.
    agent: participant.operator
    actions:
    - k19.c1
    targets:
    - features.k-corporate.k-cert
    - features.k-corporate.k-staff
    success:
      mode: all_of
      assertions:
      - c1-done
    window:
      workflows:
      - k19.c1
  c2:
    name: 'K19.2: Borrowed colleague'
    description: |-
      Establish a usable colleague identity across the staff certificate boundary and retrieve the colleague's protected archive handover.

      Gives a substantive identity-compromise result.
    agent: participant.operator
    actions:
    - k19.c2
    targets:
    - features.k-corporate.k-cert
    - features.k-corporate.k-staff
    success:
      mode: all_of
      assertions:
      - c2-done
    window:
      workflows:
      - k19.c2
  c3:
    name: 'K19.3: The archive delegates'
    description: |-
      Use the colleague's archive workflow to establish the delegated authentication context needed by supplier administration.

      Connects the colleague identity to a second trust boundary.
    agent: participant.operator
    actions:
    - k19.c3
    targets:
    - features.k-corporate.k-staff
    - features.k-corporate.k-identity--delegation
    success:
      mode: all_of
      assertions:
      - c3-done
    window:
      workflows:
      - k19.c3
workflows:
  c1:
    description: 'K19.1: availability follows the evidence/authority alternatives. This independent objective may
      be revisited when facts change; no campaign-wide sequence or deadline is imposed.'
    start: requirements
    steps:
      requirements:
        type: switch
        cases:
        - when:
            assertions:
            - capabilities.b01-ready
          next: attempt
        - when:
            assertions:
            - k09.c4-ready
          next: attempt
        default: unavailable
      available:
        type: end
      unavailable:
        type: end
      attempt:
        type: objective
        execution_mode: objective
        objective: k19.c1
        on_success: available
        on_failure: unavailable
  c2:
    description: 'K19.2: availability follows the evidence/authority alternatives. This independent objective may
      be revisited when facts change; no campaign-wide sequence or deadline is imposed.'
    start: requirements
    steps:
      requirements:
        type: switch
        cases:
        - when:
            assertions:
            - k19.c1-ready
          next: attempt
        default: unavailable
      available:
        type: end
      unavailable:
        type: end
      attempt:
        type: objective
        execution_mode: objective
        objective: k19.c2
        on_success: available
        on_failure: unavailable
  c3:
    description: 'K19.3: availability follows the evidence/authority alternatives. This independent objective may
      be revisited when facts change; no campaign-wide sequence or deadline is imposed.'
    start: requirements
    steps:
      requirements:
        type: switch
        cases:
        - when:
            assertions:
            - k19.c2-ready
          next: attempt
        default: unavailable
      available:
        type: end
      unavailable:
        type: end
      attempt:
        type: objective
        execution_mode: objective
        objective: k19.c3
        on_success: available
        on_failure: unavailable
action_contracts:
  c1:
    semantic_version: 1.0.0
    lifecycle_state: draft
    behavioral_granularity: aggregate
    procedure_basis: 'The intended path is limited to the authored software, data, configuration, identity, permission,
      or state described above. The participant must exercise that real condition through the declared service interface
      and produce this result: Protected template/trust read. Merely describing the condition, editing a local copy,
      or presenting a value obtained from another surface does not satisfy the contract.'
    realization_profile: backend-declared
    fidelity_claim: The exact starting state, service transition, denial cases, participant-state persistence, and
      independently owned evidence are required. Backend choices remain open only where they cannot change those
      facts.
    preconditions:
    - precondition_id: eligibility
      precondition_class: authority
      description: Satisfy one complete alternative in the referenced workflow and obtain the required scoped access
        to every listed surface.
      support_refs:
      - workflows.c1
      - features.k-corporate.k-cert
      - features.k-corporate.k-staff
    - precondition_id: normal-surface
      precondition_class: target
      description: '`k-cert` owns this part of the operation. Its starting state is exact: Enrollment service record
        and StaffArchiveUser template: client-auth EKU, enrollee-supplied subject, support/runner enrollment grant.
        The owning service uses the listener, route, identity, authorization, storage, and audit contract declared
        in the corresponding world module. Records that are not explicitly mutable remain immutable. The private
        service-loader contract `content.keplerops-k-cert.k19-1-who-vouches-for-whom` freezes the request, denial,
        state-transition, evidence, and any exploit-critical implementation details.'
      support_refs:
      - features.k-corporate.k-cert
      - features.k-corporate.k-staff
      - content.keplerops-k-cert.k19-1-who-vouches-for-whom
    - precondition_id: scope-and-persistence
      precondition_class: realization
      description: Input to K19.2. Participant-created service state persists for the life of the participant world
        and ordinary retries do not erase it. The selected route cannot act on unrelated tenants, records, packages,
        identities, jobs, or services. Infrastructure recovery and submission adjudication are outside this in-world
        contract.
      support_refs:
      - features.k-corporate.k-cert
      - features.k-corporate.k-staff
    effects:
    - effect_id: outcome
      effect_class: intended_effect
      description: Recover the protected trust and enrollment evidence with its staff binding. Public product documentation
        alone is insufficient.
      target_refs:
      - features.k-corporate.k-cert
      - features.k-corporate.k-staff
      evidence_refs:
      - evidence_requirements.k19.c1
    failure_classes:
    - precondition_unsatisfied
    - authority_denied
    - target_unavailable
    - partial_success
    - backend_error
    - unknown
  c2:
    semantic_version: 1.0.0
    lifecycle_state: draft
    behavioral_granularity: aggregate
    procedure_basis: 'The intended path is limited to the authored software, data, configuration, identity, permission,
      or state described above. The participant must exercise that real condition through the declared service interface
      and produce this result: Issued client certificate/private key and successful mTLS handover read as Evan.
