# In-world draft. Unspecified realization remains open.
name: cinder-k19
version: 0.1.0
semantic_revision: raes-progressive-semantics/v1
module:
  id: cinder-typhoon/k19
  version: 0.1.0
  exports:
    evidence_requirements:
    - c1
    - c2
    - c3
    propositions:
    - c1
    - c2
    - c3
    assertions:
    - c1-ready
    - c1-done
    - c2-ready
    - c2-done
    - c3-ready
    - c3-done
    objectives:
    - c1
    - c2
    - c3
    workflows:
    - c1
    - c2
    - c3
    action_contracts:
    - c1
    - c2
    - c3
    relationships:
    - c1-surface-1
    - c2-surface-1
    - c3-surface-1
    content:
    - c1-records-1
    - c2-records-1
    - c3-records-1
realization:
  default: open
evidence_requirements:
  c1:
    description: Recover the protected trust and enrollment evidence with its staff binding. Public product
      documentation alone is insufficient.
    source_refs: &id001
    - features.k-corporate.k-cert
    scope: Per-participant in-world evidence; no other participant state.
    boundary_kind: assertion_evaluation
    channel: other
    artifact_role: proposition_truth_evidence
    sensitivity: plain
    redaction: redact_secrets
    integrity: checksum
    retention: run_lifetime
    loss_disclosure: required
    observation_demand:
      rule_id: fact-k19-1
      scope: /features
      purpose: experimental
      mode: selected
      selector:
        semantic_scope: /features
        data_kind: artifact
        names:
        - cinder.k19-1.satisfied
        component_refs:
        - features.k-corporate.k-cert
      collection: require
      retention: require
      redaction: redact-secrets
      integrity: checksum
      required: true
      basis: observed
  c2:
    description: Demonstrate the colleague's authority on the protected handover. Recovering a certificate
      file without usable identity does not count.
    source_refs: &id002
    - features.k-corporate.k-cert
    scope: Per-participant in-world evidence; no other participant state.
    boundary_kind: assertion_evaluation
    channel: other
    artifact_role: proposition_truth_evidence
    sensitivity: plain
    redaction: redact_secrets
    integrity: checksum
    retention: run_lifetime
    loss_disclosure: required
    observation_demand:
      rule_id: fact-k19-2
      scope: /features
      purpose: experimental
      mode: selected
      selector:
        semantic_scope: /features
        data_kind: artifact
        names:
        - cinder.k19-2.satisfied
        component_refs:
        - features.k-corporate.k-cert
      collection: require
      retention: require
      redaction: redact-secrets
      integrity: checksum
      required: true
      basis: observed
  c3:
    description: Demonstrate the delegated context against the protected administration probe. This is
      the input to K20, not release-administrator authority.
    source_refs: &id003
    - features.k-corporate.k-staff
    scope: Per-participant in-world evidence; no other participant state.
    boundary_kind: assertion_evaluation
    channel: other
    artifact_role: proposition_truth_evidence
    sensitivity: plain
    redaction: redact_secrets
    integrity: checksum
    retention: run_lifetime
    loss_disclosure: required
    observation_demand:
      rule_id: fact-k19-3
      scope: /features
      purpose: experimental
      mode: selected
      selector:
        semantic_scope: /features
        data_kind: artifact
        names:
        - cinder.k19-3.satisfied
        component_refs:
        - features.k-corporate.k-staff
      collection: require
      retention: require
      redaction: redact-secrets
      integrity: checksum
      required: true
      basis: observed
propositions:
  c1:
    description: Recover the protected trust and enrollment evidence with its staff binding. Public product
      documentation alone is insufficient.
    subjects: *id001
    basis: observed_state
    predicate:
      kind: boolean
      property: cinder.k19-1.satisfied
      semantic_ref: urn:cinder-typhoon:fact:K19.1
      operator: equals
      expected: true
    evidence_requirements:
    - c1
    quantifier: all
  c2:
    description: Demonstrate the colleague's authority on the protected handover. Recovering a certificate
      file without usable identity does not count.
    subjects: *id002
    basis: observed_state
    predicate:
      kind: boolean
      property: cinder.k19-2.satisfied
      semantic_ref: urn:cinder-typhoon:fact:K19.2
      operator: equals
      expected: true
    evidence_requirements:
    - c2
    quantifier: all
  c3:
    description: Demonstrate the delegated context against the protected administration probe. This is
      the input to K20, not release-administrator authority.
    subjects: *id003
    basis: observed_state
    predicate:
      kind: boolean
      property: cinder.k19-3.satisfied
      semantic_ref: urn:cinder-typhoon:fact:K19.3
      operator: equals
      expected: true
    evidence_requirements:
    - c3
    quantifier: all
assertions:
  c1-ready:
    proposition: c1
    role: precondition
    polarity: positive
  c1-done:
    proposition: c1
    role: postcondition
    polarity: positive
  c2-ready:
    proposition: c2
    role: precondition
    polarity: positive
  c2-done:
    proposition: c2
    role: postcondition
    polarity: positive
  c3-ready:
    proposition: c3
    role: precondition
    polarity: positive
  c3-done:
    proposition: c3
    role: postcondition
    polarity: positive
objectives:
  c1:
    name: 'K19.1: Who vouches for whom'
    description: |-
      Recover the staff certificate relationship and the enrollment record relevant to the archive handover.

      Makes the organization's identity trust legible through actual records.
    agent: participant.operator
    actions:
    - k19.c1
    targets: &id004
    - features.k-corporate.k-cert
    success:
      mode: all_of
      assertions:
      - c1-done
    window:
      workflows:
      - k19.c1
  c2:
    name: 'K19.2: Borrowed colleague'
    description: |-
      Establish a usable colleague identity across the staff certificate boundary and retrieve the colleague's protected archive handover.

      Gives a substantive identity-compromise result.
    agent: participant.operator
    actions:
    - k19.c2
    targets: &id005
    - features.k-corporate.k-cert
    success:
      mode: all_of
      assertions:
      - c2-done
    window:
      workflows:
      - k19.c2
  c3:
    name: 'K19.3: The archive delegates'
    description: |-
      Use the colleague's archive workflow to establish the delegated authentication context needed by supplier administration.

      Connects the colleague identity to a second trust boundary.
    agent: participant.operator
    actions:
    - k19.c3
    targets: &id006
    - features.k-corporate.k-staff
    success:
      mode: all_of
      assertions:
      - c3-done
    window:
      workflows:
      - k19.c3
workflows:
  c1:
    description: 'K19.1: availability follows the evidence/authority alternatives. This independent objective
      may be revisited when facts change; no campaign-wide sequence or deadline is imposed.'
    start: requirements
    steps:
      requirements:
        type: switch
        cases:
        - when:
            assertions:
            - capabilities.b01-ready
          next: attempt
        - when:
            assertions:
            - k09.c4-ready
          next: attempt
        default: unavailable
      available:
        type: end
      unavailable:
        type: end
      attempt:
        type: objective
        execution_mode: objective
        objective: k19.c1
        on_success: available
        on_failure: unavailable
  c2:
    description: 'K19.2: availability follows the evidence/authority alternatives. This independent objective
      may be revisited when facts change; no campaign-wide sequence or deadline is imposed.'
    start: requirements
    steps:
      requirements:
        type: switch
        cases:
        - when:
            assertions:
            - k19.c1-ready
          next: attempt
        default: unavailable
      available:
        type: end
      unavailable:
        type: end
      attempt:
        type: objective
        execution_mode: objective
        objective: k19.c2
        on_success: available
        on_failure: unavailable
  c3:
    description: 'K19.3: availability follows the evidence/authority alternatives. This independent objective
      may be revisited when facts change; no campaign-wide sequence or deadline is imposed.'
    start: requirements
    steps:
      requirements:
        type: switch
        cases:
        - when:
            assertions:
            - k19.c2-ready
          next: attempt
        default: unavailable
      available:
        type: end
      unavailable:
        type: end
      attempt:
        type: objective
        execution_mode: objective
        objective: k19.c3
        on_success: available
        on_failure: unavailable
