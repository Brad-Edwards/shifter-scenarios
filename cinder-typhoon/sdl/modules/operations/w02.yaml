assertions:
  c1-ready:
    proposition: c1
    role: precondition
    polarity: positive
  c1-done:
    proposition: c1
    role: postcondition
    polarity: positive
  c2-ready:
    proposition: c2
    role: precondition
    polarity: positive
  c2-done:
    proposition: c2
    role: postcondition
    polarity: positive
  c3-ready:
    proposition: c3
    role: precondition
    polarity: positive
  c3-done:
    proposition: c3
    role: postcondition
    polarity: positive
objectives:
  c1:
    name: 'W02.1: The asset and the contractor'
    description: |-
      Recover the retained asset-and-contractor bundle for the upcoming outlet inspection.

      Supplies the names and records behind a real maintenance task.
    agent: participant.operator
    actions:
    - w02.c1
    targets: &id004
    - features.a-corporate.a-business
    success:
      mode: all_of
      assertions:
      - c1-done
    window:
      workflows:
      - w02.c1
  c2:
    name: 'W02.2: Three names for one job'
    description: |-
      Reconcile the contractor, asset, and inspection identifiers so the maintenance record can be tied to the correct physical assignment.

      Turns inconsistent business data into useful operational evidence.
    agent: participant.operator
    actions:
    - w02.c2
    targets: &id005
    - features.a-corporate.a-business
    success:
      mode: all_of
      assertions:
      - c2-done
    window:
      workflows:
      - w02.c2
  c3:
    name: 'W02.3: The record behind the wrong association'
    description: |-
      Use the maintenance service to recover the protected record outside your ordinary assignment, bound to the asset you identified.

      Adds an actual data-access boundary after the reconciliation.
    agent: participant.operator
    actions:
    - w02.c3
    targets: &id006
    - features.a-corporate.a-business
    success:
      mode: all_of
      assertions:
      - c3-done
    window:
      workflows:
      - w02.c3
workflows:
  c1:
    description: 'W02.1: availability follows the evidence/authority alternatives. This independent objective
      may be revisited when facts change; no campaign-wide sequence or deadline is imposed.'
    start: requirements
    steps:
      requirements:
        type: switch
        cases:
        - when:
            assertions:
            - capabilities.corporate-ready
          next: attempt
        default: unavailable
      available:
        type: end
      unavailable:
        type: end
      attempt:
        type: objective
        execution_mode: objective
        objective: w02.c1
        on_success: available
        on_failure: unavailable
  c2:
    description: 'W02.2: availability follows the evidence/authority alternatives. This independent objective
      may be revisited when facts change; no campaign-wide sequence or deadline is imposed.'
    start: requirements
    steps:
      requirements:
        type: switch
        cases:
        - when:
            assertions:
            - w02.c1-ready
          next: attempt
        default: unavailable
      available:
        type: end
      unavailable:
        type: end
      attempt:
        type: objective
        execution_mode: objective
        objective: w02.c2
        on_success: available
        on_failure: unavailable
  c3:
    description: 'W02.3: availability follows the evidence/authority alternatives. This independent objective
      may be revisited when facts change; no campaign-wide sequence or deadline is imposed.'
    start: requirements
    steps:
      requirements:
        type: switch
        cases:
        - when:
            assertions:
            - w02.c2-ready
          next: attempt
        default: unavailable
      available:
        type: end
      unavailable:
        type: end
      attempt:
        type: objective
        execution_mode: objective
