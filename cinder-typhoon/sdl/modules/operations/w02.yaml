objectives:
  c1:
    name: 'This action: The asset and the contractor'
    description: |-
      Recover the retained asset-and-contractor bundle for the upcoming outlet inspection.

      Supplies the names and records behind a real maintenance task.
    assigned_participant: participant.operator
    actions:
    - w02.c1
    targets:
    - features.a-corporate.a-business
    success:
      mode: all_of
      assertions:
      - c1-done
    window:
      workflows:
      - w02.c1
  c2:
    name: 'This action: Three names for one job'
    description: |-
      Reconcile the contractor, asset, and inspection identifiers so the maintenance record can be tied to the correct physical assignment.

      Turns inconsistent business data into useful operational evidence.
    assigned_participant: participant.operator
    actions:
    - w02.c2
    targets:
    - features.a-corporate.a-business
    success:
      mode: all_of
      assertions:
      - c2-done
    window:
      workflows:
      - w02.c2
  c3:
    name: 'This action: The record behind the wrong association'
    description: |-
      Use the maintenance service to recover the protected record outside your ordinary assignment, bound to the asset you identified.

      Adds an actual data-access boundary after the reconciliation.
    assigned_participant: participant.operator
    actions:
    - w02.c3
    targets:
    - features.a-corporate.a-business
    success:
      mode: all_of
      assertions:
      - c3-done
    window:
      workflows:
      - w02.c3
workflows:
  c1:
    description: 'This action: availability follows the evidence/authority alternatives. This independent objective
      may be revisited when facts change; no global sequence or deadline is imposed.'
    start: requirements
    steps:
      requirements:
        type: switch
        cases:
        - when:
            assertions:
            - capabilities.corporate-ready
          next: attempt
        default: unavailable
      available:
        type: end
      unavailable:
        type: end
      attempt:
        type: objective
        execution_mode: objective
        objective: w02.c1
        on_success: available
        on_failure: unavailable
  c2:
    description: 'This action: availability follows the evidence/authority alternatives. This independent objective
