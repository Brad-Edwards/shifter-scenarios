propositions:
  c1:
    description: Recover the bundle as one disclosure, including its inspection binding. Individual identifiers
      inside it are not separate work item.
    subjects:
    - features.a-corporate.a-business
    basis: observed_state
    predicate:
      kind: boolean
      property: cinder.w02-1.satisfied
      semantic_ref: urn:cinder-typhoon:fact:W02.1
      operator: equals
      expected: true
    evidence_requirements:
    - c1
    quantifier: all
  c2:
    description: Produce the correct cross-record association with its source records. Matching display names alone
      is insufficient.
    subjects:
    - features.a-corporate.a-business
    basis: observed_state
    predicate:
      kind: boolean
      property: cinder.w02-2.satisfied
      semantic_ref: urn:cinder-typhoon:fact:W02.2
      operator: equals
      expected: true
    evidence_requirements:
    - c2
    quantifier: all
  c3:
    description: Recover the protected maintenance record through the association boundary. The identifier mapping
      alone does not establish the result.
    subjects:
    - features.a-corporate.a-business
    basis: observed_state
    predicate:
      kind: boolean
      property: cinder.w02-3.satisfied
      semantic_ref: urn:cinder-typhoon:fact:W02.3
      operator: equals
      expected: true
    evidence_requirements:
    - c3
    quantifier: all
