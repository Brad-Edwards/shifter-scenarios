propositions:
  c1:
    description: Recover the bundle as one disclosure, including its inspection binding. Individual identifiers
      inside it are not separate challenges.
    subjects: *id001
    basis: observed_state
    predicate:
      kind: boolean
      property: cinder.w02-1.satisfied
      semantic_ref: urn:cinder-typhoon:fact:W02.1
      operator: equals
      expected: true
