propositions:
  c1:
    description: Recover the actual example and job note from its exposed artifact surface. Merely finding the feature
      name is insufficient.
    subjects:
    - features.k-cloud.k-assistant
    basis: observed_state
    predicate:
      kind: boolean
      property: cinder.k24-1.satisfied
      semantic_ref: urn:cinder-typhoon:fact:K24.1
      operator: equals
      expected: true
    evidence_requirements:
    - c1
    quantifier: all
  c2:
    description: Recover and demonstrate the completion credential's actual scope. Public sample keys or generated
      guesses do not count.
    subjects:
    - features.k-cloud.k-assistant
