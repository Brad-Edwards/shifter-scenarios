    role: postcondition
    polarity: positive
objectives:
  c1:
    name: 'K24.1: Complete the job'
    description: |-
      Recover the retained completion-job example and the private job note that explains its intended support use.

      Gives the completion feature a legitimate development purpose.
    agent: participant.operator
    actions:
    - k24.c1
    targets:
    - features.k-cloud.k-assistant
    success:
      mode: all_of
      assertions:
      - c1-done
    window:
      workflows:
      - k24.c1
  c2:
    name: 'K24.2: Context with a credential'
    description: |-
      Obtain the scoped completion credential from context outside the feature's intended selection.

      Establishes a limited application capability through context access.
    agent: participant.operator
    actions:
    - k24.c2
    targets:
    - features.k-cloud.k-assistant
    success:
      mode: all_of
      assertions:
      - c2-done
    window:
      workflows:
      - k24.c2
  c3:
    name: 'K24.3: The completion runs'
    description: |-
      Make the completion application retrieve the internal support-job handover under the job's execution identity, although the ordinary completion response cannot disclose that document.

      Completes an insecure-AI episode with actual application execution.
    agent: participant.operator
    actions:
    - k24.c3
    targets:
    - features.k-cloud.k-assistant
    success:
      mode: all_of
      assertions:
      - c3-done
    window:
      workflows:
      - k24.c3
workflows:
  c1:
    description: 'K24.1: availability follows the evidence/authority alternatives. This independent objective may
      be revisited when facts change; no campaign-wide sequence or deadline is imposed.'
    start: requirements
    steps:
      requirements:
        type: switch
        cases:
        - when:
            assertions:
            - k21.c1-ready
          next: attempt
        default: unavailable
      available:
        type: end
      unavailable:
        type: end
      attempt:
        type: objective
        execution_mode: objective
        objective: k24.c1
        on_success: available
        on_failure: unavailable
  c2:
    description: 'K24.2: availability follows the evidence/authority alternatives. This independent objective may
      be revisited when facts change; no campaign-wide sequence or deadline is imposed.'
    start: requirements
