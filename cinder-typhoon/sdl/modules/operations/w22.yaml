objectives:
  c1:
    name: 'This action: The viewer in the delivery'
    description: |-
      Recover the usable protected viewer from the retained engineering delivery and bind it to the sealed project.

      Opens an optional engineering-analysis branch.
    agent: participant.operator
    actions:
    - w22.c1
    targets:
    - features.a-engineering.a-engineering
    success:
      mode: all_of
      assertions:
      - c1-done
    window:
      workflows:
      - w22.c1
  c2:
    name: 'This action: The machine inside the viewer'
    description: |-
      Reconstruct the viewer's embedded instruction behavior and reproduce the designated program fragments.

      Builds a substantive model of the viewer's internal machine.
    agent: participant.operator
    actions:
    - w22.c2
    targets:
    - features.a-engineering.a-engineering
    success:
      mode: all_of
      assertions:
      - c2-done
    window:
      workflows:
      - w22.c2
  c3:
    name: 'This action: The decision inside the sealed project'
    description: |-
      Open the sealed engineering project and recover the commissioning decision omitted from the business report. Establish which project revision the decision concerns.

      Completes the protected-project investigation with the engineering finding that explains the missing warning in the business report.
    agent: participant.operator
    actions:
    - w22.c3
    targets:
    - features.a-engineering.a-engineering
    success:
      mode: all_of
      assertions:
      - c3-done
    window:
      workflows:
      - w22.c3
  c4:
    name: 'This action: The reviewer who was never listed'
    description: |-
      The opened project includes a commissioning review helper whose recorded archive access does not match its apparent behavior or the listed reviewers. Recover the concealed review identity and use its access in the retained review context to obtain the withheld commissioning comparison.

      Gives Cinder a usable route into the retained review archive and the comparison that the official handover omitted. The project decision is already earned in W22.3; this task exposes who could read beyond that handover.
    agent: participant.operator
    actions:
    - w22.c4
    targets:
    - features.a-engineering.a-engineering
    success:
      mode: all_of
      assertions:
      - c4-done
    window:
      workflows:
      - w22.c4
