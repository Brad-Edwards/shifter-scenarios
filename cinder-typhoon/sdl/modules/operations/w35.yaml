evidence_requirements:
  c1:
    description: Recover the actual catalog and reference. It is separate from W09's allocation ledger
      and W29's current settlement tariff.
    source_refs: &id001
    - features.a-corporate.a-business
    scope: Per-participant in-world evidence; no other participant state.
    boundary_kind: assertion_evaluation
    channel: other
    artifact_role: proposition_truth_evidence
    sensitivity: plain
    redaction: redact_secrets
    integrity: checksum
    retention: run_lifetime
    loss_disclosure: required
    observation_demand:
      rule_id: fact-w35-1
      scope: /features
      purpose: experimental
      mode: selected
      selector:
        semantic_scope: /features
        data_kind: artifact
        names:
        - cinder.w35-1.satisfied
        component_refs:
        - features.a-corporate.a-business
      collection: require
      retention: require
      redaction: redact-secrets
      integrity: checksum
      required: true
      basis: observed
  c2:
    description: Recover the actual quote with its district and purchasing binding. Public list prices
      alone do not satisfy the objective.
    source_refs: &id002
    - features.a-corporate.a-business
    scope: Per-participant in-world evidence; no other participant state.
    boundary_kind: assertion_evaluation
    channel: other
    artifact_role: proposition_truth_evidence
    sensitivity: plain
    redaction: redact_secrets
    integrity: checksum
    retention: run_lifetime
    loss_disclosure: required
    observation_demand:
