objectives:
  c1:
    name: 'This action: What replacement water costs'
    description: |-
      Recover ARWC's exposed replacement-supply price catalog and the district procurement reference it includes.

      Introduces a corporate financial objective tied to the water story.
    agent: participant.operator
    actions:
    - w35.c1
    targets:
    - features.a-corporate.a-business
    success:
      mode: all_of
      assertions:
      - c1-done
    window:
      workflows:
      - w35.c1
  c2:
    name: 'This action: A quote outside your district'
    description: |-
      Recover the restricted district quote that your corporate context is not authorized to view.

      Adds a concrete procurement-data boundary.
    agent: participant.operator
    actions:
    - w35.c2
    targets:
    - features.a-corporate.a-business
    success:
      mode: all_of
      assertions:
      - c2-done
    window:
      workflows:
      - w35.c2
  c3:
    name: 'This action: The wrong bill'
    description: |-
      Make the replacement-supply workflow issue the recovered quote's order against the wrong district budget while retaining the quoted supplier, amount, and delivery period.

      Provides a complete local financial ending for a operator who stays in corporate ARWC.
    agent: participant.operator
    actions:
    - w35.c3
    targets:
    - features.a-corporate.a-business
    success:
      mode: all_of
      assertions:
      - c3-done
    window:
      workflows:
      - w35.c3
