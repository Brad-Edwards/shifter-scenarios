objectives:
  c1:
    name: 'W35.1: What replacement water costs'
    description: |-
      Recover ARWC's exposed replacement-supply price catalog and the district procurement reference it includes.

      Introduces a corporate financial objective tied to the water story.
    agent: participant.operator
    actions:
    - w35.c1
    targets: &id004
    - features.a-corporate.a-business
    success:
      mode: all_of
      assertions:
      - c1-done
    window:
      workflows:
      - w35.c1
  c2:
    name: 'W35.2: A quote outside your district'
    description: |-
      Recover the restricted district quote that your corporate context is not authorized to view.

      Adds a concrete procurement-data boundary.
    agent: participant.operator
    actions:
    - w35.c2
    targets: &id005
    - features.a-corporate.a-business
    success:
      mode: all_of
      assertions:
      - c2-done
    window:
      workflows:
      - w35.c2
  c3:
    name: 'W35.3: The wrong bill'
    description: |-
      Make the replacement-supply workflow issue the recovered quote's order against the wrong district budget while retaining the quoted supplier, amount, and delivery period.

      Provides a complete local financial ending for a player who stays in corporate ARWC.
    agent: participant.operator
    actions:
    - w35.c3
    targets: &id006
    - features.a-corporate.a-business
    success:
      mode: all_of
      assertions:
      - c3-done
    window:
      workflows:
      - w35.c3
workflows:
  c1:
    description: 'W35.1: availability follows the evidence/authority alternatives. This independent objective
      may be revisited when facts change; no campaign-wide sequence or deadline is imposed.'
    start: requirements
    steps:
      requirements:
        type: switch
        cases:
        - when:
            assertions:
            - capabilities.corporate-ready
          next: attempt
        default: unavailable
      available:
        type: end
      unavailable:
        type: end
      attempt:
        type: objective
        execution_mode: objective
        objective: w35.c1
        on_success: available
        on_failure: unavailable
  c2:
    description: 'W35.2: availability follows the evidence/authority alternatives. This independent objective
      may be revisited when facts change; no campaign-wide sequence or deadline is imposed.'
    start: requirements
    steps:
      requirements:
