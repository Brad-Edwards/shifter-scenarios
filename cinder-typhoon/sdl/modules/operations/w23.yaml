      expected: true
    evidence_requirements:
    - c3
    quantifier: all
assertions:
  c1-ready:
    proposition: c1
    role: precondition
    polarity: positive
  c1-done:
    proposition: c1
    role: postcondition
    polarity: positive
  c2-ready:
    proposition: c2
    role: precondition
    polarity: positive
  c2-done:
    proposition: c2
    role: postcondition
    polarity: positive
  c3-ready:
    proposition: c3
    role: precondition
    polarity: positive
  c3-done:
    proposition: c3
    role: postcondition
    polarity: positive
objectives:
  c1:
    name: 'W23.1: A measurement with side effects'
    description: |-
      Construct a measurement interaction that causes a controlled change outside its intended estimator state.

      Begins a deep attack on a real planning component.
    agent: participant.operator
    actions:
    - w23.c1
    targets: &id004
    - features.a-engineering.a-diagnostics
    success:
      mode: all_of
      assertions:
      - c1-done
    window:
      workflows:
      - w23.c1
  c2:
    name: 'W23.2: Control beyond the measurement'
    description: |-
      Develop the useful memory capability needed to influence the estimator's protected planning state under its operating constraints.

      Establishes a new exploitation capability beyond the original fault.
    agent: participant.operator
    actions:
    - w23.c2
    targets: &id005
    - features.a-engineering.a-diagnostics
    success:
      mode: all_of
      assertions:
      - c2-done
    window:
      workflows:
      - w23.c2
  c3:
    name: 'W23.3: A measurement that never existed'
    description: |-
      Make the planning estimator report the reserve as sufficient for the supplied allocation case while preserving its normal output interface and the unaffected district estimates.

      Completes the elite branch with a capability that matters to the water story.
    agent: participant.operator
    actions:
    - w23.c3
    targets: &id006
    - features.a-engineering.a-diagnostics
    success:
      mode: all_of
      assertions:
      - c3-done
    window:
      workflows:
      - w23.c3
workflows:
  c1:
    description: 'W23.1: availability follows the evidence/authority alternatives. This independent objective
      may be revisited when facts change; no campaign-wide sequence or deadline is imposed.'
    start: requirements
    steps:
      requirements:
        type: switch
        cases:
        - when:
            assertions:
            - capabilities.ot-read-ready
          next: attempt
        default: unavailable
      available:
        type: end
      unavailable:
        type: end
      attempt:
        type: objective
        execution_mode: objective
        objective: w23.c1
        on_success: available
        on_failure: unavailable
  c2:
    description: 'W23.2: availability follows the evidence/authority alternatives. This independent objective
      may be revisited when facts change; no campaign-wide sequence or deadline is imposed.'
    start: requirements
    steps:
      requirements:
        type: switch
        cases:
        - when:
            assertions:
            - w23.c1-ready
          next: attempt
        default: unavailable
      available:
        type: end
      unavailable:
        type: end
      attempt:
        type: objective
        execution_mode: objective
        objective: w23.c2
        on_success: available
        on_failure: unavailable
  c3:
    description: 'W23.3: availability follows the evidence/authority alternatives. This independent objective
      may be revisited when facts change; no campaign-wide sequence or deadline is imposed.'
    start: requirements
    steps:
      requirements:
        type: switch
        cases:
        - when:
            assertions:
            - w23.c2-ready
          next: attempt
        default: unavailable
      available:
        type: end
      unavailable:
        type: end
      attempt:
        type: objective
        execution_mode: objective
        objective: w23.c3
        on_success: available
        on_failure: unavailable
