evidence_requirements:
  c1:
    description: Demonstrate a reproducible controlled state violation. A crash or an ordinary change
      caused by a valid measurement does not count.
    source_refs: &id001
    - features.a-engineering.a-diagnostics
    scope: Per-participant in-world evidence; no other participant state.
    boundary_kind: assertion_evaluation
    channel: other
    artifact_role: proposition_truth_evidence
    sensitivity: plain
    redaction: redact_secrets
    integrity: checksum
    retention: run_lifetime
    loss_disclosure: required
    observation_demand:
      rule_id: fact-w23-1
      scope: /features
      purpose: experimental
      mode: selected
      selector:
        semantic_scope: /features
        data_kind: artifact
        names:
        - cinder.w23-1.satisfied
        component_refs:
        - features.a-engineering.a-diagnostics
      collection: require
      retention: require
      redaction: redact-secrets
      integrity: checksum
      required: true
      basis: observed
  c2:
    description: Demonstrate controlled access to the designated protected state while the estimator remains
      usable. Repeating the first state violation is insufficient.
    source_refs: &id002
    - features.a-engineering.a-diagnostics
    scope: Per-participant in-world evidence; no other participant state.
    boundary_kind: assertion_evaluation
    channel: other
    artifact_role: proposition_truth_evidence
    sensitivity: plain
    redaction: redact_secrets
    integrity: checksum
    retention: run_lifetime
    loss_disclosure: required
    observation_demand:
      rule_id: fact-w23-2
      scope: /features
      purpose: experimental
      mode: selected
      selector:
        semantic_scope: /features
        data_kind: artifact
        names:
        - cinder.w23-2.satisfied
        component_refs:
        - features.a-engineering.a-diagnostics
      collection: require
      retention: require
      redaction: redact-secrets
      integrity: checksum
      required: true
      basis: observed
  c3:
    description: Demonstrate the controlled false reserve estimate from the genuine planning estimator,
      with unaffected district estimates preserved. This supplies one W34 capability; the raw process
      observations and independent evaluator remain unchanged.
    source_refs: &id003
    - features.a-engineering.a-diagnostics
    scope: Per-participant in-world evidence; no other participant state.
    boundary_kind: assertion_evaluation
    channel: other
    artifact_role: proposition_truth_evidence
    sensitivity: plain
    redaction: redact_secrets
    integrity: checksum
    retention: run_lifetime
    loss_disclosure: required
    observation_demand:
      rule_id: fact-w23-3
      scope: /features
      purpose: experimental
      mode: selected
      selector:
        semantic_scope: /features
        data_kind: artifact
        names:
        - cinder.w23-3.satisfied
        component_refs:
        - features.a-engineering.a-diagnostics
      collection: require
      retention: require
      redaction: redact-secrets
      integrity: checksum
      required: true
      basis: observed
propositions:
  c1:
    description: Demonstrate a reproducible controlled state violation. A crash or an ordinary change
      caused by a valid measurement does not count.
    subjects: *id001
    basis: observed_state
    predicate:
      kind: boolean
      property: cinder.w23-1.satisfied
      semantic_ref: urn:cinder-typhoon:fact:W23.1
      operator: equals
      expected: true
    evidence_requirements:
    - c1
    quantifier: all
  c2:
    description: Demonstrate controlled access to the designated protected state while the estimator remains
      usable. Repeating the first state violation is insufficient.
    subjects: *id002
    basis: observed_state
    predicate:
      kind: boolean
      property: cinder.w23-2.satisfied
      semantic_ref: urn:cinder-typhoon:fact:W23.2
      operator: equals
      expected: true
    evidence_requirements:
    - c2
    quantifier: all
  c3:
    description: Demonstrate the controlled false reserve estimate from the genuine planning estimator,
      with unaffected district estimates preserved. This supplies one W34 capability; the raw process
      observations and independent evaluator remain unchanged.
    subjects: *id003
