realization:
  default: open
evidence_requirements:
  c1:
    description: |-
      Recover the actual staging artifact and its collection binding. It supplies the material for K03.2, not the final archive contents.

      Required technical proof: The artifact digest and collection binding are recorded as player evidence and become the sole input to K03.2.
    source_refs: &id001
    - features.k-corporate.k-dev
    scope: Per-participant in-world evidence; no other participant state.
    boundary_kind: assertion_evaluation
    channel: other
    artifact_role: proposition_truth_evidence
    sensitivity: plain
    redaction: redact_secrets
    integrity: checksum
    retention: run_lifetime
    loss_disclosure: required
    observation_demand:
      rule_id: fact-k03-1
      scope: /features
      purpose: experimental
      mode: selected
      selector:
        semantic_scope: /features
        data_kind: artifact
        names:
        - cinder.k03-1.satisfied
        component_refs:
        - features.k-corporate.k-dev
      collection: require
      retention: require
      redaction: redact-secrets
      integrity: checksum
      required: true
      basis: observed
    notes:
    - 'Author checks: Confirm the visible document provides a lead, the source attachment yields one artifact,
      its collection is explicit, random artifact IDs fail, and reset is repeatable.'
  c2:
    description: |-
      Recover the complete next-stage script and its actual collection instructions. Merely locating embedded text does not establish the reconstructed behavior.

      Required technical proof: The reconstruction service accepts the recovered script digest and instruction set only when they reproduce the fixture's deterministic behavior, then unlocks K03.3's callback configuration.
    source_refs: &id002
    - features.k-corporate.k-dev
    scope: Per-participant in-world evidence; no other participant state.
    boundary_kind: assertion_evaluation
    channel: other
    artifact_role: proposition_truth_evidence
    sensitivity: plain
    redaction: redact_secrets
    integrity: checksum
    retention: run_lifetime
    loss_disclosure: required
    observation_demand:
      rule_id: fact-k03-2
      scope: /features
      purpose: experimental
      mode: selected
      selector:
        semantic_scope: /features
        data_kind: artifact
        names:
        - cinder.k03-2.satisfied
        component_refs:
        - features.k-corporate.k-dev
      collection: require
      retention: require
      redaction: redact-secrets
      integrity: checksum
      required: true
      basis: observed
    notes:
    - 'Author checks: Test partial decode failure, correct reconstruction, integrity mismatch rejection,
      instruction/collection consistency, no host execution, and reset.'
  c3:
    description: |-
      Recover the correctly bound collection and its ticket evidence. The result explains the handler's interest; it supplies no required access credential.

      Required technical proof: The emulator emits a collection-retrieved event only when all bound fields match and returns the `SUP-2841` ticket evidence with provenance.
    source_refs: &id003
    - features.k-corporate.k-dev
    scope: Per-participant in-world evidence; no other participant state.
    boundary_kind: assertion_evaluation
    channel: other
    artifact_role: proposition_truth_evidence
    sensitivity: plain
    redaction: redact_secrets
    integrity: checksum
    retention: run_lifetime
    loss_disclosure: required
    observation_demand:
      rule_id: fact-k03-3
      scope: /features
      purpose: experimental
      mode: selected
      selector:
        semantic_scope: /features
        data_kind: artifact
        names:
        - cinder.k03-3.satisfied
        component_refs:
        - features.k-corporate.k-dev
      collection: require
      retention: require
      redaction: redact-secrets
      integrity: checksum
      required: true
      basis: observed
    notes:
    - 'Author checks: Verify each incorrect configuration fails distinctly, correct reconstruction returns
      one collection, ticket provenance matches the staging record, direct archive reads fail, and reset
      works.'
propositions:
  c1:
    description: Recover the actual staging artifact and its collection binding. It supplies the material
      for K03.2, not the final archive contents.
    subjects: *id001
    basis: observed_state
    predicate:
      kind: boolean
      property: cinder.k03-1.satisfied
      semantic_ref: urn:cinder-typhoon:fact:K03.1
      operator: equals
      expected: true
    evidence_requirements:
    - c1
    quantifier: all
  c2:
    description: Recover the complete next-stage script and its actual collection instructions. Merely
      locating embedded text does not establish the reconstructed behavior.
    subjects: *id002
    basis: observed_state
    predicate:
      kind: boolean
      property: cinder.k03-2.satisfied
      semantic_ref: urn:cinder-typhoon:fact:K03.2
      operator: equals
      expected: true
    evidence_requirements:
    - c2
    quantifier: all
  c3:
    description: Recover the correctly bound collection and its ticket evidence. The result explains the
      handler's interest; it supplies no required access credential.
    subjects: *id003
    basis: observed_state
    predicate:
      kind: boolean
      property: cinder.k03-3.satisfied
      semantic_ref: urn:cinder-typhoon:fact:K03.3
      operator: equals
      expected: true
    evidence_requirements:
    - c3
    quantifier: all
assertions:
  c1-ready:
    proposition: c1
    role: precondition
    polarity: positive
  c1-done:
    proposition: c1
    role: postcondition
    polarity: positive
  c2-ready:
    proposition: c2
    role: precondition
    polarity: positive
  c2-done:
    proposition: c2
    role: postcondition
    polarity: positive
  c3-ready:
    proposition: c3
    role: precondition
    polarity: positive
  c3-done:
    proposition: c3
    role: postcondition
    polarity: positive
objectives:
  c1:
    name: 'K03.1: Our predecessor''s desk'
    description: |-
      Someone from Cinder worked this lead before you. Recover the staging artifact buried in their retained document and identify the collection it belongs to.

      Connects the current operation to an earlier unfinished attempt.
    agent: participant.operator
    actions:
    - k03.c1
    targets: &id004
    - features.k-corporate.k-dev
    success:
      mode: all_of
      assertions:
      - c1-done
    window:
      workflows:
      - k03.c1
  c2:
    name: 'K03.2: The script inside the script'
    description: |-
      The recovered staging material conceals another stage. Reconstruct the usable script and recover the instructions needed to understand what the earlier operator collected.

      Rewards sustained analysis with a specific operational lead.
    agent: participant.operator
    actions:
    - k03.c2
    targets: &id005
    - features.k-corporate.k-dev
    success:
      mode: all_of
      assertions:
      - c2-done
    window:
      workflows:
      - k03.c2
  c3:
    name: 'K03.3: Finish the callback'
    description: |-
      Reconstruct the earlier operation's callback configuration and recover its lost collection. Find out what it learned about the unresolved ARWC maintenance ticket.

      Pays off the old Cinder thread without making it a compulsory customer-entry gate.
    agent: participant.operator
    actions:
    - k03.c3
    targets: &id006
    - features.k-corporate.k-dev
    success:
      mode: all_of
      assertions:
      - c3-done
    window:
      workflows:
      - k03.c3
workflows:
  c1:
    description: 'K03.1: availability follows the evidence/authority alternatives. This independent objective
      may be revisited when facts change; no campaign-wide sequence or deadline is imposed.'
    start: requirements
    steps:
      requirements:
        type: switch
        cases:
        - when:
            assertions:
            - participant.foothold-ready
          next: attempt
        default: unavailable
      available:
        type: end
      unavailable:
        type: end
      attempt:
        type: objective
        execution_mode: objective
        objective: k03.c1
        on_success: available
        on_failure: unavailable
  c2:
    description: 'K03.2: availability follows the evidence/authority alternatives. This independent objective
      may be revisited when facts change; no campaign-wide sequence or deadline is imposed.'
    start: requirements
    steps:
      requirements:
        type: switch
        cases:
        - when:
            assertions:
            - k03.c1-ready
          next: attempt
        default: unavailable
      available:
        type: end
      unavailable:
        type: end
      attempt:
        type: objective
        execution_mode: objective
        objective: k03.c2
        on_success: available
        on_failure: unavailable
  c3:
    description: 'K03.3: availability follows the evidence/authority alternatives. This independent objective
      may be revisited when facts change; no campaign-wide sequence or deadline is imposed.'
    start: requirements
    steps:
      requirements:
        type: switch
        cases:
        - when:
            assertions:
            - k03.c2-ready
          next: attempt
        default: unavailable
      available:
        type: end
      unavailable:
        type: end
      attempt:
        type: objective
        execution_mode: objective
        objective: k03.c3
        on_success: available
        on_failure: unavailable
action_contracts:
  c1:
    semantic_version: 1.0.0
    lifecycle_state: draft
    behavioral_granularity: aggregate
    procedure_basis: The document has been partially redacted in its current rendering while its ordinary
      source attachment preserves the staging artifact. The intended solution is recover-and-validate,
      not a blind archive search.
    realization_profile: backend-declared
    fidelity_claim: The authored mechanism, normal behavior, proof, authority limits, and reset requirements
      are required. Hosting and their implementation remain backend-declared.
    preconditions:
    - precondition_id: eligibility
      precondition_class: authority
      description: Satisfy one complete alternative in the referenced workflow and obtain the required
        scoped access to every listed surface.
      support_refs:
      - workflows.k03.c1
      - features.k-corporate.k-dev
    - precondition_id: normal-surface
      precondition_class: target
      description: A predecessor's retained document is a versioned local artifact that names a staging
        object and its collection identifier in the FieldKest archive.
      support_refs: *id004
    - precondition_id: boundaries-and-reset
      precondition_class: realization
      description: |-
        These are requirements on the realized environment. Apply reset behavior only when a participant reset is requested, not on challenge completion.

        The document and staging object are read-only, player-scoped fixtures; no archive listing or credential is granted. Reset clears retrieval events.
      support_refs:
      - features.k-corporate.k-dev
    effects:
    - effect_id: outcome
      effect_class: intended_effect
      description: Recover the actual staging artifact and its collection binding. It supplies the material
        for K03.2, not the final archive contents.
      target_refs: *id004
      evidence_refs:
      - evidence_requirements.k03.c1
    - effect_id: verified-evidence
      effect_class: evidence_effect
      description: The artifact digest and collection binding are recorded as player evidence and become
        the sole input to K03.2.
      target_refs: *id001
      evidence_refs:
      - evidence_requirements.k03.c1
    failure_classes:
    - precondition_unsatisfied
    - authority_denied
    - target_unavailable
    - partial_success
    - backend_error
    - unknown
  c2:
    semantic_version: 1.0.0
    lifecycle_state: draft
    behavioral_granularity: aggregate
    procedure_basis: This is a staged reverse-engineering exercise. The intended solution reconstructs
      the complete executable representation and interprets its declared collection instructions; locating
      a string fragment is insufficient.
    realization_profile: backend-declared
    fidelity_claim: The authored mechanism, normal behavior, proof, authority limits, and reset requirements
      are required. Hosting and their implementation remain backend-declared.
    preconditions:
    - precondition_id: eligibility
      precondition_class: authority
      description: Satisfy one complete alternative in the referenced workflow and obtain the required
        scoped access to every listed surface.
      support_refs:
      - workflows.k03.c2
      - features.k-corporate.k-dev
    - precondition_id: normal-surface
      precondition_class: target
      description: The staging artifact is a layered encoded script bundle with a documented runtime wrapper,
        integrity marker, and a separate collection-instruction payload.
      support_refs: *id005
    - precondition_id: boundaries-and-reset
      precondition_class: realization
      description: |-
        These are requirements on the realized environment. Apply reset behavior only when a participant reset is requested, not on challenge completion.

        The script is analyzed in a card-local interpreter with synthetic inputs and no network or process execution. Reset clears reconstructed artifacts.
      support_refs:
      - features.k-corporate.k-dev
    effects:
    - effect_id: outcome
      effect_class: intended_effect
      description: Recover the complete next-stage script and its actual collection instructions. Merely
        locating embedded text does not establish the reconstructed behavior.
      target_refs: *id005
      evidence_refs:
      - evidence_requirements.k03.c2
    - effect_id: verified-evidence
      effect_class: evidence_effect
      description: The reconstruction service accepts the recovered script digest and instruction set
        only when they reproduce the fixture's deterministic behavior, then unlocks K03.3's callback configuration.
      target_refs: *id002
      evidence_refs:
      - evidence_requirements.k03.c2
    failure_classes:
    - precondition_unsatisfied
    - authority_denied
    - target_unavailable
    - partial_success
    - backend_error
    - unknown
  c3:
    semantic_version: 1.0.0
    lifecycle_state: draft
    behavioral_granularity: aggregate
    procedure_basis: The emulator intentionally requires a correctly reconstructed configuration rather
      than exposing a listable archive. The intended solution applies K03.2's recovered instructions to
      the supplied staging binding.
    realization_profile: backend-declared
    fidelity_claim: The authored mechanism, normal behavior, proof, authority limits, and reset requirements
      are required. Hosting and their implementation remain backend-declared.
    preconditions:
    - precondition_id: eligibility
      precondition_class: authority
      description: Satisfy one complete alternative in the referenced workflow and obtain the required
        scoped access to every listed surface.
      support_refs:
      - workflows.k03.c3
      - features.k-corporate.k-dev
    - precondition_id: normal-surface
      precondition_class: target
      description: A local callback emulator holds the predecessor operation's lost collection behind
        configuration fields for endpoint, collection ID, and integrity value.
      support_refs: *id006
    - precondition_id: boundaries-and-reset
      precondition_class: realization
      description: |-
        These are requirements on the realized environment. Apply reset behavior only when a participant reset is requested, not on challenge completion.

        It serves one synthetic collection, has no external endpoint, grants no continuing access, and resets its player callback state after completion.
      support_refs:
      - features.k-corporate.k-dev
    effects:
    - effect_id: outcome
      effect_class: intended_effect
      description: Recover the correctly bound collection and its ticket evidence. The result explains
        the handler's interest; it supplies no required access credential.
      target_refs: *id006
      evidence_refs:
      - evidence_requirements.k03.c3
    - effect_id: verified-evidence
      effect_class: evidence_effect
      description: The emulator emits a collection-retrieved event only when all bound fields match and
        returns the `SUP-2841` ticket evidence with provenance.
      target_refs: *id003
      evidence_refs:
      - evidence_requirements.k03.c3
    failure_classes:
    - precondition_unsatisfied
    - authority_denied
    - target_unavailable
    - partial_success
    - backend_error
    - unknown
