objectives:
  c1:
    name: 'This action: The planner''s login trail'
    description: |-
      Recover the protected login/rendering record for the planning application and bind it to the drawing under review.

      Establishes the actual application relationship behind the next browser task.
    agent: participant.operator
    actions:
    - w06.c1
    targets:
    - features.a-corporate.a-identity
    success:
      mode: all_of
      assertions:
      - c1-done
    window:
      workflows:
      - w06.c1
  c2:
    name: 'This action: A drawing in the wrong context'
    description: |-
      Make the planner's privileged browser attach Cinder's controlled preview to the inspection's private drawing review.

      Creates a useful browser capability across the intended login boundary.
    agent: participant.operator
    actions:
    - w06.c2
    targets:
    - features.a-corporate.a-identity
    success:
      mode: all_of
      assertions:
      - c2-done
    window:
      workflows:
      - w06.c2
  c3:
    name: 'This action: A planner session that works'
    description: |-
      Convert the browser capability into usable planner authority over the protected application record.

      Gives the browser chain a durable application result.
    agent: participant.operator
    actions:
    - w06.c3
    targets:
    - features.a-corporate.a-identity
    success:
      mode: all_of
      assertions:
      - c3-done
    window:
      workflows:
      - w06.c3
