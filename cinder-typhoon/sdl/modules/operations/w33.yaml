    quantifier: all
  c4:
    description: Demonstrate the policy through the scheduler in independent private rehearsal cases within
      the published bounds, using available observations. A standalone offline policy or one replayed
      winning schedule is insufficient; scenario time advances on demand.
    subjects: *id004
    basis: observed_state
    predicate:
      kind: boolean
      property: cinder.w33-4.satisfied
      semantic_ref: urn:cinder-typhoon:fact:W33.4
      operator: equals
      expected: true
    evidence_requirements:
    - c4
    quantifier: all
assertions:
  c1-ready:
    proposition: c1
    role: precondition
    polarity: positive
  c1-done:
    proposition: c1
    role: postcondition
    polarity: positive
  c2-ready:
    proposition: c2
    role: precondition
    polarity: positive
  c2-done:
    proposition: c2
    role: postcondition
    polarity: positive
  c3-ready:
    proposition: c3
    role: precondition
    polarity: positive
  c3-done:
    proposition: c3
    role: postcondition
    polarity: positive
  c4-ready:
    proposition: c4
    role: precondition
    polarity: positive
  c4-done:
    proposition: c4
    role: postcondition
    polarity: positive
objectives:
  c1:
    name: 'W33.1: A forecast that matches the instrument'
    description: |-
      Reconcile calibration and observation delay with the supplied trace so the planning model reproduces the relevant forecast.

      Grounds the advanced process branch in observable engineering evidence.
    agent: participant.operator
    actions:
    - w33.c1
    targets: &id005
    - features.a-engineering.a-hmi
    - features.a-engineering.a-historian
    success:
      mode: all_of
      assertions:
      - c1-done
    window:
      workflows:
      - w33.c1
  c2:
    name: 'W33.2: The expensive hour'
    description: |-
      Construct a time-varying release schedule that meets the practice objective while respecting the declared operating constraints.

      Makes timing and economic context substantive parts of the challenge.
    agent: participant.operator
    actions:
    - w33.c2
    targets: &id006
    - features.a-engineering.a-hmi
    - features.a-corporate.a-data
    success:
      mode: all_of
      assertions:
      - c2-done
    window:
      workflows:
      - w33.c2
  c3:
    name: 'W33.3: The schedule the service accepts'
    description: |-
      Carry the planned release across the scheduler's authorization boundary and demonstrate its bounded economic effect in the live rehearsal.

      Adds a real application/control problem after offline planning.
    agent: participant.operator
    actions:
    - w33.c3
    targets: &id007
    - features.a-control.a-reservoir
    - features.a-control.a-distribution
    - features.a-control.a-instruments
    success:
      mode: all_of
      assertions:
      - c3-done
    window:
      workflows:
      - w33.c3
  c4:
    name: 'W33.4: When the forecast moves'
    description: |-
      Run a feedback policy through your earned scheduler capability so the bounded objective is met across the disclosed demand and calibration conditions.

      Extends a one-case result into a robust process-control achievement.
    agent: participant.operator
    actions:
    - w33.c4
    targets: &id008
    - features.a-control.a-reservoir
    - features.a-control.a-distribution
    - features.a-control.a-instruments
    success:
      mode: all_of
      assertions:
      - c4-done
    window:
      workflows:
      - w33.c4
workflows:
  c1:
    description: 'W33.1: availability follows the evidence/authority alternatives. This independent objective
      may be revisited when facts change; no campaign-wide sequence or deadline is imposed.'
    start: requirements
    steps:
      requirements:
        type: switch
        cases:
        - when:
            assertions:
            - capabilities.ot-read-ready
          next: attempt
        default: unavailable
      available:
        type: end
      unavailable:
        type: end
      attempt:
        type: objective
        execution_mode: objective
        objective: w33.c1
        on_success: available
        on_failure: unavailable
  c2:
    description: 'W33.2: availability follows the evidence/authority alternatives. This independent objective
      may be revisited when facts change; no campaign-wide sequence or deadline is imposed.'
    start: requirements
    steps:
      requirements:
        type: switch
        cases:
        - when:
            assertions:
            - w33.c1-ready
            - capabilities.envelope-ready
          next: attempt
        default: unavailable
      available:
        type: end
      unavailable:
        type: end
      attempt:
        type: objective
        execution_mode: objective
        objective: w33.c2
        on_success: available
        on_failure: unavailable
  c3:
    description: 'W33.3: availability follows the evidence/authority alternatives. This independent objective
      may be revisited when facts change; no campaign-wide sequence or deadline is imposed.'
    start: requirements
    steps:
      requirements:
        type: switch
        cases:
        - when:
            assertions:
            - w33.c2-ready
            - capabilities.process-interpretation-ready
            - capabilities.control-ready
            - capabilities.mode-ready
            - capabilities.consequence-plan-ready
          next: attempt
        default: unavailable
      available:
        type: end
      unavailable:
        type: end
      attempt:
        type: objective
        execution_mode: objective
        objective: w33.c3
        on_success: available
        on_failure: unavailable
  c4:
    description: 'W33.4: availability follows the evidence/authority alternatives. This independent objective
      may be revisited when facts change; no campaign-wide sequence or deadline is imposed.'
    start: requirements
    steps:
      requirements:
        type: switch
        cases:
        - when:
            assertions:
            - w33.c3-ready
          next: attempt
        default: unavailable
      available:
        type: end
      unavailable:
        type: end
      attempt:
        type: objective
        execution_mode: objective
        objective: w33.c4
        on_success: available
        on_failure: unavailable
