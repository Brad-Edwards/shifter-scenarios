      assertions:
      - c3-done
    window:
      workflows:
      - w33.c3
  c4:
    name: 'This action: Prove the operating projection'
    description: Reconstruct every commissioning step from product history and turn the measured results into an
      explicitly labelled one-hour operating projection.
    assigned_participant: participant.operator
    actions:
    - w33.c4
    targets:
    - features.a-engineering.a-historian
    - features.a-engineering.a-hmi
    - features.a-corporate.a-data
    - features.a-control.a-reservoir
    success:
