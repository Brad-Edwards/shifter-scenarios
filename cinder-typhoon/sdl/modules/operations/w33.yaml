evidence_requirements:
  c1:
    description: |-
      Record the first good in-tolerance response after native PLC acceptance, at least five settled samples, the response delay, and measured-flow/requested-flow gain.

      Required technical proof: Completion reads a range-supplied snapshot of the native dispatcher journal, PLC decisions, process history, and corporate planning records applicable to the card. The participant cannot supply product evidence. The evaluator cannot issue a broker request, write a controller tag, move an outlet, retry an uncertain request, take local priority, or create product evidence.

      Evidence sources are `features.a-engineering.a-engineering`, `features.a-engineering.a-historian`, `features.a-engineering.a-hmi`. A wrong asset, instruction, calibration request, source time, process quality, gain, schedule constraint, request identity, transition order, PLC sequence, measured result, handback, corporate record, unit, or measured-versus-projected interpretation is rejected.
    source_refs:
    - features.a-engineering.a-engineering
    - features.a-engineering.a-historian
    - features.a-engineering.a-hmi
    scope: Per-participant in-world evidence; no other participant state.
    boundary_kind: assertion_evaluation
    channel: other
    artifact_role: proposition_truth_evidence
    sensitivity: plain
    redaction: redact_secrets
    integrity: checksum
    retention: run_lifetime
    loss_disclosure: required
    observation_demand:
      rule_id: fact-w33-1
      scope: /features
      purpose: experimental
      mode: selected
      selector:
        semantic_scope: /features
        data_kind: artifact
        names:
        - cinder.w33-1.satisfied
        component_refs:
        - features.a-engineering.a-engineering
        - features.a-engineering.a-historian
        - features.a-engineering.a-hmi
      collection: require
      retention: require
      redaction: redact-secrets
      integrity: checksum
      required: true
      basis: observed
    notes:
    - 'Author checks: Begin from the qualified manual A20/B20 baseline and an authentic completed W30 record. Verify
      calibration against native dispatcher and historian time, then accept multiple feasible schedules rather than
      one fixed answer. For commissioning, require twelve fresh sequential requests, the exact successful dispatcher
      path, matching native PLC acceptances, settled good-quality feedback, and a later local handback. Recompute
      every projection from product history and the current corporate rows. Reject infeasible schedules, missing
      or reordered stages, duplicate identities, rejection, uncertainty, bad quality, participant-supplied product
      evidence, invented measurements, stale planning records, confused measured/projected claims, or failure to
      restore. Reset must return the same qualified baseline without replaying a dispatcher request or changing
      product identities and trust material.'
