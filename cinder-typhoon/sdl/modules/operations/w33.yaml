realization:
  default: open
evidence_requirements:
  c1:
    description: Produce the correctly bound forecast within the stated tolerance. Normal commissioning
      records are sufficient; W16 is never required.
    source_refs: &id001
    - features.a-engineering.a-hmi
    - features.a-engineering.a-historian
    scope: Per-participant in-world evidence; no other participant state.
    boundary_kind: assertion_evaluation
    channel: other
    artifact_role: proposition_truth_evidence
    sensitivity: plain
    redaction: redact_secrets
    integrity: checksum
    retention: run_lifetime
    loss_disclosure: required
    observation_demand:
      rule_id: fact-w33-1
      scope: /features
      purpose: experimental
      mode: selected
      selector:
        semantic_scope: /features
        data_kind: artifact
        names:
        - cinder.w33-1.satisfied
        component_refs:
        - features.a-engineering.a-hmi
        - features.a-engineering.a-historian
      collection: require
      retention: require
      redaction: redact-secrets
      integrity: checksum
      required: true
      basis: observed
  c2:
    description: Produce a feasible practice trajectory meeting both the reserve-loss objective and every
      published state constraint. Simply holding the outlet at its maximum cannot satisfy the task.
    source_refs: &id002
    - features.a-engineering.a-hmi
    - features.a-corporate.a-data
    scope: Per-participant in-world evidence; no other participant state.
    boundary_kind: assertion_evaluation
    channel: other
    artifact_role: proposition_truth_evidence
    sensitivity: plain
    redaction: redact_secrets
    integrity: checksum
    retention: run_lifetime
    loss_disclosure: required
    observation_demand:
      rule_id: fact-w33-2
      scope: /features
      purpose: experimental
      mode: selected
      selector:
        semantic_scope: /features
        data_kind: artifact
        names:
        - cinder.w33-2.satisfied
        component_refs:
        - features.a-engineering.a-hmi
        - features.a-corporate.a-data
      collection: require
      retention: require
      redaction: redact-secrets
      integrity: checksum
      required: true
      basis: observed
  c3:
    description: Demonstrate accepted scoped actions, actual bounded reserve loss, and the resulting economic
      effect. Bind the advanced schedule to the current evidence and recompute its consequence using the
      earned model; a valid plan for another schedule or checkpoint is insufficient.
    source_refs: &id003
    - features.a-control.a-reservoir
    - features.a-control.a-distribution
    - features.a-control.a-instruments
    scope: Per-participant in-world evidence; no other participant state.
    boundary_kind: assertion_evaluation
    channel: other
    artifact_role: proposition_truth_evidence
    sensitivity: plain
    redaction: redact_secrets
    integrity: checksum
    retention: run_lifetime
    loss_disclosure: required
    observation_demand:
      rule_id: fact-w33-3
      scope: /features
      purpose: experimental
      mode: selected
      selector:
        semantic_scope: /features
        data_kind: artifact
        names:
        - cinder.w33-3.satisfied
        component_refs:
        - features.a-control.a-reservoir
        - features.a-control.a-distribution
        - features.a-control.a-instruments
      collection: require
      retention: require
      redaction: redact-secrets
      integrity: checksum
      required: true
      basis: observed
  c4:
    description: Demonstrate the policy through the scheduler in independent private rehearsal cases within
      the published bounds, using available observations. A standalone offline policy or one replayed
      winning schedule is insufficient; scenario time advances on demand.
    source_refs: &id004
    - features.a-control.a-reservoir
    - features.a-control.a-distribution
    - features.a-control.a-instruments
    scope: Per-participant in-world evidence; no other participant state.
    boundary_kind: assertion_evaluation
    channel: other
    artifact_role: proposition_truth_evidence
    sensitivity: plain
    redaction: redact_secrets
    integrity: checksum
    retention: run_lifetime
    loss_disclosure: required
    observation_demand:
