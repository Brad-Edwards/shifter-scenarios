objectives:
  c1:
    name: 'This action: A forecast that matches the instrument'
    description: Calibrate outlet response delay and flow gain from a completed native operation and good-quality
      process history.
    assigned_participant: participant.operator
    actions:
    - w33.c1
    targets:
    - features.a-engineering.a-engineering
    - features.a-engineering.a-historian
    - features.a-engineering.a-hmi
    success:
      mode: all_of
      assertions:
      - c1-done
    window:
      workflows:
      - w33.c1
  c2:
    name: 'This action: The peak hour'
    description: Construct a twelve-interval release and alternate-supply schedule using the measured gain, planned
      demand, and declared operating limits.
    assigned_participant: participant.operator
    actions:
    - w33.c2
    targets:
    - features.a-engineering.a-engineering
    - features.a-engineering.a-historian
    - features.a-corporate.a-data
    success:
      mode: all_of
      assertions:
      - c2-done
    window:
      workflows:
      - w33.c2
  c3:
    name: 'This action: Commission the schedule'
    description: Commission all twelve reviewed release values through the authenticated dispatcher, prove each
      native result, and hand the site back locally.
    assigned_participant: participant.operator
    actions:
    - w33.c3
    targets:
    - features.a-engineering.a-engineering
    - features.a-engineering.a-hmi
    - features.a-engineering.a-historian
    - features.a-control.a-reservoir
    - features.a-control.a-instruments
    success:
