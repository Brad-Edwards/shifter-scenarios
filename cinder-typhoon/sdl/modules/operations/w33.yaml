action_contracts:
  c1:
    semantic_version: 1.0.0
    lifecycle_state: draft
    behavioral_granularity: aggregate
    procedure_basis: |-
      The authored condition is **delay and calibration forecast reconciliation**. Forecast case FCST-CRR-33 joins 20-second instrument samples, fixed 40-second publication delay, scale gain 1.00, and current map MAP-OG2-R8; tolerance is 0.01 ML. The hand build must preserve every named version, encoding, bound, validation order, identity, and unaffected field; substituting a generic vulnerable service would change the task.

      The required result is: Produce the correctly bound forecast within the stated tolerance. Normal commissioning records are sufficient; W16 is never required. Process quantities and state separation are governed by `arwc-process-model.md`, specifically `REH-SCHED-33`.
    realization_profile: backend-declared
    fidelity_claim: The exact initial state, versions, formats, validation order, authorization decisions, process
      quantities, denial cases, persistent state, and independently owned evidence are required. Implementation
      choices remain open only when none of those facts change.
    preconditions:
    - precondition_id: eligibility
      precondition_class: authority
      description: Satisfy one complete alternative in the referenced workflow and obtain the required scoped access
        to every listed surface.
      support_refs:
      - workflows.w33.c1
      - features.a-engineering.a-hmi
      - features.a-engineering.a-historian
    - precondition_id: normal-surface
      precondition_class: target
      description: |-
        `a-hmi` and its `supervisory-operations` application own this part of **A forecast that matches the instrument**. Normal behavior applies the declared identity, tenant, object, revision, and process bindings and returns or changes only the caller-scoped object. The exact initial state is: Forecast case FCST-CRR-33 joins 20-second instrument samples, fixed 40-second publication delay, scale gain 1.00, and current map MAP-OG2-R8; tolerance is 0.01 ML. Ordinary workplace context reuses `arwc-documents:service-meter-guide`; the work item-specific service state is separate.

        Native bindings:

        - `a-engineering.a-hmi/supervisory-operations/a-forecast-that-matches-the-instrument`
        - `a-engineering.a-historian/process-historian/a-forecast-that-matches-the-instrument`

        The private service-loader contract is `content.arwc-a-hmi.w33-1-a-forecast-that-matches-the-instrument`. It freezes accepted and denied requests, state transition, persistence, and evidence; it does not seed a successful result.
      support_refs:
