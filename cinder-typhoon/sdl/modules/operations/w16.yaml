evidence_requirements:
  c1:
    description: Recover the descriptor and a correctly bound baseline observation. Finding the binary
      or its version string is insufficient.
    source_refs: &id001
    - features.a-corporate.a-archive
    scope: Per-participant in-world evidence; no other participant state.
    boundary_kind: assertion_evaluation
    channel: other
    artifact_role: proposition_truth_evidence
    sensitivity: plain
    redaction: redact_secrets
    integrity: checksum
    retention: run_lifetime
    loss_disclosure: required
    observation_demand:
      rule_id: fact-w16-1
      scope: /features
      purpose: experimental
      mode: selected
      selector:
        semantic_scope: /features
        data_kind: artifact
        names:
        - cinder.w16-1.satisfied
        component_refs:
        - features.a-corporate.a-archive
      collection: require
      retention: require
      redaction: redact-secrets
      integrity: checksum
      required: true
      basis: observed
  c2:
    description: Produce evidence of the specified boundary crossing. An unexplained crash or ordinary
      in-window reading does not count.
    source_refs: &id002
    - features.a-corporate.a-archive
    scope: Per-participant in-world evidence; no other participant state.
