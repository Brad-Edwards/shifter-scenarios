    description: Recover the descriptor and a correctly bound baseline observation. Finding the binary
      or its version string is insufficient.
    subjects: *id001
    basis: observed_state
    predicate:
      kind: boolean
      property: cinder.w16-1.satisfied
      semantic_ref: urn:cinder-typhoon:fact:W16.1
      operator: equals
      expected: true
    evidence_requirements:
    - c1
    quantifier: all
  c2:
