objectives:
  c1:
    name: 'W16.1: The sequencer''s vocabulary'
    description: |-
      Recover the instrument's restricted sequence descriptor and reproduce the designated ordinary diagnostic observation.

      Gives the experimental branch a usable interface and baseline.
    agent: participant.operator
    actions:
    - w16.c1
    targets: &id005
    - features.a-corporate.a-archive
    success:
      mode: all_of
      assertions:
      - c1-done
    window:
      workflows:
      - w16.c1
  c2:
    name: 'W16.2: An observation outside the window'
    description: |-
      Demonstrate a controlled observation beyond the instrument's intended data window without abandoning its diagnostic interface.

      Establishes the first substantive observation capability.
    agent: participant.operator
    actions:
    - w16.c2
    targets: &id006
    - features.a-corporate.a-archive
    success:
      mode: all_of
      assertions:
      - c2-done
    window:
      workflows:
      - w16.c2
  c3:
    name: 'W16.3: An experiment with a signal'
    description: |-
      Construct a sequencer experiment that distinguishes the specified protected conditions through its measurements. Establish an interpretation that holds across the supplied reference cases.

      Turns a narrow observation flaw into a usable experimental capability.
    agent: participant.operator
    actions:
    - w16.c3
    targets: &id007
    - features.a-corporate.a-archive
    success:
      mode: all_of
      assertions:
      - c3-done
    window:
      workflows:
      - w16.c3
  c4:
    name: 'W16.4: What the instrument remembers'
    description: |-
      Recover the protected calibration record through the constrained instrument interface and bind it to the retained field revision.

      Concludes the research branch with a meaningful engineering discovery.
    agent: participant.operator
    actions:
    - w16.c4
    targets: &id008
    - features.a-corporate.a-archive
    success:
      mode: all_of
      assertions:
      - c4-done
    window:
      workflows:
      - w16.c4
workflows:
  c1:
    description: 'W16.1: availability follows the evidence/authority alternatives. This independent objective
      may be revisited when facts change; no campaign-wide sequence or deadline is imposed.'
    start: requirements
    steps:
      requirements:
        type: switch
        cases:
        - when:
            assertions:
            - capabilities.corporate-ready
          next: attempt
        default: unavailable
      available:
        type: end
      unavailable:
        type: end
      attempt:
        type: objective
        execution_mode: objective
        objective: w16.c1
        on_success: available
        on_failure: unavailable
