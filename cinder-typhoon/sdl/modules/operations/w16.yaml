    semantic_version: 1.0.0
    lifecycle_state: draft
    behavioral_granularity: aggregate
    procedure_basis: |-
      The authored condition is **late bounds authorization with observable cycle state**. SEQ-CRR-4 programs contain at most 64 four-byte instructions: opcode, unsigned sample index, operand, and destination. Opcodes are NOP=0, LOAD=1, XOR=2, ADD=3, ROTL=4, TEST=5, STORE=6, HALT=7. LOAD masks the index to eight bits, reads the sample, and adds its data-dependent cost before checking the 32-index authorization bitmap; a rejected read returns no byte but retains the final cycle count. The service accepts at most 4096 experiments for the supplied sequencer instance and never writes an instrument. The hand build must preserve every named version, encoding, bound, validation order, identity, and unaffected field; substituting a generic vulnerable service would change the task.

