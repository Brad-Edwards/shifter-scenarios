      description: The document-preview source, an ordinary preview account, representative attachments,
        and the preview boundary's observable behavior.
  c3-records-1:
    type: dataset
    description: |-
      K10.3: required in-world starting records. Allocate each record to its actual owning service; this declaration does not duplicate secrets across services or grant their visibility.
      The document-preview source, an ordinary preview account, representative attachments, and the preview boundary's observable behavior.

      The support gateway accepts a player-uploaded preview document and returns the rendered content belonging to the derived document identity under the preview worker's constrained service context.
    target: k-delivery.k-preview
