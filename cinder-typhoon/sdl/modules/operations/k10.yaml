      The FieldKest preview queue renders support attachments in an isolated Playwright worker and records source attachment, derived document identity, viewer request, and owner case.
    target: k-delivery.k-preview
    tags:
    - synthetic
    - k10
    - c1
    - seed-requirement
    items:
    - name: starting-records
      description: The document-preview source, an ordinary preview account, representative attachments,
        and the preview boundary's observable behavior.
  c2-records-1:
    type: dataset
    description: |-
      K10.2: required in-world starting records. Allocate each record to its actual owning service; this declaration does not duplicate secrets across services or grant their visibility.
      The document-preview source, an ordinary preview account, representative attachments, and the preview boundary's observable behavior.

      The preview worker derives a protected identity from document fields before it loads rendered content; two supplied rehearsal attachments carry different source IDs and owners.
    target: k-delivery.k-preview
    tags:
    - synthetic
    - k10
    - c2
    - seed-requirement
    items:
