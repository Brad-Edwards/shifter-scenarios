realization:
  default: open
evidence_requirements:
  c1:
    description: Recover the actual record-bearing data and image binding. No physical kit is required.
    source_refs: &id001
    - features.a-control.a-instruments
    scope: Per-participant in-world evidence; no other participant state.
    boundary_kind: assertion_evaluation
    channel: other
    artifact_role: proposition_truth_evidence
    sensitivity: plain
    redaction: redact_secrets
    integrity: checksum
    retention: run_lifetime
    loss_disclosure: required
    observation_demand:
      rule_id: fact-w20-1
      scope: /features
      purpose: experimental
      mode: selected
      selector:
        semantic_scope: /features
        data_kind: artifact
        names:
        - cinder.w20-1.satisfied
        component_refs:
        - features.a-control.a-instruments
      collection: require
      retention: require
      redaction: redact-secrets
      integrity: checksum
      required: true
      basis: observed
  c2:
    description: Recover the actual last-inspection entry, including its asset, inspection date, and completion
      state, with a valid interpretation of its record integrity. Finding isolated readable strings is
      insufficient.
    source_refs: &id002
    - features.a-control.a-instruments
    scope: Per-participant in-world evidence; no other participant state.
    boundary_kind: assertion_evaluation
    channel: other
    artifact_role: proposition_truth_evidence
    sensitivity: plain
    redaction: redact_secrets
    integrity: checksum
    retention: run_lifetime
    loss_disclosure: required
    observation_demand:
      rule_id: fact-w20-2
      scope: /features
      purpose: experimental
      mode: selected
      selector:
        semantic_scope: /features
        data_kind: artifact
        names:
        - cinder.w20-2.satisfied
        component_refs:
        - features.a-control.a-instruments
      collection: require
      retention: require
      redaction: redact-secrets
      integrity: checksum
      required: true
      basis: observed
  c3:
    description: Produce an accepted altered image with only the intended inspection completion changed.
      This is a historical maintenance-record manipulation, not control of live telemetry or a controller.
    source_refs: &id003
    - features.a-control.a-instruments
    scope: Per-participant in-world evidence; no other participant state.
    boundary_kind: assertion_evaluation
    channel: other
    artifact_role: proposition_truth_evidence
    sensitivity: plain
    redaction: redact_secrets
    integrity: checksum
    retention: run_lifetime
    loss_disclosure: required
    observation_demand:
      rule_id: fact-w20-3
      scope: /features
      purpose: experimental
      mode: selected
      selector:
        semantic_scope: /features
        data_kind: artifact
        names:
        - cinder.w20-3.satisfied
        component_refs:
        - features.a-control.a-instruments
      collection: require
      retention: require
      redaction: redact-secrets
      integrity: checksum
      required: true
      basis: observed
propositions:
  c1:
    description: Recover the actual record-bearing data and image binding. No physical kit is required.
    subjects: *id001
    basis: observed_state
    predicate:
      kind: boolean
      property: cinder.w20-1.satisfied
      semantic_ref: urn:cinder-typhoon:fact:W20.1
      operator: equals
      expected: true
    evidence_requirements:
    - c1
    quantifier: all
  c2:
    description: Recover the actual last-inspection entry, including its asset, inspection date, and completion
      state, with a valid interpretation of its record integrity. Finding isolated readable strings is
      insufficient.
    subjects: *id002
    basis: observed_state
    predicate:
      kind: boolean
      property: cinder.w20-2.satisfied
      semantic_ref: urn:cinder-typhoon:fact:W20.2
      operator: equals
      expected: true
    evidence_requirements:
    - c2
    quantifier: all
  c3:
    description: Produce an accepted altered image with only the intended inspection completion changed.
      This is a historical maintenance-record manipulation, not control of live telemetry or a controller.
    subjects: *id003
    basis: observed_state
    predicate:
      kind: boolean
      property: cinder.w20-3.satisfied
      semantic_ref: urn:cinder-typhoon:fact:W20.3
      operator: equals
      expected: true
    evidence_requirements:
    - c3
    quantifier: all
assertions:
  c1-ready:
    proposition: c1
    role: precondition
    polarity: positive
  c1-done:
    proposition: c1
    role: postcondition
    polarity: positive
  c2-ready:
    proposition: c2
    role: precondition
    polarity: positive
  c2-done:
    proposition: c2
    role: postcondition
    polarity: positive
  c3-ready:
    proposition: c3
    role: precondition
    polarity: positive
  c3-done:
    proposition: c3
    role: postcondition
    polarity: positive
objectives:
  c1:
    name: 'W20.1: What the image kept'
    description: |-
      Recover the retained maintenance record set through the supplied device interface and bind it to the inspection image.

      Establishes a usable artifact beyond a raw image filename.
    agent: participant.operator
    actions:
    - w20.c1
    targets: &id004
    - features.a-control.a-instruments
    success:
      mode: all_of
      assertions:
      - c1-done
    window:
      workflows:
      - w20.c1
  c2:
    name: 'W20.2: A valid maintenance record'
    description: |-
      Recover the last recorded outlet inspection from the retained maintenance image and establish whether its entry is valid under the image's record rules.

      Gives storage analysis an actual record payoff.
    agent: participant.operator
    actions:
    - w20.c2
    targets: &id005
    - features.a-control.a-instruments
    success:
      mode: all_of
      assertions:
      - c2-done
    window:
      workflows:
      - w20.c2
  c3:
    name: 'W20.3: Change one record, keep the rest'
    description: |-
      Change the retained image so the outlet's last inspection is recorded as completed, preserving its asset identity, every unrelated record, and the image's required consistency.

      Completes a precise data-tampering episode.
    agent: participant.operator
    actions:
    - w20.c3
    targets: &id006
    - features.a-control.a-instruments
    success:
      mode: all_of
      assertions:
      - c3-done
    window:
      workflows:
      - w20.c3
workflows:
  c1:
    description: 'W20.1: availability follows the evidence/authority alternatives. This independent objective
      may be revisited when facts change; no campaign-wide sequence or deadline is imposed.'
    start: requirements
    steps:
      requirements:
        type: switch
        cases:
        - when:
            assertions:
            - capabilities.ot-read-ready
          next: attempt
        default: unavailable
      available:
        type: end
      unavailable:
        type: end
      attempt:
        type: objective
        execution_mode: objective
        objective: w20.c1
        on_success: available
        on_failure: unavailable
  c2:
    description: 'W20.2: availability follows the evidence/authority alternatives. This independent objective
      may be revisited when facts change; no campaign-wide sequence or deadline is imposed.'
    start: requirements
    steps:
      requirements:
        type: switch
        cases:
        - when:
            assertions:
            - w20.c1-ready
          next: attempt
        default: unavailable
      available:
        type: end
      unavailable:
        type: end
      attempt:
        type: objective
        execution_mode: objective
        objective: w20.c2
        on_success: available
        on_failure: unavailable
  c3:
    description: 'W20.3: availability follows the evidence/authority alternatives. This independent objective
      may be revisited when facts change; no campaign-wide sequence or deadline is imposed.'
    start: requirements
    steps:
      requirements:
        type: switch
        cases:
        - when:
            assertions:
            - w20.c2-ready
          next: attempt
        default: unavailable
      available:
        type: end
      unavailable:
        type: end
      attempt:
        type: objective
        execution_mode: objective
        objective: w20.c3
        on_success: available
        on_failure: unavailable
