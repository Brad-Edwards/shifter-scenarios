  c2:
    semantic_version: 1.0.0
    lifecycle_state: draft
    behavioral_granularity: aggregate
    procedure_basis: |-
      The authored condition is **NOR flash append and erase semantics**. Each 64-byte little-endian record is magic F204 at 0x00, sequence u32 at 0x04, payload length u16 at 0x08, status at 0x0a, status markers at 0x0b, up to 44 payload bytes at 0x0c, CRC32C over bytes 0x00..0x37 at 0x38, three erased reserved bytes at 0x3c, and commit byte at 0x3f. A committed record has commit=0x00; 0xff is incomplete. Pages are 4096 bytes, programming only changes 1 to 0, and an erase resets a whole page to 0xff while incrementing that page's declared wear count. The hand build must preserve every named version, encoding, bound, validation order, identity, and unaffected field; substituting a generic vulnerable service would change the task.

      The required result is: Recover the actual last-inspection entry, including its asset, inspection date, and completion state, with a valid interpretation of its record integrity. Finding isolated readable strings is insufficient.
