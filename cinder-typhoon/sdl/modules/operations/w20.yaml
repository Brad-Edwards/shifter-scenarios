    lifecycle_state: draft
    behavioral_granularity: aggregate
    procedure_basis: |-
      This card is an exact discovery, interpretation, or reconciliation task rather than an additional privilege flaw. Instrument flash image IMG-FIT-204-R6 uses 4096-byte erase pages and 64-byte append records with magic, sequence, payload length, CRC32C, status, and commit byte. The result must come from the declared source and bindings, not from a duplicate clue or pre-completed record.

      The required result is: Recover the actual record-bearing data and image binding. No physical kit is required.
    realization_profile: backend-declared
    fidelity_claim: The exact initial state, versions, formats, validation order, authorization decisions, process
      quantities, denial cases, persistent state, and independently owned evidence are required. Implementation
      choices remain open only when none of those facts change.
    preconditions:
    - precondition_id: eligibility
      precondition_class: authority
      description: Satisfy one complete alternative in the referenced workflow and obtain the required scoped access
        to every listed surface.
      support_refs:
      - workflows.w20.c1
      - features.a-control.a-instruments
    - precondition_id: normal-surface
      precondition_class: target
      description: |-
        `a-instruments` and its `independent-instruments` application own this part of **What the image kept**. Normal behavior applies the declared identity, tenant, object, revision, and process bindings and returns or changes only the caller-scoped object. The exact initial state is: Instrument flash image IMG-FIT-204-R6 uses 4096-byte erase pages and 64-byte append records with magic, sequence, payload length, CRC32C, status, and commit byte.

        Native bindings:

        - `a-control.a-instruments/independent-instruments/what-the-image-kept`
        - `a-control.a-instruments/filesystem:/var/lib/arwc-instruments/artifacts/what-the-image-kept`

        The private service-loader contract is `content.arwc-a-instruments.w20-1-what-the-image-kept`. It freezes accepted and denied requests, state transition, persistence, and evidence; it does not seed a successful result.
      support_refs:
      - features.a-control.a-instruments
      - content.arwc-a-instruments.w20-1-what-the-image-kept
    - precondition_id: scope-and-persistence
      precondition_class: realization
      description: |-
        The result remains local evidence unless a downstream workflow explicitly names it. Tenant-scoped mutations, sessions that have not expired, generated artifacts, and audits persist across ordinary retries and later sessions. Initial immutable records remain unchanged unless the named route explicitly permits a field-level revision. Infrastructure recovery and submission adjudication are external to the SDL.

