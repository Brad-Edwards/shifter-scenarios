      - features.a-corporate.a-connector
    - precondition_id: normal-surface
      precondition_class: target
      description: |-
        `a-connector` and its `customer-handover` application own this part of **Change the corporate record**. Normal behavior applies the declared identity, tenant, object, revision, and process bindings and returns or changes only the caller-scoped object. The exact initial state is: Attachment endpoint for PLN-HO-CRR-17 authorizes corporate attachment update but omits the attachment-owner comparison; inspection and assignee fields are immutable and the new attachment digest is audited.

        Native bindings:

        - `a-corporate.a-connector/customer-handover/change-the-corporate-record`

        The private service-loader contract is `content.arwc-a-connector.w01-4-change-the-corporate-record`. It freezes accepted and denied requests, state transition, persistence, and evidence; it does not seed a successful result.
      support_refs:
      - features.a-corporate.a-connector
      - content.arwc-a-connector.w01-4-change-the-corporate-record
    - precondition_id: scope-and-persistence
      precondition_class: realization
      description: |-
        The result remains local evidence unless a downstream workflow explicitly names it. Tenant-scoped mutations, sessions that have not expired, generated artifacts, and audits persist across ordinary retries and later sessions. Initial immutable records remain unchanged unless the named route explicitly permits a field-level revision. Infrastructure recovery and submission adjudication are external to the SDL.

        The behavior is limited to the named fictional objects and bounded service operation. It provides no general shell, arbitrary network target, unrelated district access, real process interface, or authority not expressly declared by the card.
      support_refs:
      - features.a-corporate.a-connector
    effects:
