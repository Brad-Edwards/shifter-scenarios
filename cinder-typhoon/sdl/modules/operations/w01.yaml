propositions:
  c1:
    description: Recover the customer-side handover and its original maintenance binding. Reusing the delivery receipt
      that earned corporate access does not establish the result.
    subjects:
    - features.a-corporate.a-connector
    basis: observed_state
    predicate:
      kind: boolean
      property: cinder.w01-1.satisfied
      semantic_ref: urn:cinder-typhoon:fact:W01.1
      operator: equals
      expected: true
    evidence_requirements:
    - c1
    quantifier: all
  c2:
    description: Recover the actual handover and inspection reference from its separate corporate surface. No OT
      authority is implied.
    subjects:
    - features.a-corporate.a-business
    basis: observed_state
    predicate:
      kind: boolean
      property: cinder.w01-2.satisfied
      semantic_ref: urn:cinder-typhoon:fact:W01.2
      operator: equals
      expected: true
    evidence_requirements:
    - c2
    quantifier: all
  c3:
    description: Recover the unpublished continuity note. Its narrative context is separate from the price catalog
      and private quotes in W35.
    subjects:
    - features.a-corporate.a-business
    basis: observed_state
    predicate:
      kind: boolean
      property: cinder.w01-3.satisfied
      semantic_ref: urn:cinder-typhoon:fact:W01.3
      operator: equals
      expected: true
    evidence_requirements:
    - c3
    quantifier: all
  c4:
    description: Cause the server-side attachment replacement on the designated inspection handover, with the assignee
      and inspection binding unchanged. Connector execution alone or editing a local copy is insufficient.
    subjects:
    - features.a-corporate.a-business
    basis: observed_state
    predicate:
      kind: boolean
      property: cinder.w01-4.satisfied
      semantic_ref: urn:cinder-typhoon:fact:W01.4
      operator: equals
      expected: true
    evidence_requirements:
    - c4
    quantifier: all
