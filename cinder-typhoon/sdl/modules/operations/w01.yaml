objectives:
  c1:
    name: 'This action: The customer''s copy'
    description: |-
      Recover ARWC's retained integration handover from the corporate connector. Find what the customer recorded about the maintenance package before Cinder arrived.

      Makes the supplier-to-customer transition concrete through new evidence.
    agent: participant.operator
    actions:
    - w01.c1
    targets:
    - features.a-corporate.a-connector
    success:
      mode: all_of
      assertions:
      - c1-done
    window:
      workflows:
      - w01.c1
  c2:
    name: 'This action: The planner''s unfinished handover'
    description: |-
      Recover the exposed maintenance-planning handover and the outstanding inspection it describes.

      Introduces the planner's legitimate concern and a new internal lead.
    agent: participant.operator
    actions:
    - w01.c2
    targets:
    - features.a-corporate.a-connector
    success:
      mode: all_of
      assertions:
      - c2-done
    window:
      workflows:
      - w01.c2
  c3:
    name: 'This action: How the company buys time'
    description: |-
      Find ARWC's internal continuity note explaining how it handles a shortfall in usable reserve.

      Establishes replacement supply and restrictions as the story's bounded consequences.
    agent: participant.operator
    actions:
    - w01.c3
    targets:
    - features.a-corporate.a-connector
    success:
      mode: all_of
      assertions:
      - c3-done
    window:
      workflows:
      - w01.c3
  c4:
    name: 'This action: Change the corporate record'
    description: |-
      Make the corporate handover service replace the planner's inspection-summary attachment with Cinder's copy while preserving the original inspection and assignee.

      Gives arrival a small action payoff before the next pivot.
    agent: participant.operator
    actions:
    - w01.c4
    targets:
    - features.a-corporate.a-connector
    success:
      mode: all_of
      assertions:
      - c4-done
    window:
      workflows:
      - w01.c4
