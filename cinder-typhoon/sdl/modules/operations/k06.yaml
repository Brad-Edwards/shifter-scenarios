objectives:
  c1:
    name: 'K06.1: House credentials'
    description: |-
      The importer can retrieve material the developer cannot read directly. Recover usable authority over the release channel consumed by FieldKest customers.

      Creates the ordinary package-delivery route's publication capability.
    agent: participant.operator
    actions:
    - k06.c1
    targets: &id004
    - features.k-delivery.k-registry
    success:
      mode: all_of
      assertions:
      - c1-done
    window:
      workflows:
      - k06.c1
  c2:
    name: 'K06.2: A private package in the wrong view'
    description: |-
      Your publication identity still cannot read the private support package. Cross the package-view boundary and recover its protected contents.

      Adds a separate registry data compromise after publication access.
    agent: participant.operator
    actions:
    - k06.c2
    targets: &id005
    - features.k-delivery.k-registry
    success:
      mode: all_of
      assertions:
      - c2-done
    window:
      workflows:
      - k06.c2
  c3:
    name: 'K06.3: The rehearsal consumer'
    description: |-
      Make the isolated test consumer run your compatible package behavior and return its protected rehearsal result.

      Completes a local supplier-side execution episode before customer delivery.
    agent: participant.operator
    actions:
    - k06.c3
    targets: &id006
    - features.k-delivery.k-registry
    - features.k-delivery.k-ci
    success:
      mode: all_of
      assertions:
      - c3-done
    window:
      workflows:
      - k06.c3
workflows:
  c1:
    description: 'K06.1: availability follows the evidence/authority alternatives. This independent objective
      may be revisited when facts change; no campaign-wide sequence or deadline is imposed.'
    start: requirements
    steps:
      requirements:
        type: switch
        cases:
        - when:
            assertions:
            - capabilities.g03-ready
          next: attempt
        default: unavailable
      available:
        type: end
      unavailable:
        type: end
      attempt:
        type: objective
        execution_mode: objective
        objective: k06.c1
        on_success: available
        on_failure: unavailable
  c2:
