evidence_requirements:
  c1:
    description: |-
      Recover and demonstrate the limited registry publication authority. This supplies A01; recovering its configuration and using the resulting credential are one achievement.

      Required technical proof: Registry audit data must show the scoped identity performing its permitted release-channel action; this awards `A01`.
    source_refs: &id001
    - features.k-delivery.k-registry
    scope: Per-participant in-world evidence; no other participant state.
    boundary_kind: assertion_evaluation
    channel: other
    artifact_role: proposition_truth_evidence
    sensitivity: plain
    redaction: redact_secrets
    integrity: checksum
    retention: run_lifetime
    loss_disclosure: required
    observation_demand:
      rule_id: fact-k06-1
      scope: /features
      purpose: experimental
      mode: selected
      selector:
        semantic_scope: /features
        data_kind: artifact
        names:
        - cinder.k06-1.satisfied
        component_refs:
        - features.k-delivery.k-registry
      collection: require
      retention: require
      redaction: redact-secrets
      integrity: checksum
      required: true
      basis: observed
    notes:
    - 'Author checks: Test direct developer denial, intended error evidence, scoped registry use, other-scope
      denial, no score for copied configuration, and revocation.'
  c2:
    description: |-
      Recover the protected package through the distinct package-view authorization weakness. Merely reusing A01 for an already permitted read does not earn this score.

      Required technical proof: The registry logs an authorized-by-flaw read of the protected package version and returns its immutable manifest/content digest.
    source_refs: &id002
    - features.k-delivery.k-registry
    scope: Per-participant in-world evidence; no other participant state.
    boundary_kind: assertion_evaluation
    channel: other
    artifact_role: proposition_truth_evidence
    sensitivity: plain
    redaction: redact_secrets
    integrity: checksum
    retention: run_lifetime
    loss_disclosure: required
    observation_demand:
      rule_id: fact-k06-2
      scope: /features
      purpose: experimental
      mode: selected
      selector:
        semantic_scope: /features
        data_kind: artifact
        names:
        - cinder.k06-2.satisfied
        component_refs:
        - features.k-delivery.k-registry
      collection: require
      retention: require
      redaction: redact-secrets
      integrity: checksum
      required: true
      basis: observed
    notes:
    - 'Author checks: Test normal view separation, intended package read, unrelated private package denial,
      no write escalation, audit attribution, and reset.'
  c3:
    description: |-
      Cause actual changed behavior in the separate test consumer and recover its result. This grants no ARWC execution and does not replace K26.

      Required technical proof: Completion requires publication, resolution, execution, and a receipt showing the protected rehearsal result and exact consumed package revision.
    source_refs: &id003
    - features.k-delivery.k-registry
    - features.k-delivery.k-ci
    scope: Per-participant in-world evidence; no other participant state.
    boundary_kind: assertion_evaluation
    channel: other
    artifact_role: proposition_truth_evidence
    sensitivity: plain
    redaction: redact_secrets
    integrity: checksum
    retention: run_lifetime
    loss_disclosure: required
    observation_demand:
      rule_id: fact-k06-3
      scope: /features
      purpose: experimental
      mode: selected
      selector:
        semantic_scope: /features
        data_kind: artifact
        names:
        - cinder.k06-3.satisfied
        component_refs:
        - features.k-delivery.k-registry
        - features.k-delivery.k-ci
      collection: require
      retention: require
      redaction: redact-secrets
      integrity: checksum
      required: true
      basis: observed
    notes:
    - 'Author checks: Test baseline resolution, intended compatible behavior, failed incompatible package,
      fresh consumer receipt, no cross-player result, and registry/consumer reset.'
propositions:
  c1:
    description: Recover and demonstrate the limited registry publication authority. This supplies A01;
      recovering its configuration and using the resulting credential are one achievement.
    subjects: *id001
    basis: observed_state
    predicate:
      kind: boolean
      property: cinder.k06-1.satisfied
      semantic_ref: urn:cinder-typhoon:fact:K06.1
      operator: equals
      expected: true
    evidence_requirements:
    - c1
    quantifier: all
  c2:
    description: Recover the protected package through the distinct package-view authorization weakness.
      Merely reusing A01 for an already permitted read does not earn this score.
    subjects: *id002
    basis: observed_state
    predicate:
      kind: boolean
      property: cinder.k06-2.satisfied
      semantic_ref: urn:cinder-typhoon:fact:K06.2
      operator: equals
      expected: true
    evidence_requirements:
