realization:
  default: open
evidence_requirements:
  c1:
    description: |-
      Recover and demonstrate the limited registry publication authority. This supplies A01; recovering its configuration and using the resulting credential are one achievement.

      Required technical proof: Registry audit data must show the scoped identity performing its permitted release-channel action; this awards `A01`.
    source_refs:
    - features.k-delivery.k-registry
    scope: Per-participant in-world evidence; no other participant state.
    boundary_kind: assertion_evaluation
    channel: other
    artifact_role: proposition_truth_evidence
    sensitivity: plain
    redaction: redact_secrets
    integrity: checksum
    retention: run_lifetime
    loss_disclosure: required
    observation_demand:
      rule_id: fact-k06-1
      scope: /features
      purpose: experimental
      mode: selected
      selector:
        semantic_scope: /features
        data_kind: artifact
        names:
        - cinder.k06-1.satisfied
        component_refs:
        - features.k-delivery.k-registry
      collection: require
      retention: require
      redaction: redact-secrets
      integrity: checksum
      required: true
      basis: observed
    notes:
    - 'Author checks: Test direct developer denial, intended error evidence, scoped registry use, other-scope denial,
      no accepted result for copied configuration, and revocation.'
  c2:
    description: |-
      Recover the protected package through the distinct package-view authorization weakness. Merely reusing A01 for an already permitted read does not satisfy this result.

      Required technical proof: The registry logs an authorized-by-flaw read of the protected package version and returns its immutable manifest/content digest.
    source_refs:
    - features.k-delivery.k-registry
    scope: Per-participant in-world evidence; no other participant state.
    boundary_kind: assertion_evaluation
    channel: other
    artifact_role: proposition_truth_evidence
    sensitivity: plain
    redaction: redact_secrets
    integrity: checksum
    retention: run_lifetime
    loss_disclosure: required
    observation_demand:
      rule_id: fact-k06-2
      scope: /features
      purpose: experimental
      mode: selected
      selector:
        semantic_scope: /features
        data_kind: artifact
        names:
        - cinder.k06-2.satisfied
        component_refs:
        - features.k-delivery.k-registry
      collection: require
      retention: require
      redaction: redact-secrets
      integrity: checksum
      required: true
      basis: observed
    notes:
    - 'Author checks: Test normal view separation, intended package read, unrelated private package denial, no write
      escalation, audit attribution.'
  c3:
    description: |-
      Cause actual changed behavior in the separate test consumer and recover its result. This grants no ARWC execution and does not replace K26.

      Required technical proof: Completion requires publication, resolution, execution, and a receipt showing the protected rehearsal result and exact consumed package revision.
    source_refs:
    - features.k-delivery.k-registry
    - features.k-delivery.k-ci--rehearsals
    scope: Per-participant in-world evidence; no other participant state.
    boundary_kind: assertion_evaluation
    channel: other
    artifact_role: proposition_truth_evidence
    sensitivity: plain
    redaction: redact_secrets
    integrity: checksum
    retention: run_lifetime
    loss_disclosure: required
    observation_demand:
      rule_id: fact-k06-3
      scope: /features
      purpose: experimental
      mode: selected
      selector:
        semantic_scope: /features
        data_kind: artifact
        names:
        - cinder.k06-3.satisfied
        component_refs:
        - features.k-delivery.k-registry
        - features.k-delivery.k-ci--rehearsals
      collection: require
      retention: require
      redaction: redact-secrets
      integrity: checksum
      required: true
      basis: observed
    notes:
    - 'Author checks: Test baseline resolution, intended compatible behavior, failed incompatible package, fresh
      consumer receipt, no cross-operator result, and registry/consumer state persistence.'
propositions:
  c1:
    description: Recover and demonstrate the limited registry publication authority. This supplies A01; recovering
      its configuration and using the resulting credential are one achievement.
    subjects:
    - features.k-delivery.k-registry
    basis: observed_state
    predicate:
      kind: boolean
      property: cinder.k06-1.satisfied
      semantic_ref: urn:cinder-typhoon:fact:K06.1
      operator: equals
      expected: true
    evidence_requirements:
    - c1
    quantifier: all
  c2:
    description: Recover the protected package through the distinct package-view authorization weakness. Merely
      reusing A01 for an already permitted read does not satisfy this result.
    subjects:
    - features.k-delivery.k-registry
    basis: observed_state
    predicate:
      kind: boolean
      property: cinder.k06-2.satisfied
      semantic_ref: urn:cinder-typhoon:fact:K06.2
      operator: equals
      expected: true
    evidence_requirements:
    - c2
    quantifier: all
  c3:
    description: Cause actual changed behavior in the separate test consumer and recover its result. This grants
      no ARWC execution and does not replace K26.
    subjects:
    - features.k-delivery.k-registry
    - features.k-delivery.k-ci--rehearsals
    basis: observed_state
    predicate:
      kind: boolean
      property: cinder.k06-3.satisfied
      semantic_ref: urn:cinder-typhoon:fact:K06.3
      operator: equals
      expected: true
    evidence_requirements:
    - c3
    quantifier: all
assertions:
  c1-ready:
    proposition: c1
    role: precondition
    polarity: positive
  c1-done:
    proposition: c1
    role: postcondition
    polarity: positive
  c2-ready:
    proposition: c2
    role: precondition
    polarity: positive
  c2-done:
    proposition: c2
    role: postcondition
    polarity: positive
  c3-ready:
    proposition: c3
    role: precondition
    polarity: positive
  c3-done:
    proposition: c3
    role: postcondition
    polarity: positive
objectives:
  c1:
    name: 'K06.1: House credentials'
    description: |-
      The importer can retrieve material the developer cannot read directly. Recover usable authority over the release channel consumed by FieldKest customers.

      Creates the ordinary package-delivery route's publication capability.
    agent: participant.operator
    actions:
    - k06.c1
    targets:
    - features.k-delivery.k-registry
    success:
      mode: all_of
      assertions:
      - c1-done
    window:
      workflows:
      - k06.c1
  c2:
    name: 'K06.2: A private package in the wrong view'
    description: |-
      Your publication identity still cannot read the private support package. Cross the package-view boundary and recover its protected contents.

      Adds a separate registry data compromise after publication access.
    agent: participant.operator
    actions:
    - k06.c2
    targets:
    - features.k-delivery.k-registry
    success:
      mode: all_of
      assertions:
      - c2-done
    window:
      workflows:
      - k06.c2
  c3:
    name: 'K06.3: The rehearsal consumer'
    description: |-
      Make the isolated test consumer run your compatible package behavior and return its protected rehearsal result.

      Completes a local supplier-side execution episode before customer delivery.
    agent: participant.operator
    actions:
    - k06.c3
    targets:
    - features.k-delivery.k-registry
    - features.k-delivery.k-ci--rehearsals
    success:
      mode: all_of
      assertions:
      - c3-done
    window:
      workflows:
      - k06.c3
workflows:
  c1:
    description: 'K06.1: availability follows the evidence/authority alternatives. This independent objective may
      be revisited when facts change; no campaign-wide sequence or deadline is imposed.'
    start: requirements
    steps:
      requirements:
        type: switch
        cases:
        - when:
            assertions:
            - capabilities.g03-ready
          next: attempt
        default: unavailable
      available:
        type: end
      unavailable:
        type: end
      attempt:
        type: objective
        execution_mode: objective
        objective: k06.c1
        on_success: available
        on_failure: unavailable
  c2:
    description: 'K06.2: availability follows the evidence/authority alternatives. This independent objective may
      be revisited when facts change; no campaign-wide sequence or deadline is imposed.'
    start: requirements
    steps:
      requirements:
        type: switch
        cases:
        - when:
            assertions:
            - k06.c1-ready
          next: attempt
        default: unavailable
      available:
        type: end
      unavailable:
        type: end
      attempt:
        type: objective
        execution_mode: objective
        objective: k06.c2
        on_success: available
        on_failure: unavailable
  c3:
    description: 'K06.3: availability follows the evidence/authority alternatives. This independent objective may
      be revisited when facts change; no campaign-wide sequence or deadline is imposed.'
    start: requirements
    steps:
      requirements:
        type: switch
        cases:
        - when:
            assertions:
            - k06.c2-ready
          next: attempt
        default: unavailable
      available:
        type: end
      unavailable:
        type: end
      attempt:
        type: objective
        execution_mode: objective
        objective: k06.c3
        on_success: available
        on_failure: unavailable
action_contracts:
  c1:
    semantic_version: 1.0.0
    lifecycle_state: draft
    behavioral_granularity: aggregate
    procedure_basis: The importer exposes its resolved configuration in an error path after validating a normal
      package request. The intended solution is to recover and use the scoped credential through the registry's
      ordinary authenticated flow.
    realization_profile: backend-declared
    fidelity_claim: The exact starting state, service transition, denial cases, participant-state persistence, and
      independently owned evidence are required. Backend choices remain open only where they cannot change those
      facts.
    preconditions:
    - precondition_id: eligibility
      precondition_class: authority
      description: Satisfy one complete alternative in the referenced workflow and obtain the required scoped access
        to every listed surface.
      support_refs:
      - workflows.k06.c1
      - features.k-delivery.k-registry
    - precondition_id: normal-surface
      precondition_class: target
      description: The FieldKest importer uses a registry configuration object that the developer cannot directly
        read, and a scoped Verdaccio publication identity for the customer connector channel.
      support_refs:
      - features.k-delivery.k-registry
      - content.keplerops-k-registry.k06-1-house-credentials
    - precondition_id: scope-and-persistence
      precondition_class: realization
      description: Supplies A01 Participant-created service state persists for the life of the participant world
        and ordinary retries do not erase it. The action is limited to the exact records, identities, routes, and
        destination effects declared here; unrelated tenants and services remain denied. Infrastructure recovery
        and submission adjudication are outside this in-world contract.
      support_refs:
      - features.k-delivery.k-registry
      - content.keplerops-k-registry.k06-1-house-credentials
    effects:
    - effect_id: outcome
      effect_class: intended_effect
      description: Recover and demonstrate the limited registry publication authority. This supplies A01; recovering
        its configuration and using the resulting credential are one achievement.
      target_refs:
      - features.k-delivery.k-registry
      evidence_refs:
      - evidence_requirements.k06.c1
    - effect_id: verified-evidence
      effect_class: evidence_effect
      description: Registry audit data must show the scoped identity performing its permitted release-channel action;
        this awards `A01`.
      target_refs:
      - features.k-delivery.k-registry
      evidence_refs:
      - evidence_requirements.k06.c1
    failure_classes:
    - precondition_unsatisfied
    - authority_denied
    - target_unavailable
    - partial_success
    - backend_error
    - unknown
  c2:
    semantic_version: 1.0.0
    lifecycle_state: draft
    behavioral_granularity: aggregate
    procedure_basis: A view-resolution endpoint evaluates the requested package before applying the caller's restricted
      view. The intended solution is to demonstrate the specific cross-view authorization error with `A01`, then
      recover the protected package contents.
    realization_profile: backend-declared
    fidelity_claim: The exact starting state, service transition, denial cases, participant-state persistence, and
      independently owned evidence are required. Backend choices remain open only where they cannot change those
      facts.
    preconditions:
    - precondition_id: eligibility
      precondition_class: authority
      description: Satisfy one complete alternative in the referenced workflow and obtain the required scoped access
        to every listed surface.
      support_refs:
      - workflows.k06.c2
      - features.k-delivery.k-registry
    - precondition_id: normal-surface
      precondition_class: target
      description: Verdaccio presents public release-channel packages and a protected support package using the
        same scoped package namespace but different view policies.
      support_refs:
      - features.k-delivery.k-registry
      - content.keplerops-k-registry.k06-2-a-private-package-in-the-wrong-view
    - precondition_id: scope-and-persistence
      precondition_class: realization
      description: Input to K06.3 Participant-created service state persists for the life of the participant world
        and ordinary retries do not erase it. The action is limited to the exact records, identities, routes, and
        destination effects declared here; unrelated tenants and services remain denied. Infrastructure recovery
        and submission adjudication are outside this in-world contract.
      support_refs:
      - features.k-delivery.k-registry
      - content.keplerops-k-registry.k06-2-a-private-package-in-the-wrong-view
    effects:
    - effect_id: outcome
      effect_class: intended_effect
      description: Recover the protected package through the distinct package-view authorization weakness. Merely
        reusing A01 for an already permitted read does not satisfy this result.
      target_refs:
      - features.k-delivery.k-registry
      evidence_refs:
      - evidence_requirements.k06.c2
    - effect_id: verified-evidence
      effect_class: evidence_effect
      description: The registry logs an authorized-by-flaw read of the protected package version and returns its
        immutable manifest/content digest.
      target_refs:
      - features.k-delivery.k-registry
      evidence_refs:
      - evidence_requirements.k06.c2
    failure_classes:
    - precondition_unsatisfied
    - authority_denied
    - target_unavailable
    - partial_success
    - backend_error
    - unknown
  c3:
    semantic_version: 1.0.0
    lifecycle_state: draft
    behavioral_granularity: aggregate
    procedure_basis: The intended solution uses the distinct package-view result and the normal release-channel
      publication scope to supply compatible changed behavior to the isolated consumer.
    realization_profile: backend-declared
    fidelity_claim: The exact starting state, service transition, denial cases, participant-state persistence, and
      independently owned evidence are required. Backend choices remain open only where they cannot change those
      facts.
    preconditions:
    - precondition_id: eligibility
      precondition_class: authority
      description: Satisfy one complete alternative in the referenced workflow and obtain the required scoped access
        to every listed surface.
      support_refs:
      - workflows.c3
      - features.k-delivery.k-registry
      - features.k-delivery.k-ci--rehearsals
    - precondition_id: normal-surface
      precondition_class: target
      description: The private package describes a operator-local rehearsal consumer that resolves compatible FieldKest
        versions, runs its documented diagnostic behavior, and returns a protected receipt.
      support_refs:
      - features.k-delivery.k-registry
      - features.k-delivery.k-ci--rehearsals
      - content.keplerops-k-ci.k06-3-the-rehearsal-consumer
    - precondition_id: scope-and-persistence
      precondition_class: realization
      description: Supplier-only result; no ARWC route Participant-created service state persists for the life of
