realization:
  default: open
evidence_requirements:
  c1:
    description: |-
      Recover the actual scoped publisher configuration from native Git history and demonstrate its authorization limits. It supports K06.3 but does not authorize the private package read in K06.2 or release administration.

      Required technical proof: The recovered native configuration and Git commit establish the account provenance. Actual scoped native registry authorization permits the intended connector publication while denying the independent private package and release-administration boundaries.
    source_refs:
    - features.k-delivery.k-source
    - features.k-delivery.k-registry
    scope: Per-participant in-world evidence; no other participant state.
    boundary_kind: assertion_evaluation
    channel: other
    artifact_role: proposition_truth_evidence
    sensitivity: plain
    redaction: redact_secrets
    integrity: checksum
    retention: run_lifetime
    loss_disclosure: required
    observation_demand:
      rule_id: fact-k06-1
      scope: /features
      purpose: experimental
      mode: selected
      selector:
        semantic_scope: /features
        data_kind: artifact
        names:
        - cinder.k06-1.satisfied
        component_refs:
        - features.k-delivery.k-source
        - features.k-delivery.k-registry
      collection: require
      retention: require
      redaction: redact-secrets
      integrity: checksum
      required: true
      basis: observed
    notes:
    - 'Author checks: Verify native Git discovery/history and removed-current-file behavior, working scoped publisher
      authentication, private package denial, release-administration denial and persistence without changing main
      or retained tags.'
  c2:
    description: |-
      Recover the distinct native CI reader configuration from the actual package-check build workspace/archive and use it to retrieve the private support package. Preserve the denial evidence for the publisher identity and the CI reader's publication boundary.

      Required technical proof: The native Jenkins build/workspace/archive establishes the independent CI credential provenance. A real private npm package read succeeds under that reader while publisher/private-read and reader/publish combinations remain denied.
    source_refs:
    - features.k-delivery.k-ci
    - features.k-delivery.k-registry
    scope: Per-participant in-world evidence; no other participant state.
    boundary_kind: assertion_evaluation
    channel: other
    artifact_role: proposition_truth_evidence
    sensitivity: plain
    redaction: redact_secrets
    integrity: checksum
    retention: run_lifetime
    loss_disclosure: required
    observation_demand:
      rule_id: fact-k06-2
      scope: /features
      purpose: experimental
      mode: selected
      selector:
        semantic_scope: /features
        data_kind: artifact
        names:
        - cinder.k06-2.satisfied
        component_refs:
        - features.k-delivery.k-ci
        - features.k-delivery.k-registry
      collection: require
      retention: require
      redaction: redact-secrets
      integrity: checksum
      required: true
      basis: observed
    notes:
    - 'Author checks: Verify actual native build execution and artifacts, distinct CI reader identity, private package
      metadata/tarball read, publisher private-read denial, CI publication denial and normal native role boundaries.'
  c3:
    description: |-
      Cause actual changed behavior in the separate test consumer and recover its result. This grants no ARWC execution and does not replace K26.

      Required technical proof: The native publication, immutable version, exact tarball digest and fresh isolated rehearsal result bind the executed package to its actual changed output and preserved tenant/asset/interface fields.
    source_refs:
    - features.k-delivery.k-registry
    - features.k-delivery.k-ci--rehearsals
    scope: Per-participant in-world evidence; no other participant state.
    boundary_kind: assertion_evaluation
    channel: other
    artifact_role: proposition_truth_evidence
    sensitivity: plain
    redaction: redact_secrets
    integrity: checksum
    retention: run_lifetime
    loss_disclosure: required
    observation_demand:
      rule_id: fact-k06-3
      scope: /features
      purpose: experimental
      mode: selected
      selector:
        semantic_scope: /features
        data_kind: artifact
        names:
        - cinder.k06-3.satisfied
        component_refs:
        - features.k-delivery.k-registry
        - features.k-delivery.k-ci--rehearsals
      collection: require
      retention: require
      redaction: redact-secrets
      integrity: checksum
      required: true
      basis: observed
    notes:
    - 'Author checks: Verify native publish and duplicate-version rejection, changed compatible module execution,
      required-local-file or interface failure, preserved tenant and asset fields, and no release-administration
      authority.'
propositions:
  c1:
    description: Recover and demonstrate the limited registry publication authority. This supplies A01; recovering
      its configuration and using the resulting credential are one achievement.
    subjects:
    - features.k-delivery.k-source
    - features.k-delivery.k-registry
    basis: observed_state
    predicate:
      kind: boolean
      property: cinder.k06-1.satisfied
      semantic_ref: urn:cinder-typhoon:fact:K06.1
      operator: equals
      expected: true
    evidence_requirements:
    - c1
    quantifier: all
  c2:
    description: Recover the protected package through the distinct package-view authorization weakness. Merely
      reusing A01 for an already permitted read does not satisfy this result.
    subjects:
    - features.k-delivery.k-ci
    - features.k-delivery.k-registry
    basis: observed_state
    predicate:
      kind: boolean
      property: cinder.k06-2.satisfied
      semantic_ref: urn:cinder-typhoon:fact:K06.2
      operator: equals
      expected: true
    evidence_requirements:
    - c2
    quantifier: all
  c3:
    description: Cause actual changed behavior in the separate test consumer and recover its result. This grants
      no ARWC execution and does not replace K26.
    subjects:
    - features.k-delivery.k-registry
    - features.k-delivery.k-ci--rehearsals
    basis: observed_state
    predicate:
      kind: boolean
      property: cinder.k06-3.satisfied
      semantic_ref: urn:cinder-typhoon:fact:K06.3
      operator: equals
      expected: true
    evidence_requirements:
    - c3
    quantifier: all
assertions:
  c1-ready:
    proposition: c1
    role: precondition
    polarity: positive
  c1-done:
    proposition: c1
    role: postcondition
    polarity: positive
  c2-ready:
    proposition: c2
    role: precondition
    polarity: positive
  c2-done:
    proposition: c2
    role: postcondition
    polarity: positive
  c3-ready:
    proposition: c3
    role: precondition
    polarity: positive
  c3-done:
    proposition: c3
    role: postcondition
    polarity: positive
objectives:
  c1:
    name: 'K06.1: House credentials'
    description: |-
      The delivery team removed its local npm configuration from the current source tree. Recover usable publishing authority from the retained native history and establish its limits.

      Creates the ordinary package-delivery route's publication capability.
    assigned_participant: participant.operator
    actions:
    - k06.c1
    targets:
    - features.k-delivery.k-source
    - features.k-delivery.k-registry
    success:
      mode: all_of
      assertions:
      - c1-done
    window:
      workflows:
      - k06.c1
  c2:
    name: 'K06.2: A private package in the wrong view'
    description: |-
      Your publishing account cannot read the private support package. Investigate the independent package-check build and recover the distinct CI identity that can.

      Adds a separate registry data compromise after publication access.
    assigned_participant: participant.operator
    actions:
    - k06.c2
    targets:
    - features.k-delivery.k-ci
    - features.k-delivery.k-registry
    success:
      mode: all_of
      assertions:
      - c2-done
    window:
      workflows:
      - k06.c2
  c3:
    name: 'K06.3: The rehearsal consumer'
    description: |-
      Publish a compatible connector package under the authority you recovered, then make the isolated rehearsal consumer run its actual code and return your changed result.

      Completes a local supplier-side execution episode before customer delivery.
    assigned_participant: participant.operator
    actions:
    - k06.c3
    targets:
    - features.k-delivery.k-registry
    - features.k-delivery.k-ci--rehearsals
    success:
      mode: all_of
      assertions:
      - c3-done
    window:
      workflows:
      - k06.c3
workflows:
  c1:
    description: 'K06.1: availability follows the evidence/authority alternatives. This independent objective may
      be revisited when facts change; no campaign-wide sequence or deadline is imposed.'
    start: requirements
    steps:
      requirements:
        type: switch
        cases:
        - when:
            assertions:
            - capabilities.g03-ready
          next: attempt
        default: unavailable
      available:
        type: end
      unavailable:
        type: end
      attempt:
        type: objective
        execution_mode: objective
        objective: k06.c1
        on_success: available
        on_failure: unavailable
  c2:
    description: 'K06.2: availability follows the evidence/authority alternatives. This independent objective may
      be revisited when facts change; no campaign-wide sequence or deadline is imposed.'
    start: requirements
    steps:
      requirements:
        type: switch
        cases:
        - when:
            assertions:
            - k06.c1-ready
          next: attempt
        default: unavailable
      available:
        type: end
      unavailable:
        type: end
      attempt:
        type: objective
        execution_mode: objective
        objective: k06.c2
        on_success: available
        on_failure: unavailable
  c3:
    description: 'K06.3: availability follows the evidence/authority alternatives. This independent objective may
      be revisited when facts change; no campaign-wide sequence or deadline is imposed.'
    start: requirements
    steps:
      requirements:
        type: switch
        cases:
        - when:
            assertions:
            - k06.c2-ready
          next: attempt
        default: unavailable
      available:
        type: end
      unavailable:
        type: end
      attempt:
        type: objective
        execution_mode: objective
        objective: k06.c3
        on_success: available
        on_failure: unavailable
action_contracts:
  c1:
    semantic_version: 1.0.0
    lifecycle_state: draft
    behavioral_granularity: aggregate
    procedure_basis: Follow the delivery branch history, recover the historical client configuration and identify
      its actual native publishing account. Establish its scope through ordinary Verdaccio requests; it publishes
      the connector but cannot read the private support package or administer releases.
    realization_profile: backend-declared
    fidelity_claim: The exact starting state, service transition, denial cases, participant-state persistence, and
      independently owned evidence are required. Backend choices remain open only where they cannot change those
      facts.
    preconditions:
    - precondition_id: eligibility
      precondition_class: authority
      description: Satisfy one complete alternative in the referenced workflow and obtain the required scoped access
        to every listed surface.
      support_refs:
      - workflows.c1
      - features.k-delivery.k-source
      - features.k-delivery.k-registry
    - precondition_id: normal-surface
      precondition_class: target
      description: The existing private Gitea connector repository contains the delivery-operations branch with
        real commits for the delivery workspace. Current source uses managed credentials, but an earlier committed
        native npm configuration remains in Git history.
      support_refs:
      - features.k-delivery.k-source
      - features.k-delivery.k-registry
      - content.keplerops-k-registry.k06-1-house-credentials
    - precondition_id: scope-and-persistence
      precondition_class: realization
      description: Supplies A01 Participant-created service state persists for the life of the participant world
        and ordinary retries do not erase it. The action is limited to the exact records, identities, routes, and
        destination effects declared here; unrelated tenants and services remain denied. Infrastructure recovery
        and submission adjudication are outside this in-world contract.
      support_refs:
      - features.k-delivery.k-source
      - features.k-delivery.k-registry
    effects:
    - effect_id: outcome
      effect_class: intended_effect
      description: Recover the actual scoped publisher configuration from native Git history and demonstrate its
        authorization limits. It supports K06.3 but does not authorize the private package read in K06.2 or release
        administration.
      target_refs:
      - features.k-delivery.k-source
      - features.k-delivery.k-registry
      evidence_refs:
      - evidence_requirements.k06.c1
    - effect_id: verified-evidence
      effect_class: evidence_effect
      description: The recovered native configuration and Git commit establish the account provenance. Actual scoped
        native registry authorization permits the intended connector publication while denying the independent private
        package and release-administration boundaries.
      target_refs:
      - features.k-delivery.k-source
      - features.k-delivery.k-registry
      evidence_refs:
      - evidence_requirements.k06.c1
    failure_classes:
    - precondition_unsatisfied
    - authority_denied
    - target_unavailable
    - partial_success
    - backend_error
    - unknown
  c2:
    semantic_version: 1.0.0
    lifecycle_state: draft
    behavioral_granularity: aggregate
    procedure_basis: Correlate the package-check job and archived workspace with its separate CI reader account.
      Recover that native client configuration and use the distinct identity against Verdaccio to read the private
      support package. The publisher identity remains denied throughout.
    realization_profile: backend-declared
    fidelity_claim: The exact starting state, service transition, denial cases, participant-state persistence, and
      independently owned evidence are required. Backend choices remain open only where they cannot change those
      facts.
    preconditions:
    - precondition_id: eligibility
      precondition_class: authority
      description: Satisfy one complete alternative in the referenced workflow and obtain the required scoped access
        to every listed surface.
      support_refs:
      - workflows.c2
      - features.k-delivery.k-ci
      - features.k-delivery.k-registry
    - precondition_id: normal-surface
      precondition_class: target
      description: The native Jenkins fieldlink-package-check job uses its stored CI reader credential through standard
        Credentials Binding. Its fixed npm step creates a genuine client configuration in the build workspace and
        archives that workspace with the actual package metadata and connector tarball.
      support_refs:
      - features.k-delivery.k-ci
      - features.k-delivery.k-registry
      - content.keplerops-k-registry.k06-2-a-private-package-in-the-wrong-view
    - precondition_id: scope-and-persistence
      precondition_class: realization
      description: Input to K06.3 Participant-created service state persists for the life of the participant world
        and ordinary retries do not erase it. The action is limited to the exact records, identities, routes, and
        destination effects declared here; unrelated tenants and services remain denied. Infrastructure recovery
        and submission adjudication are outside this in-world contract.
      support_refs:
      - features.k-delivery.k-ci
      - features.k-delivery.k-registry
    effects:
    - effect_id: outcome
      effect_class: intended_effect
      description: Recover the distinct native CI reader configuration from the actual package-check build workspace/archive
        and use it to retrieve the private support package. Preserve the denial evidence for the publisher identity
        and the CI reader's publication boundary.
      target_refs:
      - features.k-delivery.k-ci
      - features.k-delivery.k-registry
      evidence_refs:
      - evidence_requirements.k06.c2
    - effect_id: verified-evidence
      effect_class: evidence_effect
      description: The native Jenkins build/workspace/archive establishes the independent CI credential provenance.
        A real private npm package read succeeds under that reader while publisher/private-read and reader/publish
        combinations remain denied.
      target_refs:
      - features.k-delivery.k-ci
      - features.k-delivery.k-registry
      evidence_refs:
