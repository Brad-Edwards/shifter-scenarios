    - effect_id: verified-evidence
      effect_class: evidence_effect
      description: The native publication, immutable version, exact tarball digest and fresh isolated rehearsal
        result bind the executed package to its actual changed output and preserved tenant/asset/interface fields.
      target_refs:
      - features.k-delivery.k-registry
      - features.k-delivery.k-ci--rehearsals
      evidence_refs:
      - evidence_requirements.k06.c3
