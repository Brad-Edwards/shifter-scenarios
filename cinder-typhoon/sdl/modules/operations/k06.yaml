        execution_mode: objective
        objective: k06.c2
        on_success: available
        on_failure: unavailable
  c3:
    description: 'K06.3: availability follows the evidence/authority alternatives. This independent objective
      may be revisited when facts change; no campaign-wide sequence or deadline is imposed.'
    start: requirements
    steps:
      requirements:
        type: switch
        cases:
        - when:
            assertions:
            - k06.c2-ready
          next: attempt
        default: unavailable
      available:
        type: end
      unavailable:
        type: end
      attempt:
        type: objective
        execution_mode: objective
        objective: k06.c3
        on_success: available
        on_failure: unavailable
action_contracts:
  c1:
    semantic_version: 1.0.0
    lifecycle_state: draft
    behavioral_granularity: aggregate
    procedure_basis: The importer exposes its resolved configuration in an error path after validating
      a normal package request. The intended solution is to recover and use the scoped credential through
      the registry's ordinary authenticated flow.
    realization_profile: backend-declared
    fidelity_claim: The authored mechanism, normal behavior, proof, authority limits, and reset requirements
      are required. Hosting and their implementation remain backend-declared.
    preconditions:
    - precondition_id: eligibility
      precondition_class: authority
      description: Satisfy one complete alternative in the referenced workflow and obtain the required
        scoped access to every listed surface.
      support_refs:
      - workflows.k06.c1
      - features.k-delivery.k-registry
    - precondition_id: normal-surface
      precondition_class: target
      description: The FieldKest importer uses a registry configuration object that the developer cannot
        directly read, and a scoped Verdaccio publication identity for the customer connector channel.
      support_refs: *id004
    - precondition_id: boundaries-and-reset
      precondition_class: realization
      description: |-
        These are requirements on the realized environment. Apply reset behavior only when a participant reset is requested, not on challenge completion.

        The identity is limited to the designated package scope and cannot read private support packages, administer registry policy, or act as the customer; reset revokes it.
      support_refs:
      - features.k-delivery.k-registry
    effects:
    - effect_id: outcome
      effect_class: intended_effect
      description: Recover and demonstrate the limited registry publication authority. This supplies A01;
        recovering its configuration and using the resulting credential are one achievement.
      target_refs: *id004
      evidence_refs:
      - evidence_requirements.k06.c1
    - effect_id: verified-evidence
      effect_class: evidence_effect
      description: Registry audit data must show the scoped identity performing its permitted release-channel
        action; this awards `A01`.
      target_refs: *id001
      evidence_refs:
      - evidence_requirements.k06.c1
    failure_classes:
    - precondition_unsatisfied
    - authority_denied
    - target_unavailable
    - partial_success
    - backend_error
    - unknown
  c2:
    semantic_version: 1.0.0
    lifecycle_state: draft
    behavioral_granularity: aggregate
    procedure_basis: A view-resolution endpoint evaluates the requested package before applying the caller's
      restricted view. The intended solution is to demonstrate the specific cross-view authorization error
      with `A01`, then recover the protected package contents.
    realization_profile: backend-declared
    fidelity_claim: The authored mechanism, normal behavior, proof, authority limits, and reset requirements
      are required. Hosting and their implementation remain backend-declared.
    preconditions:
    - precondition_id: eligibility
      precondition_class: authority
      description: Satisfy one complete alternative in the referenced workflow and obtain the required
        scoped access to every listed surface.
      support_refs:
      - workflows.k06.c2
      - features.k-delivery.k-registry
    - precondition_id: normal-surface
      precondition_class: target
      description: Verdaccio presents public release-channel packages and a protected support package
        using the same scoped package namespace but different view policies.
      support_refs: *id005
    - precondition_id: boundaries-and-reset
      precondition_class: realization
      description: |-
        These are requirements on the realized environment. Apply reset behavior only when a participant reset is requested, not on challenge completion.

        The flaw is limited to one named support package and read-only; publication, policy changes, and unrelated private packages remain denied. Reset clears events.
      support_refs:
      - features.k-delivery.k-registry
    effects:
    - effect_id: outcome
      effect_class: intended_effect
      description: Recover the protected package through the distinct package-view authorization weakness.
        Merely reusing A01 for an already permitted read does not earn this score.
      target_refs: *id005
      evidence_refs:
      - evidence_requirements.k06.c2
    - effect_id: verified-evidence
      effect_class: evidence_effect
      description: The registry logs an authorized-by-flaw read of the protected package version and returns
        its immutable manifest/content digest.
      target_refs: *id002
      evidence_refs:
      - evidence_requirements.k06.c2
    failure_classes:
    - precondition_unsatisfied
    - authority_denied
    - target_unavailable
    - partial_success
    - backend_error
    - unknown
  c3:
    semantic_version: 1.0.0
    lifecycle_state: draft
    behavioral_granularity: aggregate
    procedure_basis: The intended solution uses the distinct package-view result and the normal release-channel
      publication scope to supply compatible changed behavior to the isolated consumer.
    realization_profile: backend-declared
    fidelity_claim: The authored mechanism, normal behavior, proof, authority limits, and reset requirements
      are required. Hosting and their implementation remain backend-declared.
    preconditions:
    - precondition_id: eligibility
      precondition_class: authority
      description: Satisfy one complete alternative in the referenced workflow and obtain the required
        scoped access to every listed surface.
      support_refs:
      - workflows.k06.c3
      - features.k-delivery.k-registry
      - features.k-delivery.k-ci
    - precondition_id: normal-surface
      precondition_class: target
      description: The private package describes a player-local rehearsal consumer that resolves compatible
        FieldKest versions, runs its documented diagnostic behavior, and returns a protected receipt.
      support_refs: *id006
    - precondition_id: boundaries-and-reset
      precondition_class: realization
      description: |-
        These are requirements on the realized environment. Apply reset behavior only when a participant reset is requested, not on challenge completion.

        The rehearsal consumer has synthetic input and no ARWC delivery route; every player receives separate registry versions and receipt state. Reset removes them.
      support_refs:
      - features.k-delivery.k-registry
      - features.k-delivery.k-ci
    effects:
    - effect_id: outcome
      effect_class: intended_effect
      description: Cause actual changed behavior in the separate test consumer and recover its result.
        This grants no ARWC execution and does not replace K26.
      target_refs: *id006
      evidence_refs:
      - evidence_requirements.k06.c3
    - effect_id: verified-evidence
      effect_class: evidence_effect
      description: Completion requires publication, resolution, execution, and a receipt showing the protected
        rehearsal result and exact consumed package revision.
      target_refs: *id003
      evidence_refs:
      - evidence_requirements.k06.c3
    failure_classes:
    - precondition_unsatisfied
    - authority_denied
    - target_unavailable
    - partial_success
    - backend_error
    - unknown
