        identities, routes, and destination effects declared here; unrelated tenants and services remain denied.
        Infrastructure recovery and submission adjudication are outside this in-world contract.
      support_refs:
      - features.k-delivery.k-registry
      - features.k-delivery.k-ci--rehearsals
    effects:
    - effect_id: outcome
      effect_class: intended_effect
      description: Cause actual changed behavior in the separate test consumer and recover its result. This grants
        no ARWC execution and does not replace K26.
      target_refs:
      - features.k-delivery.k-registry
      - features.k-delivery.k-ci--rehearsals
      evidence_refs:
      - evidence_requirements.k06.c3
    - effect_id: verified-evidence
      effect_class: evidence_effect
      description: Completion requires publication, resolution, execution, and a receipt showing the protected rehearsal
        result and exact consumed package revision.
      target_refs:
      - features.k-delivery.k-registry
      - features.k-delivery.k-ci--rehearsals
      evidence_refs:
      - evidence_requirements.k06.c3
    failure_classes:
    - precondition_unsatisfied
    - authority_denied
    - target_unavailable
    - partial_success
    - backend_error
    - unknown
