objectives:
  c1:
    name: 'W32.1: The replay''s pieces'
    description: |-
      Recover the replay program's relevant entity and component structure for the outlet example.

      Introduces the replay as an engineered model with inspectable behavior.
    agent: participant.operator
    actions:
    - w32.c1
    targets: &id005
    - features.a-engineering.a-engineering
    success:
      mode: all_of
      assertions:
      - c1-done
    window:
      workflows:
      - w32.c1
  c2:
    name: 'W32.2: The systems that update it'
    description: |-
      Reconstruct the update behavior needed to reproduce the outlet example's state changes.

      Builds a useful model of the replay program.
    agent: participant.operator
    actions:
    - w32.c2
    targets: &id006
    - features.a-engineering.a-engineering
    success:
      mode: all_of
      assertions:
      - c2-done
    window:
      workflows:
      - w32.c2
  c3:
    name: 'W32.3: The condition the old model used'
    description: |-
      Recover the hidden state condition that makes the old replay approve the disputed schedule.

      Explains a specific engineering decision rather than merely reversing arbitrary code.
    agent: participant.operator
    actions:
    - w32.c3
    targets: &id007
    - features.a-engineering.a-engineering
    success:
      mode: all_of
      assertions:
      - c3-done
    window:
      workflows:
      - w32.c3
  c4:
    name: 'W32.4: Replay is not reality'
    description: |-
      Construct a replay trace that exposes why the old project's accepted schedule disagrees with the current process observations.

      Completes the history thread with an engineering explanation useful to W33.
    agent: participant.operator
    actions:
    - w32.c4
    targets: &id008
    - features.a-engineering.a-engineering
    success:
      mode: all_of
      assertions:
      - c4-done
    window:
      workflows:
      - w32.c4
workflows:
  c1:
    description: 'W32.1: availability follows the evidence/authority alternatives. This independent objective
      may be revisited when facts change; no campaign-wide sequence or deadline is imposed.'
    start: requirements
    steps:
      requirements:
        type: switch
        cases:
        - when:
            assertions:
            - capabilities.w21-revision-ready
          next: attempt
        default: unavailable
      available:
        type: end
      unavailable:
