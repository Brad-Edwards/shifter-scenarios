    lifecycle_state: draft
    behavioral_granularity: aggregate
    procedure_basis: |-
      The authored condition is **historical replay versus independent current truth**. Witness trace TRACE-R19-DISPUTED shows old acceptance at 12.40 ML for a 1.00 ML request while current independent observations yield 11.40 ML and reject the old sufficiency claim. The hand build must preserve every named version, encoding, bound, validation order, identity, and unaffected field; substituting a generic vulnerable service would change the task.

      The required result is: Produce a coherent witness of the old acceptance and current disagreement. It supplies optional model evidence, not live authority or a replacement for current observations. Process quantities and state separation are governed by `arwc-process-model.md`, specifically `TRACE-R19-DISPUTED`.
    realization_profile: backend-declared
    fidelity_claim: The exact initial state, versions, formats, validation order, authorization decisions, process
      quantities, denial cases, persistent state, and independently owned evidence are required. Implementation
      choices remain open only when none of those facts change.
    preconditions:
    - precondition_id: eligibility
      precondition_class: authority
      description: Satisfy one complete alternative in the referenced workflow and obtain the required scoped access
        to every listed surface.
      support_refs:
      - workflows.w32.c4
      - features.a-engineering.a-engineering
    - precondition_id: normal-surface
      precondition_class: target
      description: |-
        `a-engineering` and its `engineering-workbench` application own this part of **Replay is not reality**. Normal behavior applies the declared identity, tenant, object, revision, and process bindings and returns or changes only the caller-scoped object. The exact initial state is: Witness trace TRACE-R19-DISPUTED shows old acceptance at 12.40 ML for a 1.00 ML request while current independent observations yield 11.40 ML and reject the old sufficiency claim.

        Native bindings:

        - `a-engineering.a-engineering/engineering-workbench/replay-is-not-reality`
        - `a-engineering.a-engineering/filesystem:/var/lib/arwc-engineering/artifacts/replay-is-not-reality`

        The private service-loader contract is `content.arwc-a-engineering.w32-4-replay-is-not-reality`. It freezes accepted and denied requests, state transition, persistence, and evidence; it does not seed a successful result.
      support_refs:
      - features.a-engineering.a-engineering
      - content.arwc-a-engineering.w32-4-replay-is-not-reality
    - precondition_id: scope-and-persistence
      precondition_class: realization
      description: |-
        The result remains local evidence unless a downstream workflow explicitly names it. Tenant-scoped mutations, sessions that have not expired, generated artifacts, and audits persist across ordinary retries and later sessions. Initial immutable records remain unchanged unless the named route explicitly permits a field-level revision. Infrastructure recovery and submission adjudication are external to the SDL.

        The behavior is limited to the named fictional objects and bounded service operation. It provides no general shell, arbitrary network target, unrelated district access, real process interface, or authority not expressly declared by the card.
      support_refs:
      - features.a-engineering.a-engineering
    effects:
    - effect_id: outcome
      effect_class: intended_effect
      description: Produce a coherent witness of the old acceptance and current disagreement. It supplies optional
        model evidence, not live authority or a replacement for current observations.
      target_refs:
      - features.a-engineering.a-engineering
      evidence_refs:
      - evidence_requirements.w32.c4
    - effect_id: verified-evidence
      effect_class: evidence_effect
      description: |-
        The owning service writes an immutable audit for the accepted request and result. Caller-supplied output, a local copy, or knowledge of an identifier is not sufficient. Completion is evaluated from fresh service-owned evidence after the action. It cannot issue the identity, create the mutation, move a simulated actuator, or fabricate a downstream acceptance needed to prove itself.

        Evidence sources are `features.a-engineering.a-engineering`. A wrong identifier, stale revision, replayed one-time value, different checkpoint, or cross-tenant artifact is rejected.
      target_refs:
      - features.a-engineering.a-engineering
      evidence_refs:
      - evidence_requirements.w32.c4
    failure_classes:
    - precondition_unsatisfied
    - authority_denied
    - target_unavailable
    - partial_success
    - backend_error
    - unknown
