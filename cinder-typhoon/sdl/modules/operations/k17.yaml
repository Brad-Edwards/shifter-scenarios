objectives:
  c1:
    name: 'K17.1: A support session left behind'
    description: |-
      Recover usable access to the support application and retrieve the session's protected handover.

      Gives the operator a second approachable supplier identity.
    agent: participant.operator
    actions:
    - k17.c1
    targets:
    - features.k-delivery.k-support
    success:
      mode: all_of
      assertions:
      - c1-done
    window:
      workflows:
      - k17.c1
  c2:
    name: 'K17.2: A different way to recover'
    description: |-
      The support account's recovery process exposes a separate opportunity. Establish the alternate support identity and recover its private recovery note.

      Adds a distinct identity compromise beyond the retained session.
    agent: participant.operator
    actions:
    - k17.c2
    targets:
    - features.k-delivery.k-support
    success:
      mode: all_of
      assertions:
      - c2-done
    window:
      workflows:
      - k17.c2
  c3:
    name: 'K17.3: Which customers belong here'
    description: |-
      Recover the support identity's private customer-assignment record and the unresolved case actually assigned to it.

      Makes support access useful through customer context.
    agent: participant.operator
    actions:
    - k17.c3
    targets:
    - features.k-delivery.k-support
    success:
      mode: all_of
      assertions:
      - c3-done
    window:
      workflows:
      - k17.c3
  c4:
    name: 'K17.4: A delegated support action'
    description: |-
      The ARWC case is assigned to the support engineer. Make the delegation workflow route a copy of its restricted diagnostic handover to the alternate reviewer named in Cinder's case note.

      Demonstrates an action boundary beyond reading assigned cases.
    agent: participant.operator
    actions:
    - k17.c4
    targets:
    - features.k-delivery.k-support
    success:
      mode: all_of
      assertions:
      - c4-done
    window:
      workflows:
      - k17.c4
