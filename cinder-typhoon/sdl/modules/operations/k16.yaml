        objective: k16.c2
        on_success: available
        on_failure: unavailable
  c3:
    description: 'K16.3: availability follows the evidence/authority alternatives. This independent objective
      may be revisited when facts change; no campaign-wide sequence or deadline is imposed.'
    start: requirements
    steps:
      requirements:
