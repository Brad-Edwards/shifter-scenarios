objectives:
  c1:
    name: 'W09.1: Water already promised'
    description: |-
      Recover the current allocation ledger and identify the commitments ARWC has made for the approaching dry period.

      Makes water availability a business constraint rather than an abstract number.
    agent: participant.operator
    actions:
    - w09.c1
    targets: &id005
    - features.a-corporate.a-data
    success:
      mode: all_of
      assertions:
      - c1-done
    window:
      workflows:
      - w09.c1
  c2:
    name: 'W09.2: The meter''s own account'
    description: |-
      Recover the separate meter export for the same planning period, including the identifiers and units needed to interpret it.

      Provides independent evidence against the business report.
    agent: participant.operator
    actions:
    - w09.c2
    targets: &id006
    - features.a-corporate.a-data
    success:
      mode: all_of
      assertions:
      - c2-done
    window:
      workflows:
      - w09.c2
  c3:
    name: 'W09.3: The missing megalitre'
    description: |-
      Reconcile the allocation ledger and meter export. Establish the actual reserve discrepancy hidden by the reassuring business report.

      Reveals why Cinder's target is financially vulnerable: the company has committed water that its reassuring report misrepresents. The investigation changes the player's understanding of the target before it changes the plant.
    agent: participant.operator
    actions:
    - w09.c3
    targets: &id007
    - features.a-corporate.a-data
    success:
      mode: all_of
      assertions:
      - c3-done
    window:
      workflows:
      - w09.c3
  c4:
    name: 'W09.4: From the report to the live feed'
    description: |-
      Combine the customer data you understand with the recovered read-integration contract. Reach the matching current process feed and recover a fresh observation.

      Completes the corporate-integration route to OT visibility.
    agent: participant.operator
    actions:
    - w09.c4
    targets: &id008
    - features.a-dmz.a-data-bridge
    success:
      mode: all_of
      assertions:
      - c4-done
    window:
      workflows:
      - w09.c4
workflows:
  c1:
    description: 'W09.1: availability follows the evidence/authority alternatives. This independent objective
      may be revisited when facts change; no campaign-wide sequence or deadline is imposed.'
    start: requirements
    steps:
      requirements:
        type: switch
        cases:
        - when:
            assertions:
            - capabilities.corporate-ready
          next: attempt
        default: unavailable
      available:
        type: end
      unavailable:
        type: end
      attempt:
        type: objective
        execution_mode: objective
        objective: w09.c1
        on_success: available
        on_failure: unavailable
  c2:
    description: 'W09.2: availability follows the evidence/authority alternatives. This independent objective
      may be revisited when facts change; no campaign-wide sequence or deadline is imposed.'
    start: requirements
