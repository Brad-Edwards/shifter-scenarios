evidence_requirements:
  c1:
    description: Recover the actual ledger with its district and reporting period. It is one input to
      W09.3, not a conclusion about usable reserve.
    source_refs: &id001
    - features.a-corporate.a-data
    scope: Per-participant in-world evidence; no other participant state.
    boundary_kind: assertion_evaluation
    channel: other
    artifact_role: proposition_truth_evidence
    sensitivity: plain
    redaction: redact_secrets
    integrity: checksum
    retention: run_lifetime
    loss_disclosure: required
    observation_demand:
      rule_id: fact-w09-1
      scope: /features
      purpose: experimental
      mode: selected
      selector:
        semantic_scope: /features
        data_kind: artifact
        names:
        - cinder.w09-1.satisfied
        component_refs:
        - features.a-corporate.a-data
      collection: require
      retention: require
      redaction: redact-secrets
      integrity: checksum
      required: true
      basis: observed
  c2:
    description: Recover the meter export and its source binding. The ledger does not contain this evidence;
      multiple columns do not earn additional scores.
    source_refs: &id002
    - features.a-corporate.a-data
    scope: Per-participant in-world evidence; no other participant state.
    boundary_kind: assertion_evaluation
    channel: other
    artifact_role: proposition_truth_evidence
    sensitivity: plain
    redaction: redact_secrets
    integrity: checksum
    retention: run_lifetime
    loss_disclosure: required
    observation_demand:
      rule_id: fact-w09-2
      scope: /features
      purpose: experimental
      mode: selected
      selector:
        semantic_scope: /features
        data_kind: artifact
        names:
        - cinder.w09-2.satisfied
        component_refs:
        - features.a-corporate.a-data
      collection: require
      retention: require
      redaction: redact-secrets
      integrity: checksum
      required: true
      basis: observed
  c3:
    description: |-
      Produce the correctly bound unit, period, and identifier reconciliation with the actual reserve discrepancy and its supporting records. This supplies W09.DATA. The explanation must account for the physical assets represented by the records.

      The completed intelligence view puts the company's reported position beside the corrected reserve and allocation commitments, identifying the records responsible for the difference. The player sees what the missing water means to ARWC, not just a corrected total. This is an evidence-based reveal in Cinder's briefing; it neither edits the corporate ledger nor moves water, and it supplies no later tariff or control capability.
    source_refs: &id003
    - features.a-corporate.a-data
    scope: Per-participant in-world evidence; no other participant state.
    boundary_kind: assertion_evaluation
    channel: other
    artifact_role: proposition_truth_evidence
    sensitivity: plain
    redaction: redact_secrets
    integrity: checksum
    retention: run_lifetime
    loss_disclosure: required
    observation_demand:
      rule_id: fact-w09-3
      scope: /features
      purpose: experimental
      mode: selected
      selector:
        semantic_scope: /features
        data_kind: artifact
        names:
        - cinder.w09-3.satisfied
        component_refs:
        - features.a-corporate.a-data
      collection: require
      retention: require
      redaction: redact-secrets
      integrity: checksum
      required: true
      basis: observed
  c4:
    description: Resolve the active data binding and demonstrate a scoped read from the intended process
      feed. This supplies the integration variant of OT_READ; stale exports and unrelated feeds do not
      count.
    source_refs: &id004
    - features.a-dmz.a-data-bridge
    scope: Per-participant in-world evidence; no other participant state.
