objectives:
  c1:
    name: 'This action: Water already promised'
    description: |-
      Recover the current allocation ledger and identify the commitments ARWC has made for the approaching dry period.

      Makes water availability a business constraint rather than an abstract number.
    agent: participant.operator
    actions:
    - w09.c1
    targets:
    - features.a-corporate.a-data
    success:
      mode: all_of
      assertions:
      - c1-done
    window:
      workflows:
      - w09.c1
  c2:
    name: 'This action: The meter''s own account'
    description: |-
      Recover the separate meter export for the same planning period, including the identifiers and units needed to interpret it.

      Provides independent evidence against the business report.
    agent: participant.operator
    actions:
    - w09.c2
    targets:
    - features.a-corporate.a-data
    success:
      mode: all_of
      assertions:
      - c2-done
    window:
      workflows:
      - w09.c2
  c3:
    name: 'This action: The missing megalitre'
    description: |-
      Reconcile the allocation ledger and meter export. Establish the actual reserve discrepancy hidden by the reassuring business report.

      Reveals why Cinder's target is financially vulnerable: the company has committed water that its reassuring report misrepresents. The investigation changes the operator's understanding of the target before it changes the plant.
    agent: participant.operator
    actions:
    - w09.c3
    targets:
    - features.a-corporate.a-data
    success:
      mode: all_of
      assertions:
      - c3-done
    window:
      workflows:
      - w09.c3
  c4:
    name: 'This action: From the report to the live feed'
    description: |-
      Combine the customer data you understand with the recovered read-integration contract. Reach the matching current process feed and recover a fresh observation.

      Completes the corporate-integration route to OT visibility.
    agent: participant.operator
    actions:
    - w09.c4
    targets:
    - features.a-dmz.a-data-bridge
    success:
      mode: all_of
      assertions:
      - c4-done
    window:
      workflows:
      - w09.c4
