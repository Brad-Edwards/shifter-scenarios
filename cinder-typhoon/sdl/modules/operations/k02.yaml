    subjects:
    - features.k-delivery.k-ci
    - features.k-delivery.k-source
    basis: observed_state
    predicate:
      kind: boolean
      property: cinder.k02-1.satisfied
      semantic_ref: urn:cinder-typhoon:fact:K02.1
      operator: equals
      expected: true
    evidence_requirements:
