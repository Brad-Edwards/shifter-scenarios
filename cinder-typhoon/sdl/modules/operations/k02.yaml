assertions:
  c1-ready:
    proposition: c1
    role: precondition
    polarity: positive
  c1-done:
    proposition: c1
    role: postcondition
    polarity: positive
  c2-ready:
    proposition: c2
    role: precondition
    polarity: positive
  c2-done:
    proposition: c2
    role: postcondition
    polarity: positive
  c3-ready:
    proposition: c3
    role: precondition
    polarity: positive
  c3-done:
    proposition: c3
    role: postcondition
    polarity: positive
objectives:
  c1:
    name: 'K02.1: The missing fixture'
    description: |-
      The report test has been failing since its reference fixture disappeared. Recover the fixture from the development artifacts so the intended report is visible again.

      Exposes the legitimate baseline behind a report Cinder will change.
    agent: participant.operator
    actions:
    - k02.c1
    targets:
    - features.k-delivery.k-ci
    - features.k-delivery.k-source
    success:
      mode: all_of
      assertions:
      - c1-done
    window:
      workflows:
      - k02.c1
  c2:
    name: 'K02.2: An input outside its lane'
    description: |-
      The test importer is supposed to accept only job inputs. Make it expose the separate review note that the ordinary test view withholds.

      Introduces a small application boundary through an everyday developer workflow.
    agent: participant.operator
    actions:
    - k02.c2
    targets:
    - features.k-delivery.k-ci
    success:
      mode: all_of
      assertions:
      - c2-done
    window:
      workflows:
      - k02.c2
  c3:
    name: 'K02.3: Green, with our changes'
    description: |-
      Change the report produced by the test job while keeping the interface its caller expects. The support engineer should receive Cinder's version with a successful job result.

      Completes an early supply-chain episode in which a real support workflow accepts the operator's altered work as a successful report. A newcomer can see someone else's business process consuming their change.
    agent: participant.operator
    actions:
    - k02.c3
    targets:
    - features.k-delivery.k-ci
    - features.k-delivery.k-support
    success:
      mode: all_of
      assertions:
      - c3-done
    window:
      workflows:
      - k02.c3
workflows:
  c1:
    description: 'K02.1: availability follows the evidence/authority alternatives. This independent objective may
      be revisited when facts change; no campaign-wide sequence or deadline is imposed.'
    start: requirements
    steps:
      requirements:
        type: switch
        cases:
        - when:
            assertions:
            - participant.foothold-ready
          next: attempt
        default: unavailable
      available:
        type: end
      unavailable:
        type: end
      attempt:
        type: objective
        execution_mode: objective
        objective: k02.c1
        on_success: available
        on_failure: unavailable
  c2:
    description: 'K02.2: availability follows the evidence/authority alternatives. This independent objective may
      be revisited when facts change; no campaign-wide sequence or deadline is imposed.'
    start: requirements
    steps:
      requirements:
        type: switch
        cases:
        - when:
            assertions:
            - participant.foothold-ready
          next: attempt
        default: unavailable
      available:
        type: end
      unavailable:
        type: end
      attempt:
        type: objective
        execution_mode: objective
        objective: k02.c2
        on_success: available
        on_failure: unavailable
  c3:
    description: 'K02.3: availability follows the evidence/authority alternatives. This independent objective may
      be revisited when facts change; no campaign-wide sequence or deadline is imposed.'
    start: requirements
    steps:
      requirements:
        type: switch
        cases:
        - when:
            assertions:
            - k02.c1-ready
            - k02.c2-ready
          next: attempt
        default: unavailable
      available:
        type: end
      unavailable:
        type: end
      attempt:
        type: objective
        execution_mode: objective
        objective: k02.c3
        on_success: available
        on_failure: unavailable
action_contracts:
  c1:
    semantic_version: 1.0.0
    lifecycle_state: draft
    behavioral_granularity: aggregate
    procedure_basis: The fixture was removed from the current checkout but retained in real source or artifact history.
      The intended solution is evidence-led recovery and revision correlation.
    realization_profile: backend-declared
    fidelity_claim: The exact starting state, service transition, denial cases, participant-state persistence, and
      independently owned evidence are required. Backend choices remain open only where they cannot change those
      facts.
    preconditions:
    - precondition_id: eligibility
      precondition_class: authority
      description: Satisfy one complete alternative in the referenced workflow and obtain the required scoped access
        to every listed surface.
      support_refs:
      - workflows.c1
      - features.k-delivery.k-ci
      - features.k-delivery.k-source
    - precondition_id: normal-surface
      precondition_class: target
      description: Gitea project history, local build artifacts, and a test-job record describe a deleted report
        fixture and its matching test revision.
      support_refs:
      - features.k-delivery.k-ci
      - features.k-delivery.k-source
      - content.keplerops-k-ci.k02-1-the-missing-fixture
    - precondition_id: scope-and-persistence
      precondition_class: realization
      description: Baseline for K02.3 Participant-created service state persists for the life of the participant
        world and ordinary retries do not erase it. The action is limited to the exact records, identities, routes,
        and destination effects declared here; unrelated tenants and services remain denied. Infrastructure recovery
        and submission adjudication are outside this in-world contract.
      support_refs:
      - features.k-delivery.k-ci
      - features.k-delivery.k-source
    effects:
    - effect_id: outcome
      effect_class: intended_effect
      description: Recover the missing fixture and identify its matching test revision. This supplies the baseline
        for K02.3.
      target_refs:
      - features.k-delivery.k-ci
      - features.k-delivery.k-source
      evidence_refs:
