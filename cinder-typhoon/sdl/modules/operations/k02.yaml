      operator: equals
      expected: true
    evidence_requirements:
    - c2
    quantifier: all
  c3:
    description: |-
      Produce a fresh altered report accepted by the test interface. Its content and job binding must agree; an edited local file or green status alone is insufficient.

      The conclusion shows the report as received in the support handover, with the operator's changed result alongside the successful job status and preserved ordinary fields. It uses the report already produced by the task; there is no extra delivery step or accepted result. This is the first small example of a reassuring status accompanying a compromised result, a theme that returns at ARWC.
    subjects:
    - features.k-delivery.k-ci
    - features.k-delivery.k-support
    basis: observed_state
    predicate:
      kind: boolean
      property: cinder.k02-3.satisfied
      semantic_ref: urn:cinder-typhoon:fact:K02.3
      operator: equals
      expected: true
    evidence_requirements:
