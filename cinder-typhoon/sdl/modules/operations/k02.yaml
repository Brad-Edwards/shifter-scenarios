realization:
  default: open
evidence_requirements:
  c1:
    description: |-
      Recover the missing fixture and identify its matching test revision. This supplies the baseline for K02.3.

      Required technical proof: Objective evaluation verifies the fixture digest, historical revision, and test binding, then makes the baseline available to K02.3.
    source_refs:
    - features.k-delivery.k-ci
    - features.k-delivery.k-source
    scope: Per-participant in-world evidence; no other participant state.
    boundary_kind: assertion_evaluation
    channel: other
    artifact_role: proposition_truth_evidence
    sensitivity: plain
    redaction: redact_secrets
    integrity: checksum
    retention: run_lifetime
    loss_disclosure: required
    observation_demand:
      rule_id: fact-k02-1
      scope: /features
      purpose: experimental
      mode: selected
      selector:
        semantic_scope: /features
        data_kind: artifact
        names:
        - cinder.k02-1.satisfied
        component_refs:
        - features.k-delivery.k-ci
        - features.k-delivery.k-source
      collection: require
      retention: require
      redaction: redact-secrets
      integrity: checksum
      required: true
      basis: observed
    notes:
    - 'Author checks: Verify head lacks the fixture, one provenance path finds it, an unrelated historical file
      fails, the test revision matches.'
  c2:
    description: |-
      Recover the restricted review note and the test job's input contract through the importer. These supply evidence for K02.3; the read does not itself grant job-editing or execution authority.

      Required technical proof: The importer logs the resolved object ID and job contract; the expected restricted note is attached as operator evidence without giving job-edit rights.
    source_refs:
    - features.k-delivery.k-ci
    scope: Per-participant in-world evidence; no other participant state.
    boundary_kind: assertion_evaluation
    channel: other
    artifact_role: proposition_truth_evidence
    sensitivity: plain
    redaction: redact_secrets
    integrity: checksum
    retention: run_lifetime
    loss_disclosure: required
    observation_demand:
      rule_id: fact-k02-2
      scope: /features
      purpose: experimental
      mode: selected
      selector:
        semantic_scope: /features
        data_kind: artifact
        names:
        - cinder.k02-2.satisfied
        component_refs:
        - features.k-delivery.k-ci
      collection: require
      retention: require
      redaction: redact-secrets
      integrity: checksum
      required: true
      basis: observed
    notes:
    - 'Author checks: Test normal import, intended cross-namespace read, rejection outside allowlist, no job configuration
      mutation, exact object audit.'
  c3:
    description: |-
      Produce a fresh altered report accepted by the test interface. Its content and job binding must agree; an edited local file or green status alone is insufficient.

      The conclusion shows the report as received in the support handover, with the operator's changed result alongside the successful job status and preserved ordinary fields. It uses the report already produced by the service task; there is no extra delivery step or accepted result. This is the first small example of a reassuring status accompanying a compromised result, a theme that returns at ARWC.

      Required technical proof: Completion is a green job whose fresh report has the expected baseline fields and operator change; the support handover displays that actual output and the job receipt binds it.
    source_refs:
    - features.k-delivery.k-ci
    - features.k-delivery.k-support
    scope: Per-participant in-world evidence; no other participant state.
    boundary_kind: assertion_evaluation
    channel: other
    artifact_role: proposition_truth_evidence
    sensitivity: plain
    redaction: redact_secrets
    integrity: checksum
    retention: run_lifetime
    loss_disclosure: required
    observation_demand:
      rule_id: fact-k02-3
      scope: /features
      purpose: experimental
      mode: selected
      selector:
        semantic_scope: /features
        data_kind: artifact
        names:
        - cinder.k02-3.satisfied
        component_refs:
        - features.k-delivery.k-ci
        - features.k-delivery.k-support
      collection: require
      retention: require
      redaction: redact-secrets
      integrity: checksum
      required: true
      basis: observed
    notes:
    - 'Author checks: Test baseline green behavior, interface-breaking failure, intended compatible changed report,
      handover receipt correlation, no accepted result for a local edit.'
