    - precondition_id: normal-surface
      precondition_class: target
      description: The FieldKest test importer accepts a documented job-input archive and returns a test report;
        its repository contains a separate restricted review-note object.
      support_refs:
      - features.k-delivery.k-ci
      - content.keplerops-k-ci.k02-2-an-input-outside-its-lane
    - precondition_id: scope-and-persistence
      precondition_class: realization
      description: Input for K02.3 Participant-created service state persists for the life of the participant world
