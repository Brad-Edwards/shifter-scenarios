        and the documented read interface.
  c3-records-1:
    type: dataset
    description: |-
      W14.3: required in-world starting records. Allocate each record to its actual owning service; this declaration does not duplicate secrets across services or grant their visibility.
      The earned contractor identity, current read contract from W14.2, and a retained client example for the obsolete interface. The example cannot retrieve the required current observation unchanged.
    target: a-dmz.a-contractor-bridge
    tags:
    - synthetic
    - w14
    - c3
    - seed-requirement
    items:
    - name: starting-records
      description: The earned contractor identity, current read contract from W14.2, and a retained client
