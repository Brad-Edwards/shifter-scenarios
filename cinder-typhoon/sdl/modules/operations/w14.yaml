objectives:
  c1:
    name: 'This action: The field bag'
    description: |-
      Recover the inspection's field export from the contractor workspace.

      Provides engineering material after the identity pivot.
    agent: participant.operator
    actions:
    - w14.c1
    targets:
    - features.a-maintenance.a-contractors
    success:
      mode: all_of
      assertions:
      - c1-done
    window:
      workflows:
      - w14.c1
  c2:
    name: 'This action: The service that replaced it'
    description: |-
      Distinguish the obsolete field-service reference from the active process-data service and identify the current read contract.

      Makes the operator resolve product history before relying on an endpoint.
    agent: participant.operator
    actions:
    - w14.c2
    targets:
    - features.a-dmz.a-contractor-bridge
    success:
      mode: all_of
      assertions:
      - c2-done
    window:
      workflows:
      - w14.c2
  c3:
    name: 'This action: A fresh reading from the field'
    description: |-
      Adapt the contractor's retained field client to the current read interface. Recover fresh outlet observations under the inspection's correct asset scope.

      Completes the second ordinary route to OT visibility.
    agent: participant.operator
    actions:
    - w14.c3
    targets:
    - features.a-dmz.a-contractor-bridge
    success:
      mode: all_of
      assertions:
      - c3-done
    window:
      workflows:
      - w14.c3
workflows:
  c1:
    description: 'This action: availability follows the evidence/authority alternatives. This independent objective
      may be revisited when facts change; no global sequence or deadline is imposed.'
    start: requirements
    steps:
      requirements:
        type: switch
        cases:
        - when:
            assertions:
            - capabilities.w13-session-ready
          next: attempt
        default: unavailable
      available:
        type: end
      unavailable:
        type: end
      attempt:
        type: objective
        execution_mode: objective
        objective: w14.c1
        on_success: available
        on_failure: unavailable
