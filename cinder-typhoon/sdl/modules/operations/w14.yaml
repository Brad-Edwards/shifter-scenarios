content:
  c1-records-1:
    type: dataset
    description: |-
      W14.1: required in-world starting records. Allocate each record to its actual owning service; this declaration does not duplicate secrets across services or grant their visibility.
      The contractor's field-work view, a retained field export, service revision records, and the documented read interface.
    target: a-maintenance.a-contractors
    tags:
    - synthetic
    - w14
    - c1
    - seed-requirement
    items:
    - name: starting-records
      description: The contractor's field-work view, a retained field export, service revision records,
        and the documented read interface.
  c2-records-1:
    type: dataset
    description: |-
      W14.2: required in-world starting records. Allocate each record to its actual owning service; this declaration does not duplicate secrets across services or grant their visibility.
      The contractor's field-work view, a retained field export, service revision records, and the documented read interface.
