realization:
  default: open
evidence_requirements:
  c1:
    description: Recover the actual field export with its inspection binding. It supplies references,
      not proof that every referenced service is current.
    source_refs: &id001
    - features.a-maintenance.a-contractors
    scope: Per-participant in-world evidence; no other participant state.
    boundary_kind: assertion_evaluation
    channel: other
    artifact_role: proposition_truth_evidence
    sensitivity: plain
    redaction: redact_secrets
    integrity: checksum
    retention: run_lifetime
    loss_disclosure: required
    observation_demand:
      rule_id: fact-w14-1
      scope: /features
      purpose: experimental
      mode: selected
      selector:
        semantic_scope: /features
        data_kind: artifact
        names:
        - cinder.w14-1.satisfied
        component_refs:
        - features.a-maintenance.a-contractors
      collection: require
      retention: require
      redaction: redact-secrets
      integrity: checksum
      required: true
      basis: observed
  c2:
    description: Recover the active service and revision binding supported by the field evidence. A reachable
      obsolete service is insufficient.
    source_refs: &id002
    - features.a-dmz.a-contractor-bridge
    scope: Per-participant in-world evidence; no other participant state.
    boundary_kind: assertion_evaluation
    channel: other
    artifact_role: proposition_truth_evidence
    sensitivity: plain
    redaction: redact_secrets
    integrity: checksum
    retention: run_lifetime
    loss_disclosure: required
    observation_demand:
      rule_id: fact-w14-2
      scope: /features
      purpose: experimental
      mode: selected
      selector:
        semantic_scope: /features
        data_kind: artifact
        names:
        - cinder.w14-2.satisfied
        component_refs:
        - features.a-dmz.a-contractor-bridge
      collection: require
      retention: require
      redaction: redact-secrets
      integrity: checksum
      required: true
      basis: observed
  c3:
    description: Demonstrate a compatible client request yielding fresh observations for the correct inspection
      and asset. This supplies W14.READ and OT_READ. Locating the current service or logging in without
      adapting the retained client is not a second achievement.
    source_refs: &id003
    - features.a-dmz.a-contractor-bridge
    scope: Per-participant in-world evidence; no other participant state.
    boundary_kind: assertion_evaluation
    channel: other
    artifact_role: proposition_truth_evidence
    sensitivity: plain
    redaction: redact_secrets
    integrity: checksum
    retention: run_lifetime
    loss_disclosure: required
    observation_demand:
      rule_id: fact-w14-3
      scope: /features
      purpose: experimental
      mode: selected
      selector:
        semantic_scope: /features
        data_kind: artifact
        names:
        - cinder.w14-3.satisfied
        component_refs:
        - features.a-dmz.a-contractor-bridge
      collection: require
      retention: require
      redaction: redact-secrets
      integrity: checksum
      required: true
      basis: observed
propositions:
  c1:
    description: Recover the actual field export with its inspection binding. It supplies references,
      not proof that every referenced service is current.
    subjects: *id001
    basis: observed_state
    predicate:
      kind: boolean
      property: cinder.w14-1.satisfied
      semantic_ref: urn:cinder-typhoon:fact:W14.1
      operator: equals
      expected: true
    evidence_requirements:
    - c1
    quantifier: all
  c2:
    description: Recover the active service and revision binding supported by the field evidence. A reachable
      obsolete service is insufficient.
    subjects: *id002
    basis: observed_state
    predicate:
      kind: boolean
      property: cinder.w14-2.satisfied
      semantic_ref: urn:cinder-typhoon:fact:W14.2
      operator: equals
      expected: true
    evidence_requirements:
    - c2
    quantifier: all
  c3:
    description: Demonstrate a compatible client request yielding fresh observations for the correct inspection
      and asset. This supplies W14.READ and OT_READ. Locating the current service or logging in without
      adapting the retained client is not a second achievement.
    subjects: *id003
    basis: observed_state
    predicate:
      kind: boolean
      property: cinder.w14-3.satisfied
      semantic_ref: urn:cinder-typhoon:fact:W14.3
      operator: equals
      expected: true
    evidence_requirements:
    - c3
    quantifier: all
assertions:
  c1-ready:
    proposition: c1
    role: precondition
    polarity: positive
  c1-done:
    proposition: c1
    role: postcondition
    polarity: positive
  c2-ready:
    proposition: c2
    role: precondition
    polarity: positive
  c2-done:
    proposition: c2
    role: postcondition
    polarity: positive
  c3-ready:
    proposition: c3
    role: precondition
    polarity: positive
  c3-done:
    proposition: c3
    role: postcondition
    polarity: positive
objectives:
  c1:
    name: 'W14.1: The field bag'
    description: |-
      Recover the inspection's field export from the contractor workspace.

      Provides engineering material after the identity pivot.
    agent: participant.operator
    actions:
    - w14.c1
    targets: &id004
    - features.a-maintenance.a-contractors
    success:
      mode: all_of
      assertions:
      - c1-done
    window:
      workflows:
      - w14.c1
  c2:
    name: 'W14.2: The service that replaced it'
    description: |-
      Distinguish the obsolete field-service reference from the active process-data service and identify the current read contract.

      Makes the player resolve product history before relying on an endpoint.
    agent: participant.operator
    actions:
    - w14.c2
    targets: &id005
    - features.a-dmz.a-contractor-bridge
    success:
      mode: all_of
      assertions:
      - c2-done
    window:
      workflows:
      - w14.c2
  c3:
    name: 'W14.3: A fresh reading from the field'
    description: |-
      Adapt the contractor's retained field client to the current read interface. Recover fresh outlet observations under the inspection's correct asset scope.

      Completes the second ordinary route to OT visibility.
    agent: participant.operator
    actions:
    - w14.c3
    targets: &id006
    - features.a-dmz.a-contractor-bridge
    success:
      mode: all_of
      assertions:
      - c3-done
    window:
      workflows:
      - w14.c3
workflows:
  c1:
    description: 'W14.1: availability follows the evidence/authority alternatives. This independent objective
      may be revisited when facts change; no campaign-wide sequence or deadline is imposed.'
    start: requirements
    steps:
      requirements:
        type: switch
        cases:
        - when:
            assertions:
            - capabilities.w13-session-ready
          next: attempt
        default: unavailable
      available:
        type: end
      unavailable:
        type: end
      attempt:
        type: objective
        execution_mode: objective
        objective: w14.c1
        on_success: available
        on_failure: unavailable
  c2:
    description: 'W14.2: availability follows the evidence/authority alternatives. This independent objective
      may be revisited when facts change; no campaign-wide sequence or deadline is imposed.'
    start: requirements
    steps:
      requirements:
        type: switch
        cases:
        - when:
            assertions:
            - w14.c1-ready
          next: attempt
        default: unavailable
      available:
        type: end
      unavailable:
        type: end
      attempt:
        type: objective
        execution_mode: objective
        objective: w14.c2
        on_success: available
        on_failure: unavailable
  c3:
    description: 'W14.3: availability follows the evidence/authority alternatives. This independent objective
      may be revisited when facts change; no campaign-wide sequence or deadline is imposed.'
    start: requirements
    steps:
      requirements:
        type: switch
        cases:
        - when:
            assertions:
            - w14.c2-ready
          next: attempt
        default: unavailable
      available:
        type: end
      unavailable:
        type: end
      attempt:
        type: objective
        execution_mode: objective
        objective: w14.c3
        on_success: available
        on_failure: unavailable
