      This card is an exact discovery, interpretation, or reconciliation task rather than an additional privilege flaw. Contractor workspace export FIELD-BAG-CRR-4417-R3 contains inspection binding, obsolete fieldbag/v1 client, service manifest, and expected outlet identifiers. The result must come from the declared source and bindings, not from a duplicate clue or pre-completed record.

      The required result is: Recover the actual field export with its inspection binding. It supplies references, not proof that every referenced service is current.
    realization_profile: backend-declared
    fidelity_claim: The exact initial state, versions, formats, validation order, authorization decisions, process
      quantities, denial cases, persistent state, and independently owned evidence are required. Implementation
      choices remain open only when none of those facts change.
