        component_refs:
        - features.a-engineering.a-hmi
      collection: require
      retention: require
      redaction: redact-secrets
      integrity: checksum
      required: true
      basis: observed
  c4:
    description: Produce the correctly bound observation trace and reference-event relationship. This
