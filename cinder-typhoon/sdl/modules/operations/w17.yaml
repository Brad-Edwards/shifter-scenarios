objectives:
  c1:
    name: 'This action: The reservoir''s present tense'
    description: Record the reservoir's current measured state from the live operator view. Keep measured values
      separate from the controller's accepted settings and bind both to one UTC observation time.
    assigned_participant: participant.operator
    actions:
    - w17.c1
    targets:
    - features.a-engineering.a-hmi
    - features.a-engineering.a-historian
    success:
      mode: all_of
      assertions:
      - c1-done
    window:
      workflows:
      - w17.c1
  c2:
    name: 'This action: The mode the plant is in'
    description: Use the real operator and equipment views to identify the current controller mode, command owner,
      field-data state, and both outlet permissives at one UTC observation time.
    assigned_participant: participant.operator
    actions:
    - w17.c2
    targets:
    - features.a-engineering.a-hmi
    success:
      mode: all_of
      assertions:
      - c2-done
    window:
      workflows:
      - w17.c2
  c3:
    name: 'This action: The instrument in the note'
    description: Use the installed engineering reference to map the outlet B physical instrument to its IEC variable,
      OPC UA NodeId, historian series, and unit. Verify that the live point exists.
    assigned_participant: participant.operator
    actions:
    - w17.c3
    targets:
    - features.a-engineering.a-engineering
    - features.a-engineering.a-historian
    success:
      mode: all_of
      assertions:
      - c3-done
    window:
      workflows:
      - w17.c3
  c4:
    name: 'This action: The first live trace'
    description: Correlate one bounded live outlet B observation across FUXA, the OPC UA controller point, and PostgreSQL
      process history. Establish that position and measured flow belong to the same interval and point.
    assigned_participant: participant.operator
    actions:
    - w17.c4
    targets:
    - features.a-engineering.a-hmi
    - features.a-engineering.a-historian
    - features.a-control.a-instruments
    success:
      mode: all_of
      assertions:
      - c4-done
    window:
      workflows:
      - w17.c4
