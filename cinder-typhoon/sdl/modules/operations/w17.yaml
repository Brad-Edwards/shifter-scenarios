assertions:
  c1-ready:
    proposition: c1
    role: precondition
    polarity: positive
  c1-done:
    proposition: c1
    role: postcondition
    polarity: positive
  c2-ready:
    proposition: c2
    role: precondition
    polarity: positive
  c2-done:
    proposition: c2
    role: postcondition
    polarity: positive
  c3-ready:
    proposition: c3
    role: precondition
    polarity: positive
  c3-done:
    proposition: c3
    role: postcondition
    polarity: positive
  c4-ready:
    proposition: c4
    role: precondition
    polarity: positive
  c4-done:
    proposition: c4
    role: postcondition
    polarity: positive
objectives:
  c1:
    name: 'W17.1: The reservoir''s present tense'
    description: |-
      Recover the reservoir's current measured state for the specified observation interval. Distinguish measured values from requested settings.

      Provides an approachable first result after the OT visibility pivot.
    agent: participant.operator
    actions:
    - w17.c1
    targets: &id005
    - features.a-engineering.a-hmi
    success:
      mode: all_of
      assertions:
      - c1-done
    window:
      workflows:
      - w17.c1
  c2:
    name: 'W17.2: The mode the plant is in'
    description: |-
      Recover the current operating-mode record and identify what the process presently permits.

      Establishes that available commands depend on operating state.
    agent: participant.operator
    actions:
    - w17.c2
    targets: &id006
    - features.a-engineering.a-hmi
    success:
      mode: all_of
      assertions:
      - c2-done
    window:
      workflows:
      - w17.c2
  c3:
    name: 'W17.3: The instrument in the note'
    description: |-
      Find the instrument described in the controls engineer's note and recover its correct observation identifier.

      Connects engineering prose to a usable observation.
    agent: participant.operator
    actions:
    - w17.c3
    targets: &id007
    - features.a-engineering.a-hmi
    success:
      mode: all_of
      assertions:
      - c3-done
    window:
      workflows:
      - w17.c3
  c4:
    name: 'W17.4: The first live trace'
    description: |-
      Correlate the routine commissioning reference event with independent process observations and establish which changes belong to that event.

      Makes a documented event visibly correspond to the process.
    agent: participant.operator
    actions:
    - w17.c4
    targets: &id008
    - features.a-engineering.a-hmi
    - features.a-control.a-instruments
    success:
      mode: all_of
      assertions:
      - c4-done
    window:
      workflows:
      - w17.c4
workflows:
  c1:
    description: 'W17.1: availability follows the evidence/authority alternatives. This independent objective
      may be revisited when facts change; no campaign-wide sequence or deadline is imposed.'
    start: requirements
    steps:
      requirements:
        type: switch
        cases:
        - when:
            assertions:
            - capabilities.ot-read-ready
          next: attempt
        default: unavailable
      available:
        type: end
      unavailable:
        type: end
      attempt:
        type: objective
        execution_mode: objective
        objective: w17.c1
        on_success: available
        on_failure: unavailable
  c2:
    description: 'W17.2: availability follows the evidence/authority alternatives. This independent objective
      may be revisited when facts change; no campaign-wide sequence or deadline is imposed.'
    start: requirements
    steps:
