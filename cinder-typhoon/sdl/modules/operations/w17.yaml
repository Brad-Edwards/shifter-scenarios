objectives:
  c1:
    name: 'This action: The reservoir''s present tense'
    description: |-
      Recover the reservoir's current measured state for the specified observation interval. Distinguish measured values from requested settings.

      Provides an approachable first result after the OT visibility pivot.
    agent: participant.operator
    actions:
    - w17.c1
    targets:
    - features.a-engineering.a-hmi
    success:
      mode: all_of
      assertions:
      - c1-done
    window:
      workflows:
      - w17.c1
  c2:
    name: 'This action: The mode the plant is in'
    description: |-
      Recover the current operating-mode record and identify what the process presently permits.

      Establishes that available commands depend on operating state.
    agent: participant.operator
    actions:
    - w17.c2
    targets:
    - features.a-engineering.a-hmi
    success:
      mode: all_of
      assertions:
      - c2-done
    window:
      workflows:
      - w17.c2
  c3:
    name: 'This action: The instrument in the note'
    description: |-
      Find the instrument described in the controls engineer's note and recover its correct observation identifier.

      Connects engineering prose to a usable observation.
    agent: participant.operator
    actions:
    - w17.c3
    targets:
    - features.a-engineering.a-hmi
    success:
      mode: all_of
      assertions:
      - c3-done
    window:
      workflows:
      - w17.c3
  c4:
    name: 'This action: The first live trace'
    description: |-
      Correlate the routine commissioning reference event with independent process observations and establish which changes belong to that event.

      Makes a documented event visibly correspond to the process.
    agent: participant.operator
    actions:
    - w17.c4
    targets:
    - features.a-engineering.a-hmi
    - features.a-control.a-instruments
    success:
      mode: all_of
      assertions:
      - c4-done
    window:
      workflows:
      - w17.c4
