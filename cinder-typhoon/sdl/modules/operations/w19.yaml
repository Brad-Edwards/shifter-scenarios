evidence_requirements:
  c1:
    description: Recover the correct diagnostic and project-family binding. K28 can help locate it but
      is not a prerequisite.
    source_refs: &id001
    - features.a-engineering.a-engineering
    scope: Per-participant in-world evidence; no other participant state.
    boundary_kind: assertion_evaluation
    channel: other
    artifact_role: proposition_truth_evidence
    sensitivity: plain
    redaction: redact_secrets
    integrity: checksum
    retention: run_lifetime
    loss_disclosure: required
    observation_demand:
      rule_id: fact-w19-1
      scope: /features
      purpose: experimental
      mode: selected
      selector:
        semantic_scope: /features
        data_kind: artifact
        names:
        - cinder.w19-1.satisfied
        component_refs:
        - features.a-engineering.a-engineering
      collection: require
      retention: require
      redaction: redact-secrets
      integrity: checksum
      required: true
      basis: observed
  c2:
    description: Produce the correct alternate-path result for the supplied input. Naming an execution
      mode without recovering behavior is insufficient.
    source_refs: &id002
    - features.a-engineering.a-engineering
    scope: Per-participant in-world evidence; no other participant state.
    boundary_kind: assertion_evaluation
    channel: other
    artifact_role: proposition_truth_evidence
