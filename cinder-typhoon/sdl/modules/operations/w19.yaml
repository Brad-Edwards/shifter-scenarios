      redaction: redact-secrets
      integrity: checksum
      required: true
      basis: observed
  c4:
    description: |-
      Recover the actual outlet mapping. This supplies W19.MAP and MAPPING only; W09's allocation evidence and W21's deployed revision remain separate requirements.

      The conclusion connects the reconstructed diagnostic's result to the physical outlet group and the supplied observations. It earns the same recognition as W18.4: the player can identify the part of the reservoir their values describe. This route uses its own recovered evidence and requires neither the ordinary mapping challenges nor a new live actuation.
    source_refs: &id004
    - features.a-engineering.a-engineering
    scope: Per-participant in-world evidence; no other participant state.
