objectives:
  c1:
    name: 'W19.1: The diagnostic nobody retired'
    description: |-
      Recover the retained engineering diagnostic associated with the outlet records and identify its actual project family.

      Opens an optional reverse-engineering route through product history.
    agent: participant.operator
    actions:
    - w19.c1
    targets: &id005
    - features.a-engineering.a-engineering
    success:
      mode: all_of
      assertions:
      - c1-done
    window:
      workflows:
      - w19.c1
  c2:
    name: 'W19.2: A second interpretation'
    description: |-
      Reconstruct the diagnostic behavior that its initial analysis view does not explain and reproduce the supplied distinguishing result.

      Reveals that the apparent program is incomplete.
    agent: participant.operator
    actions:
    - w19.c2
    targets: &id006
    - features.a-engineering.a-engineering
    success:
      mode: all_of
      assertions:
      - c2-done
    window:
      workflows:
      - w19.c2
  c3:
    name: 'W19.3: The hidden check'
    description: |-
      Recover the diagnostic's hidden validation logic well enough to reproduce its decisions on the specified engineering records.

      Builds a substantive model of the diagnostic's actual checks.
    agent: participant.operator
    actions:
    - w19.c3
    targets: &id007
    - features.a-engineering.a-engineering
    success:
      mode: all_of
      assertions:
      - c3-done
    window:
      workflows:
      - w19.c3
  c4:
    name: 'W19.4: A map from the old diagnostic'
    description: |-
      Use the reconstructed diagnostic to recover a valid mapping of the current outlet group from the supplied observations.

      Provides an advanced alternative to the ordinary mapping work.
    agent: participant.operator
    actions:
    - w19.c4
    targets: &id008
    - features.a-engineering.a-engineering
    success:
      mode: all_of
      assertions:
      - c4-done
    window:
      workflows:
      - w19.c4
workflows:
  c1:
    description: 'W19.1: availability follows the evidence/authority alternatives. This independent objective
      may be revisited when facts change; no campaign-wide sequence or deadline is imposed.'
    start: requirements
    steps:
      requirements:
        type: switch
        cases:
        - when:
            assertions:
            - capabilities.ot-read-ready
          next: attempt
        default: unavailable
      available:
