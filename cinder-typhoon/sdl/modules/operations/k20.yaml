realization:
  default: open
evidence_requirements:
  c1:
    description: |-
      Demonstrate the authenticated service action and recover its bound record. Repeating K19's delegated probe does not count.

      Required technical proof: Completion is observed by the owning service from the fresh result and its immutable audit correlation. The evidence binds the participant, accepted identity or job, exact input and output identifiers, relevant revision or digest, and destination-side observation where a second service consumes the result. Objective evaluation does not create the result or grant authority.
    source_refs:
    - features.k-corporate.k-identity--delegation
    scope: Per-participant in-world evidence; no other participant state.
    boundary_kind: assertion_evaluation
    channel: other
    artifact_role: proposition_truth_evidence
    sensitivity: plain
    redaction: redact_secrets
    integrity: checksum
    retention: run_lifetime
    loss_disclosure: required
    observation_demand:
      rule_id: fact-k20-1
      scope: /features
      purpose: experimental
      mode: selected
      selector:
        semantic_scope: /features
        data_kind: artifact
        names:
        - cinder.k20-1.satisfied
        component_refs:
        - features.k-corporate.k-identity--delegation
      collection: require
      retention: require
      redaction: redact-secrets
      integrity: checksum
      required: true
      basis: observed
    notes:
    - 'Author checks: Verify the normal baseline, the exact intended path, and the fresh evidence described above.
      Reject a wrong identifier, revision, digest, tenant, identity, stale result, or cross-participant reference.
      Verify unrelated records and permissions remain unchanged and that the result remains recognizable and usable
      by every declared downstream consumer.'
  c2:
    description: |-
      Demonstrate the managed identity against its protected administrative resource. Possessing unrelated staff credentials is insufficient.

      Required technical proof: Completion is observed by the owning service from the fresh result and its immutable audit correlation. The evidence binds the participant, accepted identity or job, exact input and output identifiers, relevant revision or digest, and destination-side observation where a second service consumes the result. Objective evaluation does not create the result or grant authority.
    source_refs:
    - features.k-corporate.k-staff--managed-record
    scope: Per-participant in-world evidence; no other participant state.
    boundary_kind: assertion_evaluation
    channel: other
    artifact_role: proposition_truth_evidence
    sensitivity: plain
    redaction: redact_secrets
    integrity: checksum
    retention: run_lifetime
    loss_disclosure: required
    observation_demand:
      rule_id: fact-k20-2
      scope: /features
      purpose: experimental
      mode: selected
      selector:
        semantic_scope: /features
        data_kind: artifact
        names:
        - cinder.k20-2.satisfied
        component_refs:
        - features.k-corporate.k-staff--managed-record
      collection: require
      retention: require
      redaction: redact-secrets
      integrity: checksum
      required: true
      basis: observed
    notes:
    - 'Author checks: Verify the normal baseline, the exact intended path, and the fresh evidence described above.
      Reject a wrong identifier, revision, digest, tenant, identity, stale result, or cross-participant reference.
      Verify unrelated records and permissions remain unchanged and that the result remains recognizable and usable
      by every declared downstream consumer.'
  c3:
    description: |-
      Demonstrate the privileged publication approval in the supplied rehearsal scope. This supplies alternative publication authority for K26. It neither identifies the current ARWC tenant nor skips G02, G03, or actual customer consumption.

      Required technical proof: Completion is observed by the owning service from the fresh result and its immutable audit correlation. The evidence binds the participant, accepted identity or job, exact input and output identifiers, relevant revision or digest, and destination-side observation where a second service consumes the result. Objective evaluation does not create the result or grant authority.
    source_refs:
    - features.k-delivery.k-registry
    - features.k-delivery.k-ci--rehearsals
    scope: Per-participant in-world evidence; no other participant state.
    boundary_kind: assertion_evaluation
    channel: other
    artifact_role: proposition_truth_evidence
    sensitivity: plain
    redaction: redact_secrets
    integrity: checksum
    retention: run_lifetime
    loss_disclosure: required
    observation_demand:
      rule_id: fact-k20-3
      scope: /features
      purpose: experimental
      mode: selected
      selector:
        semantic_scope: /features
        data_kind: artifact
        names:
        - cinder.k20-3.satisfied
        component_refs:
        - features.k-delivery.k-registry
        - features.k-delivery.k-ci--rehearsals
      collection: require
      retention: require
      redaction: redact-secrets
      integrity: checksum
      required: true
      basis: observed
    notes:
    - 'Author checks: Verify the normal baseline, the exact intended path, and the fresh evidence described above.
      Reject a wrong identifier, revision, digest, tenant, identity, stale result, or cross-participant reference.
      Verify unrelated records and permissions remain unchanged and that the result remains recognizable and usable
      by every declared downstream consumer.'
propositions:
  c1:
    description: Demonstrate the authenticated service action and recover its bound record. Repeating K19's delegated
      probe does not count.
    subjects:
    - features.k-corporate.k-identity--delegation
    basis: observed_state
    predicate:
      kind: boolean
      property: cinder.k20-1.satisfied
      semantic_ref: urn:cinder-typhoon:fact:K20.1
      operator: equals
      expected: true
    evidence_requirements:
    - c1
    quantifier: all
  c2:
    description: Demonstrate the managed identity against its protected administrative resource. Possessing unrelated
      staff credentials is insufficient.
    subjects:
    - features.k-corporate.k-staff--managed-record
    basis: observed_state
    predicate:
      kind: boolean
      property: cinder.k20-2.satisfied
      semantic_ref: urn:cinder-typhoon:fact:K20.2
      operator: equals
      expected: true
    evidence_requirements:
    - c2
    quantifier: all
  c3:
    description: Demonstrate the privileged publication approval in the supplied rehearsal scope. This supplies
      alternative publication authority for K26. It neither identifies the current ARWC tenant nor skips G02, G03,
      or actual customer consumption.
    subjects:
    - features.k-delivery.k-registry
    - features.k-delivery.k-ci--rehearsals
    basis: observed_state
    predicate:
      kind: boolean
      property: cinder.k20-3.satisfied
      semantic_ref: urn:cinder-typhoon:fact:K20.3
      operator: equals
      expected: true
    evidence_requirements:
    - c3
    quantifier: all
assertions:
  c1-ready:
    proposition: c1
    role: precondition
    polarity: positive
  c1-done:
    proposition: c1
    role: postcondition
    polarity: positive
  c2-ready:
    proposition: c2
    role: precondition
    polarity: positive
  c2-done:
    proposition: c2
    role: postcondition
    polarity: positive
  c3-ready:
    proposition: c3
    role: precondition
    polarity: positive
  c3-done:
    proposition: c3
    role: postcondition
    polarity: positive
objectives:
  c1:
    name: 'K20.1: A delegation that reaches further'
    description: |-
      Extend the earned delegated context across the service's next authentication boundary and recover its protected service record.

      Turns delegation into a new service capability.
    agent: participant.operator
    actions:
    - k20.c1
    targets:
    - features.k-corporate.k-identity--delegation
    success:
      mode: all_of
      assertions:
      - c1-done
    window:
      workflows:
      - k20.c1
  c2:
    name: 'K20.2: The managed identity'
    description: |-
      Obtain the managed service capability needed by release administration despite the service's separate access boundary.

      Creates a substantive new identity capability before final impersonation.
    agent: participant.operator
    actions:
    - k20.c2
    targets:
    - features.k-corporate.k-staff--managed-record
    success:
      mode: all_of
      assertions:
      - c2-done
    window:
      workflows:
      - k20.c2
  c3:
    name: 'K20.3: The service wears a person'
    description: |-
      Make release administration accept a publication-approval action as its privileged release identity. Preserve the rehearsal consumer identified in the administration dossier.

      Concludes the identity branch with useful supplier release authority.
    agent: participant.operator
    actions:
    - k20.c3
    targets:
    - features.k-delivery.k-registry
    - features.k-delivery.k-ci--rehearsals
    success:
      mode: all_of
      assertions:
      - c3-done
    window:
      workflows:
      - k20.c3
workflows:
  c1:
    description: 'K20.1: availability follows the evidence/authority alternatives. This independent objective may
      be revisited when facts change; no campaign-wide sequence or deadline is imposed.'
    start: requirements
    steps:
      requirements:
        type: switch
        cases:
        - when:
            assertions:
            - k19.c3-ready
          next: attempt
        default: unavailable
      available:
        type: end
      unavailable:
        type: end
      attempt:
        type: objective
        execution_mode: objective
        objective: k20.c1
        on_success: available
        on_failure: unavailable
  c2:
    description: 'K20.2: availability follows the evidence/authority alternatives. This independent objective may
      be revisited when facts change; no campaign-wide sequence or deadline is imposed.'
    start: requirements
    steps:
      requirements:
        type: switch
        cases:
        - when:
            assertions:
            - k20.c1-ready
          next: attempt
        default: unavailable
      available:
        type: end
      unavailable:
        type: end
      attempt:
        type: objective
        execution_mode: objective
        objective: k20.c2
        on_success: available
        on_failure: unavailable
  c3:
    description: 'K20.3: availability follows the evidence/authority alternatives. This independent objective may
      be revisited when facts change; no campaign-wide sequence or deadline is imposed.'
    start: requirements
    steps:
      requirements:
        type: switch
        cases:
        - when:
            assertions:
            - k20.c2-ready
          next: attempt
        default: unavailable
      available:
        type: end
      unavailable:
        type: end
      attempt:
        type: objective
        execution_mode: objective
        objective: k20.c3
        on_success: available
        on_failure: unavailable
action_contracts:
  c1:
    semantic_version: 1.0.0
    lifecycle_state: draft
    behavioral_granularity: aggregate
    procedure_basis: 'The intended path is limited to the authored software, data, configuration, identity, permission,
      or state described above. The participant must exercise that real condition through the declared service interface
      and produce this result: Authenticated action and protected relation record. Merely describing the condition,
      editing a local copy, or presenting a value obtained from another surface does not satisfy the contract.'
    realization_profile: backend-declared
    fidelity_claim: The exact starting state, service transition, denial cases, participant-state persistence, and
      independently owned evidence are required. Backend choices remain open only where they cannot change those
      facts.
    preconditions:
    - precondition_id: eligibility
      precondition_class: authority
      description: Satisfy one complete alternative in the referenced workflow and obtain the required scoped access
        to every listed surface.
      support_refs:
      - workflows.k20.c1
      - features.k-corporate.k-identity--delegation
    - precondition_id: normal-surface
      precondition_class: target
      description: '`k-identity` owns this part of the operation. Its starting state is exact: Delegated context
        can invoke service-relations/read for svc-release-admin; host-omission from K19 permits this adjacent SPN.
        The owning service uses the listener, route, identity, authorization, storage, and audit contract declared
        in the corresponding world module. Records that are not explicitly mutable remain immutable. The private
        service-loader contract `content.keplerops-k-identity.k20-1-a-delegation-that-reaches-further` freezes the
        request, denial, state-transition, evidence, and any exploit-critical implementation details.'
      support_refs:
      - features.k-corporate.k-identity
      - content.keplerops-k-identity.k20-1-a-delegation-that-reaches-further
    - precondition_id: scope-and-persistence
      precondition_class: realization
      description: Input to K20.2. Participant-created service state persists for the life of the participant world
        and ordinary retries do not erase it. The selected route cannot act on unrelated tenants, records, packages,
        identities, jobs, or services. Infrastructure recovery and submission adjudication are outside this in-world
        contract.
      support_refs:
      - features.k-corporate.k-identity
    effects:
    - effect_id: outcome
      effect_class: intended_effect
      description: Demonstrate the authenticated service action and recover its bound record. Repeating K19's delegated
        probe does not count.
      target_refs:
      - features.k-corporate.k-identity--delegation
      evidence_refs:
      - evidence_requirements.k20.c1
    failure_classes:
    - precondition_unsatisfied
    - authority_denied
    - target_unavailable
    - partial_success
    - backend_error
    - unknown
  c2:
    semantic_version: 1.0.0
    lifecycle_state: draft
    behavioral_granularity: aggregate
    procedure_basis: 'The intended path is limited to the authored software, data, configuration, identity, permission,
      or state described above. The participant must exercise that real condition through the declared service interface
      and produce this result: Issued bounded svc-release-admin service session and protected admin-resource read.
      Merely describing the condition, editing a local copy, or presenting a value obtained from another surface
      does not satisfy the contract.'
    realization_profile: backend-declared
    fidelity_claim: The exact starting state, service transition, denial cases, participant-state persistence, and
      independently owned evidence are required. Backend choices remain open only where they cannot change those
      facts.
    preconditions:
    - precondition_id: eligibility
      precondition_class: authority
      description: Satisfy one complete alternative in the referenced workflow and obtain the required scoped access
        to every listed surface.
      support_refs:
      - workflows.k20.c2
      - features.k-corporate.k-staff--managed-record
    - precondition_id: normal-surface
      precondition_class: target
      description: '`k-staff` owns this part of the operation. Its starting state is exact: Relation points to managed
        service account; object ACL checks delegated actor''s service relation but not requested managed identity.
        The owning service uses the listener, route, identity, authorization, storage, and audit contract declared
