        service-loader contract `content.keplerops-k-staff.k20-2-the-managed-identity` freezes the request, denial,
        state-transition, evidence, and any exploit-critical implementation details.'
      support_refs:
      - features.k-corporate.k-staff
      - content.keplerops-k-staff.k20-2-the-managed-identity
    - precondition_id: scope-and-persistence
      precondition_class: realization
      description: Input to K20.3. Participant-created service state persists for the life of the participant world
