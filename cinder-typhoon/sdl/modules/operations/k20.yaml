    quantifier: all
  c3:
    description: Demonstrate the privileged publication approval in the supplied rehearsal scope. This
      supplies alternative publication authority for K26. It neither identifies the current ARWC tenant
      nor skips G02, G03, or actual customer consumption.
    subjects: *id003
    basis: observed_state
    predicate:
