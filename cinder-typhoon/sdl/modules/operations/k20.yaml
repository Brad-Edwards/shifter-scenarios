    - c3
    quantifier: all
assertions:
  c1-ready:
    proposition: c1
    role: precondition
    polarity: positive
  c1-done:
    proposition: c1
    role: postcondition
    polarity: positive
  c2-ready:
    proposition: c2
    role: precondition
    polarity: positive
  c2-done:
    proposition: c2
    role: postcondition
    polarity: positive
  c3-ready:
    proposition: c3
    role: precondition
    polarity: positive
  c3-done:
    proposition: c3
    role: postcondition
    polarity: positive
objectives:
  c1:
    name: 'K20.1: A delegation that reaches further'
    description: |-
      Extend the earned delegated context across the service's next authentication boundary and recover its protected service record.

      Turns delegation into a new service capability.
    agent: participant.operator
    actions:
    - k20.c1
    targets: &id004
    - features.k-corporate.k-identity--delegation
    success:
      mode: all_of
      assertions:
      - c1-done
    window:
      workflows:
      - k20.c1
  c2:
    name: 'K20.2: The managed identity'
    description: |-
      Obtain the managed service capability needed by release administration despite the service's separate access boundary.

      Creates a substantive new identity capability before final impersonation.
    agent: participant.operator
    actions:
    - k20.c2
    targets: &id005
    - features.k-corporate.k-staff--managed-record
    success:
      mode: all_of
      assertions:
      - c2-done
    window:
      workflows:
      - k20.c2
  c3:
    name: 'K20.3: The service wears a person'
    description: |-
      Make release administration accept a publication-approval action as its privileged release identity. Preserve the rehearsal consumer identified in the administration dossier.

      Concludes the identity branch with useful supplier release authority.
    agent: participant.operator
    actions:
    - k20.c3
    targets: &id006
    - features.k-delivery.k-registry
    - features.k-delivery.k-ci--rehearsals
    success:
      mode: all_of
      assertions:
      - c3-done
    window:
      workflows:
      - k20.c3
workflows:
  c1:
    description: 'K20.1: availability follows the evidence/authority alternatives. This independent objective
      may be revisited when facts change; no campaign-wide sequence or deadline is imposed.'
    start: requirements
    steps:
      requirements:
        type: switch
        cases:
        - when:
            assertions:
            - k19.c3-ready
          next: attempt
        default: unavailable
      available:
        type: end
      unavailable:
        type: end
      attempt:
        type: objective
        execution_mode: objective
        objective: k20.c1
        on_success: available
        on_failure: unavailable
  c2:
    description: 'K20.2: availability follows the evidence/authority alternatives. This independent objective
      may be revisited when facts change; no campaign-wide sequence or deadline is imposed.'
    start: requirements
    steps:
      requirements:
        type: switch
        cases:
        - when:
            assertions:
            - k20.c1-ready
          next: attempt
        default: unavailable
      available:
        type: end
      unavailable:
        type: end
      attempt:
        type: objective
        execution_mode: objective
        objective: k20.c2
        on_success: available
        on_failure: unavailable
  c3:
    description: 'K20.3: availability follows the evidence/authority alternatives. This independent objective
      may be revisited when facts change; no campaign-wide sequence or deadline is imposed.'
    start: requirements
    steps:
      requirements:
        type: switch
        cases:
        - when:
            assertions:
            - k20.c2-ready
          next: attempt
        default: unavailable
      available:
        type: end
      unavailable:
        type: end
      attempt:
        type: objective
        execution_mode: objective
        objective: k20.c3
        on_success: available
        on_failure: unavailable
