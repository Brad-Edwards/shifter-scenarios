evidence_requirements:
  c1:
    description: Demonstrate the authenticated service action and recover its bound record. Repeating
      K19's delegated probe does not count.
    source_refs: &id001
    - features.k-corporate.k-identity--delegation
    scope: Per-participant in-world evidence; no other participant state.
    boundary_kind: assertion_evaluation
    channel: other
    artifact_role: proposition_truth_evidence
    sensitivity: plain
    redaction: redact_secrets
    integrity: checksum
    retention: run_lifetime
    loss_disclosure: required
    observation_demand:
      rule_id: fact-k20-1
      scope: /features
      purpose: experimental
      mode: selected
      selector:
        semantic_scope: /features
        data_kind: artifact
        names:
        - cinder.k20-1.satisfied
        component_refs:
        - features.k-corporate.k-identity--delegation
      collection: require
      retention: require
      redaction: redact-secrets
      integrity: checksum
      required: true
      basis: observed
  c2:
    description: Demonstrate the managed identity against its protected administrative resource. Possessing
      unrelated staff credentials is insufficient.
    source_refs: &id002
    - features.k-corporate.k-staff--managed-record
    scope: Per-participant in-world evidence; no other participant state.
    boundary_kind: assertion_evaluation
    channel: other
    artifact_role: proposition_truth_evidence
    sensitivity: plain
    redaction: redact_secrets
    integrity: checksum
    retention: run_lifetime
    loss_disclosure: required
    observation_demand:
      rule_id: fact-k20-2
      scope: /features
      purpose: experimental
      mode: selected
      selector:
        semantic_scope: /features
        data_kind: artifact
        names:
        - cinder.k20-2.satisfied
        component_refs:
        - features.k-corporate.k-staff--managed-record
      collection: require
      retention: require
      redaction: redact-secrets
      integrity: checksum
      required: true
      basis: observed
  c3:
    description: Demonstrate the privileged publication approval in the supplied rehearsal scope. This
      supplies alternative publication authority for K26. It neither identifies the current ARWC tenant
      nor skips G02, G03, or actual customer consumption.
    source_refs: &id003
    - features.k-delivery.k-registry
    - features.k-delivery.k-ci--rehearsals
    scope: Per-participant in-world evidence; no other participant state.
    boundary_kind: assertion_evaluation
    channel: other
    artifact_role: proposition_truth_evidence
    sensitivity: plain
    redaction: redact_secrets
    integrity: checksum
    retention: run_lifetime
    loss_disclosure: required
    observation_demand:
      rule_id: fact-k20-3
      scope: /features
      purpose: experimental
      mode: selected
      selector:
        semantic_scope: /features
        data_kind: artifact
        names:
        - cinder.k20-3.satisfied
        component_refs:
        - features.k-delivery.k-registry
        - features.k-delivery.k-ci--rehearsals
      collection: require
      retention: require
      redaction: redact-secrets
      integrity: checksum
      required: true
      basis: observed
propositions:
  c1:
    description: Demonstrate the authenticated service action and recover its bound record. Repeating
      K19's delegated probe does not count.
    subjects: *id001
    basis: observed_state
    predicate:
      kind: boolean
      property: cinder.k20-1.satisfied
      semantic_ref: urn:cinder-typhoon:fact:K20.1
      operator: equals
      expected: true
    evidence_requirements:
    - c1
    quantifier: all
  c2:
    description: Demonstrate the managed identity against its protected administrative resource. Possessing
      unrelated staff credentials is insufficient.
    subjects: *id002
    basis: observed_state
    predicate:
      kind: boolean
      property: cinder.k20-2.satisfied
