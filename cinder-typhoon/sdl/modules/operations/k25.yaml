    realization_profile: backend-declared
    fidelity_claim: Authored challenge outcome and authority boundaries. Runtime mechanism and evidence
      evaluation are not implemented by this declaration.
    preconditions:
    - precondition_id: eligibility
      precondition_class: authority
      description: Satisfy one complete alternative in the referenced workflow and obtain the required
        scoped access to every listed surface.
      support_refs:
      - workflows.k25.c1
      - features.k-delivery.k-support
    effects:
    - effect_id: outcome
      effect_class: intended_effect
      description: Recover the dossier and attachment as one disclosure. Their historical narrative is
        useful but not required to reconcile the current integration in K25.2.
      target_refs: *id003
      evidence_refs:
      - evidence_requirements.k25.c1
    failure_classes:
    - precondition_unsatisfied
    - authority_denied
    - target_unavailable
    - partial_success
    - backend_error
    - unknown
  c2:
    semantic_version: 1.0.0
    lifecycle_state: draft
    behavioral_granularity: aggregate
    procedure_basis: KeplerOps retains more than one ARWC integration record. Establish the active tenant
      and the connector revision that actually belongs to the current customer.
    realization_profile: backend-declared
    fidelity_claim: Authored challenge outcome and authority boundaries. Runtime mechanism and evidence
      evaluation are not implemented by this declaration.
    preconditions:
    - precondition_id: eligibility
      precondition_class: authority
      description: Satisfy one complete alternative in the referenced workflow and obtain the required
        scoped access to every listed surface.
      support_refs:
      - workflows.k25.c2
      - features.k-delivery.k-support
    effects:
    - effect_id: outcome
      effect_class: intended_effect
      description: Reconcile the current tenant and connector revision using the repository-visible integration
        records. This supplies G02; the optional historical dossier is not a prerequisite.
      target_refs: *id004
      evidence_refs:
      - evidence_requirements.k25.c2
    failure_classes:
    - precondition_unsatisfied
    - authority_denied
    - target_unavailable
    - partial_success
    - backend_error
    - unknown
relationships:
  c1-surface-1:
    type: depends_on
    source: agents.participant.operator
    target: features.k-delivery.k-support
    description: K25.1 requires this scoped interaction; it does not confer forwarding or a shell.
