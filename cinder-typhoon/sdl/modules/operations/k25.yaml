    description: |-
      K25.1: required in-world starting records. Allocate each record to its actual owning service; this declaration does not duplicate secrets across services or grant their visibility.
      Repository-visible customer integration records, the current connector manifest, and references to the older ARWC support dossier.
    target: k-delivery.k-support
    tags:
    - synthetic
    - k25
    - c1
    - seed-requirement
    items:
