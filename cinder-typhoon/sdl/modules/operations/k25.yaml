# In-world draft. Unspecified realization remains open.
name: cinder-k25
version: 0.1.0
semantic_revision: raes-progressive-semantics/v1
module:
  id: cinder-typhoon/k25
  version: 0.1.0
  exports:
    evidence_requirements:
    - c1
    - c2
    propositions:
    - c1
    - c2
    assertions:
    - c1-ready
    - c1-done
    - c2-ready
    - c2-done
    objectives:
    - c1
    - c2
    workflows:
    - c1
    - c2
    action_contracts:
    - c1
    - c2
realization:
  default: open
evidence_requirements:
  c1:
    description: |-
      Recover the dossier and attachment as one disclosure. Their historical narrative is useful but not required to reconcile the current integration in K25.2.

      Required technical proof: Completion is observed by the owning service from the fresh result and its immutable audit correlation. The evidence binds the participant, accepted identity or job, exact input and output identifiers, relevant revision or digest, and destination-side observation where a second service consumes the result. Objective evaluation does not create the result or grant authority.
    source_refs:
    - features.k-delivery.k-support
    scope: Per-participant in-world evidence; no other participant state.
    boundary_kind: assertion_evaluation
    channel: other
    artifact_role: proposition_truth_evidence
    sensitivity: plain
    redaction: redact_secrets
    integrity: checksum
    retention: run_lifetime
    loss_disclosure: required
    observation_demand:
      rule_id: fact-k25-1
      scope: /features
      purpose: experimental
      mode: selected
      selector:
        semantic_scope: /features
        data_kind: artifact
        names:
        - cinder.k25-1.satisfied
        component_refs:
        - features.k-delivery.k-support
      collection: require
      retention: require
      redaction: redact-secrets
      integrity: checksum
      required: true
      basis: observed
    notes:
    - 'Author checks: Verify the normal baseline, the exact intended path, and the fresh evidence described above.
      Reject a wrong identifier, revision, digest, tenant, identity, stale result, or cross-participant reference.
      Verify unrelated records and permissions remain unchanged and that the result remains recognizable and usable
      by every declared downstream consumer.'
  c2:
    description: |-
      Reconcile the current tenant and connector revision using the repository-visible integration records. This supplies G02; the optional historical dossier is not a prerequisite.

      Required technical proof: Completion is observed by the owning service from the fresh result and its immutable audit correlation. The evidence binds the participant, accepted identity or job, exact input and output identifiers, relevant revision or digest, and destination-side observation where a second service consumes the result. Objective evaluation does not create the result or grant authority.
    source_refs:
    - features.k-delivery.k-support
    scope: Per-participant in-world evidence; no other participant state.
    boundary_kind: assertion_evaluation
    channel: other
    artifact_role: proposition_truth_evidence
    sensitivity: plain
    redaction: redact_secrets
    integrity: checksum
    retention: run_lifetime
    loss_disclosure: required
    observation_demand:
      rule_id: fact-k25-2
      scope: /features
      purpose: experimental
      mode: selected
      selector:
        semantic_scope: /features
        data_kind: artifact
        names:
        - cinder.k25-2.satisfied
        component_refs:
        - features.k-delivery.k-support
      collection: require
      retention: require
      redaction: redact-secrets
      integrity: checksum
      required: true
      basis: observed
    notes:
    - 'Author checks: Verify the normal baseline, the exact intended path, and the fresh evidence described above.
      Reject a wrong identifier, revision, digest, tenant, identity, stale result, or cross-participant reference.
      Verify unrelated records and permissions remain unchanged and that the result remains recognizable and usable
      by every declared downstream consumer.'
propositions:
  c1:
    description: Recover the dossier and attachment as one disclosure. Their historical narrative is useful but
      not required to reconcile the current integration in K25.2.
    subjects:
    - features.k-delivery.k-support
    basis: observed_state
    predicate:
      kind: boolean
      property: cinder.k25-1.satisfied
      semantic_ref: urn:cinder-typhoon:fact:K25.1
      operator: equals
      expected: true
    evidence_requirements:
    - c1
    quantifier: all
  c2:
    description: Reconcile the current tenant and connector revision using the repository-visible integration records.
      This supplies G02; the optional historical dossier is not a prerequisite.
    subjects:
    - features.k-delivery.k-support
    basis: observed_state
    predicate:
      kind: boolean
      property: cinder.k25-2.satisfied
      semantic_ref: urn:cinder-typhoon:fact:K25.2
      operator: equals
      expected: true
    evidence_requirements:
    - c2
    quantifier: all
assertions:
  c1-ready:
    proposition: c1
    role: precondition
    polarity: positive
  c1-done:
    proposition: c1
    role: postcondition
    polarity: positive
  c2-ready:
    proposition: c2
    role: precondition
    polarity: positive
  c2-done:
    proposition: c2
    role: postcondition
    polarity: positive
objectives:
  c1:
    name: 'K25.1: A customer with a history'
    description: |-
      Recover the ARWC support dossier and its retained attachment. Find out why the same maintenance ticket keeps returning to the developer.

      Introduces the customer and recurring support dispute through a complete document recovery.
    agent: participant.operator
    actions:
    - k25.c1
    targets:
    - features.k-delivery.k-support
    success:
      mode: all_of
      assertions:
      - c1-done
    window:
      workflows:
      - k25.c1
  c2:
    name: 'K25.2: Which ARWC is current'
    description: |-
      KeplerOps retains more than one ARWC integration record. Establish the active tenant and the connector revision that actually belongs to the current customer.

      Provides the shared customer binding for both ordinary entry routes.
    agent: participant.operator
    actions:
    - k25.c2
    targets:
    - features.k-delivery.k-support
    success:
      mode: all_of
      assertions:
      - c2-done
    window:
      workflows:
      - k25.c2
workflows:
  c1:
    description: 'K25.1: availability follows the evidence/authority alternatives. This independent objective may
      be revisited when facts change; no campaign-wide sequence or deadline is imposed.'
    start: requirements
    steps:
      requirements:
        type: switch
        cases:
        - when:
            assertions:
            - capabilities.g01-ready
          next: attempt
        default: unavailable
      available:
        type: end
      unavailable:
        type: end
      attempt:
        type: objective
        execution_mode: objective
        objective: k25.c1
        on_success: available
        on_failure: unavailable
  c2:
    description: 'K25.2: availability follows the evidence/authority alternatives. This independent objective may
      be revisited when facts change; no campaign-wide sequence or deadline is imposed.'
    start: requirements
    steps:
      requirements:
        type: switch
        cases:
        - when:
            assertions:
            - capabilities.g01-ready
          next: attempt
        default: unavailable
      available:
        type: end
      unavailable:
        type: end
      attempt:
        type: objective
        execution_mode: objective
        objective: k25.c2
        on_success: available
        on_failure: unavailable
action_contracts:
  c1:
    semantic_version: 1.0.0
    lifecycle_state: draft
    behavioral_granularity: aggregate
    procedure_basis: 'The intended path is limited to the authored software, data, configuration, identity, permission,
      or state described above. The participant must exercise that real condition through the declared service interface
      and produce this result: Dossier/attachment read. Merely describing the condition, editing a local copy, or
      presenting a value obtained from another surface does not satisfy the contract.'
    realization_profile: backend-declared
    fidelity_claim: The exact starting state, service transition, denial cases, participant-state persistence, and
      independently owned evidence are required. Backend choices remain open only where they cannot change those
      facts.
    preconditions:
    - precondition_id: eligibility
      precondition_class: authority
      description: Satisfy one complete alternative in the referenced workflow and obtain the required scoped access
        to every listed surface.
      support_refs:
      - workflows.k25.c1
      - features.k-delivery.k-support
    - precondition_id: normal-surface
      precondition_class: target
      description: '`k-support` owns this part of the operation. Its starting state is exact: Dossier DOS-ARWC-HIST-01
        and retained attachment, cross-referenced to narrative account K-C-001 and recurring SUP-2841. The owning
        service uses the listener, route, identity, authorization, storage, and audit contract declared in the corresponding
        world module. Records that are not explicitly mutable remain immutable. The private service-loader contract
        `content.keplerops-k-support.k25-1-a-customer-with-a-history` freezes the request, denial, state-transition,
        evidence, and any exploit-critical implementation details.'
      support_refs:
      - features.k-delivery.k-support
      - content.keplerops-k-support.k25-1-a-customer-with-a-history
    - precondition_id: scope-and-persistence
      precondition_class: realization
      description: Reuses exact K-C-001 background; optional history Participant-created service state persists
        for the life of the participant world and ordinary retries do not erase it. The action is limited to the
        exact records, identities, routes, and destination effects declared here; unrelated tenants and services
        remain denied. Infrastructure recovery and submission adjudication are outside this in-world contract.
      support_refs:
      - features.k-delivery.k-support
    effects:
    - effect_id: outcome
      effect_class: intended_effect
      description: Recover the dossier and attachment as one disclosure. Their historical narrative is useful but
        not required to reconcile the current integration in K25.2.
      target_refs:
      - features.k-delivery.k-support
      evidence_refs:
      - evidence_requirements.k25.c1
    failure_classes:
    - precondition_unsatisfied
    - authority_denied
    - target_unavailable
    - partial_success
    - backend_error
    - unknown
