realization:
  default: open
evidence_requirements:
  c1:
    description: |-
      Recover the actual trust record and its identity binding. It is separate evidence from the preceding workload-access result.

      Required technical proof: Completion is observed by the owning service from the fresh result and its immutable audit correlation. The evidence binds the participant, accepted identity or job, exact input and output identifiers, relevant revision or digest, and destination-side observation where a second service consumes the result. Objective evaluation does not create the result or grant authority.
    source_refs:
    - features.k-cloud.k-cloud-api--authority
    scope: Per-participant in-world evidence; no other participant state.
    boundary_kind: assertion_evaluation
    channel: other
    artifact_role: proposition_truth_evidence
    sensitivity: plain
    redaction: redact_secrets
    integrity: checksum
    retention: run_lifetime
    loss_disclosure: required
    observation_demand:
      rule_id: fact-k14-1
      scope: /features
      purpose: experimental
      mode: selected
      selector:
        semantic_scope: /features
        data_kind: artifact
        names:
        - cinder.k14-1.satisfied
        component_refs:
        - features.k-cloud.k-cloud-api--authority
      collection: require
      retention: require
      redaction: redact-secrets
      integrity: checksum
      required: true
      basis: observed
    notes:
    - 'Author checks: Verify the normal baseline, the exact intended path, and the fresh evidence described above.
      Reject a wrong identifier, revision, digest, tenant, identity, stale result, or cross-participant reference.
      Verify unrelated records and permissions remain unchanged and that the result remains recognizable and usable
      by every declared downstream consumer.'
  c2:
    description: |-
      Demonstrate the resulting role against its protected record. Obtaining and using that role earn one accepted result; this is the K14 scoped-role output.

      Required technical proof: Completion is observed by the owning service from the fresh result and its immutable audit correlation. The evidence binds the participant, accepted identity or job, exact input and output identifiers, relevant revision or digest, and destination-side observation where a second service consumes the result. Objective evaluation does not create the result or grant authority.
    source_refs:
    - features.k-cloud.k-cloud-api--authority
    scope: Per-participant in-world evidence; no other participant state.
    boundary_kind: assertion_evaluation
    channel: other
    artifact_role: proposition_truth_evidence
    sensitivity: plain
    redaction: redact_secrets
    integrity: checksum
    retention: run_lifetime
    loss_disclosure: required
    observation_demand:
      rule_id: fact-k14-2
      scope: /features
      purpose: experimental
      mode: selected
      selector:
        semantic_scope: /features
        data_kind: artifact
        names:
        - cinder.k14-2.satisfied
        component_refs:
        - features.k-cloud.k-cloud-api--authority
      collection: require
      retention: require
      redaction: redact-secrets
      integrity: checksum
      required: true
      basis: observed
    notes:
    - 'Author checks: Verify the normal baseline, the exact intended path, and the fresh evidence described above.
      Reject a wrong identifier, revision, digest, tenant, identity, stale result, or cross-participant reference.
      Verify unrelated records and permissions remain unchanged and that the result remains recognizable and usable
      by every declared downstream consumer.'
  c3:
    description: |-
      Recover the support export through its distinct policy boundary. A successful role exchange alone is insufficient.

      Required technical proof: Completion is observed by the owning service from the fresh result and its immutable audit correlation. The evidence binds the participant, accepted identity or job, exact input and output identifiers, relevant revision or digest, and destination-side observation where a second service consumes the result. Objective evaluation does not create the result or grant authority.
    source_refs:
    - features.k-cloud.k-data
    scope: Per-participant in-world evidence; no other participant state.
    boundary_kind: assertion_evaluation
    channel: other
    artifact_role: proposition_truth_evidence
    sensitivity: plain
    redaction: redact_secrets
    integrity: checksum
    retention: run_lifetime
    loss_disclosure: required
    observation_demand:
      rule_id: fact-k14-3
      scope: /features
      purpose: experimental
      mode: selected
      selector:
        semantic_scope: /features
        data_kind: artifact
        names:
        - cinder.k14-3.satisfied
        component_refs:
        - features.k-cloud.k-data
      collection: require
      retention: require
      redaction: redact-secrets
      integrity: checksum
      required: true
      basis: observed
    notes:
    - 'Author checks: Verify the normal baseline, the exact intended path, and the fresh evidence described above.
      Reject a wrong identifier, revision, digest, tenant, identity, stale result, or cross-participant reference.
      Verify unrelated records and permissions remain unchanged and that the result remains recognizable and usable
      by every declared downstream consumer.'
propositions:
  c1:
    description: Recover the actual trust record and its identity binding. It is separate evidence from the preceding
      workload-access result.
    subjects:
    - features.k-cloud.k-cloud-api--authority
    basis: observed_state
    predicate:
      kind: boolean
      property: cinder.k14-1.satisfied
      semantic_ref: urn:cinder-typhoon:fact:K14.1
      operator: equals
      expected: true
    evidence_requirements:
    - c1
    quantifier: all
  c2:
    description: Demonstrate the resulting role against its protected record. Obtaining and using that role earn
      one accepted result; this is the K14 scoped-role output.
    subjects:
    - features.k-cloud.k-cloud-api--authority
    basis: observed_state
    predicate:
      kind: boolean
      property: cinder.k14-2.satisfied
      semantic_ref: urn:cinder-typhoon:fact:K14.2
      operator: equals
      expected: true
    evidence_requirements:
    - c2
    quantifier: all
  c3:
    description: Recover the support export through its distinct policy boundary. A successful role exchange alone
      is insufficient.
    subjects:
    - features.k-cloud.k-data
    basis: observed_state
    predicate:
      kind: boolean
      property: cinder.k14-3.satisfied
      semantic_ref: urn:cinder-typhoon:fact:K14.3
      operator: equals
      expected: true
    evidence_requirements:
    - c3
    quantifier: all
assertions:
  c1-ready:
    proposition: c1
    role: precondition
    polarity: positive
  c1-done:
    proposition: c1
    role: postcondition
    polarity: positive
  c2-ready:
    proposition: c2
    role: precondition
    polarity: positive
  c2-done:
    proposition: c2
    role: postcondition
    polarity: positive
  c3-ready:
    proposition: c3
    role: precondition
    polarity: positive
  c3-done:
    proposition: c3
    role: postcondition
    polarity: positive
objectives:
  c1:
    name: 'K14.1: The trust document'
    description: |-
      Recover the workload's current trust document and the service relationship it describes.

      Makes the next identity boundary explicit in the organization's own material.
    agent: participant.operator
    actions:
    - k14.c1
    targets:
    - features.k-cloud.k-cloud-api--authority
    success:
      mode: all_of
      assertions:
      - c1-done
    window:
      workflows:
      - k14.c1
  c2:
    name: 'K14.2: Intended for someone else'
    description: |-
      Use the workload trust relationship to establish the scoped role intended for another audience and retrieve its protected role record.

      Expands identity scope through a meaningful trust mistake.
    agent: participant.operator
    actions:
    - k14.c2
    targets:
    - features.k-cloud.k-cloud-api--authority
    success:
      mode: all_of
      assertions:
      - c2-done
    window:
      workflows:
      - k14.c2
  c3:
    name: 'K14.3: The export''s separate rule'
    description: |-
      The new role is still denied the support export. Cross the export's own resource boundary and recover the specified support data.

      Shows that identity trust and resource authorization are separate problems.
    agent: participant.operator
    actions:
    - k14.c3
    targets:
    - features.k-cloud.k-data
    success:
      mode: all_of
      assertions:
      - c3-done
    window:
      workflows:
      - k14.c3
workflows:
  c1:
    description: 'K14.1: availability follows the evidence/authority alternatives. This independent objective may
      be revisited when facts change; no campaign-wide sequence or deadline is imposed.'
    start: requirements
    steps:
      requirements:
        type: switch
        cases:
        - when:
            assertions:
            - k09.c4-ready
          next: attempt
        - when:
            assertions:
            - k13.c4-ready
          next: attempt
        default: unavailable
      available:
        type: end
      unavailable:
        type: end
      attempt:
        type: objective
        execution_mode: objective
        objective: k14.c1
        on_success: available
        on_failure: unavailable
  c2:
    description: 'K14.2: availability follows the evidence/authority alternatives. This independent objective may
      be revisited when facts change; no campaign-wide sequence or deadline is imposed.'
    start: requirements
    steps:
      requirements:
        type: switch
        cases:
        - when:
            assertions:
            - k14.c1-ready
          next: attempt
        default: unavailable
      available:
        type: end
      unavailable:
        type: end
      attempt:
        type: objective
        execution_mode: objective
        objective: k14.c2
        on_success: available
        on_failure: unavailable
  c3:
    description: 'K14.3: availability follows the evidence/authority alternatives. This independent objective may
      be revisited when facts change; no campaign-wide sequence or deadline is imposed.'
    start: requirements
    steps:
      requirements:
        type: switch
        cases:
        - when:
            assertions:
            - k14.c2-ready
          next: attempt
        default: unavailable
      available:
        type: end
      unavailable:
        type: end
      attempt:
        type: objective
        execution_mode: objective
        objective: k14.c3
        on_success: available
        on_failure: unavailable
action_contracts:
  c1:
    semantic_version: 1.0.0
    lifecycle_state: draft
    behavioral_granularity: aggregate
    procedure_basis: 'The intended path is limited to the authored software, data, configuration, identity, permission,
      or state described above. The participant must exercise that real condition through the declared service interface
      and produce this result: Authenticated trust-record read. Merely describing the condition, editing a local
      copy, or presenting a value obtained from another surface does not satisfy the contract.'
    realization_profile: backend-declared
    fidelity_claim: The exact starting state, service transition, denial cases, participant-state persistence, and
      independently owned evidence are required. Backend choices remain open only where they cannot change those
      facts.
    preconditions:
    - precondition_id: eligibility
      precondition_class: authority
      description: Satisfy one complete alternative in the referenced workflow and obtain the required scoped access
        to every listed surface.
      support_refs:
      - workflows.k14.c1
      - features.k-cloud.k-cloud-api--authority
    - precondition_id: normal-surface
      precondition_class: target
      description: '`k-cloud-api` owns this part of the operation. Its starting state is exact: Trust record TRUST-FLX-04
        with issuer, subject, accepted audiences and export-role relationship. The owning service uses the listener,
        route, identity, authorization, storage, and audit contract declared in the corresponding world module.
        Records that are not explicitly mutable remain immutable. The private service-loader contract `content.keplerops-k-cloud-api.k14-1-the-trust-document`
        freezes the request, denial, state-transition, evidence, and any exploit-critical implementation details.'
      support_refs:
      - features.k-cloud.k-cloud-api
      - content.keplerops-k-cloud-api.k14-1-the-trust-document
    - precondition_id: scope-and-persistence
      precondition_class: realization
      description: Separate evidence from K13.4/K09.4. Participant-created service state persists for the life of
        the participant world and ordinary retries do not erase it. The selected route cannot act on unrelated tenants,
        records, packages, identities, jobs, or services. Infrastructure recovery and submission adjudication are
        outside this in-world contract.
      support_refs:
      - features.k-cloud.k-cloud-api
    effects:
    - effect_id: outcome
      effect_class: intended_effect
      description: Recover the actual trust record and its identity binding. It is separate evidence from the preceding
        workload-access result.
      target_refs:
      - features.k-cloud.k-cloud-api--authority
      evidence_refs:
      - evidence_requirements.k14.c1
    failure_classes:
    - precondition_unsatisfied
    - authority_denied
    - target_unavailable
    - partial_success
    - backend_error
    - unknown
