    properties:
      cinder_kind: flow
      flow_kind: operation
      modes: control
      guard: workflows.flows-a-engineering.commands-a-reservoir
  historian-hmi:
    type: connects_to
    source: features.a-engineering.a-historian
    target: features.a-engineering.a-hmi
    description: Operator observations and history
    properties:
      cinder_kind: flow
      flow_kind: operation
      modes: telemetry
      guard: workflows.flows-a-engineering.historian-hmi
  engineering-hmi:
    type: connects_to
    source: features.a-engineering.a-engineering
    target: features.a-engineering.a-hmi
    description: Approved project and tag configuration
    properties:
      cinder_kind: flow
      flow_kind: operation
      modes: artifact
      guard: workflows.flows-a-engineering.engineering-hmi
  diagnostic-history:
    type: connects_to
    source: features.a-engineering.a-diagnostics--vault-worker
    target: features.a-engineering.a-diagnostics--history
    description: ''
    properties:
      cinder_kind: flow
      flow_kind: access
      modes: artifact
      guard: workflows.flows-a-engineering.diagnostic-history
  signed-diagnostic-export:
    type: connects_to
    source: features.a-engineering.a-diagnostics
    target: features.a-engineering.a-diagnostics--export-log
    description: Diagnostic service verifies export authorization internally
    properties:
      cinder_kind: flow
      flow_kind: operation
      modes: artifact
      guard: workflows.flows-a-engineering.signed-diagnostic-export
  a-diagnostics--estimate-output-publication:
    type: connects_to
    source: features.a-engineering.a-diagnostics--estimate-output
    target: features.a-dmz.a-data-bridge--estimates
    description: Accepted estimate output; never raw measurements
    properties:
      cinder_kind: flow
      flow_kind: operation
      modes: report
      guard: workflows.flows-a-engineering.a-diagnostics--estimate-output-publication
  a-diagnostics--program-output-publication:
    type: connects_to
    source: features.a-engineering.a-diagnostics--program-output
