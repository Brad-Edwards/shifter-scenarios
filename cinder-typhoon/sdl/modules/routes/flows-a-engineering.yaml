realization:
  default: open
relationships:
  utility-dispatch:
    type: connects_to
    source: features.a-engineering.a-engineering
    target: features.a-engineering.a-engineering--utility-worker
    description: Published utility invocation; caller does not inherit privilege
    properties:
      cinder_kind: flow
      flow_kind: operation
      modes: service
      guard: workflows.flows-a-engineering.utility-dispatch
  vault-dispatch:
    type: connects_to
    source: features.a-engineering.a-diagnostics
    target: features.a-engineering.a-diagnostics--vault-worker
    description: Diagnostic application invokes native record service
    properties:
      cinder_kind: flow
      flow_kind: operation
      modes: service
      guard: workflows.flows-a-engineering.vault-dispatch
  utility-issuance:
    type: connects_to
    source: features.a-engineering.a-engineering--utility-worker
    target: features.a-dmz.a-control-broker--utility-issuer
    description: ''
    properties:
      cinder_kind: flow
      flow_kind: access
      modes: service
      guard: workflows.flows-a-engineering.utility-issuance
  commands-a-distribution:
    type: connects_to
    source: features.a-engineering.a-hmi--dispatch
    target: features.a-control.a-distribution
    description: Supervisory command to actuator
    properties:
      cinder_kind: flow
      flow_kind: operation
      modes: control
      guard: workflows.flows-a-engineering.commands-a-distribution
  commands-a-reservoir:
    type: connects_to
    source: features.a-engineering.a-hmi--dispatch
    target: features.a-control.a-reservoir
