workflows:
  context-player:
    description: Acquisition of this scoped execution/delegation context. Reaching a service alone does
      not acquire its principal.
    start: available
    steps:
      available:
        type: end
  context-developer:
    description: Acquisition of this scoped execution/delegation context. Reaching a service alone does
      not acquire its principal.
    start: requirements
    steps:
