      id: business.report-document
  W11.1:
    h1: Begin with the relation schema, backend exchange, and asset-lineage service. Its published client document
      exposes the relation schema operation, so use that ordinary contract instead of guessing a path.
    h2: Treat this as protocol reconstruction followed by identity-field traversal at the relation boundary. Separate
      the authoritative service record from stale or local copies, and preserve its identity, revision, and scope.
    h3: Locate the relation schema operation in the published client reference. Capture one ordinary response and
      one denial, then correlate the returned identifiers with evidence already earned.
    references:
    - kind: client_route
      id: planning.relation-schema
  W11.2:
    h1: Begin with the relation schema, backend exchange, and asset-lineage service. Its published client document
      exposes the relation exchange operation, so use that ordinary contract instead of guessing a path.
    h2: Treat this as protocol reconstruction followed by identity-field traversal at the relation boundary. Derive
      every constraint from supplied records or normal responses, test a deliberately failing candidate, and only
      then produce a candidate.
    h3: Locate the relation exchange operation in the published client reference. List the observed constraints,
      exercise a known rejection, and use the difference to test a candidate that still requires service validation.
    references:
    - kind: client_route
      id: planning.relation-exchange
  W11.3:
    h1: Begin with the relation schema, backend exchange, and asset-lineage service. Its published client document
      exposes the asset lineage operation, so use that ordinary contract instead of guessing a path.
    h2: Treat this as protocol reconstruction followed by identity-field traversal at the relation boundary. Carry
      forward only earned identities and record bindings; possession of a copied identifier alone does not cross
      the next boundary.
    h3: Locate the asset lineage operation in the published client reference. Replay the preceding evidence through
      the next documented boundary and verify the downstream service, not the client, records the outcome.
    references:
    - kind: client_route
      id: planning.asset-lineage
  W12.1:
    h1: Submit the lineage record from W11.3 to the planning.lineage-record route first. This unlocks
      the archive.quarantine-collector route in retained-archive.arwc.test's client document.
    h2: Download the QTN-COL-2019-12.aqtn artifact and parse its AQTN1 binary frame. The frame begins
      with the AQTN1 magic and fixed-width length and digest fields. The build ID and a JSON metadata
      header follow and identify the collector without requiring payload decryption.
    h3: Use the Gitea repository and access token from the quarantine response to download collector-crr
      via the Gitea API contents endpoint. Verify its SHA256 and submit it to archive.collector-recovery
      to earn the completion audit.
    references:
    - kind: participant_service
      id: retained-archive.arwc.test
    - kind: participant_service
      id: planning-data.arwc.test
    - kind: participant_service
      id: engineering.arwc.test
  W12.2:
    h1: The collector binary's build ID (COLLECT-CRR-12) and the AQTN1 frame's archive ID (ARC-COLD-CRR-2019)
      are the HKDF inputs. IKM is the build ID as bytes, salt is the archive ID as ASCII, info is "aqtn1/keys".
      Derive 64 bytes and split into two 32-byte keys.
    h2: Apply each operation from AQTN1-samples.json. The first 32 key bytes are the AES-256-GCM content key.
      The second 32 bytes are the AES-256-KW wrapping key. For the authentication-failure sample, detect the
      GCM tag mismatch and record the sentinel "authentication_failed" instead of plaintext.
    h3: Submit a sample_results dict to archive.bundle-collection-policy mapping each sample ID to the SHA-256
      hex digest of its computed output (or "authentication_failed" for the rejection case). Every sample must
      match exactly. The returned PROTECTION record names the derivation scheme needed for W12.3.
    references:
    - kind: client_route
      id: archive.bundle-collection-policy
  W12.3:
    h1: The AQTN1 frame from W12.1 contains the nonce (12 bytes after the build ID) and the metadata header
      JSON (immediately after the nonce). These are the GCM inputs. The encrypted payload with its 16-byte
      tag follows the metadata header.
    h2: Use the content key (first 32 HKDF bytes from W12.2) for AES-256-GCM decryption. The metadata header
      bytes are the AAD. The decrypted JSON contains wrapped_pkcs8 — unwrap it with the wrapping key (bytes 32-63)
      using AES-256-KW.
    h3: Submit the decrypted plaintext and the unwrapped PKCS8 key (both as base64) to archive.cold-archive-job.
      The service validates both and returns the ARC-COLD-CRR-2019 record naming the 37 maintenance records,
      COLLECT-2019-12, and rollover IDREL-COL-R4.
    references:
    - kind: client_route
      id: archive.cold-archive-job
  W12.4:
    h1: The archive plaintext from W12.3 contains the retired_client_certificate (PEM) and rollover dict
      (IDREL-COL-R4 with its CA-signed signature). These are the exchange inputs. The historical PKCS8 key
      from W12.3 is an Ed25519 key — use it to sign the proof message.
    h2: Sign the message "collect-archive/v3|CUR-COL-CRR-R11|R11|<nonce>" with the historical Ed25519 key.
      Submit operation: exchange to archive.collection-path. The service checks the cert chain and rollover
      signature but not the retired_subject: true flag, so the retired identity succeeds.
    h3: Use the returned collection_session token with operation: read and dataset CUR-COL-CRR-R11 at
      revision 11 to retrieve the current protected data for AST-CRR-017. Session expires in 10 minutes;
      a second exchange while it is active returns 409.
    references:
    - kind: participant_service
      id: retained-archive.arwc.test
  W13.1:
    h1: The contractor portal publishes its client document at contractor-portal.arwc.test/.well-known/arwc-client.
      Traverse the published client reference graph — start from any service already reached and follow the
      related links until you find the contractor portal service.
    h2: The contractor portal client document lists the contractors.appointment-window route. Use your
      corporate session to call it. No additional credential or session is required for this step.
    h3: The route returns APT-CRR-2026-09-18 with inspection=INSP-CRR-2026-09-18, asset=AST-CRR-017,
      and Thursday 09:00-11:00. Record all fields — appointment_id, inspection, asset, and window are
      needed for W13.2 and later cards.
    references:
    - kind: client_route
      id: contractors.appointment-window
  W13.2:
    h1: The contractor portal client document also exposes contractors.expected-visitors. This is a separate
      route from contractors.appointment-window — the appointment record does not contain the full roster.
      Call it with your corporate session.
    h2: The roster record is ROSTER-CRR-SEP18-R2, held separately from the appointment. It identifies the
      actual contractor who should appear at the gate, not just the appointment owner.
      Record the identity and assignment fields.
    h3: The roster gives you identity=veybridge.tech.204 and assignment=CTR-VEY-204. These differ from the
      appointment's attendee field. They are needed to construct the correct check-in in W13.3.
    references:
    - kind: client_route
      id: contractors.expected-visitors
  W13.3:
    h1: The contractors.appointment route expects appointment_id and expected_revision (from W13.1),
      attendee and caller_organization from the W13.2 roster, and the immutable inspection, asset, and
      window unchanged. Both W13.1 and W13.2 must be completed first.
    h2: The route checks that the attendee belongs to your contractor organization — validated against the
      roster. But it does not check if your organization is the appointment owner. Supply the roster
      identity (veybridge.tech.204) and Veybridge Technical Services as the caller organization.
    h3: After the update: attendee=veybridge.tech.204 and owner_organization=Northbank Civil Inspections
      is unchanged. Inspection, asset, and window are immutable. Record the updated revision for W13.4.
    references:
    - kind: client_route
      id: contractors.appointment
  W13.4:
    h1: contractors.check-in requires appointment_id (W13.1), roster_id (W13.2), and identity=veybridge.tech.204
      (W13.2 roster identity). The W13.3 BOLA already set the appointment attendee to match your identity,
      so the check-in service accepts it.
    h2: After a successful check-in, the returned contractor_session is a real ERPNext-issued session token.
      Use it as a bearer token to call contractors.field-kit — the protected field-work record for the
      inspection scope.
    h3: The field-kit record (FIELD-BAG-CRR-4417-R3) names the expected outlets and service manifest for
      the inspection. The contractor session scope is field-work:read. Record the contractor_session token
      for downstream use in W14+.
    references:
    - kind: client_route
      id: contractors.check-in
  W14.1:
    h1: The contractor portal client document exposes contractors.field-kit. Use the contractor session
      from W13.4 as the bearer token. A corporate session alone returns 403.
    h2: The route returns FIELD-BAG-CRR-4417-R3 with inspection=INSP-CRR-2026-09-18 and asset=AST-CRR-017.
      Record the expected outlets (OG-CRR-02) and the service manifest with both legacy and current endpoints.
    h3: The service manifest distinguishes the retired legacy endpoint (field-read-legacy.arwc.test) from the
      current endpoint (process-read.arwc.test). Record both — W14.2 and W14.3 need the manifest to identify
      which endpoint carries current data.
    references:
    - kind: client_route
      id: contractors.field-kit
  W14.2:
    h1: The field-read-legacy.arwc.test endpoint referenced in the W14.1 field bag is retired — it returns
      HTTP 410 for all requests. Use the field.instrument route in the field-gateway client document instead.
    h2: Call the field.instrument route with your W13.4 contractor session. It returns the live service manifest
      from the field bag. The manifest identifies field-read-legacy.arwc.test as retired and
      process-read.arwc.test as the active service.
    h3: The active service uses process-read/v2 with CBOR encoding and inspection-scoped authentication at
      revision 21. Record all three — they are required to build the correct read request in W14.3.
    references:
    - kind: client_route
      id: field.instrument
  W14.3:
    h1: The active service from W14.2 is process-read/v2 with CBOR encoding. The retained fieldbag/v1 client
      sends JSON — that is not accepted. Build a CBOR map with keys asset, group, observed_at, and nonce as
      required by process-read/v2.
    h2: The asset must match the inspection asset (AST-CRR-017) and the group must be OG-CRR-02 (from the
      expected_outlets in the field bag). Use a fresh observed_at timestamp (within 10 minutes) and a unique
      nonce. Submit with Content-Type: application/cbor and your W13.4 contractor session.
    h3: The route returns FEED-OG2-R21 with observations for FIT-CRR-204A and FIT-CRR-204B, the instruments
      for OG-CRR-02. These are real readings from the OT operating-history service. Record the result for
      downstream use in the W14.READ arc.
    references:
    - kind: client_route
      id: field.current-reading
  W15.1:
    h1: The maintenance-review service publishes its client document at maintenance-review.arwc.test/.well-known/arwc-client.
      Traverse the client reference graph starting from any service already reached and follow the related links
      to find the maintenance-review service.
    h2: The maintenance.drawing-cache route requires your W13.4 contractor session as the bearer token. Use the
      same session earned from the check-in. A corporate session alone returns 403.
    h3: The cache association identifies CACHE-DRW-OG2-R8 binding drawing DRW-OG2-R8 at revision R8 to reviewer
      queue REV-CRR-4417 at drawings.arwc.test. Record all fields — the drawing identity, revision, and queue
      are needed for W15.2 and later cards.
    references:
    - kind: client_route
      id: maintenance.drawing-cache
  W15.2:
    h1: The drawing-cache-update route accepts a controlled HTML body from the allowlisted preview origin
      preview-cinder.arwc.test. Set X-Preview-Origin: https://preview-cinder.arwc.test and submit your
      controlled response with cache path /viewer/drawings/DRW-OG2-R8, preserving drawing_id and revision.
    h2: The controlled body must be CRLF-free HTML. After a successful cache update (201), trigger the
      reviewer browser via POST /api/drawing-approvals with cache_key=GET:/viewer/drawings/DRW-OG2-R8 and
      reviewer_queue=REV-CRR-4417 using your W13.4 contractor session.
    h3: The reviewer browser accepts the postMessage from a nested iframe despite a source-mismatch in the
      event handler. A successful run returns CAP-REVIEW-CRR-4417 with review-submit scope, which is the
      prerequisite for W15.3.
    references:
    - kind: client_route
      id: maintenance.drawing-cache-update
  W15.3:
    h1: After completing the W15.2 cache update, call POST maintenance.drawing-approvals (from the client
      document) with cache_key=GET:/viewer/drawings/DRW-OG2-R8 and reviewer_queue=REV-CRR-4417. Use your
      W13.4 contractor session.
    h2: The service runs the real Chromium 128 reviewer browser on the controlled drawing you poisoned in
      W15.2. The reviewer's JavaScript accepts the postMessage without checking event.source, which is the
      source_check: "omitted" flaw.
    h3: The returned CAP-REVIEW-CRR-4417 with source_check="omitted" and browser="Chromium 128" is the
      submission capability for the reviewer session. Record the review_capability token — it is the access
      token for W15.4.
    references:
    - kind: client_route
      id: maintenance.drawing-approvals
  W15.4:
    h1: After obtaining the W15.3 review capability token, call POST maintenance.approval-token with
      review_capability, approval_id=APR-CRR-4417-R6, and inspection=INSP-CRR-2026-09-18. The endpoint
      validates the audience but not the capability's subject-to-inspection binding.
    h2: The review capability from W15.3 is scoped to DRW-OG2-R8 (the drawing). The approval endpoint
      accepts it for inspection INSP-CRR-2026-09-18 because it omits the subject-to-inspection comparison.
      This is the expert flaw that allows crossing from the drawing scope to the inspection approval.
    h3: The returned APR-CRR-4417-R6 has the real ERPNext maintenance binding (WO-CRR-4417, INSP-CRR-2026-09-18,
      AST-CRR-017) signed with Ed25519. Record the signing_public_key — it is the verification key for W26.
    references:
    - kind: client_route
      id: maintenance.approval-token
  W16.1:
    h1: Call GET retained-archive.arwc.test/api/sequencer-specs/current with your CORPORATE session to retrieve
      the SEQ-CRR-4 descriptor. It contains the opcode table, authorized index range, and the ordinary trace
      SEQ-BASE-17 with its program_hex.
    h2: Submit the ordinary trace with POST retained-archive.arwc.test/api/sequencer-programs and body
      {"program_hex": "0104000007000000"}. The program decodes as LOAD slot 4 (the zero reference) followed
      by HALT. The service checks that the descriptor was observed first.
    h3: The expected result is authorized-load with cycles=228. Confirm the service-owned audit shows
      sequencer-program-submitted with the correct cycle count before proceeding to W16.2.
    references:
    - kind: client_route
      id: archive.sequencer-spec
    - kind: client_route
      id: archive.observations
  W16.2:
    h1: The LOAD instruction reads the sample and adds its data-dependent cycle cost before the authorization check.
      Submit a program to POST /api/observations with LOAD on a slot index outside 0-31 and observe the status
      and cycle count in the response.
    h2: Any LOAD with index >= 32 returns late-authorization-rejection with a non-null boundary_index. The cycle
      cost 20 + 4 * bit_count(sample) is accumulated before the check, so the cycle count still encodes
      information about the out-of-window slot's bit population.
    h3: Target slot 159 for the designated crossing. Program bytes 01 9F 00 00 07 00 00 00 (LOAD 159, HALT),
      base64 AZ8AAAcAAAA=. Expected response: status=late-authorization-rejection, boundary_index=159, cycles=236.
    references:
    - kind: client_route
      id: archive.observations
  W16.3:
    h1: Use POST /api/signal-experiments with operation=measure and TEST (opcode 5) instructions. Each TEST(slot,
      probe) entry returns cycles = 1200 + 64*popcount(sample[slot] XOR probe) + jitter. Test slot 159 with
      probe=0 for the baseline and also test reference slots 4, 5, 6 to validate the formula.
    h2: For each bit i (0-7), submit TEST(159, 2**i). If cycles(probe=2^i) < cycles(probe=0), bit i is set.
      The ±64 cycle signal dominates the ±2 jitter. Work through all eight positions to recover the full byte.
    h3: After recovering the byte (165 = 0xA5), submit operation=verify with reference_values={"4":0,"5":1,
      "6":255}, target_slot=159, recovered_byte=165, repetitions=8, bit_order="lsb0". Success returns
      SEQ-DISCRIM-CRR-4 and sets the flag required for W16.4.
    references:
    - kind: client_route
      id: archive.signal-experiment
  W16.4:
    h1: Slots 160-191 hold the 32-byte calibration record. Use POST /api/signal-experiments measure programs
      targeting those slots. Max 63 TEST instructions per program (64-instruction limit includes HALT), so
      cover 32 slots with 9 probes each across 5 programs.
    h2: Apply the W16.3 bit-discrimination to each of the 32 slots. Reconstruct all bytes, then verify the
      CRC32C: last 4 bytes must equal crc32c(first 28 bytes) in big-endian. If the check passes, the
      calibration is complete.
    h3: Submit to POST /api/instrument-history/current with record_id="CAL-CRR-OG2-R8", field_revision="R8",
      calibration=base64(recovered_32_bytes), plus the standard sequencer/revision/request_id. Success
      returns revision=8 and slots=[160, 191].
    references:
    - kind: client_route
      id: archive.instrument-history
  W17.1:
    h1: Navigate to FUXA (hmi.arwc.test) and open the Cairn Reach overview. The view shows live level, usable
      volume, two outlet positions (%), two outlet flows (m3/s), total flow, mode, and owner — all updated in
      real time from OPC UA tags polled from the PLC (opc.tcp://plc:4840/arwc, namespace urn:arwc:crr:tags).
    h2: The measured actuator position (CRR.PositionPct, CRR.PositionBPct from sensors) is shown separately
      from the accepted controller setpoint (CRR.RequestedTargetPct, CRR.RequestedTargetBPct). Record both
      columns with the same UTC observation time visible in FUXA or from the historian.
    h3: Verify against the PostgreSQL historian (ot_history.process_samples). Query SELECT DISTINCT ON
      (tags->>"variable") time, tags->>"variable", tags->>"unit", fields->>"value" FROM
      ot_history.process_samples ORDER BY tags->>"variable", time DESC to retrieve all 50 current tag values.
    references:
    - kind: participant_artifact
      id: /home/fieldlink/CairnReach/Briefs/W17/live-observation.md
  W17.2:
    h1: The five fields come from FUXA crr-overview header and both outlet faceplates. Mode is CRR.AutoMode
      (false=manual), owner is CRR.Owner (0=local/HMI, 1=remote), field-data state is CRR.IoHealthy, and
      per-outlet permissives are CRR.PermissiveA and CRR.PermissiveB.
    h2: All five tags are in ot_history.process_samples. Query SELECT DISTINCT ON (tags->>"variable") time,
      tags->>"variable", fields->>"value" FROM ot_history.process_samples WHERE tags->>"variable" IN
      ("AutoMode","Owner","IoHealthy","PermissiveA","PermissiveB") ORDER BY tags->>"variable", time DESC.
    h3: Do not infer mode or owner from W17.1 — read the live tags at the current UTC time and bind all five
      fields to that same timestamp. The historian must confirm good-quality samples at the recorded time.
    references:
    - kind: participant_artifact
      id: /home/fieldlink/CairnReach/Briefs/W17/live-observation.md
  W17.3:
    h1: Read ~/CairnReach/Briefs/W17/engineering-reference.md (reference CRR-ENG-INST-204B-R1). It maps the
      outlet B flow transmitter FIT-CRR-204B to IEC variable FlowBM3s, OPC UA NodeId, historian series, and
      unit. The reference describes the identity but does not supply a current value or confirm quality.
    h2: Confirm in the historian catalog: SELECT variable, series, node_id, unit FROM ot_history.tag_catalog
      WHERE series = 'flow_b_m3s'. The result must match the reference document exactly on all five fields.
    h3: Verify the point is live: SELECT time, fields->>"value" FROM ot_history.process_samples WHERE
      tags->>"variable" = 'FlowBM3s' ORDER BY time DESC LIMIT 1 confirms recent StatusGood samples.
    references:
    - kind: participant_artifact
      id: /home/fieldlink/CairnReach/Briefs/W17/engineering-reference.md
  W17.4:
    h1: Pick a 15-to-300-second interval and query ot_history.process_samples for FlowBM3s and PositionBPct.
      The five identities from W17.3 (variable=FlowBM3s, NodeId, series=flow_b_m3s, unit=m3/s, historian path)
      must all appear. Count samples with good transport quality. Do not use public.process_history (no B tags).
    h2: The position-to-flow relationship is required evidence. At PositionBPct=20%, FlowBM3s should be ~20%
      of the outlet B max capacity (0-0.5 m3/s, from ot_history.tag_catalog). Verify the ratio before
      recording the trace.
    h3: Record interval start/end UTC, good sample count, flow min/max/mean, and concurrent PositionBPct. All
      six of FUXA variable, OPC UA NodeId, historian series, unit, good sample count, and position-flow ratio
      must agree to supply W17.OBS.
    references:
    - kind: participant_artifact
      id: /home/fieldlink/CairnReach/Briefs/W17/live-observation.md
  W18.1:
    h1: Read ~/CairnReach/Briefs/W18/tag-register.csv (register CRR-IO-R364, project_revision=364, 6 Modbus
      input registers PDU offset 0-5). Then read /usr/share/arwc-ot/tags.json on the OT engineering host
      to confirm its project_revision=364 matches.
    h2: Confirm the running revision via OPC UA: query nsu=urn:arwc:crr:tags;s=CRR.ProjectRevision from FUXA
      or the historian; it must equal 364. Then confirm all five process variable entries in
      ot_history.tag_catalog share register_sha256=df09d72a355340266896c59a204248e02aa277769f881e7a2f6ce6d15b6f7a3b.
    h3: The five required process variables (non-heartbeat) are LevelM (%IW0), PositionPct (%IW1), FlowM3s
      (%IW2), PositionBPct (%IW4), FlowBM3s (%IW5). The Heartbeat (%IW3) is an I/O health counter only.
    references:
    - kind: participant_artifact
      id: /home/fieldlink/CairnReach/Briefs/W18/tag-register.csv
  W18.2:
    h1: From CRR-IO-R364, find FIT-CRR-204B: FC4, PDU offset 5, IEC address %IW5, raw FlowBRaw (UINT,
      10000 counts/m3/s), engineering FlowBM3s. The PDU offset (5) and IEC word offset (5 in %IW5) look
      the same here because address_base=0, but they are different addressing layers.
    h2: The scale factor (10000 counts/m3/s) is in the register definition, NOT in the OPC UA tag name or
      historian series. A raw value of 1000 counts = 0.100 m3/s. Confirm the engineering value via FUXA
      and via ot_history.tag_catalog (variable=FlowBM3s, unit=m3/s).
    h3: Catalog query: SELECT variable, series, node_id, unit FROM ot_history.tag_catalog WHERE
      variable = 'FlowBM3s'. Returns flow_b_m3s, nsu=urn:arwc:crr:tags;s=CRR.FlowBM3s, m3/s. Record
      all seven layers to complete the binding.
    references:
    - kind: participant_artifact
      id: /home/fieldlink/CairnReach/Briefs/W18/tag-register.csv
  W18.3:
    h1: Read ~/CairnReach/Briefs/W18/history-provenance.md first. Run the LAG gap query against
      public.process_history with tag = 'flow_b_m3s' (series name, not OPC UA variable name FlowBM3s)
      and filter for transport_quality ILIKE '%Good%'. Order by source_gap DESC to find the largest gap.
    h2: The largest qualifying gap is about 1 day 3 hours 53 minutes: last good sample 2026-11-13 16:54:46
      UTC, next good sample 2026-11-14 20:48:19 UTC. This is a real collection interruption. Record all
      three timestamps and both quality fields for both bounding rows.
    h3: Confirm unit=m3/s did not change across the gap (both sides show m3/s, value=0.100 m3/s). The gap
      is in source_time (the controller clock gap), not just display rows missing. A display gap alone
      does not prove a source-time gap.
    references:
    - kind: participant_artifact
      id: /home/fieldlink/CairnReach/Briefs/W18/history-provenance.md
  W18.4:
    h1: Build the A/B mapping from CRR-IO-R364: outlet A uses PDU offsets 1 (%IW1, PositionPct) and 2
      (%IW2, FlowM3s); outlet B uses PDU offsets 4 (%IW4, PositionBPct) and 5 (%IW5, FlowBM3s).
      Confirm all four OPC UA NodeIds and historian series from ot_history.tag_catalog.
    h2: Choose a 1-second window in ot_history.process_samples and query all four variables at the same
      source_time. Verify physical consistency: at 20% position, flow should be ~20% of 0.5m3/s = 0.100
      m3/s. Both outlets currently show 20% position and 0.100m3/s flow — symmetric.
    h3: The observation must show both outlets' position AND flow at the same UTC timestamp with Good
      quality. Physical consistency (position matches flow for each outlet) is required. This supplies
      W18.MAP. Do not move either gate to manufacture evidence.
    references:
    - kind: participant_artifact
      id: /home/fieldlink/CairnReach/Briefs/W18/tag-register.csv
  W19.1:
    h1: Use the CORPORATE session from the FieldLink handover. The process.diagnostic-program route in the
      published client reference points to the diagnostic endpoint at process-view.arwc.test. The binary in
      Gitea (clara.morivelle/retained-engineering-tools/engineering/diag-crr-mixed-19) is starting material
      for W19.2-W19.4, not the W19.1 answer path.
    h2: Authenticate with your CORPORATE Bearer token and call GET https://process-view.arwc.test/api/
      diagnostic-programs/current. The service returns an authoritative record with record_id, project_family,
      sha256, format, and ordinary_traces. Record the audit_id as fresh evidence.
    h3: Compare the returned project_family with the live CRR.ProjectRevision from FUXA or the historian
      (ot_history.tag_catalog variable=ProjectRevision). The gap between the diagnostic's project generation
      and the running system's revision is the finding.
    references:
    - kind: gitea_repo
      id: clara.morivelle/retained-engineering-tools
  W19.2:
    h1: The binary has two entry points. The alternate path uses mixed_mode_entry which pushes CS=0x23 (32-bit
      compatibility segment) and executes RETFQ. Use objdump -M intel -d to find the far return and the .code32
      section. The alternate test record WRAP-FFFFFFFF-OG2 is embedded in the binary (visible via strings).
    h2: Implement the 32-bit decoder: value = (rotl32(value^byte, 5) + 0x9E3779B9) & 0xFFFFFFFF starting at
      0x6D2B79F5. The 32-bit rotate is ((v<<5) | (v>>27)) & 0xFFFFFFFF. All wraps at 32 bits. The 64-bit
      version without wraps produces a different value that the service rejects.
    h3: POST https://process-view.arwc.test/api/signature-records/current/interpretation with CORPORATE Bearer:
      {"record":"WRAP-FFFFFFFF-OG2","rolling32":"<8-hex-digits>"}. Correct result returns DIAG-TRACE-COMPAT-19
      with execution=i386-compatibility and sets compatibility_reproduced=True for W19.3.
    references:
    - kind: client_route
      id: process.signature-record
  W19.3:
    h1: W19.1 ordinary_traces gives rolling32 AND verifier64 for the first 4 records. The 5th is named
      protected_record. Implement the same verifier formula for all 5. The verifier takes the 32-bit rolling
      result and applies a 64-bit function embedded in the binary's long-mode verifier code.
    h2: Verifier formula: start v=0x243F6A8885A308D3 (pi constant). For each rolling32 r:
      v=ROTL64(v XOR (zero_extend(r)*0x100000001B3), 9). Final verifier64=v XOR zero_extend(r).
      The 64-bit constant and FNV-prime variant (0x100000001B3) are in the binary.
    h3: POST https://process-view.arwc.test/api/signature-programs/current with CORPORATE Bearer:
      {"decisions":[{record,rolling32,verifier64}x5]} for all 5 in order. Service validates all and
      returns MIG-OG2-R19-R21 with verifier64 and decision=valid, sets hidden_check_recovered=True.
    references:
    - kind: client_route
      id: process.signature-program
  W19.4:
    h1: Use the process.diagnostic-program-legacy route from the engineering workbench client document
      (/.well-known/arwc-client). POST https://process-view.arwc.test/api/diagnostic-programs/legacy with
      CORPORATE Bearer. Gates on hidden_check_recovered (W19.3). Supplies W19.MAP.
    h2: Compute comparison_digest: SHA256 of the mapping JSON (sorted keys) with legacy_project=CRR-CTRL-R19,
      current_project=CRR-CTRL-R21, instruments={OUTLET_A:FIT-CRR-204A,OUTLET_B:FIT-CRR-204B},
      legacy_identifiers={OUTLET_A:OG-CRR-02/GT-CRR-02A,OUTLET_B:OG-CRR-02/GT-CRR-02B}. Not in any file.
    h3: Discover the observation: SELECT name, text, alarm_group FROM alarm_history WHERE
      alarm_group='OG-CRR-02' to find the qualifying commissioning event name. Submit {"migration_record":
      "MIG-OG2-R19-R21","comparison_digest":"<sha256>","observation":"<event_name>"}. Returns
      MAP-OG2-LEGACY-R21 historical=true current_project=CRR-CTRL-R21. Do not replace the running revision.
    references:
    - kind: client_route
      id: process.diagnostic-program-legacy
  W20.1:
    h1: Call GET https://independent-instruments.arwc.test/api/firmware-images/current with CORPORATE Bearer.
      Returns the image manifest (sha256, record layout: magic=F204, 64-byte records, 4096-byte erase pages)
      and the image base64. The image is also in Gitea clara.morivelle/retained-engineering-tools/instruments/.
    h2: Parse 8192 bytes into 64-byte records. Valid record: magic=F204, CRC32C of bytes 0-55 at bytes 56-59,
      commit=0x00 at byte 63. Payload at bytes 12+: record_id\0asset\0inspection_date null-separated.
      Status byte 10 (1=REVIEW, 2=ACCEPTED), status_bits byte 11. Highest sequence wins per record_id.
    h3: POST https://independent-instruments.arwc.test/api/maintenance-records/current with CORPORATE Bearer:
      {image_sha256, record_id, asset, inspection_date, sequence, status, status_bits, crc32c, offset}.
      All 8 fields validated. Returns inspection record with fresh audit. Sets inspection_recovered=True.
    references:
    - kind: client_route
      id: process.firmware-image
  W20.2:
    h1: The W20.1 record has status=REVIEW. To promote it to ACCEPTED, write a new record at offset 128
      (the next erased slot, all 0xFF). NOR flash programming changes only 1→0, so writing to an erased
      slot is always valid. New record: sequence=119, status=0x02 (ACCEPTED), same asset/date as original.
    h2: Build the 64-byte record: magic=F204, seq=119 (uint32 LE), payload_len=40 (uint16 LE), status=0x02,
      status_bits=0x01, payload at bytes 12-51, CRC32C of bytes 0-55 at bytes 56-59, 0xFFFFFF at 60-62,
      commit=0x00 at byte 63. Split: 3 operations at offsets 128 (56 bytes), 184 (4 bytes), 191 (1 byte).
    h3: POST https://independent-instruments.arwc.test/api/maintenance-records/current with CORPORATE Bearer:
      {"operations":[{kind,offset,data_b64}x3],"image_b64":"<modified_8192_bytes>"}. Service validates NOR
      semantics, confirms seq=119 status=ACCEPTED. Returns updated record. Sets image_rewrite_accepted=True.
    references:
    - kind: client_route
      id: process.maintenance-record
  W20.3:
    h1: Correcting inspection_date from 2026-09-18 to 2026-09-19 flips bit 0 of the ASCII '8' byte (0x38)
      to '9' (0x39) — a 0→1 transition requiring a page erase first. Submit erase page 0 as the first op,
      then rewrite all 3 records (CAL at 0, REVIEW at 64, corrected ACCEPTED seq=120 at 128).
    h2: 10 total operations: {"kind":"erase","page":0} + 3 program ops for CAL (offsets 0,56,63) + 3 for
      REVIEW (offsets 64,120,127) + 3 for corrected record (offsets 128,184,191). The corrected record has
      seq=120, status=ACCEPTED, inspection_date=2026-09-19, and new CRC32C of its first 56 bytes.
    h3: Service validates NOR semantics, confirms seq=120 ACCEPTED date=2026-09-19, wear_counts=[18,9].
      Returns corrected record with audit_id. erase_rewrite_accepted=True in state after success.
    references:
    - kind: client_route
      id: process.maintenance-record-update
  W21.1:
    h1: Read ~/CairnReach/Briefs/W21/deployment-note.md (CRR-PLC-COM-364) for five claims to verify. Open
      ~/CairnReach/controller in OpenPLC Editor or inspect directly. The commissioning note is starting
      material; the project files are authoritative.
    h2: project.json: name=arwc-site, task0 Cyclic T#100ms, program=main. devices/configuration.json:
      deviceBoard=OpenPLC Runtime v4, runtimeIpAddress=172.29.63.20. pous/programs/main.fbd: declared
      ProjectRevision : UINT := 364.
    h3: Independently observe ProjectRevision from the live OT: query CRR.ProjectRevision from FUXA or
      ot_history.tag_catalog. Confirm the running value (364) matches the saved project's declared value.
      Do not compile, upload, start, stop, or force anything.
    references:
    - kind: participant_artifact
      id: /home/fieldlink/CairnReach/Briefs/W21/deployment-note.md
  W21.2:
    h1: Compile the saved project in OpenPLC Editor, connect to the runtime at 172.29.63.20:8443 without
      accepting any upload offer. The editor's compiled-program MD5 must match the runtime's readProgramMd5.
      Authenticate to the Runtime API (POST /api/login) to query GET /api/status for running state.
    h2: The program MD5 (from the debug channel or /api/readProgramMd5) is not in any shipped file — it
      proves which compiled binary is scanning. Also verify: runtime state=STATUS:RUNNING, no active forces,
      and live ProjectRevision=364 from the editor debugger or OT historian.
    h3: All four conditions required: program MD5 match, STATUS:RUNNING, no forces, live ProjectRevision=364.
      A connection alone is insufficient. The program MD5 and runtime state are the independent live evidence.
      This supplies W21.REVISION.
    references:
    - kind: participant_artifact
      id: /home/fieldlink/CairnReach/Briefs/W21/deployment-note.md
  W22.1:
    h1: Call GET https://process-view.arwc.test/api/sealed-projects/current/viewer with CORPORATE Bearer.
      Returns the delivery record with five binding fields plus SHA256 values and binary artifacts. Sets
      viewer_observed=True in state for W22.2+.
    h2: The viewer binary is also at clara.morivelle/retained-engineering-tools/engineering/sealed-viewer
      in Gitea. Compute its SHA256 to verify against the service response viewer_sha256. The delivery IDs
      and SHA256 are not in any shipped file — they come from the service call.
    h3: Record all five binding fields (delivery_id, viewer_id, viewer_language, platform, project_id) and
      viewer_sha256. The ordinary_cases field supplies reference cases for W22.2+. This establishes the
      delivery-to-binary binding.
    references:
    - kind: client_route
      id: process.sealed-viewer
  W22.2:
    h1: W22.1 ordinary_cases has 4 programs (program_b64, base64-encoded 6-byte-aligned bytecode). The
      expected results are NOT included — implement the 16-bit VM from the architecture description or by
      analyzing the sealed-viewer binary: 4 registers, 256 bytes memory, 6-byte LE instructions, 4096 cap.
    h2: 8 opcodes: MOVI/LOAD8/XOR/ADD/ROTL/STORE8/JNZ/HALT with 16-bit wrap arithmetic. LOAD8 zero-extends
      memory[(reg[src]+imm)&0xFF]. STORE8 writes reg[src]&0xFF. ROTL uses imm&15. JNZ adds signed imm to PC
      only if zero flag is false. Each result needs registers, SHA256(memory[0x40:0x80]), and steps.
    h3: POST https://process-view.arwc.test/api/sealed-viewers/current/execute with CORPORATE Bearer:
      {"cases":[result_0,result_1,result_2,result_3]}. Verify all 4 match the reference cases. Returns
      VIEW-VM-R5 with full VM spec. Sets vm_reconstructed=True for W22.3+.
    references:
    - kind: client_route
      id: process.sealed-viewer-execute
