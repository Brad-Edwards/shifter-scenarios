    h3: Locate the integration contract and report sources operation in the published client reference. Replay the
      preceding evidence through the next documented boundary and verify the downstream service, not the client,
      records the outcome.
    references:
    - kind: client_route
      id: business.integration-contract
    - kind: client_route
      id: business.report-sources
    - kind: client_route
      id: planning.integration-session
  W10.1:
