schema_version: 2
phase: arwc
hints:
  W01.1:
    h1: Start with the customer-owned handover associated with the accepted FieldLink delivery. Its ordinary
      client reference identifies the retained handover route.
    h2: Distinguish the customer record from the supplier delivery receipt. Match the current connector,
      customer receipt and maintenance binding.
    h3: Read the retained handover through its published client route and compare its business identifiers
      with the accepted delivery record.
    references:
    - kind: client_route
      id: corporate.handover
  W01.2:
    h1: The supplier onboarding material names the document service and the external handover folder.
      Look among the ordinary planning and attendance documents.
    h2: Use record correlation from the document itself rather than an old work-order API. The planning
      assignee and physical inspection are distinct from software delivery acceptance.
    h3: Open the planning handover in Nextcloud and retain its current file identity, revision and outstanding
      inspection details.
    references:
    - kind: participant_service
      id: documents.arwc.test
  W01.3:
    h1: The supplier handover includes an ordinary purchasing note. It explains which records Planning
      and Procurement use for dry-period decisions.
    h2: Use business-record classification to distinguish a supplier quotation, an accepted reservation
      and a settlement tariff. They do not describe the same commitment.
    h3: Read the continuity purchasing note and identify the stated measures and reservation condition
      without borrowing authority from another supplier.
    references:
    - kind: participant_service
      id: documents.arwc.test
  W01.4:
    h1: The physical inspection and its supplier handback remain separate from the accepted software delivery.
      Find the actual maintenance task in the ERP system for the current case.
    h2: A native per-record share can grant more authority than the supplier role suggests. Compare the
      available task permissions with neighboring inspection records.
    h3: Reconcile the case, project and inspection first, make only the requested task change through
      ERPNext, then inspect its native version history.
    references:
    - kind: participant_service
      id: erp.arwc.test
  W02.1:
    h1: The supplier portal contains ordinary purchase orders with supplier relationships and service
      line descriptions. Begin with the current outlet inspection order.
    h2: A display label alone is weaker than correlation through the actual supplier relationship and asset
      reference carried by the order.
    h3: Open the permitted order and record its native identity, supplier and maintenance asset from the
      order itself.
    references:
    - kind: participant_service
      id: suppliers.arwc.test
  W02.2:
    h1: The internal work order, supplier job and engineering drawing use different names. Each independent
      order, annex and drawing-register record carries stable references.
    h2: Use reconciliation across independently owned business records, matching their references and accepted
      revisions rather than similar display labels.
    h3: Compare the ERPNext project and order with the annex and native document register; retain a source
      identity for each side of the join.
    references:
    - kind: participant_service
      id: documents.arwc.test
  W02.3:
    h1: The supplier account can see a small set of maintenance records. Check which are ordinary handback
      work and which belong to engineering review.
    h2: Compare native per-record authorization with the intended supplier job association. A readable
      engineering record need not grant permission to edit it.
    h3: Read the associated inspection record, inspect its actual sharing scope and establish the denied
      neighboring record and write boundary.
    references:
    - kind: participant_service
      id: erp.arwc.test
  W03.1:
    h1: The supplier handover has an ordinary order-document register. Keep its purchase order and attachment
      identities together when following the retained annex link.
    h2: Use the native attachment relationship instead of a guessed business-service route. Check the
      annex revision and its drawing reference.
    h3: Open the supplier document register, follow it to the native private annex, and retain its file identity
      and content hash alongside the actual order reference.
    references:
    - kind: participant_service
      id: suppliers.arwc.test
  W03.2:
    h1: The current annex is only one revision of a logical file. Nextcloud also shows versions and files
      shared directly with the supplier account.
    h2: Compare the earlier distribution with the current recipient and the native incoming share. File
      access does not imply access to its parent department folder.
    h3: Download the previous annex version, compare its recipient with the current account and incoming
      share, then establish the separately shared engineering file and denied parent.
    references:
    - kind: participant_service
      id: documents.arwc.test
  W03.3:
    h1: The engineering acceptance note names the approved read service. Its live OpenAPI document describes
      the relations and fields that are actually published.
    h2: Reconcile a filtered live result with the accepted asset, planning window and source revision.
      A role name in a note does not prove the current database boundary.
    h3: Use the native schema document and a scoped read to establish the active record, then verify that
