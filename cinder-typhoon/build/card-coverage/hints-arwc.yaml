      flow, and the three accepted settings without changing any proposed field.
    h3: Check measured and accepted values in their separate sections of the sheet. Process history must contain
      good product-owned samples close to the UTC time you record.
    references:
    - kind: participant_artifact
      id: /home/fieldlink/CairnReach/Briefs/W17/live-observation.md
  W17.2:
    h1: FUXA's system header shows actual mode, command owner, and field-data state. Each outlet faceplate shows its own
      live permissive, so use both equipment views rather than assuming one outlet represents the other.
    h2: Use the same UTC observation time for comparison with the process values when possible. Proposed mode is an input; actual
      mode and owner are PLC outputs and are the values this card requires.
    h3: Record actual mode, owner, field state, and both permissives exactly as the live PLC-backed views show them.
      No mode change or interlock test is needed.
    references:
    - kind: participant_artifact
      id: /home/fieldlink/CairnReach/Briefs/W17/live-observation.md
  W17.3:
    h1: Read the installed outlet B engineering-reference document. It names the physical instrument and the controller
      variable; verify the same variable in the native OPC UA browser rather than copying only the note.
    h2: Preserve the expanded namespace URI binding of the NodeId and the engineering unit. The historian catalog
      supplies the series name for the same controller variable.
    h3: Join the physical instrument, IEC variable, OPC UA NodeId, historian series, and unit. Confirm the live
      browser and catalog expose that point before recording the binding.
    references:
    - kind: participant_artifact
      id: /home/fieldlink/CairnReach/Briefs/W17/engineering-reference.md
  W17.4:
    h1: Follow outlet B measured flow from FUXA to its OPC UA identity and then to PostgreSQL history. Use one
      15-to-300-second interval and do not issue a control request to manufacture a trace.
    h2: Select only good process-history samples for flow and measured position. Align them by source time; a local
      screenshot or copied number does not replace the historian rows.
    h3: Record the flow series first, last, minimum, maximum, and good sample count. Check that the time-aligned
      measured position is consistent with outlet capacity before submitting the joined observation.
    references:
    - kind: participant_artifact
      id: /home/fieldlink/CairnReach/Briefs/W17/live-observation.md
  W18.1:
    h1: Start with CRR-IO-R364 and the installed native register file at /usr/share/arwc-ot/tags.json. Record the register
      identifier and project revision, then calculate the native JSON digest rather than hashing the CSV export.
    h2: Compare the register revision with the live ProjectRevision OPC UA point. The historian tag catalog carries
      the register digest for the native variables and provides an independent product-owned check.
    h3: Submit the register ID, revision, digest, and required variable names only after both native views agree.
      No controller download, tag write, or history change is required.
    references:
    - kind: participant_artifact
      id: /home/fieldlink/CairnReach/Briefs/W18/tag-register.csv
  W18.2:
    h1: Follow FIT-CRR-204B across the CRR-IO-R364 document. Modbus function 4 and its zero-based PDU offset are not
      the same notation as an OpenPLC IEC address or an OPC UA NodeId.
    h2: Preserve the raw UINT encoding and counts-per-unit conversion separately from the engineering REAL value.
      Verify the stable namespace-URI NodeId and historian series against the native catalog.
    h3: Join the instrument, gate, function, offset, IEC address, raw type and scale, PLC value, NodeId, and series.
      A matching display name without the native identities is incomplete.
    references:
    - kind: participant_artifact
      id: /home/fieldlink/CairnReach/Briefs/W18/tag-register.csv
  W18.3:
    h1: Read the installed history-provenance document before querying FlowBM3s. Find the largest source-time gap whose
      bounding rows both have Good transport and process quality.
    h2: Treat source time, collection time, and ingestion time as separate metadata because they belong to the controller value, Telegraf, and PostgreSQL respectively.
      Record all three for both sides and check their order rather than treating them as one clock.
    h3: Compare the engineering unit on both bounding rows. The retained gap is a collection gap; do not invent a
      scale or unit change that the native history does not show.
    references:
    - kind: participant_artifact
      id: /home/fieldlink/CairnReach/Briefs/W18/history-provenance.md
  W18.4:
