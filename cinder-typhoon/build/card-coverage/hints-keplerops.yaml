    h2: PATCH preview.assignment with {"queue":"privileged-review","source_id":"<twin>"} where twin is the
      lowercase collision from K10.2. The route accepts any authenticated request regardless of review ownership —
      the submitter identity check is omitted on reassignment. This places the participant's content in the
      privileged reviewer's queue.
