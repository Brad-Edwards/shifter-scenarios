schema_version: 2
phase: keplerops
hints:
  K01.1:
    h1: Start with the developer's ordinary Git client configuration and the source links in the service notes.
    h2: The retained identity is deliberately limited. Use Gitea's normal issue list for the private connector repository,
      and distinguish successful read access from repository write authority.
    h3: Recover the saved Gitea identity, open the fieldkest/fieldlink-connector issue list, and correlate the handover
      issue's release and revision. Confirm that the same identity cannot push.
    references:
    - kind: participant_artifact
      id: .config/git/credentials
  K01.2:
    h1: The closed page is not an open tab. Inspect Chromium's ordinary history and then use the support desk named
      in the workstation notes.
    h2: The history title retains a ticket number and subject. Rowan's normal staff identity can enter the native
      osTicket agent queue; unrelated queue records are context, not the answer.
    h3: Search osTicket for the retained ticket number and read its actual thread. Correlate the customer, asset,
      connector revision, and callback-latency correspondence.
    references:
    - kind: participant_service
      id: support.keplerops.test
  K01.3:
    h1: Release reviews are on the staff work board named in the workstation notes, not in the connector checkout.
    h2: Use Kanboard's normal task search and reference correlation. The release reference distinguishes the target
      from the neighboring review tasks, and the task owns both comments and an attachment.
    h3: Find release REL-FLK-7.4.2-09 in Kanboard, open its review attachment, and correlate the unresolved REV comments
      with the task reference.
    references:
    - kind: participant_service
      id: staff.keplerops.test
  K01.4:
    h1: The local helper documentation and supplied FieldKest samples are under the developer's work directory.
    h2: This is a normal local report action. Preserve the sample's own asset and connector revision rather than
      substituting values from another record.
    h3: Submit the documented FK-SAMPLE-017 file to the helper's inspection-summary form and retain the fresh receipt.
    references:
    - kind: participant_artifact
      id: work/local-helper.md
  K02.1:
    h1: Begin with the retained source history and the continuous-integration review workflow. The failing-job note
      identifies a repository revision, so the removed fixture should be sought in version history rather than the
      current tree.
    h2: This stage is version-history recovery. Keep the named revision and fixture path bound together; the provider
      contract is a separate build artifact.
    h3: Compare the revision in the failing-job note with the repository history, then inspect the change that removed
      the named fixture without restoring unrelated files.
    references:
    - kind: participant_service
      id: ci.keplerops.test
  K02.2:
    h1: Inspect the native Jenkins build page and its separately archived artifacts. The console is only one part
      of the retained build record.
    h2: Match the review note to the failed build and source revision before using its provider contract. Reading
      an artifact does not grant repository write or job configuration access.
    h3: Compare the exact fixture path and revision in REVNOTE-1842 with the native source history and inspect the
      file parameter on fieldlink-report-review.
    references:
    - kind: participant_service
      id: ci.keplerops.test
  K02.3:
    h1: Use the native Jenkins fieldlink-report-review job and its provider.zip file parameter. The original
      fieldlink-report job is the retained failing baseline.
    h2: This is interface validation. Preserve the fixture's exact file bytes and immutable fields while implementing
      the documented provider extension point. A valid package is different from an accepted changed report.
    h3: Compare the native build artifacts with the support handover. The job ID and report digest must identify
      the same fresh output; a green status by itself is insufficient.
    references:
    - kind: participant_service
      id: ci.keplerops.test
  K03.1:
    h1: The predecessor left one ordinary document package in the analysis directory; its rendered pages are not
      the whole file.
    h2: Treat the OpenDocument format as a ZIP package structure. Compare the visible note with its packaged attachments
      and retain the attachment bytes before interpreting them.
    h3: Inspect `Attachments/staging-FKCOL-2841.bin` inside `field-notes-2026-08.odt`, then bind its digest to the
      collection identifier recorded in the stage header.
    references:
    - kind: participant_artifact
      id: work/analysis/field-notes-2026-08.odt
  K03.2:
    h1: The supplied decoder artifact describes only the outer encoding. Preserve the recovered bytes and verify
      the digest in the stage header before following what they contain.
    h2: The recovered PowerShell carries another compressed script and its own digest. Preserve the encoding and
      integrity boundary while reconstructing it as data; neither retained stage needs to be executed.
    h3: The JavaScript stage shows how its base64 bytes, repeating key, and zlib layer produce the collection manifest.
      Verify both script digests and recover every manifest field.
    references:
    - kind: participant_artifact
      id: work/analysis/staging-decoder.ps1
  K03.3:
    h1: The workstation already has an ordinary scoped object-storage profile. The recovered manifest supplies the
      address that profile cannot discover by browsing.
    h2: Reading a known S3 object and listing its bucket cross separate authorization boundaries. Use the exact endpoint,
      bucket, and key from the reconstructed manifest; the callback-integrity in the staging bundle documents how
      provenance is verified.
    h3: After retrieving and verifying the object SHA-256, derive the callback integrity from the reconstructed PowerShell
      bytes and the retrieved collection bytes and confirm it matches the staged bundle's declared callback-integrity.
      Correlate the support ticket, asset, and connector revision, and confirm bucket enumeration is denied.
    references:
    - kind: participant_artifact
      id: work/analysis/field-notes-2026-08.odt
  K04.1:
    h1: Begin with the offline indexer reproducer and its protected runtime service. The supplied indexer client.json
      artifact documents the .fki archive format and the offline reproducer binary; both carry the relevant lead.
    h2: Treat this as binary layout analysis of the .fki deserializer. The bundle header declares two entry counts;
      compare how each is used in the bounds check and in the memcpy to find the allocation confusion.
    h3: Identify how the bounds check compares total entry data against the full arena size (body plus sentinel)
      while the memcpy writes only into the body region. Construct a bundle where index_entries produces a copy
      length that exceeds the body but stays within the arena, then verify the service records the controlled
      sentinel mutation while staying live.
    references:
    - kind: participant_artifact
      id: work/reproducers/indexer-client.json
  K04.2:
    h1: The binary returns a data_hex field covering the bytes read from the shared arena before each write. After
      K04.1 the arena carries a runtime descriptor at bytes 80-511 that the service wrote at mutation time.
    h2: The bounds check uses sizeof(struct index_arena) as its base, not the full arena size. Analyze the binary
      to find both constants; then choose alloc_entries so that the check passes for datalen equal to the full
      arena size, covering the descriptor region.
    h3: Parse data_hex hex chars 160-1023 (arena bytes 80-511) as JSON to recover the runtime descriptor.
      It contains the worker_session, exception_state_offset, exception_value_size, exception_integrity_size,
      integrity_relation, and completion_route for K04.3 and K04.4.
    references:
    - kind: participant_service
      id: indexer.keplerops.test
    - kind: participant_artifact
      id: work/reproducers/indexer-client.json
  K04.3:
    h1: The binary read covers the full arena. Extend the bundle beyond the descriptor
      region by supplying ie=72 and ae=496 so that datalen=576 reaches bytes 512-575
      in both the binary read and write.
    h2: Bytes 0-511 of the K04.3 payload must match the K04.2 data_hex bytes verbatim.
      That snapshot preserves the sentinel at bytes 64-79 and the descriptor at bytes
      80-511; both must remain intact after the K04.3 write or the service rejects it.
    h3: Use the descriptor fields exception_state_offset, exception_value_size,
      exception_integrity_size, and integrity_relation. Place the queue-ready value
      at bytes 512-543 and HMAC-SHA256(worker_session, b"queue-ready") at bytes 544-575.
      The response contains write_ready=true when the write passes all checks.
    references:
    - kind: participant_service
      id: indexer.keplerops.test
    - kind: participant_artifact
      id: work/reproducers/indexer-client.json
  K04.4:
    h1: Call the completion_route from the K04.2 descriptor. Use bearer=worker_session, body
      routine=recover_exception_queue and generation=process_generation. The response contains
      encrypted_record (hex ciphertext) and key_relation (the decryption formula); write_ready
      must be True before the call succeeds.
    h2: The key_relation field names the derivation. Compute the K04.3 HMAC first:
      HMAC-SHA256(worker_session, b"queue-ready"). Then derive the decryption key:
      SHA256(k43_hmac_bytes + b":dossier-key"). That 32-byte key drives the counter-mode stream.
    h3: Decrypt the encrypted_record hex in 32-byte blocks. For each block i (zero-indexed):
      keystream = SHA256(derived_key + struct.pack(">I", i)); XOR each ciphertext byte with the
      corresponding keystream byte. The plaintext is a JSON object with service_identity and dossier.
    references:
    - kind: participant_service
      id: indexer.keplerops.test
  K05.1:
    h1: Fetch the Verdaccio metadata for @keplerops/fieldlink-connector from the packages.metadata route.
      The registry README documents the fieldkest.connector/v3 interface and its required fields.
    h2: Construct a consumer request with schema=fieldkest.connector/v3 and the required tenant_id and
      asset_id fields. Optionally include a measurements object with callback_latency_ms and sample_count.
      Missing required fields return 422 from the consumer-check route.
    h3: POST the request to packages.consumer-check. The result includes check_id, resolved_version (7.4.2),
      consumer_revision, package_sha256, the original request, and the actual installed module output.
    references:
    - kind: client_route
      id: packages.consumer-check
    - kind: client_route
      id: packages.metadata
  K05.2:
    h1: The Verdaccio metadata for @keplerops/fieldlink-connector lists 6.9.8 under dist-tags.legacy. The
      deprecated field on the 6.9.8 version object carries the genuine native deprecation notice; the
      dist.tarball URL in that version object points to the actual downloadable archive.
    h2: Download the 6.9.8 tarball directly from the dist.tarball URL using the same developer credentials.
      A withdrawn customer rollout does not remove the package from the native registry; the archive remains
      retrievable. Unknown versions return 404 from the packages.release route.
    h3: Fetch the release record REL-FLK-6.9.8-ARCHIVE from the packages.release route. It carries
      status=yanked, a maintenance_note, and a compatibility block for the retained entitlement investigation.
      Correlate the version and package name across the Verdaccio metadata and the release record.
    references:
    - kind: client_route
      id: packages.metadata
    - kind: client_route
      id: packages.release
  K05.3:
    h1: POST to packages.reconcile with the correct tenant/release pair: tenant_record_id=TEN-ARWC-047 and
      release_id=REL-FLK-7.4.2-09. Wrong record pairs return 422. The release record is readable from
      the packages.release route and the tenant ID comes from the support ticket customer context (K01.2).
    h2: The reconcile result compares four fields: package, declared_range, resolved_version, and consumer_revision.
      Only resolved_version disagrees: the tenant record has 7.4.1 and the release has 7.4.2. The comparison_digest
      binds the full result including the tenant_record_id and release_id.
    h3: Verify the tenant version against the actual native package: download the 7.4.1 tarball from
      Verdaccio (use the dist.tarball URL in the 7.4.1 version object) and compute its SHA256. This binds
      the archive digest to the disagreeing version in the reconcile comparison.
    references:
    - kind: client_route
      id: packages.reconcile
    - kind: client_route
      id: packages.metadata
  K05.4:
    h1: The declared range from K05.3 is ^7.4.0. The Verdaccio metadata lists 7.4.0, 7.4.1, and 7.4.2 under
      versions. npm selects the highest stable matching version: 7.4.2. Requesting a non-existent version
      (such as 7.4.3) from Verdaccio returns 404.
    h2: Download the 7.4.2 tarball from its dist.tarball URL in the Verdaccio version object and compute its
      SHA256. Then POST a valid fieldkest.connector/v3 request to packages.consumer-check. The service runs
      npm pack with ^7.4.0 and returns resolved_version=7.4.2 with the matching package_sha256.
    h3: Verify that the package_sha256 from the consumer-check response matches the sha256 you computed from
      the Verdaccio tarball. The result object also includes connector_version=7.4.2 from the installed module,
      confirming the actual dependency that ran rather than the release label.
    references:
    - kind: client_route
      id: packages.resolver
  K06.1:
    h1: Navigate to the fieldkest/fieldlink-connector repository in Gitea and check the delivery-operations
      branch commit history. Find the commit that removed delivery/.npmrc from the working tree and inspect
      the file at the parent commit using the Gitea raw or contents API with the parent commit SHA as the ref.
    h2: The .npmrc file has an _auth field that is base64-encoded credentials for the fieldlink-importer-publisher
      account. Decode it to recover the username and token. These credentials authenticate to Verdaccio
      using the same HTTP Basic Auth as other package operations.
    h3: Confirm the publisher scope: the recovered credentials return 200 for @keplerops/fieldlink-connector
      metadata and tarballs, but 403 for @keplerops/support-rehearsal and 403 for the release-administration
      session route. These are the outer bounds of the publisher account.
    references:
    - kind: participant_service
      id: source.keplerops.test
    - kind: participant_service
      id: packages.keplerops.test
  K06.2:
    h1: Navigate to the Jenkins fieldlink-package-check job on ci.keplerops.test. The build archives
      package-workspace/.npmrc alongside the support-rehearsal.json artifact. Download the .npmrc
      from the archived build artifacts; it carries a separate svc-fieldlink-ci credential.
    h2: Decode the .npmrc _auth field (base64) to recover the svc-fieldlink-ci username and token.
      Those credentials can read @keplerops/support-rehearsal (200) from Verdaccio. The
      fieldlink-importer-publisher credentials from K06.1 remain denied (403) for that package.
    h3: Confirm the CI reader scope: @keplerops/support-rehearsal metadata and tarball pass (200).
      Then verify the boundary: a PUT to @keplerops/fieldlink-connector with CI credentials is
      denied (403); the publisher from K06.1 is still denied on support-rehearsal (403).
    references:
    - kind: participant_service
      id: ci.keplerops.test
    - kind: participant_service
      id: packages.keplerops.test
  K06.3:
    h1: Build a compatible 7.4.3 package with the same fieldkest.connector/v3 interface (same index.js logic,
      same limits.json structure, same package.json fieldkest.interface field) but different limits.json values.
      Use npm publish with the K06.1 publisher .npmrc to publish it; Verdaccio rejects a duplicate version.
    h2: After publishing 7.4.3, the consumer-check endpoint runs npm pack with ^7.4.0 and now selects 7.4.3
      as the highest stable version. Provide the same fieldkest.connector/v3 request as K05.1. The changed
      limits.json values produce a different assessment in the module output.
    h3: Confirm the changed result: the consumer-check response shows resolved_version=7.4.3 and the result
      assessment differs from 7.4.2 (for example, callback-review-required instead of within-operating-limits).
      Verify that tenant_id, asset_id, and schema are preserved. The publisher still has no release-admin authority.
    references:
    - kind: participant_service
      id: packages.keplerops.test
    - kind: client_route
      id: packages.consumer-check
    - kind: client_route
      id: packages.publish
  K07.1:
    h1: Read work/registry/inspection-normal.json from the developer workstation and POST it to
      packages.inspections. The service validates schema, package, version, and action fields; it
      does not require exact byte equality. The response has a dynamic inspection_id (changes each
      request) and a trace link. Submit twice to confirm both IDs differ.
    h2: Fetch the trace at GET /api/inspections/{inspection_id}/trace. It contains a real
      assessor_correlation_id (UUID from the upstream assessor — not a fixed constant) and the
      compatibility_envelope_sha256 for K07.2. Requests for unknown trace IDs return 403.
    h3: The trace proves a real upstream exists: the inspection service forwards to a Python
      BaseHTTPRequestHandler assessor (CL-based parser), while the Nginx edge is TE-aware. This
      Nginx/assessor parser disagreement is the K07.2 smuggling target. The compatibility_envelope_sha256
      binds the inspection to the K07.2 envelope.
    references:
    - kind: client_route
      id: packages.inspection-trace
    - kind: client_route
      id: packages.inspections
    - kind: participant_artifact
      id: work/registry/inspection-normal.json
  K07.2:
    h1: The binary envelope format is FKI1 + name_length(1 byte) + name(N bytes) + front_following_length(2 bytes,
      big-endian). The inspection service sets Content-Length = front_following_length when forwarding to the
      assessor. Set front_following_length = 10 (the 10-byte header size): the assessor reads 10 bytes; surplus
      bytes stay in the persistent HTTP/1.1 socket as the next assessor request prefix.
    h2: Use KELVIN SIGN U+212A (bytes e284aa, 3 bytes = 1 char) as the name to show the name framing disagreement:
      front decodes raw UTF-8 → 1 char; assessor applies NFKC + casefold + [:3] → 3 chars. After the 10-byte
      header, include a valid HTTP POST to /assess/privileged as the surplus bytes; the final 3 envelope bytes
      become the smuggled POST body.
    h3: Submit the envelope via persistent HTTP/1.1 keep-alive to packages.inspection-envelope, then immediately
      send a normal inspection on the SAME connection. The inspection service reads the assessor's buffered
      privileged response instead of the expected assessment: assessment=privileged-access-confirmed in the result.
    references:
    - kind: client_route
      id: packages.inspection-envelope
    - kind: client_route
      id: packages.inspections
  K07.3:
    h1: The K07.3 protected route requires a valid K07.1 inspection_id as authorization. The smuggled POST body
      is binary-framed: 2 bytes big-endian payload_len followed by {"inspection_id":"INSP-XXXXXXXX"} JSON.
      An invalid or absent inspection_id returns 403 from the assessor with no state change.
    h2: Apply K07.2's body-framing primitive: front_following_length=10 (CL to assessor = 10-byte header).
      Surplus bytes = POST /assess/inspect-privileged headers with Content-Length=(2+len(JSON)) followed by
      the binary-framed body. No trailing bytes should remain so the assessor connection stays alive.
    h3: After submitting the envelope, query GET /api/protected-assessment/latest to retrieve the result.
      It binds the K07.1 inspection_id, the K07.1 assessor_correlation_id, and the real Verdaccio
      @keplerops/support-rehearsal package data. Both the K07.1 trace and the protected assessment
      are the correlated audit evidence for K07.3 completion.
    references:
    - kind: client_route
      id: packages.inspection-envelope
    - kind: client_route
      id: packages.inspections
  K08.1:
    h1: Navigate to fieldkest/connector-archive in Gitea using the developer credentials. The entitlement record
      is at internal/fieldlink/legacy-diagnostics/CRR-OG2/ENT-ARWC-DIAG-0698.json. Read its commit history
      to see the revision 3 → revision 4 progression and understand the entitlement's legacy context.
    h2: The HKDF derivation context is in the K05.2 release record REL-FLK-6.9.8-ARCHIVE. Fetch it via the
      packages.release route; its compatibility field has ikm_hex, salt_hex, info_utf8, aad_utf8, and key_id.
      These are the context inputs needed by the checker.
    h3: POST to packages.entitlement-check with checker=v1, the full entitlement JSON from Gitea, and the
      context from the release record. The checker decrypts using HKDF-SHA256 + AES-256-GCM and returns
      customer_id, feature_id, package_revision, expiry_policy, revision, and state=baseline-valid.
    references:
    - kind: participant_service
      id: source.keplerops.test
    - kind: client_route
      id: packages.entitlement-check
    - kind: client_route
      id: packages.release
  K08.2:
    h1: The v2 entitlement record is in the same Gitea CRR-OG2 directory as the v1 record, named
      ENT-ARWC-DIAG-0698-V2.json. It has schema=fieldkest.entitlement-record/v2 and an expiry_policy
      top-level field — this is the missing encryption context for the v2 checker.
    h2: The checker=v2 reads expiry_policy from the participant-supplied record body and derives the AES-256-GCM
      key using HKDF(info=base_info+"|"+expiry_policy). POST the v2 record with checker=v2 to
      packages.entitlement-check. Without the expiry_policy field, v2 key derivation uses empty string and
      decryption fails (422).
    h3: The v2 result is state=legacy-test-accepted with revision=3, distinct from the K08.1 v1 baseline at
      revision=4. The expiry_policy field in the v2 record is the missing context — it was added to the record
      schema in v2 to allow context-binding derivation.
    references:
    - kind: participant_service
      id: source.keplerops.test
    - kind: client_route
      id: packages.entitlement-check
  K08.3:
    h1: Read ENT-ARWC-DIAG-0698-plaintext-template.json from the Gitea CRR-OG2 directory. Fill in expiry_policy
      from the K08.2 checker result and choose a revision integer != 4 and != 3. Serialize as canonical JSON
      (sort_keys=True, no spaces) before encrypting.
    h2: Encrypt the canonical JSON with AES-256-GCM: v2 HKDF key (HKDF(info=base_info+"|"+expiry_policy) from
      K08.2), a fresh 12-byte random nonce, and aad="ENT-ARWC-DIAG-0698|TEN-ARWC-019|FLK-6.9.8". Build the
      entitlement record JSON with cipher, ciphertext_base64, nonce_hex, tag_base64, and the metadata fields
      (including expiry_policy as a top-level field).
    h3: POST to packages.entitlement-check with checker=v2, the crafted record (with expiry_policy), and the
      K08.2 HKDF context. Wrong customer_id or feature_id returns 422; checker=v1 also returns 422. The correct
      alternate entitlement returns state=legacy-test-accepted with the participant's chosen revision.
    references:
    - kind: participant_service
      id: source.keplerops.test
    - kind: client_route
      id: packages.entitlement-check
  K09.1:
    h1: Navigate to Jenkins (ci.keplerops.test) and open the fieldlink-report job. The most recent build is marked
      FAILURE. The build's public summary only shows FAILURE; the actual failure reason is in the console log.
    h2: Access the console log via the Jenkins API (GET /job/fieldlink-report/{build}/logText/progressiveText).
      The build failed because fixtures/report-crr-og2.json was missing from the workspace (FileNotFoundError).
      The build also archived three artifacts under reports/.
    h3: Download REVNOTE-{build_number}.json from the archived artifacts. It contains review_id, run_id, and
      a baseline field with a dossier reference (repository, ref, path). These are the log digest binding and
      dossier ID for K09.1 completion.
    references:
    - kind: participant_service
      id: ci.keplerops.test
  K09.2:
    h1: The K09.1 REVNOTE has a run_id field (BLD-1842). The Jenkins results page lists only junit.xml.
      The CI runner service at review.keplerops.test is the separate publication surface; its
      .well-known/fieldkest-client lists the ci.run route for GET /api/runs/{run_id}.
      h1 cont: Access GET /api/runs/BLD-1842 on review.keplerops.test.
    h2: Treat this as job-input trust and execution under a constrained service identity. Observe the ordinary and
      denied cases first, then change one input at a time and keep every unrelated binding fixed.
    h3: Download the omitted artifact via ci.run-artifact: GET /api/runs/BLD-1842/artifacts/integration-review-input-v3.json.
      The result has artifact_id=ART-BLD-1842-INTEGRATION-REVIEW, build_revision, object_version=3, and
      linked_support_ref. Wrong run IDs (BLD-9999) return 404.
    references:
    - kind: participant_service
      id: review.keplerops.test
    - kind: client_route
      id: ci.run
    - kind: client_route
      id: ci.run-artifact
  K09.3:
    h1: Take the K09.2 integration-review-input-v3.json artifact (diagnostic_eligible=true) and POST it to
      ci.review-jobs on review.keplerops.test: {"support_input": <artifact>, "diagnostic": {"profile": "render-review"}}.
      The endpoint returns a run_id and result path.
    h2: GET /api/review-jobs/{run_id} returns state=success, workspace_generation=WS-ROWAN-2026-09-G1, and
      review.maintained_reference (the diagnostic-request-reference content). The maintained_reference contains
      "POST /api/review-jobs" and the runner-operations.md path but NOT "FieldKest runner service connections".
    h3: The returned support_input field is "buildops://reviews/diagnostic-request-reference@3" (the integration
      reference). This is the K09.4 input. Ordinary inputs (diagnostic_eligible=false) return a different
      support_input and cannot access the integration diagnostic context.
    references:
    - kind: participant_service
      id: review.keplerops.test
    - kind: client_route
      id: ci.review-jobs
    - kind: client_route
      id: ci.review-job
  K09.4:
    h1: Use the K09.3 integration reference as support_input with diagnostic profile=runner-command. Job 1:
      argv=["/bin/cat", "/srv/fieldlink-ci/runner/runner-operations.md"]. The note identifies the worker
      (svc-fieldlink-ci), the STATUS_COMMAND for Job 2, and the service URL table.
    h2: Job 2: use the STATUS_COMMAND from the note as argv=["/bin/sh", "-c", "..."]. It sources
      $FIELDLINK_RUN_DIR/connections.env (base URLs) and uses $FIELDLINK_RUN_DIR/build-records.curl
      (per-run worker token) to call $FIELDLINK_BUILD_RECORDS_URL/api/build-records/worker-status.
    h3: The Job 2 response contains principal=svc-fieldlink-ci and availability=available. The two distinct
      run_ids and the build-records audit record (binding the worker lease, principal, and network origin)
      are the K09.4 completion evidence.
    references:
    - kind: participant_service
      id: review.keplerops.test
    - kind: client_route
      id: ci.review-jobs
  K10.1:
    h1: Navigate to preview.keplerops.test/.well-known/fieldkest-client to find the preview.association route.
      The preview service wraps Gotenberg (Chromium+LibreOffice renderer) and provides a preview queue API.
    h2: Query GET /api/preview/association?source=sup-k-2841 for the participant's own attachment. This returns
      document_id, source_version, and case_id (CAS-ROWAN-2841) for rowan.ito's case.
    h3: Query GET /api/preview/association?source=SUP-K-2841 (uppercase, the protected attachment). The service
