  K11.1:
    h1: Read work/build-operations/policy-compiler-handoff.md on the developer workstation. It directs you to the
      fieldkest/policy-compiler repository in Gitea (source.keplerops.test). Clone it; the repository website field
      points to the client reference on source-tools.keplerops.test:8443 where the evaluation route is listed.
    h2: The retained binary bin/fieldkest-policyc is an unstripped ELF. Run nm to find the eight fieldkest_opcode_XX_NAME
      symbols. Search the binary for the FKPC magic bytes (the embedded 68-byte program table, 14 four-byte
      instructions). Trace the PUSH_FIELD (0x00) opcodes by index to identify the four evaluated fields:
      tenant_state (0), connector_api (1), signer_lineage (2), compatibility_exception (3).
    h3: Build a fieldkest.policy-program-model/v1 with the 68-byte program base64-encoded and its sha256. POST to
      source-tools.keplerops.test:8443/api/policy-compilers/fieldkest-policyc/evaluations with
      operation=corpus-check and policy_input={"corpus_id":"POLICY-CORPUS-2026-09-R4"}. The service returns a
      PCMIG receipt with program_sha256, corpus_result_sha256, and condition_set_sha256.
    references:
    - kind: participant_artifact
      id: work/build-operations/policy-compiler-handoff.md
  K11.2:
    h1: The fieldkest/policy-compiler repository README describes each fragment's policy intent in the Fragments section.
      No .fkpc bytecode is provided — the participant must assemble each fragment. Use the FKPC encoding from K11.1:
      magic+header + 4-byte instructions [opcode:1, flags:1 (always 0), operand:2-LE]. PUSH_FIELD operand is field
      index 0-3; PUSH_CONST is constant index (0=3.0.0, 1=True); IN_SET is set index (0={active}, 1={fieldkest-release-2026}).
    h2: Assemble each fragment as a minimal sequence ending with RETURN (0x07). tenant-state: PUSH_FIELD(0) IN_SET(0)
      RETURN. connector-version: PUSH_FIELD(1) PUSH_CONST(0) SEMVER_GTE RETURN. signer-lineage: PUSH_FIELD(2) IN_SET(1)
      RETURN. compatibility-exception: PUSH_FIELD(3) PUSH_CONST(1) EQ RETURN. Submit each with operation=fragment-check
      and policy_input={"fragment_id":"<name>"} to source-tools.keplerops.test:8443. See api/fragment-assembly-guide.json.
    h3: The service validates each submitted program against server-side cases covering both accepting and rejecting inputs.
      A correct assembly passes all cases. A wrong field index, opcode, or operand fails at least one case
      (fragment_case_mismatch). All four PCMIG receipts are the K11.2 completion evidence.
    references:
    - kind: participant_service
      id: source.keplerops.test
  K11.3:
    h1: Run strings bin/fieldkest-policyc and look for constant and set values embedded as string literals.
      Then run the binary against examples/accepted.env and change one field at a time to find each condition
      boundary. The corpus in corpus/policy-corpus-2026-09-r4.json has cases failing on each field individually.
      The README states only operand indices (set index 0, const index 1, etc.) — not actual values. The binary
      and corpus cases are the only source.
    h2: Construct a fieldkest.policy-condition-set/v1 document using the schema shape in api/condition-set-template.json.
      Map the K11.2 opcodes to operators: IN_SET → "in" (values list); SEMVER_GTE → "semver_gte" (value string);
      EQ → "eq" (value boolean). Fill each value from the binary strings and corpus evidence.
      Follow the field order recovered in K11.1 (tenant_state, connector_api, signer_lineage, compatibility_exception).
    h3: Submit operation=condition-check with the program model and
      policy_input={"corpus_id":"POLICY-CORPUS-2026-09-R4","condition_set":{...}}. Any wrong value or operator →
      condition_set_mismatch. The PCMIG receipt includes condition_set_sha256 and corpus_result_sha256. Keep both for K11.4.
    references:
    - kind: participant_service
      id: source.keplerops.test
  K11.4:
    h1: Obtain a fresh one-use nonce first: POST {} to source-tools.keplerops.test:8443/api/policy-compilers/fieldkest-policyc/nonces.
      The nonce expires in five minutes and is consumed by the first syntactically valid acceptance request even if
      the binary rejects the input. Get the nonce immediately before submitting. See api/accept-template.json for
      the request shape.
    h2: Build policy_input with all six fields: the four conditions recovered in K11.3 (use the values from binary
      and corpus analysis — the values the binary was compiled with), plus channel="preview" and
      tenant_class="field-service" as context. Add the fresh nonce and corpus_result_sha256 from K11.3. All four
      conditions must be satisfied for the binary to return accepted=true.
    h3: Submit operation=accept with the program model from K11.1 and the prepared policy_input. The service runs
      the real binary (fieldkest-policyc). If accepted, the PCACC receipt includes program_id=FKPC-POLICY-2026-09-R4,
      binary_sha256, condition_set_sha256, and evaluated_fields. A replay of the same nonce returns
      stale_or_replayed_nonce. The PCACC receipt is the K11 completion evidence.
    references:
    - kind: participant_service
      id: source.keplerops.test
  K12.1:
    h1: The K10.1 association lookup for SUP-K-2841 returns a viewer_request field — the review ID linked to the
      protected case (PRV-771). The preview service client reference at
      preview.keplerops.test/.well-known/fieldkest-client lists the preview.assignment route:
