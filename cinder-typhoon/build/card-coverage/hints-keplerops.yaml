  K12.2:
    h1: The K12.1 response does NOT expose the action_nonce. The nonce is delivered by the internal reviewer session
      page at http://127.0.0.1:{INTERNAL_PORT}/review-session/PRV-771. The page sends
      window.parent.postMessage({action_nonce:"..."}, "*") — the "*" targetOrigin means no origin validation.
      Any parent frame hosting the session page receives the nonce.
    h2: Craft an HTML page with an iframe to the session page and a window.addEventListener("message",...) listener.
      Submit via POST /api/preview/render (K10.3 render endpoint). Gotenberg/Chromium renders the crafted HTML
      inside the container; the iframe loads the session, which posts the nonce to the parent frame.
