name: cinder-keplerops

x-service-security: &service-security
  restart: unless-stopped
  read_only: true
  cap_drop: [ALL]
  cap_add: [NET_ADMIN, SETUID, SETGID]
  security_opt:
    - no-new-privileges:true
  sysctls:
    net.ipv4.ip_unprivileged_port_start: 0
  tmpfs:
    - /tmp:rw,noexec,nosuid,nodev,size=32m,mode=1777
  volumes:
    - ${KEPLEROPS_OPERATOR_DIR:-./.operator}/tls/server.crt:/run/fieldkest-tls/server.crt:ro
    - ${KEPLEROPS_OPERATOR_DIR:-./.operator}/tls/server.key:/run/fieldkest-tls/server.key:ro
    - ${KEPLEROPS_OPERATOR_DIR:-./.operator}/tls/ca.crt:/run/fieldkest-tls/ca.crt:ro
  environment: &tls-environment
    FIELDKEST_TLS_CERT: /tmp/fieldkest.crt
    FIELDKEST_TLS_KEY: /tmp/fieldkest.key

services:
  router:
    build:
      context: ../..
      dockerfile: build/keplerops/images/router.Dockerfile
    image: cinder-keplerops/router:hand-build
    container_name: cinder-keplerops-router
    restart: unless-stopped
    cap_drop: [ALL]
    cap_add: [NET_ADMIN]
    security_opt:
      - no-new-privileges:true
    sysctls:
      net.ipv4.ip_forward: 1
    networks:
      corporate: {ipv4_address: 10.77.50.254}
      delivery: {ipv4_address: 10.77.51.254}
      cloud: {ipv4_address: 10.77.52.254}
      jobs: {ipv4_address: 10.77.53.254}
      connector: {ipv4_address: 10.77.60.254}

  k-dev:
    build:
      context: ../..
      dockerfile: build/keplerops/images/k-dev.Dockerfile
    image: cinder-keplerops/k-dev:hand-build
    container_name: cinder-keplerops-k-dev
    hostname: k-dev
    domainname: keplerops.test
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    cap_add: [NET_ADMIN, SETUID, SETGID, CHOWN, FOWNER, SYS_CHROOT, AUDIT_WRITE, DAC_OVERRIDE, DAC_READ_SEARCH]
    security_opt:
      - no-new-privileges:true
    depends_on: [router]
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777
      - /run:rw,nosuid,nodev,size=16m,mode=0755
    volumes:
      - k-dev-home:/home/rowan
      - k-dev-audit:/var/lib/fieldkest-workbench/audit
      - ${KEPLEROPS_OPERATOR_DIR:-./.operator}/tls/ca.crt:/run/fieldkest-auth/ca.crt:ro
      - ${KEPLEROPS_OPERATOR_DIR:-./.operator}/rowan_authorized_keys:/run/fieldkest-auth/rowan_authorized_keys:ro
    extra_hosts:
      - staff.keplerops.test:10.77.50.30
      - identity.keplerops.test:10.77.50.40
      - cert.keplerops.test:10.77.50.50
      - source.keplerops.test:10.77.51.20
      - packages.keplerops.test:10.77.51.30
      - ci.keplerops.test:10.77.51.40
      - preview.keplerops.test:10.77.51.50
      - support.keplerops.test:10.77.51.60
      - indexer.keplerops.test:10.77.51.70
      - cloud-api.keplerops.test:10.77.52.20
      - workloads.keplerops.test:10.77.52.30
      - data.keplerops.test:10.77.52.40
      - assistant.keplerops.test:10.77.52.50
      - connector.arwc.test:10.77.60.20
    networks:
      corporate:
        ipv4_address: 10.77.50.20
        aliases: [k-dev.keplerops.test]

  k-source:
    <<: *service-security
    build:
      context: ../..
      dockerfile: build/keplerops/images/source.Dockerfile
    image: cinder-keplerops/k-source:hand-build
    container_name: cinder-keplerops-source
    hostname: k-source
    domainname: delivery.keplerops.test
    depends_on: [router]
    volumes:
      - ${KEPLEROPS_OPERATOR_DIR:-./.operator}/tls/server.crt:/run/fieldkest-tls/server.crt:ro
      - ${KEPLEROPS_OPERATOR_DIR:-./.operator}/tls/server.key:/run/fieldkest-tls/server.key:ro
      - ${KEPLEROPS_OPERATOR_DIR:-./.operator}/worker-hmac.key:/run/fieldkest-auth/worker-hmac.key:ro
      - source-audit:/var/lib/gitea/audit
      - source-gitea:/var/lib/gitea/data
      - source-repositories:/var/lib/gitea/repositories
    networks:
      delivery:
        ipv4_address: 10.77.51.20
        aliases: [source.keplerops.test]

  k-ci:
    <<: *service-security
    build:
      context: ../..
      dockerfile: build/keplerops/images/ci.Dockerfile
    image: cinder-keplerops/k-ci:hand-build
    container_name: cinder-keplerops-ci
    hostname: k-ci
    domainname: delivery.keplerops.test
    depends_on: [router, runner]
    cap_add: [NET_ADMIN, SETUID, SETGID, DAC_READ_SEARCH, CHOWN, FOWNER, DAC_OVERRIDE]
    volumes:
      - ${KEPLEROPS_OPERATOR_DIR:-./.operator}/tls/server.crt:/run/fieldkest-tls/server.crt:ro
      - ${KEPLEROPS_OPERATOR_DIR:-./.operator}/tls/server.key:/run/fieldkest-tls/server.key:ro
      - ${KEPLEROPS_OPERATOR_DIR:-./.operator}/tls/ca.crt:/run/fieldkest-tls/ca.crt:ro
      - ${KEPLEROPS_OPERATOR_DIR:-./.operator}/worker-hmac.key:/run/fieldkest-auth/worker-hmac.key:ro
      - ci-audit:/var/lib/fieldkest-ci/audit
      - ci-results:/var/lib/fieldkest-ci/results
      - ci-rowan-workspace:/var/lib/fieldkest-ci/workspaces/rowan
      - handover:/var/lib/fieldkest-handover
      - runner-socket:/run/fieldkest-runner
    networks:
      delivery:
        ipv4_address: 10.77.51.40
        aliases: [ci.keplerops.test]

  k-registry:
    <<: *service-security
    build:
      context: ../..
      dockerfile: build/keplerops/images/registry.Dockerfile
    image: cinder-keplerops/k-registry:hand-build
    container_name: cinder-keplerops-registry
    hostname: k-registry
    domainname: delivery.keplerops.test
    depends_on: [router]
    volumes:
      - ${KEPLEROPS_OPERATOR_DIR:-./.operator}/tls/server.crt:/run/fieldkest-tls/server.crt:ro
      - ${KEPLEROPS_OPERATOR_DIR:-./.operator}/tls/server.key:/run/fieldkest-tls/server.key:ro
      - ${KEPLEROPS_OPERATOR_DIR:-./.operator}/worker-hmac.key:/run/fieldkest-auth/worker-hmac.key:ro
      - registry-audit:/var/lib/fieldkest-registry/audit
      - registry-results:/var/lib/fieldkest-registry/results
      - registry-published:/var/lib/fieldkest-registry/published
      - registry-verdaccio:/var/lib/verdaccio
    networks:
      delivery:
        ipv4_address: 10.77.51.30
        aliases: [packages.keplerops.test]

  k-support:
    <<: *service-security
    cap_add: [NET_ADMIN, SETUID, SETGID, CHOWN]
    build:
      context: ../..
      dockerfile: build/keplerops/images/support.Dockerfile
    image: cinder-keplerops/k-support:hand-build
    container_name: cinder-keplerops-support
    hostname: k-support
    domainname: delivery.keplerops.test
    depends_on: [router]
    extra_hosts:
      - connector.arwc.test:10.77.60.20
    volumes:
      - ${KEPLEROPS_OPERATOR_DIR:-./.operator}/tls/server.crt:/run/fieldkest-tls/server.crt:ro
      - ${KEPLEROPS_OPERATOR_DIR:-./.operator}/tls/server.key:/run/fieldkest-tls/server.key:ro
      - ${KEPLEROPS_OPERATOR_DIR:-./.operator}/tls/ca.crt:/run/fieldkest-tls/ca.crt:ro
      - ${KEPLEROPS_OPERATOR_DIR:-./.operator}/fixture-issuer.key:/run/fieldkest-oidc/fixture-issuer.key:ro
      - ${KEPLEROPS_OPERATOR_DIR:-./.operator}/fixture-issuer.pub:/run/fieldkest-oidc/fixture-issuer.pub:ro
      - support-audit:/var/lib/fieldkest-support/audit
      - handover:/var/lib/fieldkest-handover:ro
    networks:
      delivery:
        ipv4_address: 10.77.51.60
        aliases: [support.keplerops.test]

  report-worker:
    build:
      context: ../..
      dockerfile: build/keplerops/images/report-worker.Dockerfile
    image: cinder-keplerops/report-worker:hand-build
    command: ["-c", "raise SystemExit('worker images are launched by the runner')"]
    profiles: [build-only]

  node-worker:
    build:
      context: ../..
      dockerfile: build/keplerops/images/node-worker.Dockerfile
    image: cinder-keplerops/node-worker:hand-build
    command: ["-e", "process.exit(1)"]
    profiles: [build-only]

  command-worker:
    build:
      context: ../..
      dockerfile: build/keplerops/images/command-worker.Dockerfile
    image: cinder-keplerops/command-worker:hand-build
    command: []
    profiles: [build-only]

  runner:
    build:
      context: ../..
      dockerfile: build/keplerops/images/runner.Dockerfile
    image: cinder-keplerops/runner:hand-build
    container_name: cinder-keplerops-runner
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    environment:
      FIELDKEST_WORKER_IMAGE: cinder-keplerops/report-worker:hand-build
      FIELDKEST_NODE_WORKER_IMAGE: cinder-keplerops/node-worker:hand-build
      FIELDKEST_COMMAND_WORKER_IMAGE: cinder-keplerops/command-worker:hand-build
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=8m,mode=1777
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - runner-socket:/run/fieldkest-runner
      - ${KEPLEROPS_OPERATOR_DIR:-./.operator}/tls/ca.crt:/run/fieldkest-auth/ca.crt:ro
    network_mode: none

  k-cloud-api:
    <<: *service-security
    build:
      context: ../..
      dockerfile: build/keplerops/images/cloud-api.Dockerfile
    image: cinder-keplerops/k-cloud-api:hand-build
    container_name: cinder-keplerops-cloud-api
    hostname: k-cloud-api
    domainname: cloud.keplerops.test
    depends_on: [router]
    volumes:
      - ${KEPLEROPS_OPERATOR_DIR:-./.operator}/tls/server.crt:/run/fieldkest-tls/server.crt:ro
      - ${KEPLEROPS_OPERATOR_DIR:-./.operator}/tls/server.key:/run/fieldkest-tls/server.key:ro
      - ${KEPLEROPS_OPERATOR_DIR:-./.operator}/worker-hmac.key:/run/fieldkest-auth/worker-hmac.key:ro
      - cloud-api-audit:/var/lib/fieldkest-cloud-api/audit
    networks:
      cloud:
        ipv4_address: 10.77.52.20
        aliases: [cloud-api.keplerops.test]

  k-preview:
    <<: *service-security
    build:
      context: ../..
      dockerfile: build/keplerops/images/preview.Dockerfile
    image: cinder-keplerops/k-preview:hand-build
    container_name: cinder-keplerops-preview
    hostname: k-preview
    depends_on: [router]
    environment:
      <<: *tls-environment
      FIELDKEST_SERVICE: preview
      FIELDKEST_GATEWAY: 10.77.51.254
    volumes:
      - ${KEPLEROPS_OPERATOR_DIR:-./.operator}/tls/server.crt:/run/fieldkest-tls/server.crt:ro
      - ${KEPLEROPS_OPERATOR_DIR:-./.operator}/tls/server.key:/run/fieldkest-tls/server.key:ro
      - ${KEPLEROPS_OPERATOR_DIR:-./.operator}/tls/ca.crt:/run/fieldkest-tls/ca.crt:ro
      - preview-state:/var/lib/fieldkest-preview
    networks:
      delivery: {ipv4_address: 10.77.51.50, aliases: [preview.keplerops.test]}

  k-indexer:
    <<: *service-security
    build:
      context: ../..
      dockerfile: build/keplerops/images/indexer.Dockerfile
    image: cinder-keplerops/k-indexer:hand-build
    container_name: cinder-keplerops-indexer
    hostname: k-indexer
    depends_on: [router]
    environment:
      <<: *tls-environment
      FIELDKEST_SERVICE: indexer
      FIELDKEST_GATEWAY: 10.77.51.254
    volumes:
      - ${KEPLEROPS_OPERATOR_DIR:-./.operator}/tls/server.crt:/run/fieldkest-tls/server.crt:ro
      - ${KEPLEROPS_OPERATOR_DIR:-./.operator}/tls/server.key:/run/fieldkest-tls/server.key:ro
      - ${KEPLEROPS_OPERATOR_DIR:-./.operator}/tls/ca.crt:/run/fieldkest-tls/ca.crt:ro
      - indexer-state:/var/lib/fieldkest-indexer
    networks:
      delivery: {ipv4_address: 10.77.51.70, aliases: [indexer.keplerops.test]}

  k-staff:
    <<: *service-security
    build:
      context: ../..
      dockerfile: build/keplerops/images/staff.Dockerfile
    image: cinder-keplerops/k-staff:hand-build
    container_name: cinder-keplerops-staff
    hostname: k-staff
    depends_on: [router, k-identity]
    environment:
      <<: *tls-environment
      FIELDKEST_SERVICE: staff
      FIELDKEST_GATEWAY: 10.77.50.254
      FIELDKEST_CLIENT_CA: /tmp/fieldkest-ca.crt
      FIELDKEST_SERVICE_ROOT: /opt/keplerops-staff
      FIELDKEST_STATE_ROOT: /var/lib/keplerops-staff
      KRB5_CONFIG: /etc/krb5.conf
      KRB5_KTNAME: /opt/keplerops-staff/keytabs/staff.keytab
      KRB5RCACHEDIR: /tmp
    extra_hosts: [identity.keplerops.test:10.77.50.40]
    volumes:
      - ${KEPLEROPS_OPERATOR_DIR:-./.operator}/tls/server.crt:/run/fieldkest-tls/server.crt:ro
      - ${KEPLEROPS_OPERATOR_DIR:-./.operator}/tls/server.key:/run/fieldkest-tls/server.key:ro
      - ${KEPLEROPS_OPERATOR_DIR:-./.operator}/tls/ca.crt:/run/fieldkest-tls/ca.crt:ro
      - staff-state:/var/lib/keplerops-staff
    networks:
      corporate: {ipv4_address: 10.77.50.30, aliases: [staff.keplerops.test]}

  k-identity:
    <<: *service-security
    build:
      context: ../..
      dockerfile: build/keplerops/images/identity.Dockerfile
    image: cinder-keplerops/k-identity:hand-build
    container_name: cinder-keplerops-identity
    hostname: k-identity
    depends_on: [router]
    environment:
      <<: *tls-environment
      FIELDKEST_SERVICE: identity
      FIELDKEST_GATEWAY: 10.77.50.254
      FIELDKEST_SERVICE_ROOT: /opt/keplerops-identity
      FIELDKEST_STATE_ROOT: /var/lib/keplerops-identity
      FIELDKEST_START_KDC: 1
      KRB5_CONFIG: /etc/krb5.conf
      KRB5_KDC_PROFILE: /etc/krb5kdc/kdc.conf
      KRB5_KTNAME: /opt/keplerops-identity/keytabs/identity.keytab
      KRB5RCACHEDIR: /tmp
    volumes:
      - ${KEPLEROPS_OPERATOR_DIR:-./.operator}/tls/server.crt:/run/fieldkest-tls/server.crt:ro
      - ${KEPLEROPS_OPERATOR_DIR:-./.operator}/tls/server.key:/run/fieldkest-tls/server.key:ro
      - ${KEPLEROPS_OPERATOR_DIR:-./.operator}/tls/ca.crt:/run/fieldkest-tls/ca.crt:ro
      - ${KEPLEROPS_OPERATOR_DIR:-./.operator}/fixture-issuer.pub:/run/fieldkest-oidc/fixture-issuer.pub:ro
      - identity-state:/var/lib/keplerops-identity
    networks:
      corporate: {ipv4_address: 10.77.50.40, aliases: [identity.keplerops.test]}

  k-cert:
    <<: *service-security
    build:
      context: ../..
      dockerfile: build/keplerops/images/platform.Dockerfile
      args: {SERVICE: cert}
    image: cinder-keplerops/k-cert:hand-build
    container_name: cinder-keplerops-cert
    hostname: k-cert
    depends_on: [router]
    environment:
      <<: *tls-environment
      FIELDKEST_SERVICE: cert
      FIELDKEST_GATEWAY: 10.77.50.254
      FIELDKEST_STATE_ROOT: /var/lib/keplerops-cert
    volumes:
      - ${KEPLEROPS_OPERATOR_DIR:-./.operator}/tls/server.crt:/run/fieldkest-tls/server.crt:ro
      - ${KEPLEROPS_OPERATOR_DIR:-./.operator}/tls/server.key:/run/fieldkest-tls/server.key:ro
      - ${KEPLEROPS_OPERATOR_DIR:-./.operator}/tls/ca.crt:/run/fieldkest-tls/ca.crt:ro
      - ${KEPLEROPS_OPERATOR_DIR:-./.operator}/tls/evan.crt:/run/fieldkest-enrollment/evan.crt:ro
      - ${KEPLEROPS_OPERATOR_DIR:-./.operator}/tls/evan.key:/run/fieldkest-enrollment/evan.key:ro
      - cert-state:/var/lib/keplerops-cert
    networks:
      corporate: {ipv4_address: 10.77.50.50, aliases: [cert.keplerops.test]}

  k-workload:
    <<: *service-security
    build:
      context: ../..
      dockerfile: build/keplerops/images/platform.Dockerfile
      args: {SERVICE: workload}
    image: cinder-keplerops/k-workload:hand-build
    container_name: cinder-keplerops-workload
    hostname: k-workload
    depends_on: [router, runner]
    environment:
      <<: *tls-environment
      FIELDKEST_SERVICE: workload
      FIELDKEST_GATEWAY: 10.77.52.254
    volumes:
      - ${KEPLEROPS_OPERATOR_DIR:-./.operator}/tls/server.crt:/run/fieldkest-tls/server.crt:ro
      - ${KEPLEROPS_OPERATOR_DIR:-./.operator}/tls/server.key:/run/fieldkest-tls/server.key:ro
      - ${KEPLEROPS_OPERATOR_DIR:-./.operator}/tls/ca.crt:/run/fieldkest-tls/ca.crt:ro
      - workload-state:/var/lib/fieldkest-workload
      - runner-socket:/run/fieldkest-runner
    networks:
      cloud: {ipv4_address: 10.77.52.30, aliases: [workloads.keplerops.test]}

  k-data:
    <<: *service-security
    build:
      context: ../..
      dockerfile: build/keplerops/images/data.Dockerfile
    image: cinder-keplerops/k-data:hand-build
    container_name: cinder-keplerops-data
    hostname: k-data
    depends_on: [router]
    environment:
      <<: *tls-environment
      FIELDKEST_SERVICE: data
      FIELDKEST_GATEWAY: 10.77.52.254
    volumes:
      - ${KEPLEROPS_OPERATOR_DIR:-./.operator}/tls/server.crt:/run/fieldkest-tls/server.crt:ro
      - ${KEPLEROPS_OPERATOR_DIR:-./.operator}/tls/server.key:/run/fieldkest-tls/server.key:ro
      - ${KEPLEROPS_OPERATOR_DIR:-./.operator}/tls/ca.crt:/run/fieldkest-tls/ca.crt:ro
      - data-state:/var/lib/fieldkest-data
      - data-postgres:/var/lib/postgresql/16/fieldkest-history
    networks:
      cloud: {ipv4_address: 10.77.52.40, aliases: [data.keplerops.test]}

  k-assistant:
    <<: *service-security
    build:
      context: ../..
      dockerfile: build/keplerops/images/assistant.Dockerfile
    image: cinder-keplerops/k-assistant:hand-build
    container_name: cinder-keplerops-assistant
    hostname: k-assistant
    depends_on: [router, runner]
    environment:
      <<: *tls-environment
      FIELDKEST_SERVICE: assistant
      FIELDKEST_GATEWAY: 10.77.52.254
      FIELDKEST_SERVICE_ROOT: /opt/fieldkest-assistant
    extra_hosts: [support.keplerops.test:10.77.51.60]
    volumes:
      - ${KEPLEROPS_OPERATOR_DIR:-./.operator}/tls/server.crt:/run/fieldkest-tls/server.crt:ro
      - ${KEPLEROPS_OPERATOR_DIR:-./.operator}/tls/server.key:/run/fieldkest-tls/server.key:ro
      - ${KEPLEROPS_OPERATOR_DIR:-./.operator}/tls/ca.crt:/run/fieldkest-tls/ca.crt:ro
      - assistant-state:/var/lib/fieldkest-assistant
      - assistant-handover:/var/lib/fieldkest-assistant/handovers:ro
      - runner-socket:/run/fieldkest-runner
    networks:
      cloud: {ipv4_address: 10.77.52.50, aliases: [assistant.keplerops.test]}

  a-connector:
    <<: *service-security
    build:
      context: ../..
      dockerfile: build/keplerops/images/platform.Dockerfile
      args: {SERVICE: connector}
    image: cinder-keplerops/a-connector:hand-build
    container_name: cinder-keplerops-connector
    hostname: a-connector
    depends_on: [router]
    environment:
      <<: *tls-environment
      FIELDKEST_SERVICE: connector
      FIELDKEST_GATEWAY: 10.77.60.254
    volumes:
      - ${KEPLEROPS_OPERATOR_DIR:-./.operator}/tls/server.crt:/run/fieldkest-tls/server.crt:ro
      - ${KEPLEROPS_OPERATOR_DIR:-./.operator}/tls/server.key:/run/fieldkest-tls/server.key:ro
      - ${KEPLEROPS_OPERATOR_DIR:-./.operator}/tls/ca.crt:/run/fieldkest-tls/ca.crt:ro
      - connector-state:/var/lib/fieldkest-connector
    networks:
      connector: {ipv4_address: 10.77.60.20, aliases: [connector.arwc.test]}

networks:
  corporate:
    name: cinder-keplerops-corporate
    internal: true
    ipam: {config: [{subnet: 10.77.50.0/24, gateway: 10.77.50.1}]}
  delivery:
    name: cinder-keplerops-delivery
    internal: true
    ipam: {config: [{subnet: 10.77.51.0/24, gateway: 10.77.51.1}]}
  cloud:
    name: cinder-keplerops-cloud
    internal: true
    ipam: {config: [{subnet: 10.77.52.0/24, gateway: 10.77.52.1}]}
  jobs:
    name: cinder-keplerops-jobs
    internal: true
    ipam: {config: [{subnet: 10.77.53.0/24, gateway: 10.77.53.1}]}
  connector:
    name: cinder-keplerops-connector
    internal: true
    ipam: {config: [{subnet: 10.77.60.0/24, gateway: 10.77.60.1}]}

volumes:
  k-dev-home: {name: cinder-keplerops-k-dev-home}
  k-dev-audit: {name: cinder-keplerops-k-dev-audit}
  source-audit: {name: cinder-keplerops-source-audit}
  source-gitea: {name: cinder-keplerops-source-gitea}
  source-repositories: {name: cinder-keplerops-source-repositories}
  ci-audit: {name: cinder-keplerops-ci-audit}
  ci-results: {name: cinder-keplerops-ci-results}
  ci-rowan-workspace: {name: cinder-keplerops-ci-rowan-workspace}
  registry-audit: {name: cinder-keplerops-registry-audit}
  registry-results: {name: cinder-keplerops-registry-results}
  registry-published: {name: cinder-keplerops-registry-published}
  registry-verdaccio: {name: cinder-keplerops-registry-verdaccio}
  support-audit: {name: cinder-keplerops-support-audit}
  cloud-api-audit: {name: cinder-keplerops-cloud-api-audit}
  preview-state: {name: cinder-keplerops-preview-state}
  indexer-state: {name: cinder-keplerops-indexer-state}
  staff-state: {name: cinder-keplerops-staff-state}
  identity-state: {name: cinder-keplerops-identity-state}
  cert-state: {name: cinder-keplerops-cert-state}
  workload-state: {name: cinder-keplerops-workload-state}
