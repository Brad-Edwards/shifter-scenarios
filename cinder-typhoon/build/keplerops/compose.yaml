name: cinder-keplerops

x-runtime-credentials: &runtime-credentials ${KEPLEROPS_OPERATOR_DIR:-./.operator}/range-seed/runtime-credentials.json:/run/fieldkest-auth/runtime-credentials.json:ro

x-service-security: &service-security
  restart: unless-stopped
  read_only: true
  cap_drop: [ALL]
  cap_add: [NET_ADMIN, SETUID, SETGID]
  security_opt:
    - no-new-privileges:true
  sysctls:
    net.ipv4.ip_unprivileged_port_start: 0
  tmpfs:
    - /tmp:rw,noexec,nosuid,nodev,size=32m,mode=1777
  volumes:
    - *runtime-credentials
    - ${KEPLEROPS_OPERATOR_DIR:-./.operator}/tls/server.crt:/run/fieldkest-tls/server.crt:ro
    - ${KEPLEROPS_OPERATOR_DIR:-./.operator}/tls/server.key:/run/fieldkest-tls/server.key:ro
    - ${KEPLEROPS_OPERATOR_DIR:-./.operator}/tls/ca.crt:/run/fieldkest-tls/ca.crt:ro
  environment: &tls-environment
    FIELDKEST_TLS_CERT: /tmp/fieldkest.crt
    FIELDKEST_TLS_KEY: /tmp/fieldkest.key

services:
  router:
    build:
      context: ../..
      dockerfile: build/keplerops/images/router.Dockerfile
    image: cinder-keplerops/router:hand-build
    container_name: cinder-keplerops-router
    restart: unless-stopped
    cap_drop: [ALL]
    cap_add: [NET_ADMIN]
    security_opt:
      - no-new-privileges:true
    sysctls:
      net.ipv4.ip_forward: 1
    networks:
      corporate: {ipv4_address: 10.77.50.254}
      delivery: {ipv4_address: 10.77.51.254}
      cloud: {ipv4_address: 10.77.52.254}
      jobs: {ipv4_address: 10.77.53.254}
      connector: {ipv4_address: 10.77.60.254}

  fieldlink-dns:
    build:
      context: ../..
      dockerfile: build/keplerops/foundation/dns.Dockerfile
    image: cinder-keplerops/foundation-dns:hand-build
    container_name: cinder-keplerops-foundation-dns
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, NET_BIND_SERVICE, SETGID, SETUID]
    security_opt:
      - no-new-privileges:true
    sysctls:
      net.ipv4.ip_forward: 0
    tmpfs:
      - /run/named:rw,nosuid,nodev,size=4m,mode=0755
      - /var/cache/bind:rw,nosuid,nodev,size=8m,mode=0755
      - /tmp:rw,noexec,nosuid,nodev,size=4m,mode=1777
    healthcheck:
      test: ["CMD", "dig", "+short", "@127.0.0.1", "edge.keplerops.test"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      corporate: {ipv4_address: 10.77.50.10}
      delivery: {ipv4_address: 10.77.51.10}
      cloud: {ipv4_address: 10.77.52.10}
      jobs: {ipv4_address: 10.77.53.10}

  fieldlink-edge:
    image: nginx:alpine@sha256:4a73073bd557c65b759505da037898b61f1be6cbcc3c2c3aeac22d2a470c1752
    container_name: cinder-keplerops-foundation-edge
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN, NET_BIND_SERVICE, SETGID, SETUID]
    security_opt:
      - no-new-privileges:true
    sysctls:
      net.ipv4.ip_forward: 0
    depends_on:
      fieldlink-dns: {condition: service_healthy}
    dns: 10.77.50.10
    volumes:
      - ./native-platform/nginx-main.conf:/etc/nginx/nginx.conf:ro
      - ./native-workplace/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ${KEPLEROPS_OPERATOR_DIR:-./.operator}/tls/server.crt:/etc/nginx/tls/server.crt:ro
      - ${KEPLEROPS_OPERATOR_DIR:-./.operator}/tls/server.key:/etc/nginx/tls/server.key:ro
      - ${KEPLEROPS_OPERATOR_DIR:-./.operator}/tls/ca.crt:/etc/ssl/cert.pem:ro
      - ${KEPLEROPS_OPERATOR_DIR:-./.operator}/native-workplace/ca/tls:/etc/nginx/enrollment/tls:ro
      - ${KEPLEROPS_OPERATOR_DIR:-./.operator}/native-workplace/ca/certs/root_ca.crt:/etc/nginx/enrollment/root_ca.crt:ro
    tmpfs:
      - /var/cache/nginx:rw,nosuid,nodev,size=8m,mode=0755
      - /var/run:rw,nosuid,nodev,size=4m,mode=0755
      - /tmp:rw,noexec,nosuid,nodev,size=4m,mode=1777
    healthcheck:
      test: ["CMD", "wget", "-qO-", "https://edge.keplerops.test/health"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      corporate: {ipv4_address: 10.77.50.11, aliases: [edge.keplerops.test, foundation.keplerops.test, identity.keplerops.test, id.keplerops.test, ca.keplerops.test, cert.keplerops.test, staff.keplerops.test, workboard.keplerops.test, support.keplerops.test, tickets.keplerops.test, cloud.keplerops.test, cloud-api.keplerops.test, workload.keplerops.test, workloads.keplerops.test, data.keplerops.test, assistant.keplerops.test, llm.keplerops.test]}
      delivery: {ipv4_address: 10.77.51.11}
      cloud: {ipv4_address: 10.77.52.11}
      foundation_data: {ipv4_address: 10.77.56.11}

  fieldlink-postgres:
    image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
    container_name: cinder-keplerops-foundation-postgres
    restart: unless-stopped
    env_file:
      - ${KEPLEROPS_OPERATOR_DIR:-./.operator}/native-foundation.env
    command: [postgres, -c, ssl=on, -c, ssl_cert_file=/run/fieldlink/server.crt, -c, ssl_key_file=/run/fieldlink/server.key, -c, hba_file=/etc/postgresql/fieldlink-pg_hba.conf]
    volumes:
      - ${KEPLEROPS_OPERATOR_DIR:-./.operator}/native-platform/postgres-server.crt:/run/fieldlink/server.crt:ro
      - ${KEPLEROPS_OPERATOR_DIR:-./.operator}/native-platform/postgres-server.key:/run/fieldlink/server.key:ro
      - ./native-platform/pg_hba.conf:/etc/postgresql/fieldlink-pg_hba.conf:ro
      - native-postgres-data:/var/lib/postgresql/data
      - ${KEPLEROPS_OPERATOR_DIR:-./.operator}/native-workplace/postgres.sql:/docker-entrypoint-initdb.d/30-workplace.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 30
    networks:
      foundation_data: {ipv4_address: 10.77.56.10}

  k-dev-seed:
    image: cinder-keplerops/k-dev:hand-build
    container_name: cinder-keplerops-k-dev-seed
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        if [ ! -d /home/rowan/.config/git ]; then
          install -d -m 0700 -o rowan -g rowan /home/rowan/.config/git
        fi
        if [ ! -d /home/rowan/.config/fieldlink ]; then
          install -d -m 0700 -o rowan -g rowan /home/rowan/.config/fieldlink
        fi
        if [ ! -e /home/rowan/.config/git/credentials ]; then
          install -m 0600 -o rowan -g rowan /run/participant-seed/git-credentials /home/rowan/.config/git/credentials
        fi
        if [ ! -e /home/rowan/.npmrc ]; then
          install -m 0600 -o rowan -g rowan /run/participant-seed/npmrc /home/rowan/.npmrc
        fi
        if [ ! -e /home/rowan/.config/fieldlink/support-client.json ]; then
          install -m 0600 -o rowan -g rowan /run/participant-seed/support-client.json /home/rowan/.config/fieldlink/support-client.json
        fi
        for directory in .kube .aws; do
          if [ ! -d /home/rowan/$$directory ]; then
            install -d -m 0700 -o rowan -g rowan /home/rowan/$$directory
          fi
        done
        for pair in kubeconfig:.kube/config aws-credentials:.aws/credentials aws-config:.aws/config pgpass:.pgpass pg_service.conf:.pg_service.conf; do
          source=$${pair%%:*}
          destination=$${pair#*:}
          if [ ! -e /home/rowan/$$destination ]; then
            install -m 0600 -o rowan -g rowan /run/platform-seed/$$source /home/rowan/$$destination
          fi
        done
    restart: "no"
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    security_opt:
      - no-new-privileges:true
    volumes:
      - k-dev-home:/home/rowan
      - ${KEPLEROPS_OPERATOR_DIR:-./.operator}/range-seed/participant/git-credentials:/run/participant-seed/git-credentials:ro
      - ${KEPLEROPS_OPERATOR_DIR:-./.operator}/range-seed/participant/npmrc:/run/participant-seed/npmrc:ro
      - ${KEPLEROPS_OPERATOR_DIR:-./.operator}/range-seed/participant/support-client.json:/run/participant-seed/support-client.json:ro
      - ${KEPLEROPS_OPERATOR_DIR:-./.operator}/native-platform/kubernetes/rowan.yaml:/run/platform-seed/kubeconfig:ro
      - ${KEPLEROPS_OPERATOR_DIR:-./.operator}/native-platform/aws-credentials:/run/platform-seed/aws-credentials:ro
      - ${KEPLEROPS_OPERATOR_DIR:-./.operator}/native-platform/aws-config:/run/platform-seed/aws-config:ro
      - ${KEPLEROPS_OPERATOR_DIR:-./.operator}/native-platform/pgpass:/run/platform-seed/pgpass:ro
      - ${KEPLEROPS_OPERATOR_DIR:-./.operator}/native-platform/pg_service.conf:/run/platform-seed/pg_service.conf:ro
    network_mode: none

  k-dev:
    build:
      context: ../..
      dockerfile: build/keplerops/images/k-dev.Dockerfile
    image: cinder-keplerops/k-dev:hand-build
    container_name: cinder-keplerops-k-dev
    hostname: k-dev
    domainname: keplerops.test
    restart: unless-stopped
    cap_drop: [ALL]
    cap_add: [NET_ADMIN, SETUID, SETGID, CHOWN, FOWNER, SYS_CHROOT, AUDIT_WRITE, DAC_OVERRIDE, DAC_READ_SEARCH]
    security_opt:
      - no-new-privileges:true
    depends_on:
      router:
        condition: service_started
      fieldlink-dns:
        condition: service_healthy
      k-dev-seed:
        condition: service_completed_successfully
    dns: 10.77.50.10
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777
      - /run:rw,nosuid,nodev,size=16m,mode=0755
      - /var/log:rw,nosuid,nodev,size=32m,mode=0755
    ports:
      - "3389:3389"
    volumes:
      - k-dev-home:/home/rowan
      - k-dev-audit:/var/lib/fieldkest-workbench/audit
      - ${KEPLEROPS_OPERATOR_DIR:-./.operator}/tls/ca.crt:/run/fieldkest-auth/ca.crt:ro
      - ${KEPLEROPS_OPERATOR_DIR:-./.operator}/native-workplace/ca/certs/root_ca.crt:/run/fieldkest-auth/enrollment-ca.crt:ro
      - ${KEPLEROPS_OPERATOR_DIR:-./.operator}/rowan_authorized_keys:/run/fieldkest-auth/rowan_authorized_keys:ro
    extra_hosts:
      - staff.keplerops.test:10.77.50.11
      - workboard.keplerops.test:10.77.50.11
      - identity.keplerops.test:10.77.50.11
      - id.keplerops.test:10.77.50.11
      - cert.keplerops.test:10.77.50.11
      - ca.keplerops.test:10.77.50.11
      - kerberos.keplerops.test:10.77.50.40
      - source.keplerops.test:10.77.51.20
      - source-tools.keplerops.test:10.77.51.20
      - packages.keplerops.test:10.77.51.30
      - ci.keplerops.test:10.77.51.40
      - preview.keplerops.test:10.77.51.50
      - support.keplerops.test:10.77.50.11
      - tickets.keplerops.test:10.77.50.11
      - indexer.keplerops.test:10.77.51.70
      - cloud-api.keplerops.test:10.77.50.11
      - workloads.keplerops.test:10.77.50.11
      - data.keplerops.test:10.77.50.11
      - assistant.keplerops.test:10.77.50.11
      - objects.keplerops.test:10.77.50.11
      - llm.keplerops.test:10.77.50.11
      - workload.keplerops.test:10.77.50.11
      - connector.arwc.test:10.77.60.20
    networks:
      corporate:
        ipv4_address: 10.77.50.20
        aliases: [k-dev.keplerops.test]
      participant_ingress:
        ipv4_address: 10.77.55.2

  k-source:
    <<: *service-security
    build:
      context: ../..
      dockerfile: build/keplerops/images/source.Dockerfile
    image: cinder-keplerops/k-source:hand-build
    container_name: cinder-keplerops-source
    hostname: k-source
    domainname: delivery.keplerops.test
    depends_on: [router]
    volumes:
      - *runtime-credentials
      - ${KEPLEROPS_OPERATOR_DIR:-./.operator}/tls/server.crt:/run/fieldkest-tls/server.crt:ro
      - ${KEPLEROPS_OPERATOR_DIR:-./.operator}/tls/server.key:/run/fieldkest-tls/server.key:ro
      - ${KEPLEROPS_OPERATOR_DIR:-./.operator}/worker-hmac.key:/run/fieldkest-auth/worker-hmac.key:ro
      - source-audit:/var/lib/gitea/audit
      - ${KEPLEROPS_OPERATOR_DIR:-./.operator}/tls/ca.crt:/run/fieldkest-tls/ca.crt:ro
      - source-gitea:/var/lib/gitea/data
      - source-repositories:/var/lib/gitea/repositories
    networks:
      delivery:
        ipv4_address: 10.77.51.20
        aliases: [source.keplerops.test, source-tools.keplerops.test]

  k-ci:
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    cap_add: [NET_ADMIN, SETUID, SETGID, CHOWN, FOWNER]
    security_opt: [no-new-privileges:true]
    sysctls:
      net.ipv4.ip_unprivileged_port_start: 0
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=2g,mode=1777
    build:
      context: ../..
      dockerfile: build/keplerops/images/jenkins.Dockerfile
    image: cinder-keplerops/native-jenkins:hand-build
    container_name: cinder-keplerops-ci
    hostname: k-ci
    depends_on:
      router:
        condition: service_started
      k-source:
        condition: service_healthy
      k-registry:
        condition: service_healthy
    volumes:
      - native-jenkins-home:/var/jenkins_home
      - ${KEPLEROPS_OPERATOR_DIR:-./.operator}/native-ci/server.p12:/run/fieldlink-ci/server.p12:ro
      - ${KEPLEROPS_OPERATOR_DIR:-./.operator}/native-ci/keystore-password:/run/fieldlink-ci/keystore-password:ro
      - ${KEPLEROPS_OPERATOR_DIR:-./.operator}/native-ci/users.json:/run/fieldlink-ci/users.json:ro
      - ${KEPLEROPS_OPERATOR_DIR:-./.operator}/tls/ca.crt:/run/fieldlink-ci/ca.crt:ro
    networks:
      delivery:
        ipv4_address: 10.77.51.40
        aliases: [ci.keplerops.test, jenkins.keplerops.test]

  fieldlink-review:
    <<: *service-security
    build:
      context: ../..
      dockerfile: build/keplerops/images/ci.Dockerfile
    image: cinder-keplerops/k-ci:hand-build
    container_name: cinder-keplerops-review
    hostname: fieldlink-review
    domainname: delivery.keplerops.test
    depends_on: [router, runner]
    cap_add: [NET_ADMIN, SETUID, SETGID, DAC_READ_SEARCH, CHOWN, FOWNER, DAC_OVERRIDE]
    volumes:
      - *runtime-credentials
      - ${KEPLEROPS_OPERATOR_DIR:-./.operator}/tls/server.crt:/run/fieldkest-tls/server.crt:ro
      - ${KEPLEROPS_OPERATOR_DIR:-./.operator}/tls/server.key:/run/fieldkest-tls/server.key:ro
      - ${KEPLEROPS_OPERATOR_DIR:-./.operator}/tls/ca.crt:/run/fieldkest-tls/ca.crt:ro
      - ci-audit:/var/lib/fieldkest-ci/audit
      - ci-results:/var/lib/fieldkest-ci/results
      - handover:/var/lib/fieldkest-handover
      - runner-socket:/run/fieldkest-runner
      - ${KEPLEROPS_OPERATOR_DIR:-./.operator}/worker-hmac.key:/run/fieldkest-auth/worker-hmac.key:ro
      - ci-rowan-workspace:/var/lib/fieldkest-ci/workspaces/rowan
    extra_hosts:
      - "cloud-api.keplerops.test:10.77.50.11"
      - "source.keplerops.test:10.77.51.20"
      - "packages.keplerops.test:10.77.51.30"
    networks:
      delivery:
        ipv4_address: 10.77.51.41
        aliases: [review.keplerops.test]

  k-registry:
    <<: *service-security
    build:
      context: ../..
      dockerfile: build/keplerops/images/registry.Dockerfile
    image: cinder-keplerops/k-registry:hand-build
    container_name: cinder-keplerops-registry
    hostname: k-registry
    domainname: delivery.keplerops.test
    depends_on: [router, runner]
    volumes:
      - *runtime-credentials
      - ${KEPLEROPS_OPERATOR_DIR:-./.operator}/tls/server.crt:/run/fieldkest-tls/server.crt:ro
      - ${KEPLEROPS_OPERATOR_DIR:-./.operator}/tls/server.key:/run/fieldkest-tls/server.key:ro
      - ${KEPLEROPS_OPERATOR_DIR:-./.operator}/worker-hmac.key:/run/fieldkest-auth/worker-hmac.key:ro
      - registry-audit:/var/lib/fieldkest-registry/audit
      - registry-results:/var/lib/fieldkest-registry/results
      - registry-published:/var/lib/fieldkest-registry/published
      - registry-verdaccio:/var/lib/verdaccio
      - ${KEPLEROPS_OPERATOR_DIR:-./.operator}/tls/ca.crt:/run/fieldkest-tls/ca.crt:ro
      - runner-socket:/run/fieldkest-runner
    networks:
      delivery:
        ipv4_address: 10.77.51.30
        aliases: [packages.keplerops.test, delivery.keplerops.test]

  k-support:
    <<: *service-security
    cap_add: [NET_ADMIN, SETUID, SETGID, CHOWN]
    build:
      context: ../..
      dockerfile: build/keplerops/images/support.Dockerfile
    image: cinder-keplerops/k-support:hand-build
    container_name: cinder-keplerops-support
    hostname: k-support
    domainname: delivery.keplerops.test
    depends_on: [router]
    extra_hosts:
      - connector.arwc.test:10.77.60.20
    environment:
      FIELDKEST_TLS_CERT: /tmp/fieldkest.crt
      FIELDKEST_TLS_KEY: /tmp/fieldkest.key
      FIELDKEST_PG_HOST: fieldlink-postgres
      FIELDKEST_PG_DB: fieldlink_data
      FIELDKEST_PG_USER: fieldlink_admin
      FIELDKEST_PG_PASSWORD_FILE: /run/fieldkest-support/pg_password
    volumes:
      - *runtime-credentials
      - ${KEPLEROPS_OPERATOR_DIR:-./.operator}/tls/server.crt:/run/fieldkest-tls/server.crt:ro
      - ${KEPLEROPS_OPERATOR_DIR:-./.operator}/tls/server.key:/run/fieldkest-tls/server.key:ro
      - ${KEPLEROPS_OPERATOR_DIR:-./.operator}/tls/ca.crt:/run/fieldkest-tls/ca.crt:ro
      - support-audit:/var/lib/fieldkest-support/audit
      - handover:/var/lib/fieldkest-handover:ro
      - ${KEPLEROPS_OPERATOR_DIR:-./.operator}/native-platform/pg_admin_password:/run/fieldkest-support/pg_password:ro
    networks:
      delivery:
        ipv4_address: 10.77.51.60
        aliases: [fieldlink-support-integration]
      foundation_data: {ipv4_address: 10.77.56.26}

  report-worker:
    build:
      context: ../..
      dockerfile: build/keplerops/images/report-worker.Dockerfile
    image: cinder-keplerops/report-worker:hand-build
    command: ["-c", "raise SystemExit('worker images are launched by the runner')"]
    profiles: [build-only]

  node-worker:
    build:
      context: ../..
      dockerfile: build/keplerops/images/node-worker.Dockerfile
    image: cinder-keplerops/node-worker:hand-build
    command: ["-e", "process.exit(1)"]
    profiles: [build-only]

  runner:
    build:
      context: ../..
      dockerfile: build/keplerops/images/runner.Dockerfile
    image: cinder-keplerops/runner:hand-build
    container_name: cinder-keplerops-runner
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    environment:
      FIELDKEST_WORKER_IMAGE: cinder-keplerops/report-worker:hand-build
      FIELDKEST_NODE_WORKER_IMAGE: cinder-keplerops/node-worker:hand-build
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=8m,mode=1777
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - runner-socket:/run/fieldkest-runner
      - ${KEPLEROPS_OPERATOR_DIR:-./.operator}/tls/ca.crt:/run/fieldkest-auth/ca.crt:ro
    network_mode: none

  k-preview:
    <<: *service-security
    build:
      context: ../..
      dockerfile: build/keplerops/images/preview.Dockerfile
    image: cinder-keplerops/k-preview:hand-build
    container_name: cinder-keplerops-preview
    hostname: k-preview
    depends_on: [router]
    cap_add: [NET_ADMIN, CHOWN, SETUID, SETGID]
    environment:
      FIELDKEST_GATEWAY: 10.77.51.254
      API_BODY_LIMIT: 10MB
      CHROMIUM_DENY_PUBLIC_IPS: "true"
      HOME: /tmp
      XDG_CACHE_HOME: /tmp/cache
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=512m,mode=1777
      - /dev/shm:rw,noexec,nosuid,nodev,size=128m,mode=1777
    mem_limit: 1g
    pids_limit: 256
    volumes:
      - ${KEPLEROPS_OPERATOR_DIR:-./.operator}/tls/server.crt:/run/fieldkest-tls/server.crt:ro
      - ${KEPLEROPS_OPERATOR_DIR:-./.operator}/tls/server.key:/run/fieldkest-tls/server.key:ro
      - ${KEPLEROPS_OPERATOR_DIR:-./.operator}/tls/ca.crt:/run/fieldkest-tls/ca.crt:ro
      - ${KEPLEROPS_OPERATOR_DIR:-./.operator}/range-seed/runtime-credentials.json:/run/fieldkest-auth/runtime-credentials.json:ro
      - preview-audit:/var/lib/fieldkest-preview/audit
      - preview-results:/var/lib/fieldkest-preview/results
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--cacert", "/tmp/fieldlink-ca.crt", "--resolve", "preview.keplerops.test:443:127.0.0.1", "https://preview.keplerops.test/health"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      delivery: {ipv4_address: 10.77.51.50, aliases: [preview.keplerops.test]}

  k-indexer:
    <<: *service-security
    cap_add: [NET_ADMIN, SETUID, SETGID, CHOWN]
    build:
      context: ../..
      dockerfile: build/keplerops/images/indexer.Dockerfile
    image: cinder-keplerops/k-indexer:hand-build
    container_name: cinder-keplerops-indexer
    hostname: k-indexer
    depends_on: [router]
    environment:
      <<: *tls-environment
      FIELDKEST_SERVICE: indexer
      FIELDKEST_GATEWAY: 10.77.51.254
