      net.ipv4.ip_unprivileged_port_start: 0
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=8m,mode=1777
    environment:
      FIELDKEST_CUSTOMER_UPSTREAM: https://fieldlink.arwc.test
    extra_hosts:
      - fieldlink.arwc.test:${ARWC_CARRIER_ADDRESS:-10.77.59.2}
    volumes:
      - *runtime-credentials
      - ${KEPLEROPS_OPERATOR_DIR:-./.operator}/tls/server.crt:/run/fieldkest-tls/server.crt:ro
      - ${KEPLEROPS_OPERATOR_DIR:-./.operator}/tls/server.key:/run/fieldkest-tls/server.key:ro
      - ${KEPLEROPS_OPERATOR_DIR:-./.operator}/integration/arwc-ca.crt:/run/customer-auth/arwc-ca.crt:ro
      - ${KEPLEROPS_OPERATOR_DIR:-./.operator}/integration/registry-delivery.crt:/run/customer-auth/package.crt:ro
      - ${KEPLEROPS_OPERATOR_DIR:-./.operator}/integration/registry-delivery.key:/run/customer-auth/package.key:ro
      - ${KEPLEROPS_OPERATOR_DIR:-./.operator}/integration/support-delivery.crt:/run/customer-auth/diagnostic.crt:ro
      - ${KEPLEROPS_OPERATOR_DIR:-./.operator}/integration/support-delivery.key:/run/customer-auth/diagnostic.key:ro
      - registry-published:/var/lib/fieldkest-registry/published:ro
    networks:
      connector: {ipv4_address: 10.77.60.20, aliases: [connector.arwc.test]}
      customer_transit: {}

