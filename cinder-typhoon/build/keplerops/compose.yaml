name: cinder-keplerops

x-runtime-credentials: &runtime-credentials ${KEPLEROPS_OPERATOR_DIR:-./.operator}/range-seed/runtime-credentials.json:/run/fieldkest-auth/runtime-credentials.json:ro

x-service-security: &service-security
  restart: unless-stopped
  read_only: true
  cap_drop: [ALL]
  cap_add: [NET_ADMIN, SETUID, SETGID]
  security_opt:
    - no-new-privileges:true
  sysctls:
    net.ipv4.ip_unprivileged_port_start: 0
  tmpfs:
    - /tmp:rw,noexec,nosuid,nodev,size=32m,mode=1777
  volumes:
    - *runtime-credentials
    - ${KEPLEROPS_OPERATOR_DIR:-./.operator}/tls/server.crt:/run/fieldkest-tls/server.crt:ro
    - ${KEPLEROPS_OPERATOR_DIR:-./.operator}/tls/server.key:/run/fieldkest-tls/server.key:ro
    - ${KEPLEROPS_OPERATOR_DIR:-./.operator}/tls/ca.crt:/run/fieldkest-tls/ca.crt:ro
  environment: &tls-environment
    FIELDKEST_TLS_CERT: /tmp/fieldkest.crt
    FIELDKEST_TLS_KEY: /tmp/fieldkest.key

services:
  router:
    build:
      context: ../..
      dockerfile: build/keplerops/images/router.Dockerfile
    image: cinder-keplerops/router:hand-build
    container_name: cinder-keplerops-router
    restart: unless-stopped
    cap_drop: [ALL]
    cap_add: [NET_ADMIN]
    security_opt:
      - no-new-privileges:true
    sysctls:
      net.ipv4.ip_forward: 1
    networks:
      corporate: {ipv4_address: 10.77.50.254}
      delivery: {ipv4_address: 10.77.51.254}
      cloud: {ipv4_address: 10.77.52.254}
      jobs: {ipv4_address: 10.77.53.254}
      connector: {ipv4_address: 10.77.60.254}

  fieldlink-dns:
    build:
      context: ../..
      dockerfile: build/keplerops/foundation/dns.Dockerfile
    image: cinder-keplerops/foundation-dns:hand-build
    container_name: cinder-keplerops-foundation-dns
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, NET_BIND_SERVICE, SETGID, SETUID]
    security_opt:
      - no-new-privileges:true
    sysctls:
      net.ipv4.ip_forward: 0
    tmpfs:
      - /run/named:rw,nosuid,nodev,size=4m,mode=0755
      - /var/cache/bind:rw,nosuid,nodev,size=8m,mode=0755
      - /tmp:rw,noexec,nosuid,nodev,size=4m,mode=1777
    healthcheck:
      test: ["CMD", "dig", "+short", "@127.0.0.1", "edge.keplerops.test"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      corporate: {ipv4_address: 10.77.50.10}
      delivery: {ipv4_address: 10.77.51.10}
      cloud: {ipv4_address: 10.77.52.10}
      jobs: {ipv4_address: 10.77.53.10}

  fieldlink-edge:
    image: nginx:alpine@sha256:4a73073bd557c65b759505da037898b61f1be6cbcc3c2c3aeac22d2a470c1752
    container_name: cinder-keplerops-foundation-edge
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN, NET_BIND_SERVICE, SETGID, SETUID]
    security_opt:
      - no-new-privileges:true
    sysctls:
      net.ipv4.ip_forward: 0
    depends_on:
      fieldlink-dns: {condition: service_healthy}
    dns: 10.77.50.10
    volumes:
      - ./native-workplace/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ${KEPLEROPS_OPERATOR_DIR:-./.operator}/tls/server.crt:/etc/nginx/tls/server.crt:ro
      - ${KEPLEROPS_OPERATOR_DIR:-./.operator}/tls/server.key:/etc/nginx/tls/server.key:ro
      - ${KEPLEROPS_OPERATOR_DIR:-./.operator}/tls/ca.crt:/etc/ssl/cert.pem:ro
      - ${KEPLEROPS_OPERATOR_DIR:-./.operator}/native-workplace/ca/tls:/etc/nginx/enrollment/tls:ro
      - ${KEPLEROPS_OPERATOR_DIR:-./.operator}/native-workplace/ca/certs/root_ca.crt:/etc/nginx/enrollment/root_ca.crt:ro
    tmpfs:
      - /var/cache/nginx:rw,nosuid,nodev,size=8m,mode=0755
      - /var/run:rw,nosuid,nodev,size=4m,mode=0755
      - /tmp:rw,noexec,nosuid,nodev,size=4m,mode=1777
    healthcheck:
      test: ["CMD", "wget", "-qO-", "https://edge.keplerops.test/health"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      corporate: {ipv4_address: 10.77.50.11, aliases: [edge.keplerops.test, foundation.keplerops.test, identity.keplerops.test, id.keplerops.test, ca.keplerops.test, cert.keplerops.test, staff.keplerops.test, workboard.keplerops.test, support.keplerops.test, tickets.keplerops.test]}
      delivery: {ipv4_address: 10.77.51.11}
      cloud: {ipv4_address: 10.77.52.11}
      foundation_data: {ipv4_address: 10.77.56.11}

  fieldlink-postgres:
    image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
    container_name: cinder-keplerops-foundation-postgres
    restart: unless-stopped
    env_file:
      - ${KEPLEROPS_OPERATOR_DIR:-./.operator}/native-foundation.env
    volumes:
      - native-postgres-data:/var/lib/postgresql/data
      - ${KEPLEROPS_OPERATOR_DIR:-./.operator}/native-workplace/postgres.sql:/docker-entrypoint-initdb.d/30-workplace.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 30
    networks:
      foundation_data: {ipv4_address: 10.77.56.10}

  k-dev-seed:
    image: cinder-keplerops/k-dev:hand-build
    container_name: cinder-keplerops-k-dev-seed
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        if [ ! -d /home/rowan/.config/git ]; then
          install -d -m 0700 -o rowan -g rowan /home/rowan/.config/git
        fi
        if [ ! -d /home/rowan/.config/fieldlink ]; then
          install -d -m 0700 -o rowan -g rowan /home/rowan/.config/fieldlink
        fi
        if [ ! -e /home/rowan/.config/git/credentials ]; then
          install -m 0600 -o rowan -g rowan /run/participant-seed/git-credentials /home/rowan/.config/git/credentials
        fi
        if [ ! -e /home/rowan/.npmrc ]; then
          install -m 0600 -o rowan -g rowan /run/participant-seed/npmrc /home/rowan/.npmrc
        fi
        if [ ! -e /home/rowan/.config/fieldlink/support-client.json ]; then
          install -m 0600 -o rowan -g rowan /run/participant-seed/support-client.json /home/rowan/.config/fieldlink/support-client.json
        fi
    restart: "no"
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    security_opt:
      - no-new-privileges:true
    volumes:
      - k-dev-home:/home/rowan
      - ${KEPLEROPS_OPERATOR_DIR:-./.operator}/range-seed/participant/git-credentials:/run/participant-seed/git-credentials:ro
      - ${KEPLEROPS_OPERATOR_DIR:-./.operator}/range-seed/participant/npmrc:/run/participant-seed/npmrc:ro
      - ${KEPLEROPS_OPERATOR_DIR:-./.operator}/range-seed/participant/support-client.json:/run/participant-seed/support-client.json:ro
    network_mode: none

  k-dev:
    build:
      context: ../..
      dockerfile: build/keplerops/images/k-dev.Dockerfile
    image: cinder-keplerops/k-dev:hand-build
    container_name: cinder-keplerops-k-dev
    hostname: k-dev
    domainname: keplerops.test
    restart: unless-stopped
    cap_drop: [ALL]
    cap_add: [NET_ADMIN, SETUID, SETGID, CHOWN, FOWNER, SYS_CHROOT, AUDIT_WRITE, DAC_OVERRIDE, DAC_READ_SEARCH]
    security_opt:
      - no-new-privileges:true
    depends_on:
      router:
        condition: service_started
      fieldlink-dns:
        condition: service_healthy
      k-dev-seed:
        condition: service_completed_successfully
    dns: 10.77.50.10
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777
      - /run:rw,nosuid,nodev,size=16m,mode=0755
      - /var/log:rw,nosuid,nodev,size=32m,mode=0755
    ports:
      - "3389:3389"
    volumes:
      - k-dev-home:/home/rowan
      - k-dev-audit:/var/lib/fieldkest-workbench/audit
      - ${KEPLEROPS_OPERATOR_DIR:-./.operator}/tls/ca.crt:/run/fieldkest-auth/ca.crt:ro
      - ${KEPLEROPS_OPERATOR_DIR:-./.operator}/native-workplace/ca/certs/root_ca.crt:/run/fieldkest-auth/enrollment-ca.crt:ro
      - ${KEPLEROPS_OPERATOR_DIR:-./.operator}/rowan_authorized_keys:/run/fieldkest-auth/rowan_authorized_keys:ro
    extra_hosts:
      - staff.keplerops.test:10.77.50.11
      - workboard.keplerops.test:10.77.50.11
      - identity.keplerops.test:10.77.50.11
      - id.keplerops.test:10.77.50.11
      - cert.keplerops.test:10.77.50.11
      - ca.keplerops.test:10.77.50.11
      - kerberos.keplerops.test:10.77.50.40
      - source.keplerops.test:10.77.51.20
      - source-tools.keplerops.test:10.77.51.20
      - packages.keplerops.test:10.77.51.30
      - ci.keplerops.test:10.77.51.40
      - preview.keplerops.test:10.77.51.50
      - support.keplerops.test:10.77.50.11
      - tickets.keplerops.test:10.77.50.11
      - indexer.keplerops.test:10.77.51.70
      - cloud-api.keplerops.test:10.77.52.20
      - workloads.keplerops.test:10.77.52.30
      - data.keplerops.test:10.77.52.40
      - assistant.keplerops.test:10.77.52.50
      - connector.arwc.test:10.77.60.20
    networks:
      corporate:
        ipv4_address: 10.77.50.20
        aliases: [k-dev.keplerops.test]
      participant_ingress:
        ipv4_address: 10.77.55.2

  k-source:
    <<: *service-security
    build:
      context: ../..
      dockerfile: build/keplerops/images/source.Dockerfile
    image: cinder-keplerops/k-source:hand-build
    container_name: cinder-keplerops-source
    hostname: k-source
    domainname: delivery.keplerops.test
    depends_on: [router]
    volumes:
      - *runtime-credentials
      - ${KEPLEROPS_OPERATOR_DIR:-./.operator}/tls/server.crt:/run/fieldkest-tls/server.crt:ro
      - ${KEPLEROPS_OPERATOR_DIR:-./.operator}/tls/server.key:/run/fieldkest-tls/server.key:ro
      - ${KEPLEROPS_OPERATOR_DIR:-./.operator}/worker-hmac.key:/run/fieldkest-auth/worker-hmac.key:ro
      - source-audit:/var/lib/gitea/audit
      - ${KEPLEROPS_OPERATOR_DIR:-./.operator}/tls/ca.crt:/run/fieldkest-tls/ca.crt:ro
      - source-gitea:/var/lib/gitea/data
      - source-repositories:/var/lib/gitea/repositories
    networks:
      delivery:
        ipv4_address: 10.77.51.20
        aliases: [source.keplerops.test, source-tools.keplerops.test]

  k-ci:
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    cap_add: [NET_ADMIN, SETUID, SETGID, CHOWN, FOWNER]
    security_opt: [no-new-privileges:true]
    sysctls:
      net.ipv4.ip_unprivileged_port_start: 0
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=2g,mode=1777
    build:
      context: ../..
      dockerfile: build/keplerops/images/jenkins.Dockerfile
    image: cinder-keplerops/native-jenkins:hand-build
    container_name: cinder-keplerops-ci
    hostname: k-ci
    depends_on:
      router:
        condition: service_started
      k-source:
        condition: service_healthy
      k-registry:
        condition: service_healthy
    volumes:
      - native-jenkins-home:/var/jenkins_home
      - ${KEPLEROPS_OPERATOR_DIR:-./.operator}/native-ci/server.p12:/run/fieldlink-ci/server.p12:ro
      - ${KEPLEROPS_OPERATOR_DIR:-./.operator}/native-ci/keystore-password:/run/fieldlink-ci/keystore-password:ro
      - ${KEPLEROPS_OPERATOR_DIR:-./.operator}/native-ci/users.json:/run/fieldlink-ci/users.json:ro
      - ${KEPLEROPS_OPERATOR_DIR:-./.operator}/tls/ca.crt:/run/fieldlink-ci/ca.crt:ro
    networks:
      delivery:
        ipv4_address: 10.77.51.40
        aliases: [ci.keplerops.test, jenkins.keplerops.test]

  fieldlink-review:
    <<: *service-security
    build:
      context: ../..
      dockerfile: build/keplerops/images/ci.Dockerfile
    image: cinder-keplerops/k-ci:hand-build
    container_name: cinder-keplerops-review
    hostname: fieldlink-review
    domainname: delivery.keplerops.test
    depends_on: [router, runner]
    cap_add: [NET_ADMIN, SETUID, SETGID, DAC_READ_SEARCH, CHOWN, FOWNER, DAC_OVERRIDE]
    volumes:
      - *runtime-credentials
      - ${KEPLEROPS_OPERATOR_DIR:-./.operator}/tls/server.crt:/run/fieldkest-tls/server.crt:ro
      - ${KEPLEROPS_OPERATOR_DIR:-./.operator}/tls/server.key:/run/fieldkest-tls/server.key:ro
      - ${KEPLEROPS_OPERATOR_DIR:-./.operator}/tls/ca.crt:/run/fieldkest-tls/ca.crt:ro
      - ${KEPLEROPS_OPERATOR_DIR:-./.operator}/worker-hmac.key:/run/fieldkest-auth/worker-hmac.key:ro
      - ci-audit:/var/lib/fieldkest-ci/audit
      - ci-results:/var/lib/fieldkest-ci/results
      - ci-rowan-workspace:/var/lib/fieldkest-ci/workspaces/rowan
      - handover:/var/lib/fieldkest-handover
      - runner-socket:/run/fieldkest-runner
    networks:
      delivery:
        ipv4_address: 10.77.51.41
        aliases: [review.keplerops.test]

  k-registry:
    <<: *service-security
    build:
      context: ../..
      dockerfile: build/keplerops/images/registry.Dockerfile
    image: cinder-keplerops/k-registry:hand-build
    container_name: cinder-keplerops-registry
    hostname: k-registry
    domainname: delivery.keplerops.test
    depends_on: [router, runner]
    volumes:
      - *runtime-credentials
      - ${KEPLEROPS_OPERATOR_DIR:-./.operator}/tls/server.crt:/run/fieldkest-tls/server.crt:ro
      - ${KEPLEROPS_OPERATOR_DIR:-./.operator}/tls/server.key:/run/fieldkest-tls/server.key:ro
      - ${KEPLEROPS_OPERATOR_DIR:-./.operator}/worker-hmac.key:/run/fieldkest-auth/worker-hmac.key:ro
      - registry-audit:/var/lib/fieldkest-registry/audit
      - registry-results:/var/lib/fieldkest-registry/results
      - registry-published:/var/lib/fieldkest-registry/published
      - registry-verdaccio:/var/lib/verdaccio
      - ${KEPLEROPS_OPERATOR_DIR:-./.operator}/tls/ca.crt:/run/fieldkest-tls/ca.crt:ro
      - runner-socket:/run/fieldkest-runner
    networks:
      delivery:
        ipv4_address: 10.77.51.30
        aliases: [packages.keplerops.test, delivery.keplerops.test]

  k-support:
    <<: *service-security
    cap_add: [NET_ADMIN, SETUID, SETGID, CHOWN]
    build:
      context: ../..
      dockerfile: build/keplerops/images/support.Dockerfile
    image: cinder-keplerops/k-support:hand-build
    container_name: cinder-keplerops-support
    hostname: k-support
    domainname: delivery.keplerops.test
    depends_on: [router]
    extra_hosts:
      - connector.arwc.test:10.77.60.20
    volumes:
      - *runtime-credentials
      - ${KEPLEROPS_OPERATOR_DIR:-./.operator}/tls/server.crt:/run/fieldkest-tls/server.crt:ro
      - ${KEPLEROPS_OPERATOR_DIR:-./.operator}/tls/server.key:/run/fieldkest-tls/server.key:ro
      - ${KEPLEROPS_OPERATOR_DIR:-./.operator}/tls/ca.crt:/run/fieldkest-tls/ca.crt:ro
      - support-audit:/var/lib/fieldkest-support/audit
      - handover:/var/lib/fieldkest-handover:ro
    networks:
      delivery:
        ipv4_address: 10.77.51.60
        aliases: [fieldlink-support-integration]

  report-worker:
    build:
      context: ../..
      dockerfile: build/keplerops/images/report-worker.Dockerfile
    image: cinder-keplerops/report-worker:hand-build
    command: ["-c", "raise SystemExit('worker images are launched by the runner')"]
    profiles: [build-only]

  node-worker:
    build:
      context: ../..
      dockerfile: build/keplerops/images/node-worker.Dockerfile
    image: cinder-keplerops/node-worker:hand-build
    command: ["-e", "process.exit(1)"]
    profiles: [build-only]

  command-worker:
    build:
      context: ../..
      dockerfile: build/keplerops/images/command-worker.Dockerfile
    image: cinder-keplerops/command-worker:hand-build
    command: []
    profiles: [build-only]

  runner:
    build:
      context: ../..
      dockerfile: build/keplerops/images/runner.Dockerfile
    image: cinder-keplerops/runner:hand-build
    container_name: cinder-keplerops-runner
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    environment:
      FIELDKEST_WORKER_IMAGE: cinder-keplerops/report-worker:hand-build
      FIELDKEST_NODE_WORKER_IMAGE: cinder-keplerops/node-worker:hand-build
      FIELDKEST_COMMAND_WORKER_IMAGE: cinder-keplerops/command-worker:hand-build
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=8m,mode=1777
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - runner-socket:/run/fieldkest-runner
      - ${KEPLEROPS_OPERATOR_DIR:-./.operator}/tls/ca.crt:/run/fieldkest-auth/ca.crt:ro
    network_mode: none

  k-cloud-api:
    <<: *service-security
    build:
      context: ../..
      dockerfile: build/keplerops/images/cloud-api.Dockerfile
    image: cinder-keplerops/k-cloud-api:hand-build
    container_name: cinder-keplerops-cloud-api
    hostname: k-cloud-api
    domainname: cloud.keplerops.test
    depends_on: [router]
    volumes:
      - *runtime-credentials
      - ${KEPLEROPS_OPERATOR_DIR:-./.operator}/tls/server.crt:/run/fieldkest-tls/server.crt:ro
      - ${KEPLEROPS_OPERATOR_DIR:-./.operator}/tls/server.key:/run/fieldkest-tls/server.key:ro
      - ${KEPLEROPS_OPERATOR_DIR:-./.operator}/worker-hmac.key:/run/fieldkest-auth/worker-hmac.key:ro
      - cloud-api-audit:/var/lib/fieldkest-cloud-api/audit
    networks:
      cloud:
        ipv4_address: 10.77.52.20
        aliases: [cloud-api.keplerops.test]

  k-preview:
    <<: *service-security
    build:
      context: ../..
      dockerfile: build/keplerops/images/preview.Dockerfile
    image: cinder-keplerops/k-preview:hand-build
    container_name: cinder-keplerops-preview
    hostname: k-preview
    depends_on: [router]
    cap_add: [NET_ADMIN, CHOWN, SETUID, SETGID]
    environment:
      FIELDKEST_GATEWAY: 10.77.51.254
      API_PORT: "443"
      API_TLS_CERT_FILE: /tmp/fieldlink-preview.crt
      API_TLS_KEY_FILE: /tmp/fieldlink-preview.key
      API_BODY_LIMIT: 10MB
      CHROMIUM_DENY_PUBLIC_IPS: "true"
      HOME: /tmp
      XDG_CACHE_HOME: /tmp/cache
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=512m,mode=1777
      - /dev/shm:rw,noexec,nosuid,nodev,size=128m,mode=1777
    mem_limit: 1g
    pids_limit: 256
    volumes:
      - ${KEPLEROPS_OPERATOR_DIR:-./.operator}/tls/server.crt:/run/fieldkest-tls/server.crt:ro
      - ${KEPLEROPS_OPERATOR_DIR:-./.operator}/tls/server.key:/run/fieldkest-tls/server.key:ro
      - ${KEPLEROPS_OPERATOR_DIR:-./.operator}/tls/ca.crt:/run/fieldkest-tls/ca.crt:ro
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--cacert", "/tmp/fieldlink-ca.crt", "--resolve", "preview.keplerops.test:443:127.0.0.1", "https://preview.keplerops.test/health"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      delivery: {ipv4_address: 10.77.51.50, aliases: [preview.keplerops.test]}

  k-indexer:
    <<: *service-security
    build:
      context: ../..
      dockerfile: build/keplerops/images/indexer.Dockerfile
    image: cinder-keplerops/k-indexer:hand-build
    container_name: cinder-keplerops-indexer
    hostname: k-indexer
    depends_on: [router]
    environment:
      <<: *tls-environment
      FIELDKEST_SERVICE: indexer
      FIELDKEST_GATEWAY: 10.77.51.254
    volumes:
      - *runtime-credentials
      - ${KEPLEROPS_OPERATOR_DIR:-./.operator}/tls/server.crt:/run/fieldkest-tls/server.crt:ro
      - ${KEPLEROPS_OPERATOR_DIR:-./.operator}/tls/server.key:/run/fieldkest-tls/server.key:ro
      - ${KEPLEROPS_OPERATOR_DIR:-./.operator}/tls/ca.crt:/run/fieldkest-tls/ca.crt:ro
      - indexer-state:/var/lib/fieldkest-indexer
    networks:
      delivery: {ipv4_address: 10.77.51.70, aliases: [indexer.keplerops.test]}

  fieldlink-keycloak:
    image: quay.io/keycloak/keycloak:26.4.7@sha256:9409c59bdfb65dbffa20b11e6f18b8abb9281d480c7ca402f51ed3d5977e6007
    container_name: cinder-keplerops-keycloak
    restart: unless-stopped
    command: [start, --db=postgres, --http-enabled=true, --hostname=https://identity.keplerops.test, --proxy-headers=xforwarded, --health-enabled=true, --import-realm]
    env_file:
      - ${KEPLEROPS_OPERATOR_DIR:-./.operator}/native-workplace/keycloak.env
    environment:
      KC_DB_URL: jdbc:postgresql://fieldlink-postgres:5432/fieldlink_identity
      KC_DB_USERNAME: fieldlink_identity
      JAVA_OPTS_KC_HEAP: -Xms128m -Xmx512m
    depends_on:
      fieldlink-postgres: {condition: service_healthy}
    volumes:
      - ${KEPLEROPS_OPERATOR_DIR:-./.operator}/native-workplace/realm.json:/opt/keycloak/data/import/keplerops-realm.json:ro
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=128m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD-SHELL, 'bash -c "exec 3<>/dev/tcp/127.0.0.1/9000; printf \"GET /health/ready HTTP/1.0\\r\\n\\r\\n\" >&3; cat <&3 | grep -q UP"']
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    networks:
      foundation_data: {ipv4_address: 10.77.56.20}

  fieldlink-identity-setup:
    image: python:3.12.11-slim-bookworm@sha256:519591d6871b7bc437060736b9f7456b8731f1499a57e22e6c285135ae657bf7
    profiles: [operator]
    restart: "no"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    command: [python3, /operator/apply-account-defaults.py]
    env_file:
      - ${KEPLEROPS_OPERATOR_DIR:-./.operator}/native-workplace/identity-admin.env
    volumes:
      - ./native-workplace/apply-account-defaults.py:/operator/apply-account-defaults.py:ro
      - ${KEPLEROPS_OPERATOR_DIR:-./.operator}/tls/ca.crt:/run/fieldlink/ca.crt:ro
    extra_hosts: [identity.keplerops.test:10.77.56.11]
    networks: [foundation_data]

  fieldlink-kanboard:
    image: kanboard/kanboard:v1.2.57@sha256:637989624e5362af2b97bfb4be1936fb6b111ea7cbdffea0ae8bd3068dc84125
    container_name: cinder-keplerops-kanboard
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    env_file:
      - ${KEPLEROPS_OPERATOR_DIR:-./.operator}/native-workplace/kanboard.env
    depends_on:
      fieldlink-postgres: {condition: service_healthy}
    volumes:
      - native-kanboard-data:/var/www/app/data
      - ./native-workplace/seed-staff.php:/opt/fieldlink/seed-staff.php:ro
      - ${KEPLEROPS_OPERATOR_DIR:-./.operator}/native-workplace/kanboard-bootstrap.json:/run/fieldlink/kanboard-bootstrap.json:ro
      - ../../assets/keplerops/opening/k-dev/fieldlink-7.4.2-review.md:/opt/fieldlink/review-export.md:ro
    healthcheck:
      test: [CMD-SHELL, 'test -f /var/www/app/data/.fieldlink-seeded && curl -fsS http://127.0.0.1/healthcheck.php >/dev/null']
      interval: 10s
      timeout: 5s
      retries: 20
    networks:
      foundation_data: {ipv4_address: 10.77.56.22}

  fieldlink-support-db:
    image: mariadb:11.8@sha256:d36f18d65a0459510b8b0f643b226a6d299e3206486e2b64ff20754a6d291707
    container_name: cinder-keplerops-support-db
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: fieldlink_support
      MARIADB_USER: fieldlink_support
      MARIADB_PASSWORD_FILE: /run/fieldlink/support_db_password
      MARIADB_ROOT_PASSWORD_FILE: /run/fieldlink/mariadb_root_password
    volumes:
      - native-support-db:/var/lib/mysql
      - ${KEPLEROPS_OPERATOR_DIR:-./.operator}/native-workplace/support_db_password:/run/fieldlink/support_db_password:ro
      - ${KEPLEROPS_OPERATOR_DIR:-./.operator}/native-workplace/mariadb_root_password:/run/fieldlink/mariadb_root_password:ro
    healthcheck:
      test: [CMD, healthcheck.sh, --connect, --innodb_initialized]
      interval: 5s
      timeout: 5s
      retries: 30
    networks:
      foundation_data: {ipv4_address: 10.77.56.24}

  fieldlink-support:
    build:
      context: ../..
      dockerfile: build/keplerops/native-workplace/osticket.Dockerfile
    image: cinder-keplerops/osticket:1.18.4
    container_name: cinder-keplerops-osticket
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    depends_on:
      fieldlink-support-db: {condition: service_healthy}
    volumes:
      - ${KEPLEROPS_OPERATOR_DIR:-./.operator}/native-workplace/ost-config.php:/var/www/html/include/ost-config.php
      - ${KEPLEROPS_OPERATOR_DIR:-./.operator}/native-workplace/support-bootstrap.json:/run/fieldlink/support-bootstrap.json:ro
      - ${KEPLEROPS_OPERATOR_DIR:-./.operator}/native-workplace/support-accounts.json:/run/fieldlink/support-accounts.json:ro
      - ./native-workplace/seed-support-users.php:/opt/fieldlink/seed-support-users.php:ro
      - ./native-workplace/seed-support-case.php:/opt/fieldlink/seed-support-case.php:ro
      - ../../assets/keplerops/opening/k-support/SUP-2841.json:/operator/company-conversation.json:ro
    healthcheck:
      test: [CMD, php, -r, '$$body=@file_get_contents("http://127.0.0.1/scp/login.php"); exit(is_string($$body) && str_contains($$body, "name=\"userid\"") ? 0 : 1);']
      interval: 10s
      timeout: 5s
      retries: 30
    networks:
      foundation_data: {ipv4_address: 10.77.56.23}

  k-identity:
    <<: *service-security
    build:
      context: ../..
      dockerfile: build/keplerops/native-workplace/kerberos.Dockerfile
    image: cinder-keplerops/k-identity:native-kerberos
    container_name: cinder-keplerops-identity
    hostname: kerberos.keplerops.test
    depends_on: [router]
    environment:
      KRB5_CONFIG: /etc/krb5.conf
      KRB5_KDC_PROFILE: /etc/krb5kdc/kdc.conf
    volumes:
      - identity-state:/var/lib/keplerops-identity
      - ${KEPLEROPS_OPERATOR_DIR:-./.operator}/native-workplace/kerberos.json:/run/fieldlink/kerberos.json:ro
    networks:
      corporate: {ipv4_address: 10.77.50.40, aliases: [kerberos.keplerops.test]}
      foundation_data: {ipv4_address: 10.77.56.30}

  k-cert:
    image: smallstep/step-ca:0.28.4@sha256:0f88382ac5af5c6b7bbba0c6e8fcefef52aee6f22ea364df8e02a09ffd0d22f3
    container_name: cinder-keplerops-cert
    restart: unless-stopped
    user: 1000:1000
    read_only: true
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    command: [step-ca, /home/step/config/ca.json, --password-file, /home/step/secrets/password]
    environment:
      SSL_CERT_FILE: /home/step/issuer-trust.crt
    depends_on:
      fieldlink-keycloak: {condition: service_healthy}
    extra_hosts:
      - identity.keplerops.test:10.77.56.11
      - ca.keplerops.test:127.0.0.1
    volumes:
      - ${KEPLEROPS_OPERATOR_DIR:-./.operator}/native-workplace/ca:/home/step:ro
      - native-ca-data:/home/step/db
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=16m,mode=1777
    healthcheck:
      test: [CMD, step, ca, health, --ca-url, 'https://ca.keplerops.test:9000', --root, /home/step/certs/root_ca.crt]
      interval: 10s
      timeout: 5s
      retries: 30
    networks:
      foundation_data: {ipv4_address: 10.77.56.21}

  k-workload:
    <<: *service-security
    build:
      context: ../..
      dockerfile: build/keplerops/images/platform.Dockerfile
      args: {SERVICE: workload}
    image: cinder-keplerops/k-workload:hand-build
    container_name: cinder-keplerops-workload
    hostname: k-workload
    depends_on: [router, runner]
    environment:
      <<: *tls-environment
      FIELDKEST_SERVICE: workload
      FIELDKEST_GATEWAY: 10.77.52.254
      FIELDKEST_STATE_ROOT: /var/lib/fieldkest-workloads
    volumes:
      - *runtime-credentials
      - ${KEPLEROPS_OPERATOR_DIR:-./.operator}/tls/server.crt:/run/fieldkest-tls/server.crt:ro
      - ${KEPLEROPS_OPERATOR_DIR:-./.operator}/tls/server.key:/run/fieldkest-tls/server.key:ro
      - ${KEPLEROPS_OPERATOR_DIR:-./.operator}/tls/ca.crt:/run/fieldkest-tls/ca.crt:ro
      - workload-state:/var/lib/fieldkest-workloads
      - runner-socket:/run/fieldkest-runner
    networks:
      cloud: {ipv4_address: 10.77.52.30, aliases: [workloads.keplerops.test]}

  k-data:
    <<: *service-security
    build:
      context: ../..
      dockerfile: build/keplerops/images/data.Dockerfile
    image: cinder-keplerops/k-data:hand-build
    container_name: cinder-keplerops-data
    hostname: k-data
    depends_on: [router]
    environment:
      <<: *tls-environment
      FIELDKEST_SERVICE: data
      FIELDKEST_GATEWAY: 10.77.52.254
    volumes:
      - *runtime-credentials
      - ${KEPLEROPS_OPERATOR_DIR:-./.operator}/tls/server.crt:/run/fieldkest-tls/server.crt:ro
      - ${KEPLEROPS_OPERATOR_DIR:-./.operator}/tls/server.key:/run/fieldkest-tls/server.key:ro
      - ${KEPLEROPS_OPERATOR_DIR:-./.operator}/tls/ca.crt:/run/fieldkest-tls/ca.crt:ro
      - data-state:/var/lib/fieldkest-data
      - data-postgres:/var/lib/postgresql/16/fieldkest-history
    networks:
      cloud: {ipv4_address: 10.77.52.40, aliases: [data.keplerops.test]}

  k-assistant:
    <<: *service-security
    build:
      context: ../..
      dockerfile: build/keplerops/images/assistant.Dockerfile
    image: cinder-keplerops/k-assistant:hand-build
    container_name: cinder-keplerops-assistant
    hostname: k-assistant
    depends_on: [router, runner]
    environment:
      <<: *tls-environment
      FIELDKEST_SERVICE: assistant
      FIELDKEST_GATEWAY: 10.77.52.254
      FIELDKEST_SERVICE_ROOT: /opt/fieldkest-assistant
    extra_hosts: [support.keplerops.test:10.77.51.60]
    volumes:
      - *runtime-credentials
      - ${KEPLEROPS_OPERATOR_DIR:-./.operator}/tls/server.crt:/run/fieldkest-tls/server.crt:ro
      - ${KEPLEROPS_OPERATOR_DIR:-./.operator}/tls/server.key:/run/fieldkest-tls/server.key:ro
      - ${KEPLEROPS_OPERATOR_DIR:-./.operator}/tls/ca.crt:/run/fieldkest-tls/ca.crt:ro
      - assistant-state:/var/lib/fieldkest-assistant
      - assistant-handover:/var/lib/fieldkest-assistant/handovers:ro
      - runner-socket:/run/fieldkest-runner
    networks:
      cloud: {ipv4_address: 10.77.52.50, aliases: [assistant.keplerops.test]}

  a-connector:
    build:
      context: ../..
      dockerfile: build/keplerops/images/customer-relay.Dockerfile
    image: cinder-keplerops/customer-relay:hand-build
    container_name: cinder-keplerops-connector
    hostname: a-connector
    depends_on: [router]
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, NET_ADMIN, SETGID, SETPCAP, SETUID]
    security_opt:
      - no-new-privileges:true
    sysctls:
      net.ipv4.ip_unprivileged_port_start: 0
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=8m,mode=1777
    environment:
      FIELDKEST_CUSTOMER_UPSTREAM: https://fieldlink.arwc.test
    extra_hosts:
      - fieldlink.arwc.test:${ARWC_CARRIER_ADDRESS:-10.77.59.2}
    volumes:
      - *runtime-credentials
      - ${KEPLEROPS_OPERATOR_DIR:-./.operator}/tls/server.crt:/run/fieldkest-tls/server.crt:ro
      - ${KEPLEROPS_OPERATOR_DIR:-./.operator}/tls/server.key:/run/fieldkest-tls/server.key:ro
      - ${KEPLEROPS_OPERATOR_DIR:-./.operator}/integration/arwc-ca.crt:/run/customer-auth/arwc-ca.crt:ro
      - ${KEPLEROPS_OPERATOR_DIR:-./.operator}/integration/registry-delivery.crt:/run/customer-auth/package.crt:ro
      - ${KEPLEROPS_OPERATOR_DIR:-./.operator}/integration/registry-delivery.key:/run/customer-auth/package.key:ro
      - ${KEPLEROPS_OPERATOR_DIR:-./.operator}/integration/support-delivery.crt:/run/customer-auth/diagnostic.crt:ro
      - ${KEPLEROPS_OPERATOR_DIR:-./.operator}/integration/support-delivery.key:/run/customer-auth/diagnostic.key:ro
      - registry-published:/var/lib/fieldkest-registry/published:ro
    networks:
      connector: {ipv4_address: 10.77.60.20, aliases: [connector.arwc.test]}
      customer_transit: {}

networks:
  corporate:
    name: cinder-keplerops-corporate
    internal: true
    ipam: {config: [{subnet: 10.77.50.0/24, gateway: 10.77.50.1}]}
  delivery:
    name: cinder-keplerops-delivery
    internal: true
    ipam: {config: [{subnet: 10.77.51.0/24, gateway: 10.77.51.1}]}
  cloud:
    name: cinder-keplerops-cloud
    internal: true
    ipam: {config: [{subnet: 10.77.52.0/24, gateway: 10.77.52.1}]}
  jobs:
    name: cinder-keplerops-jobs
    internal: true
    ipam: {config: [{subnet: 10.77.53.0/24, gateway: 10.77.53.1}]}
  connector:
    name: cinder-keplerops-connector
    internal: true
    ipam: {config: [{subnet: 10.77.60.0/24, gateway: 10.77.60.1}]}
  customer_transit:
    name: cinder-keplerops-customer-transit
    driver: bridge
    ipam: {config: [{subnet: 10.77.54.0/29, gateway: 10.77.54.1}]}
  participant_ingress:
    name: cinder-keplerops-participant-ingress
    driver: bridge
    driver_opts:
      com.docker.network.bridge.enable_ip_masquerade: "false"
    ipam: {config: [{subnet: 10.77.55.0/29, gateway: 10.77.55.1}]}
  foundation_data:
    name: cinder-keplerops-foundation-data
    internal: true
    ipam: {config: [{subnet: 10.77.56.0/24, gateway: 10.77.56.1}]}

volumes:
  k-dev-home: {name: cinder-keplerops-k-dev-home}
  k-dev-audit: {name: cinder-keplerops-k-dev-audit}
  source-audit: {name: cinder-keplerops-source-audit}
  source-gitea: {name: cinder-keplerops-source-gitea}
  source-repositories: {name: cinder-keplerops-source-repositories}
  ci-audit: {name: cinder-keplerops-ci-audit}
  ci-results: {name: cinder-keplerops-ci-results}
  ci-rowan-workspace: {name: cinder-keplerops-ci-rowan-workspace}
  registry-audit: {name: cinder-keplerops-registry-audit}
  registry-results: {name: cinder-keplerops-registry-results}
  registry-published: {name: cinder-keplerops-registry-published}
  registry-verdaccio: {name: cinder-keplerops-registry-verdaccio}
  support-audit: {name: cinder-keplerops-support-audit}
  cloud-api-audit: {name: cinder-keplerops-cloud-api-audit}
  indexer-state: {name: cinder-keplerops-indexer-state}
  staff-state: {name: cinder-keplerops-staff-state}
  identity-state: {name: cinder-keplerops-identity-state}
  cert-state: {name: cinder-keplerops-cert-state}
  workload-state: {name: cinder-keplerops-workload-state}
  data-state: {name: cinder-keplerops-data-state}
  data-postgres: {name: cinder-keplerops-data-postgres}
  assistant-state: {name: cinder-keplerops-assistant-state}
  assistant-handover: {name: cinder-keplerops-assistant-handover}
  handover: {name: cinder-keplerops-handover}
  runner-socket: {name: cinder-keplerops-runner-socket}
  native-postgres-data: {name: cinder-keplerops-native-postgres-data}
  native-ca-data: {name: cinder-keplerops-native-ca-data}
  native-kanboard-data: {name: cinder-keplerops-native-kanboard-data}
  native-support-db: {name: cinder-keplerops-native-support-db}
  native-jenkins-home: {name: cinder-keplerops-native-jenkins-home}
