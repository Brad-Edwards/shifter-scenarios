options {
    directory "/var/cache/bind";
    listen-on port 53 { any; };
    listen-on-v6 { none; };
    recursion no;
    allow-query {
        127.0.0.1;
        10.77.50.0/24;
        10.77.51.0/24;
        10.77.52.0/24;
        10.77.53.0/24;
    };
    allow-transfer { none; };
    minimal-responses yes;
    version none;
};

zone "keplerops.test" IN {
    type primary;
    file "/etc/bind/db.keplerops.test";
    allow-update { none; };
};
