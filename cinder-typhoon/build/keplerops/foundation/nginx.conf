server {
    listen 443 ssl default_server;
    server_name edge.keplerops.test foundation.keplerops.test;

    ssl_certificate /etc/nginx/tls/server.crt;
    ssl_certificate_key /etc/nginx/tls/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "fieldlink foundation ready\n";
    }

    location / {
        return 404;
    }
}
