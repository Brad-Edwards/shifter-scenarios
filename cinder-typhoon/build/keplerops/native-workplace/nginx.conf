resolver 127.0.0.11 valid=10s ipv6=off;
server {
    listen 443 ssl default_server;
    server_name edge.keplerops.test foundation.keplerops.test;
    ssl_certificate /etc/nginx/tls/server.crt;
    ssl_certificate_key /etc/nginx/tls/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    location = /health { access_log off; default_type text/plain; return 200 "fieldlink foundation ready\n"; }
    location / { return 404; }
}
server {
    listen 443 ssl;
    server_name identity.keplerops.test id.keplerops.test;
    ssl_certificate /etc/nginx/tls/server.crt;
    ssl_certificate_key /etc/nginx/tls/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    location /api/service-relations/ {
        set $kspnego https://k-identity-spnego:443;
        proxy_pass $kspnego;
        proxy_ssl_verify off;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
    }
    location /api/federation/ {
        set $ksupport https://k-support:443;
        proxy_pass $ksupport;
        proxy_ssl_verify off;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 15s;
    }
    location / {
        set $identity http://fieldlink-keycloak:8080;
        proxy_pass $identity;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
server {
    listen 443 ssl;
    server_name staff.keplerops.test workboard.keplerops.test;
    ssl_certificate /etc/nginx/tls/server.crt;
    ssl_certificate_key /etc/nginx/tls/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    # mTLS for archive: verify the client cert against the enrollment CA bundle.
    # Enrollment leaf certs are signed by the intermediate CA, so the bundle must
    # contain the intermediate and the root. ssl_verify_depth 2 allows the full
    # leaf -> intermediate -> root chain. ssl_verify_client optional lets other
    # routes work without a cert.
    ssl_verify_client optional;
    ssl_client_certificate /etc/nginx/enrollment/client_ca.crt;
    ssl_verify_depth 2;
    location /api/managed-identities/ {
        set $kstaffspnego https://k-staff-spnego:443;
        proxy_pass $kstaffspnego;
        proxy_ssl_verify off;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
    }
    location /api/archive/ {
        if ($ssl_client_verify != "SUCCESS") {
            return 401 '{"error":"client_cert_required"}';
        }
        set $kstaff https://k-staff:443;
        proxy_pass $kstaff;
        proxy_ssl_verify off;
        proxy_set_header Host $host;
        proxy_set_header X-Client-Cert-DN $ssl_client_s_dn;
        proxy_set_header X-Client-Cert-Verified $ssl_client_verify;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
    }
    location /api/ {
        set $kstaff https://k-staff:443;
        proxy_pass $kstaff;
        proxy_ssl_verify off;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
    }
    location /.well-known/fieldkest-client {
        set $kstaff https://k-staff:443;
        proxy_pass $kstaff;
        proxy_ssl_verify off;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
    }
    location / {
        set $staff http://fieldlink-kanboard:80;
        proxy_pass $staff;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
