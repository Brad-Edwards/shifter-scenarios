server {
    listen 8443 ssl;
    server_name support.keplerops.test;
    ssl_certificate /etc/nginx/tls/server.crt;
    ssl_certificate_key /etc/nginx/tls/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    location / {
        set $integration https://k-support:443;
        proxy_pass $integration;
        proxy_ssl_server_name on;
        proxy_ssl_name support.keplerops.test;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /etc/ssl/cert.pem;
        proxy_read_timeout 30s;
        proxy_set_header Host $host;
    }
}
server {
    listen 443 ssl;
    server_name ca.keplerops.test cert.keplerops.test;
    ssl_certificate /etc/nginx/enrollment/tls/server.crt;
    ssl_certificate_key /etc/nginx/enrollment/tls/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    location / {
        set $authority https://k-cert:9000;
        proxy_pass $authority;
        proxy_ssl_server_name on;
        proxy_ssl_name ca.keplerops.test;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /etc/nginx/enrollment/root_ca.crt;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }
}

server {
    listen 443 ssl;
    server_name objects.keplerops.test;
    ssl_certificate /etc/nginx/tls/server.crt;
    ssl_certificate_key /etc/nginx/tls/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    client_max_body_size 100m;
    location / {
        set $native http://fieldlink-objects:8333;
        proxy_pass $native;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
    }
}

server {
    listen 443 ssl;
    server_name assistant.keplerops.test;
    ssl_certificate /etc/nginx/tls/server.crt;
    ssl_certificate_key /etc/nginx/tls/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    client_max_body_size 100m;
    location = /static/app.js {
        # Public FieldKest assistant bundle — references configEndpoint /api/config.
        default_type application/javascript;
        alias /etc/nginx/assistant/app.js;
    }
    location /api/contexts {
        set $kassistantapi https://k-assistant-api:443;
        proxy_pass $kassistantapi;
        proxy_ssl_verify off;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
    }
    location /api/conversations/ {
        set $kassistantapi https://k-assistant-api:443;
        proxy_pass $kassistantapi;
        proxy_ssl_verify off;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
    }
    location /api/answers {
        set $kassistantapi https://k-assistant-api:443;
        proxy_pass $kassistantapi;
        proxy_ssl_verify off;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }
    location = /api/config {
        # Public assistant configuration — exposes the real AnythingLLM workspace slug,
        # context label, and policy version. No credential included. K21.1 exposure.
        # collection = real AnythingLLM workspace slug (support-private).
        # context = stable label that k-assistant maps to the workspace + thread.
        # answer_requests.private_escalation = real workspace/thread identifiers.
        default_type application/json;
        return 200 '{"context":"ctx-support-private-v4","collection":"support-private","policy_version":"retrieval-v4","answer_requests":{"private_escalation":{"context_id":"ctx-support-private-v4","conversation_id":"c47def99-52d9-4727-983e-b4be35770ccb","tenant_id":"TEN-RILL-022"}}}';
    }
    location / {
        set $native http://fieldlink-assistant:3001;
        proxy_pass $native;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
    }
}

