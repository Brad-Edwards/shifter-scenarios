resolver 127.0.0.11 valid=10s ipv6=off;
server {
    listen 443 ssl default_server;
    server_name edge.keplerops.test foundation.keplerops.test;
    ssl_certificate /etc/nginx/tls/server.crt;
    ssl_certificate_key /etc/nginx/tls/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    location = /health { access_log off; default_type text/plain; return 200 "fieldlink foundation ready\n"; }
    location / { return 404; }
}
server {
    listen 443 ssl;
    server_name identity.keplerops.test id.keplerops.test;
    ssl_certificate /etc/nginx/tls/server.crt;
    ssl_certificate_key /etc/nginx/tls/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    location / {
        set $identity http://fieldlink-keycloak:8080;
        proxy_pass $identity;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
server {
    listen 443 ssl;
    server_name staff.keplerops.test workboard.keplerops.test;
    ssl_certificate /etc/nginx/tls/server.crt;
    ssl_certificate_key /etc/nginx/tls/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    location / {
        set $staff http://fieldlink-kanboard:80;
        proxy_pass $staff;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
server {
    listen 443 ssl;
    server_name support.keplerops.test tickets.keplerops.test;
    ssl_certificate /etc/nginx/tls/server.crt;
    ssl_certificate_key /etc/nginx/tls/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    client_max_body_size 20m;
    location / {
        set $support http://fieldlink-support:80;
        proxy_pass $support;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
server {
    listen 8443 ssl;
    server_name support.keplerops.test;
    ssl_certificate /etc/nginx/tls/server.crt;
    ssl_certificate_key /etc/nginx/tls/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    location / {
        set $integration https://k-support:443;
        proxy_pass $integration;
        proxy_ssl_server_name on;
        proxy_ssl_name support.keplerops.test;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /etc/ssl/cert.pem;
        proxy_read_timeout 30s;
        proxy_set_header Host $host;
    }
}
server {
    listen 443 ssl;
    server_name ca.keplerops.test cert.keplerops.test;
    ssl_certificate /etc/nginx/enrollment/tls/server.crt;
    ssl_certificate_key /etc/nginx/enrollment/tls/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    location / {
        set $authority https://k-cert:9000;
        proxy_pass $authority;
        proxy_ssl_server_name on;
        proxy_ssl_name ca.keplerops.test;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /etc/nginx/enrollment/root_ca.crt;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }
}

server {
    listen 443 ssl;
    server_name objects.keplerops.test;
    ssl_certificate /etc/nginx/tls/server.crt;
    ssl_certificate_key /etc/nginx/tls/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    client_max_body_size 100m;
    location / {
        set $native http://fieldlink-objects:8333;
        proxy_pass $native;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
    }
}

