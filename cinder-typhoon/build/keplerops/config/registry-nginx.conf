user root;
worker_processes 1;
pid /tmp/registry-nginx.pid;
error_log /tmp/registry-nginx-error.log warn;

events {
    worker_connections 128;
}

http {
    client_body_temp_path /tmp/nginx-client-body;
    proxy_temp_path /tmp/nginx-proxy;
    fastcgi_temp_path /tmp/nginx-fastcgi;
    uwsgi_temp_path /tmp/nginx-uwsgi;
    scgi_temp_path /tmp/nginx-scgi;
    access_log off;

    server {
        listen 8443 ssl;
        ssl_certificate /run/fieldkest-tls/server.crt;
        ssl_certificate_key /run/fieldkest-tls/server.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        server_tokens off;

        # Default proxy: standard forwarding.
        location / {
            proxy_pass http://127.0.0.1:9000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header Connection "";
        }

        # Inspection paths: forward the participant-supplied Content-Length header
        # without correction.  Nginx reads the full Transfer-Encoding chunked body
        # from the participant, but the upstream (Python BaseHTTPRequestHandler)
        # receives the participant's original Content-Length value.  When CL is
        # smaller than the actual forwarded body, the upstream reads only CL bytes
        # and the remaining bytes become the prefix of the next upstream request.
        location ~ ^/api/inspections {
            proxy_pass http://127.0.0.1:9000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header Connection "";
            proxy_set_header Content-Length $http_content_length;
        }
    }
}
