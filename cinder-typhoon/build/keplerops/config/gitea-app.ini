APP_NAME = FieldKest Source
RUN_MODE = prod
WORK_PATH = /var/lib/gitea/data

[server]
PROTOCOL = https
HTTP_ADDR = 0.0.0.0
HTTP_PORT = 443
DOMAIN = source.keplerops.test
ROOT_URL = https://source.keplerops.test/
LOCAL_ROOT_URL = https://source.keplerops.test/
CERT_FILE = /tmp/fieldkest.crt
KEY_FILE = /tmp/fieldkest.key
DISABLE_SSH = false
START_SSH_SERVER = true
SSH_DOMAIN = source.keplerops.test
SSH_LISTEN_PORT = 22
SSH_PORT = 22
SSH_ROOT_PATH = /var/lib/gitea/data/.ssh

[database]
DB_TYPE = sqlite3
PATH = /var/lib/gitea/data/gitea.db

[repository]
ROOT = /var/lib/gitea/repositories/native

[security]
INSTALL_LOCK = true

[oauth2]
JWT_SIGNING_ALGORITHM = HS256

[service]
DISABLE_REGISTRATION = true
REQUIRE_SIGNIN_VIEW = true

[log]
MODE = console
LEVEL = Error
