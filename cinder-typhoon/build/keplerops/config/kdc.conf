[kdcdefaults]
 kdc_ports = 88
 kdc_tcp_ports = 88

[realms]
 KEPLEROPS.TEST = {
  database_name = /var/lib/keplerops-identity/krb5kdc/principal
  key_stash_file = /var/lib/keplerops-identity/krb5kdc/.k5.KEPLEROPS.TEST
  acl_file = /etc/krb5kdc/kadm5.acl
  max_life = 10h
  max_renewable_life = 7d
  default_principal_flags = +preauth
  supported_enctypes = aes256-cts-hmac-sha1-96:normal aes128-cts-hmac-sha1-96:normal
 }

[logging]
 kdc = STDERR
