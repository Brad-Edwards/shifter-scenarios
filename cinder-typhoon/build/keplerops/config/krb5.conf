[libdefaults]
 default_realm = KEPLEROPS.TEST
 dns_lookup_kdc = false
 dns_lookup_realm = false
 rdns = false
 forwardable = true
 udp_preference_limit = 1
 ticket_lifetime = 10h

[realms]
 KEPLEROPS.TEST = {
  kdc = identity.keplerops.test:88
 }

[domain_realm]
 .keplerops.test = KEPLEROPS.TEST
 keplerops.test = KEPLEROPS.TEST
