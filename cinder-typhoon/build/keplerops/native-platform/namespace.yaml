apiVersion: v1
kind: Namespace
metadata:
  name: fieldlink
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: v1.37
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: rowan-workspace
  namespace: fieldlink
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: engineering
  namespace: fieldlink
rules:
  - apiGroups: ['']
    resources: [pods, configmaps, secrets, services, persistentvolumeclaims]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: ['']
    resources: [pods/log, events, serviceaccounts]
    verbs: [get, list, watch]
  - apiGroups: [batch]
    resources: [jobs, cronjobs]
    verbs: [get, list, watch, create, update, patch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: rowan-engineering
  namespace: fieldlink
subjects:
  - kind: ServiceAccount
    name: rowan-workspace
    namespace: fieldlink
roleRef:
  kind: Role
  name: engineering
  apiGroup: rbac.authorization.k8s.io
---
# K13.4: svc-fieldlink-workload — the limited workload identity
apiVersion: v1
kind: ServiceAccount
metadata:
  name: svc-fieldlink-workload
  namespace: fieldlink
---
# K13.4: svc-cloud-api — cloud-api's admin identity for token issuance
apiVersion: v1
kind: ServiceAccount
metadata:
  name: svc-cloud-api
  namespace: fieldlink
---
# K13.4: BLD-1842 — the protected build record (real K8s ConfigMap)
# svc-fieldlink-workload can read this via RBAC; other reads are denied.
apiVersion: v1
kind: ConfigMap
metadata:
  name: bld-1842
  namespace: fieldlink
  labels:
    fieldkest.io/kind: build-record
data:
  build_id: BLD-1842
  principal: svc-fieldlink-workload
  workspace: fieldlink-workload
  version: "2026-09-18"
  scope: fieldkest-build-records
---
# K13.4 Role: svc-fieldlink-workload can ONLY get bld-1842
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: workload-build-reader
  namespace: fieldlink
rules:
  - apiGroups: ['']
    resources: [configmaps]
    verbs: [get]
    resourceNames: [bld-1842]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: workload-build-reader
  namespace: fieldlink
subjects:
  - kind: ServiceAccount
    name: svc-fieldlink-workload
    namespace: fieldlink
roleRef:
  kind: Role
  name: workload-build-reader
  apiGroup: rbac.authorization.k8s.io
---
# K13.4 ClusterRole: svc-cloud-api can issue tokens for any SA
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cloud-api-token-issuer
rules:
  - apiGroups: ['']
    resources: [serviceaccounts/token]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cloud-api-token-issuer
subjects:
  - kind: ServiceAccount
    name: svc-cloud-api
    namespace: fieldlink
roleRef:
  kind: ClusterRole
  name: cloud-api-token-issuer
  apiGroup: rbac.authorization.k8s.io
---
# K14.1: trust record for svc-fieldlink-workload.
# The issuer, subject, and audiences are derived from the real K3s SA token claims.
# The export_role names the K14.2 scope boundary.
apiVersion: v1
kind: ConfigMap
metadata:
  name: trust-flx-04
  namespace: fieldlink
  labels:
    fieldkest.io/kind: trust-record
data:
  trust_id: TRUST-FLX-04
  issuer: https://kubernetes.default.svc.cluster.local
  subject: system:serviceaccount:fieldlink:svc-fieldlink-workload
  accepted_audiences: '["https://kubernetes.default.svc.cluster.local","k3s"]'
  export_role: fieldkest-export-access
  service_ref: fieldkest-exports
  schema: fieldkest.trust-record/v1
---
# K14.1 Role: svc-fieldlink-workload can also read trust-flx-04
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: workload-trust-reader
  namespace: fieldlink
rules:
  - apiGroups: ['']
    resources: [configmaps]
    verbs: [get]
    resourceNames: [trust-flx-04]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: workload-trust-reader
  namespace: fieldlink
subjects:
  - kind: ServiceAccount
    name: svc-fieldlink-workload
    namespace: fieldlink
roleRef:
  kind: Role
  name: workload-trust-reader
  apiGroup: rbac.authorization.k8s.io
