# K13 objects service: TLS terminator for SeaweedFS S3 (fieldlink-objects:8333).
# This is a transparent TLS proxy — the participant uses the real S3 XML API.
# The fieldkest-workspaces bucket has an anonymous read ACL (K13.1 vulnerability).
server {
    listen 443 ssl;
    server_name objects.keplerops.test;
    ssl_certificate /etc/nginx/tls/server.crt;
    ssl_certificate_key /etc/nginx/tls/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    # Pass all S3 requests (XML API) through to SeaweedFS
    location / {
        proxy_pass http://fieldlink-objects:8333;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
    }
}
