# Bounded ARWC integrations only. Upstream applications are in native/.
name: cinder-arwc
services:
  a-connector:
    build:
      context: ../..
      dockerfile: build/arwc/images/connector.Dockerfile
    image: cinder-arwc/a-connector:hand-build
    container_name: cinder-arwc-connector
    hostname: a-connector
    domainname: corporate.arwc.test
    dns:
    - 10.77.60.10
    environment:
      SSL_CERT_FILE: /tmp/arwc-ca-bundle.pem
      REQUESTS_CA_BUNDLE: /tmp/arwc-ca-bundle.pem
      CURL_CA_BUNDLE: /tmp/arwc-ca-bundle.pem
    restart: unless-stopped
    healthcheck:
      test:
      - CMD
      - /usr/local/sbin/arwc-connector-health
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 15s
    read_only: true
    cap_drop:
    - ALL
    cap_add:
    - SETUID
    - SETGID
    - CHOWN
    - FOWNER
    - DAC_OVERRIDE
    security_opt:
    - no-new-privileges:true
    sysctls:
      net.ipv4.ip_unprivileged_port_start: 0
    tmpfs:
    - /tmp:rw,noexec,nosuid,nodev,size=32m,mode=1777
    - /run:rw,nosuid,nodev,size=16m,mode=0755
    volumes:
    - connector-fieldlink:/var/lib/fieldlink-connector
    - connector-customer:/var/lib/arwc-connector
    - ${ARWC_OPERATOR_DIR:-./.operator}/tls/server.crt:/run/arwc-tls/server.crt:ro
    - ${ARWC_OPERATOR_DIR:-./.operator}/tls/server.key:/run/arwc-tls/server.key:ro
    - ${ARWC_OPERATOR_DIR:-./.operator}/handover.key:/run/arwc-handover/authentication.key:ro
    - ${ARWC_OPERATOR_DIR:-./.operator}/tls/ca.crt:/run/arwc-tls/ca.crt:ro
    - ${ARWC_OPERATOR_DIR:-./.operator}/integration/keplerops-ca.crt:/run/arwc-peer/keplerops-ca.crt:ro
    - type: bind
      source: ${ARWC_NATIVE_OPERATOR_DIR:-./native/.operator}/supplier-onboarding.json
      target: /run/arwc-native/supplier-onboarding.json
      read_only: true
      bind:
        create_host_path: false
    - type: bind
      source: ${ARWC_NATIVE_OPERATOR_DIR:-./native/.operator}/ca/certs/root_ca.crt
      target: /run/arwc-native/root-ca.crt
      read_only: true
      bind:
        create_host_path: false
    - type: bind
      source: ${ARWC_OPERATOR_DIR:-./.operator}/archive-workflow/nc-reader.json
      target: /run/arwc-archive/nc-reader.json
      read_only: true
      bind:
        create_host_path: true
    networks:
      corporate:
        ipv4_address: 10.77.60.20
        aliases:
        - a-connector
        - fieldlink.arwc.test
        - customer-handover.arwc.test
      maintenance:
        ipv4_address: 10.77.61.10
  fieldlink-edge:
    build:
      context: ../..
      dockerfile: build/arwc/images/fieldlink-edge.Dockerfile
    image: cinder-arwc/fieldlink-edge:hand-build
    container_name: cinder-arwc-fieldlink-edge
    hostname: fieldlink-edge
    restart: unless-stopped
    read_only: true
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    sysctls:
      net.ipv4.ip_unprivileged_port_start: 0
    depends_on:
    - a-connector
    ports:
    - ${ARWC_CARRIER_ADDRESS:-10.77.59.2}:443:443
    networks:
      corporate:
        ipv4_address: 10.77.60.15
      carrier_transit: {}
  handover-edge:
    image: cinder-arwc/fieldlink-edge:hand-build
    container_name: cinder-arwc-handover-edge
    restart: unless-stopped
    entrypoint:
    - socat
    - TCP4-LISTEN:8443,bind=172.29.63.28,reuseaddr,fork
    - TCP4:10.77.60.20:8443
    read_only: true
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    sysctls:
      net.ipv4.ip_forward: '0'
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    networks:
      corporate:
        ipv4_address: 10.77.60.16
      handover_supervisory:
        ipv4_address: 172.29.63.28
  a-archive:
    build:
      context: ../..
      dockerfile: build/arwc/images/archive.Dockerfile
    image: cinder-arwc/a-archive:hand-build
    container_name: cinder-arwc-archive
    hostname: a-archive
    domainname: corporate.arwc.test
    dns:
    - 10.77.60.10
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "/usr/local/libexec/arwc-handover.py", "health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    read_only: true
    cap_drop:
    - ALL
    cap_add:
    - SETUID
    - SETGID
    - CHOWN
    - FOWNER
    - DAC_OVERRIDE
    security_opt:
    - no-new-privileges:true
    tmpfs:
    - /tmp:rw,noexec,nosuid,nodev,size=32m,mode=1777
    - /run:rw,nosuid,nodev,size=16m,mode=0755
    volumes:
    - arwc-archive-data:/var/lib/arwc-archive
    - arwc-identity-archive-evidence:/run/arwc-identity-evidence:ro
    - connector-fieldlink:/run/arwc-corporate:ro
    - ${ARWC_OPERATOR_DIR:-./.operator}/handover.key:/run/arwc-handover/authentication.key:ro
    - ${ARWC_OPERATOR_DIR:-./.operator}/tls/server.crt:/run/arwc-tls/server.crt:ro
    - ${ARWC_OPERATOR_DIR:-./.operator}/tls/server.key:/run/arwc-tls/server.key:ro
    - ${ARWC_OPERATOR_DIR:-./.operator}/tls/ca.crt:/run/arwc-tls/ca.crt:ro
    - ${ARWC_OPERATOR_DIR:-./.operator}/tls/archive-ca.crt:/run/arwc-tls/archive-ca.crt:ro
    - ${ARWC_OPERATOR_DIR:-./.operator}/tls/archive-ca.key:/run/arwc-tls/archive-ca.key:ro
    - type: bind
      source: ${ARWC_NATIVE_OPERATOR_DIR:-./native/.operator}/ca/certs/root_ca.crt
      target: /run/arwc-step-ca/root.crt
      read_only: true
      bind:
        create_host_path: false
    - type: bind
      source: ${ARWC_NATIVE_OPERATOR_DIR:-./native/.operator}/ca/certs/intermediate_ca.crt
      target: /run/arwc-step-ca/intermediate.crt
      read_only: true
      bind:
        create_host_path: false
    - type: bind
      source: ${ARWC_OPERATOR_DIR:-./.operator}/archive-workflow/tokens
      target: /run/arwc-tokens
      read_only: true
      bind:
        create_host_path: true
    - ${ARWC_OPERATOR_DIR:-./.operator}/archive-workflow:/run/arwc-archive-workflow:ro
    - type: bind
      source: ${ARWC_NATIVE_OPERATOR_DIR:-./native/.operator}/ca/certs/root_ca.crt
      target: /run/arwc-native/root-ca.crt
      read_only: true
      bind:
        create_host_path: false
    - type: bind
      source: ${ARWC_OPERATOR_DIR:-./.operator}/archive-workflow/db-reader.json
      target: /run/arwc-archive-workflow/db-reader.json
      read_only: true
      bind:
        create_host_path: true
    - type: bind
      source: ${ARWC_OPERATOR_DIR:-./.operator}/archive-workflow/gitea-reader.json
      target: /run/arwc-archive-workflow/gitea-reader.json
      read_only: true
      bind:
        create_host_path: true
    - type: bind
      source: ${ARWC_OPERATOR_DIR:-./.operator}/archive-workflow/nadia-metabase.json
      target: /run/arwc-planning/nadia-metabase.json
      read_only: true
      bind:
        create_host_path: true
    - arwc-planning-evidence:/run/arwc-planning-evidence
    - type: bind
      source: ${ARWC_NATIVE_OPERATOR_DIR:-./native/.operator}/retained-tools/files/instruments/IMG-FIT-204-R6.bin
      target: /run/arwc-instruments/IMG-FIT-204-R6.bin
      read_only: true
      bind:
        create_host_path: false
    networks:
      corporate:
        ipv4_address: 10.77.60.50
        aliases:
        - a-archive
        - retained-archive.arwc.test
      archive_db:
        aliases:
        - a-archive
  a-data-bridge:
    build:
      context: ../..
      dockerfile: build/arwc/images/data-bridge.Dockerfile
    image: cinder-arwc/a-data-bridge:hand-build
    container_name: cinder-arwc-data-bridge
    hostname: a-data-bridge
    domainname: dmz.arwc.test
    restart: unless-stopped
    read_only: true
    cap_drop:
    - ALL
    cap_add:
    - SETUID
    - SETGID
    - CHOWN
    - FOWNER
    - DAC_OVERRIDE
    security_opt:
    - no-new-privileges:true
    sysctls:
      net.ipv4.ip_forward: '0'
      net.ipv4.ip_unprivileged_port_start: 0
    tmpfs:
    - /tmp:rw,noexec,nosuid,nodev,size=32m,mode=1777
    - /run:rw,nosuid,nodev,size=16m,mode=0755
    volumes:
    - ${ARWC_OPERATOR_DIR:-./.operator}/tls/server.crt:/run/arwc-tls/server.crt:ro
    - ${ARWC_OPERATOR_DIR:-./.operator}/tls/server.key:/run/arwc-tls/server.key:ro
    - ${ARWC_OPERATOR_DIR:-./.operator}/tls/ca.crt:/run/arwc-tls/ca.crt:ro
    networks:
      dmz:
        ipv4_address: 10.77.62.20
        aliases:
        - a-data-bridge
        - integration-gateway.arwc.test
      native_api_exchange:
        ipv4_address: 172.29.69.5
  a-data:
    build:
      context: ../..
      dockerfile: build/arwc/images/data.Dockerfile
    image: cinder-arwc/a-data:hand-build
    container_name: cinder-arwc-data
    hostname: a-data
    domainname: corporate.arwc.test
    dns:
    - 10.77.60.10
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "/usr/local/libexec/arwc-handover.py", "health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    cap_drop:
    - ALL
    cap_add:
    - SETUID
    - SETGID
    - CHOWN
    - FOWNER
    - DAC_OVERRIDE
    - NET_BIND_SERVICE
    - KILL
    security_opt:
    - no-new-privileges:false
    tmpfs:
    - /tmp:rw,noexec,nosuid,nodev,size=32m,mode=1777
    - /run:rw,nosuid,nodev,size=64m,mode=0755
    volumes:
    - arwc-data-data:/var/lib/arwc-data
    - connector-fieldlink:/run/arwc-corporate:ro
    - ${ARWC_OPERATOR_DIR:-./.operator}/handover.key:/run/arwc-handover/authentication.key:ro
    - ${ARWC_OPERATOR_DIR:-./.operator}/tls/server.crt:/run/arwc-tls/server.crt:ro
    - ${ARWC_OPERATOR_DIR:-./.operator}/tls/server.key:/run/arwc-tls/server.key:ro
    - ${ARWC_OPERATOR_DIR:-./.operator}/tls/ca.crt:/run/arwc-tls/ca.crt:ro
    - arwc-planning-evidence:/run/arwc-planning-evidence
    - type: bind
      source: ${ARWC_OPERATOR_DIR:-./.operator}/archive-workflow/reports-state.json
      target: /run/arwc-reports-state.json
      read_only: true
      bind:
        create_host_path: true
    - type: bind
      source: ${ARWC_OPERATOR_DIR:-./.operator}/archive-workflow/ot-operating-reader.json
      target: /run/arwc-ot-reader.json
      read_only: true
      bind:
        create_host_path: true
    environment:
    - PGDATA=/run/arwc-pgdata
    networks:
      corporate:
        ipv4_address: 10.77.60.51
        aliases:
        - a-data
        - planning-data.arwc.test
  a-identity:
    build:
      context: ../..
      dockerfile: build/arwc/images/identity.Dockerfile
    image: cinder-arwc/a-identity:hand-build
    container_name: cinder-arwc-identity
    hostname: a-identity
    domainname: corporate.arwc.test
    dns:
    - 10.77.60.10
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "/usr/local/libexec/arwc-handover.py", "health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    read_only: true
    cap_drop:
    - ALL
    cap_add:
    - SETUID
    - SETGID
    - CHOWN
    - FOWNER
    - DAC_OVERRIDE
    security_opt:
    - no-new-privileges:true
    sysctls:
      net.ipv4.ip_unprivileged_port_start: 0
    tmpfs:
    - /tmp:rw,noexec,nosuid,nodev,size=32m,mode=1777
    - /run:rw,nosuid,nodev,size=16m,mode=0755
    volumes:
    - arwc-identity-state:/var/lib/arwc-identity
    - arwc-identity-planning:/var/lib/arwc-identity/planning
    - arwc-identity-archive-evidence:/var/lib/arwc-identity/archive
    - arwc-archive-handover:/run/arwc-archive-evidence:ro
    - connector-fieldlink:/run/arwc-corporate:ro
    - ${ARWC_OPERATOR_DIR:-./.operator}/tls/server.crt:/run/arwc-tls/server.crt:ro
    - ${ARWC_OPERATOR_DIR:-./.operator}/tls/server.key:/run/arwc-tls/server.key:ro
    - ${ARWC_OPERATOR_DIR:-./.operator}/handover.key:/run/arwc-handover/authentication.key:ro
    - ${ARWC_OPERATOR_DIR:-./.operator}/tls/ca.crt:/run/arwc-tls/ca.crt:ro
    networks:
      corporate:
        ipv4_address: 10.77.60.60
        aliases:
        - a-identity
        - corporate-identity.arwc.test
  a-approval:
    build:
      context: ../..
      dockerfile: build/arwc/images/approval.Dockerfile
    image: cinder-arwc/a-approval:hand-build
    container_name: cinder-arwc-approval
    hostname: a-approval
    domainname: corporate.arwc.test
    dns:
    - 10.77.60.10
    restart: unless-stopped
    read_only: true
    cap_drop:
    - ALL
    cap_add:
    - SETUID
    - SETGID
    - CHOWN
    - FOWNER
    - DAC_OVERRIDE
    - NET_BIND_SERVICE
    security_opt:
    - no-new-privileges:true
    tmpfs:
    - /tmp:rw,noexec,nosuid,nodev,size=512m,mode=1777
    - /run:rw,nosuid,nodev,size=16m,mode=0755
    volumes:
    - arwc-approval-data:/var/lib/arwc-approval
    - arwc-contractors-data:/var/lib/arwc-contractors
    - contractor-session:/var/lib/arwc-contractors/handover:ro
    - connector-fieldlink:/run/arwc-corporate:ro
    - ${ARWC_OPERATOR_DIR:-./.operator}/tls/server.crt:/run/arwc-tls/server.crt:ro
    - ${ARWC_OPERATOR_DIR:-./.operator}/tls/server.key:/run/arwc-tls/server.key:ro
    - ${ARWC_OPERATOR_DIR:-./.operator}/tls/ca.crt:/run/arwc-tls/ca.crt:ro
    - type: bind
      source: ${ARWC_OPERATOR_DIR:-./.operator}/approval-nc.json
      target: /run/arwc-approval-config/nc-reader.json
      read_only: true
      bind:
        create_host_path: true
    - type: bind
      source: ${ARWC_OPERATOR_DIR:-./.operator}/approval-erp.json
      target: /run/arwc-approval-config/erp-reader.json
      read_only: true
      bind:
        create_host_path: true
    - type: bind
      source: ${ARWC_NATIVE_OPERATOR_DIR:-./native/.operator}/ca/certs/root_ca.crt
      target: /run/arwc-native/root-ca.crt
      read_only: true
      bind:
        create_host_path: false
    networks:
      corporate:
        ipv4_address: 10.77.60.53
        aliases:
        - a-approval
        - maintenance-review.arwc.test
  a-contractors:
    build:
      context: ../..
      dockerfile: build/arwc/images/contractors.Dockerfile
    image: cinder-arwc/a-contractors:hand-build
    container_name: cinder-arwc-contractors
    hostname: a-contractors
    domainname: corporate.arwc.test
    dns:
    - 10.77.60.10
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "/usr/local/libexec/arwc-handover.py", "health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    read_only: true
    cap_drop:
    - ALL
    cap_add:
    - SETUID
    - SETGID
    - CHOWN
    - FOWNER
    - DAC_OVERRIDE
    - NET_BIND_SERVICE
    security_opt:
    - no-new-privileges:true
    tmpfs:
    - /tmp:rw,noexec,nosuid,nodev,size=16m,mode=1777
    - /run:rw,nosuid,nodev,size=8m,mode=0755
    volumes:
    - arwc-contractors-data:/var/lib/arwc-contractors
    - contractor-session:/var/lib/arwc-contractors/handover
    - connector-fieldlink:/run/arwc-corporate:ro
    - ${ARWC_OPERATOR_DIR:-./.operator}/handover.key:/run/arwc-handover/authentication.key:ro
    - ${ARWC_OPERATOR_DIR:-./.operator}/tls/server.crt:/run/arwc-tls/server.crt:ro
    - ${ARWC_OPERATOR_DIR:-./.operator}/tls/server.key:/run/arwc-tls/server.key:ro
    - ${ARWC_OPERATOR_DIR:-./.operator}/tls/ca.crt:/run/arwc-tls/ca.crt:ro
    - type: bind
      source: ${ARWC_OPERATOR_DIR:-./.operator}/contractors-erp.json
      target: /run/arwc-contractors-config/erp-reader.json
      read_only: true
      bind:
        create_host_path: true
    - type: bind
      source: ${ARWC_OPERATOR_DIR:-./.operator}/contractors-nc.json
      target: /run/arwc-contractors-config/nc-reader.json
      read_only: true
      bind:
        create_host_path: true
    - type: bind
      source: ${ARWC_OPERATOR_DIR:-./.operator}/archive-workflow/ot-operating-reader.json
      target: /run/arwc-contractors-config/ot-reader.json
      read_only: true
      bind:
