name: cinder-arwc

services:
  a-connector:
    build:
      context: ../..
      dockerfile: build/arwc/images/connector.Dockerfile
    image: cinder-arwc/a-connector:hand-build
    container_name: cinder-arwc-connector
    hostname: a-connector
    domainname: corporate.arwc.test
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    cap_add: [SETUID, SETGID, CHOWN, FOWNER, DAC_OVERRIDE]
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=32m,mode=1777
      - /run:rw,nosuid,nodev,size=16m,mode=0755
    volumes:
      - connector-fieldlink:/var/lib/fieldlink-connector
      - connector-customer:/var/lib/arwc-connector
      - ${ARWC_OPERATOR_DIR:-./.operator}/tls/server.crt:/run/arwc-tls/server.crt:ro
      - ${ARWC_OPERATOR_DIR:-./.operator}/tls/server.key:/run/arwc-tls/server.key:ro
      - ${ARWC_OPERATOR_DIR:-./.operator}/tls/ca.crt:/run/arwc-tls/ca.crt:ro
    networks:
      corporate:
        ipv4_address: 10.77.60.20
        aliases:
          - a-connector
          - fieldlink.arwc.test
          - customer-handover.arwc.test
      maintenance:
        ipv4_address: 10.77.61.10

  a-business:
    build:
      context: ../..
      dockerfile: build/arwc/images/business.Dockerfile
    image: cinder-arwc/a-business:hand-build
    container_name: cinder-arwc-business
    hostname: a-business
    domainname: corporate.arwc.test
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    cap_add: [SETUID, SETGID, CHOWN, FOWNER, DAC_OVERRIDE]
    security_opt:
      - no-new-privileges:true
    sysctls:
      net.ipv4.ip_unprivileged_port_start: 0
    depends_on: [a-connector]
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=32m,mode=1777
      - /run:rw,nosuid,nodev,size=16m,mode=0755
    volumes:
      - business-state:/var/lib/arwc-business
      - business-archive-evidence:/var/lib/arwc-business/archive
      - business-integration-evidence:/var/lib/arwc-business/integration
      - business-relation-evidence:/var/lib/arwc-business/relation
      - connector-fieldlink:/run/arwc-corporate:ro
      - ${ARWC_OPERATOR_DIR:-./.operator}/tls/server.crt:/run/arwc-tls/server.crt:ro
      - ${ARWC_OPERATOR_DIR:-./.operator}/tls/server.key:/run/arwc-tls/server.key:ro
      - ${ARWC_OPERATOR_DIR:-./.operator}/tls/ca.crt:/run/arwc-tls/ca.crt:ro
    networks:
      corporate:
        ipv4_address: 10.77.60.30
        aliases:
          - a-business
          - business-workplace.arwc.test

  a-data:
    build:
      context: ../..
      dockerfile: build/arwc/images/data.Dockerfile
    image: cinder-arwc/a-data:hand-build
    container_name: cinder-arwc-data
    hostname: a-data
    domainname: corporate.arwc.test
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    cap_add: [SETUID, SETGID, CHOWN, FOWNER, DAC_OVERRIDE]
    security_opt:
      - no-new-privileges:true
    sysctls:
      net.ipv4.ip_unprivileged_port_start: 0
    environment:
      PGDATA: /var/lib/postgresql/data/pgdata
    depends_on: [a-connector, a-identity]
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777
      - /run:rw,nosuid,nodev,size=16m,mode=0755
      - /var/run/postgresql:rw,nosuid,nodev,size=16m,mode=2775
    volumes:
      - data-state:/var/lib/arwc-data
      - data-postgresql:/var/lib/postgresql/data
      - data-integration-evidence:/var/lib/arwc-data/integration
      - data-archive-evidence:/var/lib/arwc-data/archive
      - business-relation-evidence:/run/arwc-business-relation:ro
      - identity-planning:/run/arwc-planning-evidence:ro
      - connector-fieldlink:/run/arwc-corporate:ro
      - ${ARWC_OPERATOR_DIR:-./.operator}/tls/server.crt:/run/arwc-tls/server.crt:ro
      - ${ARWC_OPERATOR_DIR:-./.operator}/tls/server.key:/run/arwc-tls/server.key:ro
      - ${ARWC_OPERATOR_DIR:-./.operator}/tls/ca.crt:/run/arwc-tls/ca.crt:ro
    networks:
      corporate:
        ipv4_address: 10.77.60.40
        aliases:
          - a-data
          - planning-data.arwc.test
          - process-view.arwc.test
      dmz:
