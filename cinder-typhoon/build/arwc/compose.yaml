    - type: bind
      source: ${ARWC_NATIVE_OPERATOR_DIR:-./native/.operator}/ca/certs/root_ca.crt
      target: /run/arwc-native/root-ca.crt
      read_only: true
      bind:
        create_host_path: false
    networks:
      corporate:
        ipv4_address: 10.77.60.52
        aliases:
        - a-contractors
        - contractor-portal.arwc.test

  a-business:
    build:
      context: ../..
      dockerfile: build/arwc/images/business.Dockerfile
    image: cinder-arwc/a-business:hand-build
    container_name: cinder-arwc-business
    hostname: a-business
    domainname: corporate.arwc.test
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "/usr/local/libexec/arwc-handover.py", "health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    read_only: true
    cap_drop: [ALL]
    cap_add: [SETUID, SETGID, CHOWN, FOWNER, DAC_OVERRIDE]
    security_opt:
      - no-new-privileges:true
    sysctls:
      net.ipv4.ip_unprivileged_port_start: 0
    depends_on: [a-connector]
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=32m,mode=1777
      - /run:rw,nosuid,nodev,size=16m,mode=0755
    volumes:
      - business-state:/var/lib/arwc-business
      - business-archive-evidence:/var/lib/arwc-business/archive
      - business-integration-evidence:/var/lib/arwc-business/integration
      - business-relation-evidence:/var/lib/arwc-business/relation
      - connector-fieldlink:/run/arwc-corporate:ro
      - ${ARWC_OPERATOR_DIR:-./.operator}/tls/server.crt:/run/arwc-tls/server.crt:ro
      - ${ARWC_OPERATOR_DIR:-./.operator}/tls/server.key:/run/arwc-tls/server.key:ro
      - ${ARWC_OPERATOR_DIR:-./.operator}/handover.key:/run/arwc-handover/authentication.key:ro
      - ${ARWC_OPERATOR_DIR:-./.operator}/tls/ca.crt:/run/arwc-tls/ca.crt:ro
    networks:
      corporate:
        ipv4_address: 10.77.60.30
        aliases:
          - a-business
          - business-workplace.arwc.test

  a-contractor-bridge:
    build:
      context: ../..
      dockerfile: build/arwc/images/contractor-bridge.Dockerfile
    image: cinder-arwc/a-contractor-bridge:hand-build
    container_name: cinder-arwc-contractor-bridge
    hostname: a-contractor-bridge
    domainname: dmz.arwc.test
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    cap_add: [SETUID, SETGID, CHOWN, FOWNER, DAC_OVERRIDE]
    security_opt:
      - no-new-privileges:true
    sysctls:
      net.ipv4.ip_unprivileged_port_start: 0
    depends_on:
      a-contractors:
        condition: service_healthy
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=32m,mode=1777
      - /run:rw,nosuid,nodev,size=16m,mode=0755
    volumes:
      - contractor-bridge-state:/var/lib/arwc-contractor-bridge
      - contractor-session:/run/arwc-field-session:ro
      - ot-read-evidence:/var/lib/arwc-contractor-bridge/handover
      - ${ARWC_OPERATOR_DIR:-./.operator}/tls/server.crt:/run/arwc-tls/server.crt:ro
      - ${ARWC_OPERATOR_DIR:-./.operator}/tls/server.key:/run/arwc-tls/server.key:ro
      - ${ARWC_OPERATOR_DIR:-./.operator}/tls/ca.crt:/run/arwc-tls/ca.crt:ro
    networks:
      corporate:
        ipv4_address: 10.77.60.31
        aliases:
          - field-gateway.arwc.test
          - process-read.arwc.test
      dmz:
        ipv4_address: 10.77.62.30
        aliases:
          - a-contractor-bridge
          - field-gateway.arwc.test
          - process-read.arwc.test
      engineering: {}

  a-control-broker:
    build:
      context: ../..
      dockerfile: build/arwc/images/control-broker.Dockerfile
    image: cinder-arwc/a-control-broker:hand-build
    container_name: cinder-arwc-control-broker
    hostname: a-control-broker
    domainname: dmz.arwc.test
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    cap_add: [SETUID, SETGID, CHOWN, FOWNER, DAC_OVERRIDE]
    security_opt: [no-new-privileges:true]
    sysctls: {net.ipv4.ip_unprivileged_port_start: 0}
    depends_on: [a-renderer]
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=32m,mode=1777
      - /run:rw,nosuid,nodev,size=16m,mode=0755
    volumes:
      - control-broker-state:/var/lib/arwc-control-broker
      - contractor-session:/run/arwc-field-session:ro
      - approval-evidence:/run/arwc-approval-evidence:ro
      - renderer-evidence:/run/arwc-renderer-evidence:ro
      - control-issuer:/run/arwc
      - control-authority-evidence:/var/lib/arwc-control-broker/authority
      - ${ARWC_OPERATOR_DIR:-./.operator}/tls/server.crt:/run/arwc-tls/server.crt:ro
      - ${ARWC_OPERATOR_DIR:-./.operator}/tls/server.key:/run/arwc-tls/server.key:ro
    networks:
      dmz:
        ipv4_address: 10.77.62.40
        aliases: [a-control-broker, control-broker.arwc.test]
      # Corporate clients (for example the connector) reach the broker through
      # control-broker.arwc.test, which resolves to corporate 10.77.60.57. Without
      # this attachment that address is dead. The DMZ address (10.77.62.40) stays
      # on a separate interface, so a corporate client still cannot reach the DMZ
      # IP directly (test_w26 asserts that); it uses the corporate .57 instead.
      corporate:
        ipv4_address: 10.77.60.57
        aliases: [a-control-broker, control-broker.arwc.test]

  a-diagnostics:
    build:
      context: ../..
      dockerfile: build/arwc/images/diagnostics.Dockerfile
    image: cinder-arwc/a-diagnostics:hand-build
    container_name: cinder-arwc-diagnostics
    hostname: a-diagnostics
    domainname: a-engineering.arwc.test
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    cap_add: [SETUID, SETGID, CHOWN, FOWNER, DAC_OVERRIDE]
    security_opt: [no-new-privileges:true]
    sysctls: {net.ipv4.ip_unprivileged_port_start: 0}
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=32m,mode=1777
      - /run:rw,nosuid,nodev,size=16m,mode=0755
    volumes:
      - diagnostics-state:/var/lib/arwc-diagnostics
      - engineering-state:/run/arwc-engineering:ro
      - ${ARWC_OPERATOR_DIR:-./.operator}/tls/server.crt:/run/arwc-tls/server.crt:ro
      - ${ARWC_OPERATOR_DIR:-./.operator}/tls/server.key:/run/arwc-tls/server.key:ro
      - ${ARWC_OPERATOR_DIR:-./.operator}/tls/ca.crt:/run/arwc-tls/ca.crt:ro
    networks:
      engineering:
        ipv4_address: 10.77.63.50
        aliases: [a-diagnostics, diagnostic-services.arwc.test]

  a-engineering:
    build:
      context: ../..
      dockerfile: build/arwc/images/engineering.Dockerfile
    image: cinder-arwc/a-engineering:hand-build
    container_name: cinder-arwc-engineering
    hostname: process-view
    domainname: arwc.test
    dns:
    - 10.77.60.10
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    cap_add: [SETUID, SETGID, CHOWN, FOWNER, DAC_OVERRIDE]
    sysctls: {net.ipv4.ip_unprivileged_port_start: 0}
    environment:
      ARWC_PROCESS_ROLE: engineering
      ARWC_SERVICE_USER: arwc-engineering
      ARWC_STATE_ROOT: /var/lib/arwc-engineering
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=32m,mode=1777
      - /run:rw,nosuid,nodev,size=16m,mode=0755
    volumes:
      - engineering-state:/var/lib/arwc-engineering
      - process-evidence:/run/arwc-process-evidence
      - control-issuer:/run/arwc
      - connector-fieldlink:/run/arwc-corporate:ro
      - ${ARWC_OPERATOR_DIR:-./.operator}/handover.key:/run/arwc-handover/authentication.key:ro
      - ${ARWC_OPERATOR_DIR:-./.operator}/tls/server.crt:/run/arwc-tls/server.crt:ro
      - ${ARWC_OPERATOR_DIR:-./.operator}/tls/server.key:/run/arwc-tls/server.key:ro
      - ${ARWC_OPERATOR_DIR:-./.operator}/tls/ca.crt:/run/arwc-tls/ca.crt:ro
    networks:
      engineering:
        ipv4_address: 10.77.63.40
        aliases: [a-engineering, engineering-workbench.arwc.test]
      corporate:
        ipv4_address: 10.77.60.55
        aliases: [a-engineering]
      handover_supervisory:
        ipv4_address: 172.29.63.9
        aliases: [a-engineering, process-view.arwc.test]

  a-instruments:
    build:
      context: ../..
      dockerfile: build/arwc/images/instruments.Dockerfile
    image: cinder-arwc/a-instruments:hand-build
    container_name: cinder-arwc-instruments
    hostname: a-instruments
    domainname: a-control.arwc.test
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    cap_add: [SETUID, SETGID, CHOWN, FOWNER, DAC_OVERRIDE]
    security_opt: [no-new-privileges:true]
    sysctls: {net.ipv4.ip_unprivileged_port_start: 0}
    environment:
      ARWC_PROCESS_ROLE: instruments
      ARWC_SERVICE_USER: arwc-instruments
      ARWC_STATE_ROOT: /var/lib/arwc-instruments
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=32m,mode=1777
      - /run:rw,nosuid,nodev,size=16m,mode=0755
    volumes:
      - instruments-state:/var/lib/arwc-instruments
      - process-evidence:/run/arwc-process-evidence
      - ${ARWC_OPERATOR_DIR:-./.operator}/tls/server.crt:/run/arwc-tls/server.crt:ro
      - ${ARWC_OPERATOR_DIR:-./.operator}/tls/server.key:/run/arwc-tls/server.key:ro
      - ${ARWC_OPERATOR_DIR:-./.operator}/tls/ca.crt:/run/arwc-tls/ca.crt:ro
    networks:
      control:
        ipv4_address: 10.77.64.40
        aliases: [a-instruments, independent-instruments.arwc.test]
      engineering: {}
      # a-engineering (process-view) proxies firmware-image and maintenance-record
      # requests to the instruments owner at corporate 10.77.60.56 (OWNERS in
      # process_services.py; planning_data.py also treats .56 as the instruments
      # source). Without this corporate attachment that address is dead and W20
      # times out. The attachment is declarative, so it survives a recreate.
      corporate:
        ipv4_address: 10.77.60.56
        aliases: [a-instruments, independent-instruments.arwc.test]

  a-renderer:
    build:
      context: ../..
      dockerfile: build/arwc/images/renderer.Dockerfile
    image: cinder-arwc/a-renderer:hand-build
    container_name: cinder-arwc-renderer
    hostname: a-renderer
    domainname: maintenance.arwc.test
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    cap_add: [SETUID, SETGID, CHOWN, FOWNER, DAC_OVERRIDE]
    security_opt: [no-new-privileges:true]
    sysctls: {net.ipv4.ip_unprivileged_port_start: 0}
    depends_on:
      a-approval:
        condition: service_started
      a-contractors:
        condition: service_healthy
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=32m,mode=1777
      - /run:rw,nosuid,nodev,size=16m,mode=0755
    volumes:
      - renderer-state:/var/lib/arwc-renderer
      - renderer-evidence:/var/lib/arwc-renderer/handover
      - contractor-session:/run/arwc-field-session:ro
      - approval-evidence:/run/arwc-approval-evidence:ro
      - ${ARWC_OPERATOR_DIR:-./.operator}/tls/server.crt:/run/arwc-tls/server.crt:ro
      - ${ARWC_OPERATOR_DIR:-./.operator}/tls/server.key:/run/arwc-tls/server.key:ro
    networks:
      maintenance:
        ipv4_address: 10.77.61.40
        aliases: [a-renderer, maintenance-renderer.arwc.test]


