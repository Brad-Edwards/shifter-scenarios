name: cinder-arwc

services:
  a-connector:
    build:
      context: ../..
      dockerfile: build/arwc/images/connector.Dockerfile
    image: cinder-arwc/a-connector:hand-build
    container_name: cinder-arwc-connector
    hostname: a-connector
    domainname: corporate.arwc.test
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    cap_add: [SETUID, SETGID, CHOWN, FOWNER, DAC_OVERRIDE]
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=32m,mode=1777
      - /run:rw,nosuid,nodev,size=16m,mode=0755
    volumes:
      - connector-fieldlink:/var/lib/fieldlink-connector
      - connector-customer:/var/lib/arwc-connector
      - ${ARWC_OPERATOR_DIR:-./.operator}/tls/server.crt:/run/arwc-tls/server.crt:ro
      - ${ARWC_OPERATOR_DIR:-./.operator}/tls/server.key:/run/arwc-tls/server.key:ro
      - ${ARWC_OPERATOR_DIR:-./.operator}/tls/ca.crt:/run/arwc-tls/ca.crt:ro
    networks:
      corporate:
        ipv4_address: 10.77.60.20
        aliases:
          - a-connector
          - fieldlink.arwc.test
          - customer-handover.arwc.test

  a-business:
    build:
      context: ../..
      dockerfile: build/arwc/images/business.Dockerfile
    image: cinder-arwc/a-business:hand-build
    container_name: cinder-arwc-business
    hostname: a-business
    domainname: corporate.arwc.test
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    cap_add: [SETUID, SETGID, CHOWN, FOWNER, DAC_OVERRIDE]
    security_opt:
      - no-new-privileges:true
    sysctls:
      net.ipv4.ip_unprivileged_port_start: 0
    depends_on: [a-connector]
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=32m,mode=1777
      - /run:rw,nosuid,nodev,size=16m,mode=0755
    volumes:
      - business-state:/var/lib/arwc-business
      - business-archive-evidence:/var/lib/arwc-business/archive
      - business-integration-evidence:/var/lib/arwc-business/integration
      - business-relation-evidence:/var/lib/arwc-business/relation
      - connector-fieldlink:/run/arwc-corporate:ro
      - ${ARWC_OPERATOR_DIR:-./.operator}/tls/server.crt:/run/arwc-tls/server.crt:ro
      - ${ARWC_OPERATOR_DIR:-./.operator}/tls/server.key:/run/arwc-tls/server.key:ro
      - ${ARWC_OPERATOR_DIR:-./.operator}/tls/ca.crt:/run/arwc-tls/ca.crt:ro
    networks:
      corporate:
        ipv4_address: 10.77.60.30
        aliases:
          - a-business
          - business-workplace.arwc.test

  a-data:
    build:
      context: ../..
      dockerfile: build/arwc/images/data.Dockerfile
    image: cinder-arwc/a-data:hand-build
    container_name: cinder-arwc-data
    hostname: a-data
    domainname: corporate.arwc.test
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    cap_add: [SETUID, SETGID, CHOWN, FOWNER, DAC_OVERRIDE]
    security_opt:
      - no-new-privileges:true
    sysctls:
      net.ipv4.ip_unprivileged_port_start: 0
    environment:
      PGDATA: /var/lib/postgresql/data/pgdata
    depends_on: [a-connector, a-identity]
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777
      - /run:rw,nosuid,nodev,size=16m,mode=0755
      - /var/run/postgresql:rw,nosuid,nodev,size=16m,mode=2775
    volumes:
      - data-state:/var/lib/arwc-data
      - data-postgresql:/var/lib/postgresql/data
      - data-integration-evidence:/var/lib/arwc-data/integration
      - data-archive-evidence:/var/lib/arwc-data/archive
      - business-relation-evidence:/run/arwc-business-relation:ro
      - identity-planning:/run/arwc-planning-evidence:ro
      - connector-fieldlink:/run/arwc-corporate:ro
      - ${ARWC_OPERATOR_DIR:-./.operator}/tls/server.crt:/run/arwc-tls/server.crt:ro
      - ${ARWC_OPERATOR_DIR:-./.operator}/tls/server.key:/run/arwc-tls/server.key:ro
      - ${ARWC_OPERATOR_DIR:-./.operator}/tls/ca.crt:/run/arwc-tls/ca.crt:ro
    networks:
      corporate:
        ipv4_address: 10.77.60.40
        aliases:
          - a-data
          - planning-data.arwc.test
      dmz:
        ipv4_address: 10.77.62.10

  a-archive:
    build:
      context: ../..
      dockerfile: build/arwc/images/archive.Dockerfile
    image: cinder-arwc/a-archive:hand-build
    container_name: cinder-arwc-archive
    hostname: a-archive
    domainname: corporate.arwc.test
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    cap_add: [SETUID, SETGID, CHOWN, FOWNER, DAC_OVERRIDE]
    security_opt:
      - no-new-privileges:true
    sysctls:
      net.ipv4.ip_unprivileged_port_start: 0
    depends_on: [a-connector]
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777
      - /run:rw,nosuid,nodev,size=16m,mode=0755
    volumes:
      - archive-state:/var/lib/arwc-archive
      - archive-handover:/var/lib/arwc-archive/handover
      - business-archive-evidence:/run/arwc-business-evidence:ro
      - identity-archive-evidence:/run/arwc-identity-evidence:ro
      - data-archive-evidence:/run/arwc-data-evidence:ro
      - connector-fieldlink:/run/arwc-corporate:ro
      - ${ARWC_OPERATOR_DIR:-./.operator}/tls/server.crt:/run/arwc-tls/server.crt:ro
      - ${ARWC_OPERATOR_DIR:-./.operator}/tls/server.key:/run/arwc-tls/server.key:ro
      - ${ARWC_OPERATOR_DIR:-./.operator}/tls/archive-ca.crt:/run/arwc-tls/archive-ca.crt:ro
      - ${ARWC_OPERATOR_DIR:-./.operator}/tls/archive-ca.key:/run/arwc-tls/archive-ca.key:ro
    networks:
      corporate:
        ipv4_address: 10.77.60.50
        aliases:
          - a-archive
          - retained-archive.arwc.test

  a-identity:
    build:
      context: ../..
      dockerfile: build/arwc/images/identity.Dockerfile
    image: cinder-arwc/a-identity:hand-build
    container_name: cinder-arwc-identity
    hostname: a-identity
    domainname: corporate.arwc.test
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    cap_add: [SETUID, SETGID, CHOWN, FOWNER, DAC_OVERRIDE]
    security_opt:
      - no-new-privileges:true
    sysctls:
      net.ipv4.ip_unprivileged_port_start: 0
    depends_on: [a-connector, a-archive]
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=32m,mode=1777
      - /run:rw,nosuid,nodev,size=16m,mode=0755
    volumes:
      - identity-state:/var/lib/arwc-identity
      - identity-planning:/var/lib/arwc-identity/planning
      - identity-archive-evidence:/var/lib/arwc-identity/archive
      - archive-handover:/run/arwc-archive-evidence:ro
      - connector-fieldlink:/run/arwc-corporate:ro
      - ${ARWC_OPERATOR_DIR:-./.operator}/tls/server.crt:/run/arwc-tls/server.crt:ro
      - ${ARWC_OPERATOR_DIR:-./.operator}/tls/server.key:/run/arwc-tls/server.key:ro
    networks:
      corporate:
        ipv4_address: 10.77.60.60
        aliases:
          - a-identity
          - corporate-identity.arwc.test

  a-data-bridge:
    build:
      context: ../..
      dockerfile: build/arwc/images/data-bridge.Dockerfile
    image: cinder-arwc/a-data-bridge:hand-build
    container_name: cinder-arwc-data-bridge
    hostname: a-data-bridge
    domainname: dmz.arwc.test
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    cap_add: [SETUID, SETGID, CHOWN, FOWNER, DAC_OVERRIDE]
    security_opt:
      - no-new-privileges:true
    sysctls:
      net.ipv4.ip_unprivileged_port_start: 0
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=32m,mode=1777
      - /run:rw,nosuid,nodev,size=16m,mode=0755
    volumes:
      - data-bridge-state:/var/lib/arwc-data-bridge
      - business-integration-evidence:/run/arwc-business-integration:ro
      - data-integration-evidence:/run/arwc-data-integration:ro
      - ${ARWC_OPERATOR_DIR:-./.operator}/tls/server.crt:/run/arwc-tls/server.crt:ro
      - ${ARWC_OPERATOR_DIR:-./.operator}/tls/server.key:/run/arwc-tls/server.key:ro
    networks:
      dmz:
        ipv4_address: 10.77.62.20
        aliases:
          - a-data-bridge
          - integration-gateway.arwc.test

networks:
  corporate:
    name: cinder-arwc-corporate
    internal: true
    ipam:
      config:
        - subnet: 10.77.60.0/24
          gateway: 10.77.60.1
  dmz:
    name: cinder-arwc-dmz
    internal: true
    ipam:
      config:
        - subnet: 10.77.62.0/24
          gateway: 10.77.62.1

volumes:
  connector-fieldlink:
    name: cinder-arwc-connector-fieldlink
  connector-customer:
    name: cinder-arwc-connector-customer
  business-state:
    name: cinder-arwc-business-state
  business-archive-evidence:
    name: cinder-arwc-business-archive-evidence
  business-integration-evidence:
    name: cinder-arwc-business-integration-evidence
  business-relation-evidence:
    name: cinder-arwc-business-relation-evidence
  archive-state:
    name: cinder-arwc-archive-state
  archive-handover:
    name: cinder-arwc-archive-handover
  identity-state:
    name: cinder-arwc-identity-state
  identity-planning:
    name: cinder-arwc-identity-planning
  identity-archive-evidence:
    name: cinder-arwc-identity-archive-evidence
  data-state:
    name: cinder-arwc-data-state
  data-integration-evidence:
    name: cinder-arwc-data-integration-evidence
  data-archive-evidence:
    name: cinder-arwc-data-archive-evidence
  data-postgresql:
    name: cinder-arwc-data-postgresql
  data-bridge-state:
    name: cinder-arwc-data-bridge-state
