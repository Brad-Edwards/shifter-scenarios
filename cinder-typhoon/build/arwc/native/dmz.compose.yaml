x-runtime: &runtime
  restart: unless-stopped
  security_opt: [no-new-privileges:true]
  sysctls: {net.ipv4.ip_forward: "0"}
  logging: {driver: json-file, options: {max-size: 10m, max-file: "3"}}
services:
  seed-early-cards:
    image: ${ERPNEXT_IMAGE:?Load images.env}
    profiles: [seed]
    entrypoint: [python, /seed/seed-early-cards.py]
    env_file: [.operator/erp-seed.env, .operator/documents-seed.env]
    networks: [data]
    volumes:
      - ./seed-early-cards.py:/seed/seed-early-cards.py:ro
      - ./seed-erp.py:/seed/seed-erp.py:ro
      - ./seed-documents.py:/seed/seed-documents.py:ro
      - ./records:/seed/records:ro
    sysctls: {net.ipv4.ip_forward: "0"}
    security_opt: [no-new-privileges:true]
  seed-portal:
    image: ${ERPNEXT_IMAGE:?Load images.env}
    profiles: [seed]
    entrypoint: [python, /seed/seed-portal.py]
    env_file: [.operator/erp-seed.env]
    networks: [data]
    volumes:
      - ./seed-portal.py:/seed/seed-portal.py:ro
      - ./seed-erp.py:/seed/seed-erp.py:ro
    sysctls: {net.ipv4.ip_forward: "0"}
    security_opt: [no-new-privileges:true]
  dns:
    networks:
      dmz: {ipv4_address: 10.77.62.11}
  edge:
    volumes:
      - ./dmz-nginx.conf:/etc/nginx/conf.d/dmz.conf:ro
      - ../.operator/tls/ca.crt:/etc/nginx/customer-ca.crt:ro
    networks:
      portal_exchange: {ipv4_address: 172.29.67.4}
      render_exchange: {ipv4_address: 172.29.68.4}
      api_exchange: {ipv4_address: 172.29.69.4}
  frontend:
    networks:
      portal_exchange: {ipv4_address: 172.29.67.2}
  corporate-db:
    secrets: [postgrest_password]
    networks:
      api_database: {ipv4_address: 172.29.70.2}
  dmz-edge:
    <<: *runtime
    image: ${NGINX_IMAGE:?Load images.env}
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID, NET_BIND_SERVICE]
    tmpfs: [/tmp, /var/cache/nginx, /var/run]
    volumes:
      - ./edge-http.conf:/etc/nginx/conf.d/00-arwc.conf:ro
      - ./dmz-nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ../.operator/tls/ca.crt:/etc/nginx/customer-ca.crt:ro
      - ./.operator/ca/tls:/etc/nginx/tls:ro
    networks:
      dmz: {ipv4_address: 10.77.62.13}
      portal_exchange: {ipv4_address: 172.29.67.3}
      render_exchange: {ipv4_address: 172.29.68.3}
      api_exchange: {ipv4_address: 172.29.69.3}
    healthcheck:
      test: [CMD-SHELL, "wget --no-check-certificate -qO- https://127.0.0.1/health >/dev/null && wget -qO- http://renderer:3000/health >/dev/null && wget -qO- http://postgrest:3001/ready >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 24
      start_period: 60s
  renderer:
    <<: *runtime
    image: ${GOTENBERG_IMAGE:?Load images.env}
    read_only: true
    cap_drop: [ALL]
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=512m,mode=1777
      - /dev/shm:rw,noexec,nosuid,nodev,size=128m,mode=1777
    mem_limit: 1g
    pids_limit: 256
    environment:
      HOME: /tmp
      XDG_CACHE_HOME: /tmp/cache
      API_BODY_LIMIT: 10MB
      API_TIMEOUT: 30s
      API_DISABLE_DOWNLOAD_FROM: "true"
      CHROMIUM_DENY_PRIVATE_IPS: "true"
    dns: [127.0.0.1]
    networks:
      render_exchange: {ipv4_address: 172.29.68.2}
    healthcheck:
      test: [CMD, curl, -fsS, http://127.0.0.1:3000/health]
      interval: 10s
      timeout: 5s
      retries: 18
  postgrest:
    <<: *runtime
    image: ${POSTGREST_IMAGE:?Load images.env}
    read_only: true
    cap_drop: [ALL]
    environment:
      PGRST_DB_SCHEMAS: dmz_api
      PGRST_DB_ANON_ROLE: dmz_reader
      PGRST_DB_POOL: "5"
      PGRST_DB_MAX_ROWS: "1000"
      PGRST_DB_EXTRA_SEARCH_PATH: ""
      PGRST_ADMIN_SERVER_PORT: "3001"
      PGRST_OPENAPI_MODE: follow-privileges
      PGRST_OPENAPI_SERVER_PROXY_URI: https://read-data.arwc.test
    env_file: [.operator/postgrest.env]
    depends_on:
      corporate-db: {condition: service_healthy}
    dns: [127.0.0.1]
    networks:
      api_exchange: {ipv4_address: 172.29.69.2}
      api_database: {ipv4_address: 172.29.70.3}
networks:
  dmz: {external: true, name: cinder-arwc-dmz}
  portal_exchange:
    internal: true
    ipam: {config: [{subnet: 172.29.67.0/29}]}
  render_exchange:
    internal: true
    ipam: {config: [{subnet: 172.29.68.0/29}]}
  api_exchange:
    internal: true
    ipam: {config: [{subnet: 172.29.69.0/29}]}
  api_database:
    internal: true
    ipam: {config: [{subnet: 172.29.70.0/29}]}
secrets:
  postgrest_password: {file: .operator/postgrest_password}
