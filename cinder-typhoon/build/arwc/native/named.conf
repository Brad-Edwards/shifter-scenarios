options {
    directory "/tmp";
    listen-on { any; };
    listen-on-v6 { none; };
    recursion no;
    allow-transfer { none; };
    pid-file "/tmp/named.pid";
    session-keyfile "/tmp/session.key";
    dnssec-validation no;
};
view "supervisory" {
    match-clients { 172.29.63.0/24; 127.0.0.1; };
    zone "arwc.test" { type master; file "/etc/bind/db.arwc.test"; };
};
view "dmz" {
    match-clients { 10.77.62.0/24; };
    zone "arwc.test" { type master; file "/etc/bind/db.arwc-dmz.test"; };
};
view "corporate" {
    match-clients { any; };
    zone "arwc.test" { type master; file "/etc/bind/db.arwc-corporate.test"; };
};
