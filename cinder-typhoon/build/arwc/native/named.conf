options {
    directory "/tmp";
    listen-on { any; };
    listen-on-v6 { none; };
    recursion no;
    allow-transfer { none; };
    pid-file "/tmp/named.pid";
    session-keyfile "/tmp/session.key";
    dnssec-validation no;
};
zone "arwc.test" {
    type master;
    file "/etc/bind/db.arwc.test";
};
