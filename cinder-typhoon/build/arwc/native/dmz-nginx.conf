server {
    listen 443 ssl;
    server_name _;
    location = /health { default_type text/plain; return 200 "arwc service exchange ready\n"; }
    location / { return 404; }
}
server {
    listen 443 ssl;
    server_name suppliers.arwc.test;
    client_max_body_size 10m;
    location = /app { return 404; }
    location ^~ /app/ { return 404; }
    location = /desk { return 404; }
    location ^~ /desk/ { return 404; }
    location / {
        set $portal http://frontend:8080;
        proxy_pass $portal;
        proxy_read_timeout 120s;
    }
}
server {
    listen 443 ssl;
    server_name render.arwc.test;
    client_max_body_size 10m;
    location / {
        set $render http://renderer:3000;
        proxy_pass $render;
        proxy_read_timeout 35s;
    }
}
server {
    listen 443 ssl;
    server_name read-data.arwc.test;
    location / {
        set $read_api http://postgrest:3000;
        proxy_pass $read_api;
    }
}
