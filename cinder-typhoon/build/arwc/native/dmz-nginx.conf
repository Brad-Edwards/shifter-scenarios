server {
    listen 443 ssl;
    server_name _;
    location = /health { default_type text/plain; return 200 "arwc service exchange ready\n"; }
    location / { return 404; }
}
server {
    listen 443 ssl;
    server_name suppliers.arwc.test;
    client_max_body_size 10m;
    location = /app { return 404; }
    location ^~ /app/ { return 404; }
    location = /desk { return 404; }
    location ^~ /desk/ { return 404; }
    location / {
        set $portal http://frontend:8080;
        proxy_pass $portal;
        proxy_read_timeout 120s;
    }
}
server {
    listen 443 ssl;
    server_name render.arwc.test;
    client_max_body_size 10m;
    location / {
        set $render http://renderer:3000;
        proxy_pass $render;
        proxy_read_timeout 35s;
    }
}
server {
    listen 80;
    server_name preview-cinder.arwc.test;
    location /preview/ {
        default_type text/html;
        return 200 '<html><head><title>Cinder Preview Service</title></head><body><h2>Cinder Drawing Preview</h2><p id="svc">service:preview-cinder.arwc.test</p><p id="path">path:$uri</p><script>try{parent.postMessage({type:"preview_loaded",origin:"preview-cinder.arwc.test",path:"$uri"},"*");}catch(e){}</script></body></html>';
    }
    location / { return 404; }
}
server {
    listen 443 ssl;
    server_name read-data.arwc.test;
    location = /api/operating-history {
        limit_except GET { deny all; }
        proxy_pass https://172.29.69.5;
        proxy_ssl_server_name on;
        proxy_ssl_name integration-gateway.arwc.test;
        proxy_ssl_verify on;
        proxy_ssl_verify_depth 2;
        proxy_ssl_trusted_certificate /etc/nginx/customer-ca.crt;
        proxy_read_timeout 10s;
    }
    location / {
        set $read_api http://postgrest:3000;
        proxy_pass $read_api;
    }
}
