server {
    listen 443 ssl default_server;
    server_name edge.arwc.test;
    location = /health { default_type text/plain; return 200 "arwc native IT ready\n"; }
    location / { return 404; }
}
server {
    listen 443 ssl;
    server_name identity.arwc.test;
    location / {
        set $identity http://keycloak:8080;
        proxy_pass $identity;
    }
}
server {
    listen 443 ssl;
    server_name erp.arwc.test;
    client_max_body_size 50m;
    location / {
        set $erp http://frontend:8080;
        proxy_pass $erp;
        proxy_read_timeout 120s;
    }
}
server {
    listen 443 ssl;
    server_name documents.arwc.test;
    client_max_body_size 100m;
    location = /.well-known/carddav { return 301 /remote.php/dav/; }
    location = /.well-known/caldav { return 301 /remote.php/dav/; }
    location / {
        set $documents http://nextcloud:80;
        proxy_pass $documents;
        proxy_read_timeout 120s;
    }
}
server {
    listen 443 ssl;
    server_name reports.arwc.test;
    location / {
        set $reports http://metabase:3000;
        proxy_pass $reports;
        proxy_read_timeout 120s;
    }
}
server {
    listen 443 ssl;
    server_name engineering.arwc.test;
    client_max_body_size 100m;
    location / {
        set $engineering http://gitea:3000;
        proxy_pass $engineering;
    }
}
server {
    listen 443 ssl;
    server_name planning-data.arwc.test;
    location / {
        set $planning_data https://a-data:443;
        proxy_pass $planning_data;
        proxy_ssl_verify off;
        proxy_set_header Host $host;
        proxy_read_timeout 30s;
    }
}
