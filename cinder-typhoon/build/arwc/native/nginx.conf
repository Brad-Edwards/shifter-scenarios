resolver 127.0.0.11 valid=10s ipv6=off;
ssl_certificate /etc/nginx/tls/server.crt;
ssl_certificate_key /etc/nginx/tls/server.key;
ssl_protocols TLSv1.2 TLSv1.3;
server_tokens off;
proxy_set_header Host $host;
proxy_set_header X-Forwarded-Proto https;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Real-IP $remote_addr;
server {
    listen 443 ssl default_server;
    server_name edge.arwc.test;
    location = /health { default_type text/plain; return 200 "arwc native IT ready\n"; }
    location / { return 404; }
}
server {
    listen 443 ssl;
    server_name identity.arwc.test;
    location / {
        set $identity http://keycloak:8080;
        proxy_pass $identity;
    }
}
server {
    listen 443 ssl;
    server_name erp.arwc.test;
    client_max_body_size 50m;
    location / {
        set $erp http://frontend:8080;
        proxy_pass $erp;
        proxy_read_timeout 120s;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
