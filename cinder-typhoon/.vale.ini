StylesPath = ../.vale/styles
MinAlertLevel = error
Packages = Google

# Use this config explicitly when linting the pack from the repository root.
# Vale 3.9.1 applies BlockIgnores/TokenIgnores by extension, not file path.
# A pack config keeps these exceptions out of other scenarios' documentation.
[*.md]
BasedOnStyles = Google

# This Canadian setting permits unambiguous day-month-year and ISO dates.
Google.DateFormat = NO

# Cards mix player-facing prose with author instructions. Exempt descriptions
# and hints, including their headings, up to the next level-two section or EOF.
# Technical design and other authoring sections remain linted.
BlockIgnores = (?ms)(^## Challenge description[^\n]*\n.*?)(?=^## |\z), (?ms)(^## Hints\n.*?)(?=^## |\z)

# Preserve structured capability/challenge labels and genuine noun spellings.
# "supply" is not an adverb; "37signals" is a company name, not a duration.
TokenIgnores = (\b[A-Z][0-9]+ — [TKW][0-9]+\.[0-9]+\b), (\bsupply-chain\b), (\b37signals\b)

# Character speech, workplace records, and voice samples need editorial review,
# not developer-documentation style. Keep lint directives out of world assets.
# Patterns work from either the repository root or the pack directory.
[**/assets/narrative/authoring/**]
BasedOnStyles =

[**/assets/narrative/documents/**]
BasedOnStyles =

[**/assets/narrative/generated/**]
BasedOnStyles =

[**/docs/narrative/people.md]
BasedOnStyles =
