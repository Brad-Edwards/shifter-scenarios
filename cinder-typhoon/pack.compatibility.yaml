schema_version: "environment-pack-compatibility/v2"
pack:
  name: cinder-typhoon
  title: "Cinder Typhoon"
  version: 0.2.0
  status: draft
  source:
    requirement: null
    issues: []
    upstream_references:
      - https://github.com/OpenRAE/env-packs/tree/679356d762971600f22e6ff3228f4c2b48376eee/src/raes_env_packs/resources/template
      - https://github.com/OpenRAE/rae

artifact_boundaries:
  participant_visible:
    - path: challenges/challenges.yaml
      export: commercial
      description: Generated versioned card, score, description, and hint delivery catalog.
  operator_only:
    - path: README.md
      export: operator
      description: Draft pack and authoring index.
    - path: docs/
      export: operator
      description: Existing authoring documents, diagrams, and design checks.
    - path: sdl/
      export: operator
      description: Modular in-world SDL with native default-open realization.
    - path: tests/
      export: operator
      description: Static native SDL and design correspondence checks.
    - path: ctfd/
      export: operator
      description: Native Shifter event-content projection and acceptance tooling.
    - path: runtime-adapter/
      export: operator
      description: Reserved adapter folder; no implementation.
  oracle_only: []
  commercial: []
runtime_profiles: []
delivery_bundles: []
platform_features: []
assets: []
operator_surfaces: []
validation:
  commands:
    - id: challenge-delivery-current
      command: python3 challenges/catalog.py --check
      validates: [challenge-delivery-current]
    - id: hint-delivery-current
      command: python3 build/hint-delivery/release.py verify
      validates: [hint-delivery-current]
    - id: card-coverage-exact
      command: python3 build/card-coverage/coverage.py --require-complete
      validates: [card-coverage-exact]
    - id: qa-status-consistent
      command: python3 tests/report_qa_status.py
      validates: [qa-status-consistent]
    - id: qa-documentation-consistent
      command: python3 -m unittest tests/test_qa_layers.py
      validates: [qa-documentation-consistent]
  gates:
    - id: challenge-delivery-current
      kind: unit-test
      paths:
        - path: challenges/catalog.py
        - path: challenges/challenges.yaml
    - id: hint-delivery-current
      kind: unit-test
      paths:
        - path: build/hint-delivery/release.py
        - path: build/hint-delivery/manifest.json
    - id: card-coverage-exact
      kind: unit-test
      paths:
        - path: build/card-coverage/coverage.py
        - path: build/card-coverage/registry.json
    - id: qa-status-consistent
      kind: unit-test
      paths:
        - path: tests/report_qa_status.py
        - path: tests/qa-status.json
    - id: qa-documentation-consistent
      kind: unit-test
      paths:
        - path: tests/test_qa_layers.py
        - path: tests/README.md
