    - id: W27
      chapter: Control
      title: A valid-looking program
      allocation:
        hard: 1
        expert: 1
        elite: 1
      cards:
      - id: W27.1
        title: What counts as intact
        description: Recover the integrity behavior used by the legacy engineering verifier and reproduce
          its decisions on the supplied programs.
        difficulty: hard
        points: 200
        hints:
        - POST https://process-view.arwc.test/api/signature-programs/current/reproductions with CORPORATE
          Bearer and body {"operation":"materials","record_id":"VER-ROT128-R3"}. Returns the rot128-verifier
          ELF binary (verifier_b64) and 6 DPG1 programs (program_b64). Reverse-engineer the ROT128 algorithm
          from the binary.
        - 'ROT128 algorithm: pad data with 0x80 then zeros to 16-byte boundary. IV=0x6a09e667f3bcc908bb67ae8584caa73b
          (u128 LE). For each 16-byte block: s = ROTL128(s,17) XOR block XOR ROTL128(block,41). Final:
          s XOR ROTL128(s,29) XOR unpadded_byte_length. Each block is little-endian u128. Six programs
          test header inclusion, padding, rotation direction, endian order, and length handling.'
        - Submit POST /api/signature-programs/current/reproductions with body {"operation":"results",
          "record_id":"VER-ROT128-R3","program_set":"DPG1-CASES-R3","results":[{"case_id":"DPG1-CASE-N",
          "digest":"<32hex>","decision":"accepted"|"rejected"},...]}. All 6 must be correct (run verifier
          binary or implement ROT128). Returns VER-ROT128-RESULT-R3.
        completion:
          mode: automatic_range_evidence
      - id: W27.2
        title: The constraints of a valid-looking program
        description: Construct a model of the verifier's collision constraints that also accounts for
          the engineering program's required form.
        difficulty: expert
        points: 400
        hints:
        - POST /api/signature-programs/current/constraints with body {"operation":"contract","record_id":"DPG-CONTRACT-R8"}.
          Returns base_program_b64, reservoir_bits (256 bit positions), and distinguishing_cases (3 cases).
          Read model_program_id in the response — the collision candidate must use that identity, not
          BASE_ID or TARGET_ID.
        - Build a 128-row GF(2) system over the 256 reservoir-bit variables. RHS = rot128(model_zero)
          XOR rot128(base), where model_zero is the model-identity program with zero reservoir. Each matrix
          column is the digest delta for flipping one reservoir bit in model_zero. Solve by Gaussian elimination;
          free variables stay 0.
        - Submit POST /api/signature-programs/current/constraints with {"operation":"model","record_id":"DPG-MODEL-R8",
          "cases":[<from contract>],"program_b64":"<solved candidate b64>"}. The candidate must differ
          from base only in reservoir bytes and the program-id header field. Cairn Reach output stays
          at 12.4; only the identity changes.
        completion:
          mode: automatic_range_evidence
      - id: W27.3
        title: A program the engineer would accept
        description: Create a valid-looking diagnostic program that makes the planning consumer report
          sufficient reserve for Cinder's allocation case while preserving its required diagnostics and
          unaffected district outputs.
        difficulty: elite
        points: 800
        hints:
        - POST /api/diagnostic-runs (via process-view.arwc.test, same proxy path as other diagnostic routes).
          Body {"record_id":"DPG-CRR-CINDER","consumer":"PLAN-CONSUMER-R8","program_b64":"<b64>"}. Requires
          W27.2 collision_model_created state; gates on the planning consumer accepting the false estimate.
        - 'Build the GF(2) collision for TARGET_ID (DPG-CRR-CINDER) with cairn_reserve=13.4 instead of
          12.4. Set up: base = build_program(BASE_ID, cairn=12.4); target_zero = build_program(TARGET_ID,
          cairn=13.4, reservoir=0). Solve 128-equation GF(2) system the same way as W27.2 but over target_zero.
          changed_only(candidate, purpose="target") allows RESERVOIR_BYTES, program-id field (bytes 48-63),
          and CAIRN_VALUE_OFFSET range.'
        - 'The service validates: program_id=DPG-CRR-CINDER, outputs={Cairn Reach:13.4, North:8.1, Merewick:7.65},
          digest==base digest, changed_only(target). Then calls the planning consumer internally. The
          accepted program and false estimate supply the W34 planning-view capability without altering
          raw OT observations.'
        completion:
          mode: automatic_range_evidence
    - id: W28
      chapter: Control
      title: The utility has no room
      allocation:
        medium: 1
        hard: 2
      cards:
      - id: W28.1
        title: The utility's small world
        description: Recover the utility's actual execution contract and the protected engineering relationship
          it serves.
        difficulty: medium
        points: 100
        hints:
        - POST /api/collision-inputs/current with body {"operation":"materials","project_revision":364}.
          Returns the utility binary (utility_b64), relationship, ordinary_invocations, relocations, seccomp_policy,
          and a signed status record with session_id, stack_canary, and return_address.
        - The status record is signed with Ed25519 (key derived from SHA-256 of a fixed label). The canary
          and return address are freshly generated per session and persist for the session lifetime. The
          return address encodes the ELF-relative offset from status_return_offset in the relationship
          file and the current PIE base.
        - This card only requires recovering the contract materials. Submit the materials request and
          retain the full response (status record, binary, relationship) for use in W28.2 and W28.3.
        completion:
          mode: automatic_range_evidence
      - id: W28.2
        title: Control with very little room
        description: Gain controlled execution flow in the engineering utility despite its restricted
          executable surface.
        difficulty: hard
        points: 200
        hints:
        - POST /api/release-plans/current/confirmation with {"session_id":"<W28.1 session>","length":240,
          "frame_b64":"<frame>"}. The binary validates the frame with frame_valid() and outputs {"controlled_flow":true}
          if it passes. No actual exploitation — it checks the proof-of-work structure.
        - 'Frame layout (240 bytes total): [192 zeros][8 zeros][canary LE][base+224 LE][pivot LE][pop_rdi
          LE][controlled LE]. pivot = base + stack_pivot_off (4752). pop_rdi = base + pop_rdi_off (4704).
          controlled = base + 4768. base = session pie_base from W28.1. canary = session canary from W28.1.'
        - 'Get all offsets from relationship.json (returned in W28.1 response). chain_offset=224, so saved_rbp=base+224.
          The frame validates: canary at 200, saved_rbp at 208, saved_return (pivot) at 216, pop_rdi at
          224, controlled at 232.'
        completion:
          mode: automatic_range_evidence
      - id: W28.3
        title: Keep the authority you earned
        description: Complete the utility compromise while retaining the privilege needed to establish
          the scoped live control capability.
        difficulty: hard
        points: 200
        hints:
        - 'POST /api/control-authority with {"operation":"issue","session_id":"<W28.1 session>","length":320,
          "frame_b64":"<frame>"}. Frame is 320 bytes: same prefix as W28.2 but chain is 12 u64 values
          calling setresuid(0,0,0) via vDSO, then issue_client(immutable_issuer_record, request_correlation).'
        - 'Chain (96 bytes at offset 224): pop_rdi,0, pop_rsi,0, pop_rdx,0, vdso_setresuid, pop_rdi, base+issuer_record_off,
          pop_rsi, base+request_correlation_off, base+issue_client_off. vdso_setresuid = 0x7fff000007B0
          (fixed vDSO base + setresuid_syscall_offset from relationship.json). The binary gains root via
          cap_setuid file capability, connects to /run/arwc/control-issuer.sock, sends the issuer request,
          and returns the control_client token. The engineering container must NOT have no-new-privileges:true
          (file capabilities would be blocked).'
        - Locate the control authority operation in the published client reference. Replay the preceding
          evidence through the next documented boundary and verify the downstream service, not the client,
          records the outcome.
        completion:
          mode: automatic_range_evidence
    - id: W29
      chapter: Planning
      title: Paper truth
      allocation:
        easy: 1
        medium: 2
      cards:
      - id: W29.1
        title: The price of this planning window
        description: Use the Cairn Reach allocation export and corporate planning records to identify
          the replacement-supply tariff, its effective interval, and the allocation commitment for the
          same asset and planning window.
        difficulty: easy
        points: 50
        hints:
        - Read the allocation-ledger.csv from ~/CairnReach/Briefs/W29/ (shows TAR-CRR-DP3-R4 and ALLOC-2026-DP3-R9).
          Then call GET /api/settlement-tariffs/current and GET /api/allocation-ledgers/current on planning-data.arwc.test
          (requires corporate Bearer + X-ARWC-Planner-Session header from earned W06.3 session).
        - 'settlement_tariff row: TAR-CRR-DP3-R4 at 2400 USD/ML, planning window ALLOC-2026-DP3, asset
          AST-CRR-017, effective 2026-11-01 to 2026-12-01. allocation_ledger row: ALLOC-2026-DP3-R9 at
          12.00 ML. Keep rate and committed volume separate — they describe different facts.'
        - Verify TAR-CRR-DP3-R4 and ALLOC-2026-DP3-R9 are bound to AST-CRR-017 and their common planning
          window only after the native corporate rows agree with the supplied ledger. TAR-CRR-DP3-R4 is
          the settlement tariff; do not substitute the W35 procurement catalog.
        completion:
          mode: automatic_range_evidence
      - id: W29.2
        title: What reserve remains uncommitted
        description: Select a fresh good-quality `UsableVolumeML` observation from native Cairn Reach
          history and reconcile it with the 12.00 ML allocation commitment to calculate the current uncommitted
          margin.
        difficulty: medium
        points: 100
        hints:
        - Submit the current reserve reconciliation for this planning window and asset via POST /api/reserve-reconciliations/current
          with {"planning_window":"ALLOC-2026-DP3","asset":"AST-CRR-017", "observed_at":"<ISO 8601>","process_quality":"Good","measured_usable_volume_ml":<value>,
          "committed_ml":12.0,"uncommitted_margin_ml":<margin>,"margin_state":"positive|zero|negative"}.
        - 'Query public.process_history JOIN public.historian_tag_catalog WHERE asset=''AST-CRR-017''
          AND variable=''UsableVolumeML'' for a recent Good-quality sample. margin = measured - 12.00
          ML. margin_state: positive if >0.005, negative if <-0.005, zero otherwise.'
        - The service validates the submitted values against the nearest OT historian sample within 5
          seconds. A stale (>5 min), bad-quality (not Good), or miscalculated margin is rejected. Use
          the source_time from the historian row as observed_at.
        completion:
          mode: automatic_range_evidence
      - id: W29.3
        title: Paper truth
        description: Compare corporate report `RPT-CRR-DP3-R7` with the later good-quality native usable-volume
          observation, calculate their signed difference, and explain what their different as-of times
          allow you to conclude.
        difficulty: medium
        points: 100
        hints:
        - Submit the paper reconciliation comparing the signed report against current process truth via
          POST /api/paper-reconciliations/current with {"planning_window":"ALLOC-2026-DP3","asset":"AST-CRR-017",
          "report_id":"RPT-CRR-DP3-R7","report_as_of":"2026-11-09T00:00:00Z","reported_ml":13.4, "observed_at":"<ISO
          8601>","measured_usable_volume_ml":<value>,"signed_paper_variance_ml":<var>, "direction":"report_above|report_below|aligned","time_basis":"different_as_of_times",
          "conclusion":"paper_report_is_not_current_process_truth"}.
        - 'variance = reported_ml - measured_usable_volume_ml (13.4 - ~10.85 = +2.55 ML currently). direction:
          report_above_later_process_value if variance > 0.005, report_below if < -0.005. observed_at
          must be AFTER 2026-11-09T00:00:00Z (the report as_of time).'
        - 'The service validates the submitted variance and direction against the nearest OT historian
          UsableVolumeML sample within 5 seconds. time_basis and conclusion are fixed strings — the report
          is dated paper truth, not current process state. Prerequisites: W29.1 AND W29.2 (reserve_observed
          state).'
        completion:
          mode: automatic_range_evidence
    - id: W30
      chapter: Plant operation
      title: Operate the outlet
      allocation:
        medium: 2
      cards:
      - id: W30.1
        title: Bind the plan to the plant
        description: Turn the approved operating instruction into an exact request for the installed Cairn
          Reach dispatcher. Bind the asset, mode, setpoint, expiry, delivery rules, and recovery path
          before anything moves.
        difficulty: medium
        points: 100
        hints:
        - 'POST /api/request-plans/current with the exact planned request struct. Fields must match the
          installed arwc.remote-request/v1 contract exactly: instruction=CRR-OP-W30-R1, asset=AST-CRR-017,
          project_revision=364, delivery (schema/topic/principal/qos/retain=false), request (id_strategy/mode/positions/flow/expiry),
          successful_states, retry rules, and restore={channel:hmi, manual A20/B20}.'
        - 'The service validates: submission matches the contract plan exactly AND running ProjectRevision
          = 364 from OT historian. id_strategy must be "fresh_uuid_v4_at_execution" (not an actual UUID).
          expiry_seconds=90. This card prepares but does NOT issue the dispatcher request.'
        - 'retain=false, qos=1, topic=arwc/crr/commands/operator. restore.remote_enabled=false. All numeric
          position/flow values must be exact floats (20.0, 0.3, 0.2). Prerequisite: W29.3 (paper_variance_observed).'
        completion:
          mode: automatic_range_evidence
      - id: W30.2
        title: Operate and hand back
        description: Execute the approved dispatcher request, prove the PLC and both outlets reached the
          requested flow, then take local control through FUXA and restore the normal A20/B20 baseline.
        difficulty: medium
        points: 100
        hints:
        - POST /api/remote-operations/current with the W30.2 submission after executing the real operation.
          Requires W30.1 (request_planned). Submission must include request_id, remote_sequence, timestamps
          (received_at, completed_at, restore_accepted_at, final_observed_at, interval_start, interval_end),
          restore_sequence, and interpretation=durable_receipt_plc_acceptance_measured_completion_local_handback.
        - 'Publish the MQTT request (operator/Y7kjNV-... to mosquitto:8883, topic arwc/crr/commands/operator,
          QoS 1 no-retain). The dispatcher records 5 states: received→dispatch_intent→dispatched→plc_accepted→completed.
          Flows complete at ~0.15 m³/s each outlet. Restore via FUXA: HmiRemoteEnabled=false, HmiAutoMode=false,
          HmiTargetPct=20, HmiTargetBPct=20, then increment HmiSequence. Owner returns to 1, AutoMode=false.'
        - The service validates dispatch_history (all 5 states, remote_sequence), command_history (dispatcher
          and HMI acceptances), and flow tolerances (±0.0075 m³/s from 0.15). All timestamps must match
          database records within 2 seconds. Reader must be granted SELECT on ot_dispatch schema.
        completion:
          mode: automatic_range_evidence
    - id: W31
      chapter: Release and consequences
      title: The diagnostic vault
      allocation:
        medium: 1
        hard: 1
        expert: 2
      cards:
      - id: W31.1
        title: The vault's misleading length
        description: Recover the diagnostic vault's actual record-boundary behavior and the protected
          diagnostic reference associated with the supplied case.
        difficulty: medium
        points: 100
        hints:
        - GET /api/vault-records/current (via process-view.arwc.test proxy). Returns VAULT-CRR-R5 record
          with case_id=DV-CRR-4417, protected_history_reference=HIST-APR-CRR-09, format=DVL1, request_limit=512
          bytes, declared_length_encoding=u16-le, header_length_encoding=u16-le, integrity=CRC32C. Sets
          vault_contract_observed state.
        - 'The vault worker binary (dvl-worker-r5) is returned as worker_b64. The DVL1 record format:
          u16 declared_length + u16 header_length + u32 CRC32C + payload. Requests are bounded at 512
          bytes. The status record exposes canary, stack frame offsets, and worker mapping for W31.2+.'
        - This card only requires the GET. Retain case_id=DV-CRR-4417 and protected_history_reference=HIST-APR-CRR-09
          for use in W31.2 (vault boundary control) and W31.3 (vault saved-state control).
        completion:
          mode: automatic_range_evidence
      - id: W31.2
        title: Past the parser's boundary
        description: Combine the observed record behavior into a controlled access beyond the parser's
          intended boundary.
        difficulty: hard
        points: 200
        hints:
        - 'POST /api/signature-records/current with {"case_id":"DV-CRR-4417","build_id":"DVL-WORKER-R5",
          "record_b64":"<512-byte DVL1 record>"}. DVL1: "DVL1" + declared(u16-le=0xfe08) + header(u16-le=0x01f8)
          + CRC32C(u32-le over 500-byte payload) + 500-byte payload. Total = 512 bytes exactly.'
        - 'The exploit: (declared + header) mod 2^16 = (0xfe08 + 0x01f8) mod 65536 = 0 (wraps), which
          passes the <=504 check. header=504 bytes are then copied into the 288-byte workspace, overflowing
          into the canary and control fields. CRC32C polynomial 0x82f63b78 (Castagnoli), computed over
          the 500-byte payload.'
        - For --boundary mode the binary only checks declared=0xfe08, header=0x01f8, length=512. Payload
          content does not matter. Returns declared_length=65032, header_length=504, wrapped_sum=0, copied_bytes=504.
          Sets vault_boundary_controlled state; gates W31.3 (--execute mode with ROP chain).
        completion:
          mode: automatic_range_evidence
      - id: W31.3
        title: The state execution returns to
