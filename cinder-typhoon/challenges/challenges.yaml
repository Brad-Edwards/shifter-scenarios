    - id: W32
      chapter: Release and consequences
      title: Replay is not reality
      allocation:
        medium: 1
        hard: 2
        expert: 1
      cards:
      - id: W32.1
        title: The replay's pieces
        description: Recover the replay program's relevant entity and component structure for the outlet
          example.
        difficulty: medium
        points: 100
        hints:
        - 'GET /api/replay-sessions/current (via process-view.arwc.test). Returns REPLAY-CRR-R19 record
          with the C++20 ECS structure: entities (Reservoir, OutletGroup, GateA, GateB, Buffer) each with
          their component lists. Also returns the replay binary (replay_b64) and distinguishing_cases.'
        - 'Recover the entity-component-system layout the replay binary expects from the session record.
          ECS entity-component bindings: Reservoir=[Reserve,Revision], OutletGroup=[Setpoint,Flow,Mode,Revision],
          GateA=[Setpoint,Position,Flow,Revision], GateB=[Setpoint,Position,Flow,Revision], Buffer=[Reserve,Revision].'
        - Sets replay_structure_recovered state; gates W32.2+. The outlet example component binding is
          GateA/GateB with Setpoint, Position, Flow, and Revision components.
        completion:
          mode: automatic_range_evidence
      - id: W32.2
        title: The systems that update it
        description: Reconstruct the update behavior needed to reproduce the outlet example's state changes.
        difficulty: hard
        points: 200
        hints:
        - POST /api/estimator-tasks/current/inputs with {"record_id":"REPLAY-CRR-R19","revision":19, "transitions":<transitions
          from binary>}. Run the replay-crr-r19 binary with mode "transitions" to get the 4 distinguishing
          ECS state transition cases; submit them verbatim.
        - 'The service compares the submitted transitions against run_replay32("transitions") output exactly.
          System order: CommandApply, RampLimit, FlowIntegrate, ReserveUpdate, ApprovalCheck.'
        - Call subprocess.run([replay_binary, "transitions"]) and parse stdout as JSON list (4 items).
          Sets replay_transitions_reproduced state; gates W32.3 (retained approval condition).
        completion:
          mode: automatic_range_evidence
      - id: W32.3
        title: The condition the old model used
        description: Recover the hidden state condition that makes the old replay approve the disputed
          schedule.
        difficulty: hard
        points: 200
        hints:
        - POST /api/estimator-results/current with {"replay":"REPLAY-CRR-R19","trace":"TRACE-R19-DISPUTED",
          "condition":<condition from binary>}. Run the replay binary with mode "condition" to get the
          approval condition dict; submit it verbatim along with the fixed replay and trace identifiers.
        - The service compares submitted condition against run_replay32("condition") output exactly. Sets
          replay_condition_recovered state; gates W32.4 (witness submission).
        - Call subprocess.run([replay_binary, "condition"]) and parse stdout as the condition JSON dict.
          The condition includes record_id=APPROVAL-COND-R19, system_order, and the hidden state binding.
        completion:
          mode: automatic_range_evidence
      - id: W32.4
        title: Replay is not reality
        description: Construct a replay trace that exposes why the old project's accepted schedule disagrees
          with the current process observations.
        difficulty: expert
        points: 400
        hints:
        - POST /api/replay-sessions/current/execute with {"replay":"REPLAY-CRR-R19", "trace":"TRACE-R19-DISPUTED","witness":<witness
          from binary>}. Run replay binary with mode "witness" to get the witness dict; submit verbatim.
        - Path is /execute not /results. Requires W32.3 (replay_condition_recovered) state. Sets replay_witness_response;
          completes W32 arc.
        - 'Execute the replay binary in witness mode and read the emitted proof from standard output.
          Call subprocess.run([replay_binary, "witness"]) and parse stdout. Proof: TRACE-R19-DISPUTED.'
        completion:
          mode: automatic_range_evidence
    - id: W33
      chapter: Release and consequences
      title: The expensive hour
      allocation:
        medium: 1
        hard: 2
        expert: 1
      cards:
      - id: W33.1
        title: A forecast that matches the instrument
        description: Calibrate outlet response delay and flow gain from a completed native operation and
          good-quality process history.
        difficulty: medium
        points: 100
        hints:
        - POST /api/commissioning-calibrations/current with {request_id, requested_total_flow_m3s=0.3,
          mean_total_flow_m3s, response_delay_seconds, flow_gain, good_sample_count}. Requires W30.RESULT
          (w30_result state). Service validates against OT historian TotalFlowM3s samples after W30 PLC
          acceptance.
        - Query process_history for TotalFlowM3s WHERE asset=AST-CRR-017, source_time after PLC acceptance,
          process_quality=Good, abs(value-0.3)<=0.02. Response delay = time from PLC acceptance to first
          good in-tolerance sample. Gain = mean_total_flow / 0.3. Need at least 5 good samples.
        - Use command_history to find PLC acceptance time (channel=dispatcher, most recent). Tolerance
          on calculated values is ±0.01. Sets w33_calibrated and w33_flow_gain state; gates W33.2.
        completion:
          mode: automatic_range_evidence
      - id: W33.2
        title: The peak hour
        description: Construct a twelve-interval release and alternate-supply schedule using the measured
          gain, planned demand, and declared operating limits.
        difficulty: hard
        points: 200
        hints:
        - POST /api/operating-schedules/current with {forecast:<W33.1 calibration>,schedule:{...}}. Schedule
          must have schema=arwc.operating-schedule/v1, instruction=CRR-OP-W33-R1, asset=AST-CRR-017, interval_seconds=300,
          reservoir_release_m3s=[12 values], alternate_supply_m3s=[12 values].
        - 'Buffer equation: buf[i+1] = buf[i] + 300*(gain*release[i]+alternate[i]-demand[i]). Initial=180m3,
          min=120, max=240, final 160-200. Volume=sum(300*gain*release)/1000 in [0.78,0.84]ML. Simple:
          constant release=0.224, alternate=demand-gain*0.224 gives buffer=180 and volume=0.81ML.'
        - Max release=0.8 m3/s, max alternate=0.5 m3/s. Demand=[0.45,0.5,0.55,0.6,0.65,0.7,0.7,0.65,0.6,0.55,0.5,0.45].
          Sets w33_schedule state; gates W33.3.
        completion:
          mode: automatic_range_evidence
      - id: W33.3
        title: Commission the schedule
        description: Commission all twelve reviewed release values through the authenticated dispatcher,
          prove each native result, and hand the site back locally.
        difficulty: hard
        points: 200
        hints:
        - POST /api/commissioning-runs/current with {asset, forecast, schedule, request_ids (12 UUIDs),
          started_at, completed_at, restore_sequence, restore_accepted_at, final_observed_at, interpretation="measured_twelve_step_commissioning_run_with_local_handback"}.
        - Let each fresh request reach a completed product state before the next. Stop on rejection or
          uncertainty, and bind every request UUID to its durable dispatcher path, native PLC acceptance,
          and settled feedback.
        - After all twelve steps, restore manual A20/B20 with local FUXA priority. Confirm the later local
          acceptance, measured baseline, healthy I/O, permissives, stopped motion, and clear travel faults
          in native history.
        completion:
          mode: automatic_range_evidence
      - id: W33.4
        title: Prove the operating projection
        description: Reconstruct every commissioning step from product history and turn the measured results
          into an explicitly labelled one-hour operating projection.
        difficulty: expert
        points: 400
        hints:
        - POST /api/operating-projections/current with commissioning (W33.3 body), observed_mean_total_flow_m3s
          (12 means from settled 4-second windows), projected_reservoir_volume_ml, starting_usable_volume_ml,
          remaining_usable_volume_ml, committed_volume_ml=12.0, projected_shortfall_ml, tariff_rate_per_ml=2400,
          projected_liability_usd, interpretation=measured_commissioning_evidence_with_projected_one_hour_effect.
        - 'For each step: TotalFlowM3s where source_time in [completed-4s, completed], Good quality, mean.
          projected_volume=sum(300*mean_i)/1000. starting=UsableVolumeML before first request. remaining=starting-projected.'
        - shortfall=max(0,12-remaining). liability=shortfall*2400. Service validates all values ±0.005.
          Sets w33_complete state; completes W33 arc.
        completion:
          mode: automatic_range_evidence
    - id: W34
      chapter: Release and consequences
      title: The reassuring dashboard
      allocation:
        medium: 1
        hard: 1
        expert: 1
      cards:
      - id: W34.1
        title: Which view the planner trusts
        description: Establish which planning consumer receives your controlled estimate and demonstrate
          a harmless change reaching it without altering raw measurements.
        difficulty: medium
        points: 100
        hints:
        - 'POST /api/reporting-submissions/current/result on planning-data.arwc.test (requires corporate
          Bearer + X-ARWC-Planner-Session). Body: {checkpoint:REH-REPORT-34, consumer:PLAN-CONSUMER-R8,
          consumer_revision:8, source:DPG-CRR-CINDER, estimate:{Cairn Reach:13.4,North:8.1,Merewick:7.65},
          refresh_interval_seconds:300, raw_observations:[MTR-CRR-DP3-R12,FIT-CRR-204A,FIT-CRR-204B]}.'
        - Source must be DPG-CRR-CINDER (W27.3 path) or ALLOC-CASE-CRR-33 (W23.3 path). Requires process_interpretation_prerequisite
          (reserve_reconciled + REC-CRR-DP3-17 integration evidence). Also requires the PLAN-CONSUMER-R8
          result file from W27.3 (diagnostic_estimate_observed).
        - Returns VIEW-CRR-34 record showing the planning consumer bound to the controlled estimate. Sets
          reporting_view_observed state; gates W34.2.
        completion:
          mode: automatic_range_evidence
      - id: W34.2
        title: A reassuring decision
        description: Construct a plausible false planning view that makes the planner select a different
          allocation while satisfying the declared consistency checks.
        difficulty: hard
        points: 200
        hints:
        - 'POST /api/planning-bids on planning-data.arwc.test (requires corporate Bearer + X-ARWC-Planner-Session).
          Body: {view:VIEW-CRR-34, checkpoint:REH-REPORT-34, unit:ML, freshness_seconds:40, source_set:[Cairn
          Reach,North,Merewick], unaffected:{North:8.1,Merewick:7.65}, meter_reserve_ml:12.4, variance_limit_ml:1.2}.
          Requires W34.1.'
        - Service checks estimate from VIEW-CRR-34, variance=Cairn Reach-12.4=1.0 less than 1.2. Returns
          DECISION-CRR-34 with decision=ALLOC-EXPAND-R2 (different from ordinary ALLOC-HOLD-R3).
        - Submitting the planning bid returns the reporting decision and sets reporting_decision_observed
          state, which gates W34.3.
        completion:
          mode: automatic_range_evidence
      - id: W34.3
        title: Still reassuring after the handover
        description: Couple the false planning view to the bounded release through the disclosed reporting
          handover. Preserve the convincing report while establishing the actual reserve loss.
        difficulty: expert
        points: 400
        hints:
        - Begin with the planning estimate consumer and reporting handover. Start from planning-data.arwc.test's
          published client document and records already earned in this operation, not from an invented
          endpoint.
        - Treat this as trusted-view manipulation while preserving raw-measurement integrity. Observe
          the ordinary and denied cases first, then change one input at a time and keep every unrelated
          binding fixed.
        - Review the published client document and ordinary records for planning-data.arwc.test. Record
          the normal result and a denied variant, alter one dimension, and keep the service-owned evidence
          needed to explain the difference.
        completion:
          mode: automatic_range_evidence
