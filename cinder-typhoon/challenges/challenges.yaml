scoring:
  model: static
  tier_points:
    easy: 50
    medium: 100
    hard: 200
    expert: 400
    elite: 800
  max_score: 39200
  max_out: Complete all 240 cards; hints do not reduce score.
  hint_policy:
    release: facilitator_on_request
    levels: 3
    independent_levels: true
    penalty: 0
summary:
  operation_count: 70
  card_count: 240
phases:
  training:
    title: Training
    operations:
    - id: T01
      chapter: Workbench
      title: First contact
      allocation:
        easy: 4
      cards:
      - id: T01.1
        title: The copy nobody deleted
        description: The last training operator left an empty handover note and an unfinished delivery.
          Recover the missing handover from the supplied workspace.
        difficulty: easy
        points: 50
        hints:
        - The workbench landing page names the data source for the initial handover. Check what the training
          dispatch site exposes at its root before looking further.
        - The resource is accessible without credentials. Look for an endpoint that serves structured
          data rather than a form.
        - Fetch the handover endpoint listed on the landing page. The response structure names the next
          resource you need.
        completion:
          mode: automatic_range_evidence
      - id: T01.2
        title: Off the menu
        description: The training dispatch site removed its rehearsal page from the menu. Find the page
          and recover the delivery amendment the public notice omits.
        difficulty: easy
        points: 50
        hints:
        - The dispatch site has a documented rehearsal path that was removed from the public navigation.
          Historical references in client-side code can expose paths that are no longer linked.
        - Look for JavaScript or markup that references an unlisted route. Browser developer tools or
          a simple page source review will surface it.
        - Inspect the dispatch site's static resources for route strings that do not appear in the visible
          navigation. One of them still responds.
        completion:
          mode: automatic_range_evidence
      - id: T01.3
        title: A token with a job
        description: Recover the retired courier client's usable access and retrieve the sealed manifest
          assigned to that courier.
        difficulty: easy
        points: 50
        hints:
        - The handover names a courier service. The courier client's credentials are somewhere on the
          workstation or in its session history.
        - Look for stored credentials in the workstation's standard locations for application sessions
          and authentication tokens.
        - Check the local credential store for a token bound to the courier's service hostname. The handover
          names the host.
        completion:
          mode: automatic_range_evidence
      - id: T01.4
        title: The helper has another job
        description: Make the dispatch diagnostic helper reveal the internal delivery summary that its
          ordinary report leaves out.
        difficulty: easy
        points: 50
        hints:
        - The local workbench helper accepts diagnostic input. The handover or the helper's documentation
          names what inputs it accepts and what it produces beyond a normal summary.
        - The helper's interface accepts more than one content type. A non-standard input triggers a different
          code path.
        - Submit a sample from the handover to the helper using the input type the handover says the helper
          was built to process. Read the full response.
        completion:
          mode: automatic_range_evidence
    - id: T02
      chapter: Accounts
      title: Someone can log in
      allocation:
        easy: 3
        medium: 1
      cards:
      - id: T02.1
        title: An account by any other response
        description: Identify the active rehearsal account and recover the account-bound case reference
          exposed by the identity desk.
        difficulty: easy
        points: 50
        hints:
        - The identity desk has a directory of active accounts. The rehearsal account appears in the directory
          under its own entry.
        - The directory exposes account metadata that includes enough information to identify the rehearsal
          account's role and its recovery state.
        - Query the identity desk's directory endpoint and look for the account whose role matches the
          one named in the handover.
        completion:
          mode: automatic_range_evidence
      - id: T02.2
        title: Hidden on the page
        description: The identity desk's public directory hides rehearsal assignments from visitors. Recover
          the private assignment and associated staff detail it should not expose.
        difficulty: easy
        points: 50
        hints:
        - The identity desk's public directory page hides some entries from the default view. The underlying
          data source includes more than the UI shows.
        - The directory data is served from an API endpoint that does not apply the same visibility filter
          as the HTML view.
        - Fetch the directory API endpoint directly and look for the rehearsal account that is absent
          from the rendered page.
        completion:
          mode: automatic_range_evidence
      - id: T02.3
        title: Recovery is another way in
        description: Use the identity evidence you recovered to take control of the rehearsal account
          through its recovery workflow and retrieve its private handover.
        difficulty: easy
        points: 50
        hints:
        - The identity evidence you recovered includes the information needed to prove ownership without
          the original password. The identity desk has a recovery path for exactly this situation.
        - Look for a credential recovery flow that accepts identity proof rather than a password. The
          evidence you have is the required proof.
        - Use the recovery endpoint on the identity desk with the account identifier and the evidence
          token you recovered. Read what it issues.
        completion:
          mode: automatic_range_evidence
      - id: T02.4
        title: Someone else's assignment
        description: Your recovered account can list its own assignments. Obtain the other operator's
          sealed rehearsal brief through the assignment service.
        difficulty: medium
        points: 100
        hints:
        - Your recovered account belongs to an assignment. The identity desk or the workbench can show
          you what that assignment contains.
        - The assignment record names one or more tasks that belong to your recovered account. Look for
          a resource listing endpoint.
        - Query the assignment resource linked in your recovered session. One of the listed tasks belongs
          to a different account.
        completion:
          mode: automatic_range_evidence
    - id: T03
      chapter: Developer artifacts
      title: Left in the checkout
      allocation:
        easy: 3
        medium: 1
      cards:
      - id: T03.1
        title: Deleted from the checkout
        description: Recover the missing delivery fixture named in the training package's review note
          and identify the behavior it covered.
        difficulty: easy
        points: 50
        hints:
        - The delivery fixture is named in the handover, but the file is not present at its documented
          path. Version-control history for the checkout holds deleted content.
        - Deleted files remain in git history. Standard git commands can recover content that was removed
          from the working tree but not from the repository.
        - Use git log and git show to find the commit that removed the fixture file and recover its contents.
        completion:
          mode: automatic_range_evidence
      - id: T03.2
        title: Verbose enough to publish
        description: Recover the release access exposed by the failed training build and retrieve the
          protected rehearsal-channel manifest.
        difficulty: easy
        points: 50
        hints:
        - The failed test run produced verbose output. CI logs for failed jobs often expose internal paths,
          tokens, or configuration that would not appear in a success.
        - Look for credential or token material in the CI job log for the failed build. Verbose error
          output sometimes includes authentication material bound to the build environment.
        - Fetch the log for the failed CI run referenced in the handover. A token that appears in the
          error output has a specific scope — read what resource it authorizes.
        completion:
          mode: automatic_range_evidence
      - id: T03.3
        title: What installation really runs
        description: Inspect the supplied training package without installing it. Recover the extra action
          installation would trigger, including the data involved and its destination.
        difficulty: easy
        points: 50
        hints:
        - The supplied training package is an archive that can be inspected without running it. Its structure
          names what it does.
        - Inspect the package manifest and its entry point source. The exports describe what the package
          does when installed.
        - Unpack the package archive and read its package.json and main module. The exports tell you what
          the package produces when called.
        completion:
          mode: automatic_range_evidence
      - id: T03.4
        title: A release they will consume
        description: Deliver a compatible training formatter that adds Cinder's rehearsal marker to the
          intended consumer's delivery report.
        difficulty: medium
        points: 100
        hints:
        - The rehearsal endpoint accepts a compatible package and runs it against a named tenant. The
          existing package gives you the interface contract.
        - Build a package that implements the same interface as the supplied one but adds the diagnostic
          output the handover requests. Publish it before submitting it to the rehearsal.
        - Publish a new package version that satisfies the interface contract and adds the extra field
          named in the handover. Then invoke the rehearsal endpoint with that version and the target tenant.
        completion:
          mode: automatic_range_evidence
    - id: T04
      chapter: State
      title: Trust the instrument
      allocation:
        easy: 2
        medium: 2
      cards:
      - id: T04.1
        title: Which value is real
        description: Read the supplied training-tank observation and recover how much water it actually
          contains, distinguishing the measurement from the requested level.
        difficulty: easy
        points: 50
        hints:
        - The training tank produces observation readings. The observation record contains multiple values;
          only one represents the current physical state of the tank.
        - Compare the observation fields with the sensor specification in the handover. The spec identifies
          which measurement is the authoritative current reading.
        - Read the observation record and the sensor spec. The field whose units match the spec's primary
          measurement is the authoritative value.
        completion:
          mode: automatic_range_evidence
      - id: T04.2
        title: The light behind the number
        description: Decode the supplied controller status capture and identify the condition preventing
          the practice outlet from moving.
        difficulty: easy
        points: 50
        hints:
        - The controller status capture is encoded. The handover includes the encoding specification.
        - The encoding is a standard binary format described in the handover. Decode each field according
          to the field map in the spec.
        - Apply the byte layout from the handover's controller status spec to the capture bytes. The decoded
          field at the named offset gives the current mode identifier.
        completion:
          mode: automatic_range_evidence
      - id: T04.3
        title: A request is not a movement
        description: Move the specified bounded amount of water through the training outlet and verify
          the transfer from the tank's observations.
        difficulty: medium
        points: 100
        hints:
        - The control interface accepts bounded release commands. The handover specifies the target amount
          and the command format.
        - The release command requires a signed request that binds the amount to the current session.
          Look for the signing mechanism in the handover or the client documentation.
        - Construct a release command for the specified amount using the session credential and the request
          format in the handover. Submit it to the control endpoint and confirm the acceptance receipt.
        completion:
          mode: automatic_range_evidence
      - id: T04.4
        title: Yesterday's green light
        description: The training report says the latest outlet test succeeded, but the observations disagree.
          Determine what actually happened during this attempt and explain the discrepancy through the
          supplied evidence.
        difficulty: medium
        points: 100
        hints:
        - The training report states that the outlet test passed. The independent physical record of the
          test result may disagree.
        - Look for the instrument or audit record that independently recorded the outlet test outcome.
          It is a different data source than the report.
        - Query the instrument record for the outlet named in the report. Compare its value for the test
          period with what the report claims.
        completion:
          mode: automatic_range_evidence
    operation_count: 4
    card_count: 16
    score_total: 1000
  keplerops:
    title: KeplerOps
    operations:
    - id: K01
      chapter: Borrowed desk
      title: Desk drawer
      allocation:
        easy: 4
      cards:
      - id: K01.1
        title: The developer left a way back
        description: The workstation is yours, but the FieldKest repositories still expect an identity.
          Recover the developer's usable repository access and retrieve the current project handover.
        difficulty: easy
        points: 50
        hints:
        - Begin with the developer workspace, service notes, and normal source clients. The supplied credentials
          artifact carries the relevant lead; check its provenance and references before contacting another
          service.
        - Treat this as retained client identity and authorization-scope analysis. Observe the ordinary
          and denied cases first, then change one input at a time and keep every unrelated binding fixed.
        - Inspect the supplied credentials artifact and the normal client documentation it names. Record
          the normal result and a denied variant, alter one dimension, and keep the service-owned evidence
          needed to explain the difference.
        completion:
          mode: automatic_range_evidence
      - id: K01.2
        title: The tab that survived
        description: The developer closed the support portal before leaving. Recover the unfinished ARWC
          conversation retained by the browser.
        difficulty: easy
        points: 50
        hints:
        - Begin with the developer workspace, service notes, and normal source clients. Start from source.keplerops.test's
          published client document and records already earned in this operation, not from an invented
          endpoint.
        - Treat this as retained client identity and authorization-scope analysis. Observe the ordinary
          and denied cases first, then change one input at a time and keep every unrelated binding fixed.
        - Review the published client document and ordinary records for source.keplerops.test. Record
          the normal result and a denied variant, alter one dimension, and keep the service-owned evidence
          needed to explain the difference.
        completion:
          mode: automatic_range_evidence
      - id: K01.3
        title: Outside the working folder
        description: A release review refers to a work file missing from the checkout. Find the developer's
          exposed copy and recover the unresolved review comments.
        difficulty: easy
        points: 50
        hints:
        - Begin with the developer workspace, service notes, and normal source clients. The supplied fieldlink
          7.4.2 review.md artifact carries the relevant lead; check its provenance and references before
          contacting another service.
        - Treat this as retained client identity and authorization-scope analysis. Observe the ordinary
          and denied cases first, then change one input at a time and keep every unrelated binding fixed.
        - Inspect the supplied fieldlink 7.4.2 review.md artifact and the normal client documentation
          it names. Record the normal result and a denied variant, alter one dimension, and keep the service-owned
          evidence needed to explain the difference.
        completion:
          mode: automatic_range_evidence
      - id: K01.4
        title: Put it on the workbench
        description: The local FieldKest helper has an unfinished support-report job. Make it produce
          a fresh inspection summary from the developer's supplied sample, with that sample's asset and
          revision correctly represented.
        difficulty: easy
        points: 50
        hints:
        - Begin with the developer workspace, service notes, and normal source clients. The supplied local
          helper.md artifact carries the relevant lead; check its provenance and references before contacting
          another service.
        - Treat this as retained client identity and authorization-scope analysis. Observe the ordinary
          and denied cases first, then change one input at a time and keep every unrelated binding fixed.
        - Inspect the supplied local helper.md artifact and the normal client documentation it names.
          Record the normal result and a denied variant, alter one dimension, and keep the service-owned
          evidence needed to explain the difference.
        completion:
          mode: automatic_range_evidence
    - id: K02
      chapter: Borrowed desk
      title: The first green report
      allocation:
        easy: 2
        medium: 1
      cards:
      - id: K02.1
        title: The missing fixture
        description: The report test has been failing since its reference fixture disappeared. Recover
          the fixture from the development artifacts so the intended report is visible again.
        difficulty: easy
        points: 50
        hints:
        - Begin with the retained source history and the continuous-integration review workflow. The failing-job
          note identifies a repository revision, so the removed fixture should be sought in version history
          rather than the current tree.
        - This stage is version-history recovery. Keep the named revision and fixture path bound together;
          importer behavior is a later boundary.
        - Compare the revision in the failing-job note with the repository history, then inspect the change
          that removed the named fixture without restoring unrelated files.
        completion:
          mode: automatic_range_evidence
      - id: K02.2
        title: An input outside its lane
        description: The test importer is supposed to accept only job inputs. Make it expose the separate
          review note that the ordinary test view withholds.
        difficulty: easy
        points: 50
        hints:
        - Stay with the continuous-integration client and compare the importer's accepted job namespace
          with the object it actually resolves. The ordinary form is the baseline, not the complete boundary.
        - This is path resolution before authorization. Test whether a job-relative reference remains
          inside the intended input collection after normalization.
        - Submit one ordinary job input and one minimally changed relative reference, then compare the
          resolved object and denial evidence before trying a second variation.
        completion:
          mode: automatic_range_evidence
      - id: K02.3
        title: Green, with our changes
        description: Change the report produced by the test job while keeping the interface its caller
          expects. The support engineer should receive Cinder's version with a successful job result.
        difficulty: medium
        points: 100
        hints:
        - Begin with the retained source history and the continuous-integration review workflow. Start
          from ci.keplerops.test's published client document and records already earned in this operation,
          not from an invented endpoint.
        - Treat this as version-history recovery followed by importer-boundary and extension-point analysis.
          Establish the denied and ordinary baselines first, then vary only the boundary input the service
          is meant to bind.
        - Review the published client document and ordinary records for ci.keplerops.test. Read the current
          revision, submit one minimal variation, and compare the resulting audit and unaffected fields
          with the baseline.
        completion:
          mode: automatic_range_evidence
    - id: K03
      chapter: Borrowed desk
      title: Quiet callback
      allocation:
        medium: 1
        hard: 2
      cards:
      - id: K03.1
        title: Our predecessor's desk
        description: Someone from Cinder worked this lead before you. Recover the staging artifact buried
          in their retained document and identify the collection it belongs to.
        difficulty: medium
        points: 100
        hints:
        - Begin with the predecessor notes, staged attachments, and the workstation analysis helper. Start
          from ci.keplerops.test's published client document and records already earned in this operation,
          not from an invented endpoint.
        - Treat this as layered payload reconstruction with integrity and callback correlation. Observe
          the ordinary and denied cases first, then change one input at a time and keep every unrelated
          binding fixed.
        - Review the published client document and ordinary records for ci.keplerops.test. Record the
          normal result and a denied variant, alter one dimension, and keep the service-owned evidence
          needed to explain the difference.
        completion:
          mode: automatic_range_evidence
      - id: K03.2
        title: The script inside the script
        description: The recovered staging material conceals another stage. Reconstruct the usable script
          and recover the instructions needed to understand what the earlier operator collected.
        difficulty: hard
        points: 200
        hints:
        - Begin with the predecessor notes, staged attachments, and the workstation analysis helper. The
          supplied staging decoder.ps1 artifact carries the relevant lead; check its provenance and references
          before contacting another service.
        - Treat this as layered payload reconstruction with integrity and callback correlation. Observe
          the ordinary and denied cases first, then change one input at a time and keep every unrelated
          binding fixed.
        - Inspect the supplied staging decoder.ps1 artifact and the normal client documentation it names.
          Record the normal result and a denied variant, alter one dimension, and keep the service-owned
          evidence needed to explain the difference.
        completion:
          mode: automatic_range_evidence
      - id: K03.3
        title: Finish the callback
        description: Reconstruct the earlier operation's callback configuration and recover its lost collection.
          Find out what it learned about the unresolved ARWC maintenance ticket.
        difficulty: hard
        points: 200
        hints:
        - Begin with the predecessor notes, staged attachments, and the workstation analysis helper. The
          supplied local helper.md artifact carries the relevant lead; check its provenance and references
          before contacting another service.
        - Treat this as layered payload reconstruction with integrity and callback correlation. Build
          a local model from the supplied reference cases, then confirm it explains both accepted and
          rejected behavior.
        - Inspect the supplied local helper.md artifact and the normal client documentation it names.
          Extract the supplied cases into a small local reproducer and do not use its result until every
          reference case matches.
        completion:
          mode: automatic_range_evidence
    - id: K04
      chapter: Borrowed desk
      title: The native indexer
      allocation:
        hard: 1
        expert: 1
        elite: 2
      cards:
      - id: K04.1
        title: A bundle with consequences
        description: The support indexer treats uploaded bundles as routine work. Construct a bundle that
          causes a controlled change beyond the object it should be allowed to affect.
        difficulty: hard
        points: 200
        hints:
        - Begin with the offline indexer reproducer and its protected runtime service. The supplied indexer
          client.json artifact carries the relevant lead; check its provenance and references before contacting
          another service.
        - Treat this as binary layout analysis followed by a tightly bounded memory-state change. Observe
          the ordinary and denied cases first, then change one input at a time and keep every unrelated
          binding fixed.
        - Inspect the supplied indexer client.json artifact and the normal client documentation it names.
          Record the normal result and a denied variant, alter one dimension, and keep the service-owned
          evidence needed to explain the difference.
        completion:
          mode: automatic_range_evidence
      - id: K04.2
        title: Read past the index
        description: Use the compromised indexing behavior to recover protected runtime information that
          an ordinary bundle cannot see.
        difficulty: expert
        points: 400
        hints:
        - Begin with the offline indexer reproducer and its protected runtime service. Start from indexer.keplerops.test's
          published client document and records already earned in this operation, not from an invented
          endpoint.
        - Treat this as binary layout analysis followed by a tightly bounded memory-state change. Carry
          forward only earned identities and record bindings; possession of a copied identifier alone
          does not cross the next boundary.
        - Review the published client document and ordinary records for indexer.keplerops.test. Replay
          the preceding evidence through the next documented boundary and verify the downstream service,
          not the client, records the outcome.
        completion:
          mode: automatic_range_evidence
      - id: K04.3
        title: Control the allocation
        description: The indexer still restricts what your corrupted object can influence. Establish a
          controlled write capability under those restrictions and demonstrate it against the designated
          protected state.
        difficulty: elite
        points: 800
        hints:
        - Begin with the offline indexer reproducer and its protected runtime service. Start from indexer.keplerops.test's
          published client document and records already earned in this operation, not from an invented
          endpoint.
        - Treat this as binary layout analysis followed by a tightly bounded memory-state change. Observe
          the ordinary and denied cases first, then change one input at a time and keep every unrelated
          binding fixed.
        - Review the published client document and ordinary records for indexer.keplerops.test. Record
          the normal result and a denied variant, alter one dimension, and keep the service-owned evidence
          needed to explain the difference.
        completion:
          mode: automatic_range_evidence
      - id: K04.4
        title: The exception queue
        description: Turn the indexer compromise into execution under its service identity. Recover the
          release-exception queue the support engineer has been trying to clear.
        difficulty: elite
        points: 800
        hints:
        - Begin with the offline indexer reproducer and its protected runtime service. Start from indexer.keplerops.test's
          published client document and records already earned in this operation, not from an invented
          endpoint.
        - Treat this as binary layout analysis followed by a tightly bounded memory-state change. Correlate
          independently owned records by identity, revision, units, and scope instead of trusting a display
          label.
        - Review the published client document and ordinary records for indexer.keplerops.test. Join the
          independent records on their stable identifiers and revisions, then explain any mismatch before
          acting on it.
        completion:
          mode: automatic_range_evidence
    - id: K05
      chapter: Package line
      title: What the customer installs
      allocation:
        easy: 2
        medium: 2
      cards:
      - id: K05.1
        title: Speak the package's language
        description: Find the package interface used by the ARWC connector and make its documented example
          produce a valid result.
        difficulty: easy
        points: 50
        hints:
        - Begin with the package registry metadata, retained release records, and consumer fixtures. Its
          published client document exposes the consumer check and metadata operation, so use that ordinary
          contract instead of guessing a path.
        - Treat this as package-contract reconciliation across metadata, manifests, and isolated resolution.
          Separate the authoritative service record from stale or local copies, and preserve its identity,
          revision, and scope.
        - Locate the consumer check and metadata operation in the published client reference. Capture
          one ordinary response and one denial, then correlate the returned identifiers with evidence
          already earned.
        completion:
          mode: automatic_range_evidence
      - id: K05.2
        title: The version they kept
        description: The visible package listing skips an older release mentioned in the support ticket.
          Recover the retained version record and its maintenance note.
        difficulty: easy
        points: 50
        hints:
        - Begin with the package registry metadata, retained release records, and consumer fixtures. Its
          published client document exposes the release and conversation operation, so use that ordinary
          contract instead of guessing a path.
        - Treat this as package-contract reconciliation across metadata, manifests, and isolated resolution.
          Observe the ordinary and denied cases first, then change one input at a time and keep every
          unrelated binding fixed.
        - Locate the release and conversation operation in the published client reference. Record the
          normal result and a denied variant, alter one dimension, and keep the service-owned evidence
          needed to explain the difference.
        completion:
          mode: automatic_range_evidence
      - id: K05.3
        title: Two manifests disagree
        description: The release manifest and the customer's recorded selection do not describe the same
          dependency. Reconcile the two and recover the exact discrepancy.
        difficulty: medium
        points: 100
        hints:
        - Begin with the package registry metadata, retained release records, and consumer fixtures. Its
          published client document exposes the reconcile operation, so use that ordinary contract instead
          of guessing a path.
        - Treat this as package-contract reconciliation across metadata, manifests, and isolated resolution.
          Observe the ordinary and denied cases first, then change one input at a time and keep every
          unrelated binding fixed.
        - Locate the reconcile operation in the published client reference. Record the normal result and
          a denied variant, alter one dimension, and keep the service-owned evidence needed to explain
          the difference.
        completion:
          mode: automatic_range_evidence
      - id: K05.4
        title: Selection has consequences
        description: Demonstrate which dependency the check consumer really chooses from the available
          candidates. The answer must come from consumed behavior, not the release label.
        difficulty: medium
        points: 100
        hints:
        - Begin with the package registry metadata, retained release records, and consumer fixtures. Its
          published client document exposes the resolver operation, so use that ordinary contract instead
          of guessing a path.
        - Treat this as package-contract reconciliation across metadata, manifests, and isolated resolution.
          Observe the ordinary and denied cases first, then change one input at a time and keep every
          unrelated binding fixed.
        - Locate the resolver operation in the published client reference. Record the normal result and
          a denied variant, alter one dimension, and keep the service-owned evidence needed to explain
          the difference.
        completion:
          mode: automatic_range_evidence
    - id: K06
      chapter: Package line
      title: House package
      allocation:
        medium: 3
      cards:
      - id: K06.1
        title: House credentials
        description: The importer can retrieve material the developer cannot read directly. Recover usable
          authority over the release channel consumed by FieldKest customers.
        difficulty: medium
        points: 100
        hints:
        - Begin with the package import, publisher, and rehearsal-consumer services. Its published client
          document exposes the import operation, so use that ordinary contract instead of guessing a path.
        - Treat this as publisher credential scope and package publication without release-administration
          authority. Observe the ordinary and denied cases first, then change one input at a time and
          keep every unrelated binding fixed.
        - Locate the import operation in the published client reference. Record the normal result and
          a denied variant, alter one dimension, and keep the service-owned evidence needed to explain
          the difference.
        completion:
          mode: automatic_range_evidence
      - id: K06.2
        title: A private package in the wrong view
        description: Your publication identity still cannot read the private support package. Cross the
          package-view boundary and recover its protected contents.
        difficulty: medium
        points: 100
        hints:
