    - id: W13
      chapter: Maintenance
      title: Window on Thursday
      allocation:
        easy: 2
        medium: 2
      cards:
      - id: W13.1
        title: Window on Thursday
        description: Recover the upcoming outlet-inspection appointment and its maintenance reference.
        difficulty: easy
        points: 50
        hints:
        - The contractor portal publishes its client document at contractor-portal.arwc.test/.well-known/arwc-client.
          Traverse the published client reference graph — start from any service already reached and follow
          the related links until you find the contractor portal service.
        - The contractor portal client document lists the contractors.appointment-window route. Use your
          corporate session to call it. No additional credential or session is required for this step.
        - The route returns APT-CRR-2026-09-18 with inspection=INSP-CRR-2026-09-18, asset=AST-CRR-017,
          and Thursday 09:00-11:00. Record all fields — appointment_id, inspection, asset, and window
          are needed for W13.2 and later cards.
        completion:
          mode: automatic_range_evidence
      - id: W13.2
        title: Who is expected at the gate
        description: Recover the separate access roster for the inspection crew and identify the relevant
          contractor assignment.
        difficulty: easy
        points: 50
        hints:
        - The contractor portal client document also exposes contractors.expected-visitors. This is a
          separate route from contractors.appointment-window — the appointment record does not contain
          the full roster. Call it with your corporate session.
        - The roster record is ROSTER-CRR-SEP18-R2, held separately from the appointment. It identifies
          the actual contractor who should appear at the gate, not just the appointment owner. Record
          the identity and assignment fields.
        - The roster gives you identity=veybridge.tech.204 and assignment=CTR-VEY-204. These differ from
          the appointment's attendee field. They are needed to construct the correct check-in in W13.3.
        completion:
          mode: automatic_range_evidence
      - id: W13.3
        title: An appointment we do not own
        description: Replace the registered attendee on the outlet-inspection appointment with the contractor
          identity in Cinder's assignment, despite lacking the appointment owner's rights.
        difficulty: medium
        points: 100
        hints:
        - The contractors.appointment route expects appointment_id and expected_revision (from W13.1),
          attendee and caller_organization from the W13.2 roster, and the immutable inspection, asset,
          and window unchanged. Both W13.1 and W13.2 must be completed first.
        - The route checks that the attendee belongs to your contractor organization — validated against
          the roster. But it does not check if your organization is the appointment owner. Supply the
          roster identity (veybridge.tech.204) and Veybridge Technical Services as the caller organization.
        - 'After the update: attendee=veybridge.tech.204 and owner_organization=Northbank Civil Inspections
          is unchanged. Inspection, asset, and window are immutable. Record the updated revision for W13.4.'
        completion:
          mode: automatic_range_evidence
      - id: W13.4
        title: Checked in as the contractor
        description: Cross the check-in service's separate identity boundary and establish the contractor
          session for the correct inspection scope.
        difficulty: medium
        points: 100
        hints:
        - contractors.check-in requires appointment_id (W13.1), roster_id (W13.2), and identity=veybridge.tech.204
          (W13.2 roster identity). The W13.3 BOLA already set the appointment attendee to match your identity,
          so the check-in service accepts it.
        - After a successful check-in, the returned contractor_session is a real ERPNext-issued session
          token. Use it as a bearer token to call contractors.field-kit — the protected field-work record
          for the inspection scope.
        - The field-kit record (FIELD-BAG-CRR-4417-R3) names the expected outlets and service manifest
          for the inspection. The contractor session scope is field-work:read. Record the contractor_session
          token for downstream use in W14+.
        completion:
          mode: automatic_range_evidence
    - id: W14
      chapter: Maintenance
      title: The field bag
      allocation:
        easy: 1
        medium: 2
      cards:
      - id: W14.1
        title: The field bag
        description: Recover the inspection's field export from the contractor workspace.
        difficulty: easy
        points: 50
        hints:
        - The contractor portal client document exposes contractors.field-kit. Use the contractor session
          from W13.4 as the bearer token. A corporate session alone returns 403.
        - The route returns FIELD-BAG-CRR-4417-R3 with inspection=INSP-CRR-2026-09-18 and asset=AST-CRR-017.
          Record the expected outlets (OG-CRR-02) and the service manifest with both legacy and current
          endpoints.
        - The service manifest distinguishes the retired legacy endpoint (field-read-legacy.arwc.test)
          from the current endpoint (process-read.arwc.test). Record both — W14.2 and W14.3 need the manifest
          to identify which endpoint carries current data.
        completion:
          mode: automatic_range_evidence
      - id: W14.2
        title: The service that replaced it
        description: Distinguish the obsolete field-service reference from the active process-data service
          and identify the current read contract.
        difficulty: medium
        points: 100
        hints:
        - The field-read-legacy.arwc.test endpoint referenced in the W14.1 field bag is retired — it returns
          HTTP 410 for all requests. Use the field.instrument route in the field-gateway client document
          instead.
        - Call the field.instrument route with your W13.4 contractor session. It returns the live service
          manifest from the field bag. The manifest identifies field-read-legacy.arwc.test as retired
          and process-read.arwc.test as the active service.
        - The active service uses process-read/v2 with CBOR encoding and inspection-scoped authentication
          at revision 21. Record all three — they are required to build the correct read request in W14.3.
        completion:
          mode: automatic_range_evidence
      - id: W14.3
        title: A fresh reading from the field
        description: Adapt the contractor's retained field client to the current read interface. Recover
          fresh outlet observations under the inspection's correct asset scope.
        difficulty: medium
        points: 100
        hints:
        - The active service from W14.2 is process-read/v2 with CBOR encoding. The retained fieldbag/v1
          client sends JSON — that is not accepted. Build a CBOR map with keys asset, group, observed_at,
          and nonce as required by process-read/v2.
        - 'The asset must match the inspection asset (AST-CRR-017) and the group must be OG-CRR-02 (from
          the expected_outlets in the field bag). Use a fresh observed_at timestamp (within 10 minutes)
          and a unique nonce. Submit with Content-Type: application/cbor and your W13.4 contractor session.'
        - The route returns FEED-OG2-R21 with observations for FIT-CRR-204A and FIT-CRR-204B, the instruments
          for OG-CRR-02. These are real readings from the OT operating-history service. Record the result
          for downstream use in the W14.READ arc.
        completion:
          mode: automatic_range_evidence
    - id: W15
      chapter: Maintenance
      title: The cached drawing
      allocation:
        medium: 1
        hard: 2
        expert: 1
      cards:
      - id: W15.1
        title: Which drawing did the cache keep
        description: Recover the restricted cache association for the maintenance drawing and identify
          the version the review workflow will serve.
        difficulty: medium
        points: 100
        hints:
        - The maintenance-review service publishes its client document at maintenance-review.arwc.test/.well-known/arwc-client.
          Traverse the client reference graph starting from any service already reached and follow the
          related links to find the maintenance-review service.
        - The maintenance.drawing-cache route requires your W13.4 contractor session as the bearer token.
          Use the same session earned from the check-in. A corporate session alone returns 403.
        - The cache association identifies CACHE-DRW-OG2-R8 binding drawing DRW-OG2-R8 at revision R8
          to reviewer queue REV-CRR-4417 at drawings.arwc.test. Record all fields — the drawing identity,
          revision, and queue are needed for W15.2 and later cards.
        completion:
          mode: automatic_range_evidence
      - id: W15.2
        title: A drawing of our choosing
        description: Make the maintenance viewer serve your controlled response for the designated cached
          drawing while preserving its expected identity.
        difficulty: hard
        points: 200
        hints:
        - 'The drawing-cache-update route accepts a controlled HTML body from the allowlisted preview
          origin preview-cinder.arwc.test. Set X-Preview-Origin: https://preview-cinder.arwc.test and
          submit your controlled response with cache path /viewer/drawings/DRW-OG2-R8, preserving drawing_id
          and revision.'
        - The controlled body must be CRLF-free HTML. After a successful cache update (201), trigger the
          reviewer browser via POST /api/drawing-approvals with cache_key=GET:/viewer/drawings/DRW-OG2-R8
          and reviewer_queue=REV-CRR-4417 using your W13.4 contractor session.
        - The reviewer browser accepts the postMessage from a nested iframe despite a source-mismatch
          in the event handler. A successful run returns CAP-REVIEW-CRR-4417 with review-submit scope,
          which is the prerequisite for W15.3.
        completion:
          mode: automatic_range_evidence
      - id: W15.3
        title: The reviewer trusts the drawing
        description: Use the controlled drawing delivery to obtain the reviewer's private maintenance-review
          submission capability.
        difficulty: hard
        points: 200
        hints:
        - After completing the W15.2 cache update, call POST maintenance.drawing-approvals (from the client
          document) with cache_key=GET:/viewer/drawings/DRW-OG2-R8 and reviewer_queue=REV-CRR-4417. Use
          your W13.4 contractor session.
        - 'The service runs the real Chromium 128 reviewer browser on the controlled drawing you poisoned
          in W15.2. The reviewer''s JavaScript accepts the postMessage without checking event.source,
          which is the source_check: "omitted" flaw.'
        - The returned CAP-REVIEW-CRR-4417 with source_check="omitted" and browser="Chromium 128" is the
          submission capability for the reviewer session. Record the review_capability token — it is the
          access token for W15.4.
        completion:
          mode: automatic_range_evidence
      - id: W15.4
        title: Approval beyond the token
        description: Recover the protected maintenance approval through the downstream authority check
          that still restricts the review capability.
        difficulty: expert
        points: 400
        hints:
        - After obtaining the W15.3 review capability token, call POST maintenance.approval-token with
          review_capability, approval_id=APR-CRR-4417-R6, and inspection=INSP-CRR-2026-09-18. The endpoint
          validates the audience but not the capability's subject-to-inspection binding.
        - The review capability from W15.3 is scoped to DRW-OG2-R8 (the drawing). The approval endpoint
          accepts it for inspection INSP-CRR-2026-09-18 because it omits the subject-to-inspection comparison.
          This is the expert flaw that allows crossing from the drawing scope to the inspection approval.
        - The returned APR-CRR-4417-R6 has the real ERPNext maintenance binding (WO-CRR-4417, INSP-CRR-2026-09-18,
          AST-CRR-017) signed with Ed25519. Record the signing_public_key — it is the verification key
          for W26.
        completion:
          mode: automatic_range_evidence
    - id: W16
      chapter: Maintenance
      title: The instrument whispers
      allocation:
        medium: 1
        hard: 1
        expert: 1
        elite: 1
      cards:
      - id: W16.1
        title: The sequencer's vocabulary
        description: Recover the instrument's restricted sequence descriptor and reproduce the designated
          ordinary diagnostic observation.
        difficulty: medium
        points: 100
        hints:
        - Call GET retained-archive.arwc.test/api/sequencer-specs/current with your CORPORATE session
          to retrieve the SEQ-CRR-4 descriptor. It contains the opcode table, authorized index range,
          and the ordinary trace SEQ-BASE-17 with its program_hex.
        - 'Submit the ordinary trace with POST retained-archive.arwc.test/api/sequencer-programs and body
          {"program_hex": "0104000007000000"}. The program decodes as LOAD slot 4 (the zero reference)
          followed by HALT. The service checks that the descriptor was observed first.'
        - The expected result is authorized-load with cycles=228. Confirm the service-owned audit shows
          sequencer-program-submitted with the correct cycle count before proceeding to W16.2.
        completion:
          mode: automatic_range_evidence
      - id: W16.2
        title: An observation outside the window
        description: Demonstrate a controlled observation beyond the instrument's intended data window
          without abandoning its diagnostic interface.
        difficulty: hard
        points: 200
        hints:
        - The LOAD instruction reads the sample and adds its data-dependent cycle cost before the authorization
          check. Submit a program to POST /api/observations with LOAD on a slot index outside 0-31 and
          observe the status and cycle count in the response.
        - Any LOAD with index >= 32 returns late-authorization-rejection with a non-null boundary_index.
          The cycle cost 20 + 4 * bit_count(sample) is accumulated before the check, so the cycle count
          still encodes information about the out-of-window slot's bit population.
        - 'Target slot 159 for the designated crossing. Program bytes 01 9F 00 00 07 00 00 00 (LOAD 159,
          HALT), base64 AZ8AAAcAAAA=. Expected response: status=late-authorization-rejection, boundary_index=159,
          cycles=236.'
        completion:
          mode: automatic_range_evidence
      - id: W16.3
        title: An experiment with a signal
        description: Construct a sequencer experiment that distinguishes the specified protected conditions
          through its measurements. Establish an interpretation that holds across the supplied reference
          cases.
        difficulty: expert
        points: 400
        hints:
        - Use POST /api/signal-experiments with operation=measure and TEST (opcode 5) instructions. Each
          TEST(slot, probe) entry returns cycles = 1200 + 64*popcount(sample[slot] XOR probe) + jitter.
          Test slot 159 with probe=0 for the baseline and also test reference slots 4, 5, 6 to validate
          the formula.
        - For each bit i (0-7), submit TEST(159, 2**i). If cycles(probe=2^i) < cycles(probe=0), bit i
          is set. The ±64 cycle signal dominates the ±2 jitter. Work through all eight positions to recover
          the full byte.
        - After recovering the byte (165 = 0xA5), submit operation=verify with reference_values={"4":0,"5":1,
          "6":255}, target_slot=159, recovered_byte=165, repetitions=8, bit_order="lsb0". Success returns
          SEQ-DISCRIM-CRR-4 and sets the flag required for W16.4.
        completion:
          mode: automatic_range_evidence
      - id: W16.4
        title: What the instrument remembers
        description: Recover the protected calibration record through the constrained instrument interface
          and bind it to the retained field revision.
        difficulty: elite
        points: 800
        hints:
        - Slots 160-191 hold the 32-byte calibration record. Use POST /api/signal-experiments measure
          programs targeting those slots. Max 63 TEST instructions per program (64-instruction limit includes
          HALT), so cover 32 slots with 9 probes each across 5 programs.
        - 'Apply the W16.3 bit-discrimination to each of the 32 slots. Reconstruct all bytes, then verify
          the CRC32C: last 4 bytes must equal crc32c(first 28 bytes) in big-endian. If the check passes,
          the calibration is complete.'
        - Submit to POST /api/instrument-history/current with record_id="CAL-CRR-OG2-R8", field_revision="R8",
          calibration=base64(recovered_32_bytes), plus the standard sequencer/revision/request_id. Success
          returns revision=8 and slots=[160, 191].
        completion:
          mode: automatic_range_evidence
    - id: W17
      chapter: OT observation
      title: First live trace
      allocation:
        easy: 3
        medium: 1
      cards:
      - id: W17.1
        title: The reservoir's present tense
        description: Record the reservoir's current measured state from the live operator view. Keep measured
          values separate from the controller's accepted settings and bind both to one UTC observation
          time.
        difficulty: easy
        points: 50
        hints:
        - Navigate to FUXA (hmi.arwc.test) and open the Cairn Reach overview. The view shows live level,
          usable volume, two outlet positions (%), two outlet flows (m3/s), total flow, mode, and owner
          — all updated in real time from OPC UA tags polled from the PLC (opc.tcp://plc:4840/arwc, namespace
          urn:arwc:crr:tags).
        - The measured actuator position (CRR.PositionPct, CRR.PositionBPct from sensors) is shown separately
          from the accepted controller setpoint (CRR.RequestedTargetPct, CRR.RequestedTargetBPct). Record
          both columns with the same UTC observation time visible in FUXA or from the historian.
        - Verify against the PostgreSQL historian (ot_history.process_samples). Query SELECT DISTINCT
          ON (tags->>"variable") time, tags->>"variable", tags->>"unit", fields->>"value" FROM ot_history.process_samples
          ORDER BY tags->>"variable", time DESC to retrieve all 50 current tag values.
        completion:
          mode: automatic_range_evidence
      - id: W17.2
        title: The mode the plant is in
        description: Use the real operator and equipment views to identify the current controller mode,
          command owner, field-data state, and both outlet permissives at one UTC observation time.
        difficulty: easy
        points: 50
        hints:
        - The five fields come from FUXA crr-overview header and both outlet faceplates. Mode is CRR.AutoMode
          (false=manual), owner is CRR.Owner (0=local/HMI, 1=remote), field-data state is CRR.IoHealthy,
          and per-outlet permissives are CRR.PermissiveA and CRR.PermissiveB.
        - All five tags are in ot_history.process_samples. Query SELECT DISTINCT ON (tags->>"variable")
          time, tags->>"variable", fields->>"value" FROM ot_history.process_samples WHERE tags->>"variable"
          IN ("AutoMode","Owner","IoHealthy","PermissiveA","PermissiveB") ORDER BY tags->>"variable",
          time DESC.
        - Do not infer mode or owner from W17.1 — read the live tags at the current UTC time and bind
          all five fields to that same timestamp. The historian must confirm good-quality samples at the
          recorded time.
        completion:
          mode: automatic_range_evidence
      - id: W17.3
        title: The instrument in the note
        description: Use the installed engineering reference to map the outlet B physical instrument to
          its IEC variable, OPC UA NodeId, historian series, and unit. Verify that the live point exists.
        difficulty: easy
        points: 50
        hints:
        - Read ~/CairnReach/Briefs/W17/engineering-reference.md (reference CRR-ENG-INST-204B-R1). It maps
          the outlet B flow transmitter FIT-CRR-204B to IEC variable FlowBM3s, OPC UA NodeId, historian
          series, and unit. The reference describes the identity but does not supply a current value or
          confirm quality.
        - 'Confirm in the historian catalog: SELECT variable, series, node_id, unit FROM ot_history.tag_catalog
          WHERE series = ''flow_b_m3s''. The result must match the reference document exactly on all five
          fields.'
        - 'Verify the point is live: SELECT time, fields->>"value" FROM ot_history.process_samples WHERE
          tags->>"variable" = ''FlowBM3s'' ORDER BY time DESC LIMIT 1 confirms recent StatusGood samples.'
        completion:
          mode: automatic_range_evidence
      - id: W17.4
        title: The first live trace
        description: Correlate one bounded live outlet B observation across FUXA, the OPC UA controller
          point, and PostgreSQL process history. Establish that position and measured flow belong to the
          same interval and point.
        difficulty: medium
        points: 100
        hints:
        - Pick a 15-to-300-second interval and query ot_history.process_samples for FlowBM3s and PositionBPct.
          The five identities from W17.3 (variable=FlowBM3s, NodeId, series=flow_b_m3s, unit=m3/s, historian
          path) must all appear. Count samples with good transport quality. Do not use public.process_history
          (no B tags).
        - The position-to-flow relationship is required evidence. At PositionBPct=20%, FlowBM3s should
          be ~20% of the outlet B max capacity (0-0.5 m3/s, from ot_history.tag_catalog). Verify the ratio
          before recording the trace.
        - Record interval start/end UTC, good sample count, flow min/max/mean, and concurrent PositionBPct.
          All six of FUXA variable, OPC UA NodeId, historian series, unit, good sample count, and position-flow
          ratio must agree to supply W17.OBS.
        completion:
          mode: automatic_range_evidence
    - id: W18
      chapter: OT observation
      title: Tags that lie
      allocation:
        easy: 2
        medium: 2
      cards:
      - id: W18.1
        title: The tag export
        description: Identify the installed Cairn Reach native I/O register and prove that its revision
          and digest agree with the running controller and historian catalog.
        difficulty: easy
        points: 50
        hints:
        - Read ~/CairnReach/Briefs/W18/tag-register.csv (register CRR-IO-R364, project_revision=364, 6
          Modbus input registers PDU offset 0-5). Then read /usr/share/arwc-ot/tags.json on the OT engineering
          host to confirm its project_revision=364 matches.
        - 'Confirm the running revision via OPC UA: query nsu=urn:arwc:crr:tags;s=CRR.ProjectRevision
          from FUXA or the historian; it must equal 364. Then confirm all five process variable entries
          in ot_history.tag_catalog share register_sha256=df09d72a355340266896c59a204248e02aa277769f881e7a2f6ce6d15b6f7a3b.'
        - The five required process variables (non-heartbeat) are LevelM (%IW0), PositionPct (%IW1), FlowM3s
          (%IW2), PositionBPct (%IW4), FlowBM3s (%IW5). The Heartbeat (%IW3) is an I/O health counter
          only.
        completion:
          mode: automatic_range_evidence
      - id: W18.2
        title: The scale kept elsewhere
        description: Reconcile one outlet flow point across its Modbus register, OpenPLC address, raw
          type and scale, PLC value, OPC UA identity, and historian series.
        difficulty: easy
        points: 50
        hints:
        - 'From CRR-IO-R364, find FIT-CRR-204B: FC4, PDU offset 5, IEC address %IW5, raw FlowBRaw (UINT,
          10000 counts/m3/s), engineering FlowBM3s. The PDU offset (5) and IEC word offset (5 in %IW5)
          look the same here because address_base=0, but they are different addressing layers.'
        - The scale factor (10000 counts/m3/s) is in the register definition, NOT in the OPC UA tag name
          or historian series. A raw value of 1000 counts = 0.100 m3/s. Confirm the engineering value
          via FUXA and via ot_history.tag_catalog (variable=FlowBM3s, unit=m3/s).
        - 'Catalog query: SELECT variable, series, node_id, unit FROM ot_history.tag_catalog WHERE variable
          = ''FlowBM3s''. Returns flow_b_m3s, nsu=urn:arwc:crr:tags;s=CRR.FlowBM3s, m3/s. Record all seven
          layers to complete the binding.'
        completion:
          mode: automatic_range_evidence
      - id: W18.3
        title: Three clocks and a gap
        description: Use retained native history to identify a genuine collection gap and explain it using
          source time, collection time, ingestion time, transport quality, process quality, and engineering
          unit.
        difficulty: medium
        points: 100
        hints:
        - Read ~/CairnReach/Briefs/W18/history-provenance.md first. Run the LAG gap query against public.process_history
          with tag = 'flow_b_m3s' (series name, not OPC UA variable name FlowBM3s) and filter for transport_quality
          ILIKE '%Good%'. Order by source_gap DESC to find the largest gap.
        - 'The largest qualifying gap is about 1 day 3 hours 53 minutes: last good sample 2026-11-13 16:54:46
          UTC, next good sample 2026-11-14 20:48:19 UTC. This is a real collection interruption. Record
          all three timestamps and both quality fields for both bounding rows.'
        - Confirm unit=m3/s did not change across the gap (both sides show m3/s, value=0.100 m3/s). The
          gap is in source_time (the controller clock gap), not just display rows missing. A display gap
          alone does not prove a source-time gap.
        completion:
          mode: automatic_range_evidence
      - id: W18.4
        title: Which outlet answers
        description: Map both Cairn Reach outlet gates from native register channels to PLC values, OPC
          UA identities, historian series, and a time-aligned physical observation.
        difficulty: medium
        points: 100
        hints:
        - 'Build the A/B mapping from CRR-IO-R364: outlet A uses PDU offsets 1 (%IW1, PositionPct) and
          2 (%IW2, FlowM3s); outlet B uses PDU offsets 4 (%IW4, PositionBPct) and 5 (%IW5, FlowBM3s).
          Confirm all four OPC UA NodeIds and historian series from ot_history.tag_catalog.'
        - 'Choose a 1-second window in ot_history.process_samples and query all four variables at the
          same source_time. Verify physical consistency: at 20% position, flow should be ~20% of 0.5m3/s
          = 0.100 m3/s. Both outlets currently show 20% position and 0.100m3/s flow — symmetric.'
        - The observation must show both outlets' position AND flow at the same UTC timestamp with Good
          quality. Physical consistency (position matches flow for each outlet) is required. This supplies
          W18.MAP. Do not move either gate to manufacture evidence.
        completion:
          mode: automatic_range_evidence
    - id: W19
      chapter: OT observation
      title: The old diagnostic
      allocation:
        medium: 1
        hard: 2
        expert: 1
      cards:
      - id: W19.1
        title: The diagnostic nobody retired
        description: Recover the retained engineering diagnostic associated with the outlet records and
          identify its actual project family.
        difficulty: medium
        points: 100
        hints:
        - Use the CORPORATE session from the FieldLink handover. The process.diagnostic-program route
          in the published client reference points to the diagnostic endpoint at process-view.arwc.test.
          The binary in Gitea (clara.morivelle/retained-engineering-tools/engineering/diag-crr-mixed-19)
          is starting material for W19.2-W19.4, not the W19.1 answer path.
        - Authenticate with your CORPORATE Bearer token and call GET https://process-view.arwc.test/api/
          diagnostic-programs/current. The service returns an authoritative record with record_id, project_family,
          sha256, format, and ordinary_traces. Record the audit_id as fresh evidence.
        - Compare the returned project_family with the live CRR.ProjectRevision from FUXA or the historian
          (ot_history.tag_catalog variable=ProjectRevision). The gap between the diagnostic's project
          generation and the running system's revision is the finding.
        completion:
          mode: automatic_range_evidence
      - id: W19.2
        title: A second interpretation
        description: Reconstruct the diagnostic behavior that its initial analysis view does not explain
          and reproduce the supplied distinguishing result.
        difficulty: hard
        points: 200
        hints:
        - The binary has two entry points. The alternate path uses mixed_mode_entry which pushes CS=0x23
          (32-bit compatibility segment) and executes RETFQ. Use objdump -M intel -d to find the far return
          and the .code32 section. The alternate test record WRAP-FFFFFFFF-OG2 is embedded in the binary
          (visible via strings).
        - 'Implement the 32-bit decoder: value = (rotl32(value^byte, 5) + 0x9E3779B9) & 0xFFFFFFFF starting
          at 0x6D2B79F5. The 32-bit rotate is ((v<<5) | (v>>27)) & 0xFFFFFFFF. All wraps at 32 bits. The
          64-bit version without wraps produces a different value that the service rejects.'
        - 'POST https://process-view.arwc.test/api/signature-records/current/interpretation with CORPORATE
          Bearer: {"record":"WRAP-FFFFFFFF-OG2","rolling32":"<8-hex-digits>"}. Correct result returns
          DIAG-TRACE-COMPAT-19 with execution=i386-compatibility and sets compatibility_reproduced=True
          for W19.3.'
        completion:
          mode: automatic_range_evidence
      - id: W19.3
        title: The hidden check
        description: Recover the diagnostic's hidden validation logic well enough to reproduce its decisions
          on the specified engineering records.
        difficulty: hard
        points: 200
        hints:
        - W19.1 ordinary_traces gives rolling32 AND verifier64 for the first 4 records. The 5th is named
          protected_record. Implement the same verifier formula for all 5. The verifier takes the 32-bit
          rolling result and applies a 64-bit function embedded in the binary's long-mode verifier code.
        - 'Verifier formula: start v=0x243F6A8885A308D3 (pi constant). For each rolling32 r: v=ROTL64(v
          XOR (zero_extend(r)*0x100000001B3), 9). Final verifier64=v XOR zero_extend(r). The 64-bit constant
          and FNV-prime variant (0x100000001B3) are in the binary.'
        - 'POST https://process-view.arwc.test/api/signature-programs/current with CORPORATE Bearer: {"decisions":[{record,rolling32,verifier64}x5]}
          for all 5 in order. Service validates all and returns MIG-OG2-R19-R21 with verifier64 and decision=valid,
          sets hidden_check_recovered=True.'
        completion:
          mode: automatic_range_evidence
      - id: W19.4
        title: A map from the old diagnostic
        description: Use the reconstructed diagnostic to recover a valid mapping of the current outlet
          group from the supplied observations.
        difficulty: expert
        points: 400
        hints:
        - Use the process.diagnostic-program-legacy route from the engineering workbench client document
          (/.well-known/arwc-client). POST https://process-view.arwc.test/api/diagnostic-programs/legacy
          with CORPORATE Bearer. Gates on hidden_check_recovered (W19.3). Supplies W19.MAP.
        - 'Compute comparison_digest: SHA256 of the mapping JSON (sorted keys) with legacy_project=CRR-CTRL-R19,
          current_project=CRR-CTRL-R21, instruments={OUTLET_A:FIT-CRR-204A,OUTLET_B:FIT-CRR-204B}, legacy_identifiers={OUTLET_A:OG-CRR-02/GT-CRR-02A,OUTLET_B:OG-CRR-02/GT-CRR-02B}.
          Not in any file.'
        - 'Discover the observation: SELECT name, text, alarm_group FROM alarm_history WHERE alarm_group=''OG-CRR-02''
          to find the qualifying commissioning event name. Submit {"migration_record": "MIG-OG2-R19-R21","comparison_digest":"<sha256>","observation":"<event_name>"}.
          Returns MAP-OG2-LEGACY-R21 historical=true current_project=CRR-CTRL-R21. Do not replace the
          running revision.'
        completion:
          mode: automatic_range_evidence
    - id: W20
      chapter: OT observation
      title: Write before erase
      allocation:
        medium: 1
        hard: 2
      cards:
      - id: W20.1
        title: What the image kept
        description: Recover the retained maintenance record set through the supplied device interface
          and bind it to the inspection image.
        difficulty: medium
        points: 100
        hints:
        - 'Call GET https://independent-instruments.arwc.test/api/firmware-images/current with CORPORATE
          Bearer. Returns the image manifest (sha256, record layout: magic=F204, 64-byte records, 4096-byte
          erase pages) and the image base64. The image is also in Gitea clara.morivelle/retained-engineering-tools/instruments/.'
        - 'Parse 8192 bytes into 64-byte records. Valid record: magic=F204, CRC32C of bytes 0-55 at bytes
          56-59, commit=0x00 at byte 63. Payload at bytes 12+: record_id\0asset\0inspection_date null-separated.
          Status byte 10 (1=REVIEW, 2=ACCEPTED), status_bits byte 11. Highest sequence wins per record_id.'
        - 'POST https://independent-instruments.arwc.test/api/maintenance-records/current with CORPORATE
          Bearer: {image_sha256, record_id, asset, inspection_date, sequence, status, status_bits, crc32c,
          offset}. All 8 fields validated. Returns inspection record with fresh audit. Sets inspection_recovered=True.'
        completion:
          mode: automatic_range_evidence
      - id: W20.2
        title: A valid maintenance record
        description: Recover the last recorded outlet inspection from the retained maintenance image and
          establish whether its entry is valid under the image's record rules.
        difficulty: hard
        points: 200
        hints:
        - 'The W20.1 record has status=REVIEW. To promote it to ACCEPTED, write a new record at offset
          128 (the next erased slot, all 0xFF). NOR flash programming changes only 1→0, so writing to
          an erased slot is always valid. New record: sequence=119, status=0x02 (ACCEPTED), same asset/date
          as original.'
        - 'Build the 64-byte record: magic=F204, seq=119 (uint32 LE), payload_len=40 (uint16 LE), status=0x02,
          status_bits=0x01, payload at bytes 12-51, CRC32C of bytes 0-55 at bytes 56-59, 0xFFFFFF at 60-62,
          commit=0x00 at byte 63. Split: 3 operations at offsets 128 (56 bytes), 184 (4 bytes), 191 (1
          byte).'
        - 'POST https://independent-instruments.arwc.test/api/maintenance-records/current with CORPORATE
          Bearer: {"operations":[{kind,offset,data_b64}x3],"image_b64":"<modified_8192_bytes>"}. Service
          validates NOR semantics, confirms seq=119 status=ACCEPTED. Returns updated record. Sets image_rewrite_accepted=True.'
        completion:
          mode: automatic_range_evidence
      - id: W20.3
        title: Change one record, keep the rest
        description: Change the retained image so the outlet's last inspection is recorded as completed,
          preserving its asset identity, every unrelated record, and the image's required consistency.
        difficulty: hard
        points: 200
        hints:
        - Correcting inspection_date from 2026-09-18 to 2026-09-19 flips bit 0 of the ASCII '8' byte (0x38)
          to '9' (0x39) — a 0→1 transition requiring a page erase first. Submit erase page 0 as the first
          op, then rewrite all 3 records (CAL at 0, REVIEW at 64, corrected ACCEPTED seq=120 at 128).
        - '10 total operations: {"kind":"erase","page":0} + 3 program ops for CAL (offsets 0,56,63) +
          3 for REVIEW (offsets 64,120,127) + 3 for corrected record (offsets 128,184,191). The corrected
          record has seq=120, status=ACCEPTED, inspection_date=2026-09-19, and new CRC32C of its first
          56 bytes.'
        - Service validates NOR semantics, confirms seq=120 ACCEPTED date=2026-09-19, wear_counts=[18,9].
          Returns corrected record with audit_id. erase_rewrite_accepted=True in state after success.
        completion:
          mode: automatic_range_evidence
    - id: W21
      chapter: Engineering
      title: Which project is running
      allocation:
        easy: 1
        medium: 1
      cards:
      - id: W21.1
        title: The project and the note
        description: Open the supplied native controller project and commissioning note. Identify the
          project, main program, scheduled task, declared revision, and runtime target.
        difficulty: easy
        points: 50
        hints:
        - Read ~/CairnReach/Briefs/W21/deployment-note.md (CRR-PLC-COM-364) for five claims to verify.
          Open ~/CairnReach/controller in OpenPLC Editor or inspect directly. The commissioning note is
          starting material; the project files are authoritative.
        - 'project.json: name=arwc-site, task0 Cyclic T#100ms, program=main. devices/configuration.json:
          deviceBoard=OpenPLC Runtime v4, runtimeIpAddress=172.29.63.20. pous/programs/main.fbd: declared
          ProjectRevision : UINT := 364.'
        - 'Independently observe ProjectRevision from the live OT: query CRR.ProjectRevision from FUXA
          or ot_history.tag_catalog. Confirm the running value (364) matches the saved project''s declared
          value. Do not compile, upload, start, stop, or force anything.'
        completion:
          mode: automatic_range_evidence
      - id: W21.2
        title: Which project is running
        description: Use the normal OpenPLC debug and Runtime Status views to determine whether the saved
          project is the program currently running on the Cairn Reach controller.
        difficulty: medium
        points: 100
        hints:
        - Compile the saved project in OpenPLC Editor, connect to the runtime at 172.29.63.20:8443 without
          accepting any upload offer. The editor's compiled-program MD5 must match the runtime's readProgramMd5.
          Authenticate to the Runtime API (POST /api/login) to query GET /api/status for running state.
        - 'The program MD5 (from the debug channel or /api/readProgramMd5) is not in any shipped file
          — it proves which compiled binary is scanning. Also verify: runtime state=STATUS:RUNNING, no
          active forces, and live ProjectRevision=364 from the editor debugger or OT historian.'
        - 'All four conditions required: program MD5 match, STATUS:RUNNING, no forces, live ProjectRevision=364.
          A connection alone is insufficient. The program MD5 and runtime state are the independent live
          evidence. This supplies W21.REVISION.'
        completion:
          mode: automatic_range_evidence
    - id: W22
      chapter: Engineering
      title: The sealed project
      allocation:
        medium: 1
        hard: 2
        expert: 1
      cards:
      - id: W22.1
        title: The viewer in the delivery
        description: Recover the usable protected viewer from the retained engineering delivery and bind
          it to the sealed project.
        difficulty: medium
        points: 100
        hints:
        - Call GET https://process-view.arwc.test/api/sealed-projects/current/viewer with CORPORATE Bearer.
          Returns the delivery record with five binding fields plus SHA256 values and binary artifacts.
          Sets viewer_observed=True in state for W22.2+.
        - The viewer binary is also at clara.morivelle/retained-engineering-tools/engineering/sealed-viewer
          in Gitea. Compute its SHA256 to verify against the service response viewer_sha256. The delivery
          IDs and SHA256 are not in any shipped file — they come from the service call.
        - Record all five binding fields (delivery_id, viewer_id, viewer_language, platform, project_id)
          and viewer_sha256. The ordinary_cases field supplies reference cases for W22.2+. This establishes
          the delivery-to-binary binding.
        completion:
          mode: automatic_range_evidence
      - id: W22.2
        title: The machine inside the viewer
        description: Reconstruct the viewer's embedded instruction behavior and reproduce the designated
          program fragments.
        difficulty: hard
        points: 200
        hints:
        - 'W22.1 ordinary_cases has 4 programs (program_b64, base64-encoded 6-byte-aligned bytecode).
          The expected results are NOT included — implement the 16-bit VM from the architecture description
          or by analyzing the sealed-viewer binary: 4 registers, 256 bytes memory, 6-byte LE instructions,
          4096 cap.'
        - '8 opcodes: MOVI/LOAD8/XOR/ADD/ROTL/STORE8/JNZ/HALT with 16-bit wrap arithmetic. LOAD8 zero-extends
          memory[(reg[src]+imm)&0xFF]. STORE8 writes reg[src]&0xFF. ROTL uses imm&15. JNZ adds signed
          imm to PC only if zero flag is false. Each result needs registers, SHA256(memory[0x40:0x80]),
          and steps.'
        - 'POST https://process-view.arwc.test/api/sealed-viewers/current/execute with CORPORATE Bearer:
          {"cases":[result_0,result_1,result_2,result_3]}. Verify all 4 match the reference cases. Returns
          VIEW-VM-R5 with full VM spec. Sets vm_reconstructed=True for W22.3+.'
        completion:
          mode: automatic_range_evidence
      - id: W22.3
        title: The decision inside the sealed project
        description: Open the sealed engineering project and recover the commissioning decision omitted
          from the business report. Establish which project revision the decision concerns.
        difficulty: hard
        points: 200
        hints:
        - The W22.1 service response includes program_b64 (the viewer program) and package_b64 (the sealed
          project package). Run the viewer program through your W22.2 reconstructed 16-bit VM to completion.
          Record the final register values (r0–r3) and memory[0x40:0x80].
        - 'Derive the AES-256-GCM key from VM final state. SHA-256 of: ASCII "CRR-SEALED-PKG-R7", a NUL
          byte (0x00), memory[0x40:0x80] (64 bytes), LE16(r0), LE16(r1), LE16(r2), LE16(r3). Decrypt the
          sealed package — first 12 bytes are the nonce, remaining bytes are ciphertext+tag, AAD is "CRR-SEALED-PKG-R7".
          Verify locally first.'
        - Submit POST https://process-view.arwc.test/api/sealed-projects/current with CORPORATE Bearer
          and body {"project_id":"CRR-SEALED-PKG-R7","key_hex":"<64-hex-chars>"}. A wrong key returns
          409 with no partial plaintext. On success, service returns 201 with commissioning decision record
          DEC-CRR-OG2-R7 and the retained review helper binary.
        completion:
          mode: automatic_range_evidence
      - id: W22.4
        title: The reviewer who was never listed
        description: The opened project includes a commissioning review helper whose recorded archive
          access does not match its apparent behavior or the listed reviewers. Recover the concealed review
          identity and use its access in the retained review context to obtain the withheld commissioning
          comparison.
        difficulty: expert
        points: 400
        hints:
        - Run the ReviewHelper.dll from W22.3 two ways — normally (dotnet ReviewHelper.dll) and with ReadyToRun
          disabled (COMPlus_ReadyToRun=0 dotnet ReviewHelper.dll). The reviewer name changes between runs.
          The name that appears only under native execution is the concealed identity; the managed metadata
          lists a different reviewer.
        - 'The concealed reviewer is a Nextcloud user. List files shared with your CORPORATE Nextcloud
          account: GET /ocs/v2.php/apps/files_sharing/api/v1/shares?format=json&shared_with_me=true with
          your CORPORATE credentials. Find the share from the concealed reviewer — the share note contains
          the archive session ID.'
        - Submit POST https://process-view.arwc.test/api/unlisted-reviewers/current with CORPORATE Bearer
          and body {"helper_sha256":"<dll_sha256>","reviewer":"<concealed_identity>","session":"<session_from_note>",
          "comparison":"CMP-CRR-R21-R7","project":"CRR-CTRL-R21"}. Wrong reviewer returns 409. On success,
          returns 201 with CMP-CRR-R21-R7 marked historical, no current identity, maintenance approval,
          or control authority.
        completion:
          mode: automatic_range_evidence
    - id: W23
      chapter: Engineering
      title: A measurement that never existed
      allocation:
        hard: 1
        expert: 1
        elite: 1
      cards:
      - id: W23.1
        title: A measurement with side effects
        description: Construct a measurement interaction that causes a controlled change outside its intended
          estimator state.
        difficulty: hard
        points: 200
        hints:
        - POST https://process-view.arwc.test/api/control-commands with CORPORATE Bearer and body {"estimator":"EST-CRR-23","mode":"baseline"}.
          Response includes the estimator binary (artifact_b64, 144-byte Measurement objects), SHA256,
          and operation limit 8. Download and analyze the binary — static C++ binary using Measurement
          objects in a vector AND a source-ID unordered_map index.
        - 'The UAF: adding a duplicate source_id coalesces measurements — vector element freed but source-ID
          index retains the stale pointer. With glibc 2.39 tcache, the next 0x90-byte PlanningState allocation
          gets the same chunk. Submit four ops: add FIT-CRR-204B twice, add PROBE-CRR-23, write-stale
          offset=64 u32=1129468466 (vtable 0x4553544352523233 >> 8, low 32 bits). Service returns EST-UAF-CRR-23.'
        - After EST-UAF-CRR-23, submit the controlled-state sequence to POST /api/control-commands/consequence
          (remove-duplicate FIT-CRR-204B, add/remove/add-state Cairn Reach, write-stale offset=40 f64=13.4,
          write-stale offset=48 u32=1). Then submit POST /api/estimator-runs with allocation_case=ALLOC-CASE-CRR-33,
          district_id=Cairn Reach, reserve_ml=13.4, quality=1, unaffected={North:8.1,Merewick:7.65}.
        completion:
          mode: automatic_range_evidence
      - id: W23.2
        title: Control beyond the measurement
        description: Develop the useful memory capability needed to influence the estimator's protected
          planning state under its operating constraints.
        difficulty: expert
        points: 400
        hints:
        - Begin with the process estimator's measurement and planning-state interfaces. Start from process-view.arwc.test's
          published client document and records already earned in this operation, not from an invented
          endpoint.
        - Treat this as controlled heap-state corruption while preserving the measurement service contract.
          Build a local model from the supplied reference cases, then confirm it explains both accepted
          and rejected behavior.
        - Review the published client document and ordinary records for process-view.arwc.test. Extract
          the supplied cases into a small local reproducer and do not use its result until every reference
          case matches.
        completion:
          mode: automatic_range_evidence
      - id: W23.3
        title: A measurement that never existed
        description: Make the planning estimator report the reserve as sufficient for the supplied allocation
          case while preserving its normal output interface and the unaffected district estimates.
        difficulty: elite
        points: 800
        hints:
        - Begin with the process estimator's measurement and planning-state interfaces. Start from process-view.arwc.test's
          published client document and records already earned in this operation, not from an invented
          endpoint.
        - Treat this as controlled heap-state corruption while preserving the measurement service contract.
          Establish the denied and ordinary baselines first, then vary only the boundary input the service
          is meant to bind.
        - Review the published client document and ordinary records for process-view.arwc.test. Read the
          current revision, submit one minimal variation, and compare the resulting audit and unaffected
          fields with the baseline.
        completion:
          mode: automatic_range_evidence
    - id: W24
      chapter: Engineering
      title: Two answers from one box
      allocation:
        medium: 1
        hard: 2
        expert: 1
      cards:
      - id: W24.1
        title: Two kinds of answer
        description: Recover the legacy recovery contract and distinguish the response classes produced
          for the supplied engineering record.
        difficulty: medium
        points: 100
        hints:
        - Call GET https://process-view.arwc.test/api/signature-requests with CORPORATE Bearer. The response
          includes RECOVERY-ORACLE-R4 with 4 labeled examples (class + ciphertext for A-D), 4 prediction
          cases (request_id + epoch_bucket only — no class), and selector_validation_cases showing known
          selector rotations. Study the labeled examples to understand the RSA PKCS#1 v1.5 class structure.
        - 'The oracle applies a rotation: observed_class = shift(padding_class, rotation) where rotation
          = selector(request_id, epoch_bucket) & 3. Implement the xorshift128+ selector function using
          selector_validation_cases to verify. Then compute the rotation for each prediction case''s (request_id,
          epoch_bucket) pair to determine its observed_class.'
        - Submit POST https://process-view.arwc.test/api/signature-oracles/current with CORPORATE Bearer
          and body {"record_id":"ENG-REC-24","prediction_set":"SELECTOR-CRR-R4","predictions":[...4 predictions...]}.
          All 4 must be correct. On success returns SELECTOR-CRR-R4 and sets selector_predicted=True for
          W24.2+.
        completion:
          mode: automatic_range_evidence
      - id: W24.2
        title: Which answer comes next
        description: Predict the recovery interface's response selection well enough to satisfy the designated
          work item cases.
        difficulty: hard
        points: 200
        hints:
        - 'POST https://process-view.arwc.test/api/estimator-tasks/current with CORPORATE Bearer and body
          {"operation":"oracle","ciphertext":"<512-hex>","request_id":"<16-hex>","epoch_bucket":1770000042}
          (epoch_bucket must be exact). The oracle runs real RSA-2048 decryption and returns observed_class
          A/B/C/D. Deduplicates ciphertexts; use unique ciphertexts or request_ids per query. Limit: 4096
          total.'
        - 'Before each query, predict observed_class = shift(raw_class, rotation) where rotation = selector(request_id,
          1770000042) & 3 (xorshift128+ from W24.1). Use class-D labeled example ciphertext with varying
          request_ids to verify your selector. Confirmed: rid=2400000000000001 rot=2 → D+2=B.'
        - target_ciphertext in the oracle contract is RSA_TARGET — the encryption of the UNLOCK value
          needed to open the diagnostic bundle. Query it with any valid request_id to observe its class.
          Use oracle queries + RSA PKCS#1 v1.5 structure to recover UNLOCK for W24.3.
        completion:
          mode: automatic_range_evidence
      - id: W24.3
        title: The diagnostic evidence bundle
        description: Recover the archive-unlock value within the recovery interface's query allowance
          and open the diagnostic evidence bundle bound to the current engineering project.
        difficulty: hard
        points: 200
        hints:
        - 'RSA_TARGET from the oracle contract is RSA-encrypted UNLOCK. Use multiplicative blinding: submit
          c*s^e mod N to the oracle, observe class of s*m mod N. Choose request_ids with rotation=0 (selector(rid,EPOCH_BUCKET)&3==0)
          to get unrotated classes. Class D = valid PKCS#1 AND ENG1 tag.'
        - 4-class oracle is faster than binary valid/invalid. Class C = valid structure BUT wrong payload
          tag. Class D = valid AND ENG1. Standard Bleichenbacher interval narrowing with the ENG1 constraint
          recovers UNLOCK within 4096 queries. Strips selector rotation before interpreting class.
        - Submit POST /api/estimator-tasks/current with operation=open, bundle_id=DIAG-EVID-CRR-R7, project_id=CRR-CTRL-R21,
          project_revision=21, archive_unlock_b64=base64(UNLOCK). Service decrypts bundle with AES-GCM(SHA256(UNLOCK)).
          Returns signer DSIGN-CRR-R3 + 16 signed records + recovery metadata for W24.4. Wrong UNLOCK
          returns 409 with no partial info.
        completion:
          mode: automatic_range_evidence
      - id: W24.4
        title: Signed by someone who never approved it
        description: The diagnostic service requires a signed authorization to export its private calibration-exception
          log. Use the recovered signer and its old records to produce an authorization for a fresh export
          request bound to the current project, then obtain the log.
        difficulty: expert
        points: 400
        hints:
        - 'From W24.3 bundle: extract nonce_bits_60_251 (k>>60) for records 1+2, signed_low60_delta from
          recovery_metadata, fresh_export_request_b64, and signer.public_key. Compute challenge h = int.from_bytes(SHA-512(R||public_key||canonical_message),"little")
          mod L for each record.'
        - 'Apply HNP formula: x=((s2-s1)-((k2_hi-k1_hi)<<60)-delta)*inverse(h2-h1,L) mod L. Verify by
          computing x*B and comparing to public key (Edwards25519: p=2^255-19, L=2^252+2774...). Use a
          fresh nonce k_new for the new signature (do not reuse any record''s nonce).'
        - 'Sign FRESH_EXPORT (from bundle) with recovered x: k_new=any_fresh, R_new=k_new*B, h_new=SHA-512(R_new||A||FRESH_EXPORT)
          mod L, s_new=(k_new+h_new*x) mod L. POST /api/reporting-submissions with {"export_request_b64":base64(FRESH_EXPORT),"R":hex,"s":hex}.
          Service genuinely verifies Ed25519. Returns CAL-EXCEPT-CRR-R21 with 2 calibration exceptions.'
        completion:
          mode: automatic_range_evidence
    - id: W25
      chapter: Control
      title: Mode and meaning
      allocation:
        easy: 2
        medium: 2
      cards:
      - id: W25.1
        title: The operating envelope
        description: Read the Cairn Reach operating instruction and reconcile its bounded movement with
          the limits shown by the installed HMI and controller project.
        difficulty: easy
        points: 50
        hints:
        - Read operating-envelope.csv (at /home/fieldlink/CairnReach/Briefs/W25/). It has CRR-OP-W25-R1
          with installed controller limits (manual 0-100%, auto 0-1.0 m3/s), physical capacity (0.5 m3/s
          per outlet), and the authorized movement (baseline A20/B20, observation A30/B10, restoration
          A20/B20, mode=manual). Confirm limits in FUXA Site controls view and the OpenPLC SiteRequests-and-OutletControl
          project.
        - 'Verify via real OT historian: SELECT variable, value FROM ot_history.process_samples to confirm
          PositionPct=20% (outlet A) and PositionBPct=20% (outlet B) at baseline. Physical capacity 0.5
          m3/s per outlet is from the OPC UA tag catalog (FlowM3s range [0,0.5]). Total flow 0.20 m3/s
          at baseline.'
        - Submit POST https://process-view.arwc.test/api/process-estimator/current with CORPORATE Bearer
          and body {record_id:CRR-OP-W25-R1, manual_position_min:0, manual_position_max:100, manual_position_unit:percent,
          automatic_flow_min:0.0, automatic_flow_max:1.0, automatic_flow_unit:m3/s, physical_capacity_per_outlet_max:0.5,
          physical_capacity_unit:m3/s, baseline_a:20, baseline_b:20, observation_a:30, observation_b:10,
          restoration_a:20, restoration_b:20, mode:manual}.
        completion:
          mode: automatic_range_evidence
      - id: W25.2
        title: Conditions before movement
        description: Use FUXA and the live OpenPLC project to explain whether the Cairn Reach outlets
          can move now and which conditions establish that result.
        difficulty: easy
        points: 50
        hints:
        - 'From FUXA overview + outlet faceplates + OT historian (ot_history.process_samples), read the
          permissive chain: IoHealthy=true, PermissiveA=true, PermissiveB=true, TravelFaultA/B=false (clear),
          LowLevelAlarm=false (clear), HmiStop=false (clear). These safety conditions are all good.'
        - 'Check controller state: Armed=false (not armed for movement), Owner=0 (not HMI-owned). The
          controller is NOT armed for an HMI-owned manual request. These two conditions block movement
          in the current state.'
        - 'Submit POST /api/process-permissive/current with CORPORATE Bearer and body {record_id:CRR-OP-W25-R1,
          io_healthy:true, permissive_a:true, permissive_b:true, travel_fault_a:false, travel_fault_b:false,
          low_level_clear:true, operator_stop_clear:true, controller_armed:false, owner_hmi:false, may_move:false}.
          Returns W25-PERMISSIVE-CRR-R1 with blocking conditions: controller_not_armed, owner_not_hmi.'
        completion:
          mode: automatic_range_evidence
      - id: W25.3
        title: Accepted is not actuated
        description: Apply the authorized A30/B10 manual request and distinguish the staged request, PLC
          decision, command owner, permissives, and measured outlet response.
        difficulty: medium
        points: 100
        hints:
        - From the qualified A20/B20 baseline record, use FUXA once for the prescribed manual A30/B10
          observation request. Preserve the new sequence and time so you can follow the request after
          the Apply action.
        - Use correlation to join the staged request to OpenPLC seen and accepted sequence, HMI ownership,
          permissives, accepted settings, and the later measured position and flow. A changed field or
          Apply acknowledgement is not actuation.
        - Check that the same sequence and interval show accepted A30/B10 settings and settled product-owned
          feedback near the corresponding outlet flows, with good quality and no active fault.
        completion:
          mode: automatic_range_evidence
      - id: W25.4
        title: A sequence the process can follow
        description: Prove the bounded movement in native process history, then apply the authorized A20/B20
          restoration and verify the live site has returned to baseline.
        difficulty: medium
        points: 100
        hints:
        - Prove the A20/B20 to A30/B10 movement from good native position and flow history, then use a
          second FUXA request for the prescribed manual A20/B20 restoration. Keep both accepted sequences.
        - Correlate each accepted request with later process samples. The final state needs measured A20/B20,
          about 0.10 m3/s per outlet and 0.20 m3/s total, not merely restored input fields.
        - Verify ownership, healthy field data, both permissives, stopped motion, and clear travel faults
          agree with the restored measurements. Leave no unsettled movement for the next participant task.
        completion:
          mode: automatic_range_evidence
    - id: W26
      chapter: Control
      title: The approval that became a command
      allocation:
        medium: 1
        hard: 2
        expert: 1
      cards:
      - id: W26.1
        title: Which renderer holds the approval
        description: Recover the protected maintenance-renderer profile and bind it to the approved inspection.
        difficulty: medium
        points: 100
        hints:
        - Begin with the maintenance renderer, approved inspection, and control-client issuer. Start from
          maintenance-renderer.arwc.test's published client document and records already earned in this
          operation, not from an invented endpoint.
        - Treat this as confused preview authority followed by service-identity execution and scoped delegation.
          Separate the authoritative service record from stale or local copies, and preserve its identity,
          revision, and scope.
        - Review the published client document and ordinary records for maintenance-renderer.arwc.test.
          Capture one ordinary response and one denial, then correlate the returned identifiers with evidence
          already earned.
        completion:
          mode: automatic_range_evidence
      - id: W26.2
        title: Authority behind the preview
        description: Make the maintenance renderer accept a contractor-submitted work package for the
          privileged inspection preview it normally reserves for the maintenance reviewer.
        difficulty: hard
        points: 200
        hints:
        - Begin with the renderer profile and the approved inspection it names. Compare the contractor
          submission boundary with the reviewer-only preview boundary rather than guessing a renderer
          action.
        - '''This is confused preview authority: a contractor-controlled package crosses into a preview
