        difficulty: expert
        points: 400
        hints:
        - Begin with the maintenance renderer, approved inspection, and control-client issuer. Start from
          maintenance-renderer.arwc.test's published client document and records already earned in this
          operation, not from an invented endpoint.
        - Treat this as confused preview authority followed by service-identity execution and scoped delegation.
          Carry forward only earned identities and record bindings; possession of a copied identifier
          alone does not cross the next boundary.
        - Review the published client document and ordinary records for maintenance-renderer.arwc.test.
