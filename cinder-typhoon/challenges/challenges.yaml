schema: cinder-typhoon.challenge-delivery/v2
revision: 3fb0ceb048a65b13bbeb3a11889cdd0f8270459f5256d822cea3c1dab168512b
scoring:
  model: static
  tier_points:
    easy: 50
    medium: 100
    hard: 200
    expert: 400
    elite: 800
  max_score: 39200
  max_out: Complete all 240 cards; hints do not reduce score.
  hint_policy:
    release: facilitator_on_request
    levels: 3
    independent_levels: true
    penalty: 0
summary:
  operation_count: 70
  card_count: 240
phases:
  training:
    title: Training
    operations:
    - id: T01
      chapter: Workbench
      title: First contact
      allocation:
        easy: 4
      cards:
      - id: T01.1
        title: The copy nobody deleted
        description: The last training operator left an empty handover note and an unfinished delivery.
          Recover the missing handover from the supplied workspace.
        difficulty: easy
        points: 50
        hints:
        - The workbench landing page names the data source for the initial handover. Check what the training
          dispatch site exposes at its root before looking further.
        - The resource is accessible without credentials. Look for an endpoint that serves structured
          data rather than a form.
        - Fetch the handover endpoint listed on the landing page. The response structure names the next
          resource you need.
        completion:
          mode: automatic_range_evidence
      - id: T01.2
        title: Off the menu
        description: The training dispatch site removed its rehearsal page from the menu. Find the page
          and recover the delivery amendment the public notice omits.
        difficulty: easy
        points: 50
        hints:
        - The dispatch site has a documented rehearsal path that was removed from the public navigation.
          Historical references in client-side code can expose paths that are no longer linked.
        - Look for JavaScript or markup that references an unlisted route. Browser developer tools or
          a simple page source review will surface it.
        - Inspect the dispatch site's static resources for route strings that do not appear in the visible
          navigation. One of them still responds.
        completion:
          mode: automatic_range_evidence
      - id: T01.3
        title: A token with a job
        description: Recover the retired courier client's usable access and retrieve the sealed manifest
          assigned to that courier.
        difficulty: easy
        points: 50
        hints:
        - The handover names a courier service. The courier client's credentials are somewhere on the
          workstation or in its session history.
        - Look for stored credentials in the workstation's standard locations for application sessions
          and authentication tokens.
        - Check the local credential store for a token bound to the courier's service hostname. The handover
          names the host.
        completion:
          mode: automatic_range_evidence
      - id: T01.4
        title: The helper has another job
        description: Make the dispatch diagnostic helper reveal the internal delivery summary that its
          ordinary report leaves out.
        difficulty: easy
        points: 50
        hints:
        - The local workbench helper accepts diagnostic input. The handover or the helper's documentation
          names what inputs it accepts and what it produces beyond a normal summary.
        - The helper's interface accepts more than one content type. A non-standard input triggers a different
          code path.
        - Submit a sample from the handover to the helper using the input type the handover says the helper
          was built to process. Read the full response.
        completion:
          mode: automatic_range_evidence
    - id: T02
      chapter: Accounts
      title: Someone can log in
      allocation:
        easy: 3
        medium: 1
      cards:
      - id: T02.1
        title: An account by any other response
        description: Identify the active rehearsal account and recover the account-bound case reference
          exposed by the identity desk.
        difficulty: easy
        points: 50
        hints:
        - The identity desk has a directory of active accounts. The rehearsal account appears in the directory
          under its own entry.
        - The directory exposes account metadata that includes enough information to identify the rehearsal
          account's role and its recovery state.
        - Query the identity desk's directory endpoint and look for the account whose role matches the
          one named in the handover.
        completion:
          mode: automatic_range_evidence
      - id: T02.2
        title: Hidden on the page
        description: The identity desk's public directory hides rehearsal assignments from visitors. Recover
          the private assignment and associated staff detail it should not expose.
        difficulty: easy
        points: 50
        hints:
        - The identity desk's public directory page hides some entries from the default view. The underlying
          data source includes more than the UI shows.
        - The directory data is served from an API endpoint that does not apply the same visibility filter
          as the HTML view.
        - Fetch the directory API endpoint directly and look for the rehearsal account that is absent
          from the rendered page.
        completion:
          mode: automatic_range_evidence
      - id: T02.3
        title: Recovery is another way in
        description: Use the identity evidence you recovered to take control of the rehearsal account
          through its recovery workflow and retrieve its private handover.
        difficulty: easy
        points: 50
        hints:
        - The identity evidence you recovered includes the information needed to prove ownership without
          the original password. The identity desk has a recovery path for exactly this situation.
        - Look for a credential recovery flow that accepts identity proof rather than a password. The
          evidence you have is the required proof.
        - Use the recovery endpoint on the identity desk with the account identifier and the evidence
          token you recovered. Read what it issues.
        completion:
          mode: automatic_range_evidence
      - id: T02.4
        title: Someone else's assignment
        description: Your recovered account can list its own assignments. Obtain the other operator's
          sealed rehearsal brief through the assignment service.
        difficulty: medium
        points: 100
        hints:
        - Your recovered account belongs to an assignment. The identity desk or the workbench can show
          you what that assignment contains.
        - The assignment record names one or more tasks that belong to your recovered account. Look for
          a resource listing endpoint.
        - Query the assignment resource linked in your recovered session. One of the listed tasks belongs
          to a different account.
        completion:
          mode: automatic_range_evidence
    - id: T03
      chapter: Developer artifacts
      title: Left in the checkout
      allocation:
        easy: 3
        medium: 1
      cards:
      - id: T03.1
        title: Deleted from the checkout
        description: Recover the missing delivery fixture named in the training package's review note
          and identify the behavior it covered.
        difficulty: easy
        points: 50
        hints:
        - The delivery fixture is named in the handover, but the file is not present at its documented
          path. Version-control history for the checkout holds deleted content.
        - Deleted files remain in git history. Standard git commands can recover content that was removed
          from the working tree but not from the repository.
        - Use git log and git show to find the commit that removed the fixture file and recover its contents.
        completion:
          mode: automatic_range_evidence
      - id: T03.2
        title: Verbose enough to publish
        description: Recover the release access exposed by the failed training build and retrieve the
          protected rehearsal-channel manifest.
        difficulty: easy
        points: 50
        hints:
        - The failed test run produced verbose output. CI logs for failed jobs often expose internal paths,
          tokens, or configuration that would not appear in a success.
        - Look for credential or token material in the CI job log for the failed build. Verbose error
          output sometimes includes authentication material bound to the build environment.
        - Fetch the log for the failed CI run referenced in the handover. A token that appears in the
          error output has a specific scope — read what resource it authorizes.
        completion:
          mode: automatic_range_evidence
      - id: T03.3
        title: What installation really runs
        description: Inspect the supplied training package without installing it. Recover the extra action
          installation would trigger, including the data involved and its destination.
        difficulty: easy
        points: 50
        hints:
        - The supplied training package is an archive that can be inspected without running it. Its structure
          names what it does.
        - Inspect the package manifest and its entry point source. The exports describe what the package
          does when installed.
        - Unpack the package archive and read its package.json and main module. The exports tell you what
          the package produces when called.
        completion:
          mode: automatic_range_evidence
      - id: T03.4
        title: A release they will consume
        description: Deliver a compatible training formatter that adds Cinder's rehearsal marker to the
          intended consumer's delivery report.
        difficulty: medium
        points: 100
        hints:
        - The rehearsal endpoint accepts a compatible package and runs it against a named tenant. The
          existing package gives you the interface contract.
        - Build a package that implements the same interface as the supplied one but adds the diagnostic
          output the handover requests. Publish it before submitting it to the rehearsal.
        - Publish a new package version that satisfies the interface contract and adds the extra field
          named in the handover. Then invoke the rehearsal endpoint with that version and the target tenant.
        completion:
          mode: automatic_range_evidence
    - id: T04
      chapter: State
      title: Trust the instrument
      allocation:
        easy: 2
        medium: 2
      cards:
      - id: T04.1
        title: Which value is real
        description: Read the supplied training-tank observation and recover how much water it actually
          contains, distinguishing the measurement from the requested level.
        difficulty: easy
        points: 50
        hints:
        - The training tank produces observation readings. The observation record contains multiple values;
          only one represents the current physical state of the tank.
        - Compare the observation fields with the sensor specification in the handover. The spec identifies
          which measurement is the authoritative current reading.
        - Read the observation record and the sensor spec. The field whose units match the spec's primary
          measurement is the authoritative value.
        completion:
          mode: automatic_range_evidence
      - id: T04.2
        title: The light behind the number
        description: Decode the supplied controller status capture and identify the condition preventing
          the practice outlet from moving.
        difficulty: easy
        points: 50
        hints:
        - The controller status capture is encoded. The handover includes the encoding specification.
        - The encoding is a standard binary format described in the handover. Decode each field according
          to the field map in the spec.
        - Apply the byte layout from the handover's controller status spec to the capture bytes. The decoded
          field at the named offset gives the current mode identifier.
        completion:
          mode: automatic_range_evidence
      - id: T04.3
        title: A request is not a movement
        description: Move the specified bounded amount of water through the training outlet and verify
          the transfer from the tank's observations.
        difficulty: medium
        points: 100
        hints:
        - The control interface accepts bounded release commands. The handover specifies the target amount
          and the command format.
        - The release command requires a signed request that binds the amount to the current session.
          Look for the signing mechanism in the handover or the client documentation.
        - Construct a release command for the specified amount using the session credential and the request
          format in the handover. Submit it to the control endpoint and confirm the acceptance receipt.
        completion:
          mode: automatic_range_evidence
      - id: T04.4
        title: Yesterday's green light
        description: The training report says the latest outlet test succeeded, but the observations disagree.
          Determine what actually happened during this attempt and explain the discrepancy through the
          supplied evidence.
        difficulty: medium
        points: 100
        hints:
        - The training report states that the outlet test passed. The independent physical record of the
          test result may disagree.
        - Look for the instrument or audit record that independently recorded the outlet test outcome.
          It is a different data source than the report.
        - Query the instrument record for the outlet named in the report. Compare its value for the test
          period with what the report claims.
        completion:
          mode: automatic_range_evidence
    operation_count: 4
    card_count: 16
    score_total: 1000
  keplerops:
    title: KeplerOps
    operations:
    - id: K01
      chapter: Borrowed desk
      title: Desk drawer
      allocation:
        easy: 4
      cards:
      - id: K01.1
        title: The developer left a way back
        description: The workstation is yours, but the FieldKest repositories still expect an identity.
          Recover the developer's usable repository access and retrieve the current project handover.
        difficulty: easy
        points: 50
        hints:
        - Start with the developer's ordinary Git client configuration and the source links in the service
          notes.
        - The retained identity is deliberately limited. Use Gitea's normal issue list for the private
          connector repository, and distinguish successful read access from repository write authority.
        - Recover the saved Gitea identity, open the fieldkest/fieldlink-connector issue list, and correlate
          the handover issue's release and revision. Confirm that the same identity cannot push.
        completion:
          mode: automatic_range_evidence
      - id: K01.2
        title: The tab that survived
        description: The developer closed the support portal before leaving. Recover the unfinished ARWC
          support ticket retained by the browser.
        difficulty: easy
        points: 50
        hints:
        - The closed page is not an open tab. Inspect Chromium's ordinary history and then use the support
          desk named in the workstation notes.
        - The history title retains a ticket number and subject. Rowan's normal staff identity can enter
          the native osTicket agent queue; unrelated queue records are context, not the answer.
        - Search osTicket for the retained ticket number and read its actual thread. Correlate the customer,
          asset, connector revision, and callback-latency correspondence.
        completion:
          mode: automatic_range_evidence
      - id: K01.3
        title: Outside the working folder
        description: A release review is missing from the checkout. Find its staff work-board record and
          recover the attached review and unresolved comments.
        difficulty: easy
        points: 50
        hints:
        - Release reviews are on the staff work board named in the workstation notes, not in the connector
          checkout.
        - Use Kanboard's normal task search and reference correlation. The release reference distinguishes
          the target from the neighboring review tasks, and the task owns both comments and an attachment.
        - Find release REL-FLK-7.4.2-09 in Kanboard, open its review attachment, and correlate the unresolved
          REV comments with the task reference.
        completion:
          mode: automatic_range_evidence
      - id: K01.4
        title: Put it on the workbench
        description: The local FieldKest helper has an unfinished support-report job. Make it produce
          a fresh inspection summary from the developer's supplied sample, with that sample's asset and
          revision correctly represented.
        difficulty: easy
        points: 50
        hints:
        - The local helper documentation and supplied FieldKest samples are under the developer's work
          directory.
        - This is a normal local report action. Preserve the sample's own asset and connector revision
          rather than substituting values from another record.
        - Submit the documented FK-SAMPLE-017 file to the helper's inspection-summary form and retain
          the fresh receipt.
        completion:
          mode: automatic_range_evidence
    - id: K02
      chapter: Borrowed desk
      title: The first green report
      allocation:
        easy: 2
        medium: 1
      cards:
      - id: K02.1
        title: The missing fixture
        description: The report test has been failing since its reference fixture disappeared. Recover
          the fixture from the development artifacts so the intended report is visible again.
        difficulty: easy
        points: 50
        hints:
        - Begin with the retained source history and the continuous-integration review workflow. The failing-job
          note identifies a repository revision, so the removed fixture should be sought in version history
          rather than the current tree.
        - This stage is version-history recovery. Keep the named revision and fixture path bound together;
          the provider contract is a separate build artifact.
        - Compare the revision in the failing-job note with the repository history, then inspect the change
          that removed the named fixture without restoring unrelated files.
        completion:
          mode: automatic_range_evidence
      - id: K02.2
        title: An input outside its lane
        description: The report build failed, but it retained a review note separate from the console
          log. Recover that note and establish the input contract for submitting a corrected report provider.
        difficulty: easy
        points: 50
        hints:
        - Inspect the native Jenkins build page and its separately archived artifacts. The console is
          only one part of the retained build record.
        - Match the review note to the failed build and source revision before using its provider contract.
          Reading an artifact does not grant repository write or job configuration access.
        - Compare the exact fixture path and revision in REVNOTE-1842 with the native source history and
          inspect the file parameter on fieldlink-report-review.
        completion:
          mode: automatic_range_evidence
      - id: K02.3
        title: Green, with our changes
        description: Change the report produced by the test job while keeping the interface its caller
          expects. The support engineer should receive Cinder's version with a successful job result.
        difficulty: medium
        points: 100
        hints:
        - Use the native Jenkins fieldlink-report-review job and its provider.zip file parameter. The
          original fieldlink-report job is the retained failing baseline.
        - This is interface validation. Preserve the fixture's exact file bytes and immutable fields while
          implementing the documented provider extension point. A valid package is different from an accepted
          changed report.
        - Compare the native build artifacts with the support handover. The job ID and report digest must
          identify the same fresh output; a green status by itself is insufficient.
        completion:
          mode: automatic_range_evidence
    - id: K03
      chapter: Borrowed desk
      title: Quiet callback
      allocation:
        medium: 1
        hard: 2
      cards:
      - id: K03.1
        title: Our predecessor's desk
        description: Someone from Cinder worked this lead before you. Recover the staging artifact buried
          in their retained document and identify the collection it belongs to.
        difficulty: medium
        points: 100
        hints:
        - The predecessor left one ordinary document package in the analysis directory; its rendered pages
          are not the whole file.
        - Treat the OpenDocument format as a ZIP package structure. Compare the visible note with its
          packaged attachments and retain the attachment bytes before interpreting them.
        - Inspect `Attachments/staging-FKCOL-2841.bin` inside `field-notes-2026-08.odt`, then bind its
          digest to the collection identifier recorded in the stage header.
        completion:
          mode: automatic_range_evidence
      - id: K03.2
        title: The script inside the script
        description: The recovered staging material conceals another stage. Reconstruct the usable script
          and recover the instructions needed to understand what the earlier operator collected.
        difficulty: hard
        points: 200
        hints:
        - The supplied decoder artifact describes only the outer encoding. Preserve the recovered bytes
          and verify the digest in the stage header before following what they contain.
        - The recovered PowerShell carries another compressed script and its own digest. Preserve the
          encoding and integrity boundary while reconstructing it as data; neither retained stage needs
          to be executed.
        - The JavaScript stage shows how its base64 bytes, repeating key, and zlib layer produce the collection
          manifest. Verify both script digests and recover every manifest field.
        completion:
          mode: automatic_range_evidence
      - id: K03.3
        title: Finish the callback
        description: Reconstruct the earlier operation's callback configuration and recover its lost collection.
          Find out what it learned about the unresolved ARWC maintenance ticket.
        difficulty: hard
        points: 200
        hints:
        - The workstation already has an ordinary scoped object-storage profile. The recovered manifest
          supplies the address that profile cannot discover by browsing.
        - Reading a known S3 object and listing its bucket cross separate authorization boundaries. Use
          the exact endpoint, bucket, and key from the reconstructed manifest; the callback-integrity
          in the staging bundle documents how provenance is verified.
        - After retrieving and verifying the object SHA-256, derive the callback integrity from the reconstructed
          PowerShell bytes and the retrieved collection bytes and confirm it matches the staged bundle's
          declared callback-integrity. Correlate the support ticket, asset, and connector revision, and
          confirm bucket enumeration is denied.
        completion:
          mode: automatic_range_evidence
    - id: K04
      chapter: Borrowed desk
      title: The native indexer
      allocation:
        hard: 1
        expert: 1
        elite: 2
      cards:
      - id: K04.1
        title: A bundle with consequences
        description: The support indexer treats uploaded bundles as routine work. Construct a bundle that
          causes a controlled change beyond the object it should be allowed to affect.
        difficulty: hard
        points: 200
        hints:
        - Begin with the offline indexer reproducer and its protected runtime service. The supplied indexer
          client.json artifact documents the .fki archive format and the offline reproducer binary; both
          carry the relevant lead.
        - Treat this as binary layout analysis of the .fki deserializer. The bundle header declares two
          entry counts; compare how each is used in the bounds check and in the memcpy to find the allocation
          confusion.
        - Identify how the bounds check compares total entry data against the full arena size (body plus
          sentinel) while the memcpy writes only into the body region. Construct a bundle where index_entries
          produces a copy length that exceeds the body but stays within the arena, then verify the service
          records the controlled sentinel mutation while staying live.
        completion:
          mode: automatic_range_evidence
      - id: K04.2
        title: Read past the index
        description: Use the compromised indexing behavior to recover protected runtime information that
          an ordinary bundle cannot see.
        difficulty: expert
        points: 400
        hints:
        - The binary returns a data_hex field covering the bytes read from the shared arena before each
          write. After K04.1 the arena carries a runtime descriptor at bytes 80-511 that the service wrote
          at mutation time.
        - The bounds check uses sizeof(struct index_arena) as its base, not the full arena size. Analyze
          the binary to find both constants; then choose alloc_entries so that the check passes for datalen
          equal to the full arena size, covering the descriptor region.
        - Parse data_hex hex chars 160-1023 (arena bytes 80-511) as JSON to recover the runtime descriptor.
          It contains the worker_session, exception_state_offset, exception_value_size, exception_integrity_size,
          integrity_relation, and completion_route for K04.3 and K04.4.
        completion:
          mode: automatic_range_evidence
      - id: K04.3
        title: Control the allocation
        description: The indexer still restricts what your corrupted object can influence. Establish a
          controlled write capability under those restrictions and demonstrate it against the designated
          protected state.
        difficulty: elite
        points: 800
        hints:
        - The binary read covers the full arena. Extend the bundle beyond the descriptor region by supplying
          ie=72 and ae=496 so that datalen=576 reaches bytes 512-575 in both the binary read and write.
        - Bytes 0-511 of the K04.3 payload must match the K04.2 data_hex bytes verbatim. That snapshot
          preserves the sentinel at bytes 64-79 and the descriptor at bytes 80-511; both must remain intact
          after the K04.3 write or the service rejects it.
        - Use the descriptor fields exception_state_offset, exception_value_size, exception_integrity_size,
          and integrity_relation. Place the queue-ready value at bytes 512-543 and HMAC-SHA256(worker_session,
          b"queue-ready") at bytes 544-575. The response contains write_ready=true when the write passes
          all checks.
        completion:
          mode: automatic_range_evidence
      - id: K04.4
        title: The exception queue
        description: Turn the indexer compromise into execution under its service identity. Recover the
          release-exception queue the support engineer has been trying to clear.
        difficulty: elite
        points: 800
        hints:
        - Call the completion_route from the K04.2 descriptor. Use bearer=worker_session, body routine=recover_exception_queue
          and generation=process_generation. The response contains encrypted_record (hex ciphertext) and
          key_relation (the decryption formula); write_ready must be True before the call succeeds.
        - 'The key_relation field names the derivation. Compute the K04.3 HMAC first: HMAC-SHA256(worker_session,
          b"queue-ready"). Then derive the decryption key: SHA256(k43_hmac_bytes + b":dossier-key"). That
          32-byte key drives the counter-mode stream.'
        - 'Decrypt the encrypted_record hex in 32-byte blocks. For each block i (zero-indexed): keystream
          = SHA256(derived_key + struct.pack(">I", i)); XOR each ciphertext byte with the corresponding
          keystream byte. The plaintext is a JSON object with service_identity and dossier.'
        completion:
          mode: automatic_range_evidence
    - id: K05
      chapter: Package line
      title: What the customer installs
      allocation:
        easy: 2
        medium: 2
      cards:
      - id: K05.1
        title: Speak the package's language
        description: Find the actual connector package interface and make its documented example produce
          a valid result through the FieldLink check consumer.
        difficulty: easy
        points: 50
        hints:
        - Fetch the Verdaccio metadata for @keplerops/fieldlink-connector from the packages.metadata route.
          The registry README documents the fieldkest.connector/v3 interface and its required fields.
        - Construct a consumer request with schema=fieldkest.connector/v3 and the required tenant_id and
          asset_id fields. Optionally include a measurements object with callback_latency_ms and sample_count.
          Missing required fields return 422 from the consumer-check route.
        - POST the request to packages.consumer-check. The result includes check_id, resolved_version
          (7.4.2), consumer_revision, package_sha256, the original request, and the actual installed module
          output.
        completion:
          mode: automatic_range_evidence
      - id: K05.2
        title: The version they kept
        description: Recover the older connector release named in the support ticket. Establish how its
          native package deprecation relates to the retained customer maintenance record.
        difficulty: easy
        points: 50
        hints:
        - The Verdaccio metadata for @keplerops/fieldlink-connector lists 6.9.8 under dist-tags.legacy.
          The deprecated field on the 6.9.8 version object carries the genuine native deprecation notice;
          the dist.tarball URL in that version object points to the actual downloadable archive.
        - Download the 6.9.8 tarball directly from the dist.tarball URL using the same developer credentials.
          A withdrawn customer rollout does not remove the package from the native registry; the archive
          remains retrievable. Unknown versions return 404 from the packages.release route.
        - Fetch the release record REL-FLK-6.9.8-ARCHIVE from the packages.release route. It carries status=yanked,
          a maintenance_note, and a compatibility block for the retained entitlement investigation. Correlate
          the version and package name across the Verdaccio metadata and the release record.
        completion:
          mode: automatic_range_evidence
      - id: K05.3
        title: Two manifests disagree
        description: The release manifest and customer selection record disagree. Reconcile them against
          the actual native package and identify the exact selected-version discrepancy and matching consumer
          identity.
        difficulty: medium
        points: 100
        hints:
        - 'POST to packages.reconcile with the correct tenant/release pair: tenant_record_id=TEN-ARWC-047
          and release_id=REL-FLK-7.4.2-09. Wrong record pairs return 422. The release record is readable
          from the packages.release route and the tenant ID comes from the support ticket customer context
          (K01.2).'
        - 'The reconcile result compares four fields: package, declared_range, resolved_version, and consumer_revision.
          Only resolved_version disagrees: the tenant record has 7.4.1 and the release has 7.4.2. The
          comparison_digest binds the full result including the tenant_record_id and release_id.'
        - 'Verify the tenant version against the actual native package: download the 7.4.1 tarball from
          Verdaccio (use the dist.tarball URL in the 7.4.1 version object) and compute its SHA256. This
          binds the archive digest to the disagreeing version in the reconcile comparison.'
        completion:
          mode: automatic_range_evidence
      - id: K05.4
        title: Selection has consequences
        description: Prove which dependency npm actually selects for the declared range and what the real
          installed consumer executes. Use package and module evidence rather than the release label.
        difficulty: medium
        points: 100
        hints:
        - 'The declared range from K05.3 is ^7.4.0. The Verdaccio metadata lists 7.4.0, 7.4.1, and 7.4.2
          under versions. npm selects the highest stable matching version: 7.4.2. Requesting a non-existent
          version (such as 7.4.3) from Verdaccio returns 404.'
        - Download the 7.4.2 tarball from its dist.tarball URL in the Verdaccio version object and compute
          its SHA256. Then POST a valid fieldkest.connector/v3 request to packages.consumer-check. The
          service runs npm pack with ^7.4.0 and returns resolved_version=7.4.2 with the matching package_sha256.
        - Verify that the package_sha256 from the consumer-check response matches the sha256 you computed
          from the Verdaccio tarball. The result object also includes connector_version=7.4.2 from the
          installed module, confirming the actual dependency that ran rather than the release label.
        completion:
          mode: automatic_range_evidence
    - id: K06
      chapter: Package line
      title: House package
      allocation:
        medium: 3
      cards:
      - id: K06.1
        title: House credentials
        description: The delivery team removed its local npm configuration from the current source tree.
          Recover usable publishing authority from the retained native history and establish its limits.
        difficulty: medium
        points: 100
        hints:
        - Navigate to the fieldkest/fieldlink-connector repository in Gitea and check the delivery-operations
          branch commit history. Find the commit that removed delivery/.npmrc from the working tree and
          inspect the file at the parent commit using the Gitea raw or contents API with the parent commit
          SHA as the ref.
        - The .npmrc file has an _auth field that is base64-encoded credentials for the fieldlink-importer-publisher
          account. Decode it to recover the username and token. These credentials authenticate to Verdaccio
          using the same HTTP Basic Auth as other package operations.
        - 'Confirm the publisher scope: the recovered credentials return 200 for @keplerops/fieldlink-connector
          metadata and tarballs, but 403 for @keplerops/support-rehearsal and 403 for the release-administration
          session route. These are the outer bounds of the publisher account.'
        completion:
          mode: automatic_range_evidence
      - id: K06.2
        title: A private package in the wrong view
        description: Your publishing account cannot read the private support package. Investigate the
          independent package-check build and recover the distinct CI identity that can.
        difficulty: medium
        points: 100
        hints:
        - Navigate to the Jenkins fieldlink-package-check job on ci.keplerops.test. The build archives
          package-workspace/.npmrc alongside the support-rehearsal.json artifact. Download the .npmrc
          from the archived build artifacts; it carries a separate svc-fieldlink-ci credential.
        - Decode the .npmrc _auth field (base64) to recover the svc-fieldlink-ci username and token. Those
          credentials can read @keplerops/support-rehearsal (200) from Verdaccio. The fieldlink-importer-publisher
          credentials from K06.1 remain denied (403) for that package.
        - 'Confirm the CI reader scope: @keplerops/support-rehearsal metadata and tarball pass (200).
          Then verify the boundary: a PUT to @keplerops/fieldlink-connector with CI credentials is denied
          (403); the publisher from K06.1 is still denied on support-rehearsal (403).'
        completion:
          mode: automatic_range_evidence
      - id: K06.3
        title: The rehearsal consumer
        description: Publish a compatible connector package under the authority you recovered, then make
          the isolated rehearsal consumer run its actual code and return your changed result.
        difficulty: medium
        points: 100
        hints:
        - Build a compatible 7.4.3 package with the same fieldkest.connector/v3 interface (same index.js
          logic, same limits.json structure, same package.json fieldkest.interface field) but different
          limits.json values. Use npm publish with the K06.1 publisher .npmrc to publish it; Verdaccio
          rejects a duplicate version.
        - After publishing 7.4.3, the consumer-check endpoint runs npm pack with ^7.4.0 and now selects
          7.4.3 as the highest stable version. Provide the same fieldkest.connector/v3 request as K05.1.
          The changed limits.json values produce a different assessment in the module output.
        - 'Confirm the changed result: the consumer-check response shows resolved_version=7.4.3 and the
          result assessment differs from 7.4.2 (for example, callback-review-required instead of within-operating-limits).
          Verify that tenant_id, asset_id, and schema are preserved. The publisher still has no release-admin
          authority.'
        completion:
          mode: automatic_range_evidence
    - id: K07
      chapter: Package line
      title: One request too many
      allocation:
        medium: 1
        hard: 1
        expert: 1
      cards:
      - id: K07.1
        title: What the inspector forwards
        description: Recover the inspector's restricted transaction record and determine how a normal
          package request reaches its downstream component.
        difficulty: medium
        points: 100
        hints:
        - Read work/registry/inspection-normal.json from the developer workstation and POST it to packages.inspections.
          The service validates schema, package, version, and action fields; it does not require exact
          byte equality. The response has a dynamic inspection_id (changes each request) and a trace link.
          Submit twice to confirm both IDs differ.
        - Fetch the trace at GET /api/inspections/{inspection_id}/trace. It contains a real assessor_correlation_id
          (UUID from the upstream assessor — not a fixed constant) and the compatibility_envelope_sha256
          for K07.2. Requests for unknown trace IDs return 403.
        - 'The trace proves a real upstream exists: the inspection service forwards to a Python BaseHTTPRequestHandler
          assessor (CL-based parser), while the Nginx edge is TE-aware. This Nginx/assessor parser disagreement
          is the K07.2 smuggling target. The compatibility_envelope_sha256 binds the inspection to the
          K07.2 envelope.'
        completion:
          mode: automatic_range_evidence
      - id: K07.2
        title: One request becomes another
        description: Construct input that causes the inspection components to disagree about the request
          they are processing. Demonstrate the disagreement with a controlled downstream effect.
        difficulty: hard
        points: 200
        hints:
        - 'The binary envelope format is FKI1 + name_length(1 byte) + name(N bytes) + front_following_length(2
          bytes, big-endian). The inspection service sets Content-Length = front_following_length when
          forwarding to the assessor. Set front_following_length = 10 (the 10-byte header size): the assessor
          reads 10 bytes; surplus bytes stay in the persistent HTTP/1.1 socket as the next assessor request
          prefix.'
        - 'Use KELVIN SIGN U+212A (bytes e284aa, 3 bytes = 1 char) as the name to show the name framing
          disagreement: front decodes raw UTF-8 → 1 char; assessor applies NFKC + casefold + [:3] → 3
          chars. After the 10-byte header, include a valid HTTP POST to /assess/privileged as the surplus
          bytes; the final 3 envelope bytes become the smuggled POST body.'
        - 'Submit the envelope via persistent HTTP/1.1 keep-alive to packages.inspection-envelope, then
          immediately send a normal inspection on the SAME connection. The inspection service reads the
          assessor''s buffered privileged response instead of the expected assessment: assessment=privileged-access-confirmed
          in the result.'
        completion:
          mode: automatic_range_evidence
      - id: K07.3
        title: The protected inspection
        description: Use the framing capability to perform the inspector's protected package action and
          recover its restricted assessment.
        difficulty: expert
        points: 400
        hints:
        - 'The K07.3 protected route requires a valid K07.1 inspection_id as authorization. The smuggled
          POST body is binary-framed: 2 bytes big-endian payload_len followed by {"inspection_id":"INSP-XXXXXXXX"}
          JSON. An invalid or absent inspection_id returns 403 from the assessor with no state change.'
        - 'Apply K07.2''s body-framing primitive: front_following_length=10 (CL to assessor = 10-byte
          header). Surplus bytes = POST /assess/inspect-privileged headers with Content-Length=(2+len(JSON))
          followed by the binary-framed body. No trailing bytes should remain so the assessor connection
          stays alive.'
        - After submitting the envelope, query GET /api/protected-assessment/latest to retrieve the result.
          It binds the K07.1 inspection_id, the K07.1 assessor_correlation_id, and the real Verdaccio
          @keplerops/support-rehearsal package data. Both the K07.1 trace and the protected assessment
          are the correlated audit evidence for K07.3 completion.
        completion:
          mode: automatic_range_evidence
    - id: K08
      chapter: Package line
      title: Four keys, one entitlement
      allocation:
        medium: 1
        hard: 2
      cards:
      - id: K08.1
        title: The old entitlement
        description: FieldKest still recognizes an old entitlement format. Recover its protected compatibility
          record and determine what the checker considers an entitlement.
        difficulty: medium
        points: 100
        hints:
        - Navigate to fieldkest/connector-archive in Gitea using the developer credentials. The entitlement
          record is at internal/fieldlink/legacy-diagnostics/CRR-OG2/ENT-ARWC-DIAG-0698.json. Read its
          commit history to see the revision 3 → revision 4 progression and understand the entitlement's
          legacy context.
        - The HKDF derivation context is in the K05.2 release record REL-FLK-6.9.8-ARCHIVE. Fetch it via
          the packages.release route; its compatibility field has ikm_hex, salt_hex, info_utf8, aad_utf8,
          and key_id. These are the context inputs needed by the checker.
        - POST to packages.entitlement-check with checker=v1, the full entitlement JSON from Gitea, and
          the context from the release record. The checker decrypts using HKDF-SHA256 + AES-256-GCM and
          returns customer_id, feature_id, package_revision, expiry_policy, revision, and state=baseline-valid.
        completion:
          mode: automatic_range_evidence
      - id: K08.2
        title: The missing encryption context
        description: Recover the cryptographic context needed to reproduce the legacy entitlement check
          for the supplied record.
        difficulty: hard
        points: 200
        hints:
        - The v2 entitlement record is in the same Gitea CRR-OG2 directory as the v1 record, named ENT-ARWC-DIAG-0698-V2.json.
          It has schema=fieldkest.entitlement-record/v2 and an expiry_policy top-level field — this is
          the missing encryption context for the v2 checker.
        - The checker=v2 reads expiry_policy from the participant-supplied record body and derives the
          AES-256-GCM key using HKDF(info=base_info+"|"+expiry_policy). POST the v2 record with checker=v2
          to packages.entitlement-check. Without the expiry_policy field, v2 key derivation uses empty
          string and decryption fails (422).
        - The v2 result is state=legacy-test-accepted with revision=3, distinct from the K08.1 v1 baseline
          at revision=4. The expiry_policy field in the v2 record is the missing context — it was added
          to the record schema in v2 to allow context-binding derivation.
        completion:
          mode: automatic_range_evidence
      - id: K08.3
        title: An entitlement of our choosing
        description: Create an alternative entitlement the legacy checker accepts while preserving the
          required customer and feature binding.
        difficulty: hard
        points: 200
        hints:
        - Read ENT-ARWC-DIAG-0698-plaintext-template.json from the Gitea CRR-OG2 directory. Fill in expiry_policy
          from the K08.2 checker result and choose a revision integer != 4 and != 3. Serialize as canonical
          JSON (sort_keys=True, no spaces) before encrypting.
        - 'Encrypt the canonical JSON with AES-256-GCM: v2 HKDF key (HKDF(info=base_info+"|"+expiry_policy)
          from K08.2), a fresh 12-byte random nonce, and aad="ENT-ARWC-DIAG-0698|TEN-ARWC-019|FLK-6.9.8".
          Build the entitlement record JSON with cipher, ciphertext_base64, nonce_hex, tag_base64, and
          the metadata fields (including expiry_policy as a top-level field).'
        - POST to packages.entitlement-check with checker=v2, the crafted record (with expiry_policy),
          and the K08.2 HKDF context. Wrong customer_id or feature_id returns 422; checker=v1 also returns
          422. The correct alternate entitlement returns state=legacy-test-accepted with the participant's
          chosen revision.
        completion:
          mode: automatic_range_evidence
    - id: K09
      chapter: Build and preview
      title: Runner diary
      allocation:
        easy: 2
        medium: 2
      cards:
      - id: K09.1
        title: A runner tells on itself
        description: The failed build's public summary omits its useful details. Recover the retained
          runner log and the release-dossier reference it exposes.
        difficulty: easy
        points: 50
        hints:
        - Navigate to Jenkins (ci.keplerops.test) and open the fieldlink-report job. The most recent build
          is marked FAILURE. The build's public summary only shows FAILURE; the actual failure reason
          is in the console log.
        - Access the console log via the Jenkins API (GET /job/fieldlink-report/{build}/logText/progressiveText).
          The build failed because fixtures/report-crr-og2.json was missing from the workspace (FileNotFoundError).
          The build also archived three artifacts under reports/.
        - Download REVNOTE-{build_number}.json from the archived artifacts. It contains review_id, run_id,
          and a baseline field with a dossier reference (repository, ref, path). These are the log digest
          binding and dossier ID for K09.1 completion.
        completion:
          mode: automatic_range_evidence
      - id: K09.2
        title: The artifact without a link
        description: A completed job recorded an artifact that the current results page does not list.
          Recover that omitted artifact and its build revision.
        difficulty: easy
        points: 50
        hints:
        - 'The K09.1 REVNOTE has a run_id field (BLD-1842). The Jenkins results page lists only junit.xml.
          The CI runner service at review.keplerops.test is the separate publication surface; its .well-known/fieldkest-client
          lists the ci.run route for GET /api/runs/{run_id}. h1 cont: Access GET /api/runs/BLD-1842 on
          review.keplerops.test.'
        - Treat this as job-input trust and execution under a constrained service identity. Observe the
          ordinary and denied cases first, then change one input at a time and keep every unrelated binding
          fixed.
        - 'Download the omitted artifact via ci.run-artifact: GET /api/runs/BLD-1842/artifacts/integration-review-input-v3.json.
          The result has artifact_id=ART-BLD-1842-INTEGRATION-REVIEW, build_revision, object_version=3,
          and linked_support_ref. Wrong run IDs (BLD-9999) return 404.'
        completion:
          mode: automatic_range_evidence
      - id: K09.3
        title: A job input with reach
        description: Make the test job consume a support input outside the collection its ordinary form
          allows. Recover the restricted review output it produces.
        difficulty: medium
        points: 100
        hints:
        - 'Take the K09.2 integration-review-input-v3.json artifact (diagnostic_eligible=true) and POST
          it to ci.review-jobs on review.keplerops.test: {"support_input": <artifact>, "diagnostic": {"profile":
          "render-review"}}. The endpoint returns a run_id and result path.'
        - GET /api/review-jobs/{run_id} returns state=success, workspace_generation=WS-ROWAN-2026-09-G1,
          and review.maintained_reference (the diagnostic-request-reference content). The maintained_reference
          contains "POST /api/review-jobs" and the runner-operations.md path but NOT "FieldKest runner
          service connections".
        - The returned support_input field is "buildops://reviews/diagnostic-request-reference@3" (the
          integration reference). This is the K09.4 input. Ordinary inputs (diagnostic_eligible=false)
          return a different support_input and cannot access the integration diagnostic context.
        completion:
          mode: automatic_range_evidence
      - id: K09.4
        title: Run in the runner
        description: Use the review job to retrieve Build Operations' private runner note and verify the
          build-record connection it describes.
        difficulty: medium
        points: 100
        hints:
        - 'Use the K09.3 integration reference as support_input with diagnostic profile=runner-command.
          Job 1: argv=["/bin/cat", "/srv/fieldlink-ci/runner/runner-operations.md"]. The note identifies
          the worker (svc-fieldlink-ci), the STATUS_COMMAND for Job 2, and the service URL table.'
        - 'Job 2: use the STATUS_COMMAND from the note as argv=["/bin/sh", "-c", "..."]. It sources $FIELDLINK_RUN_DIR/connections.env
          (base URLs) and uses $FIELDLINK_RUN_DIR/build-records.curl (per-run worker token) to call $FIELDLINK_BUILD_RECORDS_URL/api/build-records/worker-status.'
        - The Job 2 response contains principal=svc-fieldlink-ci and availability=available. The two distinct
          run_ids and the build-records audit record (binding the worker lease, principal, and network
          origin) are the K09.4 completion evidence.
        completion:
          mode: automatic_range_evidence
    - id: K10
      chapter: Build and preview
      title: Preview belongs to whom
      allocation:
        medium: 2
        hard: 1
      cards:
      - id: K10.1
        title: Whose preview is this
        description: Recover the restricted preview association for the supplied support attachment. Establish
          which document identity the viewer believes it is presenting.
        difficulty: medium
        points: 100
        hints:
        - Navigate to preview.keplerops.test/.well-known/fieldkest-client to find the preview.association
          route. The preview service wraps Gotenberg (Chromium+LibreOffice renderer) and provides a preview
          queue API.
        - Query GET /api/preview/association?source=sup-k-2841 for the participant's own attachment. This
          returns document_id, source_version, and case_id (CAS-ROWAN-2841) for rowan.ito's case.
        - Query GET /api/preview/association?source=SUP-K-2841 (uppercase, the protected attachment).
          The service returns maya.ranscombe's case association (CAS-MAYA-2841, same document_id) without
          checking ownership. This is the K10.1 vulnerability.
        completion:
          mode: automatic_range_evidence
      - id: K10.2
        title: Two inputs, one identity
        description: Find distinct preview inputs that the viewer treats as the same protected document
          identity. Demonstrate the ambiguity with the supplied rehearsal documents.
        difficulty: medium
        points: 100
        hints:
        - 'The preview.documents route is at POST /api/preview/documents (see preview.keplerops.test client
          doc). It accepts {"source": "<url>", "source_id": "<id>"} and returns document_id, canonical_url,
          result_id. The document identity is derived from the canonical form of the source URL.'
        - 'Canonicalization: lowercase the full URL and strip the trailing slash. Submit the same path
          with different case in the hostname or with/without trailing slash. Both inputs produce the
          same canonical_url and therefore the same document_id (DOC-9BC054D6F95DFA6A).'
        - 'Collision pair: Input A = "http://sup.keplerops.test/attachment/sup-k-2841" and Input B = "http://SUP.keplerops.test/attachment/sup-k-2841/".
          Both return document_id= DOC-9BC054D6F95DFA6A (same as K10.1 associations). A different path
          returns a different id.'
        completion:
          mode: automatic_range_evidence
      - id: K10.3
        title: The other document's contents
        description: Deliver a crafted support document that crosses the viewer's intended isolation boundary
          and recovers the protected preview content.
        difficulty: hard
        points: 200
        hints:
        - 'POST to preview.render with {"html": "<crafted-html>", "source_id": "sup-k-2841", "document_id":
          "DOC-9BC054D6F95DFA6A"}. The service sends the HTML to Gotenberg unchanged — Chromium renders
          what the participant submits. The document_id from K10.1 and K10.2 is DOC-9BC054D6F95DFA6A.'
        - The preview service runs an internal document server at 127.0.0.1:9000 (loopback only — not
          reachable from outside the container). GET /protected-preview/{document_id} returns the protected
          HTML for that slot. Chromium can reach loopback; craft an HTML document with an iframe or JS
          fetch targeting http://127.0.0.1:9000/protected-preview/DOC-9BC054D6F95DFA6A.
        - When Chromium fetches the internal resource the service records the access and returns ssrf_confirmed=true,
          protected_case_id=CAS-MAYA-2841, owner=maya.ranscombe, and render_digest. The preview-ssrf-access
          and protected-content-reads audit records confirm the boundary crossing.
        completion:
          mode: automatic_range_evidence
    - id: K11
      chapter: Build and preview
      title: The compiler knows
      allocation:
        medium: 1
        hard: 2
        expert: 1
      cards:
      - id: K11.1
        title: Where the policy begins
        description: Recover the policy program embedded in the retained rules compiler and identify the
          input it actually evaluates.
        difficulty: medium
        points: 100
        hints:
        - Read work/build-operations/policy-compiler-handoff.md on the developer workstation. It directs
          you to the fieldkest/policy-compiler repository in Gitea (source.keplerops.test). Clone it;
          the repository website field points to the client reference on source-tools.keplerops.test:8443
          where the evaluation route is listed.
        - 'The retained binary bin/fieldkest-policyc is an unstripped ELF. Run nm to find the eight fieldkest_opcode_XX_NAME
          symbols. Search the binary for the FKPC magic bytes (the embedded 68-byte program table, 14
          four-byte instructions). Trace the PUSH_FIELD (0x00) opcodes by index to identify the four evaluated
          fields: tenant_state (0), connector_api (1), signer_lineage (2), compatibility_exception (3).'
        - Build a fieldkest.policy-program-model/v1 with the 68-byte program base64-encoded and its sha256.
          POST to source-tools.keplerops.test:8443/api/policy-compilers/fieldkest-policyc/evaluations
          with operation=corpus-check and policy_input={"corpus_id":"POLICY-CORPUS-2026-09-R4"}. The service
          returns a PCMIG receipt with program_sha256, corpus_result_sha256, and condition_set_sha256.
        completion:
          mode: automatic_range_evidence
      - id: K11.2
        title: Learn its instructions
        description: Reconstruct enough of the compiler's internal instruction behavior to reproduce the
          supplied policy fragments.
        difficulty: hard
        points: 200
        hints:
        - 'The fieldkest/policy-compiler repository README describes each fragment''s policy intent in
          the Fragments section. No .fkpc bytecode is provided — the participant must assemble each fragment.
          Use the FKPC encoding from K11.1: magic+header + 4-byte instructions [opcode:1, flags:1 (always
          0), operand:2-LE]. PUSH_FIELD operand is field index 0-3; PUSH_CONST is constant index (0=3.0.0,
          1=True); IN_SET is set index (0={active}, 1={fieldkest-release-2026}).'
        - 'Assemble each fragment as a minimal sequence ending with RETURN (0x07). tenant-state: PUSH_FIELD(0)
          IN_SET(0) RETURN. connector-version: PUSH_FIELD(1) PUSH_CONST(0) SEMVER_GTE RETURN. signer-lineage:
          PUSH_FIELD(2) IN_SET(1) RETURN. compatibility-exception: PUSH_FIELD(3) PUSH_CONST(1) EQ RETURN.
          Submit each with operation=fragment-check and policy_input={"fragment_id":"<name>"} to source-tools.keplerops.test:8443.
          See api/fragment-assembly-guide.json.'
        - The service validates each submitted program against server-side cases covering both accepting
          and rejecting inputs. A correct assembly passes all cases. A wrong field index, opcode, or operand
          fails at least one case (fragment_case_mismatch). All four PCMIG receipts are the K11.2 completion
          evidence.
        completion:
          mode: automatic_range_evidence
      - id: K11.3
        title: The rule behind the rule
        description: Recover the complete acceptance conditions enforced by the embedded policy program.
          Account for the constraints the ordinary documentation omits.
        difficulty: hard
        points: 200
        hints:
        - Run strings bin/fieldkest-policyc and look for constant and set values embedded as string literals.
          Then run the binary against examples/accepted.env and change one field at a time to find each
          condition boundary. The corpus in corpus/policy-corpus-2026-09-r4.json has cases failing on
          each field individually. The README states only operand indices (set index 0, const index 1,
          etc.) — not actual values. The binary and corpus cases are the only source.
        - 'Construct a fieldkest.policy-condition-set/v1 document using the schema shape in api/condition-set-template.json.
          Map the K11.2 opcodes to operators: IN_SET → "in" (values list); SEMVER_GTE → "semver_gte" (value
          string); EQ → "eq" (value boolean). Fill each value from the binary strings and corpus evidence.
          Follow the field order recovered in K11.1 (tenant_state, connector_api, signer_lineage, compatibility_exception).'
        - Submit operation=condition-check with the program model and policy_input={"corpus_id":"POLICY-CORPUS-2026-09-R4","condition_set":{...}}.
          Any wrong value or operator → condition_set_mismatch. The PCMIG receipt includes condition_set_sha256
          and corpus_result_sha256. Keep both for K11.4.
        completion:
          mode: automatic_range_evidence
      - id: K11.4
        title: An input the compiler believes
        description: Construct a package-policy input that satisfies the recovered program while authorizing
          Cinder's requested compatibility case.
        difficulty: expert
        points: 400
        hints:
        - 'Obtain a fresh one-use nonce first: POST {} to source-tools.keplerops.test:8443/api/policy-compilers/fieldkest-policyc/nonces.
          The nonce expires in five minutes and is consumed by the first syntactically valid acceptance
          request even if the binary rejects the input. Get the nonce immediately before submitting. See
          api/accept-template.json for the request shape.'
        - 'Build policy_input with all six fields: the four conditions recovered in K11.3 (use the values
          from binary and corpus analysis — the values the binary was compiled with), plus channel="preview"
          and tenant_class="field-service" as context. Add the fresh nonce and corpus_result_sha256 from
          K11.3. All four conditions must be satisfied for the binary to return accepted=true.'
        - Submit operation=accept with the program model from K11.1 and the prepared policy_input. The
          service runs the real binary (fieldkest-policyc). If accepted, the PCACC receipt includes program_id=FKPC-POLICY-2026-09-R4,
          binary_sha256, condition_set_sha256, and evaluated_fields. A replay of the same nonce returns
          stale_or_replayed_nonce. The PCACC receipt is the K11 completion evidence.
        completion:
          mode: automatic_range_evidence
    - id: K12
      chapter: Build and preview
      title: Approved in the browser
      allocation:
        hard: 1
        expert: 2
        elite: 1
      cards:
      - id: K12.1
        title: The reviewer arrives second
        description: Place your controlled preview content in the privileged reviewer's effective workflow
          despite the account and review-state boundaries.
        difficulty: hard
        points: 200
        hints:
        - 'The K10.1 association lookup for SUP-K-2841 returns a viewer_request field — the review ID
          linked to the protected case (PRV-771). The preview service client reference at preview.keplerops.test/.well-known/fieldkest-client
          lists the preview.assignment route: PATCH /api/preview/reviews/{review_id}/assignment.'
        - PATCH preview.assignment with {"queue":"privileged-review","source_id":"<twin>"} where twin
          is the lowercase collision from K10.2. The route accepts any authenticated request regardless
          of review ownership — the submitter identity check is omitted on reassignment. This places the
          participant's content in the privileged reviewer's queue.
        - 'The service returns {"state":"loaded","action_nonce":"..."} and a review-assignments audit
          entry. Read GET /api/preview/reviews/PRV-771 to confirm the persisted state: queue=privileged-review,
          source_id=twin, original_owner=maya.ranscombe. That persisted record is the K12.1 evidence.
          The action_nonce is input to K12.2.'
        completion:
          mode: automatic_range_evidence
      - id: K12.2
        title: A value across the action boundary
        description: Recover the protected browser value required for a privileged preview action and
          make that separate action accept it.
        difficulty: expert
        points: 400
        hints:
        - The K12.1 response does NOT expose the action_nonce. The nonce is delivered by the internal
          reviewer session page at http://127.0.0.1:{INTERNAL_PORT}/review-session/PRV-771. The page sends
          window.parent.postMessage({action_nonce:"..."}, "*") — the "*" targetOrigin means no origin
          validation. Any parent frame hosting the session page receives the nonce.
        - Craft an HTML page with an iframe to the session page and a window.addEventListener("message",...)
          listener. Submit via POST /api/preview/render (K10.3 render endpoint). Gotenberg/Chromium renders
          the crafted HTML inside the container; the iframe loads the session, which posts the nonce to
          the parent frame. Write the nonce to the DOM; extract it from the resulting PDF.
        - 'Use the intercepted nonce as Authorization: Bearer <nonce> to POST /api/preview/reviews/PRV-771/prepare
          with body {}. Developer credential is rejected. Correct nonce transitions review to prepared
          and returns {"prepared":true}. Replay returns 403. review-preparations audit confirms the evidence.'
        completion:
          mode: automatic_range_evidence
      - id: K12.3
        title: The worker changes sides
        description: Take control of the preview worker's contribution to the support review while preserving
          the expected review interface.
        difficulty: expert
        points: 400
        hints:
        - After K12.1 (BOLA) and K12.2 (prepare), wait for the autonomous privileged-review worker. The
          worker runs on the preview service and polls every few seconds for prepared reviews in the privileged-review
          queue. When it picks up PRV-771, it renders the review's current source_id via Gotenberg without
          re-checking ownership.
        - Poll GET /api/preview/reviews/PRV-771 until state=rendered. The review record then contains
          render_digest (real PDF, 20KB+), renderer_identity=svc-preview-reviewer, and source_id=doc-9bc054d6f95dfa6a
          — the participant's twin rendered as the worker's authoritative contribution.
        - The review-renders audit records original_owner=maya.ranscombe alongside source_id=doc-9bc054d6f95dfa6a
          and renderer_identity=svc-preview-reviewer. The participant never holds the worker's credential.
          The render_digest is input to K12.4.
        completion:
          mode: automatic_range_evidence
      - id: K12.4
        title: The preview is ours
        description: Complete the chain into the constrained renderer and make the support engineer's
          release preview reflect Cinder's chosen result.
        difficulty: elite
        points: 800
        hints:
