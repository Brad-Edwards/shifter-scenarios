    - id: W12
      chapter: Water on paper
      title: Cold archive
      allocation:
        medium: 1
        hard: 2
        expert: 1
      cards:
      - id: W12.1
        title: A collector in quarantine
        description: Recover the historical collector associated with the archive lead and restore it
          as a usable analysis artifact.
        difficulty: medium
        points: 100
        hints:
        - Submit the lineage record from W11.3 to the planning.lineage-record route first. This unlocks
          the archive.quarantine-collector route in retained-archive.arwc.test's client document.
        - Download the QTN-COL-2019-12.aqtn artifact and parse its AQTN1 binary frame. The frame begins
          with the AQTN1 magic and fixed-width length and digest fields. The build ID and a JSON metadata
          header follow and identify the collector without requiring payload decryption.
        - Use the Gitea repository and access token from the quarantine response to download collector-crr
          via the Gitea API contents endpoint. Verify its SHA256 and submit it to archive.collector-recovery
          to earn the completion audit.
        completion:
          mode: automatic_range_evidence
      - id: W12.2
        title: How the collection was protected
        description: Reconstruct the collector's cryptographic behavior well enough to reproduce its handling
          of the supplied archive samples.
        difficulty: hard
        points: 200
        hints:
        - The collector binary's build ID (COLLECT-CRR-12) and the AQTN1 frame's archive ID (ARC-COLD-CRR-2019)
          are the HKDF inputs. IKM is the build ID as bytes, salt is the archive ID as ASCII, info is
          "aqtn1/keys". Derive 64 bytes and split into two 32-byte keys.
        - Apply each operation from AQTN1-samples.json. The first 32 key bytes are the AES-256-GCM content
          key. The second 32 bytes are the AES-256-KW wrapping key. For the authentication-failure sample,
          detect the GCM tag mismatch and record the sentinel "authentication_failed" instead of plaintext.
        - Submit a sample_results dict to archive.bundle-collection-policy mapping each sample ID to the
          SHA-256 hex digest of its computed output (or "authentication_failed" for the rejection case).
          Every sample must match exactly. The returned PROTECTION record names the derivation scheme
          needed for W12.3.
        completion:
          mode: automatic_range_evidence
      - id: W12.3
        title: The cold archive opens
        description: Recover the protected archive and the maintenance history it contains.
        difficulty: hard
        points: 200
        hints:
        - The AQTN1 frame from W12.1 contains the nonce (12 bytes after the build ID) and the metadata
          header JSON (immediately after the nonce). These are the GCM inputs. The encrypted payload with
          its 16-byte tag follows the metadata header.
        - Use the content key (first 32 HKDF bytes from W12.2) for AES-256-GCM decryption. The metadata
          header bytes are the AAD. The decrypted JSON contains wrapped_pkcs8 — unwrap it with the wrapping
          key (bytes 32-63) using AES-256-KW.
        - Submit the decrypted plaintext and the unwrapped PKCS8 key (both as base64) to archive.cold-archive-job.
          The service validates both and returns the ARC-COLD-CRR-2019 record naming the 37 maintenance
          records, COLLECT-2019-12, and rollover IDREL-COL-R4.
        completion:
          mode: automatic_range_evidence
      - id: W12.4
        title: A collection path still alive
        description: Reconstruct the surviving collection relationship and obtain the current protected
          data associated with the archived maintenance identity.
        difficulty: expert
        points: 400
        hints:
        - The archive plaintext from W12.3 contains the retired_client_certificate (PEM) and rollover
          dict (IDREL-COL-R4 with its CA-signed signature). These are the exchange inputs. The historical
          PKCS8 key from W12.3 is an Ed25519 key — use it to sign the proof message.
        - 'Sign the message "collect-archive/v3|CUR-COL-CRR-R11|R11|<nonce>" with the historical Ed25519
          key. Submit operation: exchange to archive.collection-path. The service checks the cert chain
          and rollover signature but not the retired_subject: true flag, so the retired identity succeeds.'
        - 'Use the returned collection_session token with operation: read and dataset CUR-COL-CRR-R11
          at revision 11 to retrieve the current protected data for AST-CRR-017. Session expires in 10
          minutes; a second exchange while it is active returns 409.'
        completion:
          mode: automatic_range_evidence
    - id: W35
