name: KONTAKTE pack

on:
  pull_request:
    paths:
      - "kontakte-sm-sa/**"
      - "tests/kontakte/**"
      - "docs/technical/plans/276-kontakte-sm-sa/**"
      - ".github/workflows/kontakte-pack.yml"

permissions:
  contents: read

concurrency:
  group: kontakte-pack-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-parity:
    name: Pack contract and source parity
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: false
      - name: Install the released contract pair
        run: |
          uv venv --python 3.14.4 /tmp/pack-check
          uv pip install --python /tmp/pack-check/bin/python -r tests/kontakte/requirements.txt
      - name: Check the pack
        run: /tmp/pack-check/bin/raes-pack-check --json kontakte-sm-sa
      - name: Check source parity and client inputs
        run: /tmp/pack-check/bin/python -I -m pytest tests/kontakte/test_oracle_parity.py -q
