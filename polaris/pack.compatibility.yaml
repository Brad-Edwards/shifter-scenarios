    - {path: aws-range/main.tf, export: operator}
    - {path: aws-range/ranges.tf, export: operator}
    - {path: aws-range/shared.tf, export: operator}
    - {path: aws-range/versions.tf, export: operator}
    - {path: aws-range/variables.tf, export: operator}
    - {path: aws-range/outputs.tf, export: operator}
    - {path: aws-range/user_data.sh.tpl, export: operator}
    - {path: aws-range/a2_user_data.ps1.tpl, export: operator}
    - {path: aws-range/a2_cold_bootstrap.sh, export: operator}
    - {path: aws-range/a2_install_adds.ps1, export: operator}
    - {path: aws-range/a2_setup.ps1, export: operator}
    - {path: aws-range/common.py, export: operator}
    - {path: aws-range/reset.sh, export: operator}
    - {path: ctfd/, export: operator}
    - {path: tests/, export: operator}
    - {path: validation/, export: operator}
    - {path: docs/golden-readiness-checklist.md, export: operator}
    - {path: docs/walkthroughs/, export: operator}
    - {path: docs/aws-event-rehearsal-report.md, export: operator}
    - {path: docs/aws-event-manual-walkthrough-report.md, export: operator}
    - {path: docs/final-reconciliation-report.md, export: operator}
    - {path: docs/topology-and-assets.md, export: operator}
    - {path: docs/reference-triangle.md, export: operator}
    - {path: docs/lineage.md, export: commercial}
    - {path: profiles/guided/operator/, export: commercial}
    - {path: profiles/purple-team/operator/, export: commercial}
    - {path: profiles/agent-benchmark/operator/, export: commercial}
    - {path: profiles/agent-benchmark/operator/scoring-hooks.yaml, export: commercial}
