  - {asset_id: challenge-copy, path: challenges/, visibility: participant, status: shipped}
  - {asset_id: participant-briefing, path: briefing-deck/, visibility: commercial, status: shipped}
  - {asset_id: planned-participant-briefing, path: assets/briefing/, visibility: participant, status: planned}
  - {asset_id: planned-planted-content, path: assets/content/, visibility: commercial, status: planned}
  - {asset_id: planned-service-source, path: assets/services/, visibility: commercial, status: planned}
  - {asset_id: profile-bundles, path: profiles/, visibility: commercial, status: shipped}
  - {asset_id: benchmark-scoring-adapter, path: profiles/agent-benchmark/operator/scoring-hooks.yaml, visibility: operator, status: shipped}
  - {asset_id: aws-event-rehearsal-evidence, path: docs/aws-event-rehearsal-report.md, visibility: operator, status: shipped}
  - {asset_id: manual-walkthrough-evidence, path: docs/aws-event-manual-walkthrough-report.md, visibility: operator, status: shipped}
