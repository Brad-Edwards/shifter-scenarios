  - {asset_id: aws-event-terraform-source, path: aws-range/main.tf, visibility: operator, status: shipped}
  - {asset_id: aws-event-ad-bootstrap-source, path: aws-range/a2_cold_bootstrap.sh, visibility: operator, status: shipped}
  - {asset_id: aws-event-reset-source, path: aws-range/reset.sh, visibility: operator, status: shipped}
  - {asset_id: aws-event-build-tarball, path: build/build-v1.tar.gz, visibility: operator, status: shipped}
  - {asset_id: ctfd-source, path: ctfd/, visibility: operator, status: shipped}
