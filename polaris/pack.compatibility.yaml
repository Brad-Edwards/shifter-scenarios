operator_surfaces:
  - {surface_id: range-build, path: build/, role: range_ops, visibility: operator, status: shipped}
  - {surface_id: aws-event-lifecycle, path: tests/aws_event_rehearsal.py, role: range_ops, visibility: operator, status: shipped}
  - {surface_id: ctfd-reconciliation, path: ctfd/, role: range_ops, visibility: operator, status: shipped}
  - {surface_id: scenario-smoketests, path: tests/, role: validator, visibility: operator, status: shipped}
  - {surface_id: attack-path, path: docs/attack-path.md, role: facilitator, visibility: oracle, status: shipped}
  - {surface_id: oracle-validation, path: validation/, role: validator, visibility: operator, status: shipped}
  - {surface_id: profile-validation, path: profiles/validate_profiles.py, role: validator, visibility: commercial, status: shipped}
  - {surface_id: benchmark-scoring-adapter, path: profiles/agent-benchmark/operator/scoring-hooks.yaml, role: validator, visibility: operator, status: shipped}
  - {surface_id: aws-event-reset, path: aws-range/reset.sh, role: range_ops, visibility: operator, status: shipped}
  - {surface_id: aws-event-rehearsal, path: tests/aws_event_rehearsal.py, role: validator, visibility: operator, status: shipped}
  - {surface_id: aws-event-teardown, path: tests/aws_event_rehearsal.py, role: range_ops, visibility: operator, status: shipped}
  - {surface_id: final-reconciliation, path: docs/final-reconciliation-report.md, role: validator, visibility: operator, status: shipped}

validation:
  commands:
    - id: central-pack-contract
      command: aces-pack-validate --pack polaris
      validates: [published-pack-contract, pack-metadata, provenance]
    - id: central-pack-release
      command: aces-pack-release check --pack polaris
      validates: [release-boundaries, participant-leak-scan]
    - id: polaris-oracle
      command: python3 polaris/validation/validate_oracle.py validate
      validates: [hidden-path, affordances, objective-oracle, flag-layer-joins, negative-gates, participant-leak-scan]
    - id: polaris-ctfd
      command: python3 -m unittest discover -s polaris/ctfd/tests
      validates: [stable-flag-projection, namespace-isolation, idempotent-reconciliation, safe-auth]
    - id: polaris-profiles
      command: python3 polaris/profiles/validate_profiles.py validate
      validates: [delivery-bundles, participant-operator-split, runtime-profile-joins, benchmark-joins, leak-scan]
    - id: polaris-aws-event-tests
      command: python3 -m unittest polaris.tests.test_aws_range_rehearsal
      validates: [build-artifact, event-provider-binding, participant-entry, flag-paths, reset, teardown, walkthrough-binding]
  gates:
    - id: manifest-schema
      kind: schema
      paths:
        - {path: pack.compatibility.yaml}
        - {path: docs/provenance-ledger.yaml}
    - id: private-oracle-contract
      kind: unit-test
      paths:
        - {path: oracle/polaris-oracle.yaml}
        - {path: oracle/affordances.yaml}
        - {path: validation/validate_oracle.py}
    - id: flag-layer-contract
      kind: unit-test
      paths:
        - {path: flags/placement.yaml}
        - {path: challenges/challenges.yaml}
        - {path: oracle/affordances.yaml}
        - {path: ctfd/tests/}
    - id: profile-bundle-contract
      kind: unit-test
      paths:
        - {path: profiles/bundles.yaml}
        - {path: profiles/validate_profiles.py}
        - {path: profiles/tests/}
    - id: aws-event-source-contract
      kind: unit-test
      paths:
        - {path: aws-range/main.tf}
        - {path: aws-range/ranges.tf}
        - {path: aws-range/shared.tf}
        - {path: aws-range/versions.tf}
        - {path: aws-range/variables.tf}
        - {path: aws-range/outputs.tf}
        - {path: aws-range/user_data.sh.tpl}
        - {path: aws-range/a2_user_data.ps1.tpl}
        - {path: aws-range/a2_cold_bootstrap.sh}
        - {path: aws-range/a2_install_adds.ps1}
        - {path: aws-range/a2_setup.ps1}
        - {path: aws-range/common.py}
        - {path: aws-range/reset.sh}
        - {path: build/build-v1.tar.gz}
        - {path: tests/aws_event_rehearsal.py}
        - {path: tests/aws_event_participant.py}
        - {path: tests/test_aws_range_rehearsal.py}
    - id: participant-export-leak-scan
      kind: leak-scan
      paths:
        - {path: README.md}
        - {path: docs/concepts.md}
        - {path: briefing-deck/}
        - {path: challenges/}
        - {path: profiles/_shared/}
        - {path: profiles/guided/participant/}
        - {path: profiles/unguided/participant/}
        - {path: profiles/agent-benchmark/participant/}
    - id: aws-event-rehearsal-evidence
      kind: rehearsal
      paths:
        - {path: tests/aws_event_rehearsal.py}
        - {path: tests/aws_event_participant.py}
        - {path: docs/aws-event-rehearsal-report.md}
    - id: manual-participant-walkthrough
      kind: manual-walkthrough
      paths:
        - {path: docs/walkthroughs/}
        - {path: docs/aws-event-manual-walkthrough-report.md}
    - id: final-reconciliation
      kind: unit-test
      paths:
        - {path: pack.yaml}
        - {path: pack.compatibility.yaml}
        - {path: docs/provenance-ledger.yaml}
        - {path: docs/final-reconciliation-report.md}
        - {path: tests/test_topology_design.py}
