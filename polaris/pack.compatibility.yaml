    - {path: profiles/bundles.yaml, export: commercial}
    - {path: profiles/validate_profiles.py, export: commercial}
    - {path: profiles/tests/, export: commercial}

runtime_profiles:
  - profile_id: local_degraded
    status: planned
    provider: docker-compose
    description: >
      Degraded fast-feedback binding over the canonical SDL. It cannot prove
      golden status and does not supply the required isolated Windows,
      participant-access, splice-watcher, or authentic industrial boundaries.
    build:
      - {path: build/docker-compose.yml}
    tests:
      - {path: tests/run-all-smoketests.sh}
      - {path: tests/test_topology_design.py}
    walkthroughs:
      - {path: docs/walkthroughs/00-range-access-docker.md}
  - profile_id: aws_event
    status: supported
    provider: aws
    description: >
      The event-proven Polaris AWS binding: one dedicated, isolated
      per-participant subnet containing the compact compose event range and a
      real Windows AD domain controller. It preserves the runtime used for
      Polaris events and supports automated and manual participant-equivalent
      event-path proof. It is not the doctrine-complete golden binding: the fictional industrial
      services are authored event simulations rather than vendor-supported
      hardware twins, and the compose services do not realize every SDL host
      as separate infrastructure. The pack therefore remains draft.
    build:
      - {path: aws-range/main.tf}
      - {path: aws-range/ranges.tf}
      - {path: aws-range/shared.tf}
      - {path: aws-range/versions.tf}
      - {path: aws-range/variables.tf}
      - {path: aws-range/outputs.tf}
      - {path: aws-range/user_data.sh.tpl}
      - {path: aws-range/a2_user_data.ps1.tpl}
      - {path: aws-range/a2_cold_bootstrap.sh}
      - {path: aws-range/a2_install_adds.ps1}
      - {path: aws-range/a2_setup.ps1}
      - {path: aws-range/common.py}
      - {path: aws-range/reset.sh}
      - {path: build/build-v1.tar.gz}
      - {path: build/build-v1.tar.gz.sha256}
      - {path: build/}
    tests:
      - {path: tests/aws_event_rehearsal.py}
      - {path: tests/aws_event_participant.py}
      - {path: tests/test_aws_range_rehearsal.py}
    walkthroughs:
      - {path: docs/walkthroughs/00-range-access-aws-event.md}
      - {path: docs/walkthroughs/flags-01-06-osint.md}
      - {path: docs/walkthroughs/flags-07-19-front-office.md}
      - {path: docs/walkthroughs/flags-20-30-lab.md}
      - {path: docs/walkthroughs/flags-31-36-bunker.md}
delivery_bundles:
  - bundle_id: guided
    status: supported
    audience: guided
    manifest: {path: profiles/bundles.yaml}
    participant_paths: [{path: profiles/guided/participant/}]
    operator_paths: [{path: profiles/guided/operator/}]
    validation: [{path: profiles/validate_profiles.py}]
  - bundle_id: unguided
    status: supported
    audience: unguided
    manifest: {path: profiles/bundles.yaml}
    participant_paths: [{path: profiles/unguided/participant/}]
    validation: [{path: profiles/validate_profiles.py}]
  - bundle_id: purple-team
    status: supported
    audience: purple-team
    manifest: {path: profiles/bundles.yaml}
    operator_paths: [{path: profiles/purple-team/operator/}]
    validation: [{path: profiles/validate_profiles.py}]
  - bundle_id: agent-benchmark
    status: supported
    audience: agent-benchmark
    manifest: {path: profiles/bundles.yaml}
    participant_paths: [{path: profiles/agent-benchmark/participant/}]
    operator_paths: [{path: profiles/agent-benchmark/operator/}]
    validation: [{path: profiles/validate_profiles.py}]
  - bundle_id: demo
    status: supported
    audience: demo
    manifest: {path: profiles/bundles.yaml}
    operator_paths: [{path: profiles/demo/operator/}]
    validation: [{path: profiles/validate_profiles.py}]
platform_features:
  - feature_id: windows-active-directory
    status: required
    runtime_profiles: [aws_event]
    description: A real range-local Windows Server Active Directory forest and domain controller.
  - feature_id: event-industrial-services
    status: required
    runtime_profiles: [aws_event]
    description: The fictional NORTHSTORM platform's authored HMI, Modbus controllers, and stateful safety interlocks run as the same simulations used at Polaris events; they are not a vendor-supported hardware twin.
  - feature_id: participant-access
    status: required
    runtime_profiles: [aws_event]
    description: Automated range-scoped browser, SSH, RDP, VPN, or jump access to A14 without management-plane handoff.
  - feature_id: isolated-controlled-egress
    status: required
    runtime_profiles: [aws_event]
    description: A dedicated VPC, /28, and security group per rehearsal, with no cross-range route and only runner-/32 SSH/RDP ingress.
  - feature_id: reference-ctfd
    status: optional
    runtime_profiles: [aws_event]
    description: The shipped reference loader projects canonical stable flag ids without treating CTFd solves as objective verdicts.

