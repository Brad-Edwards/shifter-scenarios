    evidence_requirements: [bunker-evidence]

assertions:
  target-picture-complete: {description: Target-picture objective passed., proposition: target-picture-complete, role: postcondition, polarity: positive}
  front-office-complete: {description: Front-office objective passed., proposition: front-office-complete, role: postcondition, polarity: positive}
  leviathan-extracted: {description: Lab objective passed., proposition: leviathan-extracted, role: postcondition, polarity: positive}
  scada-blackout-complete: {description: SCADA blackout objective passed., proposition: scada-blackout-complete, role: postcondition, polarity: positive}
  autonomous-platform-seized: {description: Bunker objective passed., proposition: autonomous-platform-seized, role: postcondition, polarity: positive}

# ---------------------------------------------------------------------------
# Agents — participant actor declaration
# ---------------------------------------------------------------------------

agents:
  polaris-participant:
    description: Offensive participant who discovers and executes the NORTHSTORM path.
    entity: participant
    actions:
      - osint
      - web-exploit
      - password-spray
      - kerberoast
      - dcsync
      - smb-enum
      - sql-injection
      - lfi
      - git-history-scan
      - sudo-privesc
      - modbus-probe
      - binary-handshake
    starting_accounts: [kali]
    initial_knowledge:
      hosts: [a14-kali]
      subnets: [shared-net, corporate-net]
      services: [boreas-http, ssh]

# ---------------------------------------------------------------------------
# Objectives — participant-achieved mission outcomes
# ---------------------------------------------------------------------------

objectives:
  establish-target-picture:
    name: Establish the target picture
    description: Discover Boreas through the participant-accessible OSINT path.
    agent: polaris-participant
    actions: [osint]
    targets: [a0-boreas-web, dns-boreas]
    success: {assertions: [target-picture-complete]}
  compromise-front-office:
    name: Compromise the front office
    description: Compromise the enterprise path from the participant surface.
    agent: polaris-participant
    actions: [password-spray, sql-injection, smb-enum, kerberoast, dcsync]
    targets: [a1-mail, a3-intranet, a4-fileshare, a2-dc01]
    success: {assertions: [front-office-complete]}
    depends_on: [establish-target-picture]
  extract-leviathan:
    name: Extract the Leviathan program
    description: Pivot into the lab and recover the intended Leviathan material.
    agent: polaris-participant
    actions: [git-history-scan, lfi, sql-injection]
    targets: [a6-eng-ws01, a7-git, a8-research-db]
    success: {assertions: [leviathan-extracted]}
    depends_on: [compromise-front-office]
  lights-out:
    name: Trigger the SCADA blackout
    description: Use the participant-accessible SCADA path to trigger the blackout and splice state.
    agent: polaris-participant
    actions: [sudo-privesc, modbus-probe]
    targets: [a15-ops-eng01, a5-scada-gw]
    success: {assertions: [scada-blackout-complete]}
    depends_on: [compromise-front-office]
  seize-autonomous-platform:
    name: Seize the autonomous platform
    description: Reach the bunker through the opened splice and complete the autonomous-platform objective.
    agent: polaris-participant
    actions: [modbus-probe, binary-handshake]
    targets: [a10-tail-ctrl, a11-leg-ctrl, a12-arms-ctrl, a13-brain-main]
    success: {assertions: [autonomous-platform-seized]}
    depends_on: [extract-leviathan, lights-out]

# ---------------------------------------------------------------------------
# Workflows — mission ordering and gates
# ---------------------------------------------------------------------------

workflows:
  operation-northstorm:
    description: Main campaign — Mission 1 → 2 → (3, 4) → 5
    start: m1
    timeout: 6 hour
    steps:
      m1:
        type: objective
        objective: establish-target-picture
        on_success: m2
      m2:
        type: objective
        objective: compromise-front-office
        on_success: m3-m4
      m3-m4:
        type: parallel
        branches: [branch-m3, branch-m4]
        join: missions-joined
      branch-m3:
        type: objective
        objective: extract-leviathan
        on_success: missions-joined
      branch-m4:
        type: objective
        objective: lights-out
        on_success: missions-joined
      missions-joined:
        type: join
        next: m5
      m5:
        type: objective
        objective: seize-autonomous-platform
        on_success: stop
      stop:
        type: end

# ---------------------------------------------------------------------------
# Injects / Events / Scripts / Stories — minimal because Polaris has no
# scheduled injections; keep the surfaces populated so orchestrators
# exercise the contract.
# ---------------------------------------------------------------------------

injects:
  briefing-arrives:
    name: Operation brief delivered
    from_entity: white-cell
    to_entities: [participant]
    description: Mission brief sent when the range boots

events:
  briefing-event:
    injects: [briefing-arrives]

scripts:
  boot-script:
    start_time: 0s
    end_time: 5 min
    speed: 1.0
    events: {briefing-event: 10s}

stories:
  northstorm-story:
    speed: 1.0
    scripts: [boot-script]
