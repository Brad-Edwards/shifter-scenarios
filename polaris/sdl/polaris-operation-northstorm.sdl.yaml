# ---------------------------------------------------------------------------
# Vulnerabilities — CWE-labelled or misconfiguration-labelled weaknesses
# ---------------------------------------------------------------------------

vulnerabilities:
  dns-axfr-enabled:
    name: DNS AXFR enabled
    class: CWE-200
    technical: true
    description: BIND configured to accept AXFR zone transfers from any source
  directory-listing-exposed:
    name: Nginx directory listing exposed
    class: CWE-548
    technical: true
    description: nginx autoindex enabled on /internal/ despite robots.txt hint
  pdf-metadata-leak:
    name: PDF metadata leak
    class: CWE-200
    technical: true
    description: PDFs on A0 expose flag values inside Author / Title metadata fields
  information-disclosure-email:
    name: Seeded mailboxes disclose secrets
    class: CWE-200
    technical: true
    description: Pre-populated mailboxes leak service-account credentials and business intel
  ad-kerberoastable-spn:
    name: Kerberoastable service-account SPN
    class: CWE-916
    technical: true
    description: svc-backup SPN registered with a weak password; offline-crackable
  ad-dcsync-overprivilege:
    name: svc-backup granted DCSync rights
    class: CWE-269
    technical: true
    description: Replicating-Directory-Changes extended right enables DCSync
  ad-stale-disabled-account:
    name: Terminated engineer still enabled in AD
    class: CWE-272
    technical: false
    description: j.chen terminated but account still enabled and in Engineering group
  ad-domain-admin-misconfig:
    name: CEO in Domain Admins
    class: CWE-269
    technical: false
    description: v.harlan placed in Domain Admins as a misconfiguration
  sqli-search:
    name: Intranet search SQL injection
    class: CWE-89
    technical: true
    description: /search endpoint vulnerable to UNION-based SQL injection
  lfi-download:
    name: Intranet download LFI
    class: CWE-22
    technical: true
    description: /download endpoint permits path-traversal
  dotenv-exposed:
    name: /.env served as static content
    class: CWE-538
    technical: true
    description: Intranet exposes admin credentials via static .env file
  smb-overbroad-acls:
    name: Overbroad SMB share ACLs
    class: CWE-732
    technical: true
    description: Public / HR / Procurement shares readable by all authenticated users
  modbus-no-auth:
    name: Modbus without authentication
    class: CWE-306
    technical: true
    description: Modbus/TCP has no authentication (protocol standard)
  modbus-stateful-unlock-sequence:
    name: Modbus stateful unlock sequence
    class: CWE-693
    technical: true
    description: Flag register becomes visible only after a specific timed sequence
  scada-hmi-cached-password:
    name: SCADA HMI admin password cached
    class: CWE-798
    technical: true
    description: HMI admin credential cached on A15 /root/.scada/hmi.json
  ssh-password-auth:
    name: OpenSSH permits password authentication
    class: CWE-521
    technical: true
    description: sshd_config enables password-based authentication
  deleted-gpg-blob-recoverable:
    name: Deleted GPG blob recoverable
    class: CWE-212
    technical: true
    description: GPG ciphertext in /tmp/.deleted/ is unlinked but recoverable
  jenkins-credentials-file:
    name: Jenkins credentials file on disk
    class: CWE-798
    technical: true
    description: /home/jenkins/.credentials exposes a deploy token
  git-history-leaked-token:
    name: Git history contains removed token
    class: CWE-540
    technical: true
    description: git log -p reveals a removed CI deploy token in deploy.yml
  git-deleted-file-recoverable:
    name: Git-deleted schematic recoverable
    class: CWE-1295
    technical: true
    description: git show <parent>:schematic.svg recovers a deleted binary schematic
  gitea-repo-visibility-misconfig:
    name: Leviathan repo marked internal
    class: CWE-284
    technical: true
    description: leviathan-assembly visibility set internal — any authenticated user can clone
  security-definer-sqli:
    name: SECURITY DEFINER SQL injection
    class: CWE-89
    technical: true
    description: Stored procedure enables compartment escalation via SQLi
  postgres-compartment-role-bypass:
    name: Postgres compartment role bypass
    class: CWE-285
    technical: true
    description: compartment_b/compartment_c reachable via role switch + SQLi
  ssh-key-only-post-gate:
    name: Splice-landing key-only post gate
    class: CWE-287
    technical: true
    description: Splice landing authorized_keys seeded only after trigger
  ssh-key-only-research-user:
    name: Research-analyst key-only account
    class: CWE-287
    technical: true
    description: research-analyst user key-only; key recovered through chain
  brain-xor-handshake-reversible:
    name: Brain XOR handshake reversible
    class: CWE-327
    technical: true
    description: XOR challenge-response derived from discoverable serial numbers
  sudo-arg-injection:
    name: Sudo arg injection via unquoted flag
    class: CWE-78
    technical: true
    description: /opt/ops/scada_diag.sh sudo entry has an unquoted --host argument
  default-password-reuse:
    name: Corporate default password reuse
    class: CWE-521
    technical: false
    description: Welcome1 reused by m.webb, s.ivanov, p.shah and others

# ---------------------------------------------------------------------------
# Entities — exercise participants and organisations
# ---------------------------------------------------------------------------

entities:
  aurora-collective:
    name: AURORA Collective
    role: red
    mission: Seize PROJECT LEVIATHAN
  participant:
