propositions:
  target-picture-complete:
    description: The participant established the Boreas target picture through range interaction.
    subjects: [participant]
    basis: observed_state
    predicate: {kind: boolean, property: participant_outcome.target_picture_established, semantic_ref: "urn:aces:participant-outcome:polaris-target-picture-established", operator: equals, expected: true}
    evidence_requirements: [target-picture-evidence]
  front-office-complete:
    description: The participant compromised the Boreas front-office path through range interaction.
    subjects: [participant]
    basis: observed_state
    predicate: {kind: boolean, property: participant_outcome.front_office_compromised, semantic_ref: "urn:aces:participant-outcome:polaris-front-office-compromised", operator: equals, expected: true}
    evidence_requirements: [front-office-evidence]
  leviathan-extracted:
    description: The participant extracted the Leviathan program through the lab path.
    subjects: [participant]
    basis: observed_state
    predicate: {kind: boolean, property: participant_outcome.leviathan_extracted, semantic_ref: "urn:aces:participant-outcome:polaris-leviathan-extracted", operator: equals, expected: true}
    evidence_requirements: [leviathan-evidence]
  scada-blackout-complete:
