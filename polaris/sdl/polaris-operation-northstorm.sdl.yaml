# ---------------------------------------------------------------------------
# Relationships — credential and pivot chains
# ---------------------------------------------------------------------------

relationships:
  boreas-domain-controller:
    type: domain_controller_for
    source: a2-dc01
    target: boreas
    domain_controller: {}

  # Multi-zone credential chain
  vasik-to-gitea:
    type: authenticates_with
    source: e-vasik
    target: a7-git
    description: e.vasik's AD credentials authenticate to Gitea
  vasik-to-mail:
    type: authenticates_with
    source: e-vasik
    target: a1-mail
  vasik-to-intranet:
    type: authenticates_with
    source: e-vasik
    target: a3-intranet

  # Password reuse is a declared account weakness, not a reward dependency.
  webb-ivanov-password-reuse:
    type: trusts
    source: m-webb
    target: s-ivanov
    description: These accounts share the intentionally weak synthetic default password.
  ivanov-shah-password-reuse:
    type: trusts
    source: s-ivanov
    target: p-shah
    description: These accounts share the intentionally weak synthetic default password.

  # Pivot chain (A14 → A15 → A5, A14 → A16 → A7, A9 → bunker)
  kali-pivots-through-ops:
    type: connects_to
    source: a14-kali
    target: a5-scada-gw
    properties:
      via: a15-ops-eng01
      unlock: participant_scada_access
  kali-pivots-through-analyst:
    type: connects_to
    source: a14-kali
    target: a7-git
    properties:
      via: a16-research-analyst01
  kali-pivots-through-splice:
    type: connects_to
    source: a14-kali
    target: a13-brain-main
    properties:
      via: a9-splice-landing
      unlock: scada_blackout_completed

  # AD group nesting (Project-L ⊂ Research-Coordination ⊂ Engineering-Support)
  # is expressed via accounts.<x>.groups + the description below. Groups are
  # opaque strings; backend realisation creates the nested group objects.

  # Cryptography chain
  gpg-a8-stores-private-key:
    type: depends_on
    source: a8-research-db
    target: e-vasik
    description: GPG private key stored as base64 blob in compartment_b.key_storage
