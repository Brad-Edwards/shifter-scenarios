name: keplerops-module-10-full-atlas-expansion-b
version: 1.0.0
module:
  id: shifter/keplerops-module-10-full-atlas-expansion-b
  version: 1.0.0
  exports:
    behavior_specifications: &id001
    - kep-m10-j
    - kep-m10-k
    conditions:
    - kep-m10-j-complete
    - kep-m10-k-complete
    propositions:
    - kep-m10-j-satisfied
    - kep-m10-k-satisfied
    assertions:
    - kep-m10-j-satisfied
    - kep-m10-k-satisfied
    evidence_requirements:
    - kep-m10-j-proof
    - kep-m10-k-proof
    objectives: *id001
  description: Source implementation contracts for Module 10 full-ATLAS deployed-impact expansion.
behavior_specifications:
  kep-m10-j:
    semantic_version: 1.0.0
    lifecycle_state: draft
    participant_refs:
    - core.participant
    authority_scope_refs: &id003
    - nodes.core.inference-gateway.services.inference-api
    - nodes.core.platform-impact-01.services.platform-impact-api
    - nodes.core.artifact-store-01.services.artifact-object-store
    - nodes.core.exfil-sink.services.exfil-s3
    - nodes.core.dataset-store-01.services.dataset-postgres
    - nodes.core.platform-agent-01.services.platform-agent-api
    ai_offensive_behavior_refs: &id004
    - ai-model-access
    - exfiltration
    - impact
    - command-and-control
    extension_policy: governed-extension
    extensions:
      x-keplerops:challenge:
        challenge_id: kep-m10-j
        flag_id: flag-agentic-budget-loop
        module: module-10-ai-capstone
        outcome: ai-capstone
        title: Agentic Budget Loop
        difficulty: advanced
        target_minutes: 40
        min_minutes: 25
        max_minutes: 60
        points: 200
        disposition: full-atlas-expansion
        prerequisites:
        - kep-m01-a
        interfaces:
        - browser
        - curl
        - python
        hint_costs:
        - 0
        - 20
        - 50
        proof_obligation: agentic_budget_loop
        telemetry_profile: agentic_budget_loop
        reliability: pre-playtest-one-pass
        implementation_status: participant-proven
        live_fire: true
        participant_copy:
          category: Deployed AI Impact
          question: Coerce the live agent into a bounded self-delegation or tool fan-out loop that
            crosses the synthetic resource threshold.
          hints:
          - Start from the inference-api, agent-tool-runner surface and keep every artifact in your
            participant namespace.
          - Use the challenge API to create server-observed state before requesting the receipt.
          - If the proof is rejected, compare the returned failure class with the prerequisite and
            reset-generation requirements.
        flag_delivery:
          evidence_id: ev-agentic-budget-loop
          source: instructions
          instructions: ctfd/oracle-receipt-contract.md
          profiles:
          - gcp_full
          delivery:
            kind: workflow_receipt
            asset: telemetry-proof-01
            service: proof-api
            reset_owner: range-ops-controller
        proof:
          evidence_id: ev-agentic-budget-loop
          kind: deployed_ai_impact_expansion
          predicate: Require model-caused recursive or fan-out tool calls, bounded termination, and
            measured resource consumption; participant request floods fail.
          proof_fields: &id002
          - actor_role
          - asset_id
          - event_kind
          - object_id
          - outcome_id
          - record_count
          - range_instance
          - participant
          - timestamp
          - status
          - digest
          reset_owner: range-ops-controller
          mutates_scenario_state: true
          event:
            id: event-agentic-budget-loop
            evidence: ev-agentic-budget-loop
            event_kind: agentic_budget_loop_10
            source_service: inference-api
            source_asset: inference-gateway
            fields: *id002
            freshness_seconds: 10800
            reset_owner: range-ops-controller
        implementation_evidence:
          source_commit: pending
          automated_test: tests/module_10_full_atlas_rehearsal.py
          manual_walkthrough: docs/walkthroughs/module-10-full-atlas-expansion.md
          primary_atlas_techniques:
          - AML.T0034.002
          assurance: source-implemented-pre-playtest
        objective_ref: m10xb.kep-m10-j
        evidence_requirement_ref: m10xb.kep-m10-j-proof
  kep-m10-k:
    semantic_version: 1.0.0
    lifecycle_state: draft
    participant_refs:
    - core.participant
    authority_scope_refs: *id003
    ai_offensive_behavior_refs: *id004
    extension_policy: governed-extension
    extensions:
      x-keplerops:challenge:
        challenge_id: kep-m10-k
        flag_id: flag-chaff-flood
        module: module-10-ai-capstone
        outcome: ai-capstone
        title: Chaff Flood
        difficulty: intermediate
        target_minutes: 24
        min_minutes: 15
        max_minutes: 38
        points: 100
        disposition: full-atlas-expansion
        prerequisites:
        - kep-m03-a
        interfaces:
        - browser
        - curl
        - python
        hint_costs:
        - 0
        - 10
        - 25
        proof_obligation: chaff_flood
        telemetry_profile: chaff_flood
        reliability: pre-playtest-one-pass
        implementation_status: participant-proven
        live_fire: true
        participant_copy:
          category: Deployed AI Impact
          question: Inject enough plausible chaff through the normal data path to degrade a
            downstream AI result while protected controls remain intact.
          hints:
          - Start from the workhub, dataset-store surface and keep every artifact in your
            participant namespace.
          - Use the challenge API to create server-observed state before requesting the receipt.
          - If the proof is rejected, compare the returned failure class with the prerequisite and
            reset-generation requirements.
        flag_delivery:
          evidence_id: ev-chaff-flood
          source: instructions
          instructions: ctfd/oracle-receipt-contract.md
          profiles:
          - gcp_full
          delivery:
            kind: workflow_receipt
            asset: telemetry-proof-01
            service: proof-api
            reset_owner: range-ops-controller
        proof:
          evidence_id: ev-chaff-flood
          kind: deployed_ai_impact_expansion
          predicate: Bind participant-created chaff, ingestion, measured degradation, and
            protected-control result; direct database bulk writes fail.
          proof_fields: *id002
          reset_owner: range-ops-controller
          mutates_scenario_state: true
          event:
            id: event-chaff-flood
            evidence: ev-chaff-flood
            event_kind: chaff_flood_10
            source_service: inference-api
            source_asset: inference-gateway
            fields: *id002
            freshness_seconds: 10800
            reset_owner: range-ops-controller
        implementation_evidence:
          source_commit: pending
          automated_test: tests/module_10_full_atlas_rehearsal.py
          manual_walkthrough: docs/walkthroughs/module-10-full-atlas-expansion.md
          primary_atlas_techniques:
          - AML.T0046
          assurance: source-implemented-pre-playtest
        objective_ref: m10xb.kep-m10-k
        evidence_requirement_ref: m10xb.kep-m10-k-proof
conditions:
