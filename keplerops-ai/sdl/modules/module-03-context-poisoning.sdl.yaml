    extensions:
      x-keplerops:challenge:
        challenge_id: kep-m03-a
        flag_id: flag-context-ingestion
        module: module-03-context-poisoning
        outcome: context-poisoning
        title: Writable Knowledge
        difficulty: accessible
        target_minutes: 6
        min_minutes: 3
        max_minutes: 10
        points: 50
        disposition: new-design
        prerequisites: []
        interfaces:
        - browser
        - curl
        - python
        hint_costs:
        - 0
        - 0
        - 10
        proof_obligation: participant-content-top-k-retrieval
        telemetry_profile: context-poisoning-ingestion
        reliability: deterministic-10
        implementation_status: participant-proven
        live_fire: true
        participant_copy:
          category: Data and Retrieval
          question: Add a participant-authored document that appears in the top three results of the
            real retrieval index.
          hints:
          - The context API accepts bounded documents and creates versioned chunks.
          - Use the search surface to compare your document with trusted policy entries.
          - Write release-policy language close to the fixed orbital-lantern status query, then run
            the clean challenge attempt.
        flag_delivery:
          evidence_id: ev-context-ingestion
          source: instructions
          instructions: ctfd/oracle-receipt-contract.md
          profiles:
          - gcp_full
          delivery:
            kind: workflow_receipt
            asset: telemetry-proof-01
            service: proof-api
            reset_owner: dataset-store-01
        proof:
          evidence_id: ev-context-ingestion
          kind: objective_stage
          predicate: Read-only ingestion and vector-search evidence confirms a participant-authored
            versioned document produced chunks and reached the top three for the fixed clean query.
          proof_fields:
          - actor_role
          - asset_id
          - event_kind
          - object_id
          - outcome_id
          - record_count
          - range_instance
          - participant
          - timestamp
          - status
          - digest
          reset_owner: dataset-store-01
          mutates_scenario_state: false
          event:
            id: event-context-ingestion
            evidence: ev-context-ingestion
            event_kind: retrieval_context_ingested
            source_service: inference-api
            source_asset: inference-gateway
            fields:
            - actor_role
            - asset_id
            - event_kind
            - object_id
            - outcome_id
            - record_count
            - range_instance
            - participant
            - timestamp
            - status
            - digest
            freshness_seconds: 3600
            reset_owner: dataset-store-01
        implementation_evidence:
          primary_atlas_techniques:
          - AML.T0071
          manual_walkthrough: docs/walkthroughs/module-03-context-poisoning.md
          automated_test: test-context-reliability
