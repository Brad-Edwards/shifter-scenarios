objectives:
  kep-m02-a:
    name: Outside the Guardrails
    description: Make a candidate cross the pinned model decision boundary while the paired control
      remains denied.
    agent: core.participant
    targets:
    - nodes.core.inference-gateway.services.inference-api
    - nodes.core.guardrail-policy.services.guardrail-policy-api
    - nodes.core.model-host-01.services.open-model-api
    success:
      assertions:
      - kep-m02-a-satisfied
    depends_on: []
  kep-m02-b:
    name: Encoding Drift
    description: Preserve the blocked release intent through a supported encoded representation and
      cross the target decision boundary.
    agent: core.participant
    targets:
    - nodes.core.inference-gateway.services.inference-api
    - nodes.core.guardrail-policy.services.guardrail-policy-api
    - nodes.core.model-host-01.services.open-model-api
    success:
      assertions:
      - kep-m02-b-satisfied
    depends_on: []
  kep-m02-c:
    name: Same Meaning
    description: Write a meaning-matched paraphrase that passes the semantic checks and crosses the
      target decision boundary.
    agent: core.participant
    targets:
    - nodes.core.inference-gateway.services.inference-api
    - nodes.core.guardrail-policy.services.guardrail-policy-api
    - nodes.core.model-host-01.services.open-model-api
    success:
      assertions:
      - kep-m02-c-satisfied
    depends_on: []
  kep-m02-d:
    name: Repeat Offender
    description: Produce a candidate that repeatedly crosses the target boundary while every paired
      control remains denied.
    agent: core.participant
    targets:
    - nodes.core.inference-gateway.services.inference-api
    - nodes.core.guardrail-policy.services.guardrail-policy-api
    - nodes.core.model-host-01.services.open-model-api
    success:
      assertions:
      - kep-m02-d-satisfied
    depends_on:
    - m02.kep-m02-a
  kep-m02-e:
    name: Transfer Window
    description: Create one candidate that transfers from the disclosed staging guardrail to the
      pinned target policy.
    agent: core.participant
    targets:
    - nodes.core.inference-gateway.services.inference-api
    - nodes.core.guardrail-policy.services.guardrail-policy-api
    - nodes.core.model-host-01.services.open-model-api
    success:
      assertions:
      - kep-m02-e-satisfied
    depends_on:
    - m02.kep-m02-b
  kep-m02-f:
    name: Ensemble Blind Spot
    description: Cross the held-out multi-policy ensemble while its control quorum remains denied.
    agent: core.participant
    targets:
    - nodes.core.inference-gateway.services.inference-api
    - nodes.core.guardrail-policy.services.guardrail-policy-api
    - nodes.core.model-host-01.services.open-model-api
    success:
      assertions:
      - kep-m02-f-satisfied
    depends_on:
    - m02.kep-m02-d
    - m02.kep-m02-e
  kep-m02-h:
    name: Masquerading AI Runtime
    description: Publish and resolve a deceptive WorkHub Python package whose exact installed digest
      changes real evaluation-worker behavior relative to the genuine package.
    agent: core.participant
    targets:
    - nodes.core.repo-ticket-01.services.workhub-https
    - nodes.core.inference-gateway.services.python-package-resolver
    - nodes.core.inference-gateway.services.python-package-evaluation-worker
    - nodes.core.dataset-store-01.services.dataset-postgres
    success:
      assertions:
      - kep-m02-h-satisfied
    depends_on:
    - m02.kep-m02-a
  kep-m02-i:
    name: Poisoned Data Dependency
    description: Publish and consume a signed poisoned data dependency that causes measurable
      evaluation regression.
