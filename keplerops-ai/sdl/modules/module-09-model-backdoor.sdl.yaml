        outcome: model-backdoor
        title: Candidate Registration
        difficulty: intermediate
        target_minutes: 14
        min_minutes: 9
        max_minutes: 21
        points: 100
        disposition: new-design
        prerequisites:
        - kep-m07-f
        interfaces:
        - browser
        - curl
        - python
        hint_costs:
        - 0
        - 10
        - 25
        proof_obligation: candidate-registered-with-participant-lineage
        telemetry_profile: model-backdoor-registration
        reliability: pre-playtest-one-pass
        implementation_status: participant-proven
        live_fire: true
        participant_copy:
          category: Model Supply Chain
          question: Register a candidate from one of your successful current-generation Module 07
            training jobs with the exact dataset, run, and artifact lineage preserved in MLflow.
          hints:
          - Use a successful clean-tolerance, backdoor, or stealth training job from your own
            current reset generation.
          - Submit only the training job id; the gateway resolves and validates the stored artifact,
            digest, and run.
          - Register through `/v1/backdoor/candidates`, then submit the returned candidate id to the
            Module 09 attempt endpoint.
        flag_delivery:
          evidence_id: ev-candidate-registration
          source: instructions
          instructions: ctfd/oracle-receipt-contract.md
          profiles:
          - gcp_full
          delivery:
            kind: workflow_receipt
            asset: telemetry-proof-01
            service: proof-api
            reset_owner: model-registry-01
        proof:
          evidence_id: ev-candidate-registration
          kind: model_supply_chain
          predicate: Server-held PostgreSQL and MLflow state confirms the authenticated participant
            registered the exact artifact produced by a successful current-generation Module 07 job
            with dataset, run, training, and artifact digests intact.
          proof_fields: &backdoor_proof_fields
          - actor_role
          - asset_id
          - event_kind
          - object_id
          - outcome_id
          - record_count
          - stage
          - workflow_id
          - range_instance
          - participant
          - timestamp
          - status
          - digest
          reset_owner: model-registry-01
          mutates_scenario_state: false
          event:
            id: event-candidate-registration
            evidence: ev-candidate-registration
            event_kind: model_candidate_registered
            source_service: inference-api
            source_asset: inference-gateway
            fields: *backdoor_proof_fields
            freshness_seconds: 10800
            reset_owner: model-registry-01
        implementation_evidence:
          primary_atlas_techniques:
          - AML.T0002.001
          manual_walkthrough: docs/walkthroughs/module-09-model-backdoor.md
          automated_test: tests/module_09_rehearsal.py
        objective_ref: m09.kep-m09-a
        evidence_requirement_ref: m09.kep-m09-a-proof
