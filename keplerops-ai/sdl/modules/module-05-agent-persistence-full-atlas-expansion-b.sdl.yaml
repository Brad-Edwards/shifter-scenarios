    - command-and-control
    - lateral-movement
    extension_policy: governed-extension
    extensions:
      x-keplerops:challenge:
        challenge_id: kep-m05-j
        flag_id: flag-unsecured-credential-pickup
        module: module-05-agent-persistence
        outcome: agent-persistence
        title: Unsecured Credential Pickup
        difficulty: accessible
        target_minutes: 10
        min_minutes: 5
        max_minutes: 16
        points: 50
        disposition: full-atlas-expansion
        prerequisites: []
        interfaces:
        - browser
        - curl
        - python
        hint_costs:
        - 0
        - 0
        - 10
        proof_obligation: unsecured_credential_pickup
        telemetry_profile: unsecured_credential_pickup
        reliability: pre-playtest-one-pass
        implementation_status: participant-proven
        live_fire: true
        participant_copy:
          category: Agent State and Identity
          question: Find range-only access material in a participant-reachable service artifact and
            validate its intended scope.
          hints:
          - Use the persistence expansion action endpoint for the credential-pickup path.
          - The proof expects artifact-read provenance and scoped validation.
          - Briefing values and environment output do not count.
        flag_delivery:
          evidence_id: ev-unsecured-credential-pickup
          source: instructions
          instructions: ctfd/oracle-receipt-contract.md
          profiles:
          - gcp_full
          delivery:
            kind: workflow_receipt
            asset: telemetry-proof-01
            service: proof-api
            reset_owner: platform-agent-01
        proof:
          evidence_id: ev-unsecured-credential-pickup
          kind: agent_persistence_expansion
          predicate: Require artifact read provenance and successful scoped validation with
            discovered material; briefing or environment output fails.
          proof_fields:
          - actor_role
          - asset_id
          - event_kind
          - object_id
          - outcome_id
          - record_count
          - stage
          - range_instance
          - participant
          - timestamp
          - status
          - digest
          reset_owner: platform-agent-01
          mutates_scenario_state: true
          event:
            id: event-unsecured-credential-pickup
            evidence: ev-unsecured-credential-pickup
            event_kind: unsecured_credential_pickup_05
            source_service: inference-api
            source_asset: inference-gateway
            fields:
            - actor_role
            - asset_id
            - event_kind
            - object_id
            - outcome_id
            - record_count
            - stage
            - range_instance
            - participant
            - timestamp
            - status
            - digest
            freshness_seconds: 10800
            reset_owner: platform-agent-01
        implementation_evidence:
          source_commit: pending
          automated_test: tests/module_05_full_atlas_rehearsal.py
          manual_walkthrough: docs/walkthroughs/module-05-full-atlas-expansion.md
          primary_atlas_techniques:
          - AML.T0055
          assurance: source-implemented-pre-playtest
        objective_ref: m05xb.kep-m05-j
        evidence_requirement_ref: m05xb.kep-m05-j-proof
