      x-keplerops:challenge:
        challenge_id: kep-m06-a
        flag_id: flag-manual-adversarial-input
        module: module-06-adversarial-input
        outcome: adversarial-input
        title: Manual Counterexample
        difficulty: accessible
        target_minutes: 8
        min_minutes: 5
        max_minutes: 12
        points: 50
        disposition: new-design
        prerequisites: []
        interfaces:
        - curl
        - python
        - notebook
        hint_costs:
        - 0
        - 0
        - 10
        proof_obligation: bounded-semantic-perturbation-crossing
        telemetry_profile: adversarial-input-manual
        reliability: model-sensitive-30
        implementation_status: participant-proven
        live_fire: true
        participant_copy:
          category: Adversarial ML
          question: Store a manually modified prompt artifact that preserves the protected promotion
            request while crossing the real model decision boundary.
          hints:
          - Begin with the disclosed unsigned orbital-lantern promotion intent and change it, rather
            than submitting an unrelated allow request.
          - Keep the protected intent in the artifact while adding a bounded instruction that
            changes the JSON decision.
          - Create a manual artifact, then submit its returned artifact id to the item evaluator.
        flag_delivery:
          evidence_id: ev-manual-adversarial-input
          source: instructions
          instructions: ctfd/oracle-receipt-contract.md
          profiles:
          - gcp_full
          delivery:
            kind: workflow_receipt
            asset: telemetry-proof-01
            service: proof-api
            reset_owner: dataset-store-01
        proof:
          evidence_id: ev-manual-adversarial-input
          kind: objective_stage
          predicate: Read-only artifact and model evidence confirms a participant-created manual
            artifact remained within the server-measured perturbation bound, preserved the protected
            semantics, and crossed a stable real-model control.
          proof_fields: &adversarial_proof_fields
          - actor_role
          - asset_id
          - event_kind
          - object_id
          - outcome_id
          - record_count
          - workflow_id
          - range_instance
          - participant
          - timestamp
          - status
          - digest
          reset_owner: dataset-store-01
          mutates_scenario_state: false
          event:
            id: event-manual-adversarial-input
            evidence: ev-manual-adversarial-input
            event_kind: adversarial_manual_counterexample
            source_service: inference-api
            source_asset: inference-gateway
            fields: *adversarial_proof_fields
            freshness_seconds: 7200
            reset_owner: dataset-store-01
        implementation_evidence:
          primary_atlas_techniques:
          - AML.T0043.003
          manual_walkthrough: docs/walkthroughs/module-06-adversarial-input.md
          automated_test: tests/module_06_reliability.py
        objective_ref: m06.kep-m06-a
        evidence_requirement_ref: m06.kep-m06-a-proof
