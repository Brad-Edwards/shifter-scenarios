behavior_specifications:
  kep-m06-m:
    semantic_version: 1.0.0
    lifecycle_state: draft
    participant_refs:
    - core.participant
    authority_scope_refs: &id003
    - nodes.core.research-index-01.services.research-search-api
    - nodes.core.public-sites-01.services.public-range-http
    - nodes.core.scan-services-01.services.scan-docs-http
    - nodes.core.inference-gateway.services.inference-api
    - nodes.core.notebook-runner-01.services.notebook-jupyter
    - nodes.core.model-registry-01.services.registry-api
    - nodes.core.artifact-store-01.services.artifact-object-store
    - nodes.core.platform-camera-01.services.platform-camera-webrtc
    - nodes.core.platform-agent-01.services.platform-agent-api
    - nodes.core.platform-agent-01.services.platform-isolation-api
    - nodes.core.telemetry-proof-01.services.proof-api
    ai_offensive_behavior_refs: &id004
    - ai-attack-staging
    - reconnaissance
    - resource-development
    - defense-evasion
    - discovery
    - impact
    extension_policy: governed-extension
    extensions:
      x-keplerops:challenge:
        challenge_id: kep-m06-m
        flag_id: flag-edge-acquisition
        module: module-06-adversarial-input
        outcome: adversarial-input
        title: Edge Acquisition
        difficulty: advanced
        target_minutes: 35
        min_minutes: 22
        max_minutes: 52
        points: 200
        disposition: full-atlas-expansion
        prerequisites: []
        interfaces:
        - browser
        - curl
        - python
        hint_costs:
        - 0
        - 20
        - 50
        proof_obligation: edge_acquisition
        telemetry_profile: edge_acquisition
        reliability: pre-playtest-one-pass
        implementation_status: participant-proven
        live_fire: true
        participant_copy:
          category: Adversarial ML Resource Development
          question: Configure the supplied consumer edge device profile and physical countermeasure
            to preserve a real sensor attack capture.
          hints:
          - Start on the participant-browser, webcam, edge-inference-service surface and keep each
            artifact bound to your participant namespace.
          - Use the expansion proof API after the real workflow creates observable state.
          - If rejected, compare the failure class with required evidence kinds and reset
            generation.
        flag_delivery:
          evidence_id: ev-edge-acquisition
          source: instructions
          instructions: ctfd/oracle-receipt-contract.md
          profiles:
          - gcp_full
          delivery:
            kind: workflow_receipt
            asset: telemetry-proof-01
            service: proof-api
            reset_owner: dataset-store-01
        proof:
          evidence_id: ev-edge-acquisition
          kind: adversarial_expansion
          predicate: Require participant device registration, live sensor session, countermeasure
            interaction, and captured model delta; uploaded recordings fail.
          proof_fields: &id002
          - actor_role
          - asset_id
          - event_kind
          - object_id
          - outcome_id
          - record_count
          - stage
          - workflow_id
          - range_instance
          - participant
          - timestamp
          - status
          - digest
          reset_owner: dataset-store-01
          mutates_scenario_state: true
          event:
            id: event-edge-acquisition
            evidence: ev-edge-acquisition
            event_kind: edge_acquisition
            source_service: inference-api
            source_asset: inference-gateway
            fields: *id002
            freshness_seconds: 10800
            reset_owner: dataset-store-01
        implementation_evidence:
          source_commit: pending
          automated_test: tests/module_06_full_atlas_rehearsal.py
          manual_walkthrough: docs/walkthroughs/module-06-full-atlas-expansion.md
          primary_atlas_techniques:
          - AML.T0008.001
          - AML.T0008.003
          assurance: source-implemented-pre-playtest
        objective_ref: m06xd.kep-m06-m
        evidence_requirement_ref: m06xd.kep-m06-m-proof
  kep-m06-n:
    semantic_version: 1.0.0
    lifecycle_state: draft
    participant_refs:
    - core.participant
    authority_scope_refs: *id003
    ai_offensive_behavior_refs: *id004
    extension_policy: governed-extension
    extensions:
      x-keplerops:challenge:
        challenge_id: kep-m06-n
        flag_id: flag-domain-proxy-front
        module: module-06-adversarial-input
        outcome: adversarial-input
        title: Domain and Proxy Front
        difficulty: intermediate
        target_minutes: 22
        min_minutes: 13
        max_minutes: 34
        points: 100
        disposition: full-atlas-expansion
        prerequisites: []
        interfaces:
        - browser
        - curl
        - python
        hint_costs:
        - 0
        - 10
        - 25
        proof_obligation: domain_and_proxy_front
        telemetry_profile: domain_and_proxy_front
        reliability: pre-playtest-one-pass
        implementation_status: participant-proven
        live_fire: true
        participant_copy:
          category: Adversarial ML Resource Development
          question: Register a range-scoped domain and AI service proxy account and route one model
            request through the acquired front.
          hints:
          - Start on the range-dns, identity-provider, ai-proxy surface and keep each artifact bound
            to your participant namespace.
          - Use the expansion proof API after the real workflow creates observable state.
          - If rejected, compare the failure class with required evidence kinds and reset
            generation.
        flag_delivery:
          evidence_id: ev-domain-proxy-front
          source: instructions
          instructions: ctfd/oracle-receipt-contract.md
          profiles:
          - gcp_full
          delivery:
            kind: workflow_receipt
            asset: telemetry-proof-01
            service: proof-api
            reset_owner: dataset-store-01
        proof:
          evidence_id: ev-domain-proxy-front
          kind: adversarial_expansion
          predicate: Bind participant-created synthetic account, DNS record, proxy route, and
            end-to-end inference; preseeded identities fail.
          proof_fields: &id005
          - actor_role
          - asset_id
          - event_kind
          - object_id
          - outcome_id
          - record_count
          - stage
          - workflow_id
          - range_instance
          - participant
          - timestamp
          - status
          - digest
          reset_owner: dataset-store-01
          mutates_scenario_state: true
          event:
            id: event-domain-proxy-front
            evidence: ev-domain-proxy-front
            event_kind: domain_proxy_front
            source_service: inference-api
            source_asset: inference-gateway
            fields: *id005
            freshness_seconds: 10800
            reset_owner: dataset-store-01
        implementation_evidence:
          source_commit: pending
          automated_test: tests/module_06_full_atlas_rehearsal.py
          manual_walkthrough: docs/walkthroughs/module-06-full-atlas-expansion.md
          primary_atlas_techniques:
          - AML.T0008.002
          - AML.T0008.005
          - AML.T0021
          assurance: source-implemented-pre-playtest
        objective_ref: m06xd.kep-m06-n
        evidence_requirement_ref: m06xd.kep-m06-n-proof
