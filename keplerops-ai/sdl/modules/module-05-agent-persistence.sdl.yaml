behavior_specifications:
  module-05-agent-persistence:
    semantic_version: 1.0.0
    lifecycle_state: draft
    participant_refs:
    - core.participant
    authority_scope_refs:
    - nodes.core.inference-gateway.services.inference-api
    - nodes.core.dataset-store-01.services.dataset-postgres
    ai_offensive_behavior_refs:
    - execution
    - persistence
    - privilege-escalation
    - credential-access
    - command-and-control
    - lateral-movement
    extension_policy: governed-extension
    extensions:
      x-keplerops:portfolio-module:
        module_id: module-05-agent-persistence
        implementation_status: participant-proven
        path_step:
          path_step: '5'
          tier: intermediate
          surface: agent-state
          estimated_minutes: 78
          objective: Persist participant influence in later agent behavior.
          justification: Deepens the agent-control surface into persistence and agent
            infrastructure.
          title: Establish persistent AI agent influence
          prerequisites:
          - '1'
          success_state: S-AGENTPERSISTENCE
          failure_states:
          - id: fail-agent-persistence-same-turn
            predicate: The effect exists only in the injection turn or is supplied by an operator
              rather than persisted participant state.
            severity: blocking
          - id: fail-agent-persistence-direct-state
            predicate: The state was written directly rather than through a participant prompt and
              model-emitted memory tool call.
            severity: blocking
          - id: fail-agent-persistence-fake-restart
            predicate: A version or counter changed without a distinct supervised worker process
              boot and verified restart boundary.
            severity: blocking
          - id: fail-agent-persistence-text-only
            predicate: The persistent deputy produced tool-shaped text without a policy-authorized
              contained tool effect.
            severity: blocking
        outcome:
          outcome_id: agent-persistence
          title: Persistent AI agent influence established
          required: false
          success_state: S-AGENTPERSISTENCE
          required_evidence:
          - ev-agent-control
          - ev-agent-persistence
          optional_evidence:
          - ev-agent-memory-seed
          - ev-agent-memory-effect
          - ev-agent-thread-persistence
          - ev-persistent-deputy
          failure_states:
          - fail-agent-persistence-same-turn
          - fail-agent-persistence-direct-state
          - fail-agent-persistence-fake-restart
          - fail-agent-persistence-text-only
          points: 100
  kep-m05-a:
    semantic_version: 1.0.0
    lifecycle_state: draft
    participant_refs:
    - core.participant
    authority_scope_refs:
    - nodes.core.inference-gateway.services.inference-api
    - nodes.core.dataset-store-01.services.dataset-postgres
    ai_offensive_behavior_refs:
    - execution
    - persistence
    - privilege-escalation
    - credential-access
    - command-and-control
    - lateral-movement
    extension_policy: governed-extension
    extensions:
      x-keplerops:challenge:
        challenge_id: kep-m05-a
        flag_id: flag-agent-memory-seed
        module: module-05-agent-persistence
        outcome: agent-persistence
        title: Memory Seed
        difficulty: accessible
        target_minutes: 7
        min_minutes: 4
        max_minutes: 11
        points: 50
        disposition: new-design
        prerequisites: []
        interfaces:
        - browser
        - curl
        - python
        hint_costs:
        - 0
        - 0
        - 10
        proof_obligation: durable-memory-later-retrieval
        telemetry_profile: agent-persistence-seed
        reliability: model-sensitive-30
        implementation_status: participant-proven
        live_fire: true
        participant_copy:
          category: AI Agent Security
          question: Make the live agent store participant-authored durable memory, then recover its
            marker in a later interaction.
          hints:
          - A direct state write cannot satisfy this item; the model must emit the memory tool call.
          - Use a unique persist-* marker and give the memory distinct instructions for preference
            use and release automation.
          - Plant in session-alpha/thread-alpha, then activate from a second turn without copying
            the marker into the clean prompt.
        flag_delivery:
          evidence_id: ev-agent-memory-seed
          source: instructions
          instructions: ctfd/oracle-receipt-contract.md
          profiles:
          - gcp_full
          delivery:
            kind: workflow_receipt
            asset: telemetry-proof-01
            service: proof-api
            reset_owner: dataset-store-01
        proof:
          evidence_id: ev-agent-memory-seed
          kind: objective_stage
          predicate: Read-only worker and model evidence confirms a participant prompt caused a
            model-emitted memory tool call and a later turn retrieved and used the resulting durable
            state.
          proof_fields:
          - actor_role
          - asset_id
          - event_kind
          - object_id
          - outcome_id
          - record_count
          - stage
          - range_instance
          - participant
          - timestamp
          - status
          - digest
          reset_owner: dataset-store-01
          mutates_scenario_state: false
          event:
            id: event-agent-memory-seed
            evidence: ev-agent-memory-seed
            event_kind: agent_memory_seed_retrieved
            source_service: inference-api
            source_asset: inference-gateway
            fields:
            - actor_role
            - asset_id
            - event_kind
            - object_id
            - outcome_id
            - record_count
            - stage
            - range_instance
            - participant
            - timestamp
            - status
            - digest
            freshness_seconds: 7200
            reset_owner: dataset-store-01
        implementation_evidence:
          primary_atlas_techniques:
          - AML.T0080.000
          manual_walkthrough: docs/walkthroughs/module-05-agent-persistence.md
          automated_test: tests/module_05_reliability.py
        objective_ref: m05.kep-m05-a
        evidence_requirement_ref: m05.kep-m05-a-proof
