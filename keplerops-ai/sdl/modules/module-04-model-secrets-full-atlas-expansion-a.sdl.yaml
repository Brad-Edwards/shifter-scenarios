    - discovery
    - collection
    - exfiltration
    extension_policy: governed-extension
    extensions:
      x-keplerops:challenge:
        challenge_id: kep-m04-f
        flag_id: flag-model-fingerprint
        module: module-04-model-secrets
        outcome: model-secrets
        title: Model Fingerprint
        difficulty: intermediate
        target_minutes: 18
        min_minutes: 11
        max_minutes: 28
        points: 100
        disposition: full-atlas-expansion
        prerequisites: []
        interfaces:
        - browser
        - curl
        - python
        - notebook
        hint_costs:
        - 0
        - 10
        - 25
        proof_obligation: model_fingerprint
        telemetry_profile: model_fingerprint
        reliability: pre-playtest-one-pass
        implementation_status: participant-proven
        live_fire: true
        participant_copy:
          category: Model Discovery and Privacy
          question: Use black-box probes against the live model to identify its model family and
            output ontology from a hidden candidate set.
          hints:
          - Send several probe prompts through the expansion probe endpoint and compare the returned
            behavior.
          - The proof requires fresh server-observed probes; banner text and docs do not count.
          - Submit the family, ontology, and confidence only after you have at least three probe
            events.
        flag_delivery:
          evidence_id: ev-model-fingerprint
          source: instructions
          instructions: ctfd/oracle-receipt-contract.md
          profiles:
          - gcp_full
          delivery:
            kind: workflow_receipt
            asset: telemetry-proof-01
            service: proof-api
            reset_owner: dataset-store-01
        proof:
          evidence_id: ev-model-fingerprint
          kind: model_secret_expansion
          predicate: Require fresh black-box probes, captured outputs, correct family and ontology,
            and a confidence threshold; static metadata fails.
          proof_fields:
          - actor_role
          - asset_id
          - event_kind
          - object_id
          - outcome_id
          - record_count
          - stage
          - range_instance
          - participant
          - timestamp
          - status
          - digest
          reset_owner: dataset-store-01
          mutates_scenario_state: true
          event:
            id: event-model-fingerprint
            evidence: ev-model-fingerprint
            event_kind: model_fingerprint_04
            source_service: inference-api
            source_asset: inference-gateway
            fields:
            - actor_role
            - asset_id
            - event_kind
            - object_id
            - outcome_id
            - record_count
            - stage
            - range_instance
            - participant
            - timestamp
            - status
            - digest
            freshness_seconds: 10800
            reset_owner: dataset-store-01
        implementation_evidence:
          source_commit: pending
          automated_test: tests/module_04_full_atlas_rehearsal.py
          manual_walkthrough: docs/walkthroughs/module-04-full-atlas-expansion.md
          primary_atlas_techniques:
          - AML.T0013
          - AML.T0014
          - AML.T0063
          assurance: source-implemented-pre-playtest
        objective_ref: m04xa.kep-m04-f
        evidence_requirement_ref: m04xa.kep-m04-f-proof
