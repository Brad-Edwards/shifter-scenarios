    - defense-evasion
    - discovery
    - impact
    extension_policy: governed-extension
    extensions:
      x-keplerops:challenge:
        challenge_id: kep-m06-g
        flag_id: flag-open-literature-triangulation
        module: module-06-adversarial-input
        outcome: adversarial-input
        title: Open Literature Triangulation
        difficulty: accessible
        target_minutes: 12
        min_minutes: 7
        max_minutes: 20
        points: 50
        disposition: full-atlas-expansion
        prerequisites: []
        interfaces:
        - browser
        - curl
        - python
        hint_costs:
        - 0
        - 0
        - 10
        proof_obligation: open_literature_triangulation
        telemetry_profile: open_literature_triangulation
        reliability: pre-playtest-one-pass
        implementation_status: participant-proven
        live_fire: true
        participant_copy:
          category: Adversarial ML Resource Development
          question: Find and use one journal, one preprint, and one technical-blog artifact to
            reproduce a range-local adversarial AI result.
          hints:
          - Start on the research-index, evaluation-workbench, proof-api surface and keep each
            artifact bound to your participant namespace.
          - Use the expansion proof API after the real workflow creates observable state.
          - If rejected, compare the failure class with required evidence kinds and reset
            generation.
        flag_delivery:
          evidence_id: ev-open-literature-triangulation
          source: instructions
          instructions: ctfd/oracle-receipt-contract.md
          profiles:
          - gcp_full
          delivery:
            kind: workflow_receipt
            asset: telemetry-proof-01
            service: proof-api
            reset_owner: dataset-store-01
        proof:
          evidence_id: ev-open-literature-triangulation
          kind: adversarial_expansion
          predicate: Require three independent search-source receipts and one reproduced attack
            result; browsing or citations without execution fail.
          proof_fields: &id002
          - actor_role
          - asset_id
          - event_kind
          - object_id
          - outcome_id
          - record_count
          - stage
          - workflow_id
          - range_instance
          - participant
          - timestamp
          - status
          - digest
          reset_owner: dataset-store-01
          mutates_scenario_state: true
          event:
            id: event-open-literature-triangulation
            evidence: ev-open-literature-triangulation
            event_kind: open_literature_triangulation
            source_service: inference-api
            source_asset: inference-gateway
            fields: *id002
            freshness_seconds: 10800
            reset_owner: dataset-store-01
        implementation_evidence:
          source_commit: pending
          automated_test: tests/module_06_full_atlas_rehearsal.py
          manual_walkthrough: docs/walkthroughs/module-06-full-atlas-expansion.md
          primary_atlas_techniques:
          - AML.T0000
          - AML.T0000.000
          - AML.T0000.001
          - AML.T0000.002
          assurance: source-implemented-pre-playtest
        objective_ref: m06xa.kep-m06-g
        evidence_requirement_ref: m06xa.kep-m06-g-proof
