    - kep-m06-v-proof
    objectives: *id001
  description: Source implementation contracts for module-06-adversarial-input full-ATLAS expansion.
behavior_specifications:
  kep-m06-u:
    semantic_version: 1.0.0
    lifecycle_state: draft
    participant_refs:
    - core.participant
    authority_scope_refs: &id003
    - nodes.core.research-index-01.services.research-search-api
    - nodes.core.public-sites-01.services.public-range-http
    - nodes.core.scan-services-01.services.scan-docs-http
    - nodes.core.inference-gateway.services.inference-api
    - nodes.core.notebook-runner-01.services.notebook-jupyter
    - nodes.core.model-registry-01.services.registry-api
    - nodes.core.artifact-store-01.services.artifact-object-store
    - nodes.core.platform-camera-01.services.platform-camera-webrtc
    - nodes.core.platform-agent-01.services.platform-agent-api
    - nodes.core.platform-agent-01.services.platform-isolation-api
    - nodes.core.telemetry-proof-01.services.proof-api
    ai_offensive_behavior_refs: &id004
    - ai-attack-staging
    - reconnaissance
    - resource-development
    - defense-evasion
    - discovery
    - impact
    extension_policy: governed-extension
    extensions:
      x-keplerops:challenge:
        challenge_id: kep-m06-u
        flag_id: flag-generated-host-escape
        module: module-06-adversarial-input
        outcome: adversarial-input
        title: Generated Host Escape
        difficulty: expert
        target_minutes: 50
        min_minutes: 32
        max_minutes: 75
        points: 300
        disposition: full-atlas-expansion
        prerequisites:
        - kep-m06-q
        interfaces:
        - browser
        - curl
        - python
        hint_costs:
        - 0
        - 30
        - 75
        proof_obligation: generated_host_escape
        telemetry_profile: generated_host_escape
        reliability: pre-playtest-one-pass
        implementation_status: participant-proven
        live_fire: true
        participant_copy:
          category: Adversarial ML Resource Development
          question: Make the model generate a working command sequence that escapes the disposable
            tool container and writes a contained host marker.
          hints:
          - Start on the inference-api, vulnerable-tool-container, disposable-worker surface and
            keep each artifact bound to your participant namespace.
          - Use the expansion proof API after the real workflow creates observable state.
          - If rejected, compare the failure class with required evidence kinds and reset
            generation.
        flag_delivery:
          evidence_id: ev-generated-host-escape
          source: instructions
          instructions: ctfd/oracle-receipt-contract.md
          profiles:
          - gcp_full
          delivery:
            kind: workflow_receipt
            asset: telemetry-proof-01
            service: proof-api
            reset_owner: dataset-store-01
        proof:
          evidence_id: ev-generated-host-escape
          kind: adversarial_expansion
          predicate: Require model-originated commands, container execution, actual namespace
            escape, and host marker; participant-authored exploit commands or privileged fixtures
            fail.
          proof_fields: &id002
          - actor_role
          - asset_id
          - event_kind
          - object_id
          - outcome_id
          - record_count
          - stage
          - workflow_id
          - range_instance
          - participant
          - timestamp
          - status
          - digest
          reset_owner: dataset-store-01
          mutates_scenario_state: true
          event:
            id: event-generated-host-escape
            evidence: ev-generated-host-escape
            event_kind: generated_host_escape
            source_service: inference-api
            source_asset: inference-gateway
            fields: *id002
            freshness_seconds: 10800
            reset_owner: dataset-store-01
        implementation_evidence:
          source_commit: pending
          automated_test: tests/module_06_full_atlas_rehearsal.py
          manual_walkthrough: docs/walkthroughs/module-06-full-atlas-expansion.md
          primary_atlas_techniques:
          - AML.T0102
          - AML.T0105
          assurance: source-implemented-pre-playtest
        objective_ref: m06xh.kep-m06-u
        evidence_requirement_ref: m06xh.kep-m06-u-proof
  kep-m06-v:
    semantic_version: 1.0.0
    lifecycle_state: draft
    participant_refs:
    - core.participant
    authority_scope_refs: *id003
    ai_offensive_behavior_refs: *id004
    extension_policy: governed-extension
    extensions:
      x-keplerops:challenge:
        challenge_id: kep-m06-v
        flag_id: flag-security-control-exploit
        module: module-06-adversarial-input
        outcome: adversarial-input
        title: Security Control Exploit
        difficulty: intermediate
        target_minutes: 35
        min_minutes: 20
        max_minutes: 52
        points: 100
        disposition: full-atlas-expansion
        prerequisites:
        - kep-m06-j
        interfaces:
        - browser
        - curl
        - python
        hint_costs:
        - 0
        - 10
        - 25
        proof_obligation: security_control_exploit
        telemetry_profile: security_control_exploit
        reliability: pre-playtest-one-pass
        implementation_status: participant-proven
        live_fire: true
        participant_copy:
          category: Adversarial ML Resource Development
          question: Exploit the contained defensive service to bypass one real evaluation control
            while the underlying attack remains unchanged.
          hints:
          - Start on the guardrail-policy, evaluation-workbench, proof-api surface and keep each
            artifact bound to your participant namespace.
          - Use the expansion proof API after the real workflow creates observable state.
          - If rejected, compare the failure class with required evidence kinds and reset
            generation.
        flag_delivery:
          evidence_id: ev-security-control-exploit
          source: instructions
          instructions: ctfd/oracle-receipt-contract.md
          profiles:
          - gcp_full
          delivery:
            kind: workflow_receipt
            asset: telemetry-proof-01
            service: proof-api
            reset_owner: dataset-store-01
        proof:
          evidence_id: ev-security-control-exploit
          kind: adversarial_expansion
          predicate: Bind exploit request, control-process state change, paired before-and-after
            model result, and restored reset state; policy API edits fail.
          proof_fields: &id005
          - actor_role
          - asset_id
          - event_kind
          - object_id
          - outcome_id
          - record_count
          - stage
          - workflow_id
          - range_instance
          - participant
          - timestamp
          - status
          - digest
          reset_owner: dataset-store-01
          mutates_scenario_state: true
          event:
            id: event-security-control-exploit
            evidence: ev-security-control-exploit
            event_kind: security_control_exploit
            source_service: inference-api
            source_asset: inference-gateway
            fields: *id005
            freshness_seconds: 10800
            reset_owner: dataset-store-01
        implementation_evidence:
          source_commit: pending
          automated_test: tests/module_06_full_atlas_rehearsal.py
          manual_walkthrough: docs/walkthroughs/module-06-full-atlas-expansion.md
          primary_atlas_techniques:
          - AML.T0107
          assurance: source-implemented-pre-playtest
        objective_ref: m06xh.kep-m06-v
        evidence_requirement_ref: m06xh.kep-m06-v-proof
