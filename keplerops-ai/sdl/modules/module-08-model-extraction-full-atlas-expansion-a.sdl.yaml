          predicate: Require live WebRTC capture, paired physical control and attack frames,
            liveness check, and model delta; uploaded or prerecorded images fail.
          proof_fields: *id002
          reset_owner: dataset-store-01
          mutates_scenario_state: true
          event:
            id: event-physical-sensor-evasion
            evidence: ev-physical-sensor-evasion
            event_kind: physical_sensor_evasion_08
            source_service: inference-api
            source_asset: inference-gateway
            fields: *id002
