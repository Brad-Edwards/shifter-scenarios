        flag_id: flag-deploy-local-rogue-agent
        module: module-05-agent-persistence
        outcome: agent-persistence
        title: Deploy Local Rogue Agent
        difficulty: advanced
        target_minutes: 35
        min_minutes: 22
        max_minutes: 52
        points: 200
        disposition: full-atlas-expansion
        prerequisites:
        - kep-m05-m
        interfaces:
        - browser
        - curl
        - python
        hint_costs:
        - 0
        - 20
        - 50
        proof_obligation: deploy_local_rogue_agent
        telemetry_profile: deploy_local_rogue_agent
        reliability: pre-playtest-one-pass
        implementation_status: participant-proven
        live_fire: true
        participant_copy:
          category: Agent State and Identity
          question: Deploy a participant-configured local AI agent on the disposable worker and use
            its real tools to achieve contained host control.
          hints:
          - The action endpoint creates a real platform-agent disposable worker.
          - Provide a participant goal and keep the result inside the range marker.
          - Direct shell creation without the agent/worker path is rejected.
        flag_delivery:
          evidence_id: ev-deploy-local-rogue-agent
          source: instructions
          instructions: ctfd/oracle-receipt-contract.md
          profiles:
          - gcp_full
          delivery:
            kind: workflow_receipt
            asset: telemetry-proof-01
            service: proof-api
            reset_owner: platform-agent-01
        proof:
          evidence_id: ev-deploy-local-rogue-agent
          kind: agent_persistence_expansion
          predicate: Require participant-authored agent goal, deployed process, tool use, and
            contained host marker.
          proof_fields:
          - actor_role
          - asset_id
          - event_kind
          - object_id
          - outcome_id
          - record_count
          - stage
          - range_instance
          - participant
          - timestamp
          - status
          - digest
          reset_owner: platform-agent-01
          mutates_scenario_state: true
          event:
            id: event-deploy-local-rogue-agent
            evidence: ev-deploy-local-rogue-agent
            event_kind: deploy_local_rogue_agent_05
            source_service: inference-api
            source_asset: inference-gateway
            fields:
            - actor_role
            - asset_id
            - event_kind
            - object_id
            - outcome_id
            - record_count
            - stage
            - range_instance
            - participant
            - timestamp
            - status
            - digest
            freshness_seconds: 10800
            reset_owner: platform-agent-01
        implementation_evidence:
          source_commit: pending
          automated_test: tests/module_05_full_atlas_rehearsal.py
          manual_walkthrough: docs/walkthroughs/module-05-full-atlas-expansion.md
          primary_atlas_techniques:
          - AML.T0103
          - AML.T0112.000
          assurance: source-implemented-pre-playtest
        objective_ref: m05xc.kep-m05-n
        evidence_requirement_ref: m05xc.kep-m05-n-proof
