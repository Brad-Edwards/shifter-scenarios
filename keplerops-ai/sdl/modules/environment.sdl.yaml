propositions:
  company-state-visible:
    description: Every authored company-state slice is visible through its ordinary service or endpoint boundary.
    subjects: &company-state-subjects
    - content.company-directory-state
    - content.company-identity-facade-state
    - content.company-workhub-state
    - content.company-mail-state
    - content.company-file-state
    - content.company-data-state
    - content.company-workflow-state
    - content.company-notebook-state
    - content.company-artifact-state
    - content.company-model-registry-state
    - content.company-research-index-state
    - content.company-policy-state
    - content.company-operational-telemetry
    - content.company-workforce-endpoint-state
    - content.company-ml-endpoint-state
    basis: observed_state
    predicate:
      kind: boolean
      property: service-content-visible
      semantic_ref: urn:aces:observable:service-content-visible
      expected: true
    evidence_requirements:
    - company-state-readback
assertions:
  company-state-visible:
    proposition: company-state-visible
    role: postcondition
observation_boundaries:
  company-state-view:
    projection_basis: ordinary participant or application access to each named service and endpoint
    observable_refs: *company-state-subjects
    redaction_policy: preserve authored ordinary fields while excluding credentials and operator state
    latency_profile: available before participant admission
evidence_requirements:
  company-state-readback:
    source_refs: *company-state-subjects
    scope: native service and endpoint readback with canonical per-content digest
    boundary_kind: participant_equivalent
    channel: api_response
    artifact_role: service_materialization_readback
    media_types:
    - application/json
    sensitivity: plain
    redaction: redact_secrets
    integrity: checksum
    retention: run_lifetime
    loss_disclosure: required
