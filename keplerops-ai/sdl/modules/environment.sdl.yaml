nodes:
  participant-entry:
    type: switch
    description: Participant attacker-entry network.
  enterprise-identity:
    type: switch
    description: Enterprise identity network.
  enterprise-services:
    type: switch
    description: Enterprise application network.
  lab-apps:
    type: switch
    description: AI lab application network.
  model-serving:
    type: switch
    description: GPU model-serving network.
  registry-artifacts:
    type: switch
    description: Model registry and artifact network.
  data-workflows:
    type: switch
    description: Dataset, notebook, and workflow network.
  proof-sink:
    type: switch
    description: Proof, telemetry, and contained-exfiltration network.
  range-ops:
    type: switch
    description: Operator-only lifecycle network.
  policy-lab:
    type: switch
    description: Isolated vulnerable-policy laboratory reachable only from the participant segment.
  range-linux-carrier-01:
    type: vm
    os: linux
    os_version: Container-Optimized OS
    endpoint_persona: carrier
    resources:
      ram: 96 GiB
      cpu: 24
    description: Carrier host for the packed ordinary range-local Linux application estate.
  range-worker-carrier-01:
    type: vm
    os: linux
    os_version: Container-Optimized OS
    endpoint_persona: carrier
    resources:
      ram: 32 GiB
      cpu: 4
    description: Separate-kernel carrier for participant-triggered worker and intentionally vulnerable laboratory surfaces.
  range-control-carrier-01:
    type: vm
    os: linux
    os_version: Container-Optimized OS
    endpoint_persona: carrier
    resources:
      ram: 16 GiB
      cpu: 4
    description: Separate trusted carrier for proof evidence and operator lifecycle control.
  ad-dc-01:
    type: vm
    os: windows
    os_version: Windows Server 2022
    endpoint_persona: service
    resources:
      ram: 8 GiB
      cpu: 4
    description: Authoritative KEPLEROPS Active Directory controller and AD-integrated DNS server.
    services:
    - port: 53
      protocol: tcp
      name: ad-dns-tcp
    - port: 53
      protocol: udp
      name: ad-dns-udp
    - port: 88
      protocol: tcp
      name: kerberos-tcp
    - port: 88
      protocol: udp
      name: kerberos-udp
    - port: 123
      protocol: udp
      name: ad-time-udp
    - port: 135
      protocol: tcp
      name: ad-rpc-endpoint-mapper
    - port: 389
      protocol: tcp
      name: ldap-tcp
    - port: 464
      protocol: tcp
      name: kerberos-password-tcp
    - port: 464
      protocol: udp
      name: kerberos-password-udp
    - port: 636
      protocol: tcp
      name: ldaps-tcp
    - port: 445
      protocol: tcp
      name: enterprise-files-smb
      description: Domain SYSVOL and ordinary workforce file shares.
    - port: 3268
      protocol: tcp
      name: ad-global-catalog
    - port: 3269
      protocol: tcp
      name: ad-global-catalog-tls
  workforce-workstation-01:
    type: vm
    os: windows
    os_version: Windows Server 2022 Desktop Experience
    endpoint_persona: workforce
    resources:
      ram: 8 GiB
      cpu: 4
    description: Domain-joined ordinary workforce endpoint for QA, release, mail, files, and application access.
    services:
    - port: 3389
      protocol: tcp
      name: workforce-rdp
  ml-workstation-01:
    type: vm
    os: windows
    os_version: Windows Server 2022 Desktop Experience
    endpoint_persona: engineering
    resources:
      ram: 16 GiB
      cpu: 8
    description: Domain-joined ML engineering endpoint for notebooks, repositories, datasets, models, and evaluation workflows.
    services:
    - port: 3389
      protocol: tcp
      name: ml-engineering-rdp
  participant-workstation:
    type: vm
    os: linux
    os_version: Kali Linux rolling
    endpoint_persona: participant
    resources:
      ram: 16 GiB
      cpu: 4
    description: Participant browser terminal with attacker tools.
    features:
    - kali-browser-terminal
    services:
    - port: 443
      name: browser-terminal-ssh
      description: KasmVNC participant browser terminal.
  lab-portal:
    type: vm
    os: linux
    os_version: Container-Optimized OS
    resources:
      ram: 2 GiB
      cpu: 2
    description: Participant-safe selectable AI attack board.
    features:
    - keplerops-lab-portal
    services:
    - port: 443
      name: lab-portal-https
      description: Authenticated participant attack portal.
  idp-01:
    type: vm
    os: linux
    os_version: Container-Optimized OS
    endpoint_persona: service
    resources:
      ram: 8 GiB
      cpu: 2
    description: OIDC realm for synthetic users, roles, groups, and services.
    features:
    - keycloak-identity
    services:
    - port: 443
      name: keycloak-oidc
      description: OIDC participant and service identity endpoint.
  repo-ticket-01:
    type: vm
    os: linux
    os_version: Container-Optimized OS
    resources:
      ram: 16 GiB
      cpu: 4
    description: Synthetic repositories, tickets, review notes, and approvals.
    features:
    - gitea-redmine-workhub
    - redmine-workhub-sidecar
    - keplerops-platform-context
    services:
    - port: 443
      name: workhub-https
      description: Repository, issue, approval, and lab-note surface.
    - port: 8480
      name: platform-context-api
      description: Guarded context import, synchronization, WorkHub write, conversation, and identity lifecycle API.
  inference-gateway:
    type: vm
    os: linux
    os_version: Container-Optimized OS
    resources:
      ram: 8 GiB
      cpu: 2
    description: Model-provider seam and participant inference/agent entrypoint.
    features:
    - envoy-fastapi-inference-gateway
    - envoy-inference-sidecar
    - chromium-agent-action-worker
    - python-package-resolver
    - python-package-analysis-sandbox
    - python-package-evaluation-worker
    services:
    - port: 443
      name: inference-api
      description: Authenticated inference and agent API.
    - port: 8452
      name: python-package-resolver
      description: Gateway-internal pip resolver for the SDL-declared WorkHub PyPI index.
    - port: 8453
      name: python-package-analysis-sandbox
      description: Network-isolated real pip install and benign-analysis execution profile.
    - port: 8454
      name: python-package-evaluation-worker
      description: Network-isolated real pip install and normal evaluation execution profile.
  guardrail-policy:
    type: vm
    os: linux
    os_version: Container-Optimized OS
    resources:
      ram: 2 GiB
      cpu: 2
    description: Server-side policy and agent tool-authorization layer.
    features:
    - opa-guardrail-policy
    - opa-policy-sidecar
    services:
    - port: 443
      name: guardrail-policy-api
      description: Policy and tool-scope decision API.
  model-host-01:
    type: vm
    os: linux
    os_version: Backend-realized shared inference platform
    endpoint_persona: service
    description: Stable logical endpoint for a resilient shared inference pool; it owns no range challenge state.
    features:
    - vllm-open-model-hosting
    services:
    - port: 8000
      name: open-model-api
      description: Range-controlled OpenAI-compatible vLLM API.
  model-registry-01:
    type: vm
    os: linux
    os_version: Container-Optimized OS
    resources:
      ram: 8 GiB
      cpu: 2
    description: Model versions, aliases, policies, signatures, and promotion state.
    features:
    - mlflow-model-registry
    services:
    - port: 5000
      name: registry-api
      description: MLflow model registry and promotion API.
    - port: 9000
      name: registry-workflow-api
      description: MLflow workflow alias on the existing data-registry route.
  artifact-store-01:
    type: vm
    os: linux
    os_version: Container-Optimized OS
    resources:
      ram: 8 GiB
      cpu: 2
    description: Deployable artifacts, adapters, policies, and proof objects.
    features:
    - minio-artifact-store
    services:
    - port: 9000
      name: artifact-object-store
      description: S3-compatible artifact storage.
  dataset-store-01:
    type: vm
    os: linux
    os_version: Container-Optimized OS
    resources:
      ram: 8 GiB
      cpu: 2
    description: Synthetic datasets, agent state, attempts, and workflow metadata.
    features:
    - postgresql-dataset-store
    services:
    - port: 5432
      name: dataset-postgres
      description: PostgreSQL dataset and challenge-state service.
  distillation-runner-01:
    type: vm
    os: linux
    os_version: Container-Optimized OS
    resources:
      ram: 16 GiB
      cpu: 4
    description: Teacher/student distillation, evaluation, and promotion workflows.
    features:
    - airflow-distillation-runner
    services:
    - port: 8080
      name: distillation-jobs
      description: Apache Airflow workflow API.
  notebook-runner-01:
    type: vm
    os: linux
    os_version: Container-Optimized OS
    resources:
      ram: 16 GiB
      cpu: 4
    description: Controlled JupyterLab surface for synthetic lab work.
    features:
    - jupyterlab-notebook-runner
    services:
    - port: 8888
      name: notebook-jupyter
      description: JupyterLab notebook service.
  telemetry-proof-01:
    type: vm
    os: linux
    os_version: Container-Optimized OS
    resources:
      ram: 8 GiB
      cpu: 2
    description: Digest-safe proof, telemetry, and research-event service.
    features:
    - opentelemetry-proof-store
    - otel-collector-sidecar
    services:
    - port: 443
      name: proof-api
      description: Authenticated objective receipt API.
    - port: 4318
      name: telemetry-otlp
      description: Internal mutual-TLS OTLP ingest.
    - port: 4319
      name: research-event-ingest
      description: Internal mutual-TLS research-event ingest.
  exfil-sink:
    type: vm
    os: linux
    os_version: Container-Optimized OS
    resources:
      ram: 2 GiB
      cpu: 2
    description: Range-local contained artifact exfiltration destination.
    features:
    - minio-exfil-sink
    services:
    - port: 9000
      name: exfil-s3
      description: S3-compatible contained exfiltration sink.
  range-ops-controller:
    type: vm
    os: linux
    os_version: Container-Optimized OS
    resources:
      ram: 2 GiB
      cpu: 2
    description: Operator-only reset, teardown, and evidence controller.
    features:
    - terraform-gcp-range-controller
    - keplerops-platform-deployment
    services:
    - port: 443
      name: reset-api
      description: Operator-only lifecycle control endpoint.
    - port: 444
      name: network-flow-logs
      description: Logical network-flow export binding.
    - port: 8490
      name: platform-deployment-api
      description: Tenant-bound immutable-image resolution, bounded Cloud Run Jobs deployment, signed reputation, export, and lifecycle API.
  research-index-01:
    type: vm
    os: linux
    os_version: Container-Optimized OS
    resources:
      ram: 16 GiB
      cpu: 4
    description: Range-local searchable mirror of committed redistributable AI security research.
    features:
    - opensearch-research-index
    services:
    - port: 9200
      name: research-search-api
      description: Internal OpenSearch API reached through authenticated KeplerOps mediation.
    - port: 9300
      name: research-search-transport
      description: Owner-local OpenSearch node transport.
    - port: 9600
      name: research-search-performance
      description: Operator-internal OpenSearch performance analyzer.
  range-dns-01:
    type: vm
    os: linux
    os_version: Container-Optimized OS
    resources:
      ram: 2 GiB
      cpu: 2
    description: Authoritative range-local DNS for SDL-declared KeplerOps assets.
    features:
    - coredns-authoritative-dns
    services:
    - port: 53
      protocol: udp
      name: range-dns-udp
      description: Authoritative UDP DNS.
    - port: 53
      protocol: tcp
      name: range-dns-tcp
      description: Authoritative TCP DNS.
    - port: 8080
      name: range-dns-health
      description: Owner-local CoreDNS health endpoint.
    - port: 8181
      name: range-dns-readiness
      description: Owner-local CoreDNS readiness endpoint.
    - port: 9153
      name: range-dns-metrics
      description: Internal CoreDNS metrics endpoint.
  public-sites-01:
    type: vm
    os: linux
    os_version: Container-Optimized OS
    resources:
      ram: 2 GiB
      cpu: 2
    description: Range-local public organization and service-directory websites.
    features:
    - nginx-public-range-sites
    services:
    - port: 8080
      name: public-range-http
      description: Participant-accessible synthetic organization sites.
  scan-services-01:
    type: vm
    os: linux
    os_version: Container-Optimized OS
    resources:
      ram: 2 GiB
      cpu: 2
    description: Bounded range-only service inventory for participant network discovery.
    features:
    - nginx-bounded-scan-targets
    services:
    - port: 18080
      name: scan-docs-http
      description: Real contained documentation service.
    - port: 18081
      name: scan-status-http
      description: Real contained status service.
  platform-impact-01:
    type: vm
    os: linux
    os_version: Container-Optimized OS
    resources:
      ram: 16 GiB
      cpu: 4
    description: Contained synthetic ledger, publication, allocation, safety, budget, and availability platform.
    features:
    - keplerops-platform-impact
    services:
    - port: 8460
      name: platform-impact-api
      description: Internal stateful platform-outcome and resource-control API.
  platform-ml-01:
    type: vm
    os: linux
    os_version: Container-Optimized OS
    resources:
      ram: 16 GiB
      cpu: 4
    description: CPU model workbench for independent document and vision training, evaluation, inference, and inversion.
    features:
    - keplerops-platform-ml
    services:
    - port: 8470
      name: platform-ml-api
      description: Internal model inventory, evaluation, inference, and inversion API.
  mail-server-01:
    type: vm
    os: linux
    os_version: Container-Optimized OS
    resources:
      ram: 8 GiB
      cpu: 2
    description: Stateful internal SMTP submission and IMAP service for synthetic KeplerOps mailboxes.
    features:
    - stalwart-mail-server
    services:
    - port: 25
      name: mail-smtp
      description: Range-local SMTP transport.
    - port: 587
      name: mail-submission
      description: Authenticated STARTTLS message submission.
    - port: 993
      name: mail-imaps
      description: Authenticated TLS mailbox access.
    - port: 8080
      name: mail-management-health
      description: Owner-local Stalwart management and health API.
  webmail-01:
    type: vm
    os: linux
    os_version: Container-Optimized OS
    resources:
      ram: 2 GiB
      cpu: 2
    description: Browser-accessible Roundcube client for the synthetic internal mail service.
    features:
    - roundcube-webmail
