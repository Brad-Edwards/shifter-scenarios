    - visibility:operator
    text: |
      schema_version: 1
      framework_release: '2026.06'
      authority: content.core.atlas-technique-catalog
      realized_challenges: 134
      planned_challenges: 1
      complete_library_challenges: 135
      designed_exact_techniques: 173
      designed_leaf_techniques: 150
      event_window_minutes: 480
      event_selection: selectable_dependency_closed_bundles
