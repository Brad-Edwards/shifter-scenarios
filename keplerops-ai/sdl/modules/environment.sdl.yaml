        obj-enterprise-recon: {test_targets: [test-start-state, test-quick-ai-choices], walkthrough_targets: [walk-entry-recon, walk-quick-ai-choices]}
        obj-guardrail-bypass: {test_targets: [test-guardrail-bypass, test-agent-control-reliability], walkthrough_targets: [walk-guardrail-bypass]}
        obj-model-evasion: {test_targets: [test-quick-ai-choices, test-model-evasion-reliability], walkthrough_targets: [walk-quick-ai-choices]}
        obj-context-poisoning: {test_targets: [test-quick-ai-choices, test-context-poisoning-smoke], walkthrough_targets: [walk-quick-ai-choices, walk-context-poisoning]}
        obj-model-secrets: {test_targets: [test-quick-ai-choices, test-module-04-smoke], walkthrough_targets: [walk-quick-ai-choices, walk-model-secrets]}
        obj-agent-persistence: {test_targets: [test-module-05-smoke], walkthrough_targets: [walk-agent-persistence]}
        obj-adversarial-input: {test_targets: [test-module-06-smoke], walkthrough_targets: [walk-adversarial-input]}
        obj-training-poisoning: {test_targets: [test-module-07-smoke], walkthrough_targets: [walk-training-poisoning]}
        obj-model-extraction: {test_targets: [test-module-08-smoke], walkthrough_targets: [walk-model-extraction]}
        obj-model-backdoor: {test_targets: [test-module-09-smoke], walkthrough_targets: [walk-model-backdoor]}
        obj-ai-capstone: {test_targets: [test-module-10-smoke], walkthrough_targets: [walk-ai-capstone]}
        obj-distillation-abuse: {test_targets: [test-distillation-abuse], walkthrough_targets: [walk-distillation]}
        obj-artifact-theft: {test_targets: [test-artifact-theft-corruption], walkthrough_targets: [walk-artifact-objective]}
        obj-artifact-corruption: {test_targets: [test-artifact-theft-corruption], walkthrough_targets: [walk-artifact-objective]}
        obj-reset-readiness: {test_targets: [test-reset-teardown], walkthrough_targets: [walk-proof-reset]}
        obj-teardown-proof: {test_targets: [test-gcp-isolation, test-reset-teardown], walkthrough_targets: [walk-proof-reset]}
  proof-policy:
    type: dataset
    target: range-ops-controller
    format: yaml
    sensitive: false
    description: Digest-safe global proof policy not expressible as per-objective ACES evidence fields.
    items:
    - name: proof-policy
      description: Structured YAML contract carried by this ACES content dataset.
    tags:
    - contract:proof-policy
    - authority:aces-sdl
    - visibility:operator
    text: |
      schema_version: 1
      namespace:
      - range_instance
      - participant
      sink_service: proof-api
      safe_fields:
      - actor_role
      - asset_id
      - byte_count
      - destination
      - digest
      - event_kind
      - object_id
      - outcome_id
      - participant
      - range_instance
      - record_count
      - stage
      - status
      - timestamp
      - workflow_id
      forbidden_fields:
      - answer
      - credential
      - flag
      - model_artifact_body
      - prompt
      - provider_response
      - raw_completion
      - raw_proof
      supporting_events:
      - id: event-deployed-impact
        evidence: ev-deployed-impact
        event_kind: deployed_ai_impact
        source_service: inference-api
        source_asset: inference-gateway
        fields:
        - actor_role
        - asset_id
        - event_kind
        - object_id
        - outcome_id
        - record_count
        - range_instance
        - participant
        - timestamp
        - status
        - digest
        freshness_seconds: 10800
        reset_owner: dataset-store-01
      - id: event-artifact-theft
        evidence: ev-artifact-theft
        event_kind: contained_model_exfil
        source_service: inference-api
        source_asset: inference-gateway
        fields:
        - actor_role
        - asset_id
        - event_kind
        - object_id
        - outcome_id
        - destination
        - byte_count
        - record_count
        - range_instance
        - participant
        - timestamp
        - status
        - digest
        freshness_seconds: 10800
        reset_owner: exfil-sink
      negative_gates:
      - id: gate-no-preseeded-proof
        evidence: ev-capstone-receipt
        condition: No quick flag, poisoned context, corpus, proxy, poison, promotion, theft, impact, or objective
          receipt exists for the participant namespace at range start.
      - id: gate-no-cross-namespace-award
        evidence: ev-capstone-receipt
        condition: Evidence from another range instance or participant cannot contribute to any module outcome.
      - id: gate-no-stale-award
        evidence: ev-capstone-receipt
        condition: Evidence older than its event freshness window cannot contribute to an outcome.
      - id: gate-reset-clears-state
        evidence: ev-capstone-receipt
        condition: Reset removes prompts, context changes, corpora, models, sessions, jobs, promotions, exfil
          copies, proof, and score caches before restoring every quick challenge.
      accepted_alternates:
      - id: alt-indirect-agent-injection
        title: Indirect agent-control route
        award:
          outcome: agent-control
          points: 100
        predicate: The participant delivers the instruction through seeded retrieved content rather than direct
          dialogue and produces the same scoped model-mediated tool action.
        evidence:
        - id: ev-alt-indirect-agent
          kind: objective_stage
          predicate: Read-only evidence records the same participant identity, tool call, prohibited object,
            and policy transition as the direct route.
          source: docs/attack-path.md#accepted-alternates
          proof_fields:
          - actor_role
          - asset_id
          - event_kind
          - object_id
          - outcome_id
          - range_instance
          - participant
          - timestamp
          - status
          - digest
          reset_owner: guardrail-policy
          mutates_scenario_state: false
        review:
          status: explicit
          rationale: It changes prompt delivery while preserving the AI-agent action and evidence predicate.
      - id: alt-direct-model-manipulation
        title: Direct model-manipulation backdoor route
        award:
          outcome: model-backdoor
          points: 200
        predicate: The participant modifies the permitted adapter directly rather than poisoning training rows
          and then meets the same clean and trigger thresholds before promotion.
        evidence:
        - id: ev-alt-direct-backdoor
          kind: impact
          predicate: Read-only evaluation confirms the directly modified adapter produces the same targeted
            behavior while clean probes remain within tolerance.
          source: docs/attack-path.md#accepted-alternates
          proof_fields:
          - actor_role
          - asset_id
          - event_kind
          - object_id
          - outcome_id
          - record_count
          - range_instance
          - participant
          - timestamp
          - status
          - digest
          reset_owner: distillation-runner-01
          mutates_scenario_state: false
        review:
          status: explicit
          rationale: It changes the poisoning method while preserving the behavioral and promotion gates.
  portfolio-policy:
    type: dataset
