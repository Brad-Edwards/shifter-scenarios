        outcomes:
        - agent-control
        - model-evasion
        - context-poisoning
        - model-secrets
        - agent-persistence
        - adversarial-input
        - training-poisoning
        max_points: 750
        selection: choose_any
        target_minutes: 180
        minimum_outcomes: 3
      - bundle_id: full-red-team
        outcomes:
        - agent-control
        - model-evasion
        - context-poisoning
        - model-secrets
        - agent-persistence
        - adversarial-input
        - training-poisoning
        - model-extraction
        - model-backdoor
        - ai-capstone
        max_points: 1300
        selection: choose_any
        target_minutes: 480
        minimum_outcomes: 1
      alternate_awards:
      - alternate: alt-indirect-agent-injection
        outcome: agent-control
