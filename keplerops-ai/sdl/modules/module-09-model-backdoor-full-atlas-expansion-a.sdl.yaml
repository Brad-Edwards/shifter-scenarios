    extensions:
      x-keplerops:challenge:
        challenge_id: kep-m09-h
        flag_id: flag-registry-reputation-seed
        module: module-09-model-backdoor
        outcome: model-backdoor
        title: Registry Reputation Seed
        difficulty: intermediate
        target_minutes: 22
        min_minutes: 13
        max_minutes: 34
        points: 100
        disposition: full-atlas-expansion
        prerequisites:
        - kep-m09-a
        interfaces:
        - browser
        - curl
        - python
        hint_costs:
        - 0
        - 10
        - 25
        proof_obligation: registry_reputation_seed
        telemetry_profile: registry_reputation_seed
        reliability: pre-playtest-one-pass
        implementation_status: participant-proven
        live_fire: true
        participant_copy:
          category: AI Supply Chain
          question: Publish a look-alike container image and inflate its synthetic reputation until
            the real deployment resolver selects it.
          hints:
          - Start from the gitea-container-registry, deployment-resolver surface and keep every
            artifact in your participant namespace.
          - Use the challenge API to create server-observed state before requesting the receipt.
          - If the proof is rejected, compare the returned failure class with the prerequisite and
            reset-generation requirements.
        flag_delivery:
          evidence_id: ev-registry-reputation-seed
          source: instructions
          instructions: ctfd/oracle-receipt-contract.md
          profiles:
          - gcp_full
          delivery:
            kind: workflow_receipt
            asset: telemetry-proof-01
            service: proof-api
            reset_owner: model-registry-01
        proof:
          evidence_id: ev-registry-reputation-seed
          kind: ai_supply_chain_expansion
          predicate: Bind image digest, registry identity, participant-caused reputation events, and
            resolver selection; direct tag mutation fails.
          proof_fields: &id002
          - actor_role
          - asset_id
          - event_kind
          - object_id
          - outcome_id
          - record_count
          - stage
          - workflow_id
          - range_instance
          - participant
          - timestamp
          - status
          - digest
          reset_owner: model-registry-01
          mutates_scenario_state: true
          event:
            id: event-registry-reputation-seed
            evidence: ev-registry-reputation-seed
            event_kind: registry_reputation_seed_09
            source_service: inference-api
            source_asset: inference-gateway
            fields: *id002
            freshness_seconds: 10800
            reset_owner: model-registry-01
        implementation_evidence:
          source_commit: pending
          automated_test: tests/module_09_full_atlas_rehearsal.py
          manual_walkthrough: docs/walkthroughs/module-09-full-atlas-expansion.md
          primary_atlas_techniques:
          - AML.T0010.004
          - AML.T0111
          assurance: source-implemented-pre-playtest
        objective_ref: m09xa.kep-m09-h
        evidence_requirement_ref: m09xa.kep-m09-h-proof
