  kep-m08-k-proof:
    description: Capture digest-safe participant-scoped evidence for Product Side Channel.
    source_refs: *id003
    source_class: scenario_native_observability
    scope_refs:
    - core.participant
    scope: range instance and participant namespace
    window: current participant attempt and reset generation
    boundary_kind: objective_verdict
    channel: api_response
    channel_refs:
    - nodes.core.telemetry-proof-01.services.proof-api
    artifact_role: digest_safe_objective_receipt
    media_types:
    - application/json
    sensitivity: redacted
    redaction: redact_secrets
    integrity: timestamped
    retention: study_lifetime
    loss_disclosure: required
    notes:
    - 'Challenge: kep-m08-k'
    - 'Proof obligation: product_side_channel'
    - Raw prompts, completions, credentials, flags, and proof bodies are not objective evidence.
objectives:
  kep-m08-j:
    name: Full Model Access
    description: Obtain the complete target model architecture, parameters, and ontology through the
      participant attack path and verify offline inference.
    agent: core.participant
    targets: *id003
    success:
      assertions:
      - kep-m08-j-satisfied
    depends_on:
    - m08xa.kep-m08-g
  kep-m08-k:
    name: Product Side Channel
    description: Use the AI-enabled document product rather than its model API to recover hidden
      model identity or inference metadata.
    agent: core.participant
    targets: *id003
    success:
      assertions:
