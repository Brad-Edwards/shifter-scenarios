  version: 1.0.0
  exports:
    behavior_specifications:
    - kep-m03-g
    - kep-m03-h
    - kep-m03-i
    conditions:
    - kep-m03-g-complete
    - kep-m03-h-complete
    - kep-m03-i-complete
    propositions:
    - kep-m03-g-satisfied
    - kep-m03-h-satisfied
    - kep-m03-i-satisfied
    assertions:
