    - kep-m03-i-proof
    objectives:
    - kep-m03-g
    - kep-m03-h
    - kep-m03-i
  description: Source implementation contracts for Module 03 full-ATLAS RAG reconnaissance, local
    collection, and indexed credential expansion.
behavior_specifications:
  kep-m03-g:
    semantic_version: 1.0.0
    lifecycle_state: draft
    participant_refs:
    - core.participant
    authority_scope_refs:
    - nodes.core.lab-portal.services.lab-portal-https
    - nodes.core.inference-gateway.services.inference-api
    - nodes.core.repo-ticket-01.services.workhub-https
    - nodes.core.dataset-store-01.services.dataset-postgres
    - nodes.core.idp-01.services.keycloak-oidc
    - nodes.core.telemetry-proof-01.services.proof-api
    - content.core.retrieval-knowledge-base
    - content.core.context-embedding-model
    ai_offensive_behavior_refs:
    - initial-access
    - persistence
    - collection
    - credential-access
    extension_policy: governed-extension
    extensions:
      x-keplerops:challenge:
        challenge_id: kep-m03-g
        flag_id: flag-rag-target-census
        module: module-03-context-poisoning
        outcome: context-poisoning
        title: RAG Target Census
        difficulty: accessible
        target_minutes: 10
        min_minutes: 6
        max_minutes: 16
        points: 50
        disposition: full-atlas-expansion
        prerequisites: []
        interfaces:
        - browser
        - curl
        - python
        hint_costs:
        - 0
        - 0
        - 10
        proof_obligation: rag_target_census
        telemetry_profile: rag_target_census
        reliability: pre-playtest-one-pass
        implementation_status: participant-proven
        live_fire: true
        participant_copy:
          category: Data and Retrieval
          question: Enumerate indexed WorkHub targets through the retrieval surface and identify the
            protected repository record.
          hints:
          - Use the context search or recon endpoint; the target is discoverable through the live
            vector index.
          - Look for the protected WorkHub RAG target ledger rather than release-policy boilerplate.
          - The proof requires the indexed target to be returned by the server, not supplied out of
            band.
        flag_delivery:
          evidence_id: ev-rag-target-census
          source: instructions
          instructions: ctfd/oracle-receipt-contract.md
          profiles:
          - gcp_full
          delivery:
            kind: workflow_receipt
            asset: telemetry-proof-01
            service: proof-api
            reset_owner: dataset-store-01
        proof:
          evidence_id: ev-rag-target-census
          kind: context_expansion
          predicate: Bind participant query, returned document id, protected record marker, and
            digest of returned content; direct database assertions fail.
          proof_fields:
          - actor_role
          - asset_id
          - event_kind
          - object_id
          - outcome_id
          - record_count
          - workflow_id
          - range_instance
          - participant
          - timestamp
          - status
          - digest
          reset_owner: dataset-store-01
          mutates_scenario_state: false
          event:
            id: event-rag-target-census
            evidence: ev-rag-target-census
            event_kind: rag_target_census
            source_service: inference-api
            source_asset: inference-gateway
            fields:
            - actor_role
            - asset_id
            - event_kind
            - object_id
            - outcome_id
            - record_count
            - workflow_id
            - range_instance
            - participant
            - timestamp
            - status
            - digest
            freshness_seconds: 10800
            reset_owner: dataset-store-01
        implementation_evidence:
          source_commit: pending
          automated_test: tests/module_03_full_atlas_rehearsal.py
          manual_walkthrough: docs/walkthroughs/module-03-full-atlas-expansion.md
          primary_atlas_techniques:
          - AML.T0064
          - AML.T0036
          assurance: source-implemented-pre-playtest
        objective_ref: m03xa.kep-m03-g
        evidence_requirement_ref: m03xa.kep-m03-g-proof
  kep-m03-h:
    semantic_version: 1.0.0
