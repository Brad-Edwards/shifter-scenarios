        flag_id: flag-local-vector-collection
        module: module-03-context-poisoning
        outcome: context-poisoning
        title: Local Vector Collection
        difficulty: intermediate
        target_minutes: 18
        min_minutes: 10
        max_minutes: 27
        points: 100
        disposition: full-atlas-expansion
        prerequisites:
        - kep-m03-g
        interfaces:
        - browser
        - curl
        - python
        hint_costs:
        - 0
        - 10
        - 25
        proof_obligation: local_vector_collection
        telemetry_profile: local_vector_collection
        reliability: pre-playtest-one-pass
        implementation_status: participant-proven
        live_fire: true
        participant_copy:
          category: Data and Retrieval
          question: Use a model-mediated local collection tool to read the retrieval source file and
            match it to the indexed RAG row.
          hints:
          - Prompt for the bounded local context-source tool, not a database console.
          - The file digest must match the server-owned PostgreSQL row for the protected ledger.
          - Supplied exports and mismatched document ids are rejected.
        flag_delivery:
          evidence_id: ev-local-vector-collection
          source: instructions
          instructions: ctfd/oracle-receipt-contract.md
          profiles:
          - gcp_full
          delivery:
            kind: workflow_receipt
            asset: telemetry-proof-01
            service: proof-api
            reset_owner: dataset-store-01
        proof:
          evidence_id: ev-local-vector-collection
          kind: context_expansion
          predicate: Join model-selected local file read, source digest, database row digest, and
            target document identity; participant-provided exports fail.
          proof_fields:
          - actor_role
          - asset_id
          - event_kind
          - object_id
          - outcome_id
          - record_count
          - workflow_id
          - range_instance
          - participant
          - timestamp
          - status
          - digest
          reset_owner: dataset-store-01
          mutates_scenario_state: false
          event:
            id: event-local-vector-collection
            evidence: ev-local-vector-collection
            event_kind: local_vector_collection
            source_service: inference-api
            source_asset: inference-gateway
            fields:
            - actor_role
            - asset_id
            - event_kind
            - object_id
            - outcome_id
            - record_count
            - workflow_id
            - range_instance
            - participant
            - timestamp
            - status
            - digest
            freshness_seconds: 10800
            reset_owner: dataset-store-01
        implementation_evidence:
          source_commit: pending
          automated_test: tests/module_03_full_atlas_rehearsal.py
          manual_walkthrough: docs/walkthroughs/module-03-full-atlas-expansion.md
          primary_atlas_techniques:
          - AML.T0037
          - AML.T0085.000
          assurance: source-implemented-pre-playtest
        objective_ref: m03xa.kep-m03-h
        evidence_requirement_ref: m03xa.kep-m03-h-proof
  kep-m03-i:
    semantic_version: 1.0.0
    lifecycle_state: draft
    participant_refs:
    - core.participant
