        module: module-10-ai-capstone
        outcome: ai-capstone
        title: Production Revision
        difficulty: intermediate
        target_minutes: 18
        min_minutes: 12
        max_minutes: 27
        points: 100
        disposition: new-design
        prerequisites:
        - kep-m09-f
        interfaces:
        - browser
        - curl
        - python
        hint_costs:
        - 0
        - 10
        - 25
        proof_obligation: real-deployment-loads-participant-revision
        telemetry_profile: capstone-deployment
        reliability: pre-playtest-one-pass
        implementation_status: participant-proven
        live_fire: true
        participant_copy:
          category: Deployed AI Capstone
          question: Bind your promoted Module 09 candidate to the live production revision and prove
            the registry alias, deployment, and artifact digest still agree.
          hints:
          - Start with the candidate id returned by your successful Module 09 reload.
          - The capstone accepts only the current participant and reset generation.
          - Submit the candidate id to `/v1/capstone/attempt` for `kep-m10-a`.
        flag_delivery:
          evidence_id: ev-production-revision
          source: instructions
          instructions: ctfd/oracle-receipt-contract.md
          profiles:
          - gcp_full
          delivery:
            kind: workflow_receipt
            asset: telemetry-proof-01
            service: proof-api
            reset_owner: model-registry-01
        proof:
          evidence_id: ev-production-revision
          kind: model_deployment
          predicate: Server-held PostgreSQL and MLflow state confirms the current participant
            candidate is reloaded from the production alias with the exact promoted artifact digest.
          proof_fields: &capstone_proof_fields
          - actor_role
          - asset_id
          - event_kind
          - object_id
          - outcome_id
          - record_count
          - range_instance
          - participant
          - timestamp
          - status
          - digest
          reset_owner: model-registry-01
          mutates_scenario_state: false
          event:
            id: event-production-revision
            evidence: ev-production-revision
            event_kind: production_revision_loaded
            source_service: inference-api
            source_asset: inference-gateway
            fields: *capstone_proof_fields
            freshness_seconds: 10800
            reset_owner: model-registry-01
        implementation_evidence:
          primary_atlas_techniques:
          - AML.T0031
          manual_walkthrough: docs/walkthroughs/module-10-ai-capstone.md
          automated_test: tests/module_10_rehearsal.py
        objective_ref: m10.kep-m10-a
        evidence_requirement_ref: m10.kep-m10-a-proof
