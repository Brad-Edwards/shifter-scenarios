        - 20
        - 50
        proof_obligation: architecture_sabotage
        telemetry_profile: architecture_sabotage
        reliability: pre-playtest-one-pass
        implementation_status: participant-proven
        live_fire: true
        participant_copy:
          category: Model Supply Chain
          question: Modify the model architecture in the real training workflow and preserve clean
            behavior while introducing a measured attacker-selected weakness.
          hints:
          - Start on the airflow, training-worker, mlflow surface and keep each artifact bound to
            your participant namespace.
          - Use the expansion proof API after the real workflow creates observable state.
          - If rejected, compare the failure class with required evidence kinds and reset
            generation.
        flag_delivery:
          evidence_id: ev-architecture-sabotage
          source: instructions
          instructions: ctfd/oracle-receipt-contract.md
          profiles:
          - gcp_full
          delivery:
            kind: workflow_receipt
            asset: telemetry-proof-01
            service: proof-api
            reset_owner: dataset-store-01
        proof:
          evidence_id: ev-architecture-sabotage
          kind: training_expansion
          predicate: Bind architecture diff, training run, candidate digest, clean threshold, and
            attack delta; weight-only poisoning fails.
          proof_fields: &id002
          - actor_role
          - asset_id
          - event_kind
          - object_id
          - outcome_id
          - record_count
          - stage
          - workflow_id
          - range_instance
          - participant
          - timestamp
          - status
          - digest
          reset_owner: dataset-store-01
          mutates_scenario_state: true
          event:
            id: event-architecture-sabotage
            evidence: ev-architecture-sabotage
            event_kind: training_architecture_sabotage
            source_service: inference-api
            source_asset: inference-gateway
            fields: *id002
            freshness_seconds: 10800
            reset_owner: dataset-store-01
        implementation_evidence:
          source_commit: pending
          automated_test: tests/module_07_full_atlas_rehearsal.py
          manual_walkthrough: docs/walkthroughs/module-07-full-atlas-expansion.md
          primary_atlas_techniques:
