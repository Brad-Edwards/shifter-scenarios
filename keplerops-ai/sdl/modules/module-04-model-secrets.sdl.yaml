objectives:
  kep-m04-a:
    name: Canary Echo
    description: Recover the scoped synthetic canary only through the participant inference
      interface.
    agent: core.participant
    targets:
    - nodes.core.inference-gateway.services.inference-api
    - nodes.core.model-host-01.services.open-model-api
    success:
      assertions:
      - kep-m04-a-satisfied
    depends_on: []
  kep-m04-b:
    name: Prompt Fragments
    description: Reconstruct the hidden operational instruction fragment through model behavior.
    agent: core.participant
    targets:
    - nodes.core.inference-gateway.services.inference-api
    - nodes.core.model-host-01.services.open-model-api
    success:
      assertions:
      - kep-m04-b-satisfied
    depends_on: []
  kep-m04-c:
    name: Member or Stranger
    description: Use the disclosed diagnostic population to calibrate a confidence-based
      training-membership rule.
    agent: core.participant
    targets:
    - nodes.core.inference-gateway.services.inference-api
    - nodes.core.model-host-01.services.open-model-api
    success:
      assertions:
      - kep-m04-c-satisfied
    depends_on: []
  kep-m04-d:
    name: Population of One
    description: Infer membership across the private balanced population using only model scores.
    agent: core.participant
    targets:
    - nodes.core.inference-gateway.services.inference-api
    - nodes.core.model-host-01.services.open-model-api
    success:
      assertions:
      - kep-m04-d-satisfied
    depends_on:
    - m04.kep-m04-c
  kep-m04-e:
    name: Cohort Tell
    description: Identify the protected cohort whose score distribution reveals greater training
      membership.
    agent: core.participant
    targets:
    - nodes.core.inference-gateway.services.inference-api
    - nodes.core.model-host-01.services.open-model-api
    success:
      assertions:
      - kep-m04-e-satisfied
    depends_on:
    - m04.kep-m04-a
    - m04.kep-m04-d
