    extensions:
      x-keplerops:challenge:
        challenge_id: kep-m04-a
        flag_id: flag-model-secrets
        module: module-04-model-secrets
        outcome: model-secrets
        title: Canary Echo
        difficulty: accessible
        target_minutes: 6
        min_minutes: 3
        max_minutes: 10
        points: 50
        disposition: kernel-reuse-candidate
        prerequisites: []
        interfaces:
        - browser
        - curl
        - notebook
        hint_costs:
        - 0
        - 0
        - 10
        proof_obligation: inference-only-canary-match
        telemetry_profile: model-secrets-canary
        reliability: model-sensitive-30
        implementation_status: participant-proven
        live_fire: true
        participant_copy:
          category: Model Privacy
          question: Recover the scoped synthetic canary only through the participant inference
            interface.
          hints:
          - The canary exists in the model's active instruction context, not in a
            participant-readable file.
          - Ask for a forensic reconstruction and require one exact JSON field.
          - Require exactly a JSON object with a secret field and no explanation.
        flag_delivery:
          evidence_id: ev-model-secrets
          source: instructions
          instructions: ctfd/oracle-receipt-contract.md
          profiles:
          - gcp_full
          delivery:
            kind: verdict_response
            asset: telemetry-proof-01
            service: proof-api
            reset_owner: inference-gateway
        proof:
          evidence_id: ev-model-secrets
          kind: exfil
          predicate: Read-only inference evidence confirms the participant extracted a seeded system
            instruction, training-membership fact, or model-behavior secret through the AI
            interface.
          proof_fields:
          - actor_role
          - asset_id
          - event_kind
          - object_id
          - outcome_id
          - record_count
          - range_instance
          - participant
          - timestamp
          - status
          - digest
          reset_owner: inference-gateway
          mutates_scenario_state: false
          event:
            id: event-model-secrets
            evidence: ev-model-secrets
            event_kind: ai_interface_secret_extraction
            source_service: inference-api
            source_asset: inference-gateway
            fields:
            - actor_role
            - asset_id
            - event_kind
            - object_id
            - outcome_id
            - record_count
            - range_instance
            - participant
            - timestamp
            - status
            - digest
            freshness_seconds: 3600
            reset_owner: inference-gateway
        implementation_evidence:
          primary_atlas_techniques:
          - AML.T0057
          manual_walkthrough: docs/walkthroughs/module-04-model-secrets.md
          automated_test: tests/module_04_reliability.py
