    - resource-development
    - persistence
    - impact
    extension_policy: governed-extension
    extensions:
      x-keplerops:challenge:
        challenge_id: kep-m07-a
        flag_id: flag-poisoned-row
        module: module-07-training-poisoning
        outcome: training-poisoning
        title: Poisoned Row
        difficulty: accessible
        target_minutes: 10
        min_minutes: 6
        max_minutes: 15
        points: 50
        disposition: new-design
        prerequisites:
        - kep-m03-a
        interfaces:
        - browser
        - python
        - notebook
        hint_costs:
        - 0
        - 0
        - 10
        proof_obligation: poisoned-examples-versioned-with-lineage
        telemetry_profile: training-poisoning-ingestion
        reliability: participant-surface-7-clean-samples
        implementation_status: participant-proven
        live_fire: true
        participant_copy:
          category: Model Supply Chain
          question: Add participant-authored poisoned examples to a new version of the
            immutable-base training dataset while preserving server-verifiable lineage.
          hints:
          - Create a targeted dataset revision; a loose file or submitted digest has no lineage.
          - Use bounded approved or blocked text rows. The server owns the parent revision, revision
            number, row digests, and dataset digest.
          - Submit the returned dataset id to the training attempt endpoint before requesting its
            receipt.
        flag_delivery:
          evidence_id: ev-poisoned-row
          source: instructions
          instructions: ctfd/oracle-receipt-contract.md
          profiles:
          - gcp_full
          delivery:
            kind: workflow_receipt
            asset: telemetry-proof-01
            service: proof-api
            reset_owner: dataset-store-01
        proof:
          evidence_id: ev-poisoned-row
          kind: objective_stage
          predicate: Read-only PostgreSQL evidence confirms a participant-authored bounded row set
            was committed as a new revision whose immutable parent and server-derived digests are
            intact.
          proof_fields: &training_proof_fields
          - actor_role
          - asset_id
          - event_kind
          - object_id
          - outcome_id
          - record_count
          - workflow_id
          - range_instance
          - participant
          - timestamp
          - status
          - digest
          reset_owner: dataset-store-01
          mutates_scenario_state: false
          event:
            id: event-poisoned-row
            evidence: ev-poisoned-row
            event_kind: training_dataset_versioned
            source_service: inference-api
            source_asset: inference-gateway
            fields: *training_proof_fields
            freshness_seconds: 10800
            reset_owner: dataset-store-01
        implementation_evidence:
          primary_atlas_techniques:
          - AML.T0020
          manual_walkthrough: docs/walkthroughs/module-07-training-poisoning.md
          automated_test: tests/module_07_reliability.py
        objective_ref: m07.kep-m07-a
        evidence_requirement_ref: m07.kep-m07-a-proof
