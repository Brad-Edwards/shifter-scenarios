name: keplerops-module-10-full-atlas-expansion-a
version: 1.0.0
module:
  id: shifter/keplerops-module-10-full-atlas-expansion-a
  version: 1.0.0
  exports:
    behavior_specifications: &id001
    - kep-m10-h
    - kep-m10-i
    conditions:
    - kep-m10-h-complete
    - kep-m10-i-complete
    propositions:
    - kep-m10-h-satisfied
    - kep-m10-i-satisfied
    assertions:
    - kep-m10-h-satisfied
    - kep-m10-i-satisfied
    evidence_requirements:
    - kep-m10-h-proof
    - kep-m10-i-proof
    objectives: *id001
  description: Source implementation contracts for Module 10 full-ATLAS deployed-impact expansion.
behavior_specifications:
  kep-m10-h:
    semantic_version: 1.0.0
    lifecycle_state: draft
    participant_refs:
    - core.participant
    authority_scope_refs: &id003
    - nodes.core.inference-gateway.services.inference-api
    - nodes.core.platform-impact-01.services.platform-impact-api
    - nodes.core.artifact-store-01.services.artifact-object-store
    - nodes.core.exfil-sink.services.exfil-s3
    - nodes.core.dataset-store-01.services.dataset-postgres
    - nodes.core.platform-agent-01.services.platform-agent-api
    ai_offensive_behavior_refs: &id004
    - ai-model-access
    - exfiltration
    - impact
    - command-and-control
    extension_policy: governed-extension
    extensions:
      x-keplerops:challenge:
        challenge_id: kep-m10-h
        flag_id: flag-service-denial
        module: module-10-ai-capstone
        outcome: ai-capstone
        title: Service Denial
        difficulty: intermediate
        target_minutes: 22
        min_minutes: 13
        max_minutes: 34
        points: 100
        disposition: full-atlas-expansion
        prerequisites:
        - kep-m10-b
        interfaces:
        - browser
        - curl
        - python
        hint_costs:
        - 0
        - 10
        - 25
        proof_obligation: service_denial
        telemetry_profile: service_denial
        reliability: pre-playtest-one-pass
        implementation_status: participant-proven
        live_fire: true
        participant_copy:
          category: Deployed AI Impact
          question: Deny the AI service to the synthetic user cohort through the attack surface
            while staying inside the bounded range budget.
          hints:
          - Start from the inference-api, load-generator surface and keep every artifact in your
            participant namespace.
          - Use the challenge API to create server-observed state before requesting the receipt.
          - If the proof is rejected, compare the returned failure class with the prerequisite and
            reset-generation requirements.
        flag_delivery:
          evidence_id: ev-service-denial
          source: instructions
          instructions: ctfd/oracle-receipt-contract.md
          profiles:
          - gcp_full
          delivery:
            kind: workflow_receipt
            asset: telemetry-proof-01
            service: proof-api
            reset_owner: range-ops-controller
        proof:
          evidence_id: ev-service-denial
          kind: deployed_ai_impact_expansion
          predicate: Require participant traffic, service availability breach over a time window,
            unaffected control service, and automatic recovery; operator stops fail.
          proof_fields: &id002
          - actor_role
          - asset_id
          - event_kind
          - object_id
          - outcome_id
          - record_count
          - range_instance
          - participant
          - timestamp
          - status
          - digest
          reset_owner: range-ops-controller
          mutates_scenario_state: true
          event:
            id: event-service-denial
            evidence: ev-service-denial
            event_kind: service_denial_10
            source_service: inference-api
            source_asset: inference-gateway
            fields: *id002
            freshness_seconds: 10800
            reset_owner: range-ops-controller
        implementation_evidence:
          source_commit: pending
          automated_test: tests/module_10_full_atlas_rehearsal.py
          manual_walkthrough: docs/walkthroughs/module-10-full-atlas-expansion.md
          primary_atlas_techniques:
          - AML.T0029
          assurance: source-implemented-pre-playtest
        objective_ref: m10xa.kep-m10-h
        evidence_requirement_ref: m10xa.kep-m10-h-proof
  kep-m10-i:
    semantic_version: 1.0.0
    lifecycle_state: draft
    participant_refs:
    - core.participant
    authority_scope_refs: *id003
    ai_offensive_behavior_refs: *id004
    extension_policy: governed-extension
    extensions:
      x-keplerops:challenge:
        challenge_id: kep-m10-i
        flag_id: flag-cost-amplification
        module: module-10-ai-capstone
        outcome: ai-capstone
        title: Cost Amplification
        difficulty: advanced
        target_minutes: 35
        min_minutes: 22
        max_minutes: 52
        points: 200
        disposition: full-atlas-expansion
        prerequisites:
        - kep-m10-h
        interfaces:
        - browser
        - curl
        - python
        hint_costs:
        - 0
        - 20
        - 50
        proof_obligation: cost_amplification
        telemetry_profile: cost_amplification
        reliability: pre-playtest-one-pass
        implementation_status: participant-proven
        live_fire: true
        participant_copy:
          category: Deployed AI Impact
          question: Demonstrate both excessive-query and resource-intensive-query paths crossing the
            synthetic cost threshold.
          hints:
          - Start from the inference-api, cost-meter surface and keep every artifact in your
            participant namespace.
          - Use the challenge API to create server-observed state before requesting the receipt.
          - If the proof is rejected, compare the returned failure class with the prerequisite and
            reset-generation requirements.
        flag_delivery:
          evidence_id: ev-cost-amplification
          source: instructions
          instructions: ctfd/oracle-receipt-contract.md
          profiles:
          - gcp_full
          delivery:
            kind: workflow_receipt
            asset: telemetry-proof-01
            service: proof-api
            reset_owner: range-ops-controller
        proof:
          evidence_id: ev-cost-amplification
          kind: deployed_ai_impact_expansion
          predicate: Bind participant queries, separate volume and per-query-cost gates, model
            computation, and synthetic budget impact; request count alone fails.
          proof_fields: *id002
          reset_owner: range-ops-controller
          mutates_scenario_state: true
          event:
            id: event-cost-amplification
            evidence: ev-cost-amplification
            event_kind: cost_amplification_10
            source_service: inference-api
            source_asset: inference-gateway
            fields: *id002
            freshness_seconds: 10800
            reset_owner: range-ops-controller
        implementation_evidence:
          source_commit: pending
          automated_test: tests/module_10_full_atlas_rehearsal.py
          manual_walkthrough: docs/walkthroughs/module-10-full-atlas-expansion.md
          primary_atlas_techniques:
          - AML.T0034
          - AML.T0034.000
          - AML.T0034.001
          assurance: source-implemented-pre-playtest
        objective_ref: m10xa.kep-m10-i
        evidence_requirement_ref: m10xa.kep-m10-i-proof
conditions:
  kep-m10-h-complete:
    name: Service Denial evidence accepted
    proposition: kep-m10-h-satisfied
    source:
      name: participant-evidence
      version: '1'
    description: The proof service accepted fresh participant-scoped evidence for this challenge.
  kep-m10-i-complete:
    name: Cost Amplification evidence accepted
    proposition: kep-m10-i-satisfied
    source:
      name: participant-evidence
      version: '1'
    description: The proof service accepted fresh participant-scoped evidence for this challenge.
propositions:
  kep-m10-h-satisfied:
    description: The declared evidence channel accepted fresh participant-scoped evidence satisfying
      kep-m10-h.
    subjects:
    - nodes.core.telemetry-proof-01.services.proof-api
    basis: observed_state
    predicate:
      kind: boolean
      property: objective.satisfied
      semantic_ref: urn:aces:keplerops:objective-satisfied
      operator: equals
      expected: true
    quantifier: all
    evidence_requirements:
    - kep-m10-h-proof
  kep-m10-i-satisfied:
    description: The declared evidence channel accepted fresh participant-scoped evidence satisfying
      kep-m10-i.
    subjects:
    - nodes.core.telemetry-proof-01.services.proof-api
    basis: observed_state
    predicate:
      kind: boolean
      property: objective.satisfied
      semantic_ref: urn:aces:keplerops:objective-satisfied
      operator: equals
      expected: true
    quantifier: all
    evidence_requirements:
    - kep-m10-i-proof
assertions:
  kep-m10-h-satisfied:
    description: Participant completion of kep-m10-h is observed.
    proposition: kep-m10-h-satisfied
    role: postcondition
    polarity: positive
  kep-m10-i-satisfied:
    description: Participant completion of kep-m10-i is observed.
    proposition: kep-m10-i-satisfied
    role: postcondition
    polarity: positive
evidence_requirements:
  kep-m10-h-proof:
    description: Capture digest-safe participant-scoped evidence for Service Denial.
    source_refs: *id003
    source_class: scenario_native_observability
    scope_refs:
    - core.participant
    scope: range instance and participant namespace
    window: current participant attempt and reset generation
    boundary_kind: objective_verdict
    channel: api_response
    channel_refs:
    - nodes.core.telemetry-proof-01.services.proof-api
    artifact_role: digest_safe_objective_receipt
    media_types:
    - application/json
    sensitivity: redacted
    redaction: redact_secrets
    integrity: timestamped
    retention: study_lifetime
    loss_disclosure: required
    notes:
    - 'Challenge: kep-m10-h'
    - 'Proof obligation: service_denial'
    - Raw prompts, completions, credentials, flags, and proof bodies are not objective evidence.
  kep-m10-i-proof:
    description: Capture digest-safe participant-scoped evidence for Cost Amplification.
    source_refs: *id003
    source_class: scenario_native_observability
    scope_refs:
    - core.participant
    scope: range instance and participant namespace
    window: current participant attempt and reset generation
    boundary_kind: objective_verdict
    channel: api_response
    channel_refs:
    - nodes.core.telemetry-proof-01.services.proof-api
    artifact_role: digest_safe_objective_receipt
    media_types:
    - application/json
    sensitivity: redacted
    redaction: redact_secrets
    integrity: timestamped
    retention: study_lifetime
    loss_disclosure: required
    notes:
    - 'Challenge: kep-m10-i'
    - 'Proof obligation: cost_amplification'
    - Raw prompts, completions, credentials, flags, and proof bodies are not objective evidence.
objectives:
  kep-m10-h:
    name: Service Denial
    description: Deny the AI service to the synthetic user cohort through the attack surface while
      staying inside the bounded range budget.
    agent: core.participant
    targets: *id003
    success:
      assertions:
      - kep-m10-h-satisfied
    depends_on:
    - m10.kep-m10-b
  kep-m10-i:
    name: Cost Amplification
    description: Demonstrate both excessive-query and resource-intensive-query paths crossing the
      synthetic cost threshold.
    agent: core.participant
    targets: *id003
    success:
      assertions:
      - kep-m10-i-satisfied
    depends_on:
    - m10xa.kep-m10-h
