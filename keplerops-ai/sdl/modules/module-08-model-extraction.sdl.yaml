    - resource-development
    - exfiltration
    extension_policy: governed-extension
    extensions:
      x-keplerops:challenge:
        challenge_id: kep-m08-a
        flag_id: flag-teacher-corpus
        module: module-08-model-extraction
        outcome: model-extraction
        title: Teacher Queries
        difficulty: accessible
        target_minutes: 10
        min_minutes: 6
        max_minutes: 15
        points: 50
        disposition: new-design
        prerequisites:
        - kep-m04-a
        interfaces:
        - curl
        - python
        - notebook
        hint_costs:
        - 0
        - 0
        - 10
        proof_obligation: participant-corpus-within-query-budget
        telemetry_profile: model-extraction-corpus
        reliability: pre-playtest-one-pass
        implementation_status: participant-proven
        live_fire: true
        participant_copy:
          category: Model Extraction
          question: Collect a participant-attributed corpus of real teacher classifications without
            exceeding the disclosed 24-query budget.
          hints:
          - Query the extraction teacher with both safe and unsafe release proposals; the server
            owns the budget and labels.
          - Four distinct queries spanning both returned labels are enough for this first
            checkpoint.
          - Submit the returned corpus id to the extraction attempt endpoint, then request the
            corpus receipt.
        flag_delivery:
          evidence_id: ev-teacher-corpus
          source: instructions
          instructions: ctfd/oracle-receipt-contract.md
          profiles:
          - gcp_full
          delivery:
            kind: workflow_receipt
            asset: telemetry-proof-01
            service: proof-api
            reset_owner: dataset-store-01
        proof:
          evidence_id: ev-teacher-corpus
          kind: objective_stage
          predicate: Server-held PostgreSQL evidence confirms the authenticated participant spent a
            bounded teacher-query budget and created a fresh corpus whose count and digest derive
            from real teacher responses.
          proof_fields: &extraction_proof_fields
          - actor_role
          - asset_id
          - event_kind
          - object_id
          - outcome_id
          - record_count
          - workflow_id
          - range_instance
          - participant
          - timestamp
          - status
          - digest
          reset_owner: dataset-store-01
          mutates_scenario_state: false
          event:
            id: event-teacher-corpus
            evidence: ev-teacher-corpus
            event_kind: teacher_corpus_collected
            source_service: inference-api
            source_asset: inference-gateway
            fields: *extraction_proof_fields
            freshness_seconds: 10800
            reset_owner: dataset-store-01
        implementation_evidence:
          primary_atlas_techniques:
          - AML.T0005.001
          manual_walkthrough: docs/walkthroughs/module-08-model-extraction.md
          automated_test: tests/module_08_rehearsal.py
        objective_ref: m08.kep-m08-a
        evidence_requirement_ref: m08.kep-m08-a-proof
