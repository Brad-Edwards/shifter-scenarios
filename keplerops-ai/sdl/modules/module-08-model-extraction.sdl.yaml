        participant_copy:
          category: Model Extraction
          question: Build a teacher corpus with all four disclosed integrity and governance behavior
            slices, both labels, and sufficient lexical diversity.
          hints:
          - Include varied signed and unsigned integrity proposals plus reviewed and unreviewed
            governance proposals.
          - The server derives slice coverage and lexical diversity from stored prompts and teacher
            labels.
          - Eight distinct queries are sufficient when all four slices appear; submitted counts and
            digests are ignored.
        flag_delivery:
          evidence_id: ev-corpus-coverage
