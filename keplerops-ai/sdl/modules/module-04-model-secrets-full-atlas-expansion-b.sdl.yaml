        challenge_id: kep-m04-j
        flag_id: flag-agent-knowledge-map
        module: module-04-model-secrets
        outcome: model-secrets
        title: Agent Knowledge Map
        difficulty: accessible
        target_minutes: 16
        min_minutes: 7
        max_minutes: 24
        points: 50
        disposition: full-atlas-expansion
        prerequisites: []
        interfaces:
        - browser
        - curl
        - python
        - notebook
        hint_costs:
        - 0
        - 0
        - 10
        proof_obligation: agent_knowledge_map
        telemetry_profile: agent_knowledge_map
        reliability: pre-playtest-one-pass
        implementation_status: participant-proven
        live_fire: true
        participant_copy:
          category: Model Discovery and Privacy
          question: Discover one hidden embedded-knowledge item and the exact schema digest of a
            non-advertised agent tool through interaction.
          hints:
          - Probe for agent knowledge and tool behavior through the expansion probe endpoint.
          - The receipt uses current configuration digests, not participant documentation.
          - Submit both the knowledge digest and tool-schema digest from the server response.
        flag_delivery:
          evidence_id: ev-agent-knowledge-map
          source: instructions
          instructions: ctfd/oracle-receipt-contract.md
          profiles:
          - gcp_full
          delivery:
            kind: workflow_receipt
            asset: telemetry-proof-01
            service: proof-api
            reset_owner: dataset-store-01
        proof:
          evidence_id: ev-agent-knowledge-map
          kind: model_secret_expansion
          predicate: Require interaction-derived knowledge and tool-schema digests from current
            configuration; docs pages and guessed schemas fail.
          proof_fields:
          - actor_role
          - asset_id
          - event_kind
          - object_id
          - outcome_id
          - record_count
          - stage
          - range_instance
          - participant
          - timestamp
          - status
          - digest
          reset_owner: dataset-store-01
          mutates_scenario_state: true
          event:
            id: event-agent-knowledge-map
            evidence: ev-agent-knowledge-map
            event_kind: agent_knowledge_map_04
            source_service: inference-api
            source_asset: inference-gateway
            fields:
            - actor_role
            - asset_id
            - event_kind
            - object_id
            - outcome_id
            - record_count
            - stage
            - range_instance
            - participant
            - timestamp
            - status
            - digest
            freshness_seconds: 10800
            reset_owner: dataset-store-01
        implementation_evidence:
          source_commit: pending
          automated_test: tests/module_04_full_atlas_rehearsal.py
          manual_walkthrough: docs/walkthroughs/module-04-full-atlas-expansion.md
          primary_atlas_techniques:
          - AML.T0084.000
          - AML.T0084.001
          assurance: source-implemented-pre-playtest
        objective_ref: m04xb.kep-m04-j
        evidence_requirement_ref: m04xb.kep-m04-j-proof
