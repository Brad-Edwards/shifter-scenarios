name: keplerops-module-03-full-atlas-expansion-b
version: 1.0.0
module:
  id: shifter/keplerops-module-03-full-atlas-expansion-b
  version: 1.0.0
  exports:
    behavior_specifications:
    - kep-m03-j
    - kep-m03-k
    conditions:
    - kep-m03-j-complete
    - kep-m03-k-complete
    propositions:
    - kep-m03-j-satisfied
    - kep-m03-k-satisfied
    assertions:
    - kep-m03-j-satisfied
    - kep-m03-k-satisfied
    evidence_requirements:
    - kep-m03-j-proof
    - kep-m03-k-proof
    objectives:
    - kep-m03-j
    - kep-m03-k
  description: Source implementation contracts for Module 03 full-ATLAS self-replication and
    delayed-trigger expansion.
behavior_specifications:
  kep-m03-j:
    semantic_version: 1.0.0
    lifecycle_state: draft
    participant_refs:
    - core.participant
    authority_scope_refs:
    - nodes.core.lab-portal.services.lab-portal-https
    - nodes.core.inference-gateway.services.inference-api
    - nodes.core.repo-ticket-01.services.workhub-https
    - nodes.core.repo-ticket-01.services.platform-context-api
    - nodes.core.dataset-store-01.services.dataset-postgres
    - nodes.core.telemetry-proof-01.services.proof-api
    - content.core.retrieval-knowledge-base
    - content.core.context-embedding-model
    ai_offensive_behavior_refs:
    - initial-access
    - persistence
    - collection
    - credential-access
    extension_policy: governed-extension
    extensions:
      x-keplerops:challenge:
        challenge_id: kep-m03-j
        flag_id: flag-self-replicating-prompt
        module: module-03-context-poisoning
        outcome: context-poisoning
        title: Self-Replicating Prompt
        difficulty: advanced
        target_minutes: 28
        min_minutes: 18
        max_minutes: 42
        points: 200
        disposition: full-atlas-expansion
        prerequisites:
        - kep-m03-a
        interfaces:
        - browser
        - curl
        - python
        hint_costs:
        - 0
        - 20
        - 50
        proof_obligation: self_replicating_prompt
        telemetry_profile: self_replicating_prompt
        reliability: pre-playtest-one-pass
        implementation_status: participant-proven
        live_fire: true
        participant_copy:
          category: Data and Retrieval
          question: Plant an instruction that the live model reproduces into a second indexed object
            and influences a later clean retrieval session.
          hints:
          - Start by creating a participant document containing the replication marker and desired
            later behavior.
          - The replica must be model-authored by the gateway, not a second participant-authored
            copy.
          - A clean retrieval session must see the model-authored replica before the proof is
            accepted.
        flag_delivery:
          evidence_id: ev-self-replicating-prompt
          source: instructions
          instructions: ctfd/oracle-receipt-contract.md
          profiles:
          - gcp_full
          delivery:
            kind: workflow_receipt
            asset: telemetry-proof-01
            service: proof-api
            reset_owner: dataset-store-01
        proof:
          evidence_id: ev-self-replicating-prompt
          kind: context_expansion
          predicate: Correlate participant source digest, model-authored replica digest, replica
            ingestion, and later clean-session retrieval effect; participant-authored copies fail.
          proof_fields:
          - actor_role
          - asset_id
          - event_kind
          - object_id
          - outcome_id
          - record_count
          - workflow_id
          - range_instance
          - participant
          - timestamp
          - status
          - digest
          reset_owner: dataset-store-01
          mutates_scenario_state: true
          event:
            id: event-self-replicating-prompt
            evidence: ev-self-replicating-prompt
            event_kind: self_replicating_prompt
            source_service: inference-api
            source_asset: inference-gateway
            fields:
            - actor_role
            - asset_id
            - event_kind
            - object_id
            - outcome_id
            - record_count
            - workflow_id
            - range_instance
            - participant
            - timestamp
            - status
            - digest
            freshness_seconds: 10800
            reset_owner: dataset-store-01
        implementation_evidence:
          source_commit: pending
          automated_test: tests/module_03_full_atlas_rehearsal.py
          manual_walkthrough: docs/walkthroughs/module-03-full-atlas-expansion.md
          primary_atlas_techniques:
          - AML.T0061
          assurance: source-implemented-pre-playtest
        objective_ref: m03xb.kep-m03-j
        evidence_requirement_ref: m03xb.kep-m03-j-proof
  kep-m03-k:
    semantic_version: 1.0.0
    lifecycle_state: draft
    participant_refs:
    - core.participant
    authority_scope_refs:
    - nodes.core.lab-portal.services.lab-portal-https
    - nodes.core.inference-gateway.services.inference-api
    - nodes.core.repo-ticket-01.services.workhub-https
    - nodes.core.repo-ticket-01.services.platform-context-api
    - nodes.core.dataset-store-01.services.dataset-postgres
    - nodes.core.telemetry-proof-01.services.proof-api
    - content.core.retrieval-knowledge-base
    - content.core.context-embedding-model
    ai_offensive_behavior_refs:
    - initial-access
    - persistence
    - collection
    - credential-access
    extension_policy: governed-extension
    extensions:
      x-keplerops:challenge:
        challenge_id: kep-m03-k
        flag_id: flag-delayed-conversation-trigger
        module: module-03-context-poisoning
        outcome: context-poisoning
        title: Delayed Conversation Trigger
        difficulty: intermediate
        target_minutes: 18
        min_minutes: 11
        max_minutes: 28
        points: 100
        disposition: full-atlas-expansion
        prerequisites:
        - kep-m03-c
        interfaces:
        - browser
        - curl
        - python
        hint_costs:
        - 0
        - 10
        - 25
        proof_obligation: delayed_conversation_trigger
        telemetry_profile: delayed_conversation_trigger
        reliability: pre-playtest-one-pass
        implementation_status: participant-proven
        live_fire: true
        participant_copy:
          category: Data and Retrieval
          question: Mutate conversation history with a dormant instruction, survive one clean turn,
            then activate it with a later trigger turn.
          hints:
          - Prepare the conversation first; same-turn trigger attempts are deliberately rejected.
          - The clean turn must complete without executing the delayed action.
          - The trigger proof binds the prepared history and the later model-mediated broker effect.
        flag_delivery:
          evidence_id: ev-delayed-conversation-trigger
          source: instructions
          instructions: ctfd/oracle-receipt-contract.md
          profiles:
          - gcp_full
          delivery:
            kind: workflow_receipt
            asset: telemetry-proof-01
            service: proof-api
            reset_owner: dataset-store-01
        proof:
          evidence_id: ev-delayed-conversation-trigger
          kind: context_expansion
          predicate: Bind history mutation, intervening clean turn, later trigger turn, and
            broker-visible delayed action; same-turn execution fails.
          proof_fields:
          - actor_role
          - asset_id
          - event_kind
          - object_id
          - outcome_id
          - record_count
          - workflow_id
          - range_instance
          - participant
          - timestamp
          - status
          - digest
          reset_owner: dataset-store-01
          mutates_scenario_state: true
          event:
            id: event-delayed-conversation-trigger
            evidence: ev-delayed-conversation-trigger
            event_kind: delayed_conversation_trigger
            source_service: inference-api
            source_asset: inference-gateway
            fields:
            - actor_role
            - asset_id
            - event_kind
            - object_id
            - outcome_id
            - record_count
            - workflow_id
            - range_instance
            - participant
            - timestamp
            - status
            - digest
            freshness_seconds: 10800
            reset_owner: dataset-store-01
        implementation_evidence:
          source_commit: pending
          automated_test: tests/module_03_full_atlas_rehearsal.py
          manual_walkthrough: docs/walkthroughs/module-03-full-atlas-expansion.md
          primary_atlas_techniques:
          - AML.T0092
          - AML.T0094
          assurance: source-implemented-pre-playtest
        objective_ref: m03xb.kep-m03-k
        evidence_requirement_ref: m03xb.kep-m03-k-proof
conditions:
  kep-m03-j-complete:
    name: Self-Replicating Prompt evidence accepted
    proposition: kep-m03-j-satisfied
    source:
      name: participant-evidence
      version: '1'
    description: The proof service accepted fresh participant-scoped evidence for this challenge.
  kep-m03-k-complete:
    name: Delayed Conversation Trigger evidence accepted
    proposition: kep-m03-k-satisfied
    source:
      name: participant-evidence
      version: '1'
    description: The proof service accepted fresh participant-scoped evidence for this challenge.
