    ai_offensive_behavior_refs:
    - execution
    - persistence
    - privilege-escalation
    - credential-access
    - command-and-control
    - lateral-movement
    extension_policy: governed-extension
    extensions:
      x-keplerops:challenge:
        challenge_id: kep-m05-f
        flag_id: flag-public-agent-blueprint
        module: module-05-agent-persistence
        outcome: agent-persistence
        title: Public Agent Blueprint
        difficulty: accessible
        target_minutes: 10
        min_minutes: 6
        max_minutes: 16
        points: 50
        disposition: full-atlas-expansion
        prerequisites: []
        interfaces:
        - browser
        - curl
        - python
        hint_costs:
        - 0
        - 0
        - 10
        proof_obligation: public_agent_blueprint
        telemetry_profile: public_agent_blueprint
        reliability: pre-playtest-one-pass
        implementation_status: participant-proven
        live_fire: true
        participant_copy:
          category: Agent State and Identity
          question: Acquire the published agent blueprint and validate that it matches the live
            range agent revision.
          hints:
          - Use the persistence expansion action endpoint for the public blueprint.
          - The returned digest is tied to the live platform-agent identity.
          - Local copies are rejected unless they match the current range revision.
        flag_delivery:
          evidence_id: ev-public-agent-blueprint
          source: instructions
          instructions: ctfd/oracle-receipt-contract.md
          profiles:
          - gcp_full
          delivery:
            kind: workflow_receipt
            asset: telemetry-proof-01
            service: proof-api
            reset_owner: platform-agent-01
        proof:
          evidence_id: ev-public-agent-blueprint
          kind: agent_persistence_expansion
          predicate: Require registry download, blueprint digest, and live revision match; supplied
            local copies fail.
          proof_fields:
          - actor_role
          - asset_id
          - event_kind
          - object_id
          - outcome_id
          - record_count
          - stage
          - range_instance
          - participant
          - timestamp
          - status
          - digest
          reset_owner: platform-agent-01
          mutates_scenario_state: true
          event:
            id: event-public-agent-blueprint
            evidence: ev-public-agent-blueprint
            event_kind: public_agent_blueprint_05
            source_service: inference-api
            source_asset: inference-gateway
            fields:
            - actor_role
            - asset_id
            - event_kind
            - object_id
            - outcome_id
            - record_count
            - stage
            - range_instance
            - participant
            - timestamp
            - status
            - digest
            freshness_seconds: 10800
            reset_owner: platform-agent-01
        implementation_evidence:
          source_commit: pending
          automated_test: tests/module_05_full_atlas_rehearsal.py
          manual_walkthrough: docs/walkthroughs/module-05-full-atlas-expansion.md
          primary_atlas_techniques:
          - AML.T0002.002
          assurance: source-implemented-pre-playtest
        objective_ref: m05xa.kep-m05-f
        evidence_requirement_ref: m05xa.kep-m05-f-proof
