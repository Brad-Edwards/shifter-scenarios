content_safety:
  no_real_malware: true
  no_real_third_party_targets: true
  no_real_credentials: true
  no_sensitive_data: true
  offensive_tooling_boundary: true
  notes: "Build source contains only synthetic datasets and credentials plus revision- and digest-pinned Apache-2.0 generative and embedding model supply contracts, a version-pinned BSD-3-Clause privacy-classifier library, and a digest-pinned PostgreSQL/pgvector image. Model bytes are verified during the operator image-build phase and are not committed. No private weights, provider logs, real prompts, customer data, live tenant details, public callback infrastructure, malware, exploit kits, or destructive payloads are included. Participant actions terminate on range-controlled services."

review:
  status: pending
  gates:
    - gate_id: licensing
      status: pending
      notes: "AISF page referenced only; MITRE ATLAS data is Apache-2.0; pack content is Palo Alto Networks proprietary."
    - gate_id: attribution
      status: pending
      notes: "MITRE ATLAS attribution recorded; AISF topic framing does not copy event content."
    - gate_id: sensitive-data
      status: pending
      notes: "No real sensitive data, prompts, private model weights, provider logs, customer data, credentials, or tenant details are included; all committed credentials and datasets are synthetic training content."
    - gate_id: offensive-tooling
      status: pending
      notes: "No real malware or exploit kits are included; build networking denies participant internet egress and targets only range-local services."
    - gate_id: customer-overlay
      status: not-applicable
      notes: "No customer overlays in this skeleton."
