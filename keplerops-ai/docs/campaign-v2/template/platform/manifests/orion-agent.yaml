apiVersion: v1
kind: ServiceAccount
metadata:
  name: orion-agent
  namespace: orion-platform
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orion-agent
  namespace: orion-platform
  labels:
    app.kubernetes.io/name: orion-agent
    app.kubernetes.io/part-of: keplerops-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: orion-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: orion-agent
    spec:
      serviceAccountName: orion-agent
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      hostAliases:
        - ip: "192.168.78.1"
          hostnames: ["support.keplerops.lab"]
      containers:
        - name: agent
          image: keplerops/orion-agent:0.1.0
          imagePullPolicy: IfNotPresent
          env:
            - {name: LITELLM_URL, value: http://litellm.orion-platform.svc:4000}
            - {name: ORION_ASSISTANT_MODEL, value: orion-assistant}
            - {name: OTLP_HTTP_URL, value: http://192.168.78.1:4318}
            - {name: ORION_TOOL_ROUTING_POLICY_FILE, value: /etc/orion/policy/tool-routing-policy.txt}
            - {name: ZAMMAD_URL, value: https://support.keplerops.lab}
            - {name: ZAMMAD_HOST, value: support.keplerops.lab}
            - {name: ZAMMAD_TLS_VERIFY, value: "false"}
            - name: ORION_ASSISTANT_RELEASE_ID
              valueFrom:
                secretKeyRef: {name: orion-agent-runtime, key: ORION_ASSISTANT_RELEASE_ID}
            - name: ORION_ASSISTANT_MODEL_DIGEST
              valueFrom:
                secretKeyRef: {name: orion-agent-runtime, key: ORION_ASSISTANT_MODEL_DIGEST}
            - name: LITELLM_MASTER_KEY
              valueFrom:
                secretKeyRef: {name: litellm-runtime, key: LITELLM_MASTER_KEY}
          envFrom:
            - secretRef: {name: orion-agent-runtime}
          ports:
            - {name: http, containerPort: 8080}
          readinessProbe:
            httpGet: {path: /health/ready, port: http}
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /health/live, port: http}
            initialDelaySeconds: 15
            periodSeconds: 15
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: 500m, memory: 512Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
            readOnlyRootFilesystem: true
            runAsUser: 65532
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
            - {name: prompt-policy, mountPath: /etc/orion/policy, readOnly: true}
      volumes:
        - name: tmp
          emptyDir: {}
        - name: prompt-policy
          configMap:
            name: orion-agent-prompt-policy
            optional: true
---
apiVersion: v1
kind: Service
metadata:
  name: orion-agent
  namespace: orion-platform
  labels:
    app.kubernetes.io/name: orion-agent
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: orion-agent
  ports:
    - {name: http, port: 8080, targetPort: http, nodePort: 30081}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orion-mcp
  namespace: orion-platform
  labels:
    app.kubernetes.io/name: orion-mcp
    app.kubernetes.io/part-of: keplerops-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: orion-mcp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: orion-mcp
    spec:
      serviceAccountName: orion-agent
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: mcp
          image: keplerops/orion-agent:0.1.0
          imagePullPolicy: IfNotPresent
          command: ["python", "/app/mcp_service.py"]
          env:
            - {name: AGENT_URL, value: http://orion-agent.orion-platform.svc:8080}
          envFrom:
            - secretRef: {name: orion-agent-runtime}
          ports:
            - {name: mcp, containerPort: 8081}
          readinessProbe:
            tcpSocket: {port: mcp}
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket: {port: mcp}
            initialDelaySeconds: 15
            periodSeconds: 15
          resources:
            requests: {cpu: 25m, memory: 96Mi}
            limits: {cpu: 300m, memory: 384Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
            readOnlyRootFilesystem: true
            runAsUser: 65532
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: orion-mcp
  namespace: orion-platform
  labels:
    app.kubernetes.io/name: orion-mcp
spec:
  selector:
    app.kubernetes.io/name: orion-mcp
  ports:
    - {name: mcp, port: 8081, targetPort: mcp}
