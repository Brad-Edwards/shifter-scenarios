apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: platform-ingress-boundary
  namespace: orion-platform
  labels:
    app.kubernetes.io/part-of: keplerops-platform
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: orion-platform
        - ipBlock:
            cidr: 192.168.78.1/32
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: runtime-ingress-boundary
  namespace: orion-runtime
  labels:
    app.kubernetes.io/part-of: keplerops-platform
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: orion-runtime
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: orion-platform
        - ipBlock:
            cidr: 192.168.78.1/32
