apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: orion-platform
  labels:
    app.kubernetes.io/part-of: keplerops-platform
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns
  namespace: orion-platform
  labels:
    app.kubernetes.io/part-of: keplerops-platform
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: orion-agent-ingress
  namespace: orion-platform
  labels:
    app.kubernetes.io/part-of: keplerops-platform
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: orion-agent
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: orion-mcp
        - ipBlock:
            cidr: 192.168.78.1/32
      ports:
        - {protocol: TCP, port: 8080}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: orion-agent-egress
  namespace: orion-platform
  labels:
    app.kubernetes.io/part-of: keplerops-platform
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: orion-agent
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: litellm
      ports:
        - {protocol: TCP, port: 4000}
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: opa
      ports:
        - {protocol: TCP, port: 8181}
    - to:
        - ipBlock:
            cidr: 192.168.78.1/32
      ports:
        - {protocol: TCP, port: 25}
        - {protocol: TCP, port: 443}
        - {protocol: TCP, port: 3000}
        - {protocol: TCP, port: 4318}
        - {protocol: TCP, port: 13000}
        - {protocol: TCP, port: 16333}
    - to:
        - ipBlock:
            cidr: 10.61.0.0/16
      ports:
        - {protocol: TCP, port: 25}
        - {protocol: TCP, port: 80}
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: orion-mcp
      ports:
        - {protocol: TCP, port: 8081}
    - to:
        - ipBlock:
            cidr: 192.168.78.1/32
      ports:
        - {protocol: TCP, port: 16333}
    - to:
        - ipBlock:
            cidr: 192.168.78.1/32
      ports:
        - {protocol: TCP, port: 16379}
    - to:
        - ipBlock:
            cidr: 192.168.78.1/32
      ports:
        - {protocol: TCP, port: 4318}
---
