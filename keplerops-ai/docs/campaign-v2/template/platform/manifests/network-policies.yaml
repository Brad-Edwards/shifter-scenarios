apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: vertex-openai-proxy-ingress
  namespace: orion-platform
  labels:
    app.kubernetes.io/part-of: keplerops-platform
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: vertex-openai-proxy
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: litellm
        - ipBlock:
            cidr: 192.168.78.1/32
      ports:
