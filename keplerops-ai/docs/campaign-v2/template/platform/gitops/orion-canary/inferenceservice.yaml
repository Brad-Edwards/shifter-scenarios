apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: orion-release-risk
  namespace: orion-runtime
  annotations:
    serving.kserve.io/deploymentMode: RawDeployment
spec:
  predictor:
    minReplicas: 1
    maxReplicas: 1
    containers:
      - name: kserve-container
        image: keplerops/orion-placeholder:0.1.0
        imagePullPolicy: IfNotPresent
        ports:
          - {name: http1, containerPort: 8080, protocol: TCP}
        env:
          - {name: MODEL_NAME, value: orion-release-risk}
          - {name: MODEL_PATH, value: /models/orion-placeholder.onnx}
        readinessProbe:
          httpGet: {path: /health/ready, port: http1}
          initialDelaySeconds: 2
          periodSeconds: 5
        livenessProbe:
          httpGet: {path: /health/live, port: http1}
          initialDelaySeconds: 10
          periodSeconds: 10
        resources:
          requests: {cpu: 100m, memory: 192Mi}
          limits: {cpu: "1", memory: 768Mi}
        securityContext:
          allowPrivilegeEscalation: false
          capabilities: {drop: [ALL]}
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 65532
          seccompProfile: {type: RuntimeDefault}
        volumeMounts:
          - {name: tmp, mountPath: /tmp}
    volumes:
      - name: tmp
        emptyDir: {}
