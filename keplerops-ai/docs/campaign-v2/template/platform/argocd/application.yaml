apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: orion-canary
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: keplerops-platform
spec:
  project: orion-platform
  source:
    repoURL: __REPO_URL__
    targetRevision: __REVISION__
    path: __REPO_PATH__
  destination:
    server: https://kubernetes.default.svc
    namespace: orion-runtime
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
      - PruneLast=true
      - RespectIgnoreDifferences=true
