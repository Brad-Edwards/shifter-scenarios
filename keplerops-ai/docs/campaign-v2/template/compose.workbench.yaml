name: keplerops-v2

services:
  participant-workstation:
    image: ${CINDER_WORKSTATION_IMAGE}
    build:
      context: .
      dockerfile: workstation/Dockerfile
      args:
        KALI_WORKSTATION_IMAGE: ${KALI_WORKSTATION_IMAGE}
        MINIO_CLIENT_IMAGE: ${MINIO_CLIENT_IMAGE}
        OPENCODE_BUILDER_IMAGE: ${OPENCODE_BUILDER_IMAGE}
        OPENCODE_VERSION: ${OPENCODE_VERSION}
    container_name: keplerops-participant-workstation-runtime
    hostname: kali01
    user: "0"
    entrypoint: ["/usr/local/bin/keplerops-kasm-startup"]
    restart: unless-stopped
    shm_size: 2gb
    # Chromium's namespace sandbox needs clone(CLONE_NEWUSER), which Docker's
    # default seccomp profile blocks even when the host enables user namespaces.
    security_opt:
      - seccomp=unconfined
    environment:
      KEPLEROPS_RANGE_INSTANCE: campaign-v2-template
      KEPLEROPS_PARTICIPANT: cinder-operator
      VNC_RESOLUTION: 1600x900
      MAX_FRAME_RATE: "30"
      VNCOPTIONS: -PreferBandwidth -DynamicQualityMin=4 -DynamicQualityMax=8 -DLP_ClipDelay=0
      SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
      OPENCODE_CONFIG: /etc/opencode/opencode.json
    ports:
      - "3389:3389"
      - "443:6901"
    dns:
      - 10.61.10.11
    volumes:
      - workstation-home:/home/kasm-user
      - ./content/workstation/MISSION.md:/home/kasm-user/Desktop/MISSION.md:ro
      - ./config/chromium/keplerops-policy.json:/etc/chromium/policies/managed/keplerops-policy.json:ro
      - ./config/chromium/keplerops-container-sandbox:/etc/chromium.d/keplerops-container-sandbox:ro
      - ./state/workstation/participant-password:/run/keplerops/participant-password:ro
      - ./state/workstation/tls:/run/tls:ro
      - ./state/workstation/caddy-root.crt:/usr/local/share/ca-certificates/keplerops-range-root.crt:ro
      - ./state/workstation/reset-generation:/run/keplerops/reset-generation:ro
      - ./state/workstation/producer-token:/run/keplerops/producer-token:ro
    networks:
      public:
        ipv4_address: 10.61.10.250
      cinder:
        ipv4_address: 10.61.90.250
    labels:
      io.keplerops.scenario: keplerops-ai
      io.keplerops.campaign: v2
      io.keplerops.layer: attacker-workbench

networks:
  public:
    external: true
    name: kep-v2-public
  cinder:
    external: true
    name: kep-v2-cinder

volumes:
  workstation-home:
