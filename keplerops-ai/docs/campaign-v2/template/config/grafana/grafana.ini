[server]
root_url = https://grafana.keplerops.lab/

[users]
allow_sign_up = false

[auth.generic_oauth]
enabled = true
name = KeplerOps SSO
allow_sign_up = true
client_id = grafana
client_secret = KeplerV2-Training-Grafana-OIDC
scopes = openid profile email offline_access
auth_url = https://id.keplerops.lab/realms/keplerops/protocol/openid-connect/auth
token_url = https://id.keplerops.lab/realms/keplerops/protocol/openid-connect/token
api_url = https://id.keplerops.lab/realms/keplerops/protocol/openid-connect/userinfo
use_pkce = true
use_refresh_token = true
login_attribute_path = preferred_username
name_attribute_path = name
email_attribute_path = join('', [preferred_username, '@keplerops.lab'])
groups_attribute_path = groups
allowed_groups = GG-Platform-Operators GG-Security-Auditors
role_attribute_path = contains(groups[*], 'GG-Platform-Operators') && 'Editor' || contains(groups[*], 'GG-Security-Auditors') && 'Viewer'
role_attribute_strict = true
skip_org_role_sync = false
allow_assign_grafana_admin = false
tls_client_ca = /etc/ssl/certs/keplerops-range-root.crt
signout_redirect_url = https://id.keplerops.lab/realms/keplerops/protocol/openid-connect/logout?post_logout_redirect_uri=https%3A%2F%2Fgrafana.keplerops.lab%2Flogin
