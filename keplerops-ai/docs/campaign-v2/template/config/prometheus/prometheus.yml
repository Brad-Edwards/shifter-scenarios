global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["127.0.0.1:9090"]
  - job_name: keycloak
    metrics_path: /metrics
    static_configs:
      - targets: ["10.61.20.20:9000"]
  - job_name: rabbitmq
    static_configs:
      - targets: ["10.61.50.12:15692"]
  - job_name: opensearch
    metrics_path: /_prometheus/metrics
    static_configs:
      - targets: ["10.61.80.14:9200"]

