name: Verify merged Orion MCP adoption
on:
  push:
    branches: [main]
    paths: [package.json, package-lock.json]
jobs:
  adopt:
    runs-on: orion-release-linux
    steps:
      - uses: actions/checkout@v4
      - name: Verify source, signature, tests, and installed digest
        shell: bash
        env:
          ADOPTION_NOTE: ${{ secrets.ADOPTION_NOTE }}
        run: |
          set -euo pipefail
          registry=http://10.61.40.31:4873
          auth=$(printf '%s:%s' "$VERDACCIO_USER" "$VERDACCIO_PASSWORD" | base64 -w0)
          npm config set registry "$registry"
          npm config set //10.61.40.31:4873/:_auth "$auth"
          npm config set //10.61.40.31:4873/:always-auth true
          npm ci --ignore-scripts
          version=$(node -p "require('./node_modules/@keplerops/orion-mcp-audit/package.json').version")
          integrity=$(node -p "require('./package-lock.json').packages['node_modules/@keplerops/orion-mcp-audit'].integrity")
          source_pr=$(node -p "require('./node_modules/@keplerops/orion-mcp-audit/package.json').kepleropsSourcePullRequest")
          npm test --prefix node_modules/@keplerops/orion-mcp-audit
          if node scripts/probe-successor.mjs "$GITHUB_WORKSPACE/node_modules/@keplerops/orion-mcp-audit" /tmp/unexpected-callback.json; then
            echo 'The first adopted release emitted a private-field callback' >&2
            exit 1
          fi
          curl -fsS -u cinder-operator:Cinder-Operations-Git-K3m7Pq4x \
            "http://10.61.90.30:3000/api/v1/repos/cinder-operator/orion-mcp-audit/pulls/$source_pr" > /tmp/source-pr.json
          test "$(jq -r .merged /tmp/source-pr.json)" = true
          test "$(jq -r .user.login /tmp/source-pr.json)" = cinder-participant
          test "$(jq -r .merged_by.login /tmp/source-pr.json)" = cinder-operator
          source_head=$(jq -r .head.sha /tmp/source-pr.json)
          merge_commit=$(jq -r .merge_commit_sha /tmp/source-pr.json)
          curl -fsS -u cinder-operator:Cinder-Operations-Git-K3m7Pq4x \
            "http://10.61.90.30:3000/api/v1/repos/cinder-operator/orion-mcp-audit/git/commits/$source_head" > /tmp/source-commit.json
          test "$(jq -r '.author.login // empty' /tmp/source-commit.json)" = cinder-participant
          curl -fsS -u cinder-operator:Cinder-Operations-Git-K3m7Pq4x \
            "http://10.61.90.30:3000/api/v1/repos/cinder-operator/orion-mcp-audit/raw/test/spdx.test.js?ref=$merge_commit" > /tmp/spdx.test.js
          test "$(sha256sum /tmp/spdx.test.js | cut -d' ' -f1)" = 07f6147dba49a913ca2de5b43220ae7c19cbb817e0d60a5868c7d157333adada
          mkdir -p /tmp/release reports
          cd /tmp/release
          tarball=$(npm pack "@keplerops/orion-mcp-audit@$version" --silent)
          curl -fsS -u cinder-operator:Cinder-Operations-Git-K3m7Pq4x \
            "http://10.61.90.30:3000/api/v1/repos/cinder-operator/orion-mcp-audit/releases/tags/v$version" > release.json
          asset=$(jq -r --arg name "$tarball.sig" '.assets[] | select(.name == $name) | .browser_download_url' release.json)
          curl -fsS -u cinder-operator:Cinder-Operations-Git-K3m7Pq4x "$asset" -o "$tarball.sig"
          openssl dgst -sha256 -verify "$GITHUB_WORKSPACE/keys/cinder-maintainer-release.pem" -signature "$tarball.sig" "$tarball"
          tar_sha=$(sha256sum "$tarball" | cut -d' ' -f1)
          installed_sha=$(find "$GITHUB_WORKSPACE/node_modules/@keplerops/orion-mcp-audit" -type f -print0 | sort -z | xargs -0 sha256sum | sha256sum | cut -d' ' -f1)
          cd "$GITHUB_WORKSPACE"
          if [ ! -f adoption/manifest.json ]; then
            jq -n --arg version "$version" --arg integrity "$integrity" --arg tar "$tar_sha" --arg installed "$installed_sha" \
              --argjson source_pr "$source_pr" --arg head "$source_head" --arg merge "$merge_commit" \
              --arg source_author cinder-participant --arg maintainer cinder-operator --arg note "$ADOPTION_NOTE" \
              --arg completed "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              '{schema:"keplerops.mcp-adoption/v1",package:"@keplerops/orion-mcp-audit",version:$version,source_pull_request:$source_pr,source_head_commit:$head,source_author:$source_author,maintainer_actor:$maintainer,source_merge_commit:$merge,signature_status:"verified",tests:"passed",private_callback:"absent",tarball_sha256:$tar,installed_integrity:$integrity,installed_tree_sha256:$installed,adoption_note:$note,completed_at:$completed}' \
              > adoption/manifest.json
            git config user.name 'KeplerOps staging consumer'
            git config user.email 'staging-consumer@keplerops.lab'
            git add adoption/manifest.json
            git commit -m "Record adopted Orion MCP release $version"
            git push "http://$FORGEJO_CI_USER:$FORGEJO_CI_PASSWORD@10.61.40.20:3000/keplerops/orion-agent-tool-consumer.git" HEAD:main
          fi
          cp adoption/manifest.json reports/adoption.json
      - uses: actions/upload-artifact@v3
        with: {name: adoption-manifest, path: reports/adoption.json}
