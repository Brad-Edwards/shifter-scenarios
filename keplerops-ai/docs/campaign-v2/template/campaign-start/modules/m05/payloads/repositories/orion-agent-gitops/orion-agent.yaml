apiVersion: apps/v1
kind: Deployment
metadata:
  name: orion-agent
  namespace: orion-platform
  annotations:
    keplerops.lab/source-commit: baseline
    keplerops.lab/config-digest: sha256:__CONFIG_DIGEST__
  labels: {app.kubernetes.io/name: orion-agent, app.kubernetes.io/part-of: keplerops-platform}
spec:
  replicas: 1
  selector: {matchLabels: {app.kubernetes.io/name: orion-agent}}
  template:
    metadata:
      labels: {app.kubernetes.io/name: orion-agent}
      annotations:
        keplerops.lab/source-commit: baseline
        keplerops.lab/config-digest: sha256:__CONFIG_DIGEST__
    spec:
      serviceAccountName: orion-agent
      imagePullSecrets: [{name: harbor-orion-pull}]
      securityContext: {runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: agent
          image: registry.keplerops.lab/orion-internal/orion-agent-config@sha256:__AGENT_DIGEST__
          imagePullPolicy: IfNotPresent
          env:
            - {name: LITELLM_URL, value: http://litellm.orion-platform.svc:4000}
            - {name: ORION_ASSISTANT_MODEL, value: orion-assistant}
            - name: LITELLM_MASTER_KEY
              valueFrom:
                secretKeyRef: {name: litellm-runtime, key: LITELLM_MASTER_KEY}
            - {name: OTLP_HTTP_URL, value: http://10.61.80.10:4318}
            - {name: ORION_TOOL_ROUTING_POLICY_FILE, value: /etc/orion/policy/tool-routing-policy.txt}
            - {name: ZAMMAD_URL, value: http://10.61.30.24:8080}
            - {name: ZAMMAD_HOST, value: support.keplerops.lab}
            - {name: ORION_REQUIRE_IDENTITY_AUTH, value: "true"}
          envFrom:
            - secretRef: {name: orion-agent-runtime}
          ports: [{name: http, containerPort: 8080}]
          readinessProbe: {httpGet: {path: /health/ready, port: http}, initialDelaySeconds: 5, periodSeconds: 10}
          livenessProbe: {httpGet: {path: /health/live, port: http}, initialDelaySeconds: 15, periodSeconds: 15}
          resources: {requests: {cpu: 50m, memory: 128Mi}, limits: {cpu: 500m, memory: 512Mi}}
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}, readOnlyRootFilesystem: true, runAsUser: 65532}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
            - {name: prompt-policy, mountPath: /etc/orion/policy, readOnly: true}
      volumes:
        - {name: tmp, emptyDir: {}}
        - name: prompt-policy
          configMap: {name: orion-agent-prompt-policy, optional: true}
