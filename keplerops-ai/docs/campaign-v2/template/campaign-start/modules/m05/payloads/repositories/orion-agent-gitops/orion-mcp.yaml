apiVersion: apps/v1
kind: Deployment
metadata:
  name: orion-mcp
  namespace: orion-platform
  annotations: {keplerops.lab/source-commit: baseline}
  labels: {app.kubernetes.io/name: orion-mcp, app.kubernetes.io/part-of: keplerops-platform}
spec:
  replicas: 1
  selector: {matchLabels: {app.kubernetes.io/name: orion-mcp}}
  template:
    metadata:
      labels: {app.kubernetes.io/name: orion-mcp}
      annotations: {keplerops.lab/source-commit: baseline}
    spec:
      serviceAccountName: orion-agent
      imagePullSecrets: [{name: harbor-orion-pull}]
      securityContext: {runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: mcp
          image: registry.keplerops.lab/orion-internal/orion-mcp@sha256:__MCP_DIGEST__
          imagePullPolicy: IfNotPresent
          env:
            - {name: FORGEJO_URL, value: "http://192.168.78.1:3000"}
            - {name: FORGEJO_RELEASE_USER, value: "svc-orion-mcp"}
            - name: FORGEJO_RELEASE_PASSWORD
              valueFrom: {secretKeyRef: {name: orion-release-runtime, key: FORGEJO_RELEASE_PASSWORD}}
            - name: ORION_BRIDGE_DIRECTIVE_KEY
              valueFrom: {secretKeyRef: {name: orion-release-runtime, key: ORION_BRIDGE_DIRECTIVE_KEY}}
            - name: CINDER_HOST_OPERATOR_TOKEN
              valueFrom: {secretKeyRef: {name: orion-release-runtime, key: CINDER_HOST_OPERATOR_TOKEN}}
            - {name: ORION_MCP_IMAGE_DIGEST, value: "sha256:__MCP_DIGEST__"}
          envFrom:
            - secretRef: {name: orion-agent-runtime}
          ports: [{name: mcp, containerPort: 8081}]
          readinessProbe: {tcpSocket: {port: mcp}, initialDelaySeconds: 5, periodSeconds: 10}
          livenessProbe: {tcpSocket: {port: mcp}, initialDelaySeconds: 15, periodSeconds: 15}
          resources: {requests: {cpu: 25m, memory: 96Mi}, limits: {cpu: 300m, memory: 384Mi}}
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}, readOnlyRootFilesystem: true, runAsUser: 65532}
          volumeMounts: [{name: tmp, mountPath: /tmp}]
      volumes: [{name: tmp, emptyDir: {}}]
