global:
  scrape_interval: 5s
  evaluation_interval: 5s
rule_files:
  - /etc/prometheus/rules/*.yml
alerting:
  alertmanagers:
    - static_configs:
        - targets: ["10.61.80.15:9093"]
scrape_configs:
  - job_name: prometheus
    static_configs: [{targets: ["127.0.0.1:9090"]}]
  - job_name: m10-source-producer
    static_configs: [{targets: ["10.61.80.27:8080"]}]
  - job_name: otel-spanmetrics
    static_configs: [{targets: ["10.61.80.10:8889"]}]
  - job_name: orion-release-risk-edge
    metrics_path: /stats/prometheus
    static_configs: [{targets: ["10.61.80.20:9901"]}]
  - job_name: keycloak
    metrics_path: /metrics
    static_configs: [{targets: ["10.61.20.20:9000"]}]
  - job_name: rabbitmq
    static_configs: [{targets: ["10.61.50.12:15692"]}]
  - job_name: opencost
    static_configs: [{targets: ["192.168.78.30:30090"]}]
  - job_name: kube-state-metrics
    static_configs: [{targets: ["192.168.78.30:30091"]}]
  - job_name: cadvisor
    static_configs:
      - targets: ["192.168.78.30:30092"]
        labels: {cluster_id: keplerops-v2, node: k3s01}
    metric_relabel_configs:
      - source_labels: [container_label_io_kubernetes_pod_namespace]
        regex: (.+)
        target_label: namespace
      - source_labels: [container_label_io_kubernetes_pod_name]
        regex: (.+)
        target_label: pod
      - source_labels: [container_label_io_kubernetes_container_name]
        regex: (.+)
        target_label: container
