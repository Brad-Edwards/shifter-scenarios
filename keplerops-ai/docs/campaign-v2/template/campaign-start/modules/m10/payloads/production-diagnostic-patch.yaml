- op: add
  path: /spec/predictor/containers/0/volumeMounts
  value:
    - name: tmp
      mountPath: /tmp
    - name: orion-production-diagnostic
      mountPath: /var/run/secrets/keplerops/production
      readOnly: true
- op: add
  path: /spec/predictor/volumes
  value:
    - name: tmp
      emptyDir: {}
    - name: orion-production-diagnostic
      secret:
        secretName: orion-production-diagnostic
        items:
          - key: engagement-reference
            path: engagement-reference
            mode: 256
