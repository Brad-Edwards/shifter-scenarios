x-m01-health: &m01-health
  interval: 5s
  timeout: 20s
  retries: 24
  start_period: 15s

x-m01-worker: &m01-worker
  build:
    context: ./campaign-start/modules/m01/runtime
    dockerfile: Dockerfile
    args:
      ORION_AGENT_IMAGE: ${ORION_AGENT_IMAGE:-keplerops/orion-agent:0.1.0}
  image: keplerops/orion-review-worker:campaign-v2
  env_file:
    - path: ./state/campaign-start/m01/runtime.env
      required: false
  environment: &m01-environment
    WORKHUB_URL: http://10.61.30.22:3000
    WORKHUB_HOST: workhub.keplerops.lab
    WORKHUB_PROJECT: orion-release
    WORKHUB_USER: svc.review01
    WORKHUB_PASSWORD: KAI-Review01-WorkHub-c72b918e
    WORKHUB_PROVISIONER_USER: svc-orion-agent
    WORKHUB_PROVISIONER_PASSWORD: KAI-M01-WorkHub-Agent-f1468d2a
    RABBITMQ_URL: amqp://kepler:KeplerV2-Training-Rabbit@10.61.50.12:5672/keplerops
    DEVPI_EARNED_INDEX: http://10.61.40.30:3141/publisher/stable/+simple/
    FORGEJO_URL: http://10.61.40.20:3000
    KEYCLOAK_URL: http://10.61.20.20:8080
    KEYCLOAK_REALM: keplerops
    KEYCLOAK_CLIENT_ID: orion-partner-intake
    KEYCLOAK_CLIENT_SECRET: KeplerV2-Training-Partner-Intake-Keycloak
    PARTNER_REVIEWER_LOGIN: cinder.operator
    PARTNER_REVIEWER_EMAIL: cinder.operator@cinder.lab
    M02_ENTITLEMENT_PATH: /var/lib/keplerops/m02-earned/m01-h-package-consumer.json
  volumes:
    - ./state/campaign-start/m02/earned:/var/lib/keplerops/m02-earned:ro
  init: true
  restart: unless-stopped
  read_only: true
  tmpfs:
    - /tmp:size=256m,mode=1777
  security_opt:
    - no-new-privileges:true
  cap_drop: [ALL]

services:
  airflow-api:
    volumes:
      - ./campaign-start/modules/m01/dags/orion_m01_review_sources.py:/opt/airflow/dags/orion_m01_review_sources.py:ro
  airflow-scheduler:
    volumes:
      - ./campaign-start/modules/m01/dags/orion_m01_review_sources.py:/opt/airflow/dags/orion_m01_review_sources.py:ro
  airflow-dag-processor:
    volumes:
      - ./campaign-start/modules/m01/dags/orion_m01_review_sources.py:/opt/airflow/dags/orion_m01_review_sources.py:ro
  airflow-triggerer:
    volumes:
      - ./campaign-start/modules/m01/dags/orion_m01_review_sources.py:/opt/airflow/dags/orion_m01_review_sources.py:ro
  airflow-worker:
    volumes:
      - ./campaign-start/modules/m01/dags/orion_m01_review_sources.py:/opt/airflow/dags/orion_m01_review_sources.py:ro

  m01-review-dispatcher:
    <<: *m01-worker
    container_name: kep-v2-m01-review-dispatcher
    command: ["python", "/app/review_workers.py", "dispatcher"]
    healthcheck:
      <<: *m01-health
      test: ["CMD", "python", "/app/review_workers.py", "health", "dispatcher"]
    environment:
      <<: *m01-environment
      WORKER_NAME: review-dispatcher
    networks:
      corp:
        ipv4_address: 10.61.30.28
      cinder:
      data:
      identity:

  m01-review-worker:
    <<: *m01-worker
    container_name: kep-v2-m01-review01
    hostname: review01
    command: ["python", "/app/review_workers.py", "review"]
    healthcheck:
      <<: *m01-health
      test: ["CMD", "python", "/app/review_workers.py", "health", "review"]
    environment:
      <<: *m01-environment
      WORKER_NAME: review01
    networks:
      corp:
        ipv4_address: 10.61.30.29
      data:
      engineering:
      cinder:

  m01-analysis-worker:
    <<: *m01-worker
    container_name: kep-v2-m01-analysis01
    hostname: analysis01
    command: ["python", "/app/review_workers.py", "analysis"]
    healthcheck:
      <<: *m01-health
      test: ["CMD", "python", "/app/review_workers.py", "health", "analysis"]
    environment:
      <<: *m01-environment
      WORKER_NAME: analysis01
    networks:
      corp:
        ipv4_address: 10.61.30.30
      data:

  m01-integration-worker:
    <<: *m01-worker
    container_name: kep-v2-m01-integration01
    hostname: integration01
    command: ["python", "/app/review_workers.py", "integration"]
    healthcheck:
      <<: *m01-health
      test: ["CMD", "python", "/app/review_workers.py", "health", "integration"]
    environment:
      <<: *m01-environment
      WORKER_NAME: integration01
      WORKHUB_USER: svc.integration01
      WORKHUB_PASSWORD: KAI-Integration01-WorkHub-a4653d2f
    networks:
      corp:
        ipv4_address: 10.61.30.31
      data:
      engineering:
      cinder:

networks:
  corp:
    external: true
    name: kep-v2-corp
  data:
    external: true
    name: kep-v2-data
  identity:
    external: true
    name: kep-v2-identity
  engineering:
    external: true
    name: kep-v2-engineering
  cinder:
    external: true
    name: kep-v2-cinder
