name: Cinder capability evaluation
on:
  schedule:
    - cron: "* * * * *"
  workflow_dispatch:

jobs:
  evaluate-submissions:
    runs-on: cinder-evaluator
    steps:
      - name: Evaluate pending Cinder submissions
        run: python3 /opt/cinder-evaluator/evaluate.py
      - name: Publish release and staging reports
        if: always()
        uses: https://data.forgejo.org/actions/upload-artifact@v3
        with:
          name: cinder-evaluation-reports
          path: reports/
          if-no-files-found: ignore
