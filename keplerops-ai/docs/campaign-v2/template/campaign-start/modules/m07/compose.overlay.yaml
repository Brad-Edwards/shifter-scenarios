      - ./state/campaign-start/airflow-dags:/opt/airflow/dags
      - ./campaign-start/modules/m07/runtime:/opt/airflow/orion-integrity:ro
      - ./state/campaign-start/m07:/opt/airflow/orion-integrity-state
