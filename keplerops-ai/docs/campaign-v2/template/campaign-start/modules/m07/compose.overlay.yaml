    volumes:
      - ./state/campaign-start/m07/attempts/kep-m07-i:/run/keplerops/m07/state/attempts/kep-m07-i

  airflow-api:
    environment:
      LABEL_STUDIO_API_TOKEN: KAI-Orion-Trainer-2b68d419a7f340ce
