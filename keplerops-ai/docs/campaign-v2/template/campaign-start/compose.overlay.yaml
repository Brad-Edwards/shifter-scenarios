x-campaign-airflow: &campaign-airflow
  image: keplerops/airflow:campaign-v2
  build:
    context: .
    dockerfile: campaign-start/Dockerfile.airflow
    args:
      AIRFLOW_IMAGE: keplerops/airflow:campaign-v2-m08

services:
  airflow-api:
    <<: *campaign-airflow
  airflow-scheduler:
    <<: *campaign-airflow
  airflow-dag-processor:
    <<: *campaign-airflow
  airflow-triggerer:
    <<: *campaign-airflow
  airflow-worker:
    <<: *campaign-airflow
