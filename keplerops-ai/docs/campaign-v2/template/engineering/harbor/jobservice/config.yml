protocol: http
port: 8080
worker_pool:
  workers: 2
  backend: redis
  redis_pool:
    redis_url: redis://harbor-redis:6379/1
    namespace: harbor_job_service_namespace
    idle_timeout_second: 3600
job_loggers:
  - name: STD_OUTPUT
    level: INFO
loggers:
  - name: STD_OUTPUT
    level: INFO
metric:
  enabled: false
  path: /metrics
  port: 8001
reaper:
  max_update_hours: 24
  max_dangling_hours: 168
max_retrieve_size_mb: 10
