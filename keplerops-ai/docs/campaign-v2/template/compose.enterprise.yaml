name: keplerops-v2

x-restart: &restart
  restart: unless-stopped

x-common-labels: &common-labels
  io.keplerops.scenario: keplerops-ai
  io.keplerops.campaign: v2
  io.keplerops.layer: clean-baseline

x-zammad-environment: &zammad-environment
  MEMCACHE_SERVERS: zammad-memcached:11211
  POSTGRESQL_HOST: 10.61.50.10
  POSTGRESQL_DB: zammad
  POSTGRESQL_USER: zammad
  POSTGRESQL_PASS: KeplerV2-Training-ZammadDB
  POSTGRESQL_DB_CREATE: "false"
  REDIS_URL: redis://:KeplerV2-Training-Redis@10.61.50.11:6379
  ELASTICSEARCH_ENABLED: "false"
  ELASTICSEARCH_REINDEX: "false"
  ELASTICSEARCH_SCHEMA: http
  ELASTICSEARCH_HOST: 10.61.80.14
  ELASTICSEARCH_PORT: "9200"
  ZAMMAD_FQDN: support.keplerops.lab
  ZAMMAD_HTTP_TYPE: https
  NGINX_SERVER_SCHEME: https
  BACKUP_ON_START: "false"

x-zammad-service: &zammad-service
  image: ${ZAMMAD_IMAGE}
  init: true
  restart: unless-stopped
  environment: *zammad-environment
  volumes:
    - zammad-storage:/opt/zammad/storage
    - zammad-backup:/var/tmp/zammad
  networks:
    - data
    - observe
  labels: *common-labels

services:
  mariadb:
    <<: *restart
    image: ${MARIADB_IMAGE}
    container_name: kep-v2-mariadb
    environment:
      MARIADB_ROOT_PASSWORD: KeplerV2-Training-MariaRoot
    volumes:
      - mariadb-data:/var/lib/mysql
      - ./config/mariadb/init.sql:/docker-entrypoint-initdb.d/10-keplerops.sql:ro
    networks:
      data:
        ipv4_address: 10.61.50.30
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 30
    labels: *common-labels

  mongodb:
    <<: *restart
    image: ${MONGODB_IMAGE}
    container_name: kep-v2-mongodb
    command: ["mongod", "--bind_ip_all"]
    volumes:
      - mongodb-data:/data/db
    networks:
      data:
        ipv4_address: 10.61.50.31
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 15s
      timeout: 8s
      retries: 30
    labels: *common-labels

  meilisearch:
    <<: *restart
    image: ${MEILISEARCH_IMAGE}
    container_name: kep-v2-meilisearch
    environment:
      MEILI_MASTER_KEY: KeplerV2-Training-Meili-Master-Key
      MEILI_ENV: production
    volumes:
      - meilisearch-data:/meili_data
    networks:
      data:
        ipv4_address: 10.61.50.32
    labels: *common-labels

  public-site:
    <<: *restart
    image: ${NGINX_IMAGE}
    container_name: kep-v2-public-site
    volumes:
      - ./content/public-site:/usr/share/nginx/html:ro
    networks:
      public:
        ipv4_address: 10.61.10.24
    labels: *common-labels

  preview:
    <<: *restart
    build:
      context: ./preview
      args:
        PREVIEW_BASE_IMAGE: ${PREVIEW_BASE_IMAGE}
    image: keplerops/orion-preview:campaign-v2
    container_name: kep-v2-preview
    environment:
      ORION_RELEASE_RISK_URL: http://192.168.78.30:30083
      ORION_RELEASE_RISK_MODEL: orion-release-risk
    networks:
      public:
        ipv4_address: 10.61.10.25
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health/ready', timeout=5)"]
      interval: 15s
      timeout: 8s
      retries: 30
    labels: *common-labels

  stalwart:
    <<: *restart
    image: ${STALWART_IMAGE}
    container_name: kep-v2-stalwart
    hostname: mail.keplerops.lab
    environment:
      STALWART_PUBLIC_URL: https://mail.keplerops.lab
    volumes:
      - stalwart-data:/opt/stalwart
    extra_hosts:
      - "dc01.corp.keplerops.lab:192.168.78.10"
      - "dc02.corp.keplerops.lab:192.168.78.11"
    networks:
      public:
        ipv4_address: 10.61.10.20
      identity:
        ipv4_address: 10.61.20.30
      corp:
        ipv4_address: 10.61.30.20
      cinder:
        ipv4_address: 10.61.90.20
    labels: *common-labels

  roundcube:
    <<: *restart
    image: ${ROUNDCUBE_IMAGE}
    container_name: kep-v2-roundcube
    depends_on:
      stalwart:
        condition: service_started
    environment:
      ROUNDCUBEMAIL_DEFAULT_HOST: stalwart
      ROUNDCUBEMAIL_DEFAULT_PORT: "143"
      ROUNDCUBEMAIL_SMTP_SERVER: stalwart
      ROUNDCUBEMAIL_SMTP_PORT: "25"
      ROUNDCUBEMAIL_DB_TYPE: sqlite
    volumes:
      - roundcube-data:/var/roundcube/db
    networks:
      corp:
        ipv4_address: 10.61.30.21
      cinder:
        ipv4_address: 10.61.90.21
    labels: *common-labels

  forgejo:
    <<: *restart
    image: ${FORGEJO_IMAGE}
    container_name: kep-v2-forgejo
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      USER_UID: "1000"
      USER_GID: "1000"
      FORGEJO__database__DB_TYPE: postgres
      FORGEJO__database__HOST: 10.61.50.10:5432
      FORGEJO__database__NAME: forgejo
      FORGEJO__database__USER: forgejo
      FORGEJO__database__PASSWD: KeplerV2-Training-ForgejoDB
      FORGEJO__server__DOMAIN: git.keplerops.lab
      FORGEJO__server__ROOT_URL: https://git.keplerops.lab/
      FORGEJO__service__DISABLE_REGISTRATION: "true"
      FORGEJO__actions__ENABLED: "true"
      FORGEJO__security__INSTALL_LOCK: "true"
      SSL_CERT_FILE: /usr/local/share/ca-certificates/keplerops-caddy-root.crt
    volumes:
      - forgejo-data:/data
      - ./state/caddy-root.crt:/usr/local/share/ca-certificates/keplerops-caddy-root.crt:ro
    ports:
      - "192.168.78.1:3000:3000"
    extra_hosts:
      - "id.keplerops.lab:10.61.40.2"
    networks:
      engineering:
        ipv4_address: 10.61.40.20
      data:
        ipv4_address: 10.61.50.40
    labels: *common-labels

  redmine:
    <<: *restart
    image: ${REDMINE_IMAGE}
    container_name: kep-v2-redmine
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      REDMINE_DB_POSTGRES: 10.61.50.10
      REDMINE_DB_PORT: "5432"
      REDMINE_DB_DATABASE: redmine
      REDMINE_DB_USERNAME: redmine
      REDMINE_DB_PASSWORD: KeplerV2-Training-RedmineDB
      REDMINE_SECRET_KEY_BASE: KeplerV2-Training-Redmine-Secret-Key-Base
      SECRET_KEY_BASE: KeplerV2-Training-Redmine-Secret-Key-Base
    volumes:
      - redmine-files:/usr/src/redmine/files
    ports:
      - "192.168.78.1:13000:3000"
    extra_hosts:
      - dc01.corp.keplerops.lab:192.168.78.10
      - dc02.corp.keplerops.lab:192.168.78.11
    networks:
      corp:
        ipv4_address: 10.61.30.22
      data:
        ipv4_address: 10.61.50.41
    labels: *common-labels

  nextcloud:
    <<: *restart
    image: ${NEXTCLOUD_IMAGE}
    container_name: kep-v2-nextcloud
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      POSTGRES_HOST: 10.61.50.10
      POSTGRES_DB: nextcloud
      POSTGRES_USER: nextcloud
      POSTGRES_PASSWORD: KeplerV2-Training-NextcloudDB
      REDIS_HOST: 10.61.50.11
      REDIS_HOST_PASSWORD: KeplerV2-Training-Redis
      NEXTCLOUD_UPDATE: "1"
      NEXTCLOUD_ADMIN_USER: range-admin
      NEXTCLOUD_ADMIN_PASSWORD: KeplerV2-Training-Nextcloud
      NEXTCLOUD_TRUSTED_DOMAINS: files.keplerops.lab
      OVERWRITEHOST: files.keplerops.lab
      OVERWRITEPROTOCOL: https
      OVERWRITECLIURL: https://files.keplerops.lab
      TRUSTED_PROXIES: 10.61.10.2 10.61.30.2
    command: ["bash", "-c", "update-ca-certificates >/dev/null && exec apache2-foreground"]
    extra_hosts:
      - "id.keplerops.lab:10.61.30.2"
    volumes:
      - nextcloud-data:/var/www/html
      - ./state/caddy-root.crt:/usr/local/share/ca-certificates/keplerops-caddy.crt:ro
    networks:
      corp:
        ipv4_address: 10.61.30.23
      data:
        ipv4_address: 10.61.50.42
    labels: *common-labels

  zammad-memcached:
    <<: *restart
    image: ${MEMCACHED_IMAGE}
    container_name: kep-v2-zammad-memcached
    command: ["memcached", "-m", "256M"]
    networks:
      data:
        ipv4_address: 10.61.50.33
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "11211"]
      interval: 10s
      timeout: 5s
      retries: 20
    labels: *common-labels

  zammad-init:
    <<: *zammad-service
    container_name: kep-v2-zammad-init
    command: ["zammad-init"]
    restart: on-failure
    user: 0:0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      opensearch:
        condition: service_healthy
      zammad-memcached:
        condition: service_healthy

  zammad-railsserver:
    <<: *zammad-service
    container_name: kep-v2-zammad-railsserver
    command: ["zammad-railsserver"]
    depends_on:
      zammad-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/"]
      interval: 20s
      timeout: 8s
      start_period: 120s
      retries: 20

  zammad-scheduler:
    <<: *zammad-service
    container_name: kep-v2-zammad-scheduler
    command: ["zammad-scheduler"]
    depends_on:
      zammad-init:
        condition: service_completed_successfully

  zammad-websocket:
    <<: *zammad-service
    container_name: kep-v2-zammad-websocket
    command: ["zammad-websocket"]
    depends_on:
      zammad-init:
        condition: service_completed_successfully

  zammad-nginx:
    <<: *zammad-service
    container_name: kep-v2-zammad-nginx
    command: ["zammad-nginx"]
    depends_on:
      zammad-railsserver:
        condition: service_healthy
    networks:
      corp:
        ipv4_address: 10.61.30.24
      data:
        ipv4_address: 10.61.50.43

  langflow:
    <<: *restart
    image: ${LANGFLOW_IMAGE}
    container_name: kep-v2-langflow
    environment:
      LANGFLOW_DATABASE_URL: postgresql://langflow:KeplerV2-Training-LangflowDB@10.61.50.10:5432/langflow
      LANGFLOW_AUTO_LOGIN: "false"
      LANGFLOW_SUPERUSER: range-admin
      LANGFLOW_SUPERUSER_PASSWORD: KeplerV2-Training-Langflow
    volumes:
      - langflow-data:/app/langflow
    networks:
      public:
        ipv4_address: 10.61.10.22
      engineering:
        ipv4_address: 10.61.40.21
      data:
        ipv4_address: 10.61.50.44
    labels: *common-labels

  librechat:
    <<: *restart
    image: ${LIBRECHAT_IMAGE}
    container_name: kep-v2-librechat
    depends_on:
      mongodb:
        condition: service_healthy
      meilisearch:
        condition: service_started
    environment:
      HOST: 0.0.0.0
      PORT: "3080"
      MONGO_URI: mongodb://10.61.50.31:27017/LibreChat
      MEILI_HOST: http://10.61.50.32:7700
      MEILI_MASTER_KEY: KeplerV2-Training-Meili-Master-Key
      CREDS_KEY: KeplerV2-Training-LibreChat-Creds-Key-32
      CREDS_IV: KeplerV2-Training-LibreChat-IV-16
      JWT_SECRET: KeplerV2-Training-LibreChat-JWT
      JWT_REFRESH_SECRET: KeplerV2-Training-LibreChat-Refresh
      ALLOW_REGISTRATION: "false"
      ALLOW_EMAIL_LOGIN: "false"
      ALLOW_SOCIAL_LOGIN: "true"
      DOMAIN_CLIENT: https://assistant.keplerops.lab
      DOMAIN_SERVER: https://assistant.keplerops.lab
      OPENID_ISSUER: https://id.keplerops.lab/realms/keplerops
      OPENID_CLIENT_ID: librechat
      OPENID_CLIENT_SECRET: KeplerV2-Training-LibreChat-OIDC
      OPENID_SESSION_SECRET: KeplerV2-Training-LibreChat-Session
      OPENID_SCOPE: openid profile email
      OPENID_CALLBACK_URL: /oauth/openid/callback
      OPENID_REQUIRED_ROLE: librechat-user
      OPENID_REQUIRED_ROLE_PARAMETER_PATH: realm_access.roles
      OPENID_REQUIRED_ROLE_TOKEN_KIND: access
      OPENID_USE_PKCE: "true"
      LOGIN_MAX: "120"
      LOGIN_WINDOW: "1"
      NODE_EXTRA_CA_CERTS: /etc/keplerops/caddy-root.crt
    volumes:
      - ./config/librechat/librechat.yaml:/app/librechat.yaml:ro
      - ./state/caddy-root.crt:/etc/keplerops/caddy-root.crt:ro
      - librechat-images:/app/client/public/images
    extra_hosts:
      - "id.keplerops.lab:10.61.20.2"
    networks:
      identity:
        ipv4_address: 10.61.20.43
      corp:
        ipv4_address: 10.61.30.25
      data:
        ipv4_address: 10.61.50.45
    labels: *common-labels

  unleash:
    <<: *restart
    image: ${UNLEASH_IMAGE}
    container_name: kep-v2-unleash
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://business:KeplerV2-Training-BusinessDB@10.61.50.10:5432/business
      DATABASE_SSL: "false"
      LOG_LEVEL: warn
      AUTH_TYPE: open-source
      AUTH_ENABLE_API_TOKEN: "true"
      CHECK_VERSION: "false"
      UNLEASH_DEFAULT_ADMIN_USERNAME: range-admin
      UNLEASH_DEFAULT_ADMIN_PASSWORD: KeplerV2-Training-Unleash
      INIT_ADMIN_API_TOKENS: "*:*.range-admin"
    networks:
      business:
        ipv4_address: 10.61.70.23
      data:
        ipv4_address: 10.61.50.46
    labels: *common-labels

  odoo:
    <<: *restart
    image: keplerops/odoo:18.0-auth-oidc-6d57b614
    build:
      context: ./business/odoo
      dockerfile: Dockerfile
      args:
        ODOO_BASE_IMAGE: odoo:18.0@sha256:66fae420378996f4c7e633b3fd47bfef0909170d75db897e3935e8ad1162db1a
    container_name: kep-v2-odoo
    command: ["odoo", "--proxy-mode"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      HOST: 10.61.50.10
      PORT: "5432"
      USER: business
      PASSWORD: KeplerV2-Training-BusinessDB
    volumes:
      - odoo-data:/var/lib/odoo
    networks:
      identity:
        ipv4_address: 10.61.20.42
      business:
        ipv4_address: 10.61.70.20
      data:
        ipv4_address: 10.61.50.47
    labels: *common-labels

  ghost:
    <<: *restart
    image: ghost:5.130.2-alpine@sha256:7475a7be28f621ba8e504d559e4a5b543dcd4f27797af7ff96aa772bcf024eb1
    container_name: kep-v2-ghost
    depends_on:
      mariadb:
        condition: service_healthy
    environment:
      url: https://status.keplerops.lab
      database__client: mysql
      database__connection__host: 10.61.50.30
      database__connection__user: ghost
      database__connection__password: KeplerV2-Training-GhostDB
      database__connection__database: ghost
      security__staffDeviceVerification: "false"
      mail__transport: SMTP
      mail__from: status@keplerops.lab
      mail__options__host: mail.keplerops.lab
      mail__options__port: "25"
      mail__options__secure: "false"
      NODE_EXTRA_CA_CERTS: /etc/keplerops/caddy-root.crt
    volumes:
      - ghost-data:/var/lib/ghost/content
      - ./state/caddy-root.crt:/etc/keplerops/caddy-root.crt:ro
    extra_hosts:
      - "mail.keplerops.lab:10.61.10.20"
    networks:
      business:
        ipv4_address: 10.61.70.21
      data:
        ipv4_address: 10.61.50.48
    labels: *common-labels

  mautic:
    <<: *restart
    image: mautic/mautic:5.2.11-20260603-apache@sha256:e3fb45f69bf1a03effdf7d7cf214b269b82dd340acda328cf3cfb709971ada59
    container_name: kep-v2-mautic
    depends_on:
      mariadb:
        condition: service_healthy
    environment:
      MAUTIC_DB_HOST: 10.61.50.30
      MAUTIC_DB_PORT: 3306
      MAUTIC_DB_DATABASE: mautic
      MAUTIC_DB_USER: mautic
      MAUTIC_DB_PASSWORD: KeplerV2-Training-MauticDB
      MAUTIC_URL: https://advisories.keplerops.lab
      MAUTIC_ADMIN_EMAIL: communications@keplerops.lab
      MAUTIC_ADMIN_PASSWORD: KeplerV2-Training-Mautic
    volumes:
      - mautic-data:/var/www/html
    networks:
      corp:
        ipv4_address: 10.61.30.26
      business:
        ipv4_address: 10.61.70.22
      data:
        ipv4_address: 10.61.50.49
    labels: *common-labels

  business-opa:
    <<: *restart
    image: ${BUSINESS_OPA_IMAGE}
    container_name: kep-v2-business-opa
    command:
      - run
      - --server
      - --addr=0.0.0.0:8181
      - --log-format=json
      - --set=decision_logs.console=true
      - /policy/business.rego
    volumes:
      - ./business/policy/business.rego:/policy/business.rego:ro
    networks:
      business:
        ipv4_address: 10.61.70.24
      observe:
        ipv4_address: 10.61.80.25
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    labels: *common-labels

  business-adapter:
    <<: *restart
    image: keplerops/business-adapter:campaign-v2-clean
    build:
      context: ./business
      dockerfile: Dockerfile
      args:
        BUSINESS_ADAPTER_BASE_IMAGE: ${BUSINESS_ADAPTER_BASE_IMAGE}
    container_name: kep-v2-business-adapter
    env_file:
      - path: ./state/business-release.env
        required: false
    depends_on:
      business-opa:
        condition: service_started
      unleash:
        condition: service_started
      odoo:
        condition: service_started
      ghost:
        condition: service_started
      mautic:
        condition: service_started
      zammad-nginx:
        condition: service_started
      redmine:
        condition: service_started
      nextcloud:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    environment:
      KEPLEROPS_RANGE_ID: ${KEPLEROPS_RANGE_ID:-template}
      BUSINESS_ADAPTER_TOKEN: ${BUSINESS_ADAPTER_TOKEN:-KeplerV2-Training-Business-Adapter}
      ORION_DECISION_SIGNING_KEY: ${ORION_DECISION_SIGNING_KEY:-KeplerV2-Training-Orion-Decision-Signing}
      ORION_RELEASE_RISK_URL: http://192.168.78.30:30083
      ORION_RELEASE_RISK_MODEL: orion-release-risk
      ORION_AGENT_URL: http://192.168.78.30:30081
      ORION_AGENT_API_KEY: ${ORION_AGENT_API_KEY:-KAI-Orion-Agent-Runtime-8f4c1a7d29e6b053}
      BUSINESS_OPA_URL: http://business-opa:8181
      UNLEASH_URL: http://unleash:4242
      UNLEASH_ADMIN_TOKEN: user:KeplerV2-Training-Orion-Unleash-Control
      UNLEASH_CLIENT_TOKEN: default:development.KeplerV2-Training-Orion-Canary-Read
      UNLEASH_PROJECT: default
      UNLEASH_ENVIRONMENT: development
      ODOO_URL: http://odoo:8069
      GHOST_INTERNAL_URL: http://ghost:2368
      MAUTIC_INTERNAL_URL: https://advisories.keplerops.lab
      SSL_CERT_FILE: /etc/keplerops/caddy-root.crt
      ZAMMAD_URL: http://zammad-nginx:8080
      ZAMMAD_USER: support.analyst
      ZAMMAD_PASSWORD: ${SUPPORT_ANALYST_PASSWORD:-KeplerV2-Training-Support}
      REDMINE_URL: http://redmine:3000
      NEXTCLOUD_URL: http://nextcloud
      RABBITMQ_MANAGEMENT_URL: http://rabbitmq:15672
      QDRANT_URL: http://qdrant-writer:6333
      LAKEFS_URL: http://lakefs:8000
      SMTP_HOST: stalwart
      SMTP_SUPPORT_USER: support.analyst
    volumes:
      - business-audit:/var/lib/keplerops-business
      - ./state/caddy-root.crt:/etc/keplerops/caddy-root.crt:ro
    extra_hosts:
      - "advisories.keplerops.lab:10.61.70.2"
    networks:
      corp:
        ipv4_address: 10.61.30.27
      data:
        ipv4_address: 10.61.50.70
      business:
        ipv4_address: 10.61.70.25
      observe:
        ipv4_address: 10.61.80.26
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health/ready', timeout=5).read()
      interval: 15s
      timeout: 8s
      retries: 30
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    labels: *common-labels

  partner-contract-monitors:
    <<: *restart
    image: keplerops/business-adapter:campaign-v2-clean
    build:
      context: ./business
      dockerfile: Dockerfile
      args:
        BUSINESS_ADAPTER_BASE_IMAGE: ${BUSINESS_ADAPTER_BASE_IMAGE}
    container_name: kep-v2-partner-contract-monitors
    command: ["python", "-m", "app.impact_workers"]
    env_file:
      - path: ./state/business-release.env
        required: false
    depends_on:
      ghost:
        condition: service_started
      nextcloud:
        condition: service_started
      zammad-nginx:
        condition: service_started
    environment:
      KEPLEROPS_RANGE_ID: ${KEPLEROPS_RANGE_ID:-template}
      GHOST_INTERNAL_URL: http://ghost:2368
      NEXTCLOUD_URL: http://nextcloud
      ZAMMAD_URL: http://zammad-nginx:8080
      PARTNER_MONITOR_STATE: /var/lib/keplerops-business/partner-monitors
    volumes:
      - business-audit:/var/lib/keplerops-business
    networks:
      - business
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    labels: *common-labels

networks:
  public:
    external: true
    name: kep-v2-public
