        - path: sdl/modules/
        - path: aces_contract.py
        - path: docs/challenge-portfolio.md
        - path: experiments/ctf-evaluation-task.yaml
        - path: validation/validate_portfolio.py
        - path: validation/tests/test_validate_portfolio.py
    - id: ctfd-loader
      kind: unit-test
      paths:
        - path: ctfd/keplerops_flag_manifest.py
        - path: ctfd/ctfd_reconcile.py
        - path: ctfd/sync_keplerops_ctfd.py
        - path: ctfd/tests/test_sync_keplerops_ctfd.py
