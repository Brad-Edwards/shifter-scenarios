schema_version: 1
pack:
  name: keplerops-ai
  title: "KeplerOps AI Systems"
  version: 0.16.0
  status: draft
  provenance_ledger: docs/provenance-ledger.yaml
  source:
    requirement: KEP-0001
    upstream_references:
      - https://aisecurity.forum/events/vegas-ai-security-forum-26/
      - https://github.com/mitre-atlas/atlas-data
artifact_boundaries:
  participant_visible:
    - path: README.md
      export: public
      description: Participant-safe pack overview and status boundary.
    - path: assets/briefing/
      export: public
      description: Participant mission, allowed-target boundary, and start choices.
  operator_only:
    - path: .gcloudignore
      export: operator
      description: Excludes generated build, Terraform, and operator state from Cloud Build source archives.
    - path: ctfd/
      export: operator
      description: Reference CTFd loader, reconciliation client, runbook, and tests.
    - path: sdl/
      export: operator
      description: "Sole logical scenario authority: composition root, complete environment, participant start state, green live-activity behavior, ten module envelopes, 134 realized challenge behaviors, and one reserved planned challenge design."
    - path: validation/requirements.txt
      export: operator
      description: Exact PyPI pin for the ACES SDL parser and semantic implementation.
    - path: validation/validate_aces_sdl.py
      export: operator
      description: ACES parse, semantic, version-pin, and external tactic-reconciliation validator.
    - path: validation/tests/test_validate_aces_sdl.py
      export: operator
      description: Mutation tests for the ACES SDL and ATLAS projection binding.
    - path: design/README.md
      export: operator
      description: Boundary statement prohibiting parallel non-ACES scenario projections.
    - path: assets/services/
      export: operator
      description: Pack-local service, upstream-wrapper, identity, proxy, and telemetry configuration source.
    - path: assets/content/credentials/
      export: operator
      description: Synthetic training credentials planted into the participant world by the pack-local build.
    - path: assets/content/company-state/
      export: operator
      description: Canonical synthetic company corpus and exact dataset/artifact bytes bound by native RAES content placements.
    - path: assets/workflows/
      export: operator
      description: Airflow distillation workflow and immutable image source.
    - path: build/
      export: operator
      description: GCP provider binding, image supply, lifecycle tooling, diagnostics, and static tests.
    - path: tests/
      export: operator
      description: Kasm-only participant live rehearsal, canonical coverage joins, safe report renderer, and unit tests.
    - path: telemetry/
      export: operator
      description: Versioned participant-run research envelope, field policy, capture modes, source catalog, data dictionary, and export contract.
    - path: docs/documentation-inventory.md
      export: operator
      description: Documentation authority, audience, source-of-truth, and update-trigger inventory for the documentation reconciliation true-up.
    - path: docs/operator-playtest-guide.md
      export: operator
      description: Practical operator and playtest runbook for build/reuse, participant entry, CTFd projection, reset, evidence, telemetry export, troubleshooting, and Phase E.
    - path: docs/playtester-guide/
      export: operator
      description: Structured playtester handoff folder with coordinator quickstart, participant-start boundary, telemetry notes, sanity log, and one SDL-backed walkthrough file per playable challenge.
    - path: docs/topology-reference-triangle.md
      export: operator
      description: Operator-readable topology, participant surface, isolation, and reference-triangle design.
    - path: docs/software-boundary-proof-report.md
      export: operator
      description: Sanitized retained-range proof for the 28-node SDL software foundation and all thirteen new-node service gates.
    - path: docs/golden-readiness-checklist.md
      export: operator
      description: Operator final-review checklist.
    - path: docs/manual-walkthrough-report.md
