delivery_bundles:
  - bundle_id: executive-sampler
    status: planned
    audience: demo
    participant_paths: []
    operator_paths: []
    validation: []
  - bundle_id: core-red-team
    status: planned
    audience: guided
    participant_paths: []
    operator_paths: []
    validation: []
  - bundle_id: full-red-team
    status: planned
    audience: unguided
    participant_paths: []
    operator_paths: []
    validation: []
platform_features:
  - feature_id: inference-gateway
    status: planned
    runtime_profiles: [local_reduced, gcp_full]
    description: Pack-local seam for model/provider routing and guarded inference behavior.
  - feature_id: guardrail-policy
    status: planned
    runtime_profiles: [local_reduced, gcp_full]
    description: Policy layer the participant probes and bypasses in the offensive path.
  - feature_id: open-model-hosting
    status: planned
    runtime_profiles: [gcp_full]
    description: Range-controlled open-model endpoints for participant exploit attempts; commercial model endpoints are out of bounds as targets.
  - feature_id: enterprise-fabric
    status: planned
    runtime_profiles: [gcp_full]
    description: Populated identities, applications, repositories, tickets or approvals, datasets, logs, and documents supporting an integrated enterprise path.
  - feature_id: model-registry
    status: planned
    runtime_profiles: [gcp_full]
    description: Real deployable model artifact registry or artifact store for theft/corruption objectives.
  - feature_id: distillation-workflow
    status: planned
    runtime_profiles: [gcp_full]
    description: Required challenge-flow surface for abusing teacher/student model, dataset, evaluation, and artifact-promotion paths.
  - feature_id: atlas-coverage-map
    status: planned
    runtime_profiles: [gcp_full]
    description: Operator-only MITRE ATLAS 2026.06 catalog mapping all 173 pinned techniques to planned challenge modules without claiming one participant executes all techniques.
  - feature_id: participant-entry
    status: planned
    runtime_profiles: [gcp_full]
    description: Attacker workstation, browser terminal, jump host, or equivalent participant execution surface.
