validation:
  commands:
    - id: scenario-content
      command: python3 scripts/ci/scenario_content_ci.py
      validates: [manifest, provenance, pack-layout, leak-scan, validators, tests]
    - id: keplerops-ai-contract
      command: python3 keplerops-ai/validation/validate_contract.py validate
      validates: [draft-contract, modular-sdl-authority, removed-projection-guard, provenance, docs]
    - id: keplerops-ai-aces-sdl
      command: python3 keplerops-ai/validation/validate_aces_sdl.py validate
      validates: [aces-only-sources, aces-modules, pypi-version-pin, aces-parse, aces-semantics, atlas-tactic-surface, external-tactic-reconciliation]
    - id: keplerops-ai-company-state
      command: python3 keplerops-ai/validation/validate_company_state.py validate
      validates: [company-object-graph, raes-identity-bindings, represented-time, causal-lineage, source-byte-digests, content-safety]
    - id: keplerops-ai-oracle
      command: python3 keplerops-ai/validation/validate_oracle.py validate
      validates: [aces-native-objectives, aces-native-evidence, aces-embedded-atlas-catalog, aces-embedded-research-policy, sdl-derived-flags, sdl-derived-challenges, negative-gates, leak-scan]
    - id: keplerops-ai-portfolio
      command: python3 keplerops-ai/validation/validate_portfolio.py validate
      validates: [challenge-count, difficulty-distribution, time-budget, objective-truth, experiment-task-scoring, dependency-dag, sdl-module-coverage, implementation-evidence]
    - id: keplerops-ai-ctfd
      command: python3 -m unittest discover -s keplerops-ai/ctfd/tests -p 'test_*.py'
      validates: [manifest-projection, pagination, owned-reconciliation, idempotency, dry-run-redaction, token-file-policy, readback]
    - id: keplerops-ai-gcp-build
      command: keplerops-ai/build/test.sh
      validates: [sdl-realization, source-completeness, provider-binding, image-lock, existing-project-boundary, tenant-isolation, reset, health, receipt-boundary]
  gates:
    - id: manifest-schema
      kind: schema
      paths:
        - path: pack.compatibility.yaml
    - id: contract-validator
      kind: unit-test
      paths:
        - path: validation/validate_contract.py
        - path: validation/tests/test_validate_contract.py
        - path: sdl/keplerops-ai.sdl.yaml
        - path: sdl/modules/environment.sdl.yaml
        - path: experiments/ctf-evaluation-task.yaml
        - path: pack.yaml
        - path: pack.compatibility.yaml
        - path: docs/provenance-ledger.yaml
    - id: aces-sdl-validator
      kind: unit-test
      paths:
        - path: sdl/keplerops-ai.sdl.yaml
        - path: sdl/modules/
        - path: aces_contract.py
        - path: validation/requirements.txt
        - path: validation/validate_aces_sdl.py
        - path: validation/tests/test_validate_aces_sdl.py
    - id: company-state-validator
      kind: unit-test
      paths:
        - path: assets/content/company-state/
        - path: sdl/modules/environment.sdl.yaml
        - path: validation/validate_company_state.py
        - path: build/tests/test_company_state_contract.py
        - path: docs/company-state.md
    - id: oracle-validator
      kind: unit-test
      paths:
        - path: sdl/keplerops-ai.sdl.yaml
        - path: sdl/modules/
        - path: aces_contract.py
        - path: docs/attack-path.md
        - path: docs/atlas-coverage-plan.md
        - path: docs/atlas-challenge-architecture.md
        - path: validation/validate_oracle.py
        - path: validation/tests/test_validate_oracle.py
    - id: portfolio-validator
