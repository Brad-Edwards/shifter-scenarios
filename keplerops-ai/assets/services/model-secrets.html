<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KeplerOps Model Secrets Lab</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    body { margin: 0 auto; max-width: 76rem; padding: 2rem; background: #10151d; color: #e8eef6; }
    form, article { background: #19212c; border: 1px solid #344257; border-radius: .5rem; margin: 1rem 0; padding: 1rem; }
    label { display: block; margin: .5rem 0; }
    input, textarea, select, button { box-sizing: border-box; font: inherit; padding: .6rem; }
    input, textarea, select { background: #0d1219; border: 1px solid #53657d; color: inherit; width: 100%; }
    input[type="checkbox"] { width: auto; }
    textarea { min-height: 7rem; }
    button { cursor: pointer; margin: .25rem .25rem .25rem 0; }
    pre { overflow-wrap: anywhere; white-space: pre-wrap; }
    table { border-collapse: collapse; width: 100%; }
    td, th { border-bottom: 1px solid #344257; padding: .45rem; text-align: left; vertical-align: top; }
    .meta { color: #aebdd0; }
    .error { color: #ff9e9e; }
  </style>
</head>
<body>
  <h1>KeplerOps Model Secrets Lab</h1>
  <p>Probe the range-local model, compare real classifier scores, and infer which synthetic records influenced training.</p>
  <form id="login">
    <h2>Participant session</h2>
    <label>Username <input id="username" autocomplete="username" required></label>
    <label>Password <input id="password" type="password" autocomplete="current-password" required></label>
    <button type="submit">Sign in</button>
    <output id="login-status"></output>
  </form>
  <main id="challenges"></main>
  <script>
    "use strict";
    const root = document.querySelector("#challenges");
    const status = document.querySelector("#login-status");
    const populationByChallenge = {"kep-m04-c": "diagnostic", "kep-m04-d": "private", "kep-m04-e": "cohort"};

    async function request(path, options = {}) {
      const response = await fetch(path, {credentials: "same-origin", headers: {"Content-Type": "application/json", ...options.headers}, ...options});
      const body = (response.headers.get("content-type") || "").includes("application/json") ? await response.json() : null;
      if (!response.ok) throw new Error(body && body.detail ? body.detail : `request failed (${response.status})`);
      return body;
    }

    function text(tag, value, className = "") {
      const node = document.createElement(tag);
      node.textContent = value;
      if (className) node.className = className;
      return node;
    }

    async function receipt(challenge, output) {
      const issued = await request(`/v1/secrets/receipts/${challenge.flag_id}`, {method: "POST", body: "{}"});
      output.textContent += `\n\nReceipt:\n${issued.receipt}`;
    }

    async function showHint(challengeId, tier, output) {
      try {
        const result = await request(`/v1/secrets/challenges/${challengeId}/hints/${tier}`, {method: "POST", body: "{}"});
        output.textContent = `Hint ${tier} (${result.cost} points): ${result.hint}`;
      } catch (error) { output.textContent = error.message; output.className = "error"; }
    }

    function addHeader(card, challenge) {
      card.append(text("h2", `${challenge.challenge_id}: ${challenge.title}`));
      card.append(text("p", `${challenge.difficulty} · ${challenge.points} points · ${challenge.interfaces.join(" / ")}`, "meta"));
      card.append(text("p", challenge.question));
      const hintOutput = text("p", "Hints are optional.", "meta");
      for (let tier = 1; tier <= 3; tier += 1) {
        const button = text("button", `Hint ${tier}`);
        button.type = "button";
        button.addEventListener("click", () => showHint(challenge.challenge_id, tier, hintOutput));
        card.append(button);
      }
      card.append(hintOutput);
    }

    function renderInference(challenge, card) {
      const prompt = document.createElement("textarea");
      prompt.placeholder = "Enter the inference-only reconstruction prompt";
      const run = text("button", "Run model probe");
      run.type = "button";
      const output = document.createElement("pre");
      run.addEventListener("click", async () => {
        try {
          output.className = "";
          output.textContent = "Querying the range-local model…";
          const result = await request("/v1/secrets/infer", {method: "POST", body: JSON.stringify({challenge_id: challenge.challenge_id, prompt: prompt.value, participant_interface: "browser", assistance_mode: "none"})});
          output.textContent = JSON.stringify(result, null, 2);
          if (result.objective_status === "passed") await receipt(challenge, output);
        } catch (error) { output.textContent = error.message; output.className = "error"; }
      });
      card.append(prompt, run, output);
    }

    async function renderPopulation(challenge, card) {
      const population = populationByChallenge[challenge.challenge_id];
      const payload = await request(`/v1/secrets/populations/${population}`);
      const table = document.createElement("table");
      const head = document.createElement("tr");
      for (const label of ["member?", "sample", "text", "known/cohort", "score"]) head.append(text("th", label));
      table.append(head);
      for (const sample of payload.samples) {
        const row = document.createElement("tr");
        const choice = document.createElement("input");
        choice.type = "checkbox";
        choice.dataset.sampleId = sample.sample_id;
        const chooseCell = document.createElement("td");
        chooseCell.append(choice);
        const scoreCell = document.createElement("td");
        const scoreButton = text("button", "Score");
        scoreButton.type = "button";
        scoreButton.addEventListener("click", async () => {
          try {
            const result = await request("/v1/secrets/score", {method: "POST", body: JSON.stringify({challenge_id: challenge.challenge_id, sample_id: sample.sample_id, participant_interface: "browser", assistance_mode: "none"})});
            scoreCell.textContent = `${result.confidence} (${result.prediction})`;
          } catch (error) { scoreCell.textContent = error.message; scoreCell.className = "error"; }
        });
        scoreCell.append(scoreButton);
        row.append(chooseCell, text("td", sample.sample_id), text("td", sample.text), text("td", sample.known_membership || sample.cohort || "private"), scoreCell);
        table.append(row);
      }
      card.append(table);
      const cohort = document.createElement("select");
      for (const value of ["aurora", "umbra"]) {
        const option = document.createElement("option");
        option.value = value;
        option.textContent = value;
        cohort.append(option);
      }
      if (challenge.challenge_id === "kep-m04-e") card.append(text("label", "Predicted protected cohort"), cohort);
      const submit = text("button", "Submit inference");
      submit.type = "button";
      const output = document.createElement("pre");
      submit.addEventListener("click", async () => {
        try {
          const selected = [...card.querySelectorAll("input[type=checkbox]:checked")].map(node => node.dataset.sampleId);
          const body = {challenge_id: challenge.challenge_id, selected_members: challenge.challenge_id === "kep-m04-e" ? [] : selected, predicted_cohort: challenge.challenge_id === "kep-m04-e" ? cohort.value : null, participant_interface: "browser", assistance_mode: "none"};
          const result = await request("/v1/secrets/attempt", {method: "POST", body: JSON.stringify(body)});
          output.textContent = JSON.stringify(result, null, 2);
          if (result.objective_status === "passed") await receipt(challenge, output);
        } catch (error) { output.textContent = error.message; output.className = "error"; }
      });
      card.append(submit, output);
    }

    async function renderChallenge(challenge) {
      const card = document.createElement("article");
      addHeader(card, challenge);
      if (["kep-m04-a", "kep-m04-b"].includes(challenge.challenge_id)) renderInference(challenge, card);
      else await renderPopulation(challenge, card);
      return card;
    }

    async function loadChallenges() {
      const payload = await request("/v1/secrets/challenges");
      const cards = [];
      for (const challenge of payload.challenges) cards.push(await renderChallenge(challenge));
      root.replaceChildren(...cards);
    }

    document.querySelector("#login").addEventListener("submit", async event => {
      event.preventDefault();
      try {
        await request("/v1/browser/login", {method: "POST", body: JSON.stringify({username: document.querySelector("#username").value, password: document.querySelector("#password").value})});
        document.querySelector("#password").value = "";
        status.textContent = "Authenticated";
        await loadChallenges();
      } catch (error) { status.textContent = error.message; status.className = "error"; }
    });
  </script>
</body>
</html>
