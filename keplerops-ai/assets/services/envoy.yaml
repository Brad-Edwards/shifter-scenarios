static_resources:
  listeners:
    - name: inference_https
      address: {socket_address: {address: 0.0.0.0, port_value: 8444}}
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: inference
                route_config:
                  name: local
                  request_headers_to_remove: [x-forwarded-client-cert, traceparent, tracestate, baggage, x-keplerops-study-run-id, x-keplerops-session-id]
                  virtual_hosts:
                    - name: gateway
                      domains: ["inference-gateway.keplerops.lab"]
                      routes:
                        - match: {prefix: "/v1/capstone/artifact-access/"}
                          route: {cluster: gateway, timeout: 900s}
                        - match: {prefix: "/v1/evasion/model-dependencies"}
                          route: {cluster: gateway, timeout: 180s, idle_timeout: 180s}
                        - match: {prefix: "/v1/evasion/spearphish-campaigns"}
                          route: {cluster: gateway, timeout: 900s, idle_timeout: 900s}
                        - match: {prefix: "/"}
                          route: {cluster: gateway, timeout: 35s}
                http_filters:
                  - name: envoy.filters.http.router
                    typed_config: {"@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router}
          transport_socket:
            name: envoy.transport_sockets.tls
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.DownstreamTlsContext
              common_tls_context:
                tls_certificates:
                  - certificate_chain: {filename: /run/tls/tls.crt}
                    private_key: {filename: /run/tls/tls.key}
  clusters:
    - name: gateway
      connect_timeout: 2s
      type: STATIC
      load_assignment:
        cluster_name: gateway
        endpoints:
          - lb_endpoints:
              - endpoint: {address: {socket_address: {address: 127.0.0.1, port_value: 8443}}}
admin:
  access_log_path: /dev/null
  address: {socket_address: {address: 127.0.0.1, port_value: 9901}}
