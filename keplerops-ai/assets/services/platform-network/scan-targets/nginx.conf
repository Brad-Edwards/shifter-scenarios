worker_processes auto;
pid /tmp/nginx.pid;

events {
    worker_connections 128;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    error_log /dev/stderr notice;
    server_tokens on;

    server {
        listen 18080;
        server_name scan-docs.keplerops.lab;
        root /usr/share/nginx/scan-docs;
        index index.html;
        location = /healthz { default_type text/plain; return 200 "ok\n"; }
        location / { try_files $uri $uri/ =404; }
    }

    server {
        listen 18081;
        server_name scan-status.keplerops.lab;
        root /usr/share/nginx/scan-status;
        index index.json;
        location = /healthz { default_type text/plain; return 200 "ok\n"; }
        location / { try_files $uri $uri/ =404; }
    }
}
