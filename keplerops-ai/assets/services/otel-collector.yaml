receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
        tls:
          cert_file: /run/tls/tls.crt
          key_file: /run/tls/tls.key
          client_ca_file: /run/tls/ca.crt
  otlp/company_state:
    protocols:
      http:
        endpoint: 127.0.0.1:4320
processors:
  memory_limiter: {limit_mib: 128, spike_limit_mib: 32, check_interval: 1s}
  batch: {send_batch_size: 512, timeout: 2s}
exporters:
  file/traces:
    path: /var/lib/keplerops-research/otel/traces.jsonl
    format: json
    rotation: {max_megabytes: 32, max_days: 7, max_backups: 16}
  file/logs:
    path: /var/lib/keplerops-research/otel/logs.jsonl
    format: json
    rotation: {max_megabytes: 32, max_days: 7, max_backups: 16}
  file/metrics:
    path: /var/lib/keplerops-research/otel/metrics.jsonl
    format: json
    rotation: {max_megabytes: 16, max_days: 7, max_backups: 8}
  file/company_state:
    path: /var/lib/keplerops-research/company-state/operations.jsonl
    format: json
    rotation: {max_megabytes: 4, max_backups: 1}
service:
  telemetry:
    logs: {level: warn}
  pipelines:
    traces: {receivers: [otlp], processors: [memory_limiter, batch], exporters: [file/traces]}
    logs: {receivers: [otlp], processors: [memory_limiter, batch], exporters: [file/logs]}
    metrics: {receivers: [otlp], processors: [memory_limiter, batch], exporters: [file/metrics]}
    logs/company_state: {receivers: [otlp/company_state], processors: [batch], exporters: [file/company_state]}
