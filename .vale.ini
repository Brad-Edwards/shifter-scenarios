StylesPath = .vale/styles
MinAlertLevel = error
Packages = Google

[*.md]
BasedOnStyles = Google

# Generated release output is machine-owned history rather than hand-written
# prose, so it is not prose-linted when present.
[CHANGELOG.md]
BasedOnStyles =

# Internal design notes and scratch docs are not prose-linted by default. The
# PR workflow still lints changed Markdown everywhere else without requiring a
# one-shot cleanup of the existing corpus.
[docs/_deprecated/**]
BasedOnStyles =

[docs/architecture/**]
BasedOnStyles =

[docs/ctf/**]
BasedOnStyles =

[docs/technical/notes/**]
BasedOnStyles =

[docs/technical/plans/**]
BasedOnStyles =
